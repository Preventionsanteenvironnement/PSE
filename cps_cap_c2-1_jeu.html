<!DOCTYPE html>
<html lang="fr">
<head>
<script src="assets/audio-pause.js?v=2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPS C2.1 — L'escalier vers mon objectif</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f4f7fc;color:#1e293b;line-height:1.6;padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.back{display:inline-block;color:#1d4ed8;text-decoration:none;font-weight:800;font-size:1rem;margin-bottom:10px}
.back:hover{text-decoration:underline}
.prog{position:sticky;top:0;z-index:5;background:#f4f7fc;padding:6px 0 10px}
.prog .label{font-size:.78rem;font-weight:800;color:#1e40af;margin-bottom:4px;text-align:center}
.prog .track{height:10px;background:#dbeafe;border-radius:20px;overflow:hidden}
.prog .track > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1d4ed8,#3b82f6);border-radius:20px;transition:width .4s ease}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 3px 14px rgba(0,0,0,.06);animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hero{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border-radius:20px;padding:26px 20px;text-align:center;margin-bottom:6px}
.hero .ic{font-size:3rem;display:block;margin-bottom:6px}
.hero h1{font-size:1.5rem;font-weight:900}
.hero p{opacity:.95;font-size:.96rem;margin-top:6px}
.txt{font-size:1.12rem;font-weight:600;line-height:1.5;margin:6px 0 12px}
.teach{background:#eff6ff;border-left:6px solid #1d4ed8;border-radius:0 12px 12px 0;padding:12px 14px;font-size:1.04rem;margin-bottom:12px}
.goal{background:#1d4ed8;color:#fff;border-radius:14px;padding:12px 14px;font-weight:800;font-size:1.05rem;text-align:center;margin-bottom:12px}
.q{font-size:1.12rem;font-weight:800;color:#1e40af;margin:6px 0 12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:14px;border:2px solid #bfdbfe;background:#fff;cursor:pointer;font-family:inherit;font-size:1.05rem;font-weight:700;color:#1e293b;transition:.15s}
.opt:hover:not(:disabled){border-color:#1d4ed8;background:#eff6ff}
.opt:disabled{cursor:default}
.opt.ok{border-color:#22c55e;background:#dcfce7;color:#166534}
.opt.no{border-color:#fca5a5;background:#fee2e2;color:#991b1b}
.opt.shake{animation:shake .3s}
.fb{margin-top:14px}
.msg{border-radius:14px;padding:13px 15px;font-weight:700;font-size:1rem;animation:fade .3s}
.msg.good{background:#dcfce7;border:2px solid #86efac;color:#166534}
.msg.bad{background:#fff7ed;border:2px solid #fed7aa;color:#9a3412}
.msg.win{background:#dbeafe;border:2px solid #93c5fd;color:#1e40af}
.btn{display:block;width:100%;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border:none;border-radius:14px;padding:15px;font-size:1.1rem;font-weight:800;cursor:pointer;font-family:inherit;margin-top:12px;text-align:center;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.soft{background:#e0e7ff;color:#3730a3}
.say{float:right;background:#eff6ff;color:#1d4ed8;border:none;border-radius:10px;padding:6px 11px;font-size:.95rem;font-weight:800;cursor:pointer}
.recap{list-style:none;margin:10px 0 0}
.recap li{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 13px;margin-bottom:8px;font-size:.98rem}
.badge{text-align:center;font-size:1.1rem;font-weight:900;color:#1e40af;margin:10px 0}
@media(max-width:600px){.wrap{padding:10px}.card{padding:16px}.txt{font-size:1.05rem}.hero h1{font-size:1.3rem}}
.jimg{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:14px;margin:6px 0 10px;background:#fff}
.jimgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
<link rel="stylesheet" href="assets/acces.css?v=5">
<link rel="stylesheet" href="assets/cps_moi.css?v=20261107">
<script src="assets/acces.js?v=5" defer></script>
<!-- Mesure d'audience anonyme (GoatCounter) : chemin de page seul, sans paramètres -->
<script>window.goatcounter={path:function(){return location.pathname||"/"}};</script>
<script data-goatcounter="https://brahms.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Accueil</a>
  <div data-cps-moi="retour" data-code="C2.1" data-titre="L’escalier vers mon objectif" data-fam="Penser et agir"></div>
  <div class="prog"><div class="label" id="proglabel"></div><div class="track"><i id="progbar"></i></div></div>
  <div id="scene"></div>
</div>
<script src="assets/cps_moi.js?v=20261107"></script>
<script>
(function(){
  var MOI={code:"C2.1", titre:"L’escalier vers mon objectif", fam:"Penser et agir", defi:{"q": "Choisis une seule chose à essayer cette semaine.", "opts": ["Faire la première marche de mon escalier", "Écrire mon objectif avec une date", "Cocher chaque étape faite"]}, duo:{"duree": "10 minutes", "situation": "En classe. Chacun prend l’objectif noté dans « Et moi ? », ou en invente un.", "roleA": "Présente ton objectif et tes trois premières étapes.", "roleB": "Écoute. Dis si chaque étape est une action simple. Propose une étape plus petite si besoin.", "observe": ["A dit exactement ce qu’il veut faire", "Les étapes de A sont dans l’ordre", "B propose une amélioration concrète"]}};
  var scene=document.getElementById('scene');
  var idx=0;
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function speak(t){ try{ if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,'')); u.lang='fr-FR'; u.rate=0.95; speechSynthesis.speak(u);}catch(e){} }
  function go(i){ idx=i; try{speechSynthesis.cancel();}catch(e){} render(); }
  function progress(){ document.getElementById('progbar').style.width=Math.round(idx/(STEPS.length-1)*100)+'%'; document.getElementById('proglabel').textContent='Étape '+(idx+1)+' / '+STEPS.length; }
  function continueBtn(label){ var b=document.createElement('button'); b.className='btn'; b.textContent=label||'Continuer →'; b.onclick=function(){ go(idx+1); }; return b; }

  var STEPS=[
    { type:'intro', text:"Avoir un objectif, c’est bien. L’atteindre, c’est mieux. Le secret : le <strong>découper en étapes</strong> et ne pas lâcher au premier obstacle." },

    { type:'notion',
      teach:"Un grand objectif fait peur. Découpé en <strong>petites étapes</strong>, il devient faisable : on avance pas à pas.",
      q:"Pour atteindre un objectif, le mieux est de…",
      options:[
        {l:"tout faire d’un seul coup",ok:false},
        {l:"le découper en petites étapes",ok:true},
        {l:"attendre d’avoir envie un jour",ok:false}
      ],
      wrong:"Pas tout à fait. Tout d’un coup, c’est décourageant. Attendre l’envie, c’est ne jamais commencer.",
      good:"Exactement. Tu découpes en étapes et tu avances pas à pas." },

    { type:'order',
      intro:"Voici un objectif. Remets les étapes <strong>dans l’ordre</strong> : clique sur la première, puis la suivante…",
      goal:"Objectif : présenter un exposé en classe",
      steps:[
        {l:"M’entraîner à voix haute",pos:4},
        {l:"Choisir mon sujet",pos:1},
        {l:"Présenter le jour J",pos:5},
        {l:"Chercher les informations",pos:2},
        {l:"Préparer mes notes",pos:3}
      ],
      hint:"Pas encore : cherche l’étape qui vient maintenant.",
      done:"Étape après étape, l’objectif devient atteignable." },

    { type:'cases',
      teach:"Sur le chemin, des <strong>obstacles</strong> arrivent. Le bon réflexe : chercher une solution, pas abandonner.",
      q:"Que fais-tu ?",
      items:[
        { text:"Tu cherches des informations, mais tu ne trouves presque rien.",
          options:[
            {l:"J’abandonne l’exposé",good:false,fb:"Abandonner au premier obstacle, c’est renoncer trop tôt."},
            {l:"Je demande au prof où chercher",good:true,fb:"Oui : un obstacle se contourne avec de l’aide."},
            {l:"Je recopie n’importe quoi",good:false,fb:"Bâcler ne te fait pas avancer vers l’objectif."}
          ] },
        { text:"À deux jours du jour J, le stress monte.",
          options:[
            {l:"Je m’entraîne, une partie à la fois",good:true,fb:"Oui : tu découpes encore, et t’entraîner fait baisser le stress."},
            {l:"Je n’y pense plus, on verra",good:false,fb:"Éviter laisse le stress entier et la préparation incomplète."},
            {l:"Je prévois d’être absent ce jour-là",good:false,fb:"Fuir repousse le problème sans le régler."}
          ] }
      ] },

    { type:'cases',
      teach:"Pour <strong>tenir jusqu’au bout</strong>, tu remarques tes progrès et tu gardes ton « pourquoi » en tête.",
      q:"Qu’est-ce qui aide le plus à continuer ?",
      items:[
        { text:"Tu as encore plusieurs étapes devant toi.",
          options:[
            {l:"Me dire que je n’y arriverai jamais",good:false,fb:"Cette pensée décourage : c’est un avis, pas un fait."},
            {l:"Me comparer sans cesse aux meilleurs",good:false,fb:"Se comparer démotive. Regarde plutôt tes propres progrès."},
            {l:"Cocher chaque étape finie",good:true,fb:"Oui : voir ses progrès donne de l’élan pour la suite."}
          ] }
      ] },

    { type:'moi', spec:{"tag": "Et moi ?", "title": "Mon escalier", "intro": "Pense à un objectif qui compte pour toi. Tu n’as pas à le montrer.", "steps": [{"kind": "texte", "q": "Écris ton objectif en une phrase.", "carnet": "Mon objectif", "aide": "Exemple : je finis ma fiche de stage avant vendredi.", "criteres": ["Je sais exactement quoi faire", "Il y a une date ou un moment"]}, {"kind": "texte", "q": "Écris les trois premières marches de ton escalier.", "carnet": "Mes trois premières étapes", "lignes": 4, "aide": "1. … 2. … 3. …", "etiquettes": ["1.", "2.", "3.", "ce soir", "demain", "cette semaine"], "criteres": ["Chaque étape est une action simple", "Les étapes sont dans l’ordre"]}, {"kind": "choix", "q": "Quel obstacle peut arriver ?", "carnet": "Un obstacle possible", "opts": ["La fatigue", "Le téléphone", "Le manque de temps", "Je ne sais pas comment faire", "Le découragement"], "autre": true}, {"kind": "choix", "q": "Que feras-tu face à cet obstacle ?", "carnet": "Ma solution face à l’obstacle", "opts": ["Je fais une étape plus petite", "Je demande de l’aide", "Je range ce qui me distrait", "Je me rappelle pourquoi je le fais"], "autre": true}], "fin": "Garde ton escalier sous les yeux. Coche chaque marche franchie."} },

    { type:'bilan',
      recap:[
        "Je découpe mon objectif en <strong>petites étapes</strong>.",
        "Face à un obstacle, je <strong>cherche une solution</strong> au lieu d’abandonner.",
        "Je remarque mes <strong>progrès</strong> et je garde mon « pourquoi » en tête."
      ] }
  ];
  function render(){
    var s=STEPS[idx]; progress(); window.scrollTo({top:0,behavior:'smooth'});

    if(s.type==='intro'){
      scene.innerHTML='<div class="hero"><span class="ic"></span><h1>L’escalier vers mon objectif</h1><p>Compétence C2.1</p></div><div class="card"><p class="txt">'+s.text+'</p></div>';
      var b=document.createElement('button'); b.className='btn'; b.textContent='Commencer'; b.onclick=function(){ go(idx+1); }; scene.querySelector('.card').appendChild(b); return;
    }

    if(s.type==='notion'){
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div class="opts"></div><div class="fb"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach+' '+s.q); };
      var opts=scene.querySelector('.opts'), fb=scene.querySelector('.fb'), done=false;
      shuffle(s.options).forEach(function(o){
        var b=document.createElement('button'); b.className='opt'; b.textContent=o.l;
        b.onclick=function(){
          if(done)return;
          if(o.ok){ done=true; opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); b.classList.add('ok'); fb.innerHTML='<div class="msg good">✓ '+s.good+'</div>'; fb.appendChild(continueBtn()); }
          else { b.classList.add('no'); b.disabled=true; fb.innerHTML='<div class="msg bad">'+s.wrong+' <strong>Réessaie.</strong></div>'; }
        };
        opts.appendChild(b);
      });
      return;
    }

    if(s.type==='order'){
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="goal">'+s.goal+'</div><p class="txt" style="font-weight:600;font-size:1rem">'+s.intro+'</p><div class="opts" id="ord"></div><div class="fb"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.goal+'. '+s.intro); };
      var ord=scene.querySelector('#ord'), fb=scene.querySelector('.fb'), expected=1;
      shuffle(s.steps).forEach(function(st){
        var b=document.createElement('button'); b.className='opt'; b.textContent=st.l;
        b.onclick=function(){
          if(b.disabled)return;
          if(st.pos===expected){ b.classList.add('ok'); b.disabled=true; b.textContent=expected+'. '+st.l; expected++;
            if(expected>s.steps.length){ fb.innerHTML='<div class="msg win">'+s.done+'</div>'; fb.appendChild(continueBtn()); }
          } else {
            b.classList.add('shake'); setTimeout(function(){ b.classList.remove('shake'); },350);
            fb.innerHTML='<div class="msg bad">'+s.hint+'</div>';
          }
        };
        ord.appendChild(b);
      });
      return;
    }

    if(s.type==='cases'){
      var j=0;
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div id="cc"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach); };
      var area=scene.querySelector('#cc');
      function drawCase(){
        var it=s.items[j];
        area.innerHTML=(it.img?'<img class="jimg" src="'+it.img+'" alt="'+(it.alt||'')+'">':'')+'<p class="txt">'+it.text+'</p><div class="opts"></div><div class="fb"></div>';
        var opts=area.querySelector('.opts'), fb=area.querySelector('.fb'), done=false;
        shuffle(it.options).forEach(function(o){
          var b=document.createElement('button'); b.className='opt'; b.textContent=o.l;
          b.onclick=function(){
            if(done)return;
            if(o.good){ done=true; opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); b.classList.add('ok'); fb.innerHTML='<div class="msg good">✓ '+o.fb+'</div>'; var nb=document.createElement('button'); nb.className='btn'; nb.textContent=(j>=s.items.length-1)?'Continuer →':'Suivant →'; nb.onclick=function(){ if(j>=s.items.length-1){ go(idx+1);} else {j++; drawCase();} }; fb.appendChild(nb); }
            else { b.classList.add('no'); b.disabled=true; fb.innerHTML='<div class="msg bad">'+o.fb+' <strong>Réessaie.</strong></div>'; }
          };
          opts.appendChild(b);
        });
      }
      drawCase();
      return;
    }

    if(s.type==='moi'){
      scene.innerHTML='<div class="moi-zone"></div>';
      var mz=scene.querySelector('.moi-zone');
      if(window.CPSMoi){ CPSMoi.sequence(mz, s.spec, {code:MOI.code, titre:MOI.titre, fam:MOI.fam, next:function(){ go(idx+1); }, nextLabel:'Continuer →'}); }
      else { var mb=document.createElement('button'); mb.className='btn'; mb.textContent='Continuer →'; mb.onclick=function(){ go(idx+1); }; mz.appendChild(mb); }
      return;
    }

    if(s.type==='bilan'){
      var h='<div class="hero"><span class="ic"></span><h1>Fin de l’activité</h1><p>Avancer pas à pas vers un objectif.</p></div><div class="card"><div class="badge">Pas à pas</div><p class="txt" style="font-size:1rem;font-weight:800;color:#1e40af">Ce que tu as appris :</p><ul class="recap">';
      s.recap.forEach(function(r){ h+='<li>'+r+'</li>'; });
      h+='</ul></div>';
      scene.innerHTML=h;
      var c=scene.querySelector('.card');
      if(window.CPSMoi){ var fz=document.createElement('div'); c.appendChild(fz); CPSMoi.defi(fz, MOI.defi, MOI); CPSMoi.duo(fz, MOI.duo); }
      var rb=document.createElement('button'); rb.className='btn'; rb.textContent='Recommencer'; rb.onclick=function(){ go(0); }; c.appendChild(rb);
      var hb=document.createElement('a'); hb.className='btn soft'; hb.href='index.html'; hb.textContent='← Retour à l’accueil'; c.appendChild(hb);
      return;
    }
  }
  render();
})();
</script>
</body>
</html>
