ement considéré comme accident du travail […] l’accident survenu à un travailleur […], pendant le trajet d’aller et de retour, entre :\n1°) la résidence principale […] et le lieu du travail. Ce trajet peut ne pas être le plus direct lorsque le détour effectué est rendu nécessaire dans le cadre d’un covoiturage régulier ;\n2°) le lieu du travail et le restaurant, la cantine […], et dans la mesure où le parcours n’a pas été interrompu ou détourné pour un motif dicté par l’intérêt personnel et étranger aux nécessités essentielles de la vie courante ou indépendant de l’emploi. »\n**Service-Public.fr** — « Un accident du travail est un événement soudain survenu par le fait ou à l’occasion du travail entraînant une lésion physique et/ou psychologique. »\n*Personnes visées à l’article L. 311-2, notamment les salariés.", "source": "Code de la sécurité sociale, articles L. 411-1 et L. 411-2 (extraits) ; Service-Public.fr, fiche F178.", "date_consultation": "2026-10-26"}}, {"id": "bc1_ch4", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 3 :", "reponse_attendue": ""}}, {"id": "bc1_q41", "type": "cocher_exactes", "data": {"competence": "C1", "numero": "1.1", "consigne": "**Identifier** les quatre critères d’un accident du travail, en cochant quatre propositions.", "items": [{"texte": "La victime est salariée", "correct": true}, {"texte": "La victime a plus de 25 ans", "correct": false}, {"texte": "L’événement est soudain", "correct": true}, {"texte": "Il survient par le fait ou à l’occasion du travail", "correct": true}, {"texte": "La victime est hospitalisée", "correct": false}, {"texte": "Il entraîne une lésion physique ou psychologique", "correct": true}]}, "el": {"standard": {"indice": "DOC. 3 : l’article L. 411-1 et la phrase de Service-Public.fr ; la note sur l’article L. 311-2.", "explication": "Quatre critères : la victime est salariée, l’événement est soudain, il survient par le fait ou à l’occasion du travail, il entraîne une lésion physique ou psychologique. L’âge et l’hospitalisation ne sont pas des critères."}}}, {"id": "bc1_q42", "type": "classer", "data": {"competence": "C1", "numero": "1.2", "titre": "", "consigne": "**Classer** chaque accident en écrivant sa catégorie dans le tableau.", "categories": ["Accident du travail", "Accident de trajet", "Accident de droit commun*"], "items": ["Une vendeuse se coupe avec un cutter en ouvrant un carton du magasin.", "Un électricien chute de vélo en allant de chez lui au chantier.", "Une secrétaire se casse le bras au ski, pendant ses vacances.", "Un cuisinier se brûle avec une casserole pendant le service.", "Une comptable se blesse en faisant du jardinage chez elle, un dimanche."], "classement": [0, 1, 2, 0, 2], "indice": "", "variantes": {"adapte": {"indice": "Pour chaque accident, chercher s’il arrive pendant le travail, sur le trajet habituel, ou en dehors des deux."}, "essentiel": {"indice": "Pour chaque accident, chercher où il a lieu : au travail, sur le trajet habituel, ou ailleurs."}}}, "el": {"standard": {"indice": "DOC. 3 : l’article L. 411-1 (le travail) et l’article L. 411-2 (le trajet) ; la note sous l’exercice pour l’accident de droit commun.", "explication": "Accidents du travail : la vendeuse au cutter et le cuisinier brûlé pendant le service. Accident de trajet : l’électricien entre chez lui et le chantier. Accidents de droit commun : la secrétaire au ski et la comptable au jardinage, dans la vie privée."}, "essentiel": {"indice": "Pour chaque accident : au travail, sur le trajet habituel, ou ailleurs.", "explication": "Au travail : la vendeuse et le cuisinier. Sur le trajet : l’électricien. Dans la vie privée (droit commun) : la secrétaire et la comptable."}}}, {"type": "texte_libre", "id": "bc1_q42_note", "data": {"texte": "*Accident de droit commun : accident qui n’est ni un accident du travail ni un accident de trajet, par exemple un accident de la vie privée."}}, {"id": "bc1_analyse5", "type": "analyse", "data": {"titre": "LA MALADIE PROFESSIONNELLE"}}, {"id": "bc1_doc4", "type": "document", "data": {"label": "DOC. 4", "titre": "La maladie professionnelle et le tableau n° 98", "cadre": true, "corps": "**Article L. 461-1** — « […] Est présumée d’origine professionnelle toute maladie désignée dans un tableau de maladies professionnelles et contractée dans les conditions mentionnées à ce tableau. […] »\n**INRS** — « Une maladie est dite professionnelle si elle est la conséquence directe de l’exposition d’un travailleur à un risque physique, chimique ou biologique, ou résulte des conditions dans lesquelles il exerce son activité professionnelle et si elle figure dans un des tableaux du régime général ou agricole de la Sécurité sociale. »\n*Délai de prise en charge (tableau n° 98 ci-dessous) : délai maximal entre la fin de l’exposition au risque et la constatation de la maladie.", "source": "Code de la sécurité sociale, article L. 461-1 (extrait) ; INRS, « Tableaux des maladies professionnelles » ; INRS, tableau n° 98 du régime général (extrait).", "date_consultation": "2026-10-26"}}, {"id": "bc1_doc4_tab", "type": "tableau", "data": {"titre": "Tableau n° 98 — Affections chroniques du rachis lombaire provoquées par la manutention manuelle de charges lourdes (extrait)", "cells": [[{"type": "prof", "content": "Désignation de la maladie"}, {"type": "prof", "content": "Délai de prise en charge"}, {"type": "prof", "content": "Liste limitative des travaux susceptibles de provoquer ces maladies"}], [{"type": "prof", "content": "Sciatique par hernie discale L4-L5 ou L5-S1 avec atteinte radiculaire de topographie concordante.\n[…]"}, {"type": "prof", "content": "6 mois (sous réserve d’une durée d’exposition de 5 ans)*."}, {"type": "prof", "content": "Travaux de manutention manuelle habituelle de charges lourdes effectués :\n– dans le fret routier, maritime, ferroviaire, aérien ;\n[…]\n– dans le chargement et le déchargement en cours de fabrication, dans la livraison, […] le stockage et la répartition des produits industriels et alimentaires, agricoles et forestiers ;\n[…]"}]], "table_preset": "sobre", "table_border": "fine", "table_row_height": "compact", "table_col_widths": [30, 22, 48]}}, {"type": "document", "id": "bc1_cas_yoann", "data": {"label": "DOC. 5", "titre": "Le cas de Yoann", "cadre": true, "corps": "Yoann, 45 ans, travaille depuis vingt ans comme agent de quai dans la même entreprise que Philippe. Chaque jour depuis vingt ans, il décharge à la main des colis lourds. Depuis plusieurs années, il souffre du bas du dos. Le médecin constate une sciatique par hernie discale L5-S1 avec atteinte radiculaire de topographie concordante, alors que Yoann porte encore ces charges.", "source": "", "date_consultation": "2026-10-26"}}, {"id": "bc1_ch5", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir des documents 4 et 5 :", "reponse_attendue": ""}}, {"id": "bc1_q51", "type": "sous_question", "data": {"competence": "C2", "numero": "2.1", "texte": "**Comparer** le cas de Yoann à chaque condition du tableau n° 98, en complétant le tableau.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "", "indice": "", "reponse_allegee": "", "variantes": {"essentiel": {"texte": "**Comparer** le cas de Yoann à chaque condition du tableau n° 98, en cochant la proposition exacte dans chaque ligne."}}}, "el": {"standard": {"indice": "DOC. 4 : les trois colonnes du tableau n° 98 et la note sur le délai ; DOC. 5 : le métier, la durée, la maladie de Yoann.", "explication": "Maladie : sciatique par hernie discale L5-S1, désignée au tableau. Délai : maladie constatée pendant l’exposition. Durée : vingt ans, plus que 5 ans. Travaux : déchargement de colis lourds à la main, dans le transport. Les quatre conditions sont remplies."}, "essentiel": {"indice": "DOC. 5 : Yoann porte encore les charges, depuis vingt ans, dans le transport.", "explication": "Toutes les conditions sont remplies : maladie constatée pendant l’exposition, vingt ans de port de charges (plus de 5 ans), déchargement de colis lourds à la main dans le transport."}}}, {"id": "bc1_q51_tab", "type": "tableau", "data": {"titre": "", "cells": [[{"type": "prof", "content": "La condition du tableau n° 98"}, {"type": "prof", "content": "Dans le cas de Yoann"}, {"type": "prof", "content": "Condition remplie : oui ou non"}], [{"type": "prof", "content": "La maladie désignée"}, {"type": "eleve", "content": "", "reponse": "Sciatique par hernie discale L5-S1."}, {"type": "eleve", "content": "", "reponse": "Oui."}], [{"type": "prof", "content": "Le délai de prise en charge (6 mois)"}, {"type": "eleve", "content": "", "reponse": "Maladie constatée pendant l’exposition."}, {"type": "eleve", "content": "", "reponse": "Oui."}], [{"type": "prof", "content": "La durée d’exposition (5 ans)"}, {"type": "eleve", "content": "", "reponse": "Vingt ans de port de charges."}, {"type": "eleve", "content": "", "reponse": "Oui."}], [{"type": "prof", "content": "Les travaux"}, {"type": "eleve", "content": "", "reponse": "Déchargement de colis lourds à la main, dans le transport."}, {"type": "eleve", "content": "", "reponse": "Oui."}]], "table_preset": "pse", "table_border": "fine", "table_row_height": "compact", "table_col_widths": [34, 44, 22], "table_student_style": "lines", "variantes": {"adapte": {"cells": [[{"type": "prof", "content": "La condition du tableau n° 98"}, {"type": "prof", "content": "Dans le cas de Yoann"}, {"type": "prof", "content": "Condition remplie : oui ou non"}], [{"type": "prof", "content": "La maladie désignée"}, {"type": "prof", "content": "Sciatique par hernie discale L5-S1."}, {"type": "prof", "content": "Oui."}], [{"type": "prof", "content": "Le délai de prise en charge (6 mois)"}, {"type": "eleve", "content": "", "reponse": "Maladie constatée pendant l’exposition."}, {"type": "eleve", "content": "", "reponse": "Oui."}], [{"type": "prof", "content": "La durée d’exposition (5 ans)"}, {"type": "eleve", "content" l, article L. 4122-1** — « Conformément aux instructions qui lui sont données par l’employeur, […] il incombe à chaque travailleur de prendre soin, en fonction de sa formation et selon ses possibilités, de sa santé et de sa sécurité ainsi que de celles des autres personnes concernées par ses actes ou ses omissions au travail. […] »\n**Code de la sécurité sociale, article L. 452-1** — « Lorsque l’accident est dû à la faute inexcusable de l’employeur […], la victime ou ses ayants droit ont droit à une indemnisation complémentaire […]. »", "source": "Code du travail, articles L. 4121-1, L. 4121-2, R. 4311-8 et L. 4122-1 ; Code de la sécurité sociale, article L. 452-1 (extraits).", "date_consultation": "2026-10-26"}}, {"id": "bc1_ch6", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 6 :", "reponse_attendue": ""}}, {"id": "bc1_q61", "type": "classer", "data": {"competence": "C1", "numero": "1.1", "titre": "", "consigne": "**Indiquer** qui doit faire chaque action, l’employeur ou le travailleur,.", "categories": ["L’employeur", "Le travailleur"], "items": ["Mener des actions de prévention des risques", "Suivre les instructions de l’employeur", "Donner la priorité à la protection collective", "Prendre soin de la sécurité des autres personnes", "Mettre en place des moyens adaptés", "Prendre soin de sa propre santé"], "classement": [0, 1, 0, 1, 0, 1], "indice": "", "variantes": {"adapte": {"indice": "Chercher qui est nommé au début de chaque article : l’employeur ou le travailleur."}, "essentiel": {"indice": "L. 4121-1 : l’employeur ; L. 4122-1 : le travailleur."}}}, "el": {"standard": {"indice": "DOC. 6 : les articles L. 4121-1 et L. 4121-2 parlent de l’employeur ; l’article L. 4122-1 parle du travailleur.", "explication": "L’employeur : actions de prévention des risques, priorité à la protection collective, moyens adaptés. Le travailleur : suivre les instructions de l’employeur, prendre soin de la sécurité des autres et de sa propre santé."}, "essentiel": {"indice": "L. 4121-1 et L. 4121-2 : l’employeur ; L. 4122-1 : le travailleur.", "explication": "L’employeur : prévention, protection collective, moyens adaptés. Le travailleur : instructions, sécurité des autres, sa propre santé."}}}, {"id": "bc1_q62", "type": "sous_question", "data": {"competence": "C1", "numero": "1.2", "texte": "**Indiquer** le droit de la victime quand l’accident est dû à la faute inexcusable de l’employeur.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Une indemnisation complémentaire.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte", "essentiel"], "variantes": {"adapte": {"texte": "**Compléter** la phrase sur la faute inexcusable de l’employeur.\nLa victime a droit à une ……………………… complémentaire.", "lignes": 0, "reponse_allegee": "La victime a droit à une {{indemnisation}} complémentaire.", "reponse_attendue": "indemnisation"}, "essentiel": {"texte": "**Compléter** la phrase sur la faute inexcusable de l’employeur.\nMots proposés : indemnisation – sanction.\nEn cas de faute inexcusable de l’employeur, la victime a droit à une ……………………… complémentaire.", "lignes": 0, "reponse_attendue": "indemnisation"}}}, "el": {"standard": {"indice": "DOC. 6 : l’article L. 452-1 du Code de la sécurité sociale.", "explication": "En cas de faute inexcusable de l’employeur, la victime a droit à une indemnisation complémentaire."}, "adapte": {"indice": "DOC. 6 : le dernier article, L. 452-1.", "explication": "La victime a droit à une indemnisation complémentaire.", "trous": ["indemnisation|indemnisations"]}, "essentiel": {"indice": "DOC. 6 : le dernier article.", "explication": "Une indemnisation complémentaire. Le mot « sanction » ne convient pas.", "trous": ["indemnisation|indemnisations"]}}}, {"id": "bc1_analyse7", "type": "analyse", "data": {"titre": "LE DROIT D’ALERTE ET DE RETRAIT"}}, {"id": "bc1_doc6", "type": "document_texte_image", "data": {"label": "DOC. 7", e sécurité et, le cas échéant, celle des autres personnes travaillant dans l’établissement.\nElle porte sur :\n1° Les conditions de circulation dans l’entreprise ;\n2° Les conditions d’exécution du travail ;\n3° La conduite à tenir en cas d’accident ou de sinistre. »\n**Delagrave** — « […] la formation PRAP (prévention des risques liés à l’activité physique) a notamment pour objectif d’acquérir des techniques de manutention mobilisant les principes de sécurité physique et d’économie d’effort. »", "source": "Code du travail, articles L. 4141-2 et R. 4141-3 (extraits) ; Delagrave, PSE Bac Pro, 2024.", "date_consultation": "2026-10-26"}}, {"id": "bc1_ch8", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 8 :", "reponse_attendue": ""}}, {"id": "bc1_q81", "type": "sous_question", "data": {"competence": "C1", "numero": "1.1", "texte": "**Relever** les trois contenus de la formation à la sécurité.", "points": "", "lignes": 3, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Les conditions de circulation dans l’entreprise.\n– Les conditions d’exécution du travail.\n– La conduite à tenir en cas d’accident ou de sinistre.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1, "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"reponse_allegee": "– Les conditions de {{circulation}} dans l’entreprise.\n– Les conditions d’{{exécution}} du travail.\n– La conduite à tenir en cas d’{{accident}} ou de sinistre.", "texte": "**Compléter** les phrases pour relever les trois contenus de la formation à la sécurité.\n– Les conditions de ……………………… dans l’entreprise.\n– Les conditions d’……………………… du travail.\n– La conduite à tenir en cas d’……………………… ou de sinistre.", "lignes": 0, "reponse_attendue": "circulation · exécution · accident"}}}, "el": {"standard": {"indice": "DOC. 8 : l’article R. 4141-3, la liste « Elle porte sur ».", "explication": "Trois contenus : les conditions de circulation dans l’entreprise,
