<script>window.COURS = {"slug":"bcp_1ere_A8","classe":"Première Bac Pro","retour":"index.html#1re-a8","pied":"Module A8 — Première Bac Pro. Prévention, santé, environnement — M. MECHERI. Situations construites pour le cours ; sources indiquées sous chaque document.","version":"3.3","entete":{"module_code":"A8","titre":"Le stress au quotidien","niveau":"Première Bac Pro","annee":"2026-27","thematique":"A — L'individu responsable de son capital santé","objectif_general":"Être capable de gérer le stress au quotidien."},"blocks":[{"id":"a8_s1","type":"seance","data":{"numero":"1","titre":"Le stress et ses facteurs","objectif":"Être capable de présenter les caractéristiques du stress.","competences":["C1","C2","C3"]}},{"id":"a8_situation","type":"situation","data":{"texte":"**Nolan, 17 ans, une période chargée**\nNolan est en première bac pro maintenance des véhicules. Depuis six semaines, il enchaîne les évaluations et une période de formation en milieu professionnel dans un garage. Il se lève à 5 h 45 et rentre chez lui vers 19 h.\nLe matin de son oral, son cœur battait vite, ses mains étaient moites et il avait la gorge serrée. L'oral s'est finalement bien passé.\nMais depuis plusieurs semaines, quelque chose a changé. Nolan dort mal et se réveille la nuit. Il a souvent mal au ventre. Il s'énerve pour des détails, n'arrive plus à se concentrer en cours et a arrêté le football qu'il pratiquait le mercredi. Dans le garage, il craint de commettre une erreur devant son tuteur.\nNolan se demande ce qui lui arrive et comment tenir jusqu'aux vacances.","source":""}},{"id":"a8_analyse_s1","type":"analyse","data":{"titre":"ANALYSER LA SITUATION"}},{"id":"a8_s1_ch1","type":"question_chapeau","data":{"numero":"1","texte":"À partir de la situation :","reponse_attendue":""}},{"id":"a8_s1_q11","type":"sous_question","data":{"competence":"C2","numero":"1.1","texte":"**Formuler** le problème posé par la situation.","lignes":2,"style_lignes":"tiret_guide","support_type":"","reponse_attendue":"Nolan doit trouver comment gérer un stress qui dure depuis six semaines et qui abîme son sommeil, sa concentration et son humeur.","indice":"Le problème ne porte pas sur une journée difficile, mais sur ce qui dure depuis plusieurs semaines.","variantes":{"adapte":{"texte":"**Identifier** le problème posé par la situation, en cochant la proposition exacte.\n☐ Nolan doit trouver une formation moins exigeante.\n☐ Nolan doit apprendre à gérer un stress qui dure depuis six semaines.\n☐ Nolan doit changer de garage pour sa période de formation.","lignes":0,"style_lignes":"pointilles","reponse_attendue":"Nolan doit apprendre à gérer un stress qui dure depuis six semaines.","indice":"Le problème ne porte pas sur une journée difficile, mais sur ce qui dure."},"essentiel":{"texte":"**Identifier** le problème posé par la situation, en cochant la proposition exacte.\n☐ Nolan doit trouver une formation moins exigeante.\n☐ Nolan doit apprendre à gérer un stress qui dure depuis six semaines.\n☐ Nolan doit changer de garage pour sa période de formation.","lignes":0,"style_lignes":"pointilles","reponse_attendue":"Nolan doit apprendre à gérer un stress qui dure depuis six semaines.","indice":"Le problème ne porte pas sur une journée difficile, mais sur ce qui dure."}}},"el":{"standard":{"indice":"Le problème ne porte pas sur une journée difficile, mais sur ce qui dure depuis plusieurs semaines.","explication":"Le matin de l'oral, les signes disparaissent une fois l'épreuve passée. Depuis six semaines, en revanche, Nolan dort mal, s'énerve et ne se concentre plus : le problème est donc de **gérer un stress qui dure** et qui abîme son sommeil, sa concentration et son humeur."},"adapte":{"indice":"Le problème ne porte pas sur une journée difficile, mais sur ce qui dure.","explication":"Seule la deuxième proposition correspond à ce que vit Nolan depuis six semaines : un stress qui dure. Changer de formation ou de garage ne figure pas dans la situation et ne règle pas ce stress.","choix_corrects":[1]},"essentiel":{"indice":"Chercher la proposition qui parle de ce qui dure depuis six semaines.","explication":"La deuxième proposition est juste : Nolan vit un stress qui dure depuis six semaines. Les deux autres propositions ne parlent pas de ce stress.","choix_corrects":[1]}}},{"id":"a8_s1_q12","type":"sous_question","data":{"competence":"C1","numero":"1.2","texte":"**Relever** les manifestations du stress observées chez Nolan, en complétant le tableau.","lignes":0,"style_lignes":"","support_type":"","reponse_attendue":"Manifestations physiques : Cœur qui bat vite, mains moites, gorge serrée, maux de ventre, sommeil perturbé. • Manifestations émotionnelles : Il s'énerve pour des détails et craint de commettre une erreur. • Manifestations intellectuelles : Il n'arrive plus à se concentrer en cours. • Manifestations comportementales : Il a arrêté le football qu'il pratiquait le mercredi.","indice":"Ordre de lecture : le matin de l'oral, puis les semaines suivantes.","variantes":{"adapte":{},"essentiel":{}}},"el":{"standard":{"indice":"Classer chaque signe de Nolan selon qu'il touche le corps, les émotions, la réflexion ou ce qu'il fait.","explication":"Le cœur rapide, les mains moites, la gorge serrée et les maux de ventre sont ressentis par le corps. S'énerver et craindre l'erreur sont des émotions ; ne plus se concentrer touche la réflexion ; arrêter le football est un changement de comportement. Le sommeil perturbé peut se placer dans le corps ou dans les comportements."},"adapte":{"indice":"La ligne des manifestations physiques est déjà remplie : chercher dans la situation les émotions, la réflexion et l'activité que Nolan a cessée.","explication":"S'énerver pour des détails et craindre une erreur sont des émotions. Ne plus arriver à se concentrer touche la réflexion. Arrêter le football est un changement de comportement."},"essentiel":{"indice":"Une ligne concerne la concentration en cours, l'autre une activité que Nolan a arrêtée.","explication":"Ne plus se concentrer en cours touche la réflexion : c'est une manifestation intellectuelle. Arrêter le football change ce que Nolan fait : c'est une manifestation comportementale."}}},{"id":"a8_s1_q12_tab","type":"tableau","data":{"titre":"","table_student_style":"lines","cells":[[{"type":"prof","content":"Type de manifestation"},{"type":"prof","content":"Ce que vit Nolan"}],[{"type":"prof","content":"Manifestations physiques\n*ce que ressent le corps*"},{"type":"eleve","content":"","reponse":"Cœur qui bat vite, mains moites, gorge serrée, maux de ventre, sommeil perturbé."}],[{"type":"prof","content":"Manifestations émotionnelles\n*les émotions ressenties*"},{"type":"eleve","content":"","reponse":"Il s'énerve pour des détails et craint de commettre une erreur."}],[{"type":"prof","content":"Manifestations intellectuelles\n*l'attention, la mémoire, la réflexion*"},{"type":"eleve","content":"","reponse":"Il n'arrive plus à se concentrer en cours."}],[{"type":"prof","content":"Manifestations comportementales\n*ce que la personne fait ou cesse de faire*"},{"type":"eleve","content":"","reponse":"Il a arrêté le football qu'il pratiquait le mercredi."}]],"variantes":{"adapte":{"cells":[[{"type":"prof","content":"Type de manifestation"},{"type":"prof","content":"Ce que vit Nolan"}],[{"type":"prof","content":"Manifestations physiques\n*ce que ressent le corps*"},{"type":"prof","content":"Cœur qui bat vite, mains moites, gorge serrée, maux de ventre, sommeil perturbé."}],[{"type":"prof","content":"Manifestations émotionnelles\n*les émotions ressenties*"},{"type":"eleve","content":"","reponse":"Il s'énerve pour des détails et craint de commettre une erreur."}],[{"type":"prof","content":"Manifestations intellectuelles\n*l'attention, la mémoire, la réflexion*"},{"type":"eleve","content":"","reponse":"Il n'arrive plus à se concentrer en cours."}],[{"type":"prof","content":"Manifestations comportementales\n*ce que la personne fait ou cesse de faire*"},{"type":"eleve","content":"","reponse":"Il a arrêté le football qu'il pratiquait le mercredi."}]]},"essentiel":{"cells":[[{"type":"prof","content":"Type de manifestation"},{"type":"prof","content":"Ce que vit Nolan"}],[{"type":"prof","content":"Manifestations physiques\n*ce que ressent le corps*"},{"type":"prof","content":"Cœur qui bat vite, mains moites, gorge serrée, maux de ventre, sommeil perturbé."}],[{"type":"prof","content":"Manifestations émotionnelles\n*les émotions ressenties*"},{"type":"prof","content":"Il s'énerve pour des détails et craint de commettre une erreur."}],[{"type":"prof","content":"Manifestations intellectuelles\n*l'attention, la mémoire, la réflexion*"},{"type":"eleve","content":"","reponse":"Il n'arrive plus à se concentrer en cours."}],[{"type":"prof","content":"Manifestations comportementales\n*ce que la personne fait ou cesse de faire*"},{"type":"eleve","content":"","reponse":"Il a arrêté le football qu'il pratiquait le mercredi."}]]}}}},{"id":"a8_doc1","type":"document_texte_image","data":{"label":"DOC. 1","titre":"Qu'est-ce que le stress ?","corps":"Le **stress** est une réaction normale de l'organisme. Il survient lorsqu'une personne ressent un **déséquilibre** entre les contraintes que lui impose une situation et les **ressources** dont elle dispose pour y faire face.\nLes contraintes sont ce que la situation exige : un délai, une évaluation, une tâche nouvelle, un regard extérieur. Les ressources sont ce sur quoi la personne peut s'appuyer : ses connaissances, son expérience, son temps, son sommeil, l'aide de son entourage.\nTant que les ressources suffisent, la personne s'**adapte** : l'organisme se mobilise, puis revient à son état normal. C'est ce que l'on appelle l'adaptation.\nLorsque les contraintes dépassent durablement les ressources, l'organisme reste mobilisé en permanence. L'état de stress n'est pas une maladie, mais lorsqu'il est intense et qu'il dure, il peut avoir des effets sur la santé physique et mentale.\nLe stress se manifeste de plusieurs manières : dans le corps, dans les émotions, dans la façon de réfléchir et dans les comportements.","source":"D'après l'Institut national de recherche et de sécurité, dossier « Stress au travail », texte reformulé.","img":"bcp_1ere_A8/images/stress_a8-balance-contraintes-ressources.jpg","img_desc":"Schéma en forme de balance à deux plateaux, dont le plateau de gauche penche vers le bas. Le plateau de gauche, intitulé « les contraintes » et bordé de rouge, porte quatre étiquettes : un délai, une évaluation, une tâche nouvelle, le regard des autres. Le plateau de droite, intitulé « les ressources » et bordé de vert, porte quatre étiquettes : les connaissances, l'expérience, le sommeil, l'aide de l'entourage. Sous la balance, une légende indique que le stress apparaît lorsque le plateau des contraintes l'emporte durablement sur celui des ressources.","img_w":1536,"img_h":1024}},{"id":"a8_s1_ch2","type":"question_chapeau","data":{"numero":"2","texte":"À partir du document 1 :","reponse_attendue":""}},{"id":"a8_s1_q21","type":"sous_question","data":{"competence":"C1","numero":"2.1","texte":"**Relever** les deux éléments dont le déséquilibre provoque le stress.","lignes":2,"style_lignes":"tirets_comptage","lignes_par_reponse":1,"support_type":"","reponse_attendue":"Le stress provient d'un déséquilibre entre les contraintes de la situation et les ressources de la personne.","indice":"","variantes":{"essentiel":{"texte":"**Relever** les deux éléments dont le déséquilibre provoque le stress, en cochant deux propositions.\n☐ les contraintes\n☐ la fatigue\n☐ les ressources\n☐ l'expérience","lignes":0},"adapte":{"texte":"**Relever** les deux éléments dont le déséquilibre provoque le stress.\n(Mots proposés : les contraintes — la fatigue — les ressources — l'expérience.)"}}},"el":{"standard":{"indice":"DOC. 1, premier paragraphe : les deux éléments reliés par le mot « déséquilibre ».","explication":"Le DOC. 1 définit le stress comme un déséquilibre entre les **contraintes** (ce que la situation exige) et les **ressources** (ce sur quoi la personne peut s'appuyer). Le stress apparaît quand le plateau des contraintes l'emporte sur celui des ressources."},"adapte":{"indice":"Parmi les mots proposés, deux seulement figurent dans la définition du stress du DOC. 1.","explication":"Le stress naît d'un déséquilibre entre les contraintes et les ressources. L'expérience n'est qu'un exemple de ressource, et la fatigue un élément qui rend plus vulnérable (DOC. 3) : ce ne sont pas les deux plateaux de la balance."},"essentiel":{"indice":"DOC. 1, première phrase : les deux éléments reliés par le mot « déséquilibre ».","explication":"Les deux bonnes réponses sont les contraintes et les ressources : le stress apparaît quand les contraintes l'emportent sur les ressources. L'expérience est un exemple de ressource ; la fatigue n'est pas l'un des deux plateaux de la balance.","choix_corrects":[0,2]}}},{"id":"a8_s1_q22","type":"sous_question","data":{"competence":"C3","numero":"2.2","texte":"**Expliquer** en quoi le stress est d'abord une réaction utile, en rédigeant des phrases complètes.","lignes":4,"style_lignes":"tiret_guide","support_type":"","reponse_attendue":"Le stress mobilise l'organisme pour faire face à une situation exigeante. Il devient un problème seulement lorsqu'il dure et que les ressources ne suffisent plus.","indice":"Comparer l'oral de Nolan, qui s'est bien passé, et les six semaines qui l'ont précédé.","variantes":{"adapte":{"texte":"**Expliquer** en quoi le stress est d'abord une réaction utile, en complétant l'explication ci-dessous.\n« Le stress mobilise l'organisme pour faire face à une situation …………………………………………………………………………………………. Il devient un problème seulement lorsqu'il …………………………………………………………………………………………, et que les ressources ne suffisent plus. »","lignes":0,"style_lignes":"pointilles","reponse_attendue":"Le stress mobilise l'organisme pour faire face à une situation exigeante. Il devient un problème seulement lorsqu'il dure, et que les ressources ne suffisent plus."},"essentiel":{"texte":"**Expliquer** en quoi le stress est d'abord une réaction utile, en complétant l'explication ci-dessous.\n« Le stress mobilise l'organisme pour faire face à une situation …………………………………………………………………………………………. Il devient un problème seulement lorsqu'il …………………………………………………………………………………………, et que les ressources ne suffisent plus. »\n(Mots à utiliser : exigeante, dure.)","lignes":0,"style_lignes":"pointilles","reponse_attendue":"Le stress mobilise l'organisme pour faire face à une situation exigeante. Il devient un problème seulement lorsqu'il dure, et que les ressources ne suffisent plus."}}},"el":{"standard":{"indice":"Situation de Nolan : comparer le matin de l'oral, qui s'est bien passé, et les semaines où les signes durent.","explication":"Face à une situation exigeante, l'organisme se mobilise pour agir, puis revient à son état normal : c'est l'**adaptation** (DOC. 1). Le stress devient un problème seulement lorsque les contraintes dépassent durablement les ressources. L'oral de Nolan illustre ce stress utile ; les semaines suivantes, un stress qui dure."},"adapte":{"indice":"Le premier mot décrit la situation, le second parle du temps.","explication":"Le stress mobilise l'organisme face à une situation **exigeante**, puis l'organisme revient à son état normal. Il devient un problème lorsqu'il **dure** : les ressources ne suffisent plus (DOC. 1).","trous":["exigeante|difficile|nouvelle|stressante","dure|se prolonge|s'installe|dure longtemps"]},"essentiel":{"indice":"Lire la phrase entière avant de choisir : un des deux mots parle du temps qui passe.","explication":"La situation est **exigeante** : l'organisme se mobilise pour y faire face. Le stress devient un problème lorsqu'il **dure** et que les ressources ne suffisent plus.","trous":["exigeante|difficile|nouvelle|stressante","dure|se prolonge|s'installe"]}}},{"id":"a8_doc2","type":"document_image","data":{"label":"DOC. 2","titre":"Les facteurs de stress","source":"D'après des exemples de facteurs de stress décrits par l'INRS.","img":"bcp_1ere_A8/images/stress_a8-facteurs-de-stress.jpg","img_desc":"Infographie sans texte de commentaire, composée de quatre encadrés disposés en deux rangées. Chaque encadré porte un titre en bandeau et une série de pictogrammes légendés. Encadré « les études » : les évaluations, les résultats, l'orientation, la charge de travail. Encadré « le travail » : une tâche nouvelle, un délai court, la peur de l'erreur, le regard des autres, le manque de consignes claires. Encadré « la vie personnelle » : un conflit, un déménagement, une difficulté familiale, l'argent. Encadré « les conditions de vie » : le manque de sommeil, les trajets longs, le bruit, le manque de temps libre.","img_w":1582,"img_h":994}},{"id":"a8_s1_ch3","type":"question_chapeau","data":{"numero":"3","texte":"À partir du document 2 :","reponse_attendue":""}},{"id":"a8_s1_q31","type":"sous_question","data":{"competence":"C1","numero":"3.1","texte":"**Classer** les facteurs de stress de Nolan selon leur origine, en complétant le tableau.","lignes":0,"style_lignes":"","support_type":"","reponse_attendue":"Les évaluations qui s'enchaînent : Les études • La crainte de commettre une erreur devant son tuteur : Le travail • Le lever à 5 h 45 et le retour à 19 h : Les conditions de vie • Le manque de sommeil : Les conditions de vie","indice":"Se demander, pour chaque facteur, s'il vient du lycée, du garage, de la vie personnelle ou du rythme de vie.","variantes":{"adapte":{},"essentiel":{"indice":"Pour chaque facteur, se demander s'il vient du travail ou des conditions de vie."}}},"el":{"standard":{"indice":"Pour chaque facteur, se demander s'il vient du lycée, du garage, de la vie personnelle ou du rythme de vie.","explication":"Les évaluations viennent du lycée : elles relèvent des **études**. La crainte de l'erreur devant le tuteur naît au garage : elle relève du **travail**. Le lever tôt, le retour tardif et le manque de sommeil relèvent des **conditions de vie** (DOC. 2)."},"adapte":{"indice":"La première ligne est remplie : chercher si chaque autre facteur vient du garage ou du rythme de vie.","explication":"La crainte de l'erreur devant le tuteur naît au garage : c'est un facteur lié au **travail**. Le lever à 5 h 45, le retour à 19 h et le manque de sommeil touchent le rythme de vie : ce sont des **conditions de vie** (DOC. 2)."},"essentiel":{"indice":"Pour chaque facteur, se demander s'il vient du travail ou des conditions de vie.","explication":"Le lever à 5 h 45, le retour à 19 h et le manque de sommeil ne viennent ni du lycée ni du garage : ils touchent le rythme de vie de Nolan. Le DOC. 2 les classe dans les **conditions de vie**."}}},{"id":"a8_s1_q31_tab","type":"tableau","data":{"titre":"","table_student_style":"lines","cells":[[{"type":"prof","content":"Facteur de stress chez Nolan"},{"type":"prof","content":"Origine"}],[{"type":"prof","content":"Les évaluations qui s'enchaînent"},{"type":"eleve","content":"","reponse":"Les études"}],[{"type":"prof","content":"La crainte de commettre une erreur devant son tuteur"},{"type":"eleve","content":"","reponse":"Le travail"}],[{"type":"prof","content":"Le lever à 5 h 45 et le retour à 19 h"},{"type":"eleve","content":"","reponse":"Les conditions de vie"}],[{"type":"prof","content":"Le manque de sommeil"},{"type":"eleve","content":"","reponse":"Les conditions de vie"}]],"variantes":{"adapte":{"cells":[[{"type":"prof","content":"Facteur de stress chez Nolan"},{"type":"prof","content":"Origine"}],[{"type":"prof","content":"Les évaluations qui s'enchaînent"},{"type":"prof","content":"Les études"}],[{"type":"prof","content":"La crainte de commettre une erreur devant son tuteur"},{"type":"eleve","content":"","reponse":"Le travail"}],[{"type":"prof","content":"Le lever à 5 h 45 et le retour à 19 h"},{"type":"eleve","content":"","reponse":"Les conditions de vie"}],[{"type":"prof","content":"Le manque de sommeil"},{"type":"eleve","content":"","reponse":"Les conditions de vie"}]]},"essentiel":{"cells":[[{"type":"prof","content":"Facteur de stress chez Nolan"},{"type":"prof","content":"Origine"}],[{"type":"prof","content":"Les évaluations qui s'enchaînent"},{"type":"prof","content":"Les études"}],[{"type":"prof","content":"La crainte de commettre une erreur devant son tuteur"},{"type":"prof","content":"Le travail"}],[{"type":"prof","content":"Le lever à 5 h 45 et le retour à 19 h"},{"type":"eleve","content":"","reponse":"Les conditions de vie"}],[{"type":"prof","content":"Le manque de sommeil"},{"type":"eleve","content":"","reponse":"Les conditions de vie"}]]}}}},{"id":"a8_doc3","type":"document","data":{"label":"DOC. 3","titre":"Pourquoi une même situation ne produit pas le même effet","corps":"Deux personnes placées devant la même situation ne réagissent pas de la même manière. Ce n'est pas la situation seule qui compte : c'est la façon dont chacun la perçoit, et les ressources dont il dispose au même moment.\n**Un exemple.** Théo et Camille effectuent la même période de formation dans le même garage, et passent les mêmes évaluations. Théo a déjà travaillé dans un garage pendant les vacances : il connaît les gestes et se sent en confiance. Camille découvre l'atelier, dort mal depuis quinze jours et n'ose pas poser de questions. Devant la même tâche, Théo se sent stimulé ; Camille se sent en difficulté.\nOn appelle **vulnérabilité** cette sensibilité variable d'une personne face à une situation. Elle dépend de l'expérience, de la fatigue, de la confiance en soi et du soutien reçu, et elle n'est pas définitive. Elle n'explique pas à elle seule le stress : les caractéristiques de la situation comptent tout autant.","source":"Situations construites pour ce cours, d'après le modèle contraintes-ressources de l'INRS."}},{"id":"a8_s1_ch4","type":"question_chapeau","data":{"numero":"4","texte":"À partir du document 3 :","reponse_attendue":""}},{"id":"a8_s1_q41","type":"sous_question","data":{"competence":"C3","numero":"4.1","texte":"**Préciser** ce qui explique que Théo et Camille ne réagissent pas de la même façon, en rédigeant des phrases complètes.","lignes":4,"style_lignes":"tiret_guide","support_type":"","reponse_attendue":"Théo dispose de plus de ressources que Camille : il a déjà l'expérience du garage et il est reposé. Camille découvre l'atelier et dort mal : sa vulnérabilité est plus grande.","indice":"Chercher ce dont chacun dispose au moment où il affronte la situation.","variantes":{"adapte":{"texte":"**Préciser** ce qui explique que Théo et Camille ne réagissent pas de la même façon, en complétant l'explication ci-dessous.\n« Théo dispose de plus de ………………………………………………………………………………………… que Camille : il a déjà l'………………………………………………………………………………………… du garage et il est reposé. Camille découvre l'atelier et dort mal, sa ………………………………………………………………………………………… est donc plus grande. »","lignes":0,"style_lignes":"pointilles","reponse_attendue":"Théo dispose de plus de ressources que Camille : il a déjà l'expérience du garage et il est reposé. Camille découvre l'atelier et dort mal, sa vulnérabilité est donc plus grande."},"essentiel":{"texte":"**Préciser** ce qui explique que Théo et Camille ne réagissent pas de la même façon, en complétant l'explication ci-dessous.\n« Théo dispose de plus de ………………………………………………………………………………………… que Camille : il a déjà l'………………………………………………………………………………………… du garage et il est reposé. Camille découvre l'atelier et dort mal, sa ………………………………………………………………………………………… est donc plus grande. »\n(Mots à utiliser : ressources, expérience, vulnérabilité.)","lignes":0,"style_lignes":"pointilles","reponse_attendue":"Théo dispose de plus de ressources que Camille : il a déjà l'expérience du garage et il est reposé. Camille découvre l'atelier et dort mal, sa vulnérabilité est donc plus grande."}}},"el":{"standard":{"indice":"Chercher ce dont chacun dispose au moment où il affronte la situation.","explication":"Théo et Camille vivent la même situation, mais pas avec les mêmes ressources. Théo a de l'expérience et se sent en confiance ; Camille découvre l'atelier, dort mal et n'ose pas poser de questions. Sa **vulnérabilité** est donc plus grande (DOC. 3)."},"adapte":{"indice":"Les trois mots manquants figurent dans le DOC. 3 ; le dernier y est écrit en gras.","explication":"Théo a plus de **ressources** car il a déjà l'**expérience** du garage. Camille découvre l'atelier et dort mal : sa **vulnérabilité**, c'est-à-dire sa sensibilité face à la situation, est plus grande.","trous":["ressources","expérience|experience","vulnérabilité|vulnerabilite|sensibilité|sensibilite"]},"essentiel":{"indice":"Un des mots désigne ce dont une personne dispose, un autre ce qu'elle a déjà vécu.","explication":"Théo a plus de **ressources** grâce à son **expérience** du garage. Camille découvre l'atelier et dort mal : sa **vulnérabilité** est plus grande.","trous":["ressources","expérience|experience","vulnérabilité|vulnerabilite"]}}},{"id":"a8_notions_s1","type":"notions","data":{"titre":"Notions à retenir — séance 1","items":[{"notion":"Stress","definition":"Réaction de l'organisme lorsqu'une personne ressent un déséquilibre entre les contraintes d'une situation et les ressources dont elle dispose pour y faire face."},{"notion":"Manifestations du stress","definition":"Signes par lesquels le stress se traduit : dans le corps, dans les émotions, dans la réflexion et dans les comportements."},{"notion":"Facteur de stress","definition":"Élément d'une situation qui déclenche le stress : une évaluation, une tâche nouvelle, un délai court, un conflit, le manque de sommeil."},{"notion":"Adaptation","definition":"Capacité de l'organisme à se mobiliser face à une situation exigeante, puis à revenir à son état normal une fois la situation passée."},{"notion":"Vulnérabilité","definition":"Sensibilité variable d'une personne face à une situation. Elle dépend notamment de son état de fatigue, de son expérience, de sa confiance en elle et du soutien dont elle dispose. Elle n'est pas définitive, et elle n'explique pas à elle seule le stress : les caractéristiques de la situation comptent également."}]}},{"id":"a8_autoeval_s1","type":"auto_eval","data":{"questions":[{"type":"vf","consigne":"Le stress est une maladie.","options":["Vrai","Faux"],"correct":"Faux"},{"type":"qcm","consigne":"Le stress apparaît lorsqu'une personne ressent un déséquilibre entre :","options":["son âge et son niveau scolaire","les contraintes de la situation et ses propres ressources","son travail et ses loisirs"],"correct":"les contraintes de la situation et ses propres ressources"},{"type":"qcm_m","consigne":"Indiquer les éléments qui augmentent les ressources d'une personne (plusieurs réponses exactes) :","options":["l'expérience","le manque de sommeil","le soutien de l'entourage","un temps suffisant"],"correct":"l'expérience, le soutien de l'entourage, un temps suffisant"},{"type":"redige","consigne":"Définir la vulnérabilité.","correct":"La vulnérabilité est la sensibilité variable d'une personne face à une situation. Elle n'est pas définitive."},{"type":"redige","consigne":"Expliquer pourquoi deux personnes placées dans la même situation ne réagissent pas de la même façon.","correct":"Chacune perçoit la situation différemment et ne dispose pas des mêmes ressources au même moment."}],"remed_rouge":"0 à 2 réponses exactes sur 5 : reprendre le document « Qu'est-ce que le stress ? » et retenir les deux plateaux de la balance, les contraintes et les ressources.","remed_orange":"3 ou 4 réponses exactes sur 5 : revoir le document « Pourquoi une même situation ne produit pas le même effet », en particulier la notion de vulnérabilité.","remed_vert":"5 réponses exactes sur 5 : les notions de la séance sont acquises ; passer à l'étude du mécanisme du stress.","variantes":{"adapte":{"questions":[{"type":"vf","consigne":"Le stress est une maladie.","options":["Vrai","Faux"],"correct":"Faux"},{"type":"qcm","consigne":"Le stress apparaît lorsqu'u  la personne","la personne dispose de plus de ressources que de contraintes","la personne n'a aucune contrainte"],"correct":"les contraintes dépassent durablement les ressources de la personne"},{"type":"qcm_m","consigne":"Sélectionner les deux facteurs de stress qui relèvent des conditions de vie. Deux réponses sont attendues.","options":["le manque de sommeil","les trajets longs","une évaluation","un conflit familial"],"correct":"le manque de sommeil, les trajets longs"}]}}},"el":{"seuils":{"rouge_max":2,"orange_max":4},"standard":[{"explication":"Le DOC. 1 précise que le stress est une réaction normale de l'organisme, et non une maladie. Il peut seulement avoir des effets sur la santé lorsqu'il est intense et qu'il dure.","renvoi":"DOC. 1 — Qu'est-ce que le stress ?","renvoi_bloc":"a8_doc1","accepte":[]},{"explication":"Le stress naît d'un déséquilibre entre ce que la situation exige (les contraintes) et ce sur quoi la personne peut s'appuyer (les ressources).","renvoi":"DOC. 1 — Qu'est-ce que le stress ?","renvoi_bloc":"a8_doc1","accepte":[]},{"explication":"L'expérience, l'aide de l'entourage et le temps sont des ressources citées dans le DOC. 1. Le manque de sommeil, au contraire, prive la personne d'une ressource.","renvoi":"DOC. 1 — Qu'est-ce que le stress ?","renvoi_bloc":"a8_doc1","accepte":[]},{"explication":"La vulnérabilité est la sensibilité variable d'une personne face à une situation. Elle dépend de l'expérience, de la fatigue, de la confiance en soi et du soutien reçu, et elle n'est pas définitive.","renvoi":"DOC. 3 — Pourquoi une même situation ne produit pas le même effet","renvoi_bloc":"a8_doc3","accepte":["sensibilité","sensibilite","sensible"]},{"explication":"Ce n'est pas la situation seule qui compte : chacun la perçoit à sa façon et ne dispose pas des mêmes ressources au même moment, comme Théo et Camille.","renvoi":"DOC. 3 — Pourquoi une même situation ne produit pas le même effet","renvoi_bloc":"a8_doc3","accepte":["ressources","ressource","perçoit","percoit","perception","vulnérabilité","vulnerabilite","expérience","experience"]}],"adapte":[{"explication":"Le DOC. 1 précise que le stress est une réaction normale de l'organisme, et non une maladie. Il peut seulement avoir des effets sur la santé lorsqu'il est intense et qu'il dure.","renvoi":"DOC. 1 — Qu'est-ce que le stress ?","renvoi_bloc":"a8_doc1","accepte":[]},{"explication":"Le stress naît d'un déséquilibre entre ce que la situation exige (les contraintes) et ce sur quoi la personne peut s'appuyer (les ressources).","renvoi":"DOC. 1 — Qu'est-ce que le stress ?","renvoi_bloc":"a8_doc1","accepte":[]},{"explication":"L'expérience, l'aide de l'entourage et le temps sont des ressources citées dans le DOC. 1. Le manque de sommeil, au contraire, prive la personne d'une ressource.","renvoi":"DOC. 1 — Qu'est-ce que le stress ?","renvoi_bloc":"a8_doc1","accepte":[]},{"explication":"Selon le DOC. 1, l'organisme reste mobilisé en permanence lorsque les contraintes dépassent durablement les ressources. Quand les ressources suffisent, la personne s'adapte.","renvoi":"DOC. 1 — Qu'est-ce que le stress ?","renvoi_bloc":"a8_doc1","accepte":[]},{"explication":"Le manque de sommeil et les trajets longs touchent le rythme de vie : le DOC. 2 les classe dans les conditions de vie. Une évaluation relève des études, un conflit de la vie personnelle.","renvoi":"DOC. 2 — Les facteurs de stress","renvoi_bloc":"a8_doc2","accepte":[]}],"essentiel":[{"explication":"Le DOC. 1 précise que le stress est une réaction normale de l'organisme, et non une maladie. Il peut seulement avoir des effets sur la santé lorsqu'il est intense et qu'il dure.","renvoi":"DOC. 1 — Qu'est-ce que le stress ?","renvoi_bloc":"a8_doc1","accepte":[]},{"explication":"Le stress naît d'un déséquilibre entre ce que la situation exige (les contraintes) et ce sur quoi la personne peut s'appuyer (les ressources).","renvoi":"DOC. 1 — Qu'est-ce que le stress ?","renvoi_bloc":"a8_doc1","accepte":[]},{"explication":"L'expérience, l'aide de l'entourage et le temps sont des ressources citées dans le DOC. 1. Le manque de sommeil, au contraire, prive la personne d'une ressource.","renvoi":"DOC. 1 — Qu'est-ce que le stress ?","renvoi_bloc":"a8_doc1","accepte":[]},{"explication":"Selon le DOC. 1, l'organisme reste mobilisé en permanence lorsque les contraintes dépassent durablement les ressources. Quand les ressources suffisent, la personne s'adapte.","renvoi":"DOC. 1 — Qu'est-ce que le stress ?","renvoi_bloc":"a8_doc1","accepte":[]},{"explication":"Le manque de sommeil et les trajets longs touchent le rythme de vie : le DOC. 2 les classe dans les conditions de vie. Une évaluation relève des études, un conflit de la vie personnelle.","renvoi":"DOC. 2 — Les facteurs de stress","renvoi_bloc":"a8_doc2","accepte":[]}]}},{"id":"a8_saut_s1","type":"saut_page","data":{}},{"id":"a8_s2","type":"seance","data":{"numero":"2","titre":"Le stress aigu, le stress chronique et les mesures de gestion","objectif":"Être capable de proposer des actions de gestion du stress.","competences":["C1","C3","C4","C5"]}},{"id":"a8_doc4","type":"document_texte_image","data":{"label":"DOC. 4","titre":"Le mécanisme du stress en trois phases","corps":"Face à une situation perçue comme menaçante, l'organisme réagit en trois phases.\n**L'alarme.** Le cerveau donne l'alerte. Les glandes surrénales, situées au-dessus des reins, libèrent notamment de l'**adrénaline**. Le cœur bat plus vite, la respiration s'accélère, les muscles se tendent, la vigilance augmente. L'organisme se prépare à agir.\n**La résistance.** Si la situation se prolonge, les glandes surrénales libèrent notamment du **cortisol**, ce qui permet à l'organisme de maintenir son apport d'énergie. Cette phase peut durer des semaines.\n**L'épuisement.** Si le stress se prolonge encore, la régulation de ces hormones devient inefficace et les capacités de l'organisme sont débordées. La fatigue s'installe, le sommeil se dégrade, les défenses immunitaires diminuent, et des troubles peuvent apparaître.","source":"D'après l'Institut national de recherche et de sécurité, « Stress au travail. Effets sur la santé », texte reformulé.","img":"bcp_1ere_A8/images/stress_a8-mecanisme-du-stress.jpg","img_desc":"Schéma du mécanisme du stress. En haut à gauche, un cerveau légendé « le cerveau donne l'alerte ». Une flèche descend vers deux reins surmontés chacun d'une petite glande jaune, légendés « les glandes surrénales » et « les reins ». De ces glandes partent trois flèches vers la droite. La première, légendée « notamment l'adrénaline », conduit à l'encadré « phase 1 : l'alarme » qui indique que le cœur bat plus vite, que la respiration s'accélère, que les muscles se tendent et que la vigilance augmente. La deuxième, légendée « notamment le cortisol », conduit à l'encadré « phase 2 : la résistance » qui indique que l'organisme maintient son apport d'énergie et que cette phase peut durer des semaines. La troisième, sans légende, conduit à l'encadré « phase 3 : l'épuisement » qui indique que la régulation hormonale devient inefficace et que les capacités de l'organisme sont débordées.","img_w":1151,"img_h":1366}},{"id":"a8_s2_ch1","type":"question_chapeau","data":{"numero":"1","texte":"À partir du document 4 :","reponse_attendue":""}},{"id":"a8_s2_q11","type":"sous_question","data":{"competence":"C1","numero":"1.1","texte":"**Relever** ce qui se passe dans l'organisme à chaque phase, en complétant le tableau.","lignes":0,"style_lignes":"","support_type":"","reponse_attendue":"1. L'alarme : Les glandes surrénales libèrent notamment de l'adrénaline : le cœur bat plus vite et la vigilance augmente. • 2. La résistance : Les glandes surrénales libèrent notamment du cortisol, qui maintient l'apport d'énergie. • 3. L'épuisement : La régulation hormonale devient inefficace : les capacités de l'organisme sont débordées.","indice":"Chaque phase correspond à un paragraphe du document.","variantes":{"adapte":{},"essentiel":{}}},"el":{"standard":{"indice":"DOC. 4 : chaque phase correspond à un paragraphe, avec son hormone écrite en gras.","explication":"À l'alarme, les glandes surrénales libèrent de l'**adrénaline** : le cœur accélère et l'organisme se prépare à agir. À la résistance, le **cortisol** maintient l'apport d'énergie. À l'épuisement, la régulation des hormones devient inefficace et les capacités de l'organisme sont débordées."},"adapte":{"indice":"La phase d'alarme est remplie : chercher dans le DOC. 4 l'hormone de la résistance, puis ce qui arrive quand le stress se prolonge encore.","explication":"Pendant la résistance, les glandes surrénales libèrent du **cortisol**, qui maintient l'apport d'énergie. Pendant l'épuisement, la régulation des hormones devient inefficace et les capacités de l'organisme sont débordées."},"essentiel":{"indice":"DOC. 4, dernier paragraphe : ce qui arrive quand le stress se prolonge encore.","explication":"À la phase d'épuisement, aucune nouvelle hormone n'agit : la régulation des hormones devient inefficace. Les capacités de l'organisme sont débordées, la fatigue s'installe et le sommeil se dégrade."}}},{"id":"a8_s2_q11_tab","type":"tableau","data":{"titre":"","table_student_style":"lines","cells":[[{"type":"prof","content":"Phase"},{"type":"prof","content":"Ce qui se passe dans l'organisme"}],[{"type":"prof","content":"1. L'alarme"},{"type":"eleve","content":"","reponse":"Les glandes surrénales libèrent notamment de l'adrénaline : le cœur bat plus vite et la vigilance augmente."}],[{"type":"prof","content":"2. La résistance"},{"type":"eleve","content":"","reponse":"Les glandes surrénales libèrent notamment du cortisol, qui maintient l'apport d'énergie."}],[{"type":"prof","content":"3. L'épuisement"},{"type":"eleve","content":"","reponse":"La régulation hormonale devient inefficace : les capacités de l'organisme sont débordées."}]],"variantes":{"adapte":{"cells":[[{"type":"prof","content":"Phase"},{"type":"prof","content":"Ce qui se passe dans l'organisme"}],[{"type":"prof","content":"1. L'alarme"},{"type":"prof","content":"Les glandes surrénales libèrent notamment de l'adrénaline : le cœur bat plus vite et la vigilance augmente."}],[{"type":"prof","content":"2. La résistance"},{"type":"eleve","content":"","reponse":"Les glandes surrénales libèrent notamment du cortisol, qui maintient l'apport d'énergie."}],[{"type":"prof","content":"3. L'épuisement"},{"type":"eleve","content":"","reponse":"La régulation hormonale devient inefficace : les capacités de l'organisme sont débordées."}]]},"essentiel":{"cells":[[{"type":"prof","content":"Phase"},{"type":"prof","content":"Ce qui se passe dans l'organisme"}],[{"type":"prof","content":"1. L'alarme"},{"type":"prof","content":"Les glandes surrénales libèrent notamment de l'adrénaline : le cœur bat plus vite et la vigilance augmente."}],[{"type":"prof","content":"2. La résistance"},{"type":"prof","content":"Les glandes surrénales libèrent notamment du cortisol, qui maintient l'apport d'énergie."}],[{"type":"prof","content":"3. L'épuisement"},{"type":"eleve","content":"","reponse":"La régulation hormonale devient inefficace : les capacités de l'organisme sont débordées."}]]}}}},{"id":"a8_s2_q12","type":"sous_question","data":{"competence":"C3","numero":"1.2","texte":"**Expliquer** les manifestations ressenties par Nolan le matin de son oral, à partir de l'action de l'adrénaline, en rédigeant des phrases complètes.","lignes":4,"style_lignes":"tiret_guide","support_type":"","reponse_attendue":"L'adrénaline libérée lors de la phase d'alarme a accéléré son cœur et serré sa gorge. Son organisme se préparait à affronter l'oral, et tout est revenu à la normale une fois l'épreuve passée.","indice":"Relire les signes ressentis par Nolan le matin de son oral, puis chercher la phase qui leur correspond.","variantes":{"adapte":{"texte":"**Expliquer** les manifestations ressenties par Nolan le matin de son oral, en complétant l'explication ci-dessous.\n« L'………………………………………………………………………………………… libérée lors de la phase d'………………………………………………………………………………………… a accéléré son cœur et serré sa gorge. Son organisme se préparait à …………………………………………………………………………………………, et tout est revenu à la normale une fois l'épreuve passée. »","lignes":0,"style_lignes":"pointilles","reponse_attendue":"L'adrénaline libérée lors de la phase d'alarme a accéléré son cœur et serré sa gorge. Son organisme se préparait à agir, et tout est revenu à la normale une fois l'épreuve passée."},"essentiel":{"texte":"**Expliquer** les manifestations ressenties par Nolan le matin de son oral, en complétant l'explication ci-dessous.\n« L'………………………………………………………………………………………… libérée lors de la phase d'………………………………………………………………………………………… a accéléré son cœur et serré sa gorge. Son organisme se préparait à …………………………………………………………………………………………, et tout est revenu à la normale une fois l'épreuve passée. »\n(Mots à utiliser : adrénaline, alarme, agir.)","lignes":0,"style_lignes":"pointilles","reponse_attendue":"L'adrénaline libérée lors de la phase d'alarme a accéléré son cœur et serré sa gorge. Son organisme se préparait à agir, et tout est revenu à la normale une fois l'épreuve passée."}}},"el":{"standard":{"indice":"Relire les signes ressentis par Nolan le matin de son oral, puis chercher dans le DOC. 4 la phase qui leur correspond.","explication":"Le matin de l'oral, Nolan est en phase d'**alarme** : l'adrénaline accélère le cœur et prépare l'organisme à agir (DOC. 4). Il s'agit d'un stress aigu : une fois l'oral passé, tout revient à la normale (DOC. 5)."},"adapte":{"indice":"DOC. 4 : la phase où le cœur bat plus vite, et l'hormone libérée à ce moment.","explication":"Le cœur qui bat vite correspond à la phase d'**alarme**, pendant laquelle l'**adrénaline** est libérée. L'organisme se prépare ainsi à **agir**, puis revient à la normale après l'oral.","trous":["adrénaline|adrenaline","alarme","agir|réagir|reagir|affronter l'oral|affronter l'épreuve"]},"essentiel":{"indice":"DOC. 4, paragraphe « L'alarme » : le nom de l'hormone et la dernière phrase.","explication":"L'**adrénaline** est libérée pendant la phase d'**alarme** : elle accélère le cœur. L'organisme se prépare à **agir**.","trous":["adrénaline|adrenaline","alarme","agir|réagir|reagir"]}}},{"id":"a8_doc5","type":"document","data":{"label":"DOC. 5","titre":"Le stress aigu et le stress chronique","corps":"**Le stress aigu** est une réaction ponctuelle, limitée à une situation précise : un oral, un contrôle, un imprévu à l'atelier. L'organisme se mobilise, puis revient à son état normal une fois la situation passée. Ce stress est utile : il permet de réagir.\n**Le stress chronique** s'installe dans la durée. L'organisme reste mobilisé des semaines ou des mois, sans jamais revenir à son état de repos. Les réserves s'épuisent.\nLes effets ne sont alors plus les mêmes. Le sommeil se dégrade, la fatigue devient permanente, l'irritabilité augmente, la concentration diminue. À plus long terme, un stress qui dure favorise des troubles digestifs, des douleurs, des troubles anxieux et des maladies cardiovasculaires : ce sont les **conséquences pathologiques** du stress.\nDans le monde du travail, un stress professionnel chronique peut conduire à un épuisement professionnel, appelé aussi burnout.","source":"D'après l'Institut national de recherche et de sécurité, « Stress au travail. Effets sur la santé »."}},{"id":"a8_s2_ch2","type":"question_chapeau","data":{"numero":"2","texte":"À partir du document 5 :","reponse_attendue":""}},{"id":"a8_s2_q21","type":"sous_question","data":{"competence":"C1","numero":"2.1","texte":"**Comparer** le stress aigu et le stress chronique, en complétant le tableau.","lignes":0,"style_lignes":"","support_type":"","reponse_attendue":"Sa durée : Il est ponctuel et lié à une situation précise. / Il s'installe sur des semaines ou des mois. • Ses effets : L'organisme revient à son état normal une fois la situation passée. / Les réserves s'épuisent et des troubles apparaissent.","indice":"Le premier paragraphe décrit le stress aigu, le deuxième et le troisième décrivent le stress chronique.","variantes":{"adapte":{},"essentiel":{}}},"el":{"standard":{"indice":"Le premier paragraphe du DOC. 5 décrit le stress aigu, le deuxième et le troisième décrivent le stress chronique.","explication":"Le stress aigu est ponctuel : l'organisme se mobilise puis revient à son état normal. Le stress chronique s'installe sur des semaines ou des mois : l'organisme ne revient jamais au repos, ses réserves s'épuisent et des troubles apparaissent (DOC. 5)."},"adapte":{"indice":"DOC. 5 : le premier paragraphe décrit le stress aigu, les suivants le stress chronique.","explication":"Le stress chronique s'installe sur des semaines ou des mois. Après un stress aigu, l'organisme revient à son état normal ; dans un stress chronique, il ne revient pas au repos, les réserves s'épuisent et des troubles apparaissent."},"essentiel":{"indice":"Chercher dans le DOC. 5 si l'organisme revient ou non à son état normal.","explication":"Après un stress aigu, l'organisme revient à son état normal. Dans un stress chronique, il ne revient pas au repos : les réserves s'épuisent et des troubles apparaissent."}}},{"id":"a8_s2_q21_tab","type":"tableau","data":{"titre":"","table_student_style":"lines","cells":[[{"type":"prof","content":"Ce que l'on compare"},{"type":"prof","content":"Le stress aigu"},{"type":"prof","content":"Le stress chronique"}],[{"type":"prof","content":"Sa durée"},{"type":"eleve","content":"","reponse":"Il est ponctuel et lié à une situation précise."},{"type":"eleve","content":"","reponse":"Il s'installe sur des semaines ou des mois."}],[{"type":"prof","content":"Ses effets"},{"type":"eleve","content":"","reponse":"L'organisme revient à son état normal une fois la situation passée."},{"type":"eleve","content":"","reponse":"Les réserves s'épuisent et des troubles apparaissent."}]],"variantes":{"adapte":{"cells":[[{"type":"prof","content":"Ce que l'on compare"},{"type":"prof","content":"Le stress aigu"},{"type":"prof","content":"Le stress chronique"}],[{"type":"prof","content":"Sa durée"},{"type":"prof","content":"Il est ponctuel et lié à une situation précise."},{"type":"eleve","content":"","reponse":"Il s'installe sur des semaines ou des mois."}],[{"type":"prof","content":"Ses effets"},{"type":"eleve","content":"","reponse":"L'organisme revient à son état normal une fois la situation passée."},{"type":"eleve","content":"","reponse":"Les réserves s'épuisent et des troubles apparaissent."}]]},"essentiel":{"cells":[[{"type":"prof","content":"Ce que l'on compare"},{"type":"prof","content":"Le stress aigu"},{"type":"prof","content":"Le stress chronique"}],[{"type":"prof","content":"Sa durée"},{"type":"prof","content":"Il est ponctuel et lié à une situation précise."},{"type":"prof","content":"Il s'installe sur des semaines ou des mois."}],[{"type":"prof","content":"Ses effets"},{"type":"eleve","content":"","reponse":"L'organisme revient à son état normal une fois la situation passée."},{"type":"eleve","content":"","reponse":"Les réserves s'épuisent et des troubles apparaissent."}]]}}}},{"id":"a8_s2_q22","type":"sous_question","data":{"competence":"C3","numero":"2.2","texte":"**Expliquer** pourquoi un stress qui dure met la santé en danger, en rédigeant des phrases complètes.","lignes":5,"style_lignes":"tiret_guide","support_type":"","reponse_attendue":"Lorsque le stress dure, l'organisme reste mobilisé et puise dans ses réserves sans jamais se reposer. Ses capacités sont débordées, et des troubles du sommeil, des douleurs ou des maladies cardiovasculaires peuvent apparaître.","indice":"Reprendre la troisième phase du mécanisme, puis chercher ce que le document appelle les conséquences pathologiques.","variantes":{"adapte":{"texte":"**Expliquer** pourquoi un stress qui dure met la santé en danger, en complétant l'explication ci-dessous.\n« Lorsque le stress dure, l'organisme reste ………………………………………………………………………………………… et puise dans ses ………………………………………………………………………………………… sans jamais se reposer. Des troubles peuvent alors apparaître, par exemple …………………………………………………………………………………………. »","lignes":0,"style_lignes":"pointilles","reponse_attendue":"Lorsque le stress dure, l'organisme reste mobilisé et puise dans ses réserves sans jamais se reposer. Des troubles peuvent alors apparaître, par exemple des troubles du sommeil."},"essentiel":{"texte":"**Expliquer** pourquoi un stress qui dure met la santé en danger, en complétant l'explication ci-dessous.\n« Lorsque le stress dure, l'organisme reste ………………………………………………………………………………………… et puise dans ses ………………………………………………………………………………………… sans jamais se reposer. Des troubles peuvent alors apparaître, par exemple …………………………………………………………………………………………. »\n(Mots à utiliser : mobilisé, réserves, des troubles du sommeil.)","lignes":0,"style_lignes":"pointilles","reponse_attendue":"Lorsque le stress dure, l'organisme reste mobilisé et puise dans ses réserves sans jamais se reposer. Des troubles peuvent alors apparaître, par exemple des troubles du sommeil."}}},"el":{"standard":{"indice":"Reprendre la troisième phase du mécanisme, puis chercher ce que le DOC. 5 appelle les conséquences pathologiques.","explication":"Dans un stress qui dure, l'organisme reste mobilisé sans revenir au repos et puise dans ses réserves jusqu'à l'épuisement (DOC. 4 et DOC. 5). Ses capacités sont débordées : apparaissent alors des **conséquences pathologiques**, comme des troubles du sommeil, des troubles digestifs, des douleurs, des troubles anxieux ou des maladies cardiovasculaires."},"adapte":{"indice":"DOC. 5, deuxième et troisième paragraphes : ce qui arrive à l'organisme, puis les troubles cités.","explication":"Quand le stress dure, l'organisme reste **mobilisé** et puise dans ses **réserves** sans revenir au repos. Des conséquences pathologiques apparaissent alors : troubles du sommeil, troubles digestifs, douleurs, troubles anxieux ou maladies cardiovasculaires.","trous":["mobilisé|mobilise","réserves|reserves","des troubles du sommeil|troubles du sommeil|des troubles digestifs|troubles digestifs|des douleurs|douleurs|des troubles anxieux|troubles anxieux|des maladies cardiovasculaires|maladies cardiovasculaires"]},"essentiel":{"indice":"Le premier mot décrit l'état de l'organisme, le deuxième ce dans quoi il puise.","explication":"L'organisme reste **mobilisé** et épuise ses **réserves**. Des troubles apparaissent, par exemple **des troubles du sommeil** (DOC. 5).","trous":["mobilisé|mobilise","réserves|reserves","des troubles du sommeil|troubles du sommeil|des troubles digestifs|troubles digestifs|des douleurs|douleurs|des troubles anxieux|troubles anxieux|des maladies cardiovasculaires|maladies cardiovasculaires"]}}},{"id":"a8_doc6","type":"document_image","data":{"label":"DOC. 6","titre":"Des mesures pour gérer son stress au quotidien","source":"D'après des mesures de gestion du stress décrites par l'INRS et par le ministère chargé de la santé.","img":"bcp_1ere_A8/images/stress_a8-mesures-de-gestion.jpg","img_desc":"Infographie sans texte de commentaire, composée de six vignettes disposées en deux rangées de trois. Chaque vignette contient un pictogramme et une légende. Un lit : dormir suffisamment, à heures régulières. Une personne qui court : pratiquer une activité physique régulière. Un calendrier coché : organiser son travail, découper les tâches. Des poumons entourés de flèches : prendre des pauses, respirer lentement. Deux personnes qui discutent : parler à quelqu'un de confiance, demander de l'aide. Une tasse barrée : réduire les excitants, surtout le soir.","img_w":1582,"img_h":994}},{"id":"a8_s2_ch3","type":"question_chapeau","data":{"numero":"3","texte":"À partir du document 6 :","reponse_attendue":""}},{"id":"a8_s2_q31","type":"sous_question","data":{"competence":"C1","numero":"3.1","texte":"**Relever** trois mesures que chacun peut mettre en œuvre pour gérer son stress.","lignes":3,"style_lignes":"tirets_comptage","lignes_par_reponse":1,"support_type":"","reponse_attendue":"Dormir suffisamment. Pratiquer une activité physique régulière. Parler à une personne de confiance.","indice":"","variantes":{"adapte":{"texte":"**Relever** deux mesures que chacun peut mettre en œuvre pour gérer son stress.","lignes":2,"reponse_attendue":"Dormir suffisamment. Pratiquer une activité physique régulière."},"essentiel":{"texte":"**Relever** deux mesures que chacun peut mettre en œuvre pour gérer son stress, en cochant deux propositions.\n☐ Dormir suffisamment, à heures régulières.\n☐ Pratiquer une activité physique régulière.\n☐ Se coucher de plus en plus tard.\n☐ Parler à quelqu'un de confiance.","lignes":0,"style_lignes":"pointilles","reponse_attendue":"Dormir suffisamment ; pratiquer une activité physique régulière ; parler à quelqu'un de confiance."}}},"el":{"standard":{"indice":"DOC. 6 : choisir trois mesures parmi les six vignettes.","explication":"Le DOC. 6 présente six mesures individuelles : dormir suffisamment, pratiquer une activité physique, organiser son travail, prendre des pauses et respirer lentement, parler à quelqu'un de confiance, réduire les excitants. Plusieurs renforcent les ressources citées dans le DOC. 1 : le sommeil, le temps, l'aide de l'entourage."},"adapte":{"indice":"DOC. 6 : choisir deux mesures parmi les six vignettes.","explication":"Toute mesure du DOC. 6 convient : dormir suffisamment, pratiquer une activité physique, organiser son travail, prendre des pauses et respirer lentement, parler à quelqu'un de confiance, réduire les excitants."},"essentiel":{"indice":"Garder les propositions qui figurent dans le DOC. 6.","explication":"Dormir suffisamment, pratiquer une activité physique et parler à quelqu'un de confiance figurent dans le DOC. 6. Se coucher de plus en plus tard aggrave le manque de sommeil : ce n'est pas une mesure de gestion du stress.","choix_corrects":[0,1,3]}}},{"id":"a8_encadre_aide","type":"encadre","data":{"variante":"attention","titre":"Quand demander de l'aide","texte":"Certains signes doivent conduire à en parler : une fatigue qui dure, des troubles du sommeil qui s'installent, une tristesse persistante, un isolement, une anxiété forte. Ces signes ne se diagnostiquent pas seul. Il faut en parler à un adulte de confiance, à l'infirmier ou l'infirmière du lycée, au médecin traitant ou à un psychologue."}},{"id":"a8_s2_ch4","type":"question_chapeau","data":{"numero":"4","texte":"En revenant à la situation de Nolan :","reponse_attendue":""}},{"id":"a8_s2_q41","type":"sous_question","data":{"competence":"C4","numero":"4.1","texte":"**Proposer** trois actions que Nolan peut mettre en œuvre pour gérer son stress.","lignes":3,"style_lignes":"tirets_comptage","lignes_par_reponse":2,"support_type":"","reponse_attendue":"Se coucher plus tôt pour retrouver un sommeil régulier. Reprendre le football du mercredi. Poser ses questions à son tuteur plutôt que de craindre l'erreur.","indice":"Reprendre la situation de Nolan et les facteurs classés en séance 1, puis se demander, pour chacun, ce que Nolan peut changer lui-même.","variantes":{"adapte":{"texte":"**Proposer** deux actions que Nolan peut mettre en œuvre pour gérer son stress.\n(Liste : se coucher plus tôt — reprendre le football — poser ses questions à son tuteur — arrêter sa formation — changer de classe.)","lignes":2,"reponse_attendue":"Se coucher plus tôt pour retrouver un sommeil régulier. Reprendre le football du mercredi.","indice":"Les manifestations relevées à la question 1.2 de la séance 1 constituent un point de départ."},"essentiel":{"texte":"**Proposer** deux actions utiles à Nolan, en cochant deux propositions.\n☐ Se coucher plus tôt.\n☐ Reprendre le football.\n☐ Arrêter sa formation.\n☐ Acheter un nouveau téléphone.","lignes":0,"reponse_attendue":"Nolan peut se coucher plus tôt et reprendre le football du mercredi.","indice":"Les manifestations relevées à la question 1.2 de la séance 1 constituent un point de départ."}}},"el":{"standard":{"indice":"Reprendre les facteurs et les signes de Nolan, puis se demander, pour chacun, ce que Nolan peut changer lui-même.","explication":"Chaque action répond à un élément de la situation : se coucher plus tôt agit sur le manque de sommeil, reprendre le football correspond à l'activité physique du DOC. 6, poser ses questions au tuteur réduit la crainte de l'erreur. Organiser son travail, prendre des pauses ou en parler à un adulte de confiance conviennent aussi ; « se détendre » reste trop vague."},"adapte":{"indice":"Garder, dans la liste, les actions qui figurent parmi les mesures du DOC. 6 ou qui répondent à un facteur de stress de Nolan.","explication":"Se coucher plus tôt, reprendre le football et poser ses questions au tuteur agissent sur le sommeil, l'activité physique et la crainte de l'erreur. Arrêter sa formation ou changer de classe ne sont pas des mesures du DOC. 6 et ne règlent pas le stress de Nolan."},"essentiel":{"indice":"Chercher les deux actions qui correspondent à des mesures du DOC. 6.","explication":"Se coucher plus tôt agit sur le manque de sommeil, et reprendre le football est une activité physique : ce sont deux mesures du DOC. 6. Arrêter sa formation ou acheter un téléphone ne gèrent pas le stress de Nolan.","choix_corrects":[0,1]}}},{"id":"a8_s2_q42","type":"sous_question","data":{"competence":"C5","numero":"4.2","texte":"**Justifier** le choix de l'action la plus utile à Nolan, parmi les trois proposées, en rédigeant des phrases complètes.","lignes":5,"style_lignes":"tiret_guide","support_type":"","reponse_attendue":"L'action la plus utile est de retrouver un sommeil régulier. Nolan dort mal depuis six semaines, or le sommeil est la ressource qui lui permet de s'adapter, et son manque aggrave la fatigue et l'irritabilité.","indice":"Un argument solide s'appuie sur une donnée : un signe décrit dans la situation, une phase du mécanisme, ou une ressource du document « Qu'est-ce que le stress ? ».","variantes":{"adapte":{"texte":"**Justifier** le choix de l'action la plus utile à Nolan, parmi les deux proposées, en complétant la phrase ci-dessous.\n(Mots à utiliser : sommeil, ressource.)\n« L'action la plus utile est ………………………………………………………………………………………… , parce que Nolan manque de ………………………………………………………………………………………… depuis six semaines et que c'est la ………………………………………………………………………………………… dont il a le plus besoin pour s'adapter. »","lignes":0},"essentiel":{"texte":"**Justifier** le choix de l'action la plus utile à Nolan, en cochant l'action puis la raison.\nAction : ☐ se coucher plus tôt  ☐ reprendre le football\nRaison : ☐ elle agit sur le manque de sommeil, qui dure depuis six semaines  ☐ elle est plus agréable  ☐ elle coûte moins cher","lignes":0}}},"el":{"standard":{"indice":"Un argument solide s'appuie sur une donnée : un signe de la situation, une phase du mécanisme ou une ressource du DOC. 1.","explication":"Retrouver un sommeil régulier est l'action la plus utile : Nolan dort mal depuis six semaines, or le sommeil est une ressource (DOC. 1). Son manque augmente la fatigue et l'irritabilité et entretient le stress (DOC. 5). Un autre choix reste valable s'il s'appuie sur un élément précis de la situation."},"adapte":{"indice":"Choisir l'action qui agit sur ce qui manque à Nolan depuis six semaines.","explication":"L'action la plus utile est de se coucher plus tôt : Nolan manque de **sommeil** depuis six semaines. Or le sommeil est une **ressource** (DOC. 1) : sans lui, l'organisme a plus de mal à s'adapter.","trous":["se coucher plus tôt|de se coucher plus tôt|se coucher plus tot|retrouver un sommeil régulier|de retrouver un sommeil régulier|dormir plus","sommeil","ressource"]},"essentiel":{"indice":"La raison choisie doit aller avec l'action choisie et avec un signe de la situation.","explication":"Se coucher plus tôt agit sur le manque de sommeil, qui dure depuis six semaines : l'action et la raison vont ensemble. « Plus agréable » ou « moins cher » ne s'appuient sur aucun élément de la situation.","choix_corrects":[0,2]}}},{"id":"a8_notions_s2","type":"notions","data":{"titre":"Notions à retenir — séance 2","items":[{"notion":"Phase","definition":"Étape du mécanisme du stress. L'organisme réagit en trois phases : l'alarme, la résistance et l'épuisement."},{"notion":"Hormone","definition":"Substance libérée par une glande et transportée par le sang, qui agit sur le fonctionnement de l'organisme."},{"notion":"Adrénaline","definition":"Hormone libérée par les glandes surrénales lors de la phase d'alarme. Elle accélère le cœur et la respiration et augmente la vigilance."},{"notion":"Cortisol","definition":"Hormone libérée par les glandes surrénales lors de la phase de résistance. Elle permet à l'organisme de puiser dans ses réserves pour tenir."},{"notion":"Stress aigu","definition":"Stress ponctuel, lié à une situation précise. L'organisme revient à son état normal une fois la situation passée."},{"notion":"Stress chronique","definition":"Stress qui s'installe dans la durée. L'organisme reste mobilisé et ses réserves s'épuisent."},{"notion":"Conséquence pathologique","definition":"Trouble de santé provoqué par un stress qui dure : troubles du sommeil, troubles digestifs, douleurs, troubles anxieux, maladies cardiovasculaires."},{"notion":"Mesure individuelle","definition":"Action que chacun peut mettre en œuvre pour gérer son stress : dormir suffisamment, bouger, organiser son travail, faire des pauses, demander de l'aide."}]}},{"id":"a8_autoeval_s2","type":"auto_eval","data":{"questions":[{"type":"vf","consigne":"Le stress aigu est toujours dangereux pour la santé.","options":["Vrai","Faux"],"correct":"Faux"},{"type":"qcm","consigne":"L'hormone libérée lors de la phase d'alarme est :","options":["le cortisol","l'adrénaline","l'insuline"],"correct":"l'adrénaline"},{"type":"qcm_m","consigne":"Indiquer les conséquences possibles d'un stress qui dure (plusieurs réponses exactes) :","options":["des troubles du sommeil","une meilleure concentration","des troubles digestifs","des maladies cardiovasculaires"],"correct":"des troubles du sommeil, des troubles digestifs, des maladies cardiovasculaires"},{"type":"redige","consigne":"Nommer la glande qui libère l'adrénaline et le cortisol.","correct":"Ce sont les glandes surrénales, situées au-dessus des reins."},{"type":"redige","consigne":"Indiquer deux mesures individuelles permettant de gérer son stress.","correct":"Dormir suffisamment et pratiquer une activité physique régulière."}],"remed_rouge":"0 à 2 réponses exactes sur 5 : reprendre le document « Le mécanisme du stress en trois phases » et retenir l'ordre des trois phases et l'hormone de chacune.","remed_orange":"3 ou 4 réponses exactes sur 5 : revoir le document « Le stress aigu et le stress chronique », en particulier ce qui distingue leurs effets.","remed_vert":"5 réponses exactes sur 5 : les notions du module sont acquises ; l'évaluation peut être préparée.","variantes":{"adapte":{"questions":[{"type":"vf","consigne":"Le stress aigu est toujours dangereux pour la santé.","options":["Vrai","Faux"],"correct":"Faux"},{"type":"qcm","consigne":"L'hormone libérée lors de la phase d'alarme est :","options":["le cortisol","l'adrénaline","l'insuline"],"correct":"l'adrénaline"},{"type":"qcm_m","consigne":"Indiquer les conséquences possibles d'un stress qui dure (plusieurs réponses exactes) :","options":["des troubles du sommeil","une meilleure concentration","des troubles digestifs","des maladies cardiovasculaires"],"correct":"des troubles du sommeil, des troubles digestifs, des maladies cardiovasculaires"},{"type":"qcm","consigne":"Quelle hormone est libérée lors de la phase d'alarme ?","options":["l'adrénaline","le cortisol","l'insuline"],"correct":"l'adrénaline"},{"type":"qcm","consigne":"Que se passe-t-il lorsque le stress dure trop longtemps ?","options":["les capacités de l'organisme sont débordées","l'organisme revient à son état normal","la vigilance augmente durablement"],"correct":"les capacités de l'organisme sont débordées"}]},"essentiel":{"questions":[{"type":"v
