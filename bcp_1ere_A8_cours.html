e à deux plateaux, dont le plateau de gauche penche vers le bas. Le plateau de gauche, intitulé « les contraintes » et bordé de rouge, porte quatre étiquettes : un délai, une évaluation, une tâche nouvelle, le regard des autres. Le plateau de droite, intitulé « les ressources » et bordé de vert, porte quatre étiquettes : les connaissances, l'expérience, le sommeil, l'aide de l'entourage. Sous la balance, une légende indique que le stress apparaît lorsque le plateau des contraintes l'emporte durablement sur celui des ressources.", "image_w": "1536", "image_h": "1024", "source": "", "url_source": "https://www.inrs.fr/risques/stress/ce-qu-il-faut-retenir.html", "date_consultation": "2026-09-01", "date_donnees": "2026", "statut_source": "institutionnelle", "image_taille": "pleine", "img": "bcp_1ere_A8/images/bcp_1ere_A8_a8_doc1.jpg", "img_desc": "Schéma en forme de balance à deux plateaux, dont le plateau de gauche penche vers le bas. Le plateau de gauche, intitulé « les contraintes » et bordé de rouge, porte quatre étiquettes : un délai, une évaluation, une tâche nouvelle, le regard des autres. Le plateau de droite, intitulé « les ressources » et bordé de vert, porte quatre étiquettes : les connaissances, l'expérience, le sommeil, l'aide de l'entourage. Sous la balance, une légende indique que le stress apparaît lorsque le plateau des contraintes l'emporte durablement sur celui des ressources.", "img_w": 1400, "img_h": 933}}, {"id": "a8_s1_ch2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 1 :", "reponse_attendue": ""}}, {"id": "a8_s1_q21", "type": "sous_question", "data": {"competence": "C1", "numero": "2.1", "texte": "**Relever** les deux éléments dont le déséquilibre provoque le stress.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "lignes_par_reponse": 1, "support_type": "", "reponse_attendue": "– Les contraintes de la situation.\n– Les ressources de la personne.", "indice": "", "reponse_allegee": "Le stress provient d'un déséquilibre entre les {{contraintes}} de la situation et les {{ressources}} de la personne.", "variantes": {"essentiel": {"texte": "**Relever** les deux éléments dont le déséquilibre provoque le stress, en cochant deux propositions.\n☐ les contraintes\n☐ la fatigue\n☐ les ressources\n☐ l'expérience", "lignes": 0, "reponse_attendue": "les contraintes\nles ressources"}, "adapte": {"texte": "**Relever** les deux éléments dont le déséquilibre provoque le stress.\n(Mots proposés : les contraintes — la fatigue — les ressources — l'expérience.)"}}}, "el": {"standard": {"indice": "DOC. 1 : la première phrase et les deux plateaux de la balance.", "explication": "Le stress provient d’un déséquilibre entre les contraintes de la situation et les ressources de la personne."}, "adapte": {"indice": "DOC. 1 : les titres des deux plateaux de la balance.", "explication": "Les deux éléments : les contraintes et les ressources. La fatigue et l’expérience n’en sont que des exemples."}, "essentiel": {"indice": "DOC. 1 : les deux plateaux de la balance.", "explication": "Les contraintes et les ressources. La fatigue et l’expérience ne sont pas les plateaux de la balance."}}}, {"id": "a8_s1_q22", "type": "sous_question", "data": {"competence": "C3", "numero": "2.2", "texte": "**Expliquer** en quoi le stress est d'abord une réaction utile, en rédigeant des phrases complètes.", "points": "", "lignes": 4, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Le stress mobilise l'organisme pour faire face à une situation exigeante. Il devient surtout un problème lorsqu'il dure et que les ressources ne suffisent plus.", "indice": "Comparer l'oral de Nolan, qui s'est bien passé, et les six semaines qui l'ont précédé.", "reponse_allegee": "Le stress mobilise l'organisme pour faire face à une situation {{exigeante}}. Il devient un problème lorsqu'il {{dure}}.", "variantes": {"adapte": {"texte": "**Expliquer** en quoi le stress est d'abord une réaction utile, en comp  mécaniciens embauchés le même mois dans le même garage, suivent la même formation et passent les mêmes évaluations. Théo a déjà travaillé trois ans dans un autre garage : il connaît les gestes, dort bien et se sent en confiance. Anissa découvre l'atelier, dort mal depuis quinze jours et n'ose pas poser de questions. Devant la même tâche, Théo se sent stimulé ; Anissa se sent en difficulté.\nOn appelle **vulnérabilité** cette sensibilité variable d'une personne face à une situation. Elle dépend de l'expérience, de la fatigue, de la confiance en soi et du soutien reçu, et elle n'est pas définitive. Elle n'explique pas à elle seule le stress : les caractéristiques de la situation comptent tout autant.", "cadre": true, "source": "D'après le modèle contraintes-ressources de l'INRS.", "statut_source": "construite"}}, {"id": "a8_s1_ch4", "type": "question_chapeau", "data": {"numero": "4", "texte": "À partir du document 3 :", "reponse_attendue": ""}}, {"id": "a8_s1_q41", "type": "sous_question", "data": {"competence": "C3", "numero": "4.1", "texte": "**Préciser** ce qui explique que Théo et Anissa ne réagissent pas de la même façon, en rédigeant des phrases complètes.", "points": "", "lignes": 4, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Théo dispose de plus de ressources qu'Anissa : il a déjà l'expérience du garage et il est reposé. Anissa découvre l'atelier et dort mal : sa vulnérabilité est plus grande.", "indice": "Chercher ce dont chacun dispose au moment où il affronte la situation.", "reponse_allegee": "Théo dispose de plus de {{ressources}} : il a l'{{expérience}} du garage. La {{vulnérabilité}} d'Anissa est plus grande.", "variantes": {"adapte": {"texte": "**Préciser** ce qui explique que Théo et Anissa ne réagissent pas de la même façon, en complétant l'explication ci-dessous.\n« Théo dispose de plus de ………………………………………………………………………………………… qu'Anissa : il a déjà l'………………………………………………………………………………………… du garage et il est reposé. Anissa découvre l'atelier et dort mal, sa ………………………………………………………………………………………… est donc plus grande. »", "lignes": 0, "style_lignes": "pointilles", "reponse_attendue": "Théo dispose de plus de ressources qu'Anissa : il a déjà l'expérience du garage et il est reposé. Anissa découvre l'atelier et dort mal, sa vulnérabilité est donc plus grande."}, "essentiel": {"texte": "**Préciser** ce qui explique que Théo et Anissa ne réagissent pas de la même façon, en complétant l'explication ci-dessous.\n« Théo dispose de plus de ………………………………………………………………………………………… qu'Anissa : il a déjà l'………………………………………………………………………………………… du garage et il est reposé. Anissa découvre l'atelier et dort mal, sa ………………………………………………………………………………………… est donc plus grande. »\n(Mots à utiliser : ressources, expérience, vulnérabilité.)", "lignes": 0, "style_lignes": "pointilles", "reponse_attendue": "Théo dispose de plus de ressources qu'Anissa : il a déjà l'expérience du garage et il est reposé. Anissa découvre l'atelier et dort mal, sa vulnérabilité est donc plus grande."}}}, "el": {"standard": {"indice": "DOC. 3 : ce dont chacun dispose au moment de la tâche (expérience, sommeil, confiance), puis la définition de la vulnérabilité.", "explication": "Théo dispose de plus de ressources qu’Anissa : il a l’expérience du garage et il est reposé. Anissa découvre l’atelier et dort mal : sa vulnérabilité est plus grande."}, "adapte": {"indice": "DOC. 3 : ce que Théo a déjà fait pendant trois ans, puis le mot en gras du dernier paragraphe.", "explication": "Théo a plus de ressources et l’expérience du garage. La vulnérabilité d’Anissa est plus grande.", "trous": ["ressources|ressource", "expérience|experience", "vulnérabilité|vulnerabilite"]}, "essentiel": {"indice": "DOC. 3 : utiliser les trois mots proposés, dans l’ordre.", "explication": "Théo a plus de ressources et de l’expérience. Anissa est plus vulnérable : sa vulnérabilité est plus grande.", "trous": ["ressources|ressource", "expérience|experience", "vulnérabilité|vulnerabilite"]}}}, {"id": "a8_notions_s1", "type": "notions", "data": {"titre": "Notions à retenir — séance 1", "items": [{"notion": "Stress", "definition": "Réaction de l'organisme lorsqu'une personne ressent un déséquilibre entre les contraintes d'une situation et les ressources dont elle dispose pour y faire face."}, {"notion": "Manifestations du stress", "definition": "Signes par lesquels le stress se traduit : dans le corps, dans les émotions, dans la réflexion et dans les comportements."}, {"notion": "Facteur de stress", "definition": "Élément d'une situation qui déclenche le stress : une évaluation, une tâche nouvelle, un délai court, un conflit, le manque de sommeil."}, {"notion": "Adaptation", "definition": "Capacité de l'organisme à se mobiliser face à une situation exigeante, puis à revenir à son état normal une fois la situation passée."}, {"notion": "Vulnérabilité", "definition": "Sensibilité variable d'une personne face à une situation. Elle dépend notamment de son état de fatigue, de son expérience, de sa confiance en elle et du soutien dont elle dispose. Elle n'est pas définitive, et elle n'explique pas à elle seule le stress : les caractéristiques de la situation comptent également."}]}}, {"id": "a8_autoeval_s1", "type": "auto_eval", "data": {"questions": [{"type": "vf", "consigne": "Le stress est une maladie.", "options": ["Vrai", "Faux"], "correct": "Faux"}, {"type": "qcm", "consigne": "Le stress apparaît lorsqu'une personne ressent un déséquilibre entre :", "options": ["son âge et son niveau scolaire", "les contraintes de la situation et ses propres ressources", "son travail et ses loisirs"], "correct": "les contraintes de la situation et ses propres ressources"}, {"type": "qcm_m", "consigne": "Indiquer les éléments qui augmentent les ressources d'une personne (plusieurs réponses exactes) :", "options": ["l'expérience", "le manque de sommeil", "le soutien de l'entourage", "un temps suffisant"], "correct": "l'expérience, le soutien de l'entourage, t pas le même effet", "renvoi_bloc": "a8_doc3"}]}}, {"id": "a8_s2", "type": "seance", "data": {"numero": "2", "titre": "Le stress aigu, le stress chronique et les mesures de gestion", "objectif": "Être capable de proposer des actions de gestion du stress.", "competences": ["C1", "C3", "C4", "C5"]}}, {"id": "a8_doc4", "type": "document_texte_image", "data": {"label": "DOC. 4", "titre": "Le mécanisme du stress en trois phases", "corps": "Face à une situation perçue comme menaçante, l'organisme réagit en trois phases.\n**L'alarme.** Le cerveau donne l'alerte. Les glandes surrénales, situées au-dessus des reins, libèrent notamment de l'**adrénaline**. Le cœur bat plus vite, la respiration s'accélère, les muscles se tendent, la vigilance augmente. L'organisme se prépare à agir.\n**La résistance.** Si la situation se prolonge, les glandes surrénales libèrent notamment du **cortisol**, ce qui permet à l'organisme de maintenir son apport d'énergie. Cette phase peut durer des semaines.\n**L'épuisement.** Si le stress se prolonge encore, la régulation de ces hormones devient inefficace et les capacités de l'organisme sont débordées. La fatigue s'installe, le sommeil se dégrade, les défenses immunitaires diminuent, et des troubles peuvent apparaître.", "cadre": true, "image_nom": "Schéma du mécanisme du stress. En haut à gauche, un cerveau légendé « le cerveau donne l'alerte ». Une flèche descend vers deux reins surmontés chacun d'une petite glande jaune, légendés « les glandes surrénales » et « les reins ». De ces glandes partent trois flèches vers la droite. La première, légendée « notamment l'adrénaline », conduit à l'encadré « phase 1 : l'alarme » qui indique que le cœur bat plus vite, que la respiration s'accélère, que les muscles se tendent et que la vigilance augmente. La deuxième, légendée « notamment le cortisol », conduit à l'encadré « phase 2 : la résistance » qui indique que l'organisme maintient son apport d'énergie et que cette phase peut durer des semaines. La troisième, sans légende, conduit à l'encadré « phase 3 : l'épuisement » qui indique que la régulation hormonale devient inefficace et que les capacités de l'organisme sont débordées.", "image_w": "1151", "image_h": "1366", "source": "", "url_source": "https://www.inrs.fr/risques/stress/effets-sante.html", "date_consultation": "2026-09-01", "date_donnees": "2026", "statut_source": "institutionnelle", "image_taille": "pleine", "img": "bcp_1ere_A8/images/bcp_1ere_A8_a8_doc4.jpg", "img_desc": "Schéma du mécanisme du stress. En haut à gauche, un cerveau légendé « le cerveau donne l'alerte ». Une flèche descend vers deux reins surmontés chacun d'une petite glande jaune, légendés « les glandes surrénales » et « les reins ». De ces glandes partent trois flèches vers la droite. La première, légendée « notamment l'adrénaline », conduit à l'encadré « phase 1 : l'alarme » qui indique que le cœur bat plus vite, que la respiration s'accélère, que les muscles se tendent et que la vigilance augmente. La deuxième, légendée « notamment le cortisol », conduit à l'encadré « phase 2 : la résistance » qui indique que l'organisme maintient son apport d'énergie et que cette phase peut durer des semaines. La troisième, sans légende, conduit à l'encadré « phase 3 : l'épuisement » qui indique que la régulation hormonale devient inefficace et que les capacités de l'organisme sont débordées.", "img_w": 1151, "img_h": 1366}}, {"id": "a8_s2_ch1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 4 :", "reponse_attendue": ""}}, {"id": "a8_s2_q11", "type": "sous_question", "data": {"competence": "C1", "numero": "1.1", "texte": "**Relever** ce qui se passe dans l'organisme à chaque phase, en complétant le tableau.", "points": "", "lignes": 0, "style_lignes": "", "support_type": "", "reponse_attendue": "", "indice": "Chaque phase correspond à un paragraphe du document.", "reponse_allegee": ""}, "el": {"standard": {"indice": "DOC. 4 : un paragraphe par phase ; chercher l’hormone citée et son effet.", "explication": "Alarme : les glandes surrénales libèrent notamment de l’adrénaline, le cœur bat plus vite et la vigilance augmente. Résistance : elles libèrent notamment du cortisol, qui maintient l’apport d’énergie. Épuisement : la régulation hormonale devient inefficace, les capacités de l’organisme sont débordées."}, "adapte": {"indice": "DOC. 4 : les paragraphes « La résistance » et « L’épuisement ».", "explication": "Résistance : le cortisol maintient l’apport d’énergie. Épuisement : la régulation hormonale devient inefficace, les capacités de l’organisme sont débordées."}, "essentiel": {"indice": "DOC. 4 : le dernier paragraphe.", "explication": "Épuisement : la régulation des hormones devient inefficace. Les capacités de l’organisme sont débordées."}}}, {"id": "a8_s2_q11_tab", "type": "tableau", "data": {"titre": "", "table_preset": "pse", "table_border": "fine", "table_row_height": "normal", "table_student_style": "lines", "cells": [[{"type": "prof", "content": "Phase"}, {"type": "prof", "content": "Ce qui se passe dans l'organisme"}], [{"type": "prof", "content": "1. L'alarme"}, {"type": "eleve", "content": "", "reponse": "Les glandes surrénales libèrent notamment de l'adrénaline : le cœur bat plus vite et la vigilance augmente."}], [{"type": "prof", "content": "2. La résistance"}, {"type": "eleve", "content": "", "reponse": "Les glandes surrénales libèrent notamment du cortisol, qui maintient l'apport d'énergie."}], [{"type": "prof", "content": "3. L'épuisement"}, {"type": "eleve", "content": "", "reponse": "La régulation hormonale devient inefficace : les capacités de l'organisme sont débordées."}]], "variantes": {"adapte": {"cells": [[{"type": "prof", "content": "Phase"}, {"type": "prof", "content": "Ce qui se passe dans l'organisme"}], [{"type": "prof", "content": "1. L'alarme"}, {"type": "prof", "content": "Les glandes surrénales libèrent notamment de l'adrénaline : le cœur bat plus vite et la vigilance augmente."}], [{" sous.\n« L'………………………………………………………………………………………… libérée lors de la phase d'………………………………………………………………………………………… a accéléré son cœur et serré sa gorge. Son organisme se préparait à …………………………………………………………………………………………, et tout est revenu à la normale une fois l'épreuve passée. »", "lignes": 0, "style_lignes": "pointilles", "reponse_attendue": "L'adrénaline libérée lors de la phase d'alarme a accéléré son cœur et serré sa gorge. Son organisme se préparait à agir, et tout est revenu à la normale une fois l'épreuve passée."}, "essentiel": {"texte": "**Expliquer** les manifestations ressenties par Nolan le matin de son oral, en complétant l'explication ci-dessous.\n« L'………………………………………………………………………………………… libérée lors de la phase d'………………………………………………………………………………………… a accéléré son cœur et serré sa gorge. Son organisme se préparait à …………………………………………………………………………………………, et tout est revenu à la normale une fois l'épreuve passée. »\n(Mots à utiliser : adrénaline, alarme, agir.)", "lignes": 0, "style_lignes": "pointilles", "reponse_attendue": "L'adrénaline libérée lors de la phase d'alarme a accéléré son cœur et serré sa gorge. Son organisme se préparait à agir, et tout est revenu à la normale une fois l'épreuve passée."}}}, "el": {"standard": {"indice": "Situation : les signes du matin de l’oral. DOC. 4 : la phase et l’hormone qui accélèrent le cœur.", "explication": "L’adrénaline libérée lors de la phase d’alarme a accéléré le cœur de Nolan et serré sa gorge. L’organisme se préparait à affronter l’oral, puis tout est revenu à la normale."}, "adapte": {"indice": "DOC. 4 : le paragraphe « L’alarme » ; sa dernière phrase indique à quoi se prépare l’organisme.", "explication": "L’adrénaline, libérée lors de la phase d’alarme, accélère le cœur. L’organisme se prépare à agir.", "trous": ["adrénaline|adrenaline", "alarme|l’alarme|l'alarme", "agir|réagir|reagir"]}, "essentiel": {"indice": "DOC. 4 : utiliser les trois mots proposés, dans l’ordre.", "explication": "L’adrénaline de la phase d’alarme accélère le cœur. Le corps se prépare à agir.", "trous": ["adrénaline|adrenaline", "alarme", "agir"]}}}, {"id": "a8_doc5", "type": "document", "data": {"label": "DOC. 5", "titre": "Le stress aigu et le stress chronique", "corps": "**Le stress aigu** est une réaction ponctuelle, limitée à une situation précise : un oral, un contrôle, un imprévu à l'atelier. L'organisme se mobilise, puis revient à son état normal une fois la situation passée. Ce stress est le plus souvent utile : il permet de réagir, même s'il peut être désagréable sur le moment.\n**Le stress chronique** s'installe dans la durée. L'organisme reste mobilisé des semaines ou des mois, sans jamais revenir à son état de repos. Les réserves s'épuisent.\nLes effets ne sont alors plus les mêmes. Le sommeil se dégrade, la fatigue devient permanente, l'irritabilité augmente, la concentration diminue. À plus long terme, un stress qui dure favorise des troubles digestifs, des douleurs, des troubles anxieux et des maladies cardiovasculaires : ce sont les **conséquences pathologiques** du stress.\nDans le monde du travail, un stress professionnel chronique peut conduire à un épuisement professionnel, appelé aussi burnout.", "cadre": true, "source": "", "url_source": "https://www.inrs.fr/risques/stress/effets-sante.html", "date_consultation": "2026-09-01", "date_donnees": "2026", "statut_source": "institutionnelle"}}, {"id": "a8_s2_ch2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 5 :", "reponse_attendue": ""}}, {"id": "a8_s2_q21", "type": "sous_question", "data": {"competence": "C1", "numero": "2.1", "texte": "**Comparer** le stress aigu et le stress chronique, en complétant le tableau.", "points": "", "lignes": 0, "style_lignes": "", "support_type": "", "reponse_attendue": "", "indice": "Le premier paragraphe décrit le stress aigu, le deuxième et le troisième décrivent le stress chronique.", "reponse_allegee": ""}, "el": {"standard": {"indice": "DOC. 5 : le premier paragraphe décrit le stress aigu ; le deuxième et le troisième décrivent le stress chronique.", "explication": "Stress aigu : ponctuel, lié à une situation précise ; l’organisme revient à son état normal. Stress chronique : il s’installe sur des semaines ou des mois ; les réserves s’épuisent et des troubles apparaissent."}, "adapte": {"indice": "DOC. 5 : la durée du stress chronique au deuxième paragraphe ; les effets aux deux premiers paragraphes.", "explication": "Le stress chronique s’installe sur des semaines ou des mois. Après un stress aigu, l’organisme revient à son état normal ; avec un stress chronique, les réserves s’épuisent."}, "essentiel": {"indice": "DOC. 5 : ce qui se passe une fois la situation passée, puis ce qui arrive aux réserves.", "explication": "Stress aigu : l’organisme revient à son état normal. Stress chronique : les réserves s’épuisent et des troubles apparaissent."}}}, {"id": "a8_s2_q21_tab", "type": "tableau", "data": {"titre": "", "table_preset": "pse", "table_border": "fine", "table_row_height": "normal", "table_student_style": "lines", "cells": [[{"type": "prof", "content": "Ce que l'on compare"}, {"type": "prof", "content": "Le stress aigu"}, {"type": "prof", "content": "Le stress chronique"}], [{"type": "prof", "content": "Sa durée"}, {"type": "eleve", "content": "", "reponse": "Il est ponctuel et lié à une situation précise."}, {"type": "eleve", "content": "", "reponse": "Il s'installe sur des semaines ou des mois."}], [{"type": "prof", "content": "Ses effets"}, {"type": "eleve", "content": "", "reponse": "L'organisme revient à son état normal une fois la situation passée."}, {"type": "eleve", "content": "", "reponse": "Les réserves s'épuisent et des troubles apparaissent."}]], "variantes": {"adapte": {"cells": [[{"type": "prof", "content": "Ce que l'on compare"}, {"type": "prof", "content": "Le stress aigu"}, {"type": "prof", "content": "Le stress chronique"}], [{"type": "prof", "content": "Sa durée"}, {"type": "prof", "content": "I "img_h": 880}}, {"id": "a8_s2_ch3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir du document 6 :", "reponse_attendue": ""}}, {"id": "a8_s2_q31", "type": "sous_question", "data": {"competence": "C1", "numero": "3.1", "texte": "**Relever** trois mesures que chacun peut mettre en œuvre pour gérer son stress.", "points": "", "lignes": 3, "style_lignes": "tirets_comptage", "lignes_par_reponse": 1, "support_type": "", "reponse_attendue": "– Dormir suffisamment.\n– Pratiquer une activité physique régulière.\n– Parler à une personne de confiance.", "indice": "", "reponse_allegee": "Dormir {{suffisamment}}. Pratiquer une {{activité physique}}. {{Parler}} à une personne de confiance.", "variantes": {"adapte": {"texte": "**Relever** trois mesures que chacun peut mettre en œuvre pour gérer son stress.\n– Dormir suffisamment.\n– ……………………………………………\n– ……………………………………………", "lignes": 0, "reponse_attendue": "– Dormir suffisamment.\n– Pratiquer une activité physique régulière.\n– Parler à une personne de confiance."}, "essentiel": {"texte": "**Relever** trois mesures que chacun peut mettre en œuvre pour gérer son stress, en cochant trois propositions.\n☐ Dormir suffisamment, à heures régulières.\n☐ Se coucher de plus en plus tard.\n☐ Pratiquer une activité physique régulière.\n☐ Boire des boissons énergisantes le soir.\n☐ Parler à quelqu'un de confiance.", "lignes": 0, "style_lignes": "pointilles", "reponse_attendue": "Dormir suffisamment, à heures régulières.\nPratiquer une activité physique régulière.\nParler à quelqu'un de confiance."}}}, "el": {"standard": {"indice": "DOC. 6 : les six vignettes ; choisir trois légendes.", "explication": "Trois mesures parmi les six : dormir suffisamment, pratiquer une activité physique régulière, parler à une personne de confiance. Organiser son travail, prendre des pauses et réduire les excitants conviennent aussi."}, "adapte": {"indice": "DOC. 6 : la personne qui court, puis les deux personnes qui discutent.", "explication": "Pratiquer une activité physique régulière ; parler à une personne de confiance. Les autres vignettes conviennent aussi.", "ouvert": true}, "essentiel": {"indice": "DOC. 6 : chaque vignette protège le sommeil ou la santé.", "explication": "Dormir suffisamment, pratiquer une activité physique, parler à quelqu’un de confiance. Se coucher tard et boire des boissons énergisantes le soir aggravent le stress."}}}, {"id": "a8_encadre_aide", "type": "encadre", "data": {"variante": "attention", "titre": "Quand demander de l'aide", "texte": "Certains signes doivent conduire à en parler : une fatigue qui dure, des troubles du sommeil qui s'installent, une tristesse persistante, un isolement, une anxiété forte. Ces signes ne se diagnostiquent pas seul. Il faut en parler à une personne de confiance, au médecin traitant, au médecin du travail ou à un psychologue."}}, {"id": "a8_s2_ch4", "type": "question_chapeau", "data": {"numero": "4", "texte": "En revenant à la situation de Nolan :", "reponse_attendue": ""}}, {"id": "a8_s2_q41", "type": "sous_question", "data": {"competence": "C4", "numero": "4.1", "texte": "**Proposer** trois actions que Nolan peut mettre en œuvre pour gérer son stress.", "points": "", "lignes": 3, "style_lignes": "tirets_comptage", "lignes_par_reponse": 2, "support_type": "", "reponse_attendue": "– Se coucher plus tôt pour retrouver un sommeil régulier.\n– Reprendre le football du mercredi.\n– Poser ses questions à son chef d'atelier plutôt que de craindre l'erreur.", "indice": "Reprendre la situation de Nolan et les facteurs classés en séance 1, puis se demander, pour chacun, ce que Nolan peut changer lui-même.", "reponse_allegee": "Se coucher plus {{tôt}}. Reprendre le {{football}}. Poser ses {{questions}} à son chef d'atelier.", "variantes": {"adapte": {"texte": "**Proposer** trois actions que Nolan peut mettre en œuvre pour gérer son stress.\n(Liste : se coucher plus tôt — reprendre le football — poser ses questions à son chef d'atelier — arrêter sa
