<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quelle pratique ? — Les pratiques alimentaires · A7 · Première Bac Pro · PSE</title>
<meta name="description" content="Reconnais la pratique alimentaire de chaque personne — A7 · Doc. 7 et 8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--fond1:#0F3D36;--fond2:#1D5E50;--clair:#F4F8F5;--encre:#13302A;--doux:#5B7A71;--jaune:#FFD23F;--vrai:#2FBF71;--vrai-f:#16733F;--faux:#FF6B57;--faux-f:#B3261E;--ligne:rgba(255,255,255,.22);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--clair);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:1.07rem;line-height:1.45;
  background:radial-gradient(1200px 600px at 15% -10%,rgba(255,210,63,.13),transparent 60%),radial-gradient(900px 700px at 110% 110%,rgba(120,220,180,.14),transparent 60%),linear-gradient(160deg,var(--fond1),var(--fond2));background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--jaune);outline-offset:3px}
.page{max-width:980px;margin:0 auto;padding:1.4rem 1.1rem 3rem}
header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1.9rem,5.5vw,2.8rem);line-height:1.02;margin:0}
header p{margin:.45rem 0 0;opacity:.85;max-width:62ch}
.filtres{display:flex;gap:.5rem;overflow-x:auto;padding:1.1rem .1rem .4rem;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.puce{flex:none;border:2px solid var(--ligne);background:rgba(255,255,255,.06);border-radius:999px;padding:.4rem 1rem;font-weight:700;font-size:1rem}
.puce[aria-pressed="true"]{background:var(--clair);color:var(--encre);border-color:var(--clair)}
.stats{display:flex;gap:.6rem;margin:.8rem 0;flex-wrap:wrap;align-items:center}
.stat{background:rgba(255,255,255,.08);border:2px solid var(--ligne);border-radius:14px;padding:.3rem .8rem;display:flex;gap:.4rem;align-items:baseline}
.stat b{font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat small{opacity:.75}
.stat.feu b{color:var(--jaune)}
.compte{margin-left:auto;font-weight:700;opacity:.85}
.piste{height:6px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin-bottom:1rem}
.piste span{display:block;height:100%;background:var(--jaune);transition:width .3s}
.situation{background:linear-gradient(155deg,#FFFFFF,#EEF4F0);color:var(--encre);border-radius:24px;padding:clamp(1.1rem,3.5vw,1.7rem);box-shadow:0 30px 60px -20px rgba(0,0,0,.55);position:relative}
.situation .qui{font-weight:700;color:var(--doux);font-size:.95rem;display:flex;justify-content:space-between;align-items:center}
.voix{border:0;background:rgba(19,48,42,.08);width:42px;height:42px;border-radius:50%;font-size:1.2rem}
.situation .txt{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(1.25rem,3.5vw,1.6rem);line-height:1.3;margin:.5rem 0 0}
.situation.bon{box-shadow:0 0 0 5px var(--vrai),0 30px 60px -20px rgba(0,0,0,.55)}
.situation.ko{animation:secoue .4s}
@keyframes secoue{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.zone{margin-top:1.1rem}
.zone h2{font-size:.95rem;margin:.6rem 0 .4rem;opacity:.85}
.acteurs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
@media (max-width:720px){.acteurs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.acteur{border:2px solid var(--ligne);background:rgba(255,255,255,.08);border-radius:16px;padding:.7rem .6rem;text-align:left;display:flex;gap:.55rem;align-items:center;min-height:64px;font-weight:700;line-height:1.2;transition:background .15s,transform .12s}
.acteur:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.acteur .ic{font-size:1.5rem;line-height:1;flex:none}
.acteur small{display:block;font-weight:400;opacity:.8;font-size:.8rem}
.acteur:disabled{cursor:default;transform:none}
.acteur.bon{background:var(--vrai);border-color:var(--vrai);color:#04230F}
.acteur.mauvais{background:rgba(255,107,87,.25);border-color:var(--faux);opacity:.75}
.fb{margin-top:1rem;border-radius:14px;color:var(--encre)}
.fb:not(:empty){padding:.75rem .95rem}
.fb.ok{background:#DDF4E7;border-left:6px solid var(--vrai-f)}
.fb.ko{background:#FFE3DE;border-left:6px solid var(--faux-f)}
.continuer{width:100%;height:56px;border-radius:999px;border:0;background:var(--jaune);color:#2A2200;font-weight:700;font-size:1.08rem;margin-top:.9rem}
.fin{background:var(--clair);color:var(--encre);border-radius:24px;padding:1.4rem 1.6rem;box-shadow:0 30px 60px -25px rgba(0,0,0,.6)}
.fin h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.9rem;margin:0}
.gros{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:3.4rem;line-height:1;margin:.5rem 0}
.gros small{font-size:.4em;color:var(--doux)}
.fin ul{list-style:none;padding:0}
.fin li{border-left:5px solid var(--faux);padding:.3rem 0 .3rem .8rem;margin-bottom:.6rem}
.fin .continuer{background:var(--encre);color:var(--clair)}
.fin .sec{background:transparent;color:var(--encre);border:2px solid var(--encre)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.situation.ko{animation:none}.acteur{transition:none}}

.fil{margin:0 0 .7rem}
.fil a{color:var(--clair);opacity:.85;text-decoration:underline;text-underline-offset:4px;font-size:1rem;padding:.35rem .1rem;display:inline-block}
.fil a:hover{opacity:1}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Quelle pratique ?</h1>
    <p>Reconnais la pratique alimentaire de chaque personne — A7 · Doc. 7 et 8</p>
  </header>
  <nav class="fil" aria-label="Fil d'Ariane"><a href="bcp_1ere_A7_jeux.html">← Toutes les révisions A7</a></nav>
  <nav class="filtres" id="filtres" aria-label="Choisir la séance"></nav>
  <div class="stats">
    <div class="stat"><b id="sScore">0</b><small>justes</small></div>
    <div class="stat feu"><b id="sSerie">0</b><small>🔥 série</small></div>
    <div class="stat"><b id="sRecord">0</b><small>🏆 record</small></div>
    <span class="compte" id="sPos"></span>
  </div>
  <div class="piste" aria-hidden="true"><span id="barre"></span></div>
  <main id="jeu"></main>
  <div class="sr" aria-live="polite" id="annonce"></div>
</div>
<script>
(function(){const S=window.SpeechSynthesisUtterance;if(!S)return;
 const sig=t=>String(t).replace(/\bkcal\b/g,"kilocalories").replace(/\bkJ\b/g,"kilojoules").replace(/CO2/g,"C O 2").replace(/\bE (\d+)/g,"E $1").replace(/(\d+),(\d+) g\b/g,"$1 virgule $2 grammes").replace(/(\d+) g\b/g,"$1 grammes").replace(/÷/g," divisé par ").replace(/×/g," fois ");
 window.SpeechSynthesisUtterance=function(t){return new S(sig(t))};})();

const ACTEURS={
 omni:{ic:"🍽️",nom:"Omnivore",role:"Omnivore : aliments d'origine animale et végétale."},
 flex:{ic:"🥗",nom:"Flexitarienne",role:"Flexitarienne : n'exclut rien, mais davantage de protéines végétales, moins de viande et de poisson."},
 vege:{ic:"🥚",nom:"Végétarienne",role:"Végétarienne : exclut la chair animale, mais consomme œufs et produits laitiers."},
 vegl:{ic:"🌱",nom:"Végétalienne",role:"Végétalienne : exclut tous les aliments d'origine animale, y compris œufs, lait et miel."},
 sg:{ic:"🌾",nom:"Sans gluten",role:"Sans gluten : exclut les aliments contenant du gluten (blé, seigle, orge)."}
};
const SITUATIONS=[
 {s:2,a:"vege",t:"Lina ne mange plus de viande ni de poisson, mais des œufs, des yaourts et du fromage."},
 {s:2,a:"sg",t:"Hugo supprime le pain, les pâtes, les pizzas et les gâteaux, et vérifie chaque étiquette."},
 {s:2,a:"flex",t:"Nadia mange de tout, mais ne prend de la viande que deux fois par semaine."},
 {s:2,a:"omni",t:"Victor mange un sandwich jambon-beurre, des chips et des barres chocolatées."},
 {s:2,a:"vegl",t:"Une personne ne mange ni viande, ni poisson, ni œufs, ni lait, ni miel."},
 {s:2,a:"vegl",t:"Une personne prend de la vitamine B12 en complément, car elle ne mange aucun produit d'origine animale."},
 {s:2,a:"omni",t:"Un salarié mange de la viande, du poisson, des légumes et des fruits, sans rien exclure."},
 {s:2,a:"vege",t:"Une étudiante mange des omelettes et des pois chiches, mais jamais de jambon."},
 {s:2,a:"flex",t:"Un cuisinier réduit la viande et cuisine surtout des lentilles, sans rien s'interdire."},
 {s:2,a:"sg",t:"Une personne évite le blé, le seigle et l'orge sur ordre de son médecin."},
 {s:2,a:"vegl",t:"Une personne remplace le lait de vache par une boisson au soja et refuse le miel."},
 {s:2,a:"sg",t:"Un adolescent intolérant choisit des produits marqués « sans gluten »."}
];
const $=id=>document.getElementById(id);
function annoncer(t){$("annonce").textContent=t}
const CLE="pratiques-A7";let pref={record:0};
try{pref=Object.assign(pref,JSON.parse(localStorage.getItem(CLE)||"{}"))}catch(e){}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(pref))}catch(e){}}
function melanger(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let seance=0,paquet,pos,score,serie,erreurs,premier,resolu;

function filtres(){
  $("filtres").innerHTML=[[0,"Toutes les situations"]].map(([v,t])=>`<button class="puce" data-s="${v}" aria-pressed="${v===seance}">${t}</button>`).join("");
  $("filtres").querySelectorAll(".puce").forEach(b=>b.onclick=()=>{seance=+b.dataset.s;filtres();demarrer()});
}
function stats(){$("sScore").textContent=score;$("sSerie").textContent=serie;$("sRecord").textContent=pref.record;$("sPos").textContent=pos<paquet.length?`${pos+1} / ${paquet.length}`:"";$("barre").style.width=(pos/paquet.length*100)+"%"}
function demarrer(liste){paquet=liste||melanger(SITUATIONS.filter(x=>!seance||x.s===seance));pos=0;score=0;serie=0;erreurs=[];question()}
function bouton(k){const A=ACTEURS[k];return `<button class="acteur" data-a="${k}"><span class="ic" aria-hidden="true">${A.ic}</span><span>${A.nom}${A.sous?`<small>${A.sous}</small>`:""}</span></button>`}
function question(){
  if(pos>=paquet.length){fin();return}
  const S=paquet[pos];resolu=false;premier=true;
  $("jeu").innerHTML=`<section class="situation" id="sit"><div class="qui"><span>Quelle pratique ?</span><button class="voix" id="bVoix" aria-label="Écouter la situation">🔊</button></div><p class="txt">${S.t}</p></section>
    <div class="zone"><h2>De tout, ou presque</h2><div class="acteurs">${["omni","flex","vege"].map(bouton).join("")}</div>
    <h2>Exclure des aliments</h2><div class="acteurs">${["vegl","sg"].map(bouton).join("")}</div></div>
    <div class="fb" id="fb" role="status" aria-live="polite"></div><div id="suite"></div>`;
  $("bVoix").onclick=()=>lire(S.t);
  $("jeu").querySelectorAll(".acteur").forEach(b=>b.onclick=()=>choisir(b,S));
  stats();annoncer(`Situation : ${S.t}`);
}
function choisir(b,S){
  if(resolu)return;const k=b.dataset.a,A=ACTEURS[S.a];
  if(k===S.a){
    resolu=true;b.classList.add("bon");$("sit").classList.add("bon");
    $("jeu").querySelectorAll(".acteur").forEach(x=>x.disabled=true);
    if(premier){score++;serie++;if(serie>pref.record){pref.record=serie;sauver()}}
    const f=$("fb");f.className="fb ok";f.innerHTML=`<b>✓ ${premier?"Bien vu !":"Oui, c'est la bonne pratique."}</b> ${A.role}`;
    const c=document.createElement("button");c.className="continuer";c.textContent=pos<paquet.length-1?"Situation suivante":"Voir mon résultat";
    c.onclick=()=>{arreterVoix();pos++;question()};$("suite").appendChild(c);c.focus({preventScroll:true});
  }else{
    if(premier){premier=false;serie=0;erreurs.push(S);if(navigator.vibrate)navigator.vibrate(50)}
    b.classList.add("mauvais");b.disabled=true;
    const sit=$("sit");sit.classList.remove("ko");void sit.offsetWidth;sit.classList.add("ko");
    const f=$("fb");f.className="fb ko";f.innerHTML=`<b>Pas cette pratique.</b> ${ACTEURS[k].role} Réessaie.`;
  }
  stats();
}
function fin(){
  stats();
  $("jeu").innerHTML=`<div class="fin"><h2>${score===paquet.length?"Sans faute !":"Toutes les situations traitées"}</h2>
    <div class="gros">${score}<small> / ${paquet.length}</small></div><p>🏆 Record de série : <b>${pref.record}</b></p>
    ${erreurs.length?`<p><b>À revoir :</b></p><ul>${erreurs.map(x=>`<li>${x.t}<br><b>→ ${ACTEURS[x.a].nom}${ACTEURS[x.a].sous?" ("+ACTEURS[x.a].sous+")":""}</b></li>`).join("")}</ul>
      <button class="continuer" id="bErr">Rejouer mes ${erreurs.length} erreur${erreurs.length>1?"s":""}</button>`:""}
    <button class="continuer ${erreurs.length?"sec":""}" id="bRej">Nouvelle partie</button></div>`;
  if($("bErr")){const e=erreurs.slice();$("bErr").onclick=()=>demarrer(melanger(e))}
  $("bRej").onclick=()=>demarrer();
}
let voix=null;
function choisirVoix(){const l=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));voix=l.find(x=>/fr-FR/i.test(x.lang)&&/(google|natural|online|amélie|thomas|denise|henri)/i.test(x.name))||l.find(x=>/fr-FR/i.test(x.lang))||l[0]||null}
if("speechSynthesis" in window){choisirVoix();speechSynthesis.onvoiceschanged=choisirVoix}
function lire(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\bCSE\b/g,"C S E").replace(/\bDUERP\b/g,"D U E R P").replace(/AT\/MP/g,"A T M P"));u.lang="fr-FR";if(voix)u.voice=voix;u.rate=.95;speechSynthesis.speak(u)}
function arreterVoix(){if("speechSynthesis" in window)speechSynthesis.cancel()}
filtres();demarrer();
</script>
</body>
</html>
