t un travail. L’employeur verse une rémunération. Le salarié suit les consignes de l’employeur : c’est le lien de subordination.", "cherche": [{"bloc": "c1_doc1", "texte": "Un travail"}, {"bloc": "c1_doc1", "texte": "Une rémunération"}, {"bloc": "c1_doc1", "texte": "Un lien de subordination"}]}}}, {"id": "c1_q21_ess", "type": "cocher_exactes", "data": {"competence": "C1", "numero": "2.1", "consigne": "**Cocher** les trois éléments qui définissent un contrat de travail.", "items": [{"texte": "Un diplôme", "correct": false}, {"texte": "Un travail", "correct": true}, {"texte": "Un logement", "correct": false}, {"texte": "Une rémunération (le salaire)", "correct": true}, {"texte": "Un lien de subordination", "correct": true}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 1 : les mots écrits après les numéros 1, 2 et 3.", "explication": "Un contrat de travail, c’est : un travail, une rémunération (le salaire) et un lien de subordination (l’employeur donne des consignes). Le diplôme et le logement n’en font pas partie.", "cherche": [{"bloc": "c1_doc1", "texte": "Un travail"}, {"bloc": "c1_doc1", "texte": "Une rémunération"}, {"bloc": "c1_doc1", "texte": "Un lien de subordination"}]}}}, {"id": "c1_q22", "type": "relier", "data": {"competence": "C3", "numero": "2.2", "titre": "", "consigne": "**Associer** chaque situation à l’élément du contrat de travail qu’elle illustre.", "gauche": ["Un salarié met les produits en rayon", "Un salarié reçoit sa fiche de paie", "Un salarié applique les consignes données par sa responsable"], "droite": ["Le lien de subordination", "Le travail fourni", "La rémunération"], "indice": "", "variantes": {"adapte": {"indice": "Trois éléments définissent le contrat de travail."}, "essentiel": {"indice": "Trois situations, trois éléments du contrat de travail."}}, "correspondances": [1, 2, 0]}, "el": {"standard": {"indice": "Pour chaque situation, se demander : le salarié travaille ? il est payé ? il suit un ordre ?", "explication": "Mettre les produits en rayon, c’est le travail fourni. La fiche de paie montre le salaire : c’est la rémunération. Appliquer les consignes de la responsable, c’est le lien de subordination.", "cherche": [{"bloc": "c1_doc1", "texte": "le salarié fournit un travail"}, {"bloc": "c1_doc1", "texte": "l’employeur verse un salaire"}, {"bloc": "c1_doc1", "texte": "le salarié travaille sous la direction de l’employeur"}]}, "adapte": {"indice": "Trois éléments : le travail, la rémunération, le lien de subordination. Pour chaque situation : travailler, être payé ou obéir ?", "explication": "Mettre en rayon = travailler : le travail fourni. La fiche de paie = le salaire : la rémunération. Suivre les consignes = obéir : le lien de subordination.", "cherche": [{"bloc": "c1_doc1", "texte": "le salarié fournit un travail"}, {"bloc": "c1_doc1", "texte": "l’employeur verse un salaire"}, {"bloc": "c1_doc1", "texte": "le salarié travaille sous la direction de l’employeur"}]}, "essentiel": {"indice": "Travailler = le travail. Être payé = la rémunération. Suivre les consignes = le lien de subordination.", "explication": "Mettre en rayon : le travail fourni. La fiche de paie : la rémunération. Suivre les consignes : le lien de subordination.", "cherche": [{"bloc": "c1_doc1", "texte": "le salarié fournit un travail"}, {"bloc": "c1_doc1", "texte": "l’employeur verse un salaire"}, {"bloc": "c1_doc1", "texte": "l’employeur donne des consignes au salarié"}]}}}, {"id": "c1_doc2", "type": "document_texte_image", "data": {"label": "DOC. 2", "titre": "Trois contrats de travail", "corps": "Il existe trois contrats de travail principaux.\n**1. Le CDI** (contrat à durée indéterminée)\nIl n’a **pas de date de fin** : c’est un emploi durable. Il prend fin par une démission, un licenciement ou une rupture conventionnelle. Il ne donne pas droit à une indemnité de fin de contrat.\n**2. Le CDD** (contrat à durée déterminée)\nIl est **obligatoirement écrit**. Il indique une **date de fin** (ou une durée minimale) et le **motif** du contrat : remplacement d’un salarié absent, surcroît d’activité, emploi saisonnier. À la fin du contrat, le salarié perçoit le plus souvent une indemnité de fin de contrat d’au moins **10 %** de la rémunération brute totale.\n**3. Le contrat de mission** (intérim)\nIl est lui aussi **obligatoirement écrit**. Le salarié est employé par une entreprise de travail temporaire et il effectue sa mission dans une autre entreprise, appelée **entreprise utilisatrice**. À la fin de la mission, il perçoit le plus souvent une indemnité de fin de mission d’au moins **10 %** de la rémunération brute totale.", "source": "Service-public.gouv.fr, fiches CDD, contrat de travail temporaire et fin de CDD.", "variantes": {"adapte": {"corps": "Il existe trois contrats de travail principaux.\n**1. Le CDI** (contrat à durée indéterminée)\nIl n’a **pas de date de fin** : c’est un emploi durable. Il ne donne pas droit à une indemnité de fin de contrat.\n**2. Le CDD** (contrat à durée déterminée)\nIl est **obligatoirement écrit**. Il indique une **date de fin** (ou une durée minimale) et le **motif** du contrat : remplacement d’un salarié absent, surcroît d’activité, emploi saisonnier. À la fin du contrat, le salarié perçoit le plus souvent une indemnité de fin de contrat d’au moins **10 %** de la rémunération brute totale.\n**3. Le contrat de mission** (intérim)\nIl est écrit. Le salarié est employé par une entreprise de travail temporaire et il travaille dans une autre entreprise, appelée **entreprise utilisatrice**. À la fin de la mission, il perçoit le plus souvent une indemnité de fin de mission d’au moins **10 %** de la rémunération brute totale."}, "essentiel": {"corps": "Il existe trois contrats de travail principaux.\n**1. Le CDI** : il n’a **pas de date de fin**. C’est un emploi durable.\n**2. Le CDD** : il a une **date de fin**. Il est toujours écrit. À la fin du contrat, le salarié reçoit une indemnité de fin de contrat.\n**3. Le contrat de mission** (intérim) : le salarié travaille dans une autre entreprise que celle qui l’emploie."}}, "img": "cap_C1/images/C1_DOC2_trois_contrats.jpg", "img_w": 950, "img_h": 572, "img_desc": "Planche illustrée en trois colonnes. Colonne CDI, contrat à durée indéterminée : pas de date de fin, emploi durable ; prend fin par une démission, un licenciement ou une rupture conventionnelle ; pas d’indemnité de fin de contrat. Colonne CDD, contrat à durée déterminée : obligatoirement écrit, indique une date de fin ou une durée minimale ; précise le motif, remplacement d’un salarié absent, surcroît d’activité, emploi saisonnier ; à la fin du contrat, indemnité de fin de contrat d’au moins 10 % de la rémunération brute totale. Colonne contrat de mission, intérim : obligatoirement écrit ; le salarié est employé par une entreprise de travail temporaire mais il travaille dans une autre entreprise, appelée entreprise utilisatrice ; à la fin de la mission, indemnité de fin de mission d’au moins 10 % de la rémunération brute totale.", "image_pos": "bas"}}, {"id": "c1_ch3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir du document 2 :", "reponse_attendue": ""}}, {"id": "c1_q31", "type": "sous_question", "data": {"competence": "C1", "numero": "3.1", "texte": "**Indiquer** dans le tableau la durée et l’indemnité de fin de contrat du CDI et du CDD.", "points": "", "lignes": 0, "style_lignes": "", "reponse_attendue": "Durée du contrat : CDI, pas de date de fin ; CDD, une date de fin. — Indemnité de fin de contrat : CDI, pas d’indemnité de fin de contrat ; CDD, au moins 10 %.", "indice": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {}}}, "el": {"standard": {"indice": "DOC. 2 : pour le CDI puis pour le CDD, chercher « date de fin » et « indemnité ».", "explication": "Le CDI n’a pas de date de fin et ne donne pas d’indemnité de fin de contrat. Le CDD a une date de fin ; à la fin, le salarié reçoit le plus souvent au moins 10 % de ce qu’il a gagné.", "cherche": nce d’intérim**, ou entreprise de travail temporaire (exemple : ALPHA) : elle embauche l’intérimaire et lui verse son salaire.\n**3. L’entreprise utilisatrice** (exemple : DUPONT) : c’est là que l’intérimaire effectue sa mission.\nL’intérimaire et l’agence d’intérim signent un **contrat de mission**.\nL’agence d’intérim et l’entreprise utilisatrice signent un **contrat de mise à disposition**.\nÀ la fin de sa mission, l’intérimaire perçoit une indemnité de fin de mission d’au moins **10 %** de sa rémunération brute totale.", "source": "Service-public.gouv.fr, « Contrat de travail temporaire (intérim) ».", "variantes": {"adapte": {"corps": "Le travail en intérim fait intervenir **trois acteurs**.\n**1. Le salarié intérimaire** : c’est la personne qui travaille.\n**2. L’agence d’intérim** (exemple : ALPHA) : elle embauche l’intérimaire et lui verse son salaire.\n**3. L’entreprise utilisatrice** (exemple : DUPONT) : c’est là que l’intérimaire travaille.\nL’intérimaire signe un **contrat de mission** avec l’agence d’intérim.\nL’agence d’intérim signe un **contrat de mise à disposition** avec l’entreprise utilisatrice."}, "essentiel": {"corps": "Il y a **trois acteurs**.\n**1. Le salarié intérimaire** : il travaille.\n**2. L’agence d’intérim** (exemple : ALPHA) : elle paie le salarié.\n**3. L’entreprise utilisatrice** (exemple : DUPONT) : le salarié y travaille."}}, "img": "cap_C1/images/C1_DOC3_interim.jpg", "img_w": 950, "img_h": 633, "img_desc": "Planche illustrée en cinq volets numérotés. 1, le salarié intérimaire signe un contrat de mission avec l’agence d’intérim, par exemple pour trois mois. 2, l’agence d’intérim signe un contrat de mise à disposition avec l’entreprise utilisatrice. 3, le salarié intérimaire travaille dans l’entreprise utilisatrice pendant la mission. 4, le salaire : l’agence d’intérim verse le salaire au salarié intérimaire. 5, fin de la mission : indemnité de fin de mission d’au moins 10 % de la rémunération brute totale de la mission.", "image_  permet d’obtenir une **qualification professionnelle** reconnue. Le salarié partage son temps entre l’entreprise et un **organisme de formation**."}, "essentiel": {"corps": "Il existe deux contrats en alternance.\n**1. Le contrat d’apprentissage** : il prépare un **diplôme**. L’apprenti travaille dans une entreprise et suit des cours dans un **centre de formation (CFA)**.\n**2. Le contrat de professionnalisation** : il prépare une **qualification professionnelle**."}}, "img": "cap_C1/images/C1_DOC4_alternance.jpg", "img_w": 950, "img_h": 633, "img_desc": "Planche illustrée en deux colonnes. Colonne contrat d’apprentissage : préparer un diplôme ou un titre professionnel ; pour les jeunes de 16 à 29 ans révolus ; une formation en alternance entre l’entreprise et le centre de formation d’apprentis (CFA) ; durée de 6 mois à 3 ans, le contrat pouvant être conclu pour une durée limitée ou en CDI. Colonne contrat de professionnalisation : obtenir une qualification professionnelle reconnue ; pour les jeunes de 16 à 25 ans révolus et les demandeurs d’emploi de 26 ans et plus ; une formation en alternance entre l’entreprise et un organisme de formation ; le contrat peut être conclu en CDD ou en CDI.", "image_pos": "bas"}}, {"id": "c1_ch5", "type": "question_chapeau", "data": {"numero": "5", "texte": "À partir des documents 2, 3 et 4 :", "reponse_attendue": ""}}, {"id": "c1_q51r", "type": "relier", "data": {"competence": "C3", "numero": "5.1", "titre": "", "consigne": "**Relier** chaque situation au contrat qui lui correspond.", "gauche": ["Remplacer une salariée absente pendant quatre mois", "Occuper un emploi durable, sans date de fin prévue", "Être employé par une agence et travailler trois semaines dans un magasin", "Préparer un bac professionnel en partageant son temps entre l’entreprise et le CFA", "Obtenir une qualification professionnelle en alternant travail en entreprise et formation"], "droite": ["Le contrat de mission", "Le CDD", "Le contrat de professionnalisation", "Le CDI", "Le contrat d’apprentissage"], "indice": "", "variantes": {"adapte": {"indice": "Repérer d’abord la durée annoncée dans chaque situation."}, "essentiel": {"indice": "Repérer d’abord la durée annoncée dans chaque situation."}}, "correspondances": [1, 3, 0, 4, 2]}, "el": {"standard": {"indice": "Pour chaque situation : a-t-elle une date de fin ? passe-t-elle par une agence ? prépare-t-elle un diplôme ou une qualification ?", "explication": "Remplacer une salariée pendant quatre mois : durée limitée, c’est un CDD. Un emploi durable, sans date de fin : le CDI. Employé par une agence pour travailler dans un magasin : le contrat de mission. Préparer un bac pro entre l’entreprise et le CFA : le contrat d’apprentissage. Obtenir une qualification en alternance : le contrat de professionnalisation.", "cherche": [{"bloc": "c1_doc2", "texte": "pas de date de fin"}, {"bloc": "c1_doc2", "texte": "remplacement d’un salarié absent"}, {"bloc": "c1_doc2", "texte": "entreprise utilisatrice"}, {"bloc": "c1_doc4a", "texte": "centre de formation d’apprentis (CFA)"}, {"bloc": "c1_doc4a", "texte": "qualification professionnelle"}]}, "adapte": {"indice": "Repérer d’abord la durée : sans fin = CDI, avec une fin = CDD. Puis : agence = mission ; CFA = apprentissage ; qualification = professionnalisation.", "explication": "Quatre mois de remplacement : CDD. Emploi durable : CDI. Agence et magasin : contrat de mission. Bac pro et CFA : apprentissage. Qualification en alternance : professionnalisation.", "cherche": [{"bloc": "c1_doc2", "texte": "pas de date de fin"}, {"bloc": "c1_doc2", "texte": "remplacement d’un salarié absent"}, {"bloc": "c1_doc2", "texte": "entreprise utilisatrice"}, {"bloc": "c1_doc4a", "texte": "centre de formation d’apprentis (CFA)"}, {"bloc": "c1_doc4a", "texte": "qualification professionnelle"}]}, "essentiel": {"indice": "Sans date de fin = CDI. Avec une date de fin = CDD. Une agence = contrat de mission. Un diplôme avec le CFA = apprentissage. Une qualific s obligations.", "source": "Service-public.gouv.fr et Code du travail numérique.", "variantes": {"essentiel": {"corps": "**Le salarié**\n• Il doit : réaliser le travail prévu, respecter les consignes de sécurité.\n• Il a le droit de : percevoir sa rémunération, bénéficier d’une protection sociale.\n**L’employeur**\n• Il doit : verser la rémunération, assurer la sécurité des salariés.\n• Il a le droit de : organiser le travail, sanctionner un salarié qui ne respecte pas ses obligations."}}, "img": "cap_C1/images/C1_DOC6_droits_obligations.jpg", "img_w": 950, "img_h": 633, "img_desc": "Planche illustrée en deux colonnes. Colonne le salarié. Ses obligations : réaliser le travail prévu au contrat, respecter les horaires, respecter les consignes de sécurité, respecter le règlement intérieur. Ses droits : percevoir sa rémunération, travailler dans des conditions de sécurité, bénéficier d’une protection sociale. Colonne l’employeur. Ses obligations : fournir le travail prévu au contrat, verser la rémunération, assurer la sécurité des salariés, respecter le Code du travail, la convention collective et le contrat. Ses droits : organiser le travail et donner des instructions, sanctionner un salarié qui ne respecte pas ses obligations.", "image_pos": "bas"}}, {"id": "c1_ch7", "type": "question_chapeau", "data": {"numero": "7", "texte": "À partir du document 6 :", "reponse_attendue": ""}}, {"id": "c1_q71c", "type": "classer", "data": {"competence": "C1", "numero": "7.1", "titre": "", "consigne": "**Classer** chaque affirmation dans la bonne catégorie.", "categories": ["Droit du salarié", "Obligation du salarié", "Obligation de l’employeur"], "items": ["Percevoir sa rémunération", "Respecter les consignes de sécurité", "Assurer la sécurité des salariés", "Réaliser le travail prévu au contrat", "Verser la rémunération", "Bénéficier d’une protection sociale"], "classement": [0, 1, 2, 1, 2, 0], "indice": "", "variantes": {"adapte": {"indice": "Repérer d’abord si l’affirmation concerne le salarié ou l’employeur."}, "essentiel": {"indice": "Aide : 1 est un droit du salarié, 2 une obligation du salarié, 3 une obligation de l’employeur."}}}, "el": {"standard": {"indice": "DOC. 6 : chaque affirmation concerne-t-elle le salarié ou l’employeur ? Puis : est-ce ce qu’il doit faire (obligation) ou ce qu’il peut exiger (droit) ?", "explication": "Percevoir sa rémunération et bénéficier d’une protection sociale : droits du salarié. Respecter les consignes de sécurité et réaliser le travail prévu : obligations du salarié. Assurer la sécurité et verser la rémunération : obligations de l’employeur.", "cherche": [{"bloc": "c1_s2doc2", "texte": "percevoir sa rémunération"}, {"bloc": "c1_s2doc2", "texte": "bénéficier d’une protection sociale"}, {"bloc": "c1_s2doc2", "texte": "respecter les consignes de sécurité"}, {"bloc": "c1_s2doc2", "texte": "réaliser le travail prévu au contrat"}, {"bloc": "c1_s2doc2", "texte": "verser la rémunération"}, {"bloc": "c1_s2doc2", "texte": "assurer la sécurité des salariés"}]}, "adapte": {"indice": "Repérer d’abord si l’affirmation concerne le salarié ou l’employeur. DOC. 6 : obligation = ce qu’on doit faire.", "explication": "Droits du salarié : percevoir sa rémunération, bénéficier d’une protection sociale. Obligations du salarié : respecter les consignes de sécurité, réaliser le travail prévu. Obligations de l’employeur : assurer la sécurité, verser la rémunération.", "cherche": [{"bloc": "c1_s2doc2", "texte": "percevoir sa rémunération"}, {"bloc": "c1_s2doc2", "texte": "bénéficier d’une protection sociale"}, {"bloc": "c1_s2doc2", "texte": "respecter les consignes de sécurité"}, {"bloc": "c1_s2doc2", "texte": "réaliser le travail prévu au contrat"}, {"bloc": "c1_s2doc2", "texte": "verser la rémunération"}, {"bloc": "c1_s2doc2", "texte": "assurer la sécurité des salariés"}]}, "essentiel": {"indice": "DOC. 6 : « Il a le droit de » = droit du salarié. « Il doit » = obligation.", "explication": "Le salarié a le droit de percevoi
