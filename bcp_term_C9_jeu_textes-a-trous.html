<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Textes à trous — Les risques psychosociaux · C9 · Terminale Bac Pro · PSE</title>
<meta name="description" content="Complète les phrases du cours avec les bons mots — C9 · Les risques psychosociaux">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--fond1:#0F3D36;--fond2:#1D5E50;--clair:#F4F8F5;--encre:#13302A;--doux:#5B7A71;--jaune:#FFD23F;--vrai:#2FBF71;--vrai-f:#16733F;--faux:#FF6B57;--faux-f:#B3261E;--ligne:rgba(255,255,255,.22);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--clair);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:1.08rem;line-height:1.5;
  background:radial-gradient(1200px 600px at 15% -10%,rgba(255,210,63,.13),transparent 60%),radial-gradient(900px 700px at 110% 110%,rgba(120,220,180,.14),transparent 60%),linear-gradient(160deg,var(--fond1),var(--fond2));background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--jaune);outline-offset:3px}
.page{max-width:900px;margin:0 auto;padding:1.4rem 1.1rem 3rem}
header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1.9rem,5.5vw,2.8rem);line-height:1.02;margin:0}
header p{margin:.45rem 0 0;opacity:.85}
.barre{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:1.1rem 0 .4rem}
.mode{display:inline-grid;grid-template-columns:1fr 1fr;border:2px solid var(--ligne);border-radius:999px;overflow:hidden;margin-left:auto}
.mode button{border:0;background:transparent;padding:.35rem .9rem;font-weight:700}
.mode button[aria-pressed="true"]{background:var(--clair);color:var(--encre)}
.textes{display:flex;gap:.45rem;overflow-x:auto;padding:.4rem .1rem .6rem;scrollbar-width:none}
.textes::-webkit-scrollbar{display:none}
.puce{flex:none;border:2px solid var(--ligne);background:rgba(255,255,255,.06);border-radius:999px;padding:.35rem .9rem;font-weight:700;font-size:.95rem}
.puce small{opacity:.75;font-weight:400}
.puce[aria-pressed="true"]{background:var(--clair);color:var(--encre);border-color:var(--clair)}
.puce .et{color:var(--jaune);margin-left:.3rem}
.puce[aria-pressed="true"] .et{color:#B8860B}
.carte{background:var(--clair);color:var(--encre);border-radius:24px;padding:clamp(1.1rem,3.5vw,1.9rem);box-shadow:0 30px 60px -25px rgba(0,0,0,.6);margin-top:.6rem}
.carte h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.35rem;margin:0 0 .2rem}
.consigne{margin:0 0 1rem;color:var(--doux);font-weight:700}
.consigne b{color:#8A6A00}
.texte{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(1.2rem,3.3vw,1.5rem);line-height:2.1;margin:0}
.trou{display:inline-block;min-width:7.5rem;height:2.4rem;line-height:1.9rem;vertical-align:baseline;border:0;border-bottom:3px dashed #8A958F;background:#E7EEEA;border-radius:10px 10px 4px 4px;padding:0 .6rem;margin:0 .15rem;
  font-family:"Atkinson Hyperlegible",sans-serif;font-weight:700;font-size:1.05rem;color:var(--encre);transition:background .15s}
.trou.plein{border-bottom-style:solid;border-bottom-color:var(--encre);background:#FFF4C2}
.trou.cible,.trou.survol{background:#FFE58A;box-shadow:0 0 0 3px #E0A800}
.trou.bon{background:#D6F3E3;border-bottom-color:var(--vrai-f);cursor:default}
.trou.faux{animation:secoue .45s;background:#FFDCD6}
@keyframes secoue{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.banque{margin-top:1.3rem;border:2px dashed #B9C5BE;border-radius:18px;padding:.8rem;min-height:70px;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.banque.survol{background:#EEF3F0}
.banque .vide{color:var(--doux);font-style:italic}
.mot{border:0;background:var(--encre);color:var(--clair);border-radius:12px;padding:.5rem .9rem;font-weight:700;font-size:1.05rem;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;box-shadow:0 6px 14px -8px rgba(0,0,0,.6)}
.mot[aria-pressed="true"]{outline:4px solid var(--jaune);outline-offset:2px;transform:translateY(-2px)}
.mot.fantome{opacity:.25}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(-3deg) scale(1.05)}
.aide{min-height:1.5rem;margin:.7rem 0 0;font-weight:700;color:#8A6A00}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.verifier{flex:1 1 220px;height:56px;border-radius:999px;border:0;background:var(--encre);color:var(--clair);font-weight:700;font-size:1.1rem}
.verifier:disabled{opacity:.4;cursor:default}
.sec{height:56px;border-radius:999px;border:2px solid #B9C5BE;background:transparent;font-weight:700;padding:0 1.1rem}
.fb{margin-top:.8rem;border-radius:14px}
.fb:not(:empty){padding:.7rem .9rem}
.fb.ok{background:#DDF4E7;border-left:6px solid var(--vrai-f)}
.fb.ko{background:#FFE3DE;border-left:6px solid var(--faux-f)}
.etoiles{font-size:2rem;color:#E0A800;letter-spacing:.15rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.trou.faux{animation:none}}

.fil{margin:0 0 .7rem}
.fil a{color:var(--clair);opacity:.85;text-decoration:underline;text-underline-offset:4px;font-size:1rem;padding:.35rem .1rem;display:inline-block}
.fil a:hover{opacity:1}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Textes à trous</h1>
    <p>Complète les phrases du cours avec les bons mots — C9 · Les risques psychosociaux</p>
  </header>
  <nav class="fil" aria-label="Fil d'Ariane"><a href="bcp_term_C9_jeux.html">← Toutes les révisions C9</a></nav>
  <div class="barre">
    <div class="mode" role="group" aria-label="Niveau">
      <button id="mFacile" aria-pressed="true">Facile</button>
      <button id="mExpert" aria-pressed="false">Expert</button>
    </div>
  </div>
  <nav class="textes" id="textes" aria-label="Choisir un texte"></nav>
  <main class="carte" id="carte"></main>
  <div class="sr" aria-live="polite" id="annonce"></div>
</div>
<script>
(function(){const S=window.SpeechSynthesisUtterance;if(!S)return;
 const sig=t=>String(t).replace(/\bRPS\b/g,"R P S").replace(/\bCSE\b/g,"C S E").replace(/\bPFMP\b/g,"P F M P").replace(/\bL\. ?(\d)/g,"L $1").replace(/turn-over/g,"teurne-auveur");
 window.SpeechSynthesisUtterance=function(t){return new S(sig(t))};})();

/* ===== TEXTES — [mot] = trou · pieges = mots en plus en mode expert ===== */
const TEXTES=[
 {id:"rps",s:1,titre:"Les RPS",texte:"Les risques psychosociaux sont des risques pour la santé physique et [mentale] des travailleurs. Leurs causes se trouvent dans les conditions d'[emploi], l'[organisation] du travail et les [relations] de travail.",pieges:["financière","vacances","personnalité"]},
 {id:"fragilite",s:1,titre:"Pas une faiblesse",texte:"Un risque psychosocial n'est pas une [fragilité] personnelle du salarié : il naît d'une situation de [travail], et c'est sur cette [situation] que la prévention agit.",pieges:["force","famille","personne"]},
 {id:"dommages",s:1,titre:"Les dommages",texte:"Les troubles du sommeil portent atteinte à l'intégrité [physique]. L'anxiété porte atteinte à l'intégrité [mentale]. Le repli sur soi est un effet sur la vie [sociale].",pieges:["financière","professionnelle","privée"]},
 {id:"familles",s:2,titre:"Trois familles",texte:"Le [stress] apparaît quand les contraintes perçues dépassent les [ressources] perçues. Le harcèlement moral est une violence [interne]. Les insultes d'un client sont une violence [externe].",pieges:["repos","envies","privée"]},
 {id:"lea",s:2,titre:"Les facteurs chez Léa",texte:"Des horaires connus la veille relèvent de l'[intensité] et du temps de travail. Rester souriante face aux clients est une exigence [émotionnelle]. Ne pas pouvoir décider, c'est un manque d'[autonomie]. Annoncer une livraison qu'on sait annulée est un conflit de [valeurs].",pieges:["salaire","physique","horaires"]},
 {id:"cumul",s:2,titre:"Le cumul",texte:"L'INRS distingue [six] familles de facteurs de risques psychosociaux. Quand plusieurs facteurs sont présents en même temps, leur [cumul] est un élément [aggravant].",pieges:["trois","total","rassurant"]},
 {id:"entreprise",s:3,titre:"Les coûts pour l'entreprise",texte:"Quatre salariés arrêtés montrent une hausse de l'[absentéisme]. Deux démissions montrent une hausse du [turn-over]. Les tensions et les départs dégradent le climat [social].",pieges:["chiffre d'affaires","salaire","commercial"]},
 {id:"niveaux",s:3,titre:"Les trois niveaux",texte:"La prévention [primaire] agit sur les causes. La prévention [secondaire] repère tôt les difficultés. La prévention [tertiaire] limite les conséquences d'un dommage déjà survenu. Il faut agir le plus tôt possible et privilégier les actions [collectives].",pieges:["finale","individuelles","rapides"]},
 {id:"alerte",s:3,titre:"Le droit d'alerte",texte:"Un membre du CSE qui constate une atteinte à la santé d'un salarié saisit [immédiatement] l'employeur. Celui-ci procède sans [délai] à une [enquête] avec ce membre.",pieges:["plus tard","sanction","fête"]}
];
const $=id=>document.getElementById(id);
function annoncer(t){$("annonce").textContent=t}
const CLE="trous-C9";let pref={etoiles:{},expert:false};
try{pref=Object.assign(pref,JSON.parse(localStorage.getItem(CLE)||"{}"))}catch(e){}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(pref))}catch(e){}}
function melanger(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let T,gaps,mots,place,bons,sel,essais,premierOK,termine;
function nav(){
  $("textes").innerHTML=TEXTES.map(t=>`<button class="puce" data-id="${t.id}" aria-pressed="${T===t}">${t.titre} <small>S${t.s}</small>${pref.etoiles[t.id]?`<span class="et">${"★".repeat(pref.etoiles[t.id])}</span>`:""}</button>`).join("");
  $("textes").querySelectorAll(".puce").forEach(b=>b.onclick=()=>demarrer(TEXTES.find(t=>t.id===b.dataset.id)));
}
function modeUI(){$("mFacile").setAttribute("aria-pressed",!pref.expert);$("mExpert").setAttribute("aria-pressed",pref.expert)}
$("mFacile").onclick=()=>{pref.expert=false;sauver();modeUI();demarrer(T)};
$("mExpert").onclick=()=>{pref.expert=true;sauver();modeUI();demarrer(T)};

function demarrer(t){
  T=t;gaps=[...t.texte.matchAll(/\[([^\]]+)\]/g)].map(m=>m[1]);
  mots=melanger(gaps.map((m,i)=>({id:"m"+i,t:m})).concat(pref.expert?t.pieges.map((m,i)=>({id:"p"+i,t:m})):[]));
  place={};bons=new Set();sel=null;essais=0;premierOK=null;termine=false;nav();rendre();
}
function rendre(focusSel){
  let i=-1;
  const html=T.texte.replace(/\[([^\]]+)\]/g,()=>{i++;const m=place[i];const ok=bons.has(i);
    return `<button class="trou${m?" plein":""}${ok?" bon":""}${sel&&!m&&!ok?" cible":""}" data-g="${i}" aria-label="Trou ${i+1}${m?" : "+m.t:" vide"}">${m?m.t:""}</button>`});
  const utilises=new Set(Object.values(place).map(m=>m.id));
  const dispo=mots.filter(m=>!utilises.has(m.id));
  const plein=Object.keys(place).length===gaps.length;
  $("carte").innerHTML=`<h2>${T.titre}</h2>
    <p class="consigne"><b>Compléter</b> le texte avec les mots ${pref.expert?"proposés. Attention : certains mots sont en trop !":"proposés."}</p>
    <p class="texte">${html}</p>
    <div class="banque" id="banque" aria-label="Mots à placer">${dispo.length?dispo.map(m=>`<button class="mot" data-m="${m.id}" aria-pressed="${sel===m.id}">${m.t}</button>`).join(""):`<span class="vide">Tous les mots sont placés.</span>`}</div>
    <p class="aide" aria-live="polite">${sel?`« ${mots.find(m=>m.id===sel).t} » : touche un trou pour le placer.`:""}</p>
    <div class="actions">
      <button class="verifier" id="bVerif" ${plein&&!termine?"":"disabled"}>${termine?"Texte complété ✓":plein?"Vérifier":"Place tous les mots"}</button>
      <button class="sec" id="bLire">🔊 Écouter</button>
      <button class="sec" id="bRaz">Recommencer</button>
    </div>
    <div class="fb" id="fb" role="status"></div><div id="fin"></div>`;
  $("bVerif").onclick=verifier;$("bRaz").onclick=()=>demarrer(T);
  $("bLire").onclick=()=>{let k=-1;lire(T.texte.replace(/\[([^\]]+)\]/g,()=>{k++;return place[k]?place[k].t:"blanc"}).replace("OMS","O M S").replace("DREETS","D R E E T S").replace(/€/g,"euros"))};
  if(focusSel){const b=document.querySelector(`.mot[data-m="${focusSel}"]`);if(b)b.focus({preventScroll:true})}
}
function poser(mid,g){
  if(bons.has(g)||termine)return;
  Object.keys(place).forEach(k=>{if(place[k].id===mid)delete place[k]});
  if(g===null){sel=null;rendre();return}
  place[g]=mots.find(m=>m.id===mid);sel=null;rendre();
  annoncer(`« ${place[g].t} » placé dans le trou ${g+1}.`);
}
document.addEventListener("click",e=>{
  if(glisseFini){glisseFini=false;return}
  const mot=e.target.closest(".mot");
  if(mot){sel=sel===mot.dataset.m?null:mot.dataset.m;rendre(sel);return}
  const trou=e.target.closest(".trou");
  if(trou){const g=+trou.dataset.g;if(bons.has(g))return;
    if(sel)poser(sel,g);else if(place[g]){delete place[g];rendre();annoncer("Mot remis dans la banque.")}}
});
function verifier(){
  essais++;const faux=[];
  gaps.forEach((m,i)=>{if(bons.has(i))return;if(place[i]&&place[i].t===m)bons.add(i);else{faux.push(i);delete place[i]}});
  if(premierOK===null)premierOK=gaps.length-faux.length;
  if(!faux.length){termine=true;fin();return}
  rendre();
  faux.forEach(i=>{const b=document.querySelector(`.trou[data-g="${i}"]`);if(b)b.classList.add("faux")});
  const f=$("fb");f.className="fb ko";f.innerHTML=`<b>${faux.length} mot${faux.length>1?"s":""} à revoir.</b> Les mots mal placés sont revenus dans la banque. Relis la phrase autour de chaque trou.`;
}
function fin(){
  const r=premierOK/gaps.length,et=r===1?3:r>=.6?2:1;
  pref.etoiles[T.id]=Math.max(pref.etoiles[T.id]||0,et);sauver();nav();rendre();
  const f=$("fb");f.className="fb ok";f.innerHTML=`<b>✓ Texte complet !</b> ${premierOK} mot${premierOK>1?"s":""} sur ${gaps.length} juste${premierOK>1?"s":""} du premier coup.<div class="etoiles" aria-label="${et} étoiles sur 3">${"★".repeat(et)}<span style="opacity:.25">${"★".repeat(3-et)}</span></div>`;
  const i=TEXTES.indexOf(T),s=TEXTES[i+1];
  if(s){$("fin").innerHTML=`<div class="actions"><button class="verifier" id="bSuiv">Texte suivant : ${s.titre} →</button></div>`;$("bSuiv").onclick=()=>demarrer(s);$("bSuiv").focus({preventScroll:true})}
  annoncer("Texte complet.");
}
/* ===== Glisser-déposer ===== */
let d=null,glisseFini=false;
document.addEventListener("pointerdown",e=>{const m=e.target.closest(".mot");if(!m||e.button>0)return;const r=m.getBoundingClientRect();d={id:m.dataset.m,el:m,x0:e.clientX,y0:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,actif:false}});
document.addEventListener("pointermove",e=>{
  if(!d)return;
  if(!d.actif){if(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<7)return;d.actif=true;d.g=d.el.cloneNode(true);d.g.classList.add("ghost");document.body.appendChild(d.g);d.el.classList.add("fantome")}
  e.preventDefault();d.g.style.left=(e.clientX-d.dx)+"px";d.g.style.top=(e.clientY-d.dy)+"px";d.x=e.clientX;d.y=e.clientY;
  document.querySelectorAll(".survol").forEach(x=>x.classList.remove("survol"));
  const c=cible();if(c)c.classList.add("survol");
  if(d.y<70)scrollBy(0,-10);else if(d.y>innerHeight-70)scrollBy(0,10);
},{passive:false});
function cible(){const el=document.elementFromPoint(d.x,d.y);return el?el.closest(".trou,.banque"):null}
function lacher(){
  if(!d)return;
  if(d.actif){const c=cible();d.g.remove();glisseFini=true;setTimeout(()=>glisseFini=false,50);
    if(c&&c.classList.contains("trou"))poser(d.id,+c.dataset.g);else if(c)poser(d.id,null);else rendre()}
  d=null;
}
document.addEventListener("pointerup",lacher);document.addEventListener("pointercancel",lacher);
/* ===== Voix ===== */
let voix=null;
function choisirVoix(){const l=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));voix=l.find(x=>/fr-FR/i.test(x.lang)&&/(google|natural|online|amélie|thomas|denise|henri)/i.test(x.name))||l.find(x=>/fr-FR/i.test(x.lang))||l[0]||null}
if("speechSynthesis" in window){choisirVoix();speechSynthesis.onvoiceschanged=choisirVoix}
function lire(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voix)u.voice=voix;u.rate=.95;speechSynthesis.speak(u)}
modeUI();demarrer(TEXTES[0]);
</script>
</body>
</html>
