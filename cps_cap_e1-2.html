  return [

/* Quatre visages des grandes familles : le premier est le bon */

  return [bonne].concat(autres).map(function(nom, i){

  });
}
function PRECIS(bonne){
  return [
    {"l":"Honte / gêne","ok":bonne==="honte"},
    {"l":"Frustration","ok":bonne==="frustration"},
    {"l":"Appréhension","ok":bonne==="apprehension"},
    {"l":"Fierté","ok":bonne==="fierte"},
    {"l":"Déception","ok":bonne==="deception"},
    {"l":"Soulagement","ok":bonne==="soulagement"}
  ];
}
CPS.init({

      "blocks":[
        {"img":K+"affiche-6-emotions.jpg","alt":"Affiche : six visages, chacun avec le nom de son émotion","html":"Chaque mot précis se range dans une des <strong>6 grandes familles</strong>."},

          {"l":"Appréhension","ok":false}

        {"text":"« Mon entraîneur cite mon match en exemple devant toute l’équipe. Je suis fière. »","audio":"Mon entraîneur cite mon match en exemple devant toute l’équipe. Je suis fière. Touche le visage de la grande famille de cette émotion.",
         "options":CHOIX("ines-joie",["malik-surprise","lina-peur","malik-tristesse"],"Oui : la fierté est dans la famille de la joie."),

         "bad":"Pas celui-ci. L’écœurement est dans la famille du dégoût : nez plissé, main qui repousse."}
      ]

    {

      "scenes":[
