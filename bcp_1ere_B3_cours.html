ille reçoit le son. Cadre « L’intensité : en décibels, dB(A) » : son faible (petite amplitude), son fort (grande amplitude). Cadre « La fréquence : en hertz, Hz » : son grave (vibrations lentes), son aigu (vibrations rapides).", "img": "bcp_1ere_B3/images/bcp_1ere_B3_bb3_doc1.jpg", "img_desc": "Schéma : une source (haut-parleur) émet le son ; l’onde sonore (l’air vibre) ; l’oreille reçoit le son. Cadre « L’intensité : en décibels, dB(A) » : son faible (petite amplitude), son fort (grande amplitude). Cadre « La fréquence : en hertz, Hz » : son grave (vibrations lentes), son aigu (vibrations rapides).", "img_w": 1400, "img_h": 933}}, {"type": "question_chapeau", "id": "bb3_ch2", "data": {"numero": "2", "texte": "À partir de la situation d’Antoine et du document 1 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "bb3_q21", "data": {"competence": "C3", "numero": "2.1", "texte": "**Expliquer** pourquoi la batterie d’Antoine est un son pour lui et un bruit pour ses voisins.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Un bruit est un son perçu comme gênant : c’est une notion subjective. La batterie plaît à Antoine, mais peut gêner ses voisins.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase pour expliquer pourquoi la batterie peut être un bruit pour les voisins.\nUn bruit est un son perçu comme ……………………… : c’est une notion ……………………… , qui dépend de celui qui l’entend.", "lignes": 0, "reponse_allegee": "Un bruit est un son perçu comme {{gênant}} : c’est une notion {{subjective}}, qui dépend de celui qui l’entend.", "reponse_attendue": "gênant · subjective"}, "essentiel": {"texte": "**Compléter** la phrase sur le son et le bruit.\nMots proposés : gênant – subjective – grave.\nUn bruit est un son ……………………… ; c’est une notion ……………………… .", "lignes": 0, "reponse_attendue": "gênant · subjective"}}}, "el": {"standard": {"indice": "DOC. 1 : la phrase qui définit , cerveau. Le poumon ne fait pas partie de l’oreille.", "trous": ["tympan|le tympan", "osselets|osselet|les osselets", "auditif"]}}}, {"type": "analyse", "id": "bb3_analyse5", "data": {"titre": "LES CELLULES CILIÉES ET LA SURDITÉ"}}, {"type": "document", "id": "bb3_doc4", "data": {"label": "DOC. 4", "titre": "Les surdités et les effets du bruit sur la santé", "cadre": true, "corps": "« La cochlée abrite environ 15 000 cellules sensorielles ciliées qui ont un rôle déterminant dans l’audition. […] elle transforme l’énergie vibratoire en influx nerveux.\nLes cellules ciliées sont fragiles et ne se régénèrent pas. Elles se détériorent avec l’âge (presbyacousie) ou lorsque qu’elles sont exposées à des niveaux sonores trop élevés. »\n« L'exposition prolongée à des niveaux de bruit intenses détruit peu à peu les cellules ciliées de l'oreille interne. Elle conduit progressivement à une surdité de perception irréversible. Aujourd’hui, on ne sait pas soigner ce type de surdité. »\n**Inserm** — « Les traitements chirurgicaux permettent de rétablir l’audition lorsque la surdité est liée à un défaut de fonctionnement de la chaîne tympano-ossiculaire, comme une perforation du tympan, une destruction ou un blocage des osselets. »\n**INRS** — Les effets auditifs « correspondent à une dégradation irréversible du système auditif » ; les effets extra-auditifs « correspondent à des manifestations autres que celles produites sur le système auditif » : « fatigue, stress, troubles du sommeil, troubles cardiovasculaires, etc. »", "source": "INRS, « Bruit au travail : définitions » et « Effets sur la santé », 2022 ; Inserm, « Troubles de l’audition – Surdités », 2023.", "date_consultation": "2026-10-26"}}, {"type": "document_texte_image", "id": "bb3_doc5", "data": {"label": "DOC. 5", "titre": "L’audiogramme d’une oreille surexposée au bruit", "cadre": true, "corps": "", "source": "Suva (Suisse), « Musique et troubles de l’ouïe », 2021, p. 10 (oreille droite).", "date_consultation": "2026-10-26", "image_w": 1600, "image_h": 865, "image_pos": "centre", "image_align": "centre", "image_largeur": 88, "image_taille": "pleine", "image_nom": "Audiogramme : en abscisse, la fréquence du son de 500 à 8 000 Hz ; en ordonnée, la perte auditive en décibels, de 0 en haut à 80 en bas. Oreille droite : 10 dB à 500 Hz, 5 dB à 1 000 et 2 000 Hz, 27 dB à 3 000 Hz, 50 dB à 4 000 Hz, 30 dB à 6 000 Hz, 5 dB à 8 000 Hz.", "img": "bcp_1ere_B3/images/bcp_1ere_B3_bb3_doc5.jpg", "img_desc": "Audiogramme : en abscisse, la fréquence du son de 500 à 8 000 Hz ; en ordonnée, la perte auditive en décibels, de 0 en haut à 80 en bas. Oreille droite : 10 dB à 500 Hz, 5 dB à 1 000 et 2 000 Hz, 27 dB à 3 000 Hz, 50 dB à 4 000 Hz, 30 dB à 6 000 Hz, 5 dB à 8 000 Hz.", "img_w": 1400, "img_h": 757}}, {"type": "question_chapeau", "id": "bb3_ch5", "data": {"numero": "2", "texte": "À partir de la situation d’Antoine et des documents 4 et 5 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "bb3_q51", "data": {"competence": "C2", "numero": "2.1", "texte": "**Relever** le rôle des cellules ciliées de la cochlée.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Elles transforment l’énergie vibratoire en influx nerveux.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase sur les cellules ciliées.\nElles transforment l’énergie ……………………… en influx ……………………… .", "lignes": 0, "reponse_allegee": "Elles transforment l’énergie {{vibratoire}} en influx {{nerveux}}.", "reponse_attendue": "vibratoire · nerveux"}, "essentiel": {"texte": "**Compléter** la phrase sur les cellules ciliées.\nMots proposés : vibratoire – nerveux – musculaire.\nÉnergie ……………………… → influx ……………………… .", "lignes": 0, "reponse_attendue": "vibratoire · nerveux"}}}, "el": {"standard": {"indice": "DOC. 4 : la première phrase de l’Inserm sur les cellules sensorielles ciliées de la cochlée.", "explication": "Les cellules ciliées transf id": "bb3_doc6", "data": {"label": "DOC. 6", "titre": "Le niveau sonore et la durée d’exposition", "cadre": true, "corps": "**Au travail (INRS)** — « ExempleS de durées d'exposition quotidiennes équivalentes » (tableau 1). « Par exemple, être exposé 8 heures à 80 dB(A) est aussi dangereux que d'être exposé 1 heure à 89 dB(A). »\n**Pour l’écoute de la musique (OMS)** — Durée maximale d’écoute recommandée, par semaine (tableau 2).", "source": "INRS, « Exposition au risque », 2022 ; d’après l’OMS, « Safe listening », 2026.", "date_consultation": "2026-10-26"}}, {"type": "tableau", "id": "bb3_doc6_tab1", "data": {"titre": "", "cells": [[{"type": "prof", "content": "Tableau 1 — Niveau (dB(A))"}, {"type": "prof", "content": "80"}, {"type": "prof", "content": "83"}, {"type": "prof", "content": "86"}, {"type": "prof", "content": "89"}, {"type": "prof", "content": "92"}, {"type": "prof", "content": "95"}, {"type": "prof", "content": "98"}], [{"type": "prof", "content": "Durée d’exposition"}, {"type": "prof", "content": "8 h"}, {"type": "prof", "content": "4 h"}, {"type": "prof", "content": "2 h"}, {"type": "prof", "content": "1 h"}, {"type": "prof", "content": "30 min"}, {"type": "prof", "content": "15 min"}, {"type": "prof", "content": "7,5 min"}]], "table_preset": "pse", "table_border": "fine", "table_row_height": "compact", "table_col_widths": [30, 10, 10, 10, 10, 10, 10, 10], "table_student_style": "lines"}}, {"type": "tableau", "id": "bb3_doc6_tab2", "data": {"titre": "", "cells": [[{"type": "prof", "content": "Tableau 2 — Niveau (dB(A))"}, {"type": "prof", "content": "80"}, {"type": "prof", "content": "85"}, {"type": "prof", "content": "90"}, {"type": "prof", "content": "95"}, {"type": "prof", "content": "100"}], [{"type": "prof", "content": "Durée maximale d’écoute recommandée par semaine"}, {"type": "prof", "content": "40 h"}, {"type": "prof", "content": "12 h 30"}, {"type": "prof", "content": "4 h"}, {"type": "prof", "content": "1 h 15"}, {"type": "prof", "content": "20 min"}]], "table_preset": "pse", "table_border": "fine", "table_row_height": "compact", "table_col_widths": [30, 14, 14, 14, 14, 14], "table_student_style": "lines"}}, {"type": "question_chapeau", "id": "bb3_ch6", "data": {"numero": "1", "texte": "À partir de la situation d’Antoine et du document 6 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "bb3_q61", "data": {"competence": "C2", "numero": "1.1", "texte": "**Indiquer** en combien d’heures, à 86 dB(A), Antoine reçoit la même dose de bruit que 8 h à 80 dB(A).", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "En 2 heures.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase sur la journée d’Antoine.\nÀ 86 dB(A), la dose de 8 h à 80 dB(A) est atteinte en ……………………… heures.", "lignes": 0, "reponse_allegee": "atteinte en {{2}} heures.", "reponse_attendue": "2"}, "essentiel": {"texte": "**Compléter** la phrase sur la journée d’Antoine.\nMots proposés : 2 – 8.\nÀ 86 dB(A), la dose de 8 h à 80 dB(A) est atteinte en ……………………… heures.", "lignes": 0, "reponse_attendue": "2"}}}, "el": {"standard": {"indice": "DOC. 6, tableau 1 : la case sous 86 dB(A).", "explication": "À 86 dB(A), la même dose de bruit que 8 h à 80 dB(A) est atteinte en 2 heures."}, "adapte": {"indice": "DOC. 6, tableau 1 : la colonne 86 dB(A).", "explication": "À 86 dB(A), la dose de 8 h à 80 dB(A) est atteinte en 2 heures.", "trous": ["2|deux|2 h|2h"]}, "essentiel": {"indice": "DOC. 6, tableau 1 : la colonne 86.", "explication": "À 86 dB(A), 2 heures suffisent. 8 heures correspond à 80 dB(A).", "trous": ["2|deux|2 h|2h"]}}}, {"type": "sous_question", "id": "bb3_q62", "data": {"competence": "C3", "numero": "1.2", "texte": "**Expliquer** pourquoi les répétitions de batterie présentent un risque pour l’audition d’Antoine.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "À 100 dB(A), la durée maximale recommandée est de 20 minutes par semaine ; Antoine joue 3 heures : il dépasse largement cette durée.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase sur les répétitions de batterie.\nÀ 100 dB(A), la durée maximale recommandée est de ……………………… minutes par semaine ; Antoine joue ……………………… heures : il dépasse largement cette durée.", "lignes": 0, "reponse_allegee": "la durée recommandée est de {{20}} minutes par semaine ; Antoine joue {{3}} heures.", "reponse_attendue": "20 · 3"}, "essentiel": {"texte": "**Compléter** la phrase sur la batterie.\nMots proposés : 20 – 3 – 40.\nDurée recommandée : ……………………… minutes par semaine ; Antoine joue ……………………… heures.", "lignes": 0, "reponse_attendue": "20 · 3"}}}, "el": {"standard": {"indice": "Situation : le niveau sonore du local et la durée des répétitions ; DOC. 6, tableau 2 : la colonne 100 dB(A).", "explication": "À 100 dB(A), la durée maximale d’écoute recommandée est de 20 minutes par semaine ; Antoine joue 3 heures : il dépasse largement cette durée."}, "adapte": {"indice": "DOC. 6, tableau 2 : la colonne 100 dB(A) ; situation : la durée de la répétition du samedi.", "explication": "La durée recommandée est de 20 minutes par semaine ; Antoine joue 3 heures.", "trous": ["20|vingt|20 min|20 minutes", "3|trois|3 h"]}, "essentiel": {"indice": "DOC. 6, tableau 2 : la colonne 100.", "explication": "Durée recommandée : 20 minutes par semaine ; Antoine joue 3 heures. 40 heures correspond à 80 dB(A).", "trous": ["20|vingt", "3|trois"]}}}, {"type": "analyse", "id": "bb3_analyse7", "data": {"titre": "LA RÉGLEMENTATION CONTRE LE BRUIT"}}, {"type": "document", "id": "bb3_doc7", "data": {"label": "DOC. 7", "titre": "La réglementation contre le bruit", "cadre": true, "corps": "**Code du travail, article R. 4431-2** — « Les valeurs limites d'exposition et les valeurs d'exposition déclenchant une action de prévention sont fixées dans le tableau suivant : »\n1° Valeurs limites d'exposition : « Niveau d'exposition quotidienne au bruit de 87 dB (A) » […] ;\n2° Valeurs d'exposition supérieures déclenchant l'action de prévention […] : « Niveau d'exposition quotidienne au bruit de 85 dB (A) » […] ;\n3° Valeurs d'exposition inférieures déclenchant l'action de prévention […] : « Niveau d'exposition quotidienne au bruit de 80 dB (A) » […].\n**Code du travail, article R. 4434-7** — « En cas d'impossibilité d'éviter les risques dus à l'exposition au bruit par d'autres moyens, des protecteurs auditifs individuels, appropriés et correctement adaptés, sont mis à la disposition des travailleurs dans les conditions suivantes :\n1° Lorsque l'exposition au bruit dépasse les valeurs d'exposition inférieures définies au 3° de l'article R. 4431-2, l'employeur met des protecteurs auditifs individuels à la disposition des travailleurs ;\n2° Lorsque l'exposition au bruit égale ou dépasse les valeurs d'exposition supérieures définies au 2° l'article R. 4431-2, l'employeur veille à ce que les protecteurs auditifs individuels soient effectivement utilisés. »\n**Code de la santé publique, article R. 1336-5** — « Aucun bruit particulier ne doit, par sa durée, sa répétition ou son intensité, porter atteinte à la tranquillité du voisinage ou à la santé de l'homme, dans un lieu public ou privé […]. »\n**Service-Public** — « Les bruits ou tapages injurieux ou nocturnes, troublant la tranquillité d'autrui, sont punis par une amende de 450 € maximum. » Une amende forfaitaire de 68 € est possible si elle est réglée dans les 45 jours.", "source": "Code du travail, articles R. 4431-2 et R. 4434-7 ; Code de la santé publique, article R. 1336-5 (extraits) ; d’après service-public.fr, F612, 2025.", "date_consultation": "2026-10-26"}}, {"type": "question_chapeau", "id": "bb3_ch7", "data": {"numero": "2", "texte": "À partir de la situation d’Antoine et du document 7 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "bb3_q71", "data": {"competence": "C2", "numero": "2.1", "texte": "**Indiquer** les valeurs d’exposition du Code du travail dépassées par Antoine (86 dB(A)).", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "80 dB(A) et 85 dB(A).", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase.\nAntoine (86 dB(A)) dépasse la valeur d’exposition supérieure de ……………………… dB(A), mais pas la valeur limite de ……………………… dB(A).", "lignes": 0, "reponse_allegee": "dépasse la valeur de {{85}} dB(A), mais pas la valeur limite de {{87}} dB(A).", "reponse_attendue": "85 · 87"}, "essentiel": {"texte": "**Compléter** la phrase.\nMots proposés : 85 – 87 – 120.\n86 dB(A) dépasse ……………………… dB(A), mais pas ……………………… dB(A).", "lignes": 0, "reponse_attendue": "85 · 87"}}}, "el": {"standard": {"indice": "DOC. 7 : les trois valeurs de l’article R. 4431-2, à comparer avec 86 dB(A).", "explication": "86 dB(A) dépasse la valeur d’exposition inférieure (80 dB(A)) et la valeur d’exposition supérieure (85 dB(A)), mais pas la valeur limite (87 dB(A))."}, "adapte": {"indice": "DOC. 7 : l’article R. 4431-2, points 1° et 2°.", "explication": "86 dB(A) dépasse la valeur d’exposition supérieure de 85 dB(A), mais pas la valeur limite de 87 dB(A).", "trous": ["85|85 db|85 db(a)", "87|87 db|87 db(a)"]}, "essentiel": {"indice": "DOC. 7 : les valeurs juste en dessous et juste au-dessus de 86.", "explication": "86 dB(A) dépasse 85 dB(A), mais pas 87 dB(A). 120 dB(A) n’est pas une valeur du Code du travail.", "trous": ["85|85 db|85 db(a)", "87|87 db|87 db(a)"]}}}, {"type": "sous_question", "id": "bb3_q72", "data": {"competence": "C2", "numero": "2.2", "texte": "**Relever** l’obligation de l’employeur d’Antoine pour les protecteurs auditifs.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Il veille à ce que les protecteurs auditifs individuels soient effectivement utilisés.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase.\nL’employeur veille à ce que les protecteurs auditifs individuels soient ……………………… ……………………… .", "lignes": 0, "reponse_allegee": "soient {{effectivement}} {{utilisés}}.", "reponse_attendue": "effectivement utilisés"}, "essentiel": {"texte": "**Compléter** la phrase.\nMots proposés : utilisés – vendus.\nL’employeur veille à ce que les protecteurs soient effectivement ……………………… .", "lignes": 0, "reponse_attendue": "utilisés"}}}, "el": {"standard": {"indice": "DOC. 7 : l’article R. 4434-7, le point 2° (exposition qui égale ou dépasse 85 dB(A)).", "explication": "L’exposition d’Antoine dépasse 85 dB(A) : l’employeur veille à ce que les protecteurs auditifs individuels soient effectivement utilisés."}, "adapte": {"indice": "DOC. 7 : l’article R. 4434-7, la fin du point 2°.", "explication": "L’employeur veille à ce que les protecteurs soient effectivement utilisés.", "trous": ["effectivement|réellement|reellement|vraiment", "utilisés|utilises|portés|portes"]}, "essentiel": {"indice": "DOC. 7 : l’article R. 4434-7, point 2°.", "explication": "Les protecteurs doivent être effectivement utilisés. Le mot « vendus » ne convient pas.", "trous": ["utilisés|utilises"]}}}, {"type": "sous_question", "id": "bb3_q73", "data": {"competence": "C3", "numero": "2.3", "texte": "**Expliquer** dans quel cas la batterie d’Antoine chez lui peut être sanctionnée.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Si, par sa durée, sa répétition ou son intensité, elle porte atteinte à la tranquillité du voisinage.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase.\nSi, par sa durée, sa ……………………… ou son intensité, la batterie porte atteinte à la ……………………… du voisinage, une amende est possible.", "lignes": 0, "reponse_allegee": "par sa durée, sa {{répétition}} ou son intensité … à la {{tranquillité}} du voisinage", "reponse_attendue": "répétition · tranquillité"}, "essentiel": {"texte": "**Compléter** la phrase.\nMots proposés : répétition – tranquillité – couleur.\nAmende possible si, par sa ……………………… , la batterie trouble la ……………………… du voisinage.", "lignes": 0, "reponse_attendue": "répétition · tranquillité"}}}, "el": {"standard": {"indice": "DOC. 7 : l’article R. 1336-5 du Code de la santé publique et l’extrait de Service-Public.", "explication": "La batterie peut être sanctionnée si, par sa durée, sa répétition ou son intensité, elle porte atteinte à la tranquillité du voisinage."}, "adapte": {"indice": "DOC. 7 : l’article R. 1336-5, « par sa durée, sa … ou son intensité ».", "explication": "Une amende est possible si, par sa durée, sa répétition ou son intensité, la batterie porte atteinte à la tranquillité du voisinage.", "trous": ["répétition|repetition", "tranquillité|tranquillite"]}, "essentiel": {"indice": "DOC. 7 : l’article R. 1336-5.", "explication": "Amende possible si, par sa répétition, la batterie trouble la tranquillité du voisinage. Le mot « couleur » ne convient pas.", "trous": ["répétition|repetition", "tranquillité|tranquillite"]}}}, {"type": "analyse", "id": "bb3_analyse8", "data": {"titre": "RÉDUIRE LE BRUIT AU TRAVAIL"}}, {"type": "document", "id": "bb3_doc8", "data": {"label": "DOC. 8", "titre": "Les moyens de réduire le bruit au travail", "cadre": true, "corps": "**Code du travail, article R. 4434-1** — « La réduction des risques d'exposition au bruit se fonde sur, notamment :\n1° La mise en œuvre d'autres procédés de travail ne nécessitant pas d'exposition au bruit ou nécessitant une exposition moindre ;\n2° Le choix d'équipements de travail appropriés émettant, compte tenu du travail à accomplir, le moins de bruit possible ;\n[…]\n4° La modification de la conception et de l'agencement des lieux et postes de travail ;\n5° L'information et la formation adéquates des travailleurs afin qu'ils utilisent correctement les équipements de travail en vue de réduire au minimum leur exposition au bruit ;\n6° Des moyens techniques pour réduire le bruit aérien en agissant sur son émission, sa propagation, sa réflexion, tels que réduction à la source, écrans, capotages, correction acoustique du local ;\n[…]\n9° La réduction de l'exposition au bruit par une meilleure organisation du travail, en limitant la durée et l'intensité de l'exposition et en organisant convenablement les horaires de travail, en prévoyant notamment des périodes de repos. »\n**Ministère de la Santé** — « Les bons gestes à adopter lors d’un festival, en discothèque ou en concert : s’éloigner des enceintes ; faire des pauses régulières dans une zone calme ; porter des bouchons d’oreilles. »", "source": "Code du travail, article R. 4434-1 (extrait) ; ministère de la Santé, « Prévention des risques liés au bruit », 2025.", "date_consultation": "2026-10-26"}}, {"type": "question_chapeau", "id": "bb3_ch8", "data": {"numero": "3", "texte": "À partir du document 8 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "bb3_q81", "data": {"competence": "C2", "numero": "3.1", "texte": "**Classer** chaque moyen selon qu’il agit sur la source, la propagation ou la réception du bruit.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "", "indice": "", "reponse_allegee": "", "variantes": {"essentiel": {"texte": "**Classer** chaque moyen en cochant l’étape exacte : la source, la propagation ou la réception."}}}, "el": {"standard": {"indice": "DOC. 8 : le point 6° (« émission, propagation, réflexion ») ; la source émet le bruit, l’oreille le reçoit.", "explication": "Choisir des équipements émettant le moins de bruit possible agit sur la source. Les écrans et les capotages agissent sur la propagation. S’éloigner des enceintes agit sur la réception."}, "adapte": {"indice": "DOC. 8 : les écrans arrêtent le bruit en chemin ; s’éloigner concerne la personne qui entend.", "explication": "Les écrans et les capotages agissent sur la propagation. S’éloigner des enceintes agit sur la réception."}, "essentiel": {"indice": "Source = ce qui fait le bruit ; propagation = le trajet ; réception = l’oreille.", "explication": "Équipement moins bruyant : la source. Écrans et capotages : la propagation. S’éloigner des enceintes : la réception."}}}, {"type": "tableau", "id": "bb3_q81_tab", "data": {"titre": "", "cells": [[{"type": "prof", "content": "Le moyen de réduction"}, {"type": "prof", "content": "Il agit sur…"}], [{"type": "prof", "content": "2° Choisir des équipements émettant le moins de bruit possible"}, {"type": "eleve", "content": "", "reponse": "La source."}], [{"type": "prof", "content": "6° Installer des écrans et des capotages"}, {"type": "eleve", "content": "", "reponse": "La propagation."}], [{"type": "prof", "content": "S’éloigner des enceintes (ministère de la Santé)"}, {"type": "eleve", "content": "", "reponse": "La réception."}]], "table_preset": "pse", "table_border": "fine", "table_row_height": "compact", "table_col_widths": [65, 35], "table_student_style": "lines", "variantes": {"adapte": {"cells": [[{"type": "prof", "content": "Le moyen de réduction"}, {"type": "prof", "content": "Il agit sur…"}], [{"type": "prof", "content": "2° Choisir des équipements émettant le moins de bruit possible"}, {"type": "prof", "content": "La source."}], [{"type": "prof", "content": "6° Installer des écrans et des capotages"}, {"type": "eleve", "content": "", "reponse": "La propagation."}], [{"type": "prof", "content": "S’éloigner des enceintes (ministère de la Santé)"}, {"type": "eleve", "content": "", "reponse": "La réception."}]]}, "essentiel": {"table_student_style": "choix", "cells": [[{"type": "prof", "content": "Le moyen de réduction"}, {"type": "prof", "content": "Il agit sur…"}], [{"type": "prof", "content": "2° Choisir des équipements émettant le moins de bruit possible"}, {"type": "eleve", "content": "", "reponse": "La source.", "options": ["La source.", "La réception."]}], [{"type": "prof", "content": "6° Installer des
