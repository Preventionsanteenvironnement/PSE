comment s’en protéger au quotidien ? L’article ne parle pas du prix des transports."}}}, {"id": "bb3_analyse2", "type": "analyse", "data": {"titre": "LE SON ET LE BRUIT"}}, {"id": "bb3_doc1", "type": "document_texte_image", "data": {"label": "DOC. 1", "titre": "Le son et le bruit", "corps": "Un **son** est une vibration de l’air émise par une **source de bruit** ; il se propage sous la forme d’une **onde sonore**. On parle de **bruit** lorsqu’un son est perçu comme **gênant** : un même son peut plaire à l’un et gêner l’autre.\nLes principales sources de bruit : les transports, le voisinage, le travail, les loisirs musicaux, les appareils personnels d’écoute.\nPlus l’amplitude de l’onde est grande, plus le son est fort ; plus il y a de vibrations par seconde, plus le son est aigu.", "cadre": true, "image_nom": "Schéma en deux étages. En haut, de gauche à droite : un haut-parleur, « La source émet le son » ; des arcs de cercle qui s’éloignent du haut-parleur, « L’onde sonore : l’air vibre » ; une oreille, « L’oreille reçoit le son ». En bas, deux cadres. Cadre de gauche, « L’intensité : en décibels, dB(A) » : une courbe peu haute, « Son faible » ; une courbe haute avec le même nombre d’ondulations, « Son fort ». Cadre de droite, « La fréquence : en hertz, Hz » : une courbe à ondulations larges et peu nombreuses, « Son grave » ; une courbe de même hauteur à ondulations serrées et nombreuses, « Son aigu ».", "image_w": 1500, "image_h": 1000, "image_largeur": 78, "image_taille": "pleine", "source": "D’après l’INRS, Bruit — Définitions.", "date_consultation": "2026-09-25", "image_pos": "centre", "image_align": "centre", "img": "bcp_1ere_B3/images/bcp_1ere_B3_bb3_doc1.jpg", "img_desc": "Schéma en deux étages. En haut, de gauche à droite : un haut-parleur, « La source émet le son » ; des arcs de cercle qui s’éloignent du haut-parleur, « L’onde sonore : l’air vibre » ; une oreille, « L’oreille reçoit le son ». En bas, deux cadres. Cadre de gauche, « L’intensité : en décibels, dB(A) » : une courbe peu haute, « Son faible » ; une courbe haute avec le même nombre d’ondulations, « Son fort ». Cadre de droite, « La fréquence : en hertz, Hz » : une courbe à ondulations larges et peu nombreuses, « Son grave » ; une courbe de même hauteur à ondulations serrées et nombreuses, « Son aigu ».", "img_w": 1400, "img_h": 933}}, {"id": "bb3_ch2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 1 :", "reponse_attendue": ""}}, {"id": "bb3_q21", "type": "sous_question", "data": {"competence": "C1", "numero": "2.1", "texte": "**Compléter** le tableau avec la famille de chaque source de bruit.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "", "indice": "", "reponse_allegee": ""}, "el": {"standard": {"indice": "DOC. 1 : la phrase « Les principales sources de bruit : … », qui cite cinq familles.", "explication": "Le boulevard : les transports. La machine d’imprimerie : le travail. Les écouteurs : les appareils personnels d’écoute. La répétition d’un groupe de musique : les loisirs musicaux."}, "essentiel": {"indice": "DOC. 1 : la phrase « Les principales sources de bruit : … ».", "explication": "Le boulevard : les transports. La machine : le travail. Les écouteurs : les appareils personnels d’écoute. Le groupe de musique : les loisirs musicaux."}}}, {"id": "bb3_q21_tab", "type": "tableau", "data": {"titre": "", "cells": [[{"type": "prof", "content": "Source de bruit"}, {"type": "prof", "content": "Famille de sources"}], [{"type": "prof", "content": "Le boulevard d’une grande ville"}, {"type": "eleve", "content": "", "reponse": "Les transports"}], [{"type": "prof", "content": "Une machine d’imprimerie"}, {"type": "eleve", "content": "", "reponse": "Le travail"}], [{"type": "prof", "content": "Des écouteurs"}, {"type": "eleve", "content": "", "reponse": "Les appareils personnels d’écoute"}], [{"type": "prof", "content": "La répétition d’un groupe de musique"}, {"type": "el dice": "DOC. 1 : la deuxième phrase du texte, qui dit quand un son devient un bruit.", "explication": "Un bruit est un son perçu comme gênant. La musique plaît à la personne qui la joue, alors qu’elle gêne son voisin : le même son devient un bruit."}, "adapte": {"indice": "DOC. 1 : le mot en gras qui suit « perçu comme ».", "explication": "Un bruit est un son perçu comme gênant : la musique plaît à la personne qui la joue, alors qu’elle gêne son voisin.", "trous": ["gênant|genant|gênants|genants", "gêne|gene|dérange|derange"]}}}, {"id": "bb3_q23_ess", "type": "sous_question", "data": {"competence": "C3", "numero": "2.3", "texte": "**Expliquer** pourquoi une même musique est un son pour la personne qui la joue et un bruit pour son voisin.\nMots proposés : gênant – plaît – aigu.\nUn bruit est un son perçu comme …………… . La musique …………… à la personne qui la joue, mais elle dérange son voisin.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "gênant\nplaît", "indice": "", "reponse_allegee": "", "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 1 : la deuxième phrase, le mot en gras après « perçu comme ».", "explication": "Un bruit est un son perçu comme gênant. La musique plaît à la personne qui la joue, mais elle dérange son voisin.", "trous": ["gênant|genant", "plaît|plait"]}}}, {"id": "bb3_analyse3", "type": "analyse", "data": {"titre": "L’ÉCHELLE DES NIVEAUX SONORES"}}, {"id": "bb3_doc2", "type": "document_image", "data": {"label": "DOC. 2", "titre": "L’échelle des niveaux sonores", "corps": "Le **niveau sonore** est l’intensité d’un bruit mesurée à un endroit donné, en dB(A). Un **seuil** est une valeur repère sur l’échelle. Les scènes donnent des repères : le niveau réel varie avec la distance. Pour un concert, 102 dB(A) est la limite autorisée, en moyenne sur 15 minutes.\n**Exemple.** Près de la machine de Kevin, opérateur dans une imprimerie, le niveau sonore est de 88 dB(A).", "cadre": true, "image_nom": "Échelle horizontale des niveaux sonores, graduée de 0 à 130 dB(A), illustrée par six scènes. 30 : chambre calme. 50 : conversation. 80 : rue à fort trafic. 90 : tondeuse à gazon. 102 : concert. 130 : avion au décollage. Trois repères : 0, seuil d’audibilité ; 80, seuil de nocivité ; 120, seuil de douleur. Trois zones : de 0 à 80, « Pas de risque pour l’audition » ; de 80 à 120, « Risque selon la durée » ; au-delà de 120, « Douleur ».", "image_w": 1500, "image_h": 720, "image_largeur": 84, "image_taille": "pleine", "source": "D’après l’INRS, l’ANSES et le Code de la santé publique, article R. 1336-1.", "date_consultation": "2026-09-25", "img": "bcp_1ere_B3/images/bcp_1ere_B3_bb3_doc2.jpg", "img_desc": "Échelle horizontale des niveaux sonores, graduée de 0 à 130 dB(A), illustrée par six scènes. 30 : chambre calme. 50 : conversation. 80 : rue à fort trafic. 90 : tondeuse à gazon. 102 : concert. 130 : avion au décollage. Trois repères : 0, seuil d’audibilité ; 80, seuil de nocivité ; 120, seuil de douleur. Trois zones : de 0 à 80, « Pas de risque pour l’audition » ; de 80 à 120, « Risque selon la durée » ; au-delà de 120, « Douleur ».", "img_w": 1400, "img_h": 672}}, {"id": "bb3_ch3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir du document 2 :", "reponse_attendue": ""}}, {"id": "bb3_q31", "type": "sous_question", "data": {"competence": "C1", "numero": "3.1", "texte": "**Compléter** le tableau avec le niveau sonore de chaque seuil.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "", "indice": "", "reponse_allegee": ""}, "el": {"standard": {"indice": "DOC. 2 : les trois repères écrits sur l’échelle, chacun en face d’un nombre.", "explication": "Seuil d’audibilité : 0 dB(A). Seuil de nocivité : 80 dB(A). Seuil de douleur : 120 dB(A)."}, "essentiel": {"indice": "DOC. 2 : les trois repères de l’échelle, de gauche à droite.", "explication": "Seuil d’audibilité : 0 dB(A). Seuil de nocivité l’oreille interne : elles ne se réparent pas, la perte d’audition est **définitive**.", "cadre": true, "image_nom": "Coupe anatomique de l’oreille, en trois zones de gauche à droite, avec six numéros à légender. Oreille externe : 1, la partie visible de l’oreille ; 2, le canal qui s’enfonce dans la tête ; 3, la membrane qui ferme ce canal. Oreille moyenne : 4, trois petits os placés derrière la membrane. Oreille interne : 5, un organe enroulé comme une coquille d’escargot ; 6, le cordon qui part de cet organe vers le cerveau.", "image_w": 1500, "image_h": 1000, "image_largeur": 82, "image_taille": "pleine", "source": "D’après l’Inserm, Troubles de l’audition.", "date_consultation": "2026-09-25", "image_pos": "centre", "image_align": "centre", "img": "bcp_1ere_B3/images/bcp_1ere_B3_bb3_doc3.jpg", "img_desc": "Coupe anatomique de l’oreille, en trois zones de gauche à droite, avec six numéros à légender. Oreille externe : 1, la partie visible de l’oreille ; 2, le canal qui s’enfonce dans la tête ; 3, la membrane qui ferme ce canal. Oreille moyenne : 4, trois petits os placés derrière la membrane. Oreille interne : 5, un organe enroulé comme une coquille d’escargot ; 6, le cordon qui part de cet organe vers le cerveau.", "img_w": 1400, "img_h": 933}}, {"id": "bb3_doc3_tab", "type": "tableau", "data": {"titre": "", "table_preset": "sobre", "table_border": "fine", "table_row_height": "compact", "table_col_widths": [33, 31, 36], "cells": [[{"type": "prof", "content": "L’oreille externe"}, {"type": "prof", "content": "L’oreille moyenne"}, {"type": "prof", "content": "L’oreille interne"}], [{"type": "prof", "content": "Le **pavillon**, partie visible de l’oreille, capte l’onde sonore. Le **conduit auditif** la conduit jusqu’au **tympan**, une fine membrane qui vibre."}, {"type": "prof", "content": "Trois petits os, les **osselets**, transmettent les vibrations. L’onde sonore est une **onde mécanique**."}, {"type": "prof", "content": "Dans la **cochlée**, enroulée comme une coquille d’escargot, les cellules ciliées transforment les vibrations en **influx nerveux**. Le **nerf auditif** le conduit au **cerveau**, qui interprète le son."}]]}}, {"id": "bb3_ch4", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 3 et de son tableau :", "reponse_attendue": ""}}, {"id": "bb3_q41", "type": "sous_question", "data": {"competence": "C1", "numero": "1.1", "texte": "**Nommer** les six organes numérotés sur la coupe de l’oreille, à l’aide du texte du document.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Nommer** les six organes numérotés sur la coupe de l’oreille, à l’aide du texte du document.\nMots : cochlée – tympan – pavillon – nerf auditif – osselets – conduit auditif."}, "essentiel": {"texte": "**Nommer** les six organes numérotés sur la coupe de l’oreille, à l’aide du texte du document.\nMots : cochlée – osselets – conduit auditif."}}}, "el": {"standard": {"indice": "DOC. 3 : le tableau sous la coupe, lu de gauche à droite ; les organes y sont cités dans l’ordre des numéros.", "explication": "1 : le pavillon. 2 : le conduit auditif. 3 : le tympan. 4 : les osselets. 5 : la cochlée. 6 : le nerf auditif."}, "adapte": {"indice": "DOC. 3 : le tableau sous la coupe ; les mots en gras suivent l’ordre des numéros.", "explication": "2 : le conduit auditif. 3 : le tympan. 4 : les osselets. 5 : la cochlée. 6 : le nerf auditif."}, "essentiel": {"indice": "DOC. 3 : le canal de l’oreille externe, les trois petits os, l’organe en forme de coquille d’escargot.", "explication": "2 : le conduit auditif. 4 : les osselets. 5 : la cochlée."}}}, {"id": "bb3_q41_tab", "type": "tableau", "data": {"titre": "", "cells": [[{"type": "prof", "content": "N°"}, {"type": "prof", "content": "Organe"}, {"type": "prof", "content": "N°"}, {"type": "prof", "content": "Organe"}], [{"type": "prof", "content": "1"}, {" 09-25"}}, {"id": "bb3_doc4_tab", "type": "tableau", "data": {"titre": "", "cells": [[{"type": "prof", "content": "Le niveau sonore"}, {"type": "prof", "content": "La durée d’écoute sans risque, par semaine"}], [{"type": "prof", "content": "80 dB(A)"}, {"type": "prof", "content": "40 heures"}], [{"type": "prof", "content": "85 dB(A)"}, {"type": "prof", "content": "12 heures 30 minutes"}], [{"type": "prof", "content": "90 dB(A)"}, {"type": "prof", "content": "4 heures"}], [{"type": "prof", "content": "95 dB(A)"}, {"type": "prof", "content": "1 heure 15 minutes"}], [{"type": "prof", "content": "100 dB(A)"}, {"type": "prof", "content": "20 minutes"}]], "table_preset": "sobre", "table_border": "fine", "table_row_height": "compact", "table_col_widths": [40, 60]}}, {"id": "bb3_ch6", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 4 :", "reponse_attendue": ""}}, {"id": "bb3_q61", "type": "sous_question", "data": {"competence": "C3", "numero": "1.1", "texte": "**Comparer** la durée d’écoute de Kevin, par semaine, à la durée d’écoute sans risque.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "À 95 dB(A), la durée sans risque est de 1 h 15 par semaine ; Kevin écoute 7 heures par semaine : il la dépasse largement.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"reponse_allegee": "À 95 dB(A), la durée sans risque est de {{1 heure 15 minutes}} par semaine ; Kevin écoute {{7}} heures par semaine : il la {{dépasse}}.", "texte": "**Comparer** la durée d’écoute de Kevin, par semaine, à la durée d’écoute sans risque.\nÀ 95 dB(A), la durée sans risque est de …………… par semaine ; Kevin écoute …………… heures par semaine : il la …………… .", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 4 : la ligne 95 dB(A) du tableau ; l’exemple : une heure par jour, à compter sur une semaine.", "explication": "À 95 dB(A), la durée sans risque est de 1 heure 15 minutes par semaine. Une heure par jour fait 7 heures par semaine : Kevin la dépasse largement."}, "adapte": {"indice": "DOC. 4 : la ligne 95 dB(A) du tableau ; une heure par jour pendant les sept jours de la semaine.", "explication": "À 95 dB(A), la durée sans risque est de 1 heure 15 minutes par semaine ; Kevin écoute 7 heures par semaine : il la dépasse.", "trous": ["1 heure 15 minutes|1 heure 15|1 h 15|1h15|1 h 15 min|75 minutes", "7|sept", "dépasse|depasse|dépasse largement|depasse largement"]}}}, {"id": "bb3_q61_ess", "type": "sous_question", "data": {"competence": "C3", "numero": "1.1", "texte": "**Comparer** la durée d’écoute de Kevin, par semaine, à la durée d’écoute sans risque.\nÉléments proposés : 1 heure 15 minutes – dépasse – 7 – respecte.\nÀ 95 dB(A), la durée sans risque est de …………… par semaine. Kevin écoute …………… heures par semaine : il la …………… .", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "1 heure 15 minutes\n7\ndépasse", "indice": "", "reponse_allegee": "", "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 4 : la ligne 95 dB(A) du tableau ; une heure par jour pendant une semaine.", "explication": "À 95 dB(A), la durée sans risque est de 1 heure 15 minutes par semaine. Kevin écoute 7 heures par semaine : il la dépasse.", "trous": ["1 heure 15 minutes|1 heure 15|1 h 15|1h15", "7|sept", "dépasse|depasse"]}}}, {"id": "bb3_analyse6", "type": "analyse", "data": {"titre": "LES EFFETS DU BRUIT"}}, {"id": "bb3_doc5", "type": "document", "data": {"label": "DOC. 5", "titre": "Les effets du bruit sur la santé", "cadre": true, "corps": "1. Les **effets auditifs** touchent l’oreille.\n– La **fatigue auditive** : après un bruit intense, des sifflements ou des bourdonnements, les **acouphènes**, et une baisse de l’audition. Elle s’atténue souvent avec le repos.\n– La **surdité** : un bruit intense et prolongé détruit peu à peu les cellules ciliées ; la perte d’audition est **définitive**.\n2. Les **effets extra-auditifs** touchent le reste de l’organisme : **fatigue**, **stress**, **troubles du sommeil**, **irritabilité**, troubles cardiovasculaires, baisse de la **concentration**.\n3. Le bruit a aussi des conséquences sur la vie sociale et professionnelle : isolement, conflits, accidents du travail quand un signal d’alarme n’est pas entendu.", "source": "D’après l’INRS, Bruit — Effets sur la santé, l’Inserm et l’OMS.", "date_consultation": "2026-09-25", "image_w": 1100, "image_h": 733, "image_nom": "Illustration : le soir, chez lui, Kevin est fatigué et porte la main à son oreille, gêné par un sifflement.", "image_pos": "droite", "image_largeur": 20, "img": "bcp_1ere_B3/images/bcp_1ere_B3_bb3_doc5.jpg", "img_desc": "Illustration : le soir, chez lui, Kevin est fatigué et porte la main à son oreille, gêné par un sifflement.", "img_w": 1100, "img_h": 733}}, {"id": "bb3_ch7", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 5 :", "reponse_attendue": ""}}, {"id": "bb3_q71", "type": "classer", "data": {"competence": "C1", "numero": "2.1", "titre": "", "consigne": "**Classer** chaque trouble selon qu’il est un effet auditif ou un effet extra-auditif,.", "categories": ["Effet auditif", "Effet extra-auditif"], "items": ["Les acouphènes", "Les troubles du sommeil", "La baisse de l’audition", "L’irritabilité", "Le stress"], "classement": [0, 1, 0, 1, 1], "indice": "", "variantes": {"adapte": {"indice": "Un effet auditif touche l’oreille ; un effet extra-auditif touche le reste de l’organisme.", "consigne": "**Classer** chaque trouble selon qu’il est un effet auditif ou un effet extra-auditif, en l’écrivant dans le tableau.\nUn effet auditif touche l’oreille ; un effet extra-auditif touche le reste de l’organisme."}, "essentiel": {"indice": "Chercher chaque trouble dans le point 1 ou dans le point 2 du document."}}}, "el": {"standard": {"indice": "DOC. 5 : le point 1 pour les troubles de l’oreille, le point 2 pour ceux du reste de l’organisme.", "explication": "Effets auditifs, sur l’oreille : les acouphènes, la baisse de l’audition. Effets extra-auditifs, sur le reste de l’organisme : les troubles du sommeil, l’irritabilité, le stress."}, "essentiel": {"indice": "DOC. 5 : chercher chaque trouble dans le point 1, puis dans le point 2.", "explication": "Effets auditifs : les acouphènes et la baisse de l’audition. Effets extra-auditifs : les troubles du sommeil, l’irritabilité et le stress."}}}, {"id": "bb3_analyse7", "type": "analyse", "data": {"titre": "LA RÉGLEMENTATION ET LA RÉPRESSION"}}, {"id": "bb3_doc6", "type": "document", "data": {"label": "DOC. 6", "titre": "La réglementation contre le bruit", "cadre": true, "corps": "1. **Au travail**, l’employeur évalue le bruit et le réduit, d’abord à la source. Les seuils portent sur l’**exposition moyenne quotidienne**, ramenée à 8 heures.\n– À partir de **80 dB(A)**, il **met à disposition** des protecteurs individuels contre le bruit et forme les salariés à leur usage.\n– À partir de **85 dB(A)**, il signale les zones bruyantes, met en place un programme de réduction du bruit et **contrôle le port** des protecteurs.\n2. **Dans les concerts**, le niveau sonore ne doit pas dépasser **102 dB(A)** en moyenne sur 15 minutes ; des protections auditives sont remises gratuitement au public.\n3. **Entre voisins**, un bruit peut être sanctionné de jour comme de nuit lorsqu’il est anormal par son **intensité**, sa **durée** ou sa **répétition**. C’est la **répression** : la police constate l’infraction ; l’amende forfaitaire est de **68 €** ; devant un juge, l’amende peut atteindre 450 €.\n**Exemple.** Une musique forte empêche des voisins de se reposer jusqu’à minuit, trois soirs par semaine.", "source": "D’après l’INRS, le Code de la santé publique, article R. 1336-1, et Service-Public.", "date_consultation": "2026-09-25"}}, {"id": "bb3_ch8", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir du document 6 :", "reponse_attendue": ""}}, {"id": "bb3_q81", "type": "sous_question", "data": {"competence": "C1", "numero": "3.1", "texte": "**Relever** deux obligations de l’employeur quand l’exposition atteint le seuil le plus élevé du document.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Signaler les zones bruyantes et réduire le bruit.\n– Contrôler le port des protecteurs contre le bruit.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1, "variantes": {"adapte": {"reponse_allegee": "– {{Signaler}} les zones bruyantes et réduire le bruit.\n– {{Contrôler}} le port des protecteurs contre le bruit.", "texte": "**Relever** deux obligations de l’employeur quand l’exposition atteint le seuil le plus élevé du document.\n– …………… les zones bruyantes et réduire le bruit.\n– …………… le port des protecteurs contre le bruit.", "lignes": 0}, "essentiel": {"texte": "**Relever** deux obligations de l’employeur quand l’exposition atteint le seuil le plus élevé du document.\nL’employeur signale les zones …………… et contrôle le …………… des protecteurs.", "lignes": 0, "style_lignes": "tiret_guide", "reponse_attendue": "bruyantes\nport"}}}, "el": {"standard": {"indice": "DOC. 6 : le point 1, le second tiret, celui du seuil le plus élevé.", "explication": "À partir de 85 dB(A), l’employeur signale les zones bruyantes et met en place un programme de réduction du bruit. Il contrôle aussi le port des protecteurs contre le bruit."}, "adapte": {"indice": "DOC. 6 : le point 1, le tiret « À partir de 85 dB(A) » ; les deux verbes de la phrase.", "explication": "L’employeur doit signaler les zones bruyantes et réduire le bruit, puis contrôler le port des protecteurs contre le bruit.", "trous": ["signaler|signale|il signale", "contrôler|controler|contrôle|controle|il contrôle"]}, "essentiel": {"indice": "DOC. 6 : le point 1, le tiret « À partir de 85 dB(A) ».", "explication": "L’employeur signale les zones bruyantes et contrôle le port des protecteurs.", "trous": ["bruyantes|bruyante", "port"]}}}, {"id": "bb3_q82", "type": "sous_question", "data": {"competence": "C3", "numero": "3.2", "texte": "**Déduire** du document la raison pour laquelle le bruit donné en exemple peut être sanctionné.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Ce bruit de voisinage est anormal par son intensité, sa durée et sa répétition : il peut être sanctionné par une amende de 68 €.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"reponse_allegee": "Ce bruit de voisinage est anormal par son intensité, sa {{durée}} et sa {{répétition}} : il peut être sanctionné par une amende.", "texte": "**Déduire** du document la raison pour laquelle le bruit donné en exemple peut être sanctionné.\nCe bruit de voisinage est anormal par son intensité, sa …………… et sa …………… : il peut être sanctionné par une amende.", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 6 : le point 3, les trois mots en gras, à rapprocher de l’exemple (musique forte, jusqu’à minuit, trois soirs par semaine).", "explication": "Ce bruit de voisinage est anormal par son intensité (musique forte), sa durée (jusqu’à minuit) et sa répétition (trois soirs par semaine) : il peut être sanctionné par une amende de 68 €."}, "adapte": {"indice": "DOC. 6 : le point 3, les deux mots en gras qui suivent « intensité ».", "explication": "Ce bruit de voisinage est anormal par son intensité, sa durée et sa répétition : il peut être sanctionné par une amende.", "trous": ["durée|duree", "répétition|repetition"]}}}, {"id": "bb3_q82_ess", "type": "sous_question", "data": {"competence": "C3", "numero": "3.2", "texte": "**Déduire** du document la raison pour laquelle le bruit donné en exemple peut être sanctionné.\nMots proposés : durée – répétition – fréquence.\nCe bruit de voisinage est anormal par sa …………… (jusqu’à minuit) et sa …………… (trois soirs par semaine).", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "durée\nrépétition", "indice": "", "reponse_allegee": "", "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 6 : le point 3, les mots en gras. « Jusqu’à minuit » est un temps ; « trois soirs par semaine » revient souvent.", "explication": "Ce bruit est anormal par sa durée (jusqu’à minuit) et sa répétition (trois soirs par semaine). La fréquence est une caractéristique du son, pas un motif de sanction.", "trous": ["durée|duree", "répétition|repetition"]}}}, {"id": "bb3_analyse8", "type": "analyse", "data": {"titre": "PROPOSER DES SOLUTIONS : SE PROTÉGER SOI-MÊME"}}, {"id": "bb3_doc7", "type": "document", "data": {"label": "DOC. 7", "titre": "Prévenir les risques liés au bruit", "cadre": true, "corps": "1. **Réduire le bruit à la source** : c’est la priorité au travail. L’employeur choisit des machines moins bruyantes. Il limite ensuite la propagation du bruit, en enfermant la machine dans un capot, puis l’exposition, en éloignant les postes de travail.\n2. **Réduire le niveau sonore et la durée d’exposition** : régler le volume des écouteurs à **60 % au plus** du volume maximal, s’éloigner des enceintes, faire des **pauses** pour reposer les oreilles.\n3. **Porter une protection individuelle** : les **bouchons d’oreilles** ou le **casque antibruit**. Ils ne protègent que s’ils sont bien mis et portés pendant toute la durée du bruit.\n4. **Adopter un comportement civique** : baisser le volume, prévenir ses voisins, respecter leur repos le soir.\n5. En cas de sifflements ou de baisse de l’audition qui durent, consulter un médecin ; au travail, le **médecin du travail**.", "source": "D’après l’INRS, l’OMS et Service-Public.", "date_consultation": "2026-09-25", "image_w": 1100, "image_h": 733, "image_nom": "Illustration : la machine d’imprimerie est enfermée dans un capot insonorisant ; Kevin porte un casque antibruit.", "image_pos": "droite", "image_largeur": 22, "img": "bcp_1ere_B3/images/bcp_1ere_B3_bb3_doc7.jpg", "img_desc": "Illustration : la machine d’imprimerie est enfermée dans un capot insonorisant ; Kevin porte un casque antibruit.", "img_w": 1100, "img_h": 733}}, {"id": "bb3_ch9", "type": "question_chapeau", "data": {"numero": "4", "texte": "À partir des documents 5 et 7 :", "reponse_attendue": ""}}, {"id": "bb3_q91", "type": "sous_question", "data": {"competence": "C4", "numero": "4.1", "texte": "**Proposer** trois mesures pour protéger soi-même son audition : au travail, pendant l’écoute de musique et dans un concert.", "points": "", "lignes": 3, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Au travail : porter ses protections pendant toute la durée du bruit.\n– Musique : régler le volume à 60 % au plus, faire des pauses.\n– Concert : s’éloigner des enceintes, porter des bouchons.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1, "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Proposer** trois mesures pour protéger soi-même son audition : au travail, pendant l’écoute de musique et dans un concert.\n– Au travail : porter ses …………… pendant toute la durée du bruit.\n– Musique : régler le volume à …………… au plus.\n– Concert : s’…………… des enceintes.", "reponse_allegee": "– Au travail : porter ses {{protections}} pendant toute la durée du bruit.\n– Musique : régler le volume à {{60 %}} au plus.\n– Concert : s’{{éloigner}} des enceintes.", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 7 : le point 3 pour le travail, le point 2 pour la musique et le concert.", "explication": "Au travail : porter ses protections pendant toute la durée du bruit. Musique : régler le volume à 60 % au plus, faire des pauses. Concert : s’éloigner des enceintes, porter des bouchons."}, "adapte": {"indice": "DOC. 7 : le point 3 pour la première ligne, le point 2 pour les deux suivantes.", "explication": "Au travail : porter ses protections pendant toute la durée du bruit. Musique : régler le volume à 60 % au plus. Concert : s’éloigner des enceintes.", "trous": ["protections|protection|protecteurs|protections auditives|bouchons|casque", "60 %|60%|60|60 pour cent", "éloigner|eloigner"]}}}, {"id": "bb3_q91_ess", "type": "sous_question", "data": {"competence": "C4", "numero": "4.1", "texte": "**Proposer** trois mesures pour protéger soi-même son audition.\nMots utiles : protections – volume – éloigner – pauses.\nAu travail : ………………………………………………\nPendant l’écoute de musique : ………………………………………………\nDans un concert : ………………………………………………", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Par exemple : porter ses protections pendant toute la durée du bruit ; baisser le volume et faire des pauses ; s’éloigner des enceintes.", "indice": "", "reponse_allegee": "", "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 7 : le point 3 pour le travail, le point 2 pour la musique et le concert.", "explication": "Par exemple. Au travail : porter ses protections pendant toute la durée du bruit. Musique : baisser le volume et faire des pauses. Concert : s’éloigner des enceintes.", "ouvert": true}}}, {"id": "bb3_q92", "type": "sous_question", "data": {"competence": "C5", "numero": "4.2", "texte": "**Argumenter** l’intérêt de porter des protections auditives pendant toute la durée d’exposition au bruit, avec deux arguments.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Le bruit détruit les cellules ciliées : la surdité est définitive.\n– Dès que les protections sont retirées, l’oreille est de nouveau exposée au bruit.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1, "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Argumenter** l’intérêt de porter des protections auditives pendant toute la durée d’exposition au bruit, avec deux arguments.\n– Le bruit détruit les cellules …………… : la surdité est définitive.\n– Dès que les protections sont retirées, l’oreille est de nouveau …………… au bruit.", "reponse_allegee": "– Le bruit détruit les cellules {{ciliées}} : la surdité est définitive.\n– Dès que les protections sont retirées, l’oreille est de nouveau {{exposée}} au bruit.", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 5 : la phrase sur la surdité ; DOC. 7 : la dernière phrase du point 3.", "explication": "Le bruit détruit les cellules ciliées : la surdité est définitive. Dès que les protections sont retirées, l’oreille est de nouveau exposée au bruit."}, "adapte": {"indice": "DOC. 5 : les cellules détruites par un bruit intense et prolongé ; DOC. 7 : la fin du point 3.", "explication": "Le bruit détruit les cellules ciliées : la surdité est définitive. Dès que les protections sont retirées, l’oreille est de nouveau exposée au bruit.", "trous": ["ciliées|ciliees|ciliée|ciliee", "exposée|exposee|soumise"]}}}, {"id": "bb3_q92_ess", "type": "sous_question", "data": {"competence": "C5", "numero": "4.2", "texte": "**Argumenter** l’intérêt de porter des protections auditives pendant toute la durée du bruit.\nMots proposés : définitive – exposée – passagère.\n– Le bruit détruit les cellules ciliées : la surdité est …………… .\n– Dès que les protections sont retirées, l’oreille est de nouveau …………… au bruit.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "définitive\nexposée", "indice": "", "reponse_allegee": "", "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 5 : le mot en gras à la fin de la phrase sur la surdité.", "explication": "La surdité est définitive : les cellules ciliées ne se réparent pas. Sans protections, l’oreille est de nouveau exposée au bruit.", "trous": ["définitive|definitive", "exposée|exposee"]}}}, {"id": "bb3_notions3", "type": "notions", "data": {"items": [{"notion": "Durée d’exposition", "definition": "Temps passé dans le bruit ; plus le niveau sonore est élevé, plus la durée sans risque est courte."}, {"notion": "Se
