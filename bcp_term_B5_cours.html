lication": "DOC. 2 : les réserves énergétiques sont les quantités connues d’énergie qui peuvent être extraites du sol.", "renvoi": "DOC. 2 — Réserves et dépendance énergétique", "renvoi_bloc": "bb5_doc2"}]}}, {"id": "bb5_seance3", "type": "seance", "data": {"numero": "3", "titre": "Les impacts de la consommation énergétique", "objectif": "Être capable d’identifier les impacts de la consommation énergétique.", "competences": ["C1", "C2", "C3"]}}, {"id": "bb5_analyse4", "type": "analyse", "data": {"titre": "CLIMAT ET SANTÉ"}}, {"id": "bb5_doc3", "type": "document_texte_image", "data": {"label": "DOC. 3", "titre": "Énergie, climat et santé", "cadre": true, "corps": "1. La combustion des énergies fossiles rejette du dioxyde de carbone, un gaz à effet de serre : l’**effet de serre** est renforcé, c’est le **réchauffement climatique**.\n2. L’**empreinte carbone** mesure les gaz à effet de serre liés à la consommation, produits importés compris : en moyenne 8,2 tonnes équivalent CO₂ par personne en France en 2024.\n3. La combustion rejette aussi des polluants dans l’air : particules fines, dioxyde d’azote. Cette **pollution** favorise les maladies respiratoires et cardiovasculaires : c’est une **atteinte à la santé**.", "source": "D’après l’ADEME, le SDES et Santé publique France.", "date_consultation": "2026-10-10", "image_w": 1500, "image_h": 1000, "image_pos": "centre", "image_align": "centre", "image_largeur": 84, "image_taille": "pleine", "image_nom": "Planche en deux cadres montrant le même paysage sous le Soleil. Dans chaque cadre : le rayonnement solaire arrive à la surface de la Terre ; la Terre émet de la chaleur ; les gaz à effet de serre de l’atmosphère en renvoient une partie vers le sol. Cadre de gauche, « Effet de serre naturel » : peu de gaz, deux flèches de chaleur repartent vers l’espace, une est renvoyée vers le sol ; « Une partie de la chaleur est retenue : la Terre reste habitable. » Cadre de droite, « Effet de serre renforcé » : une usine, des voitures, beaucoup de gaz, une seule flèche repart vers l’espace, trois sont renvoyées vers le sol ; « Davantage de chaleur est retenue : la Terre se réchauffe. »", "img": "bcp_term_B5/images/bcp_term_B5_bb5_doc3.jpg", "img_desc": "Planche en deux cadres montrant le même paysage sous le Soleil. Dans chaque cadre : le rayonnement solaire arrive à la surface de la Terre ; la Terre émet de la chaleur ; les gaz à effet de serre de l’atmosphère en renvoient une partie vers le sol. Cadre de gauche, « Effet de serre naturel » : peu de gaz, deux flèches de chaleur repartent vers l’espace, une est renvoyée vers le sol ; « Une partie de la chaleur est retenue : la Terre reste habitable. » Cadre de droite, « Effet de serre renforcé » : une usine, des voitures, beaucoup de gaz, une seule flèche repart vers l’espace, trois sont renvoyées vers le sol ; « Davantage de chaleur est retenue : la Terre se réchauffe. »", "img_w": 1400, "img_h": 933}}, {"id": "bb5_ch4", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 3 :", "reponse_attendue": ""}}, {"id": "bb5_q41", "type": "sous_question", "data": {"competence": "C1", "numero": "1.1", "texte": "**Comparer** le nombre de flèches de chaleur renvoyées vers le sol dans les deux cadres de la planche.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "Une seule flèche dans l’effet de serre naturel, trois dans l’effet de serre renforcé.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1, "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Comparer** le nombre de flèches de chaleur renvoyées vers le sol dans les deux cadres de la planche.\n…………… flèche dans l’effet de serre naturel, …………… dans l’effet de serre renforcé.", "reponse_attendue": "une ; trois", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 3, la planche : les flèches qui redescendent vers le sol, cadre de gauche puis cadre de droite.", "explication": "Une seule fl
