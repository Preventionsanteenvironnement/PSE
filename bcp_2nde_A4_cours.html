<script>window.COURS = {"slug": "bcp_2nde_A4", "classe": "Seconde Bac Pro", "retour": "bcp_2nde_A4.html", "pied": "Module A4 — Seconde Bac Pro. Prévention, santé, environnement — M. MECHERI. Sources indiquées sous chaque document.", "version": "2026-10-28", "entete": {"module_code": "A4", "titre": "Les addictions", "niveau": "Seconde Bac Pro", "annee": "2026-2027", "thematique": "A — L'individu responsable de son capital santé", "objectif_general": "Être capable de prévenir les conduites addictives."}, "blocks": [{"id": "ba4_seance1", "type": "seance", "data": {"numero": "1", "titre": "Les conduites addictives et les facteurs de risque", "objectif": "Être capable de repérer des facteurs de risque addictif.", "competences": ["C2", "C3"]}}, {"type": "situation", "id": "a4_situation", "data": {"source": "D’après franceinfo, « La consommation de drogues et d’alcool au travail a augmenté de 107 % en huit ans, selon une étude », 12/06/2025.", "texte": "**Alcool et drogues au travail : la part de tests positifs a doublé en huit ans**\nUne entreprise spécialisée dans le dépistage a analysé plus de 110 000 tests réalisés sans prévenir dans des entreprises, entre 2017 et 2025. En 2025, 5,3 % des travailleurs dépistés étaient positifs à l’alcool ou aux stupéfiants, contre 2,6 % en 2017 : plus du double en huit ans. Le cannabis reste le produit le plus souvent retrouvé (1,8 % des tests). Pour l’alcool, les tests positifs sont jusqu’à deux fois plus fréquents que la moyenne le soir après 17 h et le vendredi. Les travailleurs précaires, surtout les intérimaires, sont particulièrement concernés : horaires décalés, logements temporaires, isolement, manque d’information."}}, {"type": "analyse", "id": "a4_analyse1", "data": {"titre": "ANALYSER LA SITUATION"}}, {"type": "question_chapeau", "id": "a4_ch1", "data": {"numero": "1", "texte": "À partir de l’article :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "a4_q11", "data": {"competence": "C2", "numero": "1.1", "texte": ir ».", "explication": "Comment prévenir la consommation d’alcool et de drogues des salariés ?"}}}, {"type": "analyse", "id": "a4_analyse2", "data": {"titre": "QU’EST-CE QU’UNE ADDICTION ?"}}, {"type": "document", "id": "a4_doc1", "data": {"label": "DOC. 1", "titre": "Addiction avec ou sans produit", "cadre": true, "corps": "« Les addictions sont des maladies chroniques aux composantes cérébrales, psychologiques et sociales, caractérisées par une perte progressive de contrôle face à une substance ou un comportement. Malgré les conséquences négatives sur leur santé, leur vie sociale ou professionnelle, les personnes concernées ne parviennent plus à réduire ou arrêter leur consommation ou leur pratique. » (Inserm)\n« On désigne par « addictions comportementales » ou « addictions sans produit » des troubles addictifs liés à des activités ou des comportements, en l’absence de consommation de toute substance psychoactive. » (OFDT)", "source": "Inserm, dossier « Addictions », 2026 ; OFDT, glossaire « Addiction comportementale » (extraits).", "date_consultation": "2026-10-27"}}, {"type": "question_chapeau", "id": "a4_ch2", "data": {"numero": "2", "texte": "À partir du document 1 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "a4_q21", "data": {"competence": "C2", "numero": "2.1", "texte": "**Relever** ce qui caractérise une addiction.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Une perte progressive de contrôle : la personne ne parvient plus à réduire ou à arrêter, malgré les conséquences négatives.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase.\nUne addiction est une perte progressive de ……………………… : la personne ne parvient plus à réduire ou à ……………………… .", "lignes": 0, "reponse_allegee": "perte de {{contrôle}} … ou à {{arrêter}}", "reponse_attendue": "contrôle · arrêter"}, "essentiel": {"texte": "**Compléter** la phrase.\nMots proposés : contrôle – arrêter – plaisir.\nUne addiction est une perte progressive de ……………………… : la personne ne parvient plus à ……………………… .", "lignes": 0, "reponse_attendue": "contrôle · arrêter"}}, "absorber": false}, "el": {"standard": {"indice": "DOC. 1 : la première citation (Inserm), la fin de la première phrase et la phrase « Malgré les conséquences négatives… ».", "explication": "Une addiction est une perte progressive de contrôle : la personne ne parvient plus à réduire ou à arrêter, malgré les conséquences négatives sur sa santé, sa vie sociale ou professionnelle."}, "adapte": {"indice": "DOC. 1 : la première citation, les mots « perte progressive de… » puis « réduire ou… ».", "explication": "Une perte progressive de contrôle ; la personne ne parvient plus à réduire ou à arrêter.", "trous": ["contrôle|controle|contrôles", "arrêter|arreter|arrêter sa consommation"]}, "essentiel": {"indice": "DOC. 1 : la première citation. Le plaisir n’y figure pas.", "explication": "Une perte de contrôle : la personne ne parvient plus à arrêter.", "trous": ["contrôle|controle", "arrêter|arreter"]}}}, {"type": "classer", "id": "a4_q22", "data": {"competence": "C2", "numero": "2.2", "titre": "", "consigne": "**Classer** chaque conduite selon le type d’addiction possible.", "categories": ["Addiction avec produit", "Addiction sans produit"], "items": ["Fumer un joint de cannabis chaque soir", "Parier chaque jour sur des matchs en ligne", "Boire plusieurs bières après le travail", "Jouer aux machines à sous", "Fumer un paquet de cigarettes par jour"], "classement": [0, 1, 0, 1, 0], "indice": ""}, "el": {"standard": {"indice": "DOC. 1 : la deuxième citation (OFDT). Une addiction avec produit passe par une substance ; une addiction sans produit, par une activité.", "explication": "Avec produit : le joint de cannabis, les bières, le paquet de cigarettes (une substance est consommée). Sans produit : les paris sur des matchs en ligne et les machines à sous (une activité, sans substance)."}}}, {"type": "texte_libre", "id": "a4_tr1", "data": {"texte": "*Plusieurs facteurs favorisent une addiction.*"}}, {"type": "document", "id": "a4_doc2", "data": {"label": "DOC. 2", "titre": "Les trois familles de facteurs de risque", "cadre": false, "corps": "« La survenue d’une addiction repose sur trois composantes : l’individu, le produit et l’environnement. »", "source": "", "date_consultation": "2026-10-27"}}, {"type": "tableau", "id": "a4_doc2_tab", "data": {"titre": "", "cells": [[{"type": "prof", "content": "**Famille de facteurs**"}, {"type": "prof", "content": "**Ce qu’en dit l’Inserm**"}], [{"type": "prof", "content": "**L’individu**"}, {"type": "prof", "content": "« L’âge, le sexe, la maturité cérébrale, la personnalité et l’humeur d’un individu jouent un rôle important […]. L’initiation précoce constitue un facteur de risque majeur. »"}], [{"type": "prof", "content": "**Le produit (ou le comportement)**"}, {"type": "prof", "content": "« l’addiction peut s’installer plus ou moins rapidement : après une ou quelques prises (crack, cocaïne...), plus progressivement, voire très lentement (alcool, jeux…). »"}], [{"type": "prof", "content": "**L’environnement**"}, {"type": "prof", "content": "« stress, contexte social et amical, présence de troubles psychiques, mais aussi disponibilité des produits, prix, marketing, normes sociales et exposition précoce »"}]], "table_preset": "sobre", "table_border": "fine", "table_row_height": "compact", "table_col_widths": [28, 72]}}, {"type": "texte_libre", "id": "a4_doc2_src", "data": {"texte": "Source : Inserm, dossier « Addictions », 2026 (extraits)."}}, {"type": "texte_libre", "id": "a4_tr2", "data": {"texte": "*Le travail peut aussi favoriser les consommations.*"}}, {"type": "document", "id": "a4_doc3", "data": {"label": "DOC. 3", "titre": "Les facteurs de risque liés au travail", "cadre": true, "corps": "« certaines conditions et organisations du travail pouvant déclencher ou aggraver des conduites addictives […] (stress, risques psycho conséquence professionnelle, comme les arrêts de travail et la perte d’emploi (DOC. 8).", "renvoi": "DOC. 8 — Les conséquences sur la vie quotidienne et sur le travail", "renvoi_bloc": "a4_doc8"}, {"accepte": ["polyconsommation", "la polyconsommation", "poly-consommation", "la poly-consommation"], "explication": "La consommation de plusieurs produits s’appelle la polyconsommation ; DOC. 7 : alcool et cannabis associés augmentent fortement le risque d’accident mortel.", "renvoi": "DOC. 7 — Alcool, cannabis et accidents mortels de la route (accidents de 2011)", "renvoi_bloc": "a4_doc7"}, {"accepte": ["immédiat", "immediat", "un effet immédiat", "immédiats"], "explication": "DOC. 6 : même à petite dose, l’alcool affecte rapidement les réflexes : c’est un effet immédiat.", "renvoi": "DOC. 6 — Les effets de l’alcool et du cannabis sur la santé", "renvoi_bloc": "a4_doc6"}]}}, {"id": "ba4_seance4", "type": "seance", "data": {"numero": "4", "titre": "Prévention, réglementation et structures d’aide", "objectif": "Être capable de proposer des actions de prévention adaptées.", "competences": ["C2", "C4", "C5"]}}, {"type": "analyse", "id": "a4_analyse6", "data": {"titre": "CE QUE DIT LA LOI"}}, {"type": "document", "id": "a4_doc9", "data": {"label": "DOC. 9", "titre": "Produits licites et illicites, vente aux mineurs, conduite et usage de stupéfiants", "cadre": true, "corps": "MILDECA : « Le terme de drogues recouvre aussi bien les drogues illicites comme le cannabis, l’héroïne ou la cocaïne que les drogues licites comme la nicotine, l’alcool ou les médicaments. »\nCode de la santé publique, article L. 3342-1 : « La vente des boissons alcooliques à des mineurs est interdite. »\nCode de la route, article R. 234-1, I : « […] est puni de l’amende prévue pour les contraventions de la quatrième classe le fait de conduire un véhicule sous l’empire d’un état alcoolique caractérisé par : 1° Une concentration d’alcool dans le sang égale ou supérieure à 0,20 gramme par litre […] chez le conducteur titulaire d’un permis de conduire soumis au délai probatoire […] ; 2° Une concentration d’alcool dans le sang égale ou supérieure à 0,50 gramme par litre […] chez les autres conducteurs. »\nCode de la route, article L. 234-1, I : « […] le fait de conduire un véhicule sous l’empire d’un état alcoolique caractérisé par une concentration d’alcool dans le sang égale ou supérieure à 0,80 gramme par litre […] est puni de trois ans d’emprisonnement et de 9 000 euros d’amende. »\nCode de la route, article L. 235-1, I : « Toute personne qui conduit un véhicule […] alors qu’il résulte d’une analyse sanguine ou salivaire qu’elle a fait usage de substances ou plantes classées comme stupéfiants est punie de trois ans d’emprisonnement et de 9 000 euros d’amende. Si la personne se trouvait également sous l’empire d’un état alcoolique caractérisé par une concentration d’alcool dans le sang […] égale ou supérieure aux taux fixés par les dispositions législatives ou réglementaires du présent code, les peines sont portées à cinq ans d’emprisonnement et 15 000 euros d’amende. »\nCode de la santé publique, article L. 3421-1 : « L’usage illicite de l’une des substances ou plantes classées comme stupéfiants est puni d’un an d’emprisonnement et de 3750 euros d’amende. » « […] l’action publique peut être éteinte […] par le versement d’une amende forfaitaire d’un montant de 500 €. »", "source": "MILDECA, « Qu’est-ce qu’une drogue ? », 2023 ; Code de la santé publique et Code de la route (Légifrance), versions en vigueur au 27/10/2026.", "date_consultation": "2026-10-27"}}, {"type": "question_chapeau", "id": "a4_ch8", "data": {"numero": "1", "texte": "À partir du document 9 :", "reponse_attendue": ""}}, {"type": "classer", "id": "a4_q81", "data": {"competence": "C2", "numero": "1.1", "titre": "", "consigne": "**Classer** chaque produit selon son statut.", "categories": ["Produit licite", "Produit illicite"], "items": ["L’alcool", "Le cannabis", "La nicotine du tabac", "La cocaïne"], "classement": [0, 1, 0, 1], "indice": ""}, "el": {"standard": {"indice": "DOC. 9 : la citation de la MILDECA, les exemples de drogues illicites et de drogues licites.", "explication": "Licites : l’alcool et la nicotine du tabac. Illicites : le cannabis et la cocaïne."}}}, {"type": "sous_question", "id": "a4_q82", "data": {"competence": "C2", "numero": "1.2", "texte": "**Relever** le taux d’alcool à partir duquel un conducteur en permis probatoire est en infraction.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "0,20 gramme par litre de sang.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase.\nUn conducteur en permis probatoire est en infraction à partir de ……………………… gramme par litre de sang.", "lignes": 0, "reponse_allegee": "{{0,20}} gramme par litre", "reponse_attendue": "0,20"}, "essentiel": {"texte": "**Compléter** la phrase.\nMots proposés : 0,20 – 0,50.\nUn conducteur en permis probatoire est en infraction à partir de ……………………… gramme par litre de sang.", "lignes": 0, "reponse_attendue": "0,20"}}}, "el": {"standard": {"indice": "DOC. 9 : l’article R. 234-1 du Code de la route, le point 1° sur le permis soumis au délai probatoire.", "explication": "Un conducteur en permis probatoire est en infraction à partir de 0,20 gramme d’alcool par litre de sang (0,50 g/L pour les autres conducteurs)."}, "adapte": {"indice": "DOC. 9 : l’article R. 234-1, le point 1°.", "explication": "0,20 gramme par litre de sang.", "trous": ["0,20|0,2|0.20|0.2|0,20 g|0,2 g"]}, "essentiel": {"indice": "DOC. 9 : l’article R. 234-1, le point 1°. 0,50 concerne les autres conducteurs.", "explication": "0,20 gramme par litre de sang.", "trous": ["0,20|0,2|0.20|0.2"]}}}, {"type": "texte_libre", "id": "a4_cas83", "data": {"texte": "*Un intérimaire est contrôlé au volant : il est positif au cannabis et a 0,60 gramme d’alcool par litre de sang.*"}}, {"type": "sous_question", "id": "a4_q83", "data": {"competence": "C2", "numero": "1.3", "texte": "**Indiquer** les peines encourues par cet intérimaire.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Cinq ans d’emprisonnement et 15 000 euros d’amende.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase.\nCet intérimaire risque ……………………… ans d’emprisonnement et ……………………… euros d’amende.", "lignes": 0, "reponse_allegee": "{{cinq}} ans … {{15 000}} euros", "reponse_attendue": "cinq · 15 000"}, "essentiel": {"texte": "**Compléter** la phrase.\nMots proposés : trois ans et 9 000 € – cinq ans et 15 000 €.\nCet intérimaire risque ……………………… .", "lignes": 0, "reponse_attendue": "cinq ans et 15 000 €"}}}, "el": {"standard": {"indice": "DOC. 9 : l’article L. 235-1 du Code de la route, la deuxième phrase, quand la personne est aussi sous l’empire d’un état alcoolique.", "explication": "L’intérimaire a fait usage de cannabis et a 0,60 g d’alcool par litre de sang, au-dessus du taux fixé par le code : les peines sont portées à cinq ans d’emprisonnement et 15 000 euros d’amende."}, "adapte": {"indice": "DOC. 9 : l’article L. 235-1, la phrase « Si la personne se trouvait également… ».", "explication": "Cinq ans d’emprisonnement et 15 000 euros d’amende.", "trous": ["cinq|5", "15 000|15000|15 000 €|15000 €"]}, "essentiel": {"indice": "DOC. 9 : l’article L. 235-1, la deuxième phrase. Trois ans et 9 000 € concernent le cannabis seul.", "explication": "Cinq ans d’emprisonnement et 15 000 € d’amende.", "trous": ["cinq ans et 15 000 €|cinq ans et 15000 €|5 ans et 15 000 €|5 ans et 15000 €|cinq ans et 15 000 euros|5 ans et 15 000 euros|cinq ans et 15 000|5 ans et 15 000"]}}}, {"type": "analyse", "id": "a4_analyse7", "data": {"titre": "PRÉVENIR ET SE FAIRE AIDER"}}, {"type": "document", "id": "a4_doc10", "data": {"label": "DOC. 10", "titre": "La prévention des conduites addictives et les aides", "cadre": false, "corps": "", "source": "", "date_consultation": "2026-10-27"}}, {"type": "tableau", "id": "a4_doc10_tab", "data": {"titre": "", "cells": [[{"type": "prof", "content": "**Mesure**"}, {"type": "prof", "content": "**Ce que disent les textes**"}], [{"type": "prof", "content": "**L’alcool au travail**"}, {"type": "prof", "content": "Code du travail, art. R. 4228-20 : « Aucune boisson alcoolisée autre que le vin, la bière, le cidre et le poiré n’est autorisée sur le lieu de travail. Lorsque la consommation de boissons alcoolisées […] est susceptible de porter atteinte à la sécurité et la santé physique et mentale des travailleurs, l’employeur […] prévoit dans le règlement intérieur ou, à défaut, par note de service les mesures […]. Ces mesures, qui peuvent notamment prendre la forme d’une limitation voire d’une interdiction de cette consommation, doivent être proportionnées au but recherché. »"}], [{"type": "prof", "content": "**Le règlement intérieur**"}, {"type": "prof", "content": "Il peut prévoir « des mesures d’encadrement des pots d’entreprise » et « la liste des postes de sûreté et de sécurité pour lesquels un dépistage de consommation d’alcool ou de drogues peut être pratiqué » (INRS)."}], [{"type": "prof", "content": "**L’évaluation des risques**"}, {"type": "prof", "content": "« il est nécessaire d’inscrire le risque lié aux pratiques addictives dans le document unique et d’élaborer une démarche de prévention collective associée à la prise en charge des cas individuels. » (INRS)"}], [{"type": "prof", "content": "**Les pots**"}, {"type": "prof", "content": "« fournir systématiquement des boissons non alcoolisées » (INRS)"}], [{"type": "prof", "content": "**Les jeux d’argent**"}, {"type": "prof", "content": "« chaque opérateur de jeu doit demander au joueur d’encadrer sa capacité de jeu par la fixation de limites de jeu. » (Autorité nationale des jeux)"}], [{"type": "prof", "content": "**L’aide**"}, {"type": "prof", "content": "Drogues Info Service : 0 800 23 13 13, appel anonyme et gratuit. Alcool Info Service : 0 980 980 930. Tabac Info Service : 39 89. Dans un CSAPA, « une équipe composée de différents professionnels pourra vous proposer une aide médicale, psychologique et sociale » (Assurance Maladie)."}]], "table_preset": "sobre", "table_border": "fine", "table_row_height": "compact", "table_col_widths": [24, 76]}}, {"type": "texte_libre", "id": "a4_doc10_src", "data": {"texte": "Sources : Code du travail ; INRS, 2021 ; ANJ ; Santé publique France ; Assurance Maladie, 2026 (extraits)."}}, {"type": "question_chapeau", "id": "a4_ch9", "data": {"numero": "2", "texte": "À partir des documents 9 et 10 :", "reponse_attendue": ""}}, {"type": "classer", "id": "a4_q91", "data": {"competence": "C2", "numero": "2.1", "titre": "", "consigne": "**Classer** chaque mesure selon son objectif : éviter les consommations (prévention) ou les sanctionner (répression).", "categories": ["Prévention", "Répression"], "items": ["Fournir des boissons sans alcool lors des pots", "Amende forfaitaire de 500 € pour usage de stupéfiants", "Interdire la vente d’alcool aux mineurs", "Trois ans d’emprisonnement pour conduite après usage de stupéfiants", "Inscrire le risque addictif dans le document unique", "Demander aux joueurs de fixer des limites de jeu"], "classement": [0, 1, 0, 1, 0, 0], "indice": ""}, "el": {"standard": {"indice": "DOC. 9 et 10 : une mesure de prévention cherche à éviter les consommations ; une mesure de répression punit une infraction (amende, emprisonnement).", "explication": "Prévention : les boissons sans alcool lors des pots, l’interdiction de vendre de l’alcool aux mineurs, le risque addictif inscrit dans le document unique, les limites de jeu. Répression : l’amende forfaitaire de 500 € pour usage de stupéfiants, les trois ans d’emprisonnement pour conduite après usage de stupéfiants."}}}, {"type": "analyse", "id": "a4_analyse8", "data": {"titre": "PROPOSER DES SOLUTIONS"}}, {"type": "question_chapeau", "id": "a4_ch10", "data": {"numero": "3", "texte": "À partir de l’article, du tableau d’analyse (séance 1, question 1.1) et des documents 3 et 10 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "a4_q101", "data": {"competence": "C4", "numero": "3.1", "texte": "**Proposer** une mesure de prévention collective que l’entreprise peut prendre pour tous ses salariés.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Une mesure parmi : encadrer les pots et fournir des boissons sans alcool ; inscrire le risque addictif dans le document unique ; informer tous les salariés, intérimaires compris ; encadrer ou limiter l’alcool dans le règlement intérieur.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Proposer** une mesure de prévention collective que l’entreprise peut prendre pour tous ses salariés. Pistes : les pots, le document unique."}}}, "el": {"standard": {"indice": "Tableau d’analyse : les pots et les intérimaires ; DOC. 10 : les lignes « Le règlement intérieur », « L’évaluation des risques » et « Les pots ».", "explication": "Une mesure collective parmi : encadrer les pots et fournir des boissons sans alcool ; inscrire le risque addictif dans le document unique ; informer tous les salariés, intérimaires compris ; encadrer ou limiter l’alcool dans le règlement intérieur."}, "adapte": {"indice": "DOC. 10 : la ligne « Les pots », puis la ligne « L’évaluation des risques ».", "explication": "Une mesure collective parmi : fournir des boissons sans alcool lors des pots ; inscrire le risque addictif dans le document unique."}}}, {"type": "cocher_exactes", "id": "a4_q101_e", "data": {"competence": "C4", "numero": "3.1", "consigne": "**Choisir** la mesure de prévention collective, en cochant une proposition.", "items": [{"texte": "L’entreprise fournit des boissons sans alcool lors des pots", "correct": true}, {"texte": "Un salarié appelle Drogues Info Service", "correct": false}, {"texte": "Un sala
