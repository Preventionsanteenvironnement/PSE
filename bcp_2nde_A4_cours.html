cument", "data": {"label": "DOC. 5", "titre": "Ce que dit la loi", "cadre": true, "corps": "1. Un **produit licite** est autorisé mais encadré : le tabac et l’alcool ne sont pas vendus aux mineurs. Un **produit illicite** est interdit : le cannabis est un stupéfiant. Son usage peut être puni d’une amende forfaitaire de 500 €.\n2. Conduire est interdit à partir de 0,5 g d’alcool par litre de sang, et de 0,2 g avec un permis probatoire. En dessous de 0,8 g : amende forfaitaire de 135 € et retrait de 6 points. Conduire après usage de stupéfiants est interdit.\n3. Ces règles forment la **réglementation** ; les sanctions sont la **répression**.\n**Exemple.** Kylian, 22 ans, a le permis depuis un an : son permis est probatoire. Il est contrôlé au volant avec 0,3 g d’alcool par litre de sang.", "source": "D’après Service-Public, 08/2026.", "date_consultation": "2026-10-10"}}, {"id": "ba4_ch7", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 5 :", "reponse_attendue": ""}}, {"id": "ba4_q71", "type": "sous_question", "data": {"competence": "C1", "numero": "1.1", "texte": "**Relever** les deux sanctions que risque Kylian.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Une amende forfaitaire de 135 €.\n– Un retrait de 6 points.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1, "variantes": {"adapte": {"texte": "**Relever** les deux sanctions que risque Kylian.\n– Une amende forfaitaire de …………… €.\n– Un retrait de …………… points.", "reponse_attendue": "135 ; 6", "lignes": 0}, "essentiel": {"texte": "**Relever** les deux sanctions que risque Kylian.\n– Une amende forfaitaire de …………… €.\n– Un retrait de …………… points.", "reponse_attendue": "135\n6", "lignes": 0, "style_lignes": "tiret_guide"}}}, "el": {"standard": {"indice": "DOC. 5 : le point 2, la phrase « En dessous de 0,8 g… ».", "explication": "Avec 0,3 g, Kylian est en dessous de 0,8 g : il risque une amende forfaitaire de 135 € et un retrait de 6 points."}, "adapte": {"indice": "DOC. 5 : le point 2, la phrase « En dessous de 0,8 g… ».", "explication": "Une amende forfaitaire de 135 € et un retrait de 6 points.", "trous": ["135|135 €|135€|135 euros", "6|six"]}, "essentiel": {"indice": "DOC. 5 : le point 2, les deux nombres après « En dessous de 0,8 g ».", "explication": "Une amende de 135 € et un retrait de 6 points.", "trous": ["135|135 €|135€|135 euros", "6|six"]}}}, {"id": "ba4_q72", "type": "sous_question", "data": {"competence": "C3", "numero": "1.2", "texte": "**Déduire** du document pourquoi Kylian est en infraction.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Son permis est probatoire : le seuil est de 0,2 g par litre de sang, et il a 0,3 g.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Déduire** du document pourquoi Kylian est en infraction.\nSon permis est …………… : le seuil est de …………… g par litre de sang.", "reponse_attendue": "probatoire ; 0,2", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 5 : l’exemple de Kylian, puis le seuil du permis probatoire au point 2.", "explication": "Le permis de Kylian est probatoire : le seuil est de 0,2 g par litre de sang. Avec 0,3 g, il dépasse ce seuil."}, "adapte": {"indice": "DOC. 5 : l’exemple pour le permis de Kylian, le point 2 pour le seuil.", "explication": "Son permis est probatoire : le seuil est de 0,2 g par litre de sang, et il a 0,3 g.", "trous": ["probatoire", "0,2|0.2|0,2 g"]}}}, {"id": "ba4_q72_ess", "type": "sous_question", "data": {"competence": "C3", "numero": "1.2", "texte": "**Déduire** du document pourquoi Kylian est en infraction.\nÉléments proposés : probatoire – 0,2 – 0,5.\nSon permis est …………… : le seuil est de …………… g par litre de sang.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "probatoire\n0,2", "indice": "", "reponse_allege
