gènes, des substances métalliques provenant des sols, etc. »\n« Le traitement de l’eau vise en premier lieu à retenir les particules et matières en suspension dans l’eau : graviers, sables, poussières, etc. C’est l’objet de la clarification […]. »\n« La deuxième étape consiste en la désinfection de l’eau, afin d’éliminer tous les germes pathogènes, qu’il s’agisse de bactéries ou de virus. […] L’ajout de chlore en fin de traitement permet de garantir la potabilité de l’eau jusqu’au robinet. »\n« Si la concentration en nitrates de l’eau brute est supérieure aux normes de qualité, une filtration complémentaire est mise en oeuvre afin de les éliminer. »", "source": "eaufrance (OFB), « L’alimentation en eau potable » (extraits).", "date_consultation": "2026-10-27"}}, {"type": "question_chapeau", "id": "b4_ch6", "data": {"numero": "2", "texte": "À partir du document 5 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "b4_q61", "data": {"competence": "C2", "numero": "2.1", "texte": "**Nommer** les deux grandes étapes du traitement de potabilisation.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– La clarification.\n– La désinfection.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** les deux étapes.\nD’abord la ……………………… , qui retient les particules ; ensuite la ……………………… , qui élimine les germes.", "lignes": 0, "reponse_allegee": "la {{clarification}} … la {{désinfection}}", "reponse_attendue": "clarification · désinfection"}, "essentiel": {"texte": "**Compléter** les deux étapes.\nMots proposés : clarification – désinfection – épuration.\nD’abord la ……………………… ; ensuite la ……………………… .", "lignes": 0, "reponse_attendue": "clarification · désinfection"}}, "lignes_par_reponse": 1}, "el": {"standard": {"indice": "DOC. 5 : la troisième citation (« C’est l’objet de… ») et la quatrième citation (« La deuxième étape consiste en… »).", "explication": "La clarification retien : {"indice": "DOC. 6 : comparer, ligne par ligne, le résultat 2025 au maximum réglementaire. La dureté n’a pas de seuil.", "explication": "Oui : aucune E. coli ni entérocoque détectée (maximum 0) ; nitrates à 47 mg/L au maximum, sous 50 mg/L ; pesticides à moins de 0,02 µg/L, sous leurs limites."}, "adapte": {"indice": "DOC. 6 : la ligne des bactéries et la ligne des nitrates.", "explication": "Les résultats sont conformes : aucune bactérie n’est détectée et les nitrates restent sous 50 mg/L.", "trous": ["conformes|conforme", "bactérie|bacterie|bactéries|bacteries"]}, "essentiel": {"indice": "DOC. 6 : la ligne des bactéries, « Aucune détectée ».", "explication": "Résultats conformes. Aucune bactérie détectée.", "trous": ["conformes|conforme", "bactérie|bacterie|bactéries"]}}}, {"type": "texte_libre", "id": "b4_tr5", "data": {"texte": "*Une eau mal traitée a des effets sur la santé.*"}}, {"type": "document", "id": "b4_doc7", "data": {"label": "DOC. 7", "titre": "Une épidémie de gastro-entérites à Rousset (Bouches-du-Rhône)", "cadre": true, "corps": "« Le 14 avril 2026, des professionnels de santé de la commune de Rousset alertent l’Agence régionale de santé Provence-Alpes-Côte d’Azur (ARS Paca) sur une augmentation jugée inquiétante de cas de gastro-entérite aiguë (GEA) parmi leur patientèle. »\n« Un défaut de chloration est identifié dans le réseau d’eau potable de la commune […]. Une restriction d’usage de l’eau est par la suite recommandée par l’ARS, avec distribution d’eau embouteillée à la population. »\n« Le questionnaire a recueilli 1 182 réponses et a permis d’identifier 895 personnes ayant déclaré des symptômes entre le 2 avril et le 22 avril. »\n« La durée médiane des symptômes était de 3 jours avec une prédominance de fatigue, douleurs abdominales, nausées, diarrhée et vomissements. Au total, 32 personnes ont été hospitalisées et aucune forme grave n’a été signalée. »", "source": "Santé publique France, « Le point sur… Épidémie de gastro-entérites aiguës d’origine hydrique, Rousset – Bouches-du-Rhône – avril 2026 », 7 mai 2026 (extraits).", "date_consultation": "2026-10-27"}}, {"type": "question_chapeau", "id": "b4_ch8", "data": {"numero": "4", "texte": "À partir du document 7 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "b4_q81", "data": {"competence": "C2", "numero": "4.1", "texte": "**Relever** la cause de l’épidémie de Rousset.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Un défaut de chloration dans le réseau d’eau potable.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase.\nUn défaut de ……………………… a été identifié dans le réseau d’eau potable.", "lignes": 0, "reponse_allegee": "un défaut de {{chloration}}", "reponse_attendue": "chloration"}, "essentiel": {"texte": "**Compléter** la phrase.\nMots proposés : chloration – pression.\nUn défaut de ……………………… a été identifié dans le réseau d’eau potable.", "lignes": 0, "reponse_attendue": "chloration"}}}, "el": {"standard": {"indice": "DOC. 7 : la deuxième citation, ce qui est identifié dans le réseau d’eau potable.", "explication": "Un défaut de chloration dans le réseau d’eau potable de Rousset."}, "adapte": {"indice": "DOC. 7 : la deuxième citation, « Un défaut de… ».", "explication": "Un défaut de chloration.", "trous": ["chloration"]}, "essentiel": {"indice": "DOC. 7 : la deuxième citation. La pression n’y figure pas.", "explication": "Un défaut de chloration.", "trous": ["chloration"]}}}, {"type": "sous_question", "id": "b4_q82", "data": {"competence": "C2", "numero": "4.2", "texte": "**Indiquer** deux effets sur la santé d’une eau non potable.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "Deux réponses parmi : diarrhée, vomissements, nausées, douleurs abdominales, fatigue ; hospitalisation (32 personnes).", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** les deux effets.\nDes symptômes digestifs comme la ……………………… et les ……………………… .", "lignes": 0, "reponse_allegee": "la {{diarrhée}} et les {{vomissements}}", "reponse_attendue": "diarrhée · vomissements"}, "essentiel": {"texte": "**Compléter** les deux effets.\nMots proposés : diarrhée – vomissements – toux.\nDes symptômes comme la ……………………… et les ……………………… .", "lignes": 0, "reponse_attendue": "diarrhée · vomissements"}}, "lignes_par_reponse": 1}, "el": {"standard": {"indice": "DOC. 7 : la dernière citation, la liste des symptômes et le nombre de personnes hospitalisées.", "explication": "Deux effets parmi : diarrhée, vomissements, nausées, douleurs abdominales, fatigue ; 32 personnes hospitalisées."}, "adapte": {"indice": "DOC. 7 : la dernière citation, les deux derniers symptômes de la liste.", "explication": "La diarrhée et les vomissements.", "trous": ["diarrhée|diarrhee|diarrhées", "vomissements|vomissement"]}, "essentiel": {"indice": "DOC. 7 : la dernière citation. La toux n’y figure pas.", "explication": "La diarrhée et les vomissements.", "trous": ["diarrhée|diarrhee", "vomissements|vomissement"]}}}, {"type": "texte_libre", "id": "b4_tr6", "data": {"texte": "*Après usage, les eaux usées doivent être épurées.*"}}, {"type": "document", "id": "b4_doc8", "data": {"label": "DOC. 8", "titre": "L’épuration et les effets de la pollution de l’eau", "cadre": true, "corps": "« L’épuration des eaux usées avant leur rejet est donc indispensable pour réduire les quantités de polluants qu’elle contient. »\n« Une contamination microbiologique correspond à la présence dans l’eau de bactéries, de parasites ou de virus pathogènes, c’est-à-dire capables de provoquer des maladies. Essentiellement d’origine fécale, leur présence dans l’eau est principalement liée au rejet d’eaux usées insuffisamment épurées dans le milieu. »\n« L’eutrophisation est l’ensemble des symptômes que présente un écosystème aquatique à la suite d’un apport excessif de nutriments […]. »\n« L’apport |15400", "4 330|4330", "plus"]}}}, {"type": "analyse", "id": "b4_analyse5", "data": {"titre": "LES RÈGLES POUR PRÉSERVER L’EAU"}}, {"type": "document", "id": "b4_doc11", "data": {"label": "DOC. 11", "titre": "L’eau dans la loi et sur la facture", "cadre": true, "corps": "Code de l’environnement, article L. 210-1 : « L’eau fait partie du patrimoine commun de la nation. […] »\nCode de l’environnement, article L. 110-1, II : « […] 3° Le principe pollueur-payeur, selon lequel les frais résultant des mesures de prévention, de réduction de la pollution et de lutte contre celle-ci doivent être supportés par le pollueur ; »\neaufrance : « Ce principe est mis en œuvre au travers de taxes et de redevances sur les activités et les usages susceptibles de générer une pollution des milieux aquatiques. L’argent collecté permet de financer des actions de réduction de la pollution et de gestion durable de l’eau. »\nArrêté du 10 juillet 1996, article 3 : « La rubrique Organismes publics distingue les redevances suivantes : […] Consommation eau potable (agence de l’eau) ; […] Prélèvement sur la ressource en eau (agence de l’eau) ; […] »", "source": "Code de l’environnement, art. L. 210-1 et L. 110-1 (Légifrance) ; eaufrance, « Financer l’eau par l’eau » ; arrêté du 10 juillet 1996 relatif aux factures de distribution de l’eau et de collecte et de traitement des eaux usées, art. 3 (extraits).", "date_consultation": "2026-10-27"}}, {"type": "question_chapeau", "id": "b4_ch12", "data": {"numero": "3", "texte": "À partir du document 11 et de la situation :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "b4_q121", "data": {"competence": "C2", "numero": "3.1", "texte": "**Nommer** le principe qui fait payer au pollueur les frais de lutte contre la pollution.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Le principe pollueur-payeur.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** le nom du principe.\nLe principe ……………………… - ……………………… .", "lignes": 0, "reponse_allegee": "le principe {{pollueur}}-{{payeur}}", "reponse_attendue": "pollueur · payeur"}, "essentiel": {"texte": "**Compléter** le nom du principe.\nMots proposés : pollueur – payeur – patrimoine.\nLe principe ……………………… - ……………………… .", "lignes": 0, "reponse_attendue": "pollueur · payeur"}}}, "el": {"standard": {"indice": "DOC. 11 : l’article L. 110-1 du Code de l’environnement, le point 3°.", "explication": "Le principe pollueur-payeur : les frais de prévention et de lutte contre la pollution sont supportés par le pollueur."}, "adapte": {"indice": "DOC. 11 : l’article L. 110-1, le nom du principe.", "explication": "Le principe pollueur-payeur.", "trous": ["pollueur", "payeur"]}, "essentiel": {"indice": "DOC. 11 : le point 3°. « Patrimoine » vient d’un autre article.", "explication": "Le principe pollueur-payeur.", "trous": ["pollueur", "payeur"]}}}, {"type": "sous_question", "id": "b4_q122", "data": {"competence": "C3", "numero": "3.2", "texte": "**Expliquer** à quoi sert l’argent payé par Aurélie dans la rubrique « organismes publics » de sa facture.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Ce sont des redevances versées à l’agence de l’eau : cet argent finance des actions de réduction de la pollution et de gestion durable de l’eau.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** l’explication.\nCe sont des ……………………… versées à l’agence de l’eau ; elles financent des actions de réduction de la ……………………… et de gestion durable de l’eau.", "lignes": 0, "reponse_allegee": "des {{redevances}} … de la {{pollution}}", "reponse_attendue": "redevances · pollution"}, "essentiel": {"texte": "**Compléter** l’explication.\nMots proposés : redevances – pollution – piscines.\nCe sont des ……………………… versées à l’agence de l’eau ; elles financent la réduction de la ……………………… .", "lignes": 0, "reponse_attendue":  "La commune répare les fuites du réseau. Des douches courtes sont une mesure individuelle ; le chlore désinfecte l’eau, il n’en augmente pas la quantité."}}}, {"type": "sous_question", "id": "b4_q142", "data": {"competence": "C4", "numero": "5.2", "texte": "**Proposer** une mesure collective pour réduire les nitrates dans l’eau d’Aurélie.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Une mesure parmi : l’agence de l’eau finance, grâce aux redevances, des actions qui réduisent les rejets de nitrates (pratiques agricoles) autour du captage ; l’usine met en œuvre une filtration complémentaire des nitrates.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Proposer** une mesure collective pour réduire les nitrates dans l’eau d’Aurélie. Pistes : l’origine des nitrates, l’usine de traitement."}}}, "el": {"standard": {"indice": "DOC. 6 : l’origine des nitrates ; DOC. 11 : l’usage des redevances ; DOC. 5 : le traitement des nitrates.", "explication": "Une mesure parmi : l’agence de l’eau finance, grâce aux redevances, des actions qui réduisent les rejets de nitrates (pratiques agricoles) autour du captage ; l’usine met en œuvre une filtration complémentaire des nitrates."}, "adapte": {"indice": "DOC. 6 : la ligne « Nitrates », leur origine ; DOC. 5 : la dernière citation.", "explication": "Une mesure parmi : financer des actions qui réduisent les rejets de nitrates des pratiques agricoles ; mettre en œuvre à l’usine une filtration complémentaire des nitrates."}}}, {"type": "cocher_exactes", "id": "b4_q142_e", "data": {"competence": "C4", "numero": "5.2", "consigne": "**Choisir** la mesure collective qui réduit les nitrates dans l’eau, en cochant une proposition.", "items": [{"texte": "Guillaume achète moins de viande de bœuf", "correct": false}, {"texte": "L’usine ajoute une filtration complémentaire des nitrates", "correct": true}, {"texte": "Le préfet inter
