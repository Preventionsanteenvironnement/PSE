<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'histoire de Maël C3 · C3 — Les acteurs de prévention · Première Bac Pro · PSE</title>
<meta name="description" content="Huit étapes du mal de dos de Maël au poste d'étiquetage : choisir le bon acteur pour faire avancer l'histoire.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--fond1:#0F3D36;--fond2:#1D5E50;--clair:#F4F8F5;--encre:#13302A;--doux:#5B7A71;--jaune:#FFD23F;--vrai:#2FBF71;--vrai-f:#16733F;--faux:#FF6B57;--faux-f:#B3261E;--ligne:rgba(255,255,255,.22);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--clair);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:1.08rem;line-height:1.5;
  background:radial-gradient(1200px 600px at 15% -10%,rgba(255,210,63,.13),transparent 60%),radial-gradient(900px 700px at 110% 110%,rgba(120,220,180,.14),transparent 60%),linear-gradient(160deg,var(--fond1),var(--fond2));background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--jaune);outline-offset:3px}
.page{max-width:1000px;margin:0 auto;padding:1.4rem 1.1rem 3rem}
header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(2rem,6vw,3rem);line-height:1;margin:0}
header p{margin:.45rem 0 0;opacity:.85;max-width:62ch}
.jeu{display:grid;gap:1.1rem;margin-top:1.2rem}
@media (min-width:880px){.jeu{grid-template-columns:290px 1fr;align-items:start}.bord{position:sticky;top:1rem}}
.bord{background:rgba(9,38,33,.9);border:2px solid var(--ligne);border-radius:24px;padding:1.1rem}
.bord h2{font-size:1rem;margin:0 0 .5rem;opacity:.9}
.douleur .lab{display:flex;justify-content:space-between;font-weight:700;margin-bottom:.3rem}
.douleur .piste{height:14px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.douleur .piste span{display:block;height:100%;border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1),background .5s}
.poste{margin:.9rem 0;padding:.6rem .7rem;border-radius:12px;background:rgba(255,255,255,.08);font-size:.95rem}
.poste b{display:block}
.jetons{display:flex;flex-wrap:wrap;gap:.35rem}
.jeton{border-radius:999px;padding:.2rem .6rem;font-size:.85rem;font-weight:700;background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.35);opacity:.55}
.jeton.on{background:var(--vrai);color:#04230F;border:1px solid var(--vrai);opacity:1}
.scene{background:var(--clair);color:var(--encre);border-radius:24px;padding:clamp(1.1rem,3.5vw,1.8rem);box-shadow:0 30px 60px -25px rgba(0,0,0,.6)}
.num{font-weight:700;color:var(--doux);font-size:.95rem;display:flex;justify-content:space-between}
.pts{display:flex;gap:5px;align-items:center}
.pts i{width:10px;height:10px;border-radius:50%;background:#C9D3CD}
.pts i.fait{background:var(--vrai-f)}.pts i.ici{background:#E0A800}
.moment{display:flex;gap:.8rem;align-items:center;margin:.5rem 0 .3rem}
.moment .emo{font-size:2.6rem;line-height:1}
.moment h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1.35rem,3.6vw,1.8rem);margin:0;line-height:1.15}
.recit{font-size:1.14rem;margin:.3rem 0 .8rem}
.question{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.25rem;line-height:1.25;margin:0 0 .7rem}
.opts{display:grid;gap:.5rem}
.opt{text-align:left;border:2px solid #B9C5BE;background:#fff;border-radius:16px;padding:.8rem 1rem;font-weight:700;display:flex;gap:.6rem;align-items:center}
.opt .ic{font-size:1.4rem}
.opt:hover{border-color:var(--encre)}
.opt:disabled{cursor:default}
.opt.bon{background:#DDF4E7;border-color:var(--vrai-f)}
.opt.mauvais{background:#FFE3DE;border-color:var(--faux-f)}
.suite{margin-top:1rem;border-radius:16px;padding:.8rem 1rem}
.suite.ok{background:#DDF4E7;border-left:6px solid var(--vrai-f)}
.suite.ko{background:#FFE3DE;border-left:6px solid var(--faux-f)}
.suite b{display:block}
.continuer{width:100%;height:56px;border-radius:999px;border:0;background:var(--encre);color:var(--clair);font-weight:700;font-size:1.1rem;margin-top:.9rem}
.lire{border:2px solid #B9C5BE;background:transparent;border-radius:999px;padding:.3rem .8rem;font-size:.95rem;font-weight:700;margin-top:.8rem}
.frise{list-style:none;padding:0;margin:1rem 0;border-left:4px solid var(--vrai-f)}
.frise li{padding:.2rem 0 .7rem 1rem;position:relative}
.frise li::before{content:"";position:absolute;left:-11px;top:.45rem;width:14px;height:14px;border-radius:50%;background:var(--vrai-f);border:3px solid var(--clair)}
.etoiles{font-size:2.2rem;color:#E0A800;letter-spacing:.15rem}
.retenir{border:3px solid var(--encre);border-radius:16px;padding:.8rem 1rem;margin-top:.8rem}
.retenir b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.1rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.douleur .piste span{transition:none}}

.fil{margin:0 0 .7rem}
.fil a{color:var(--clair);opacity:.85;text-decoration:underline;text-underline-offset:4px;font-size:1rem;padding:.35rem .1rem;display:inline-block}
.fil a:hover{opacity:1}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>L'histoire de Maël</h1>
    <p>Maël a mal au dos au poste d'étiquetage de Novalim. À chaque étape, choisis le bon acteur pour faire avancer l'histoire.</p>
  </header>
  <nav class="fil" aria-label="Fil d'Ariane"><a href="bcp_1ere_C3_jeux.html">← Toutes les révisions C3</a></nav>
  <div class="jeu">
    <aside class="bord" aria-label="Suivi">
      <h2>Mal de dos de Maël</h2>
      <div class="douleur"><div class="lab"><span id="dLab"></span><span id="dVal"></span></div><div class="piste"><span id="dBar"></span></div></div>
      <div class="poste" id="poste"></div>
      <h2>Acteurs mobilisés</h2>
      <div class="jetons" id="jetons"></div>
    </aside>
    <main class="scene" id="scene"></main>
  </div>
  <div class="sr" aria-live="polite" id="annonce"></div>
</div>
<script>
/* ===== SCÈNES — opts [icône, texte, 1 si juste, conséquence] ===== */
const JETONS=[["pprp","Salarié compétent"],["med","Médecin du travail"],["cse","CSE"],["emp","Employeur"],["carsat","Carsat"],["duerp","DUERP"],["sst","SST"],["insp","Inspection du travail"]];
const SCENES=[
 {emoji:"🌙",titre:"Lundi soir",jeton:"pprp",douleur:7,poste:"Cartons posés au sol",
  recit:"Maël rentre chez lui avec le bas du dos douloureux. Demain, il retourne au poste d'étiquetage.",
  q:"À qui en parler en premier, dans l'entreprise ?",
  opts:[["📋","À Karine, la salariée compétente (PPRP).",1,"Karine note le problème. Elle aide l'employeur à évaluer les risques du poste et à mettre en place des actions de prévention."],
        ["⚖️","À l'inspection du travail.",0,"L'inspection du travail est un service de l'État. On commence par les acteurs de l'entreprise, qui peuvent agir vite."],
        ["🤐","À personne : ça va passer.",0,"Le salarié doit prendre soin de sa santé. Se taire laisse le risque en place, pour lui et pour ses collègues."]]},
 {emoji:"🩺",titre:"Mardi",jeton:"med",douleur:7,poste:"Cartons posés au sol",
  recit:"Karine conseille à Maël de demander une visite auprès d'un professionnel de santé qui peut proposer un aménagement de son poste.",
  q:"Qui Maël doit-il rencontrer ?",
  opts:[["⛑️","Le sauveteur secouriste du travail.",0,"Le SST porte les premiers secours : il ne peut pas proposer un aménagement de poste."],
        ["🩺","Le médecin du travail, au service de prévention et de santé au travail.",1,"Le médecin du travail examine Maël. Il propose de poser les cartons sur une table à la bonne hauteur : c'est une transformation du poste."],
        ["💶","Un ingénieur-conseil de la Carsat.",0,"La Carsat conseille l'entreprise, mais c'est le médecin du travail qui suit la santé de Maël et propose un aménagement."]]},
 {emoji:"🗣️",titre:"Jeudi",jeton:"cse",douleur:6,poste:"Cartons posés au sol · aménagement proposé",
  recit:"Maël apprend que deux collègues du même poste ont les mêmes douleurs depuis des mois. Ils veulent que leur réclamation arrive à la direction.",
  q:"Quel acteur peut présenter leur réclamation à l'employeur ?",
  opts:[["🗣️","Le comité social et économique (CSE).",1,"Les élus du CSE présentent la réclamation collective à l'employeur. Avec 62 salariés, le CSE de Novalim peut aussi analyser le risque et proposer des actions."],
        ["⛑️","Le sauveteur secouriste du travail.",0,"Le SST ne représente pas les salariés : il porte les premiers secours."],
        ["💶","La Carsat.",0,"La Carsat est un organisme extérieur : elle ne présente pas les réclamations des salariés."]]},
 {emoji:"👔",titre:"La semaine suivante",jeton:"emp",douleur:5,poste:"Tables à la bonne hauteur : décision prise",
  recit:"Le médecin du travail et le CSE demandent qu'on installe des tables pour que les cartons ne soient plus posés au sol.",
  q:"Qui décide et met en place les moyens nécessaires ?",
  opts:[["📋","Karine, la salariée compétente, toute seule.",0,"Karine aide l'employeur, mais sa désignation ne lui retire pas sa responsabilité."],
        ["🗣️","Le CSE.",0,"Le CSE présente les réclamations et propose des actions : il ne décide pas à la place de l'employeur."],
        ["👔","L'employeur, responsable de la santé et de la sécurité.",1,"La direction de Novalim décide d'installer des tables élévatrices. C'est son obligation : prendre les mesures nécessaires pour protéger la santé des travailleurs."]]},
 {emoji:"💶",titre:"Le budget",jeton:"carsat",douleur:3,poste:"Tables élévatrices installées",
  recit:"Les tables élévatrices coûtent cher et le budget de Novalim est serré.",
  q:"Vers quel organisme la direction peut-elle se tourner ?",
  opts:[["⚖️","L'inspection du travail.",0,"L'inspection du travail contrôle l'application du code du travail : elle ne finance pas les équipements."],
        ["💶","La Carsat.",1,"La Carsat accompagne Novalim et accorde une aide financière pour la prévention. Les tables sont installées !"],
        ["🩺","Le service de prévention et de santé au travail.",0,"Le SPST suit la santé des travailleurs : il n'accorde pas d'aide financière."]]},
 {emoji:"📄",titre:"La mise à jour",jeton:"duerp",douleur:2,poste:"Tables élévatrices installées · risque évalué",
  recit:"Avec l'aide de Karine, l'employeur doit inscrire le risque lié au port des cartons et les mesures prises.",
  q:"Dans quel document ?",
  opts:[["📄","Le contrat de travail de Maël.",0,"Le contrat de travail ne sert pas à évaluer les risques de l'entreprise."],
        ["📑","Le règlement intérieur.",0,"Ce n'est pas le document de l'évaluation des risques."],
        ["🗂️","Le document unique d'évaluation des risques (DUERP).",1,"L'employeur inscrit le résultat de l'évaluation des risques dans le DUERP. Le poste d'étiquetage y figure désormais."]]},
 {emoji:"⛑️",titre:"Un mois plus tard",jeton:"sst",douleur:1,poste:"Poste amélioré",
  recit:"Le dos de Maël va beaucoup mieux. Mais ce matin, un collègue fait un malaise près de la nouvelle table.",
  q:"Qui intervient tout de suite ?",
  opts:[["⛑️","Un sauveteur secouriste du travail (SST) de l'atelier.",1,"La liste des SST est affichée à l'entrée de l'atelier. Le SST porte les premiers secours au collègue."],
        ["🩺","Le médecin du travail.",0,"Il n'est pas dans l'atelier : c'est le SST, formé et présent sur place, qui intervient."],
        ["⏳","Personne : on attend la fin de la journée.",0,"Face à un malaise, il faut agir tout de suite : le SST porte les premiers secours."]]},
 {emoji:"⚖️",titre:"Et si…",jeton:"insp",douleur:1,poste:"Poste amélioré",
  recit:"Imaginons que la direction n'ait rien fait, malgré les réclamations et l'avis du médecin du travail.",
  q:"Quel service de l'État un membre du CSE aurait-il pu saisir ?",
  opts:[["💶","La Carsat.",0,"La Carsat conseille et finance, mais c'est l'inspection du travail qui veille à l'application du code du travail."],
        ["⚖️","L'inspection du travail.",1,"Un agent de contrôle aurait pu entrer dans l'atelier, constater le problème et adresser des observations ou une mise en demeure à l'employeur."],
        ["⛑️","Le sauveteur secouriste du travail.",0,"Le SST est un salarié de l'entreprise, pas un service de l'État."]]}
];
const $=id=>document.getElementById(id);
function annoncer(t){$("annonce").textContent=t}
const CLE="histoire-mael-C3";let pref={etoiles:0};
try{pref=Object.assign(pref,JSON.parse(localStorage.getItem(CLE)||"{}"))}catch(e){}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(pref))}catch(e){}}
function melanger(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let k,err,gagnes,douleur,poste;

function bord(){
  $("dLab").textContent=douleur>=6?"Douleur forte":douleur>=3?"Douleur moyenne":"Douleur légère";
  $("dVal").textContent=`${douleur} / 10`;
  $("dBar").style.width=(douleur*10)+"%";$("dBar").style.background=douleur>=6?"#FF6B57":douleur>=3?"#FFD23F":"#2FBF71";
  $("poste").innerHTML=`<b>Poste d'étiquetage</b>${poste}`;
  $("jetons").innerHTML=JETONS.map(([id,n])=>`<span class="jeton${gagnes.has(id)?" on":""}">${gagnes.has(id)?"✓ ":""}${n}</span>`).join("");
}
function accueil(){
  k=0;err=0;gagnes=new Set();douleur=7;poste="Cartons posés au sol";bord();
  $("scene").innerHTML=`<div class="moment"><span class="emo" aria-hidden="true">📦</span><h2>Novalim, poste d'étiquetage</h2></div>
    <p class="recit">Maël, 22 ans, est agent de conditionnement chez Novalim depuis trois mois. Depuis trois semaines, au poste d'étiquetage, il se baisse toute la journée pour prendre des cartons posés au sol. Le soir, il a mal au bas du dos.</p>
    <p class="recit"><b>Ta mission :</b> à chaque étape, choisis l'acteur qui peut agir. Si tu te trompes, l'histoire t'explique pourquoi et tu peux réessayer.</p>
    <button class="continuer" id="bGo">Commencer l'histoire</button>`;
  $("bGo").onclick=scene;$("bGo").focus({preventScroll:true});
}
function scene(){
  const S=SCENES[k],opts=melanger(S.opts.map((o,i)=>[o,i]));let premier=true;
  $("scene").innerHTML=`<div class="num"><span>Étape ${k+1} / ${SCENES.length}</span><span class="pts" aria-hidden="true">${SCENES.map((_,j)=>`<i class="${j<k?"fait":j===k?"ici":""}"></i>`).join("")}</span></div>
    <div class="moment"><span class="emo" aria-hidden="true">${S.emoji}</span><h2>${S.titre}</h2></div>
    <p class="recit">${S.recit}</p><p class="question">${S.q}</p>
    <div class="opts">${opts.map(([o,i])=>`<button class="opt" data-i="${i}"><span class="ic" aria-hidden="true">${o[0]}</span>${o[1]}</button>`).join("")}</div>
    <div id="suite"></div><button class="lire" id="bLire">🔊 Écouter</button>`;
  $("bLire").onclick=()=>lire(`${S.recit} ${S.q} ${S.opts.map(o=>o[1]).join(" Ou : ")}`);
  $("scene").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=S.opts[+b.dataset.i];
    if(o[2]){
      $("scene").querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add("bon");
      gagnes.add(S.jeton);douleur=S.douleur;poste=S.poste;
      const nxt=SCENES[k+1];if(nxt){douleur=Math.min(douleur,nxt.douleur)}
      bord();
      $("suite").innerHTML=`<div class="suite ok"><b>✓ ${premier?"Bon choix !":"C'est ça."}</b>${o[3]}</div><button class="continuer" id="bCont">${k<SCENES.length-1?"La suite de l'histoire":"Voir la fin"}</button>`;
      $("bCont").onclick=()=>{arreterVoix();k++;k<SCENES.length?scene():fin()};$("bCont").focus({preventScroll:true});
      annoncer(o[3]);
    }else{
      if(premier){premier=false}err++;b.classList.add("mauvais");b.disabled=true;
      $("suite").innerHTML=`<div class="suite ko"><b>Pas le bon acteur.</b>${o[3]}</div>`;annoncer(o[3]);
    }
  });
  annoncer(`${S.titre}. ${S.recit} ${S.q}`);
}
function fin(){
  const et=err===0?3:err<=3?2:1;pref.etoiles=Math.max(pref.etoiles,et);sauver();
  douleur=1;poste="Poste amélioré : tables élévatrices, risque inscrit au DUERP";bord();
  $("scene").innerHTML=`<div class="moment"><span class="emo" aria-hidden="true">🎉</span><h2>Maël n'a plus mal au dos</h2></div>
    <div class="etoiles" aria-label="${et} étoiles sur 3">${"★".repeat(et)}<span style="opacity:.25">${"★".repeat(3-et)}</span></div>
    <p style="margin:0">${err} erreur${err>1?"s":""} d'aiguillage.</p>
    <ol class="frise">
      <li><b>Karine, salariée compétente :</b> repère le problème et aide l'employeur.</li>
      <li><b>Médecin du travail :</b> propose de transformer le poste.</li>
      <li><b>CSE :</b> présente la réclamation des salariés.</li>
      <li><b>Employeur :</b> décide et met en place les moyens. Il reste responsable.</li>
      <li><b>Carsat :</b> accorde une aide financière.</li>
      <li><b>DUERP :</b> le risque et les mesures sont inscrits.</li>
      <li><b>SST :</b> porte les premiers secours en cas de malaise.</li>
      <li><b>Inspection du travail :</b> contrôle si l'employeur ne respecte pas ses obligations.</li>
    </ol>
    <div class="retenir"><b>À retenir</b>Pour la santé et la sécurité au travail, chaque acteur a son rôle : dans l'entreprise, ils agissent au quotidien ; à l'extérieur, ils conseillent, contrôlent et accompagnent. Tous agissent ensemble.</div>
    <button class="continuer" id="bRec">Rejouer l'histoire</button>`;
  $("bRec").onclick=accueil;$("bRec").focus({preventScroll:true});
}
let voix=null;
function choisirVoix(){const l=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));voix=l.find(x=>/fr-FR/i.test(x.lang)&&/(google|natural|online|amélie|thomas|denise|henri)/i.test(x.name))||l.find(x=>/fr-FR/i.test(x.lang))||l[0]||null}
if("speechSynthesis" in window){choisirVoix();speechSynthesis.onvoiceschanged=choisirVoix}
function lire(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\bCSE\b/g,"C S E").replace(/\bSST\b/g,"S S T").replace(/\bPPRP\b/g,"P P R P").replace(/\bDUERP\b/g,"D U E R P"));u.lang="fr-FR";if(voix)u.voice=voix;u.rate=.95;speechSynthesis.speak(u)}
function arreterVoix(){if("speechSynthesis" in window)speechSynthesis.cancel()}
accueil();
</script>
</body>
</html>
