    {"l":"Je dis merci à la personne","ok":bonne==="merci"},
    {"l":"Je le garde en mémoire pour le refaire","ok":bonne==="memoire"},
    {"l":"Piège : j'efface le bon moment","ok":bonne==="piege"}
  ];
};
