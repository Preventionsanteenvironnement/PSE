        {"ic":"","html":"Un conflit n’est pas forcément négatif. C’est souvent <strong>deux besoins qui se heurtent</strong>. Bien réglé, il renforce la relation."},

        {"ic":"","html":"Ce qui envenime : généraliser, ressortir le passé, menacer, humilier, régler le conflit devant un groupe ou par messages."},

      "steps":[
        "Je me calme avant de parler.",
        "J’écoute l’autre et je reformule son besoin.",

    {
      "temps":"situation",
      "type":"scenario",
      "tag":"En situation",
      "scenes":[
        {
          "text":"Colocation. Ton colocataire n’a pas fait sa part du ménage depuis deux semaines. Vous en parlez enfin, au calme. Il dit : « Je rentre à 21 heures, je suis épuisé. »",
          "choices":[
            {"l":"« Si je comprends bien, tes soirées sont trop chargées. On répartit autrement, le week-end ? »","good":true,"fb":"Tu reformules son besoin, puis tu proposes une solution qui respecte le tien aussi."},
            {"l":"« Moi aussi je suis fatigué, ce n’est pas une excuse. Tu fais ta part ce soir, c’est tout. »","good":false,"fb":"Tu restes sur ta position. Il va se braquer et rien ne changera."},
            {"l":"« Bon, laisse, je ferai tout. Ce n’est pas grave, je comprends que tu sois épuisé. »","good":false,"fb":"Tu effaces ton besoin. Dans un mois, la rancœur sera plus forte que le désaccord."}
          ]
        },
        {
          "img":IMG.ecoute,

          "choices":[
            {"l":"« Ce n’est pas vrai, j’ai eu autant de mal que toi à trouver le mien. »","good":false,"fb":"Tu te défends. Mais c’est elle qui a un besoin touché. Le moment est à l’écoute."},
            {"l":"« Tu as l’air vraiment déçue pour ce stage. Tu veux m’en parler ? »","good":true,"fb":"Tu ne prends pas sa phrase pour toi. Tu l’aides en reformulant son émotion."},

        {
          "text":"Ton copain veut passer le réveillon dans sa famille. Toi, dans la tienne. Les deux familles comptent sur vous.",

            {"l":"« On fait le réveillon chez toi cette année, chez moi l’an prochain, et on passe le 1er chez mes parents. »","good":true,"fb":"Une solution acceptable pour les deux : chacun obtient une partie de ce qui compte pour lui."},
            {"l":"« Tu fais toujours passer ta famille avant moi. Va chez eux, j’irai chez les miens. »","good":false,"fb":"« Toujours » accuse. Et chacun part de son côté : personne n’a ce qu’il voulait vraiment."},
            {"l":"« On demande à nos parents de choisir à notre place. Comme ça, on ne se dispute plus entre nous. »","good":false,"fb":"Vous laissez la décision à d’autres. Le désaccord entre vous n’est pas réglé."}
          ]
        },
        {
          "img":IMG.telephone,
          "alt":"Une jeune femme parle à un jeune homme qui regarde son téléphone.",

          "choices":[
            {"l":"Tu écris dans le groupe qui a raison selon toi, avec des captures d’écran.","good":false,"fb":"Prendre parti en public ajoute de l’huile sur le feu. Le conflit grossit."},
            {"l":"Tu proposes : « On arrête ici. Réglez-le à deux, en face, ou avec un adulte. »","good":true,"fb":"Un conflit se règle mal en public et par écrit. Tu proposes un cadre plus sûr."},
            {"l":"Tu quittes le groupe et tu bloques les deux élèves pour la semaine.","good":false,"fb":"Tu te protèges, ce qui peut se comprendre. Mais rien n’aide à calmer le conflit."}
          ]
        }
      ]
    },

    {
      "temps":"situation",
      "type":"moi",
      "tag":"Et moi ?",
      "title":"Un désaccord que je vis",
      "intro":"Pense à un désaccord réel, récent ou en cours, pas trop lourd. Tu n’as pas à le raconter.",
      "steps":[
        {"kind":"choix","q":"Avec qui est ce désaccord ?","carnet":"Avec qui","autre":true,"opts":["Un ami ou une amie","Mon copain ou ma copine","Ma famille","Un colocataire ou un voisin","Un camarade de classe","Un collègue ou un responsable"]},
        {"kind":"corps","q":"Quand tu y penses, où le sens-tu dans ton corps ?","carnet":"Où je le sens"},
        {"kind":"emotion","q":"Quelle émotion ressens-tu ?","carnet":"Mon émotion"},
        {"kind":"texte","q":"Quel est ton besoin, derrière ce que tu réclames ?","carnet":"Mon besoin","lignes":2,"max":200,
         "aide":"Ce qui est important pour moi, c’est…",
         "etiquettes":["J’ai besoin de","calme","respect","être écouté","du temps","de la confiance","de l’équité"]},
        {"kind":"texte","q":"Et l’autre, quel est son besoin, à ton avis ?","carnet":"Son besoin, selon moi","lignes":2,"max":200,

         "criteres":["J’imagine son besoin, pas ses défauts","Je pourrais le lui dire sans le vexer"]},

      "fin":"Tes idées sont rangées dans ton carnet. Tu peux les proposer à l’autre, au calme, comme point de départ."

    {
      "temps":"point",

        {"ic":"","html":"Si nos besoins s’opposent, <strong>on négocie</strong> : se calmer, écouter, dire son besoin, chercher ensemble."},

        {"ic":"","html":"Pas de règlement en public ni par messages. En cas de blocage ou de violence, je demande l’aide d’un tiers."}

      "self":[

        {"q":"L’étape la plus difficile pour moi :","carnet":"Étape difficile","opts":["Me calmer","Écouter sans couper","Dire mon besoin","Chercher plusieurs solutions","Accepter une solution qui n’est pas la mienne"]},
        {"q":"Si je bloque, la personne qui pourrait m’aider :","carnet":"Qui pourrait m’aider","opts":["Un ami de confiance","Un membre de ma famille","Un adulte du lycée","Un responsable au travail","Je ne sais pas encore"]}
      ],
      "defi":{
        "q":"Choisis une seule chose à essayer cette semaine.",
        "opts":["Reformuler le besoin de l’autre avant de répondre","Chercher le besoin derrière une position, la mienne ou celle de l’autre","Proposer deux solutions au lieu d’une seule","Reporter une dispute au lieu de la régler par messages"]

      "duo":{

        "roleB":"Tu tiens à ton sommeil. Dis ton besoin, écoute celui de A, cherche une solution avec lui.",
        "etapes":["Chacun dit sa position, puis son besoin.","Chacun reformule le besoin de l’autre.","Ensemble, trouvez au moins trois solutions.","Choisissez-en une acceptable pour les deux, puis changez de situation : deux amis ne veulent pas le même film."],
        "observe":["Chacun a reformulé le besoin de l’autre","Au moins trois solutions ont été proposées","La solution choisie convient aux deux"],
        "observeTitre":"Un troisième élève, ou la classe, observe et coche"
      }
    }
  ]
