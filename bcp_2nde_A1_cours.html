ntation, l'activité physique, l'absence de douleur.\nLe **bien-être mental** concerne les émotions, la confiance en soi et l'équilibre psychique.\nLe **bien-être social** concerne les relations avec les autres : la famille, les amis, les collègues, la place tenue dans un groupe.\nLe **capital santé** est l'état de santé dont une personne dispose à un moment donné. Il n'est pas fixé une fois pour toutes : certaines habitudes le dégradent, d'autres le préservent.", "cadre": true, "image_nom": "Schéma « La santé selon l'OMS ». Au centre, un cercle portant le mot SANTÉ. Trois cercles y sont reliés : le bien-être physique, illustré par une personne qui court ; le bien-être mental, illustré par une tête et un cerveau ; le bien-être social, illustré par un groupe de trois personnes. En haut, une phrase rappelle que la santé est un état de complet bien-être physique, mental et social.", "image_w": 2144, "image_h": 1366, "source": "", "url_source": "https://www.who.int/fr/about/governance/constitution", "date_consultation": "2026-08-30", "date_donnees": "1946", "statut_source": "institutionnelle", "variantes": {"essentiel": {"corps": "L'Organisation mondiale de la santé (OMS) définit la santé comme un état de complet bien-être **physique, mental et social**, et non comme la seule absence de maladie.\n**Le bien-être physique** concerne le corps : le sommeil, l'alimentation, l'activité physique.\n**Le bien-être mental** concerne les émotions, la confiance en soi, l'équilibre psychique.\n**Le bien-être social** concerne les relations avec la famille, les amis, les collègues.\n**Le capital santé** est l'état de santé d'une personne à un moment donné. Il n'est pas fixé une fois pour toutes : certaines habitudes le dégradent, d'autres le préservent."}}, "image_taille": "pleine", "img": "bcp_2nde_A1/images/bcp_2nde_A1_a1_doc1.jpg", "img_desc": "Schéma « La santé selon l'OMS ». Au centre, un cercle portant le mot SANTÉ. Trois cercles y sont reliés : le bien-être physique, illustré p ière phrase.", "explication": "Les habitudes de vie agissent sur le capital santé. Le manque de sommeil le dégrade ; le sport le préserve.", "trous": ["habitudes|habitude", "sommeil", "préservent|preservent|préserve|preserve"]}}}, {"id": "a1_doc2", "type": "document_texte_image", "data": {"label": "DOC. 2", "titre": "Les facteurs qui influencent la santé", "corps": "Les facteurs qui influencent la santé se répartissent en deux grandes catégories.\nLes **facteurs internes** dépendent de la personne elle-même. Certains ne peuvent pas être modifiés : l'âge, le sexe, l'hérédité, c'est-à-dire ce qui est transmis par la famille. D'autres dépendent des habitudes de vie et peuvent être modifiés : le sommeil, l'alimentation, l'activité physique, la consommation de tabac, d'alcool ou d'autres produits.\nLes **facteurs externes** viennent de ce qui entoure la personne. Il s'agit de son environnement de vie et de travail : la qualité de l'air, le bruit, les poussières, le logement, les horaires, les trajets. Il s'agit aussi de ses conditions sociales et économiques, et de la facilité avec laquelle elle peut accéder aux soins.\nUne même personne est exposée aux deux catégories en même temps. Elle peut agir seule sur une partie des facteurs internes. Les facteurs externes, eux, relèvent le plus souvent d'une action collective, conduite par l'employeur, par la commune ou par l'État.", "cadre": true, "image_nom": "Infographie en deux colonnes. À gauche, les facteurs internes, séparés en deux ensembles : ce qui ne se modifie pas, avec l'hérédité, l'âge et le sexe ; ce qui se modifie, avec le sommeil, l'alimentation, l'activité physique et la consommation de tabac, d'alcool ou d'autres produits. À droite, les facteurs externes, répartis en trois ensembles : l'environnement, avec la qualité de l'air, le bruit, la pollution et la nature du logement ; le travail, avec les conditions de travail, les horaires, les déplacements et les risques professionnels ; les conditions sociales, avec le niveau de revenus, l'accès à l'éducation, l'accès aux soins et le soutien social.", "image_w": 2260, "image_h": 1450, "source": "D'après Santé publique France, « Les enjeux de santé » : les déterminants de santé.", "url_source": "https://www.santepubliquefrance.fr/inegalites-sociales-et-territoriales-de-sante/les-enjeux-de-sante", "date_consultation": "2026-09-20", "date_donnees": "2026", "statut_source": "institutionnelle", "image_taille": "pleine", "img": "bcp_2nde_A1/images/bcp_2nde_A1_a1_doc2.jpg", "img_desc": "Infographie en deux colonnes. À gauche, les facteurs internes, séparés en deux ensembles : ce qui ne se modifie pas, avec l'hérédité, l'âge et le sexe ; ce qui se modifie, avec le sommeil, l'alimentation, l'activité physique et la consommation de tabac, d'alcool ou d'autres produits. À droite, les facteurs externes, répartis en trois ensembles : l'environnement, avec la qualité de l'air, le bruit, la pollution et la nature du logement ; le travail, avec les conditions de travail, les horaires, les déplacements et les risques professionnels ; les conditions sociales, avec le niveau de revenus, l'accès à l'éducation, l'accès aux soins et le soutien social.", "img_w": 1400, "img_h": 898}}, {"id": "a1_s1_ch3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir du document 2 :", "reponse_attendue": ""}}, {"id": "a1_s1_q31", "type": "classer", "data": {"competence": "C1", "numero": "3.1", "titre": "", "consigne": "**Classer** les six éléments relevés chez Kevin dans l'une des deux catégories, en complétant le tableau.", "categories": ["Facteur interne", "Facteur externe"], "items": ["Le manque de sommeil", "La consommation de tabac", "L'arrêt du football", "Le bruit de l'atelier", "La poussière de l'atelier", "Son âge"], "classement": [0, 0, 0, 1, 1, 0], "indice": "Se demander pour chaque élément s'il vient de Kevin lui-même ou de ce qui l'entoure.", "variantes": {"adapte": {"consigne": "**Classer** quatre éléments relevés chez Kevin dans l'une des deux catégories.", "items": ["Le manque de sommeil", "La consommation de tabac", "Le bruit de l'atelier", "Son âge"], "classement": [0, 0, 1, 0]}, "essentiel": {"consigne": "**Classer** trois éléments relevés chez Kevin dans l'une des deux catégories.", "items": ["Le manque de sommeil", "La consommation de tabac", "Le bruit de l'atelier"], "classement": [0, 0, 1], "indice": "Se demander pour chaque élément s'il vient de Kevin lui-même ou de l'atelier où il travaille."}}}, "el": {"standard": {"indice": "DOC. 2 : un facteur interne dépend de la personne elle-même ; un facteur externe vient de ce qui l’entoure.", "explication": "Facteurs internes : le manque de sommeil, le tabac, l’arrêt du football (habitudes de vie) et l’âge (non modifiable). Facteurs externes : le bruit et la poussière de l’atelier, qui viennent de l’environnement de travail."}, "adapte": {"indice": "DOC. 2 : l’âge fait partie de ce qui ne se modifie pas ; le bruit vient de l’environnement de travail.", "explication": "Facteurs internes : le manque de sommeil, le tabac, l’âge. Facteur externe : le bruit de l’atelier."}, "essentiel": {"indice": "DOC. 2 : interne = la personne ; externe = ce qui l’entoure.", "explication": "Le sommeil et le tabac dépendent de Kevin : facteurs internes. Le bruit vient de l’atelier : facteur externe."}}}, {"id": "a1_doc3", "type": "document", "data": {"label": "DOC. 3", "titre": "Ce que certains facteurs font au capital santé", "corps": "**Le tabac.** En 2023, en France, le tabagisme a été responsable de plus de 68 000 décès prématurés, soit environ 11 % de l'ensemble des décès. Le cancer est la première cause de ces décès ; viennent ensuite les maladies respiratoires chroniques et les maladies cardiovasculaires.\n**Le manque de sommeil.** Un sommeil trop court, répété plusieurs semaines, diminue la vigilance dans la journée. Il augmente le risque d'accident sur la route et au travail. Il favorise aussi la prise de poids et les troubles de l'humeur.\n**Le bruit et les poussières au travail.** Une exposition répétée au bruit provoque d'abord une fatigue auditive, puis peut entraîner une perte d'audition définitive. L'inhalation répétée de poussières peut provoquer des maladies respiratoires.\n**L'arrêt de l'activité physique.** L'arrêt d'une pratique sportive régulière réduit les capacités cardiaques et musculaires. La sédentarité augmente le risque de surpoids, de diabète de type 2 et de maladies cardiovasculaires.", "cadre": true, "source": "Santé publique France, décès attribuables au tabagisme en 2023, publication du 16 février 2026.", "url_source": "https://www.santepubliquefrance.fr/tabac/rapportsynthese/les-deces-attribuables-au-tabagisme-mise-a-jour-des-estimations-pour-lannee-2023", "date_consultation": "2026-08-30", "date_donnees": "2023", "statut_source": "institutionnelle"}}, {"id": "a1_s1_ch4", "type": "question_chapeau", "data": {"numero": "4", "texte": "À partir du document 3 :", "reponse_attendue": ""}}, {"id": "a1_s1_q41", "type": "sous_question", "data": {"competence": "C1", "numero": "4.1", "texte": "**Relever** deux effets du tabac sur la santé.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Des cancers.\n– Des maladies respiratoires.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1, "variantes": {"adapte": {"texte": "**Relever** un effet du tabac sur la santé.", "lignes": 1, "reponse_attendue": "Le tabac provoque des cancers."}, "essentiel": {"texte": "**Compléter** la phrase : « Le tabac provoque des …… et des maladies …… »", "lignes": 0, "reponse_attendue": "Le tabac provoque des cancers et des maladies respiratoires chroniques."}}}, "el": {"standard": {"indice": "DOC. 3 : le paragraphe sur le tabac, les causes des décès.", "explication": "Le tabac provoque des cancers, des maladies respiratoires chroniques et des maladies cardiovasculaires."}, "adapte": {"indice": "DOC. 3 : le paragraphe sur le tabac, la première cause des d  "physique, mental, social", "physique, mental et social", "physique mentale sociale", "physique, mentale et sociale", "bien-être physique, bien-être mental et bien-être social", "bien-être physique, mental et social", "bien etre physique mental social", "physique social mental", "mental physique social", "social physique mental"], "explication": "DOC. 1 : les trois dimensions de la santé sont le bien-être physique, le bien-être mental et le bien-être social.", "renvoi": "DOC. 1 — La santé selon l’OMS et le capital santé", "renvoi_bloc": "a1_doc1"}, {"accepte": ["vigilance", "accident", "accidents", "attention", "concentration"], "explication": "DOC. 3 : un sommeil trop court, répété, diminue la vigilance et augmente le risque d’accident sur la route et au travail.", "renvoi": "DOC. 3 — Ce que certains facteurs font au capital santé", "renvoi_bloc": "a1_doc3"}]}}, {"id": "a1_s2", "type": "seance", "data": {"numero": "2", "titre": "Les plans santé et la prévention collective", "objectif": "Être capable d'identifier les enjeux d'un plan santé.", "competences": ["C1", "C2", "C3"]}}, {"id": "a1_doc4", "type": "document", "data": {"label": "DOC. 4", "titre": "Qu'est-ce qu'un plan santé ?", "corps": "Un **plan santé** est un programme d'actions décidé par l'État pour répondre à un problème de santé jugé important pour la population. Il fixe des objectifs, des actions et des moyens, pour une durée déterminée, le plus souvent de quatre ou cinq ans.\nUn plan santé répond à une **priorité de santé publique**, c'est-à-dire à un problème identifié comme important parce qu'il touche beaucoup de personnes, parce qu'il est grave, ou parce qu'il pourrait être évité.\nUn plan santé relève de la **prévention collective** : ses actions s'adressent à toute la population ou à un public précis, et non à une personne en particulier. La prévention individuelle, elle, dépend des choix de chacun : dormir suffisamment, ne pas fumer, pratiquer une activité physique.\nIl existe de nombreux plans santé : la stratégie décennale de lutte contre les cancers, le plan chlordécone, le programme national nutrition santé, le plan santé au travail.", "cadre": true, "source": "D'après le ministère du Travail et des Solidarités.", "variantes": {"essentiel": {"corps": "Un **plan santé** est un programme d'actions décidé par l'État pour répondre à un problème de santé important.\n**Sa durée.** Elle est déterminée, le plus souvent quatre ou cinq ans.\n**Son public.** Un plan santé relève de la **prévention collective** : ses actions s'adressent à toute une population, et non à une personne en particulier. La prévention individuelle, elle, dépend des choix de chacun."}}, "url_source": "https://travail-emploi.gouv.fr", "date_consultation": "2026-09-09", "date_donnees": "2026", "statut_source": "institutionnelle"}}, {"id": "a1_s2_ch1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 4 :", "reponse_attendue": ""}}, {"id": "a1_s2_q11", "type": "sous_question", "data": {"competence": "C1", "numero": "1.1", "texte": "**Indiquer** qui décide d'un plan santé.", "points": "", "lignes": 1, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "Un plan santé est décidé par l'État.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1}, "el": {"standard": {"indice": "DOC. 4 : la première phrase.", "explication": "Un plan santé est décidé par l’État."}}}, {"id": "a1_s2_q11b", "type": "sous_question", "data": {"competence": "C1", "numero": "1.2", "texte": "**Indiquer** la durée d'un plan santé.", "points": "", "lignes": 1, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "Un plan santé porte sur une durée déterminée, le plus souvent de quatre ou cinq ans.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1}, "el": {"standard": {"indice": "DOC. 4 : la fin du premier paragraphe.", "explication": "Un plan santé porte sur une durée déterminée, le plus souvent quatre ou cinq ans."}}}, {"id": "a1_s2_q12", "type": "sous_question", "data": {"competence": "C1", "numero": "1.3", "texte": "**Nommer** le type de prévention mis en œuvre par un plan santé.", "points": "", "lignes": 1, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "Il s'agit de la prévention collective.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1, "variantes": {"adapte": {"texte": "**Nommer** le type de prévention mis en œuvre par un plan santé. Deux réponses possibles : prévention collective, prévention individuelle."}, "essentiel": {"texte": "**Nommer** le type de prévention mis en œuvre par un plan santé, en cochant la réponse exacte.\n☐ La prévention collective.\n☐ La prévention individuelle.", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 4 : le mot en gras du troisième paragraphe.", "explication": "Un plan santé relève de la prévention collective : ses actions s’adressent à toute la population ou à un public précis."}, "essentiel": {"indice": "DOC. 4 : le paragraphe « Son public ».", "explication": "La prévention collective. Les actions s’adressent à toute une population."}}}, {"id": "a1_s2_q13", "type": "sous_question", "data": {"competence": "C3", "numero": "1.4", "texte": "**Préciser** ce qui distingue la prévention collective de la prévention individuelle, en rédigeant des phrases complètes.", "points": "", "lignes": 4, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "La prévention collective s'adresse à une population ; la prévention individuelle dépend des choix de chacun.", "indice": "Se demander qui décide de l'action, puis qui elle concerne.", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** l'explication ci-dessous.\n« La prévention collective s'adresse à toute une …………………………… , alors que la prévention individuelle dépend des choix de …………………………… . Un plan santé relève donc de la prévention …………………………… »", "lignes": 0, "reponse_attendue": "La prévention collective s'adresse à toute une population, alors que la prévention individuelle dépend des choix de chacun. Un plan santé relève donc de la prévention collective."}, "essentiel": {"texte": "**Compléter** l'explication ci-dessous avec les mots proposés.\n(Mots à utiliser : population — chacun — collective.)\n« La prévention collective s'adresse à toute une …………………………… , alors que la prévention individuelle dépend des choix de …………………………… . Un plan santé relève donc de la prévention …………………………… »", "lignes": 0, "reponse_attendue": "La prévention collective s'adresse à toute une population, alors que la prévention individuelle dépend des choix de chacun. Un plan santé relève donc de la prévention collective."}}}, "el": {"standard": {"indice": "DOC. 4 : le troisième paragraphe, la prévention collective puis la prévention individuelle.", "explication": "La prévention collective s’adresse à une population ou à un public précis. La prévention individuelle dépend des choix de chacun : dormir suffisamment, ne pas fumer, pratiquer une activité physique."}, "adapte": {"indice": "DOC. 4 : le troisième paragraphe.", "explication": "La prévention collective s’adresse à toute une population ; la prévention individuelle dépend des choix de chacun. Un plan santé relève de la prévention collective.", "trous": ["population|populations", "chacun|chacune", "collective"]}, "essentiel": {"indice": "DOC. 4 : le paragraphe « Son public ».", "explication": "La prévention collective s’adresse à une population. La prévention individuelle dépend des choix de chacun. Un plan santé : prévention collective.", "trous": ["population|populations", "chacun|chacune", "collective"]}}}, {"id": "a1_doc5", "type": "document_texte_image", "data": {"label": "DOC. 5", "titre": "Le Plan santé au travail 2026-2030", "corps": "Le **Plan santé au travail** fixe, tous les cinq ans, les orientations nationales en matière de prévention des risques professionnels. Le plan pour la période 2026-2030 a été présenté le 5 juin 2026 par le ministre du Travail et des Solidarités. Il a été préparé avec les partenaires sociaux, c'est-à-dire les représentants des employeurs et des salariés.\nSon objectif est de renforcer la prévention dans les entreprises et d'agir avant l'accident ou la maladie plutôt que de réparer ensuite : c'est ce que l'on appelle la prévention primaire.\nCe plan retient cinq orientations. La première est la prévention des accidents du travail graves et mortels, en visant particulièrement les publics les plus exposés, c'est-à-dire les jeunes et les intérimaires. La deuxième est la promotion de la santé des femmes au travail. La troisième est la prise en compte des enjeux émergents en santé au travail, notamment le dérèglement climatique et les conduites addictives. La quatrième est la prévention de l'absentéisme. La cinquième est la promotion de la santé mentale et la prévention des risques psychosociaux.\nLe plan national est ensuite décliné dans chaque région par les directions régionales de l'économie, de l'emploi, du travail et des solidarités (DREETS), sous la forme d'un plan régional santé travail.", "cadre": true, "image_nom": "Schéma du Plan santé au travail 2026-2030. En haut, le titre du plan et sa date de présentation, le 5 juin 2026. En dessous, son objectif : renforcer la prévention dans les entreprises et agir avant l'accident ou la maladie. Puis cinq encadrés numérotés présentant ses cinq orientations : prévenir les accidents du travail graves et mortels, en visant les jeunes et les intérimaires ; promouvoir la santé des femmes au travail ; prendre en compte les enjeux émergents en santé au travail, notamment le dérèglement climatique et les conduites addictives ; prévenir l'absentéisme ; promouvoir la santé mentale et prévenir les risques psychosociaux. En bas, une flèche conduit à la déclinaison du plan en région par les DREETS, sous la forme d'un plan régional santé travail.", "image_w": "1800", "image_h": "960", "source": "Ministère du Travail et des Solidarités, Plan santé au travail 2026-2030, présenté le 5 juin 2026 ; Code du travail numérique, « Le Plan Santé au travail 2026-2030 ».", "url_source": "https://code.travail.gouv.fr/fiche-ministere-travail/plans-sante-au-travail-pst", "date_consultation": "2026-09-20", "date_donnees": "2026", "statut_source": "institutionnelle", "variantes": {"adapte": {"corps": "Le **Plan santé au travail** fixe, tous les cinq ans, les orientations nationales en matière de prévention des risques professionnels.\n**Sa durée.** Cinq ans, de 2026 à 2030. Il a été présenté le 5 juin 2026 par le ministre du Travail et des Solidarités.\n**Son objectif.** Renforcer la prévention dans les entreprises et agir avant l'accident ou la maladie.\n**Ses cinq orientations.** Prévenir les accidents du travail graves et mortels, en visant les publics les plus exposés, c'est-à-dire les jeunes et les intérimaires. Promouvoir la santé des femmes au travail. Prendre en compte les enjeux émergents. Prévenir l'absentéisme. Promouvoir la santé mentale.\n**Son application.** Le plan est décliné dans chaque région par les DREETS."}, "essentiel": {"corps": "Le **Plan santé au travail** fixe les orientations nationales en matière de prévention des risques professionnels.\n**Sa durée.** Cinq ans, de 2026 à 2030.\n**Son objectif.** Renforcer la prévention dans les entreprises et agir avant l'accident ou la maladie.\n**Les publics les plus exposés.** Le plan vise particulièrement les jeunes et les intérimaires."}}, "image_taille": "pleine", "img": "bcp_2nde_A1/images/bcp_2nde_A1_a1_doc5.jpg", "img_desc": "Schéma du Plan santé au travail 2026-2030. En haut, le titre du plan et sa date de présentation, le 5 juin 2026. En dessous, son objectif : renforcer la prévention dans les entreprises et agir avant l'accident ou la maladie. Puis cinq encadrés numérotés présentant ses cinq orientations : prévenir les accidents du travail graves et mortels, en visant les jeunes et les intérimaires ; promouvoir la santé des femmes au travail ; prendre en compte les enjeux émergents en santé au travail, notamment le dérèglement climatique et les conduites addictives ; prévenir l'absentéisme ; promouvoir la santé mentale et prévenir les risques psychosociaux. En bas, une flèche conduit à la déclinaison du plan en région par les DREETS, sous la forme d'un plan régional santé travail.", "img_w": 1400, "img_h": 747}}, {"id": "a1_s2_ch2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 5 :", "reponse_attendue": ""}}, {"id": "a1_s2_q21", "type": "sous_question", "data": {"competence": "C1", "numero": "2.1", "texte": "**Relever** les caractéristiques du Plan santé au travail 2026-2030, en complétant le tableau.", "points": "", "lignes": 0, "style_lignes": "", "support_type": "", "reponse_attendue": "", "indice": "", "reponse_allegee": ""}, "el": {"standard": {"indice": "DOC. 5 : le titre et le premier paragraphe, l’objectif, la première orientation, la dernière phrase.", "explication": "Durée : cinq ans, de 2026 à 2030. Objectif : renforcer la prévention dans les entreprises. Publics visés : les jeunes et les intérimaires. Deux orientations : les accidents du travail graves et mortels ; la santé mentale. Application en région : les DREETS, par un plan régional santé travail."}, "adapte": {"indice": "DOC. 5 : la première orientation, puis le paragraphe « Son application ».", "explication": "Publics visés : les jeunes et les intérimaires. Deux orientations : les accidents graves et mortels ; la santé mentale. Application en région : les DREETS."}, "essentiel": {"indice": "DOC. 5 : la liste des orientations, puis la dernière phrase.", "explication": "Deux orientations : les accidents graves et mortels ; la santé mentale. Les DREETS appliquent le plan dans les régions."}}}, {"id": "a1_s2_q21_tab", "type": "tableau", "data": {"titre": "", "table_preset": "pse", "table_border": "fine", "table_row_height": "normal", "table_student_style": "lines", "cells": [[{"type": "prof", "content": "C d": {"indice": "DOC. 2 : les facteurs externes relèvent d’une action collective ; DOC. 5 : l’objectif du plan dans les entreprises.", "explication": "Un plan national agit sur les conditions de travail, que le salarié ne peut pas modifier seul : il demande aux entreprises de renforcer la prévention, par exemple contre le bruit ou les poussières."}, "adapte": {"indice": "DOC. 5 : l’objectif du plan ; situation : l’atelier de Kevin.", "explication": "Le plan demande aux entreprises d’agir en prévention. Un salarié seul ne peut changer ni le bruit de son atelier, ni ses conditions de travail.", "trous": ["entreprises|entreprise|employeurs|employeur", "bruit", "conditions|condition"]}, "essentiel": {"indice": "Les mots proposés, dans l’ordre des blancs.", "explication": "Le plan demande aux entreprises d’agir. Un salarié seul ne change ni le bruit, ni ses conditions de travail.", "trous": ["entreprises|entreprise", "bruit", "conditions|condition"]}}}, {"id": "a1_notions_s2", "type": "notions", "data": {"titre": "Notions à retenir — séance 2", "items": [{"notion": "Plan santé", "definition": "Programme d'actions décidé par l'État pour répondre à un problème de santé important, avec des objectifs, des moyens et une durée déterminée."}, {"notion": "Prévention collective", "definition": "Ensemble d'actions qui s'adressent à toute la population ou à un public précis, et non à une personne en particulier."}, {"notion": "Priorité de santé publique", "definition": "Problème de santé identifié comme important pour la population, parce qu'il touche beaucoup de personnes, parce qu'il est grave ou parce qu'il pourrait être évité."}]}}, {"id": "a1_autoeval_s2", "type": "auto_eval", "data": {"questions": [{"type": "vf", "consigne": "Un plan santé s'adresse à une personne en particulier.", "options": ["Vrai", "Faux"], "correct": "Faux"}, {"type": "qcm", "consigne": "Un plan santé est décidé par :", "options": ["une entreprise", "l'État", "une caisse d'assurance maladie"], "correct": "  "public précis", "public precis", "un public", "tout le monde", "groupe de personnes"], "explication": "DOC. 4 : la prévention collective désigne des actions qui s’adressent à toute une population ou à un public précis, et non à une personne en particulier.", "renvoi": "DOC. 4 — Qu’est-ce qu’un plan santé ?", "renvoi_bloc": "a1_doc4"}, {"accepte": ["renforcer la prévention", "renforcer la prevention", "prévention dans les entreprises", "prevention dans les entreprises", "avant l’accident", "avant l'accident", "avant l accident", "avant la maladie", "prévention primaire", "prevention primaire"], "explication": "DOC. 5 : l’objectif est de renforcer la prévention dans les entreprises et d’agir avant l’accident ou la maladie.", "renvoi": "DOC. 5 — Le Plan santé au travail 2026-2030", "renvoi_bloc": "a1_doc5"}]}}, {"id": "a1_s3", "type": "seance", "data": {"numero": "3", "titre": "Le système de santé solidaire et le parcours de soins", "objectif": "Être capable d'expliquer le principe du parcours de soins.", "competences": ["C1", "C3", "C4", "C5"]}}, {"id": "a1_doc6", "type": "document_texte_image", "data": {"label": "DOC. 6", "titre": "La Sécurité sociale, un système solidaire", "corps": "La **Sécurité sociale** a été créée en 1945. Elle protège les personnes contre les risques de la vie : la maladie, la maternité, les accidents du travail et les maladies professionnelles, la perte d'autonomie, la vieillesse.\nElle est financée par des **cotisations** prélevées sur les salaires, par des contributions versées par les employeurs et par une partie des impôts. Ces sommes sont ensuite redistribuées à ceux qui en ont besoin, sous forme de remboursements de soins, d'indemnités ou de pensions. C'est la **solidarité nationale** : chacun contribue selon ses moyens et reçoit selon ses besoins.\n**Un exemple.** Léa et Thomas travaillent dans la même entreprise. Léa perçoit un salaire brut de 1 900 € par mois, Thomas un salaire brut de 2 400 €. La cotisation prélevée sur le salaire de Thomas est plus élevée que celle prélevée sur le salaire de Léa, parce qu'elle est calculée en pourcentage du salaire brut et non sous forme de somme fixe. Pourtant, si tous deux consultent un médecin pour la même raison, ils sont remboursés de la même manière.\nL'**Assurance maladie** est la branche de la Sécurité sociale qui prend en charge une partie des dépenses de santé et qui mène des actions de prévention. La caisse primaire d'assurance maladie (CPAM) en est l'interlocuteur local.", "cadre": true, "image_nom": "Schéma de circulation en deux temps. À gauche, sous le titre « qui contribue », trois entrées : les salariés, les employeurs, l'État. Une flèche large les conduit vers un cercle central portant la mention « Sécurité sociale ». À droite, sous le titre « qui reçoit », trois sorties : remboursement des soins, indemnités, pensions.", "image_w": 1920, "image_h": 1040, "source": "Sécurité sociale, securite-sociale.fr.", "url_source": "https://www.securite-sociale.fr/la-secu-cest-quoi", "date_consultation": "2026-08-30", "date_donnees": "2026", "statut_source": "institutionnelle", "variantes": {"adapte": {"corps": "La **Sécurité sociale** a été créée en 1945. Elle protège les personnes contre les risques de la vie : la maladie, les accidents du travail, la perte d'autonomie, la vieillesse.\n**Comment elle est financée.** Par des **cotisations** prélevées sur les salaires, par des contributions des employeurs et par une partie des impôts. Ces sommes sont redistribuées à ceux qui en ont besoin. C'est la **solidarité nationale**.\n**Un exemple.** Léa gagne 1 900 € brut par mois, Thomas 2 400 €. La cotisation de Thomas est plus élevée, parce qu'elle est calculée en pourcentage du salaire brut et non sous forme de somme fixe. Pourtant, s'ils consultent un médecin pour la même raison, ils sont remboursés de la même manière.\nL'**Assurance maladie** est la branche qui prend en charge une partie des dépenses de santé."}, "essentiel": {"corps": "La **Sécurité sociale** protège les personnes contre les risques de la vie : la maladie, les accidents du travail, la vieillesse.\n**Comment elle est financée.** Par des **cotisations** prélevées sur les salaires.\n**Un exemple.** Léa gagne 1 900 € brut par mois, Thomas 2 400 €. La cotisation de Thomas est plus élevée, parce qu'elle est calculée en pourcentage du salaire. Pourtant, s'ils consultent un médecin pour la même raison, ils sont remboursés de la même manière.\nL'**Assurance maladie** est la branche qui prend en charge une partie des dépenses de santé."}}, "image_taille": "pleine", "img": "bcp_2nde_A1/images/bcp_2nde_A1_a1_doc6.jpg", "img_desc": "Schéma de circulation en deux temps. À gauche, sous le titre « qui contribue », trois entrées : les salariés, les employeurs, l'État. Une flèche large les conduit vers un cercle central portant la mention « Sécurité sociale ». À droite, sous le titre « qui reçoit », trois sorties : remboursement des soins, indemnités, pensions.", "img_w": 1400, "img_h": 758}}, {"id": "a1_s3_ch1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 6 :", "reponse_attendue": ""}}, {"id": "a1_s3_q12", "type": "sous_question", "data": {"competence": "C3", "numero": "1.1", "texte": "**Expliquer** le principe sur lequel repose le financement de la Sécurité sociale, en rédigeant des phrases complètes.", "points": "", "lignes": 5, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Chacun contribue selon ses moyens et reçoit selon ses besoins : c'est la solidarité nationale.", "indice": "Comparer ce que versent Léa et Thomas, puis ce qu'ils reçoivent.", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** l'explication ci-dessous.\n« La cotisation est calculée en …………………………… du salaire : Thomas verse plus que Léa. Pourtant, ils sont remboursés de la même manière. Chacun contribue selon ses …………………………… et reçoit selon ses …………………………… »", "lignes": 0, "reponse_attendue": "La cotisation est calculée en pourcentage du salaire : Thomas verse plus que Léa. Pourtant, ils sont remboursés de la même manière. Chacun contribue selon ses moyens et reçoit selon ses besoins."}, "essentiel": {"texte": "**Compléter** l'explication ci-dessous avec les mots proposés.\n(Mots à utiliser : pourcentage — moyens — besoins.)\n« La cotisation est calculée en …………………………… du salaire : Thomas verse plus que Léa. Pourtant, ils sont remboursés de la même manière. Chacun contribue selon ses …………………………… et reçoit selon ses …………………………… »", "lignes": 0, "reponse_attendue": "La cotisation est calculée en pourcentage du salaire : Thomas verse plus que Léa. Pourtant, ils sont remboursés de la même manière. Chacun contribue selon ses moyens et reçoit selon ses besoins."}}}, "el": {"standard": {"indice": "DOC. 6 : l’exemple des deux salariés, ce que chacun verse et ce que chacun reçoit.", "explication": "La cotisation est calculée en pourcentage du salaire : le salaire le plus élevé verse plus. Les deux salariés sont remboursés de la même manière. Chacun contribue selon ses moyens et reçoit selon ses besoins : c’est la solidarité nationale."}, "adapte": {"indice": "DOC. 6 : l’exemple, la façon dont la cotisation est calculée.", "explication": "La cotisation est calculée en pourcentage du salaire. Chacun contribue selon ses moyens et reçoit selon ses besoins : c’est la solidarité nationale.", "trous": ["pourcentage|%|pourcent", "moyens|moyen", "besoins|besoin"]}, "essentiel": {"indice": "DOC. 6 : l’exemple ; les mots proposés.", "explication": "La cotisation se calcule en pourcentage du salaire. Chacun donne selon ses moyens et reçoit selon ses besoins.", "trous": ["pourcentage|%|pourcent", "moyens|moyen", "besoins|besoin"]}}}, {"id": "a1_doc7", "type": "document_texte_image", "data": {"label": "DOC. 7", "titre": "Le parcours de soins coordonnés", "corps": "Le **parcours de soins coordonnés** consiste à confier à un **médecin traitant** le suivi de sa santé. À partir de 16 ans, chaque assuré choisit un médecin traitant et le déclare à l'Assurance maladie, en ligne ou par courrier. Il le consulte en priorité ; celui-ci l'oriente ensuite, si besoin, vers un médecin spécialiste.\nLe respect de ce parcours change le remboursement. Pour une consultation chez un médecin généraliste conventionné de secteur 1, au tarif de 30 €, l'Assurance maladie rembourse 70 % du tarif, moins une participation forfaitaire de 2 €, soit 19 €. Une personne qui n'a pas déclaré de médecin traitant est remboursée 8,40 € pour la même consultation.\nLe parcours reste respecté dans plusieurs situations : en cas d'urgence, lorsque l'assuré est éloigné de son domicile, lorsque le médecin traitant est remplacé, ou lorsque l'assuré consulte directement certains spécialistes en accès direct, comme un gynécologue, un ophtalmologue, un stomatologue, ou un psychiatre entre 16 et 25 ans. Les soins dentaires ne sont pas concernés par le parcours de soins.", "cadre": true, "image_nom": "Schéma du parcours de soins coordonnés en trois étapes. Étape 1, l'assuré, qui consulte en priorité son médecin traitant. Étape 2, le médecin traitant, qui assure le suivi de la santé et oriente si besoin vers un médecin spécialiste. Étape 3, le médecin spécialiste, consulté sur orientation du médecin traitant. En bas à gauche, un encadré « accès direct » indique que certains spécialistes se consultent sans passer par le médecin traitant : gynécologue, ophtalmologue, stomatologue et psychiatre entre 16 et 25 ans. En bas à droite, un encadré liste les situations où le parcours reste respecté : urgence, éloignement du domicile, médecin traitant remplacé ; un second encadré précise que les soins dentaires ne sont pas concernés par le parcours de soins.", "image_w": 2252, "image_h": 1500, "source": "Assurance maladie, ameli.fr.", "url_source": "https://www.ameli.fr/assure/remboursements/etre-bien-rembourse/medecin-traitant-parcours-soins-coordonnes", "date_consultation": "2026-08-30", "date_donnees": "2026", "statut_source": "institutionnelle", "variantes": {"adapte": {"corps": "Le **parcours de soins coordonnés** consiste à confier à un **médecin traitant** le suivi de sa santé.\n**Comment y entrer.** À partir de 16 ans, l'assuré choisit un médecin traitant, le déclare à l'Assurance maladie, puis le consulte en priorité. Ce médecin l'oriente ensuite, si besoin, vers un spécialiste.\n**Ce que cela change.** Une consultation chez un généraliste de secteur 1 coûte 30 €. L'Assurance maladie en rembourse 19 €. Une personne qui n'a pas déclaré de médecin traitant n'est remboursée que 8,40 €.\n**Les situations où le parcours reste respecté.** En cas d'urgence. Loin de son domicile. Lorsque le médecin traitant est remplacé. Lorsque l'assuré consulte directement un gynécologue, un ophtalmologue, un stomatologue, ou un psychiatre entre 16 et 25 ans."}, "essentiel": {"corps": "Le **parcours de soins coordonnés** consiste à confier à un **médecin traitant** le suivi de sa santé.\n**Comment y entrer.** L'assuré choisit un médecin traitant, le déclare à l'Assurance maladie, puis le consulte en priorité.\n**Ce que cela change.** Une consultation coûte 30 €. L'Assurance maladie en rembourse 19 €. Sans médecin traitant déclaré, elle n'en rembourse que 8,40 €.\n**Deux situations où le parcours reste respecté.** En cas d'urgence. Lorsque l'assuré consulte directement un gynécologue ou un ophtalmologue."}}, "image_taille": "pleine", "img": "bcp_2nde_A1/images/bcp_2nde_A1_a1_doc7.jpg", "img_desc": "Schéma du parcours de soins coordonnés en trois étapes. Étape 1, l'assuré, qui consulte en priorité son médecin traitant. Étape 2, le médecin traitant, qui assure le suivi de la santé et oriente si besoin vers un médecin spécialiste. Étape 3, le médecin spécialiste, consulté sur orientation du médecin traitant. En bas à gauche, un encadré « accès direct » indique que certains spécialistes se consultent sans passer par le médecin traitant : gynécologue, ophtalmologue, stomatologue et psychiatre entre 16 et 25 ans. En bas à droite, un encadré liste les situations où le parcours reste respecté : urgence, éloignement du domicile, médecin traitant remplacé ; un second encadré précise que les soins dentaires ne sont pas concernés par le parcours de soins.", "img_w": 1400, "img_h": 933}}, {"id": "a1_s3_ch2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 7 :", "reponse_attendue": ""}}, {"id": "a1_s3_q23", "type": "sous_question", "data": {"competence": "C1", "numero": "2.1", "texte": "**Indiquer** si le parcours de soins est respecté dans chaque situation, en complétant le tableau.", "points": "", "lignes": 0, "style_lignes": "", "support_type": "", "reponse_attendue": "", "indice": "Le document « Le parcours de soins coordonnés » donne la liste des situations dans lesquelles le parcours reste respecté.", "reponse_allegee": "", "variantes": {"essentiel": {"texte": "**Indiquer** si le parcours de soins est respecté dans chaque situation, en complétant le tableau.\n(Deux réponses possibles : oui, non.)"}}}, "el": {"standard": {"indice": "DOC. 7 : le dernier paragraphe, les situations où le parcours reste respecté.", "explication": "Gynécologue consultée directement : oui, spécialiste en accès direct. Entorse en vacances : oui, urgence et éloignement du domicile. Consultation sans médecin traitant déclaré : non, le parcours de soins n’est pas respecté."}, "adapte": {"indice": "DOC. 7 : le paragraphe « Les situations où le parcours reste respecté ».", "explication": "Entorse en vacances : oui, urgence et éloignement. Pas de médecin traitant déclaré : non."}, "essentiel": {"indice": "DOC. 7 : comment entrer dans le parcours de soins.", "explication": "Non : sans médecin traitant déclaré, le parcours de soins n’est pas respecté."}}}, {"id": "a1_s3_q23_tab", "type": "tableau", "data": {"titre": "", "table_preset": "pse", "table_border": "fine", "table_row_height": "normal", "table_student_style": "lines", "cells": [[{"type": "prof", "cont ", "type": "document", "data": {"label": "DOC. 8", "titre": "Ce que coûte réellement un soin", "corps": "Les soins ont un coût. La plus grande partie de ce coût n'est pas payée par le patient : elle est prise en charge par l'Assurance maladie, c'est-à-dire par l'ensemble des assurés.\n**Une consultation.** Une consultation chez un médecin généraliste conventionné de secteur 1 coûte 30 €. Dans le parcours de soins coordonnés, l'Assurance maladie en rembourse 19 €. Il reste 11 € à la charge du patient, dont 2 € de participation forfaitaire.\n**Une hospitalisation.** Karl, collègue de Kevin, a été opéré de l'appendicite. Il est resté hospitalisé trois journées, jour de sortie compris. Un séjour de ce type se compte en milliers d'euros. En France, la Sécurité sociale finance 92,8 % des dépenses de soins hospitaliers ; ce qui reste à la charge des patients en représente 2,2 %.\nPour une hospitalisation au cours de laquelle est réalisé un acte dont le tarif atteint ou dépasse 120 €, le patient ne paie pas un pourcentage des frais : il règle une participation forfaitaire de 32 €, une seule fois pour l'ensemble du séjour. Ce montant s'applique depuis le 1er avril 2026.\nÀ cette participation s'ajoute le **forfait journalier hospitalier**, qui correspond aux frais d'hébergement et de repas. Il s'élève à 23 € par jour depuis le 1er mars 2026 et il n'est pas remboursé par l'Assurance maladie. Une complémentaire santé, lorsque le patient en possède une, peut le prendre en charge.\n**Sur une année entière.** Une fois tous les remboursements effectués, ce qui reste directement à la charge des ménages s'élève en moyenne à 292 € par habitant et par an.", "cadre": true, "source": "DREES, comptes de la santé 2024. Arrêté du 27 février 2026 et décret du 30 mars 2026.", "url_source": "https://www.drees.solidarites-sante.gouv.fr/publications-communique-de-presse-infographie-documents-de-reference/250930-Panorama-d%C3%A9penses-de-sant%C3%A9", "date_consultation": "2026-08-30", "date_donnees": "2024 et 2026", "statut_source": "institutionnelle", "variantes": {"adapte": {"corps": "Les soins ont un coût. La plus grande partie n'est pas payée par le patient : elle est prise en charge par l'Assurance maladie, c'est-à-dire par l'ensemble des assurés.\n**Une consultation.** Elle coûte 30 €. L'Assurance maladie en rembourse 19 €. Il reste 11 € à la charge du patient.\n**Une hospitalisation.** Karl, collègue de Kevin, a été opéré de l'appendicite et il est resté trois jours à l'hôpital. Un séjour de ce type se compte en milliers d'euros. En France, la Sécurité sociale finance 92,8 % des dépenses de soins hospitaliers.\n**Ce que Karl doit payer.** Une **participation forfaitaire de 32 €**, réglée une seule fois pour le séjour. Et le **forfait journalier hospitalier**, de **23 € par jour**, qui n'est pas remboursé par l'Assurance maladie."}, "essentiel": {"corps": "Les soins ont un coût. La plus grande partie est payée par l'Assurance maladie, c'est-à-dire par l'ensemble des assurés.\n**Une hospitalisation.** Karl a été opéré de l'appendicite. Il est resté **trois jours** à l'hôpital. Le séjour coûte plusieurs milliers d'euros.\n**Ce que Karl doit payer.** Une **participation forfaitaire de 32 €**, une seule fois. Et le **forfait journalier hospitalier**, de **23 € par jour**, qui n'est pas remboursé."}}}}, {"id": "a1_s3_ch3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir du document 8 :", "reponse_attendue": ""}}, {"id": "a1_s3_q31", "type": "sous_question", "data": {"competence": "C1", "numero": "3.1", "texte": "**Calculer** la somme restée à la charge de Karl pour son séjour à l'hôpital, en euros. La calculatrice est autorisée.", "points": "", "lignes": 3, "style_lignes": "tiret_guide", "support_type": "calcul", "reponse_attendue": "3 × 23 = 69 ; 69 + 32 = 101 €.", "indice": "Deux sommes restent à la charge du patient : l'une se compte par jour, l'autre une seule fois.", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Calculer** la somme restée à la charge de Karl, en euros.\n(Étape 1 : le forfait journalier. Étape 2 : ajouter la participation forfaitaire. Calculatrice autorisée.)"}, "essentiel": {"texte": "**Calculer** la somme restée à la charge de Karl, en euros.\n(Étape 1 : 23 € × 3 journées. Étape 2 : ajouter 32 €. Calculatrice autorisée.)", "indice": "Poser les deux calculs l'un après l'autre."}}}, "el": {"standard": {"indice": "DOC. 8 : le forfait journalier hospitalier (par jour) et la participation forfaitaire (une seule fois) ; le nombre de journées.", "explication": "Forfait journalier : 3 × 23 = 69 €. Participation forfaitaire : 32 €. Total : 69 + 32 = 101 €."}, "adapte": {"indice": "DOC. 8 : ce que le patient doit payer et la durée du séjour.", "explication": "Étape 1 : 3 × 23 = 69 €. Étape 2 : 69 + 32 = 101 €."}, "essentiel": {"indice": "Poser les deux calculs l’un après l’autre.", "explication": "23 × 3 = 69 €, puis 69 + 32 = 101 €."}}}, {"id": "a1_s3_q32", "type": "sous_question", "data": {"competence": "C3", "numero": "3.2", "texte": "**Expliquer** en quoi la prise en charge du séjour de Karl montre le fonctionnement de la solidarité nationale, en rédigeant des phrases complètes.", "points": "", "lignes": 5, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Le séjour coûte plusieurs milliers d'euros, Karl n'a payé que 101 € : les autres assurés ont payé le reste.", "indice": "Comparer d'abord les deux sommes, puis se demander qui a payé la différence.", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** l'explication : « Le séjour de Karl coûte plusieurs milliers d'……, alors qu'il n'a payé que …… €. La différence a été payée par l'ensemble des …… »", "lignes": 0, "reponse_attendue": "Le séjour de Karl coûte plusieurs milliers d'euros, alors qu'il n'a payé que 101 €. La différence a été payée par l'ensemble des assurés."}, "essentiel": {"texte": "**Compléter** l'explication : « Le séjour de Karl coûte plusieurs milliers d'……, alors qu'il n'a payé que …… €. La différence a été payée par l'ensemble des …… »\nMots à utiliser : euros, 101, assurés.", "lignes": 0, "reponse_attendue": "Le séjour de Karl coûte plusieurs milliers d'euros, alors qu'il n'a payé que 101 €. La différence a été payée par l'ensemble des assurés."}}}, "el": {"standard": {"indice": "DOC. 8 : le coût d’un séjour de ce type, la part payée par le patient, puis qui prend en charge le reste.", "explication": "Le séjour coûte plusieurs milliers d’euros ; le patient n’a payé que 101 €. Le reste est pris en charge par l’Assurance maladie, c’est-à-dire par l’ensemble des assurés : c’est la solidarité nationale."}, "adapte": {"indice": "DOC. 8 : la première phrase et le résultat du calcul 3.1.", "explication": "Plusieurs milliers d’euros pour le séjour, 101 € payés par le patient : la différence est payée par l’ensemble des assurés.", "trous": ["euros|euro|€", "101", "assurés|assures|assuré|assure"]}, "essentiel": {"indice": "Les mots proposés ; le résultat du calcul 3.1.", "explication": "Le séjour coûte des milliers d’euros. Le patient paie 101 €. Les assurés paient le reste.", "trous": ["euros|euro|€", "101", "assurés|assures|assuré|assure"]}}}, {"id": "a1_doc9", "type": "document", "data": {"label": "DOC. 9", "titre": "La carte Vitale et Mon espace santé", "corps": "**La carte Vitale** est la carte de l'assuré social. Elle est personnelle, gratuite et valable partout en France. Elle contient les renseignements administratifs nécessaires au remboursement des soins : elle ne contient pas le dossier médical et ce n'est pas un moyen de paiement. Elle permet d'être remboursé plus rapidement et, chez le médecin ou le pharmacien, de bénéficier du tiers payant, c'est-à-dire de ne pas avancer une partie des frais. Elle existe aussi sous la forme d'une application sur téléphone.\n**Mon espace santé** est un service numérique sécurisé ouvert à chaque assuré. On y retrouve le **dossier médical partagé** : les comptes rendus d'hospitalisation, les résultats d'analyses, les vaccinations, les traitements. L'assuré décide des professionnels de santé autorisés à le consulter. Le service comprend également une messagerie sécurisée et un agenda de santé.\nLe dossier médical partagé évite de refaire des examens déjà réalisés et limite le risque d'interaction entre médicaments. Il permet aussi à un médecin qui ne connaît pas le patient de disposer des informations utiles, y compris en urgence.", "cadre": true, "source": "Assurance maladie, ameli.fr ; monespacesante.fr.", "url_source": "https://www.monespacesante.fr/a-propos", "date_consultation": "2026-08-30", "date_donnees": "2026", "statut_source": "institutionnelle"}}, {"id": "a1_s3_ch4", "type": "question_chapeau", "data": {"numero": "4", "texte": "À partir du document 9 :", "reponse_attendue": ""}}, {"id": "a1_s3_q41", "type": "sous_question", "data": {"competence": "C1", "numero": "4.1", "texte": "**Identifier** ce qui distingue la carte Vitale de Mon espace santé, en complétant le tableau.", "points": "", "lignes": 0, "style_lignes": "", "support_type": "", "reponse_attendue": "", "indice": "L'une contient des renseignements administratifs, l'autre des documents de santé.", "reponse_allegee": ""}, "el": {"standard": {"indice": "DOC. 9 : le premier paragraphe pour la carte Vitale, le deuxième pour Mon espace santé.", "explication": "La carte Vitale contient des renseignements administratifs ; elle permet le remboursement et le tiers payant. Mon espace santé contient des documents et des données de santé ; il permet de les partager avec les professionnels autorisés."}, "adapte": {"indice": "DOC. 9 : ce que permet la carte Vitale, puis qui peut consulter le dossier médical partagé.", "explication": "Carte Vitale : le remboursement et le tiers payant. Mon espace santé : le partage avec les professionnels de santé autorisés par l’assuré."}, "essentiel": {"indice": "DOC. 9 : la phrase sur les professionnels de santé.", "explication": "Mon espace santé
