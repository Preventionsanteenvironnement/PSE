aves et mortels.","renvoi":"DOC. 5 — Le Plan santé au travail 2026-2030","renvoi_bloc":"a1_doc5","accepte":[]},{"explication":"La prévention collective s'adresse à une population. Une action qui dépend des choix d'une seule personne relève de la prévention individuelle.","renvoi":"DOC. 4 — Qu'est-ce qu'un plan santé ?","renvoi_bloc":"a1_doc4","accepte":[]},{"explication":"L'objectif principal du plan est de renforcer la prévention dans les entreprises. Les salaires et la durée du travail ne sont pas cités dans le DOC. 5.","renvoi":"DOC. 5 — Le Plan santé au travail 2026-2030","renvoi_bloc":"a1_doc5","accepte":[]}]}},{"id":"a1_saut_s2","type":"saut_page","data":{}},{"id":"a1_s3","type":"seance","data":{"numero":"3","titre":"Le système de santé solidaire et le parcours de soins","objectif":"Être capable d'expliquer le principe du parcours de soins.","competences":["C1","C3","C4","C5"]}},{"id":"a1_doc6","type":"document_texte_image","data":{"label":"DOC. 6","titre":"La Sécurité sociale, un système solidaire","corps":"La **Sécurité sociale** a été créée en 1945. Elle protège les personnes contre les risques de la vie : la maladie, la maternité, les accidents du travail et les maladies professionnelles, la perte d'autonomie, la vieillesse.\nElle est financée par des **cotisations** prélevées sur les salaires, par des contributions versées par les employeurs et par une partie des impôts. Ces sommes sont ensuite redistribuées à ceux qui en ont besoin, sous forme de remboursements de soins, d'indemnités ou de pensions. C'est la **solidarité nationale** : chacun contribue selon ses moyens et reçoit selon ses besoins.\n**Un exemple.** Léa et Thomas travaillent dans la même entreprise. Léa perçoit un salaire brut de 1 900 € par mois, Thomas un salaire brut de 2 400 €. La cotisation prélevée sur le salaire de Thomas est plus élevée que celle prélevée sur le salaire de Léa, parce qu'elle est calculée en pourcentage du salaire brut et non sous forme de somme fixe. Pourtant, si tous deux consultent un médecin pour la même raison, ils sont remboursés de la même manière.\nL'**Assurance maladie** est la branche de la Sécurité sociale qui prend en charge une partie des dépenses de santé et qui mène des actions de prévention. La caisse primaire d'assurance maladie (CPAM) en est l'interlocuteur local.","source":"Sécurité sociale, securite-sociale.fr.","variantes":{"adapte":{"corps":"La **Sécurité sociale** a été créée en 1945. Elle protège les personnes contre les risques de la vie : la maladie, les accidents du travail, la perte d'autonomie, la vieillesse.\n**Comment elle est financée.** Par des **cotisations** prélevées sur les salaires, par des contributions des employeurs et par une partie des impôts. Ces sommes sont redistribuées à ceux qui en ont besoin. C'est la **solidarité nationale**.\n**Un exemple.** Léa gagne 1 900 € brut par mois, Thomas 2 400 €. La cotisation de Thomas est plus élevée, parce qu'elle est calculée en pourcentage du salaire brut et non sous forme de somme fixe. Pourtant, s'ils consultent un médecin pour la même raison, ils sont remboursés de la même manière.\nL'**Assurance maladie** est la branche qui prend en charge une partie des dépenses de santé."},"essentiel":{"corps":"La **Sécurité sociale** protège les personnes contre les risques de la vie : la maladie, les accidents du travail, la vieillesse.\n**Comment elle est financée.** Par des **cotisations** prélevées sur les salaires.\n**Un exemple.** Léa gagne 1 900 € brut par mois, Thomas 2 400 €. La cotisation de Thomas est plus élevée, parce qu'elle est calculée en pourcentage du salaire. Pourtant, s'ils consultent un médecin pour la même raison, ils sont remboursés de la même manière.\nL'**Assurance maladie** est la branche qui prend en charge une partie des dépenses de santé."}},"img":"bcp_2nde_A1/images/systeme-sante_schema-securite-sociale-solidaire.png","img_desc":"Schéma de circulation en deux temps. À gauche, sous le titre « qui contribue », trois entrées : les salariés, les employeurs, l'État. Une flèche large les conduit vers un cercle central portant la mention « Sécurité sociale ». À droite, sous le titre « qui reçoit », trois sorties : remboursement des soins, indemnités, pensions.","img_w":1920,"img_h":1040}},{"id":"a1_s3_ch1","type":"question_chapeau","data":{"numero":"1","texte":"À partir du document 6 :","reponse_attendue":""}},{"id":"a1_s3_q12","type":"sous_question","data":{"competence":"C3","numero":"1.1","texte":"**Expliquer** le principe sur lequel repose le financement de la Sécurité sociale, en rédigeant des phrases complètes.","lignes":5,"style_lignes":"tiret_guide","support_type":"","reponse_attendue":"Chacun contribue selon ses moyens et reçoit selon ses besoins : c'est la solidarité nationale.","indice":"Comparer ce que versent Léa et Thomas, puis ce qu'ils reçoivent.","variantes":{"adapte":{"texte":"**Compléter** l'explication ci-dessous.\n« La cotisation est calculée en …………………………… du salaire : Thomas verse plus que Léa. Pourtant, ils sont remboursés de la même manière. Chacun contribue selon ses …………………………… et reçoit selon ses …………………………… »","lignes":0,"reponse_attendue":"La cotisation est calculée en pourcentage du salaire : Thomas verse plus que Léa. Pourtant, ils sont remboursés de la même manière. Chacun contribue selon ses moyens et reçoit selon ses besoins."},"essentiel":{"texte":"**Compléter** l'explication ci-dessous avec les mots proposés.\n(Mots à utiliser : pourcentage — moyens — besoins.)\n« La cotisation est calculée en …………………………… du salaire : Thomas verse plus que Léa. Pourtant, ils sont remboursés de la même manière. Chacun contribue selon ses …………………………… et reçoit selon ses …………………………… »","lignes":0,"reponse_attendue":"La cotisation est calculée en pourcentage du salaire : Thomas verse plus que Léa. Pourtant, ils sont remboursés de la même manière. Chacun contribue selon ses moyens et reçoit selon ses besoins."}}},"el":{"standard":{"indice":"DOC. 6 : comparer ce que versent Léa et Thomas, puis ce qu'ils reçoivent.","explication":"La cotisation est un pourcentage du salaire brut : Thomas, qui gagne 2 400 €, verse plus que Léa, qui gagne 1 900 €. Pourtant, tous deux sont remboursés de la même manière. Chacun contribue selon ses moyens et reçoit selon ses besoins : c'est la solidarité nationale."},"adapte":{"indice":"DOC. 6 : l'exemple de Léa et Thomas, puis la phrase qui définit la solidarité nationale.","explication":"La cotisation est un pourcentage du salaire brut : Thomas, qui gagne 2 400 €, verse plus que Léa, qui gagne 1 900 €. Pourtant, tous deux sont remboursés de la même manière. Chacun contribue selon ses moyens et reçoit selon ses besoins : c'est la solidarité nationale.","trous":["pourcentage","moyens","besoins|besoin"]},"essentiel":{"indice":"DOC. 6, « Un exemple » : le mode de calcul de la cotisation ; notions de la séance 3 : la définition de la solidarité nationale.","explication":"La cotisation est un pourcentage du salaire brut : Thomas, qui gagne 2 400 €, verse plus que Léa, qui gagne 1 900 €. Pourtant, tous deux sont remboursés de la même manière. Chacun contribue selon ses moyens et reçoit selon ses besoins : c'est la solidarité nationale.","trous":["pourcentage","moyens","besoins|besoin"]}}},{"id":"a1_doc7","type":"document_texte_image","data":{"label":"DOC. 7","titre":"Le parcours de soins coordonnés","corps":"Le **parcours de soins coordonnés** consiste à confier à un **médecin traitant** le suivi de sa santé. À partir de 16 ans, chaque assuré choisit un médecin traitant et le déclare à l'Assurance maladie, en ligne ou par courrier. Il le consulte en priorité ; celui-ci l'oriente ensuite, si besoin, vers un médecin spécialiste.\nLe respect de ce parcours change le remboursement. Pour une consultation chez un médecin généraliste conventionné de secteur 1, au tarif de 30 €, l'Assurance maladie rembourse 70 % du tarif, moins une participation forfaitaire de 2 €, soit 19 €. Une personne qui n'a pas déclaré de médecin traitant est remboursée 8,40 € pour la même consultation.\nLe parcours reste respecté dans plusieurs situations : en cas d'urgence, lorsque l'assuré est éloigné de son domicile, lorsque le médecin traitant est remplacé, ou lorsque l'assuré consulte directement certains spécialistes en accès direct, comme un gynécologue, un ophtalmologue, un stomatologue, ou un psychiatre entre 16 et 25 ans. Les soins dentaires ne sont pas concernés par le parcours de soins.","source":"Assurance maladie, ameli.fr, mise à jour du 23 avril 2026.","variantes":{"adapte":{"corps":"Le **parcours de soins coordonnés** consiste à confier à un **médecin traitant** le suivi de sa santé.\n**Comment y entrer.** À partir de 16 ans, l'assuré choisit un médecin traitant, le déclare à l'Assurance maladie, puis le consulte en priorité. Ce médecin l'oriente ensuite, si besoin, vers un spécialiste.\n**Ce que cela change.** Une consultation chez un généraliste de secteur 1 coûte 30 €. L'Assurance maladie en rembourse 19 €. Une personne qui n'a pas déclaré de médecin traitant n'est remboursée que 8,40 €.\n**Les situations où le parcours reste respecté.** En cas d'urgence. Loin de son domicile. Lorsque le médecin traitant est remplacé. Lorsque l'assuré consulte directement un gynécologue, un ophtalmologue, un stomatologue, ou un psychiatre entre 16 et 25 ans."},"essentiel":{"corps":"Le **parcours de soins coordonnés** consiste à confier à un **médecin traitant** le suivi de sa santé.\n**Comment y entrer.** L'assuré choisit un médecin traitant, le déclare à l'Assurance maladie, puis le consulte en priorité.\n**Ce que cela change.** Une consultation coûte 30 €. L'Assurance maladie en rembourse 19 €. Sans médecin traitant déclaré, elle n'en rembourse que 8,40 €.\n**Deux situations où le parcours reste respecté.** En cas d'urgence. Lorsque l'assuré consulte directement un gynécologue ou un ophtalmologue."}},"img":"bcp_2nde_A1/images/systeme-sante_schema-parcours-soins-coordonnes.jpg","img_desc":"Schéma du parcours de soins coordonnés en trois étapes. Étape 1, l'assuré, qui consulte en priorité son médecin traitant. Étape 2, le médecin traitant, qui assure le suivi de la santé et oriente si besoin vers un médecin spécialiste. Étape 3, le médecin spécialiste, consulté sur orientation du médecin traitant. En bas à gauche, un encadré « accès direct » indique que certains spécialistes se consultent sans passer par le médecin traitant : gynécologue, ophtalmologue, stomatologue et psychiatre entre 16 et 25 ans. En bas à droite, un encadré liste les situations où le parcours reste respecté : urgence, éloignement du domicile, médecin traitant remplacé ; un second encadré précise que les soins dentaires ne sont pas concernés par le parcours de soins.","img_w":2252,"img_h":1500}},{"id":"a1_s3_ch2","type":"question_chapeau","data":{"numero":"2","texte":"À partir du document 7 :","reponse_attendue":""}},{"id":"a1_s3_q23","type":"sous_question","data":{"competence":"C1","numero":"2.1","texte":"**Indiquer** si le parcours de soins est respecté dans chaque situation, en complétant le tableau.","lignes":0,"style_lignes":"","support_type":"","reponse_attendue":"Rosa consulte directement une gynécologue pour le suivi de sa grossesse. : Oui : spécialiste en accès direct. • En vacances, Lucie se tord la cheville et consulte un médecin sur place. : Oui : urgence et éloignement. • Sofiane consulte un généraliste alors qu'il n'a pas déclaré de médecin traitant. : Non : pas de médecin traitant.","indice":"Le document « Le parcours de soins coordonnés » donne la liste des situations dans lesquelles le parcours reste respecté.","variantes":{"essentiel":{"texte":"**Indiquer** si le parcours de soins est respecté dans chaque situation, en complétant le tableau.\n(Deux réponses possibles : oui, non.)"}}},"el":{"standard":{"indice":"DOC. 7, dernier paragraphe : la liste des situations dans lesquelles le parcours reste respecté.","explication":"Rosa consulte une gynécologue, spécialiste en accès direct : parcours respecté. Lucie est blessée pendant ses vacances : urgence et éloignement du domicile, parcours respecté. Sofiane n'a pas déclaré de médecin traitant : parcours non respecté."},"adapte":{"indice":"DOC. 7, paragraphe « Les situations où le parcours reste respecté ».","explication":"Lucie est blessée pendant ses vacances : urgence et éloignement du domicile, parcours respecté. Sofiane n'a pas déclaré de médecin traitant : parcours non respecté."},"essentiel":{"indice":"DOC. 7, paragraphe « Comment y entrer » : ce que l'assuré doit déclarer.","explication":"Le parcours de soins suppose d'avoir choisi et déclaré un médecin traitant. Sofiane n'en a pas déclaré : le parcours n'est pas respecté."}}},{"id":"a1_s3_q23_tab","type":"tableau","data":{"titre":"","table_student_style":"lines","cells":[[{"type":"prof","content":"Situation"},{"type":"prof","content":"Parcours respecté ?"}],[{"type":"prof","content":"Rosa consulte directement une gynécologue pour le suivi de sa grossesse."},{"type":"eleve","content":"","reponse":"Oui : spécialiste en accès direct."}],[{"type":"prof","content":"En vacances, Lucie se tord la cheville et consulte un médecin sur place."},{"type":"eleve","content":"","reponse":"Oui : urgence et éloignement."}],[{"type":"prof","content":"Sofiane consulte un généraliste alors qu'il n'a pas déclaré de médecin traitant."},{"type":"eleve","content":"","reponse":"Non : pas de médecin traitant."}]],"variantes":{"adapte":{"cells":[[{"type":"prof","content":"Situation"},{"type":"prof","content":"Parcours respecté ?"}],[{"type":"prof","content":"Rosa consulte directement une gynécologue pour le suivi de sa grossesse."},{"type":"prof","content":"Oui : spécialiste en accès direct."}],[{"type":"prof","content":"En vacances, Lucie se tord la cheville et consulte un médecin sur place."},{"type":"eleve","content":"","reponse":"Oui : urgence et éloignement."}],[{"type":"prof","content":"Sofiane consulte un généraliste alors qu'il n'a pas déclaré de médecin traitant."},{"type":"eleve","content":"","reponse":"Non : pas de médecin traitant."}]]},"essentiel":{"cells":[[{"type":"prof","content":"Situation"},{"type":"prof","content":"Parcours respecté ?"}],[{"type":"prof","content":"Rosa consulte directement une gynécologue pour le suivi de sa grossesse."},{"type":"prof","content":"Oui : spécialiste en accès direct."}],[{"type":"prof","content":"En vacances, Lucie se tord la cheville et consulte un médecin sur place."},{"type":"prof","content":"Oui : urgence et éloignement."}],[{"type":"prof","content":"Sofiane consulte un généraliste alors qu'il n'a pas déclaré de médecin traitant."},{"type":"eleve","content":"","reponse":"Non : pas de médecin traitant."}]]}}}},{"id":"a1_doc8","type":"document","data":{"label":"DOC. 8","titre":"Ce que coûte réellement un soin","corps":"Les soins ont un coût. La plus grande partie de ce coût n'est pas payée par le patient : elle est prise en charge par l'Assurance maladie, c'est-à-dire par l'ensemble des assurés.\n**Une consultation.** Une consultation chez un médecin généraliste conventionné de secteur 1 coûte 30 €. Dans le parcours de soins coordonnés, l'Assurance maladie en rembourse 19 €. Il reste 11 € à la charge du patient, dont 2 € de participation forfaitaire.\n**Une hospitalisation.** Mehdi, collègue de Sofiane, a été opéré de l'appendicite. Il est resté hospitalisé trois journées, jour de sortie compris. Un séjour de ce type se compte en milliers d'euros. En France, la Sécurité sociale finance 92,8 % des dépenses de soins hospitaliers ; ce qui reste à la charge des patients en représente 2,2 %.\nPour une hospitalisation au cours de laquelle est réalisé un acte dont le tarif atteint ou dépasse 120 €, le patient ne paie pas un pourcentage des frais : il règle une participation forfaitaire de 32 €, une seule fois pour l'ensemble du séjour. Ce montant s'applique depuis le 1er avril 2026.\nÀ cette participation s'ajoute le **forfait journalier hospitalier**, qui correspond aux frais d'hébergement et de repas. Il s'élève à 23 € par jour depuis le 1er mars 2026 et il n'est pas remboursé par l'Assurance maladie. Une complémentaire santé, lorsque le patient en possède une, peut le prendre en charge.\n**Sur une année entière.** Une fois tous les remboursements effectués, ce qui reste directement à la charge des ménages s'élève en moyenne à 292 € par habitant et par an.","source":"DREES, comptes de la santé 2024. Arrêté du 27 février 2026 et décret du 30 mars 2026.","variantes":{"adapte":{"corps":"Les soins ont un coût. La plus grande partie n'est pas payée par le patient : elle est prise en charge par l'Assurance maladie, c'est-à-dire par l'ensemble des assurés.\n**Une consultation.** Elle coûte 30 €. L'Assurance maladie en rembourse 19 €. Il reste 11 € à la charge du patient.\n**Une hospitalisation.** Mehdi, collègue de Sofiane, a été opéré de l'appendicite et il est resté trois jours à l'hôpital. Un séjour de ce type se compte en milliers d'euros. En France, la Sécurité sociale finance 92,8 % des dépenses de soins hospitaliers.\n**Ce que Mehdi doit payer.** Une **participation forfaitaire de 32 €**, réglée une seule fois pour le séjour. Et le **forfait journalier hospitalier**, de **23 € par jour**, qui n'est pas remboursé par l'Assurance maladie."},"essentiel":{"corps":"Les soins ont un coût. La plus grande partie est payée par l'Assurance maladie, c'est-à-dire par l'ensemble des assurés.\n**Une hospitalisation.** Mehdi a été opéré de l'appendicite. Il est resté **trois jours** à l'hôpital. Le séjour coûte plusieurs milliers d'euros.\n**Ce que Mehdi doit payer.** Une **participation forfaitaire de 32 €**, une seule fois. Et le **forfait journalier hospitalier**, de **23 € par jour**, qui n'est pas remboursé."}}}},{"id":"a1_s3_ch3","type":"question_chapeau","data":{"numero":"3","texte":"À partir du document 8 :","reponse_attendue":""}},{"id":"a1_s3_q31","type":"sous_question","data":{"competence":"C1","numero":"3.1","texte":"**Calculer** la somme restée à la charge de Mehdi pour son séjour à l'hôpital, en euros. La calculatrice est autorisée.","lignes":3,"style_lignes":"tiret_guide","support_type":"calcul","reponse_attendue":"3 × 23 = 69 ; 69 + 32 = 101 €.","indice":"Deux sommes restent à la charge du patient : l'une se compte par jour, l'autre une seule fois.","variantes":{"adapte":{"texte":"**Calculer** la somme restée à la charge de Mehdi, en euros.\n(Étape 1 : le forfait journalier. Étape 2 : ajouter la participation forfaitaire. Calculatrice autorisée.)"},"essentiel":{"texte":"**Calculer** la somme restée à la charge de Mehdi, en euros.\n(Étape 1 : 23 € × 3 journées. Étape 2 : ajouter 32 €. Calculatrice autorisée.)","indice":"Poser les deux calculs l'un après l'autre."}}},"el":{"standard":{"indice":"DOC. 8 : deux sommes restent à la charge du patient, l'une se compte par jour, l'autre une seule fois.","explication":"Deux sommes restent à la charge de Mehdi (DOC. 8). Forfait journalier pour trois jours : 23 × 3 = 69 €. Participation forfaitaire, payée une seule fois : 32 €. Total : 69 + 32 = **101 €**."},"adapte":{"indice":"DOC. 8 : le forfait journalier est donné pour une journée ; Mehdi est resté trois jours.","explication":"Deux sommes restent à la charge de Mehdi (DOC. 8). Forfait journalier pour trois jours : 23 × 3 = 69 €. Participation forfaitaire, payée une seule fois : 32 €. Total : 69 + 32 = **101 €**."},"essentiel":{"indice":"Poser les deux calculs l'un après l'autre.","explication":"Deux sommes restent à la charge de Mehdi (DOC. 8). Forfait journalier pour trois jours : 23 × 3 = 69 €. Participation forfaitaire, payée une seule fois : 32 €. Total : 69 + 32 = **101 €**."}}},{"id":"a1_s3_q32","type":"sous_question","data":{"competence":"C3","numero":"3.2","texte":"**Expliquer** en quoi la prise en charge du séjour de Mehdi montre le fonctionnement de la solidarité nationale, en rédigeant des phrases complètes.","lignes":5,"style_lignes":"tiret_guide","support_type":"","reponse_attendue":"Le séjour coûte plusieurs milliers d'euros, Mehdi n'a payé que 101 € : les autres assurés ont payé le reste.","indice":"Comparer d'abord les deux sommes, puis se demander qui a payé la différence.","variantes":{"adapte":{"texte":"**Compléter** l'explication : « Le séjour de Mehdi coûte plusieurs milliers d'……, alors qu'il n'a payé que …… €. La différence a été payée par l'ensemble des …… »","lignes":0,"reponse_attendue":"Le séjour de Mehdi coûte plusieurs milliers d'euros, alors qu'il n'a payé que 101 €. La différence a été payée par l'ensemble des assurés."},"essentiel":{"texte":"**Compléter** l'explication : « Le séjour de Mehdi coûte plusieurs milliers d'……, alors qu'il n'a payé que …… €. La différence a été payée par l'ensemble des …… »\nMots à utiliser : euros, 101, assurés.","lignes":0,"reponse_attendue":"Le séjour de Mehdi coûte plusieurs milliers d'euros, alors qu'il n'a payé que 101 €. La différence a été payée par l'ensemble des assurés."}}},"el":{"standard":{"indice":"Comparer d'abord le coût du séjour et la somme payée par Mehdi, puis chercher qui a payé la différence.","explication":"Un séjour de ce type coûte plusieurs milliers d'euros, alors que Mehdi n'a payé que 101 €. La différence est prise en charge par l'Assurance maladie, donc par l'ensemble des assurés : c'est la solidarité nationale. Le DOC. 8 le confirme : la Sécurité sociale finance 92,8 % des dépenses de soins hospitaliers."},"adapte":{"indice":"Question 3.1 : le résultat du calcul ; DOC. 8, première phrase : qui prend en charge la plus grande partie du coût.","explication":"Le séjour coûte plusieurs milliers d'euros ; Mehdi n'a payé que 101 € (question 3.1). Le DOC. 8 indique que le reste est pris en charge par l'Assurance maladie, c'est-à-dire par l'ensemble des assurés : c'est la solidarité nationale.","trous":["euros","101","assurés|assures"]},"essentiel":{"indice":"Question 3.1 : le résultat du calcul ; DOC. 8, première phrase : qui paie la plus grande partie du coût.","explication":"Le séjour coûte plusieurs milliers d'euros ; Mehdi n'a payé que 101 € (question 3.1). Le DOC. 8 indique que le reste est pris en charge par l'Assurance maladie, c'est-à-dire par l'ensemble des assurés : c'est la solidarité nationale.","trous":["euros","101","assurés|assures"]}}},{"id":"a1_doc9","type":"document","data":{"label":"DOC. 9","titre":"La carte Vitale et Mon espace santé","corps":"**La carte Vitale** est la carte de l'assuré social. Elle est personnelle, gratuite et valable partout en France. Elle contient les renseignements administratifs nécessaires au remboursement des soins : elle ne contient pas le dossier médical et ce n'est pas un moyen de paiement. Elle permet d'être remboursé plus rapidement et, chez le médecin ou le pharmacien, de bénéficier du tiers payant, c'est-à-dire de ne pas avancer une partie des frais. Elle existe aussi sous la forme d'une application sur téléphone.\n**Mon espace santé** est un service numérique sécurisé ouvert à chaque assuré. On y retrouve le **dossier médical partagé** : les comptes rendus d'hospitalisation, les résultats d'analyses, les vaccinations, les traitements. L'assuré décide des professionnels de santé autorisés à le consulter. Le service comprend également une messagerie sécurisée et un agenda de santé.\nLe dossier médical partagé évite de refaire des examens déjà réalisés et limite le risque d'interaction entre médicaments. Il permet aussi à un médecin qui ne connaît pas le patient de disposer des informations utiles, y compris en urgence.","source":"Assurance maladie, ameli.fr ; monespacesante.fr."}},{"id":"a1_s3_ch4","type":"question_chapeau","data":{"numero":"4","texte":"À partir du document 9 :","reponse_attendue":""}},{"id":"a1_s3_q41","type":"sous_question","data":{"competence":"C1","numero":"4.1","texte":"**Identifier** ce qui distingue la carte Vitale de Mon espace santé, en complétant le tableau.","lignes":0,"style_lignes":"","support_type":"","reponse_attendue":"Ce qu'elle ou il contient : Des renseignements administratifs. / Des documents et des données de santé. • Ce qu'elle ou il permet : Le remboursement et le tiers payant. / Le partage avec les professionnels autorisés.","indice":"L'une contient des renseignements administratifs, l'autre des documents de santé."},"el":{"standard":{"indice":"DOC. 9 : le premier paragraphe décrit la carte Vitale, le deuxième Mon espace santé.","explication":"La carte Vitale contient des renseignements administratifs et permet le remboursement et le tiers payant ; elle ne contient pas le dossier médical. Mon espace santé contient les documents et données de santé et permet de les partager avec les professionnels autorisés par l'assuré."},"adapte":{"indice":"DOC. 9 : ce que la carte Vitale permet chez le médecin ou le pharmacien ; qui peut consulter le dossier de Mon espace santé.","explication":"La carte Vitale permet d'être remboursé plus rapidement et de bénéficier du tiers payant. Mon espace santé permet de partager les données de santé avec les professionnels que l'assuré autorise."},"essentiel":{"indice":"DOC. 9, deuxième paragraphe : qui peut consulter le dossier médical partagé.","explication":"Mon espace santé réunit le dossier médical partagé. L'assuré décide des professionnels de santé autorisés à le consulter : le service permet donc le partage des données de santé."}}},{"id":"a1_s3_q41_tab","type":"tableau","data":{"titre":"","table_student_style":"lines","cells":[[{"type":"prof","content":"Ce que l'on cherche"},{"type":"prof","content":"La carte Vitale"},{"type":"prof","content":"Mon espace santé"}],[{"type":"prof","content":"Ce qu'elle ou il contient"},{"type":"eleve","content":"","reponse":"Des renseignements administratifs."},{"type":"eleve","content":"","reponse":"Des documents et des données de santé."}],[{"type":"prof","content":"Ce qu'elle ou il permet"},{"type":"eleve","content":"","reponse":"Le remboursement et le tiers payant."},{"type":"eleve","content":"","reponse":"Le partage avec les professionnels autorisés."}]],"variantes":{"adapte":{"cells":[[{"type":"prof","content":"Ce que l'on cherche"},{"type":"prof","content":"La carte Vitale"},{"type":"prof","content":"Mon espace santé"}],[{"type":"prof","content":"Ce qu'elle ou il contient"},{"type":"prof","content":"Des renseignements administratifs."},{"type":"prof","content":"Des documents et des données de santé."}],[{"type":"prof","content":"Ce qu'elle ou il permet"},{"type":"eleve","content":"","reponse":"Le remboursement et le tiers payant."},{"type":"eleve","content":"","reponse":"Le partage avec les professionnels autorisés."}]]},"essentiel":{"cells":[[{"type":"prof","content":"Ce que l'on cherche"},{"type":"prof","content":"La carte Vitale"},{"type":"prof","content":"Mon espace santé"}],[{"type":"prof","content":"Ce qu'elle ou il contient"},{"type":"prof","content":"Des renseignements administratifs."},{"type":"prof","content":"Des documents et des données de santé."}],[{"type":"prof","content":"Ce qu'elle ou il permet"},{"type":"prof","content":"Le remboursement et le tiers payant."},{"type":"eleve","content":"","reponse":"Le partage avec les professionnels autorisés."}]]}}}},{"id":"a1_encadre_s3","type":"encadre","data":{"variante":"attention","titre":"Deux outils à ne pas confondre","texte":"La carte Vitale est un document administratif : elle sert au remboursement et ne contient pas le dossier médical. Mon espace santé est un service numérique : il contient les données de santé et l'assuré décide qui peut les consulter."}},{"id":"a1_s3_ch5","type":"question_chapeau","data":{"numero":"5","texte":"En revenant à la situation de Sofiane :","reponse_attendue":""}},{"id":"a1_s3_q5","type":"sous_question","data":{"competence":"C4","numero":"5.1","texte":"**Proposer** trois actions que Sofiane peut mettre en œuvre pour préserver son capital santé.","lignes":3,"style_lignes":"tirets_comptage","support_type":"","reponse_attendue":"Sofiane peut dormir davantage, reprendre une activité physique et arrêter de fumer.","indice":"Reprendre les facteurs relevés en séance 1 et se demander, pour chacun, ce que Sofiane peut changer lui-même.","lignes_par_reponse":2,"variantes":{"adapte":{"texte":"**Proposer** deux actions utiles à Sofiane, en choisissant dans la liste.\n(Liste : dormir davantage — reprendre le sport — changer de métier — acheter un nouveau téléphone — déménager.)","lignes":2,"reponse_attendue":"Sofiane peut dormir davantage et reprendre une activité physique."},"essentiel":{"texte":"**Proposer** deux actions utiles à Sofiane, en cochant deux propositions.\n☐ Dormir davantage.\n☐ Reprendre le sport.\n☐ Changer de métier.\n☐ Acheter un nouveau téléphone.","lignes":0,"reponse_attendue":"Dormir davantage ; reprendre le sport."}}},"el":{"standard":{"indice":"Reprendre les facteurs relevés en séance 1 et chercher, pour chacun, ce que Sofiane peut changer lui-même.","explication":"Chaque action répond à un facteur relevé dans la situation : dormir davantage (six heures par nuit), reprendre une activité physique (arrêt du football), arrêter de fumer (tabac pendant les pauses). Préparer ses repas, déclarer un médecin traitant, ouvrir Mon espace santé ou demander une protection contre le bruit conviennent aussi."},"adapte":{"indice":"Situation : repérer ce qui abîme la santé de Sofiane, puis garder les actions qui y répondent.","explication":"Dormir davantage répond aux nuits d'environ six heures ; reprendre le sport répond à l'arrêt du football. Changer de métier ou acheter un nouveau téléphone n'agissent sur aucun facteur relevé dans la situation."},"essentiel":{"indice":"Situation : garder les propositions qui répondent à une habitude relevée chez Sofiane.","explication":"Dormir davantage répond aux nuits d'environ six heures ; reprendre le sport répond à l'arrêt du football. Changer de métier et acheter un nouveau téléphone n'agissent sur aucune habitude relevée.","choix_corrects":[0,1]}}},{"id":"a1_s3_q6","type":"sous_question","data":{"competence":"C5","numero":"5.2","texte":"**Justifier** le choix de l'action la plus utile parmi les trois proposées, en rédigeant des phrases complètes.","lignes":6,"style_lignes":"tiret_guide","support_type":"","reponse_attendue":"L'action la plus utile est de dormir davantage, car un sommeil trop court augmente le risque d'accident à l'atelier.","indice":"Un argument solide s'appuie sur une donnée : un effet sur la santé, un chiffre, ou un risque propre au métier de Sofiane.","variantes":{"adapte":{"texte":"**Justifier** le choix de l'action la plus utile parmi les deux proposées.\n(Début imposé : « L'action la plus utile est… parce que… ». Mots à utiliser : fatigue — accident — atelier.)","lignes":3,"indice":"Un argument solide s'appuie sur une donnée de la situation : le nombre d'heures de sommeil, le bruit, ou le remboursement des soins."},"essentiel":{"texte":"**Justifier** le choix de l'action la plus utile, en complétant la phrase.\n« L'action la plus utile est …………………………… , parce que Sofiane dort seulement …………………………… heures par nuit et qu'un manque de sommeil augmente le risque d'…………………………… à l'atelier. »","lignes":0,"reponse_attendue":"L'action la plus utile est de dormir davantage, parce que Sofiane dort seulement six heures par nuit et qu'un manque de sommeil augmente le risque d'accident à l'atelier."}}},"el":{"standard":{"indice":"Un argument solide s'appuie sur une donnée : un effet sur la santé, un chiffre, ou un risque propre au métier de Sofiane.","explication":"Un choix justifié s'appuie sur une donnée du cours. Exemple pour le sommeil : Sofiane dort six heures et se lève à 5 h 30 ; le DOC. 3 indique qu'un sommeil trop court augmente le risque d'accident au travail ; le Plan santé au travail désigne les jeunes comme les plus exposés aux accidents graves. Une autre action est recevable si elle est argumentée de la même façon."},"adapte":{"indice":"Un argument solide s'appuie sur une donnée de la situation : le nombre d'heures de sommeil, le bruit, ou le remboursement des soins.","explication":"Exemple : « L'action la plus utile est de dormir davantage, parce que la fatigue due à des nuits de six heures augmente le risque d'accident à l'atelier. » Le DOC. 3 relie le manque de sommeil à la baisse de vigilance et au risque d'accident au travail.","trous":["dormir davantage|de dormir davantage|dormir plus|de dormir plus|reprendre le sport|de reprendre le sport|reprendre une activité physique|de reprendre une activité physique|reprendre une activite physique","fatigue|accident|accidents|atelier|sommeil|vigilance"]},"essentiel":{"indice":"Situation : le nombre d'heures de sommeil ; DOC. 3 : le risque qui augmente avec un sommeil trop court.","explication":"Sofiane dort environ six heures par nuit. Le DOC. 3 indique qu'un sommeil trop court diminue la vigilance et augmente le risque d'accident au travail : dormir davantage réduit ce risque.","trous":["dormir davantage|de dormir davantage|dormir plus|de dormir plus|mieux dormir|de mieux dormir","six|6","accident|accidents"]}}},{"id":"a1_notions_s3","type":"notions","data":{"titre":"Notions à retenir — séance 3","items":[{"notion":"Sécurité sociale","definition":"Système qui protège les personnes contre les risques de la vie : maladie, maternité, accidents du travail et maladies professionnelles, perte d'autonomie, vieillesse."},{"notion":"Solidarité nationale","definition":"Principe de financement du système : chacun contribue selon ses moyens et reçoit selon ses besoins."},{"notion":"Assurance maladie","definition":"Branche de la Sécurité sociale qui prend en charge une partie des dépenses de santé et qui mène des actions de prévention."},{"notion":"Médecin traitant","definition":"Médecin choisi par l'assuré à partir de 16 ans et déclaré à l'Assurance maladie. Il assure le suivi et oriente vers les spécialistes."},{"notion":"Parcours de soins coordonnés","definition":"Organisation des soins autour du médecin traitant, consulté en priorité. Son respect donne droit à un meilleur remboursement."},{"notion":"Carte Vitale","definition":"Carte personnelle et gratuite de l'assuré social. Elle porte les renseignements administratifs nécessaires au remboursement et n'est pas un moyen de paiement."},{"notion":"Dossier médical partagé","definition":"Ensemble des documents et des données de santé de l'assuré, réunis dans Mon espace santé et consultables par les professionnels qu'il autorise."},{"notion":"Reste à charge","definition":"Partie du coût des soins qui n'est pas remboursée par l'Assurance maladie et que le patient paie, éventuellement avec l'aide d'une complémentaire santé."}]}},{"id":"a1_autoeval_s3","type":"auto_eval","data":{"questions":[{"type":"vf","consigne":"La carte Vitale est un moyen de paiement.","options":["Vrai","Faux"],"correct":"Faux"},{"type":"qcm","consigne":"Dans le parcours de soins coordonnés, une consultation à 30 € chez le médecin traitant est remboursée :","options":["8,40 €","19 €","30 €"],"correct":"19 €"},{"type":"qcm_m","consigne":"Indiquer ce que l'on retrouve dans Mon espace santé (plusieurs réponses exactes) :","options":["les résultats d'analyses","les comptes rendus d'hospitalisation","le code de la carte bancaire","les vaccinations"],"correct":"les résultats d'analyses, les comptes rendus d'hospitalisation, les vaccinations"},{"type":"redige","consigne":"Indiquer ce qui reste à la charge du patient pour chaque journée d'hospitalisation.","correct":"Le forfait journalier hospitalier, de 23 € par jour, reste à la charge du patient."},{"type":"redige","consigne":"Expliquer l'intérêt de déclarer un médecin traitant.","correct":"Le médecin traitant assure le suivi et donne droit à un meilleur remboursement : 19 € au lieu de 8,40 €."}],"remed_rouge":"0 à 2 réponses exactes sur 5 : reprendre le document « Le parcours de soins coordonnés », puis refaire le calcul du reste à charge du document « Ce que coûte réellement un soin ».","remed_orange":"3 ou 4 réponses exactes sur 5 : revoir la différence entre la carte Vitale et Mon espace santé dans le docu
