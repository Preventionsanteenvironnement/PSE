<script>window.COURS = {"slug":"bcp_2nde_A1","classe":"Seconde Bac Pro","retour":"index.html#2de-a1","pied":"Module A1 — Seconde Bac Pro. Prévention, santé, environnement — M. MECHERI. Situation construite pour le cours ; sources indiquées sous chaque document.","version":"4.1","entete":{"module_code":"A1","titre":"Le système de santé","niveau":"Seconde Bac Pro","annee":"2026-27","thematique":"A — L'individu responsable de son capital santé","objectif_general":"Être capable de préserver son capital santé dans un système solidaire."},"blocks":[{"id":"a1_s1","type":"seance","data":{"numero":"1","titre":"Le capital santé et les facteurs d'influence","objectif":"Être capable de repérer les facteurs influençant la santé.","competences":["C1","C2","C3"]}},{"id":"a1_situation","type":"situation","data":{"texte":"**Sofiane, 18 ans, commence son alternance**\nSofiane est en bac professionnel maintenance industrielle. Depuis trois semaines, il a commencé son alternance en entreprise. Il se lève à 5 h 30 pour prendre le bus et rentre chez lui vers 19 h. Il dort environ six heures par nuit et joue en ligne une partie de la soirée. Le midi, il mange un sandwich devant son casier ; le soir, il grignote souvent.\nIl a arrêté le football qu'il pratiquait deux fois par semaine et il voit beaucoup moins ses amis et il fume depuis quelques mois avec des collègues, surtout pendant les pauses. L'atelier est bruyant et poussiéreux.\nDepuis la rentrée, Sofiane se sent fatigué et il a mal au dos. Il possède une carte Vitale, mais il n'a pas déclaré de médecin traitant et n'a jamais ouvert Mon espace santé. Il se demande comment tenir le rythme sans abîmer sa santé.","source":""}},{"id":"a1_analyse_s1","type":"analyse","data":{"titre":"ANALYSER LA SITUATION"}},{"id":"a1_s1_ch1","type":"question_chapeau","data":{"numero":"1","texte":"À partir de la situation :","reponse_attendue":""}},{"id":"a1_s1_q11","type":"sous_question","data":{"competence":"C2","numero":"1.1","texte":"**Formuler** le problème de santé que pose la situation, en rédigeant des phrases complètes.","lignes":2,"style_lignes":"tiret_guide","support_type":"","reponse_attendue":"Comment Sofiane peut-il préserver sa santé depuis qu'il a commencé son alternance ?","indice":"Le problème se formule en une phrase, et non par une liste de ce que fait Sofiane.","variantes":{"adapte":{"texte":"**Identifier** le problème posé par la situation, en cochant la proposition exacte.\n☐ Sofiane doit apprendre un nouveau métier.\n☐ Sofiane doit préserver sa santé depuis le début de son alternance.\n☐ Sofiane doit trouver un logement plus proche de son entreprise.","lignes":0,"reponse_attendue":"Sofiane doit préserver sa santé depuis le début de son alternance."},"essentiel":{"texte":"**Identifier** le problème posé par la situation, en cochant la proposition exacte.\n☐ Sofiane doit apprendre un nouveau métier.\n☐ Sofiane doit préserver sa santé depuis le début de son alternance.\n☐ Sofiane doit trouver un logement plus proche de son entreprise.","lignes":0,"reponse_attendue":"Sofiane doit préserver sa santé depuis le début de son alternance."}}},"el":{"standard":{"indice":"Situation : repérer ce qui a changé dans la vie de Sofiane, puis ce que ce changement menace.","explication":"Le problème relie deux éléments de la situation : le début de l'alternance et une santé qui se dégrade (fatigue, mal au dos). Formulation possible : « Comment Sofiane peut-il préserver sa santé depuis qu'il a commencé son alternance ? ». Une description de sa journée ne formule pas un problème."},"adapte":{"indice":"Situation : relire la dernière phrase, qui donne la question que se pose Sofiane.","explication":"La situation se termine sur la question que se pose Sofiane : tenir le rythme sans abîmer sa santé. Seule la deuxième proposition porte sur la santé ; le métier et le logement ne sont pas le problème posé.","choix_corrects":[1]},"essentiel":{"indice":"Situation : relire la dernière phrase, qui donne la question que se pose Sofiane.","explication":"La situation se termine sur la question que se pose Sofiane : tenir le rythme sans abîmer sa santé. Seule la deuxième proposition porte sur la santé ; le métier et le logement ne sont pas le problème posé.","choix_corrects":[1]}}},{"id":"a1_s1_q12","type":"sous_question","data":{"competence":"C1","numero":"1.2","texte":"**Relever** les éléments de la vie de Sofiane qui agissent sur sa santé, en complétant le tableau.","lignes":0,"style_lignes":"","support_type":"","reponse_attendue":"Le sommeil : Il dort environ six heures par nuit. • L'alimentation : Un sandwich le midi, des grignotages le soir. • L'activité physique : Il a arrêté le football. • Le lieu de travail : Un atelier bruyant et poussiéreux. • Le suivi médical : Aucun médecin traitant déclaré.","indice":""},"el":{"standard":{"indice":"Situation : pour chaque domaine du tableau, chercher la phrase qui parle des nuits, des repas, du sport, de l'atelier et du médecin.","explication":"Chaque domaine correspond à une phrase de la situation : environ six heures de sommeil par nuit ; un sandwich le midi et des grignotages le soir ; l'arrêt du football ; un atelier bruyant et poussiéreux ; aucun médecin traitant déclaré."},"adapte":{"indice":"Situation : le deuxième paragraphe parle du sport et de l'atelier, le troisième du médecin.","explication":"Activité physique : Sofiane a arrêté le football. Lieu de travail : l'atelier est bruyant et poussiéreux. Suivi médical : Sofiane n'a pas déclaré de médecin traitant."},"essentiel":{"indice":"Situation : l'atelier est décrit à la fin du deuxième paragraphe, le médecin dans le troisième.","explication":"Lieu de travail : la situation décrit un atelier bruyant et poussiéreux. Suivi médical : Sofiane n'a pas déclaré de médecin traitant."}}},{"id":"a1_s1_q12_tab","type":"tableau","data":{"titre":"","table_student_style":"lines","cells":[[{"type":"prof","content":"Domaine"},{"type":"prof","content":"Élément relevé dans la situation"}],[{"type":"pr in traitant déclaré."}]]}}}},{"id":"a1_doc1","type":"document_texte_image","data":{"label":"DOC. 1","titre":"La santé selon l'OMS et le capital santé","corps":"L'Organisation mondiale de la santé (OMS) définit la santé comme un état de complet bien-être physique, mental et social, et non comme la seule absence de maladie. Une personne peut donc n'avoir aucune maladie et ne pas être en bonne santé, par exemple si elle est isolée ou si elle vit sous tension permanente.\nLe **bien-être physique** concerne le corps : le sommeil, l'alimentation, l'activité physique, l'absence de douleur.\nLe **bien-être mental** concerne les émotions, la confiance en soi et l'équilibre psychique.\nLe **bien-être social** concerne les relations avec les autres : la famille, les amis, les collègues, la place tenue dans un groupe.\nLe **capital santé** est l'état de santé dont une personne dispose à un moment donné. Il n'est pas fixé une fois pour toutes : certaines habitudes le dégradent, d'autres le préservent.","source":"Organisation mondiale de la santé, Constitution, préambule.","variantes":{"essentiel":{"corps":"L'Organisation mondiale de la santé (OMS) définit la santé comme un état de complet bien-être **physique, mental et social**, et non comme la seule absence de maladie.\n**Le bien-être physique** concerne le corps : le sommeil, l'alimentation, l'activité physique.\n**Le bien-être mental** concerne les émotions, la confiance en soi, l'équilibre psychique.\n**Le bien-être social** concerne les relations avec la famille, les amis, les collègues.\n**Le capital santé** est l'état de santé d'une personne à un moment donné. Il n'est pas fixé une fois pour toutes : certaines habitudes le dégradent, d'autres le préservent."}},"img":"bcp_2nde_A1/images/systeme-sante_sante-oms-capital-sante.jpg","img_desc":"Schéma « La santé selon l'OMS ». Au centre, un cercle portant le mot SANTÉ. Trois cercles y sont reliés : le bien-être physique, illustré par une personne qui court ; le bien-être mental, illustré par une tête et un cerveau ; le bien-être social, illustré par un groupe de trois personnes. En haut, une phrase rappelle que la santé est un état de complet bien-être physique, mental et social.","img_w":2144,"img_h":1366}},{"id":"a1_s1_ch2","type":"question_chapeau","data":{"numero":"2","texte":"À partir du document 1 :","reponse_attendue":""}},{"id":"a1_s1_q21","type":"sous_question","data":{"competence":"C1","numero":"2.1","texte":"**Associer** chaque phrase à la dimension du bien-être concernée, en complétant le tableau.","lignes":0,"style_lignes":"","support_type":"","reponse_attendue":"Sofiane se sent fatigué et il a mal au dos. : Le bien-être physique • Sofiane a arrêté le football et voit moins ses amis. : Le bien-être social • Sofiane s'inquiète de ne pas tenir le rythme. : Le bien-être mental","indice":"","variantes":{"adapte":{"texte":"**Associer** chaque phrase à la dimension du bien-être concernée, en complétant le tableau.\n(Dimensions possibles : physique, mental, social.)"},"essentiel":{"texte":"**Associer** chaque phrase à la dimension du bien-être concernée, en complétant le tableau.\n(Dimensions possibles : physique, mental, social.)"}}},"el":{"standard":{"indice":"DOC. 1 : se demander si chaque phrase touche le corps, les émotions ou les relations avec les autres.","explication":"Fatigue et mal au dos touchent le corps : bien-être physique. Voir moins ses amis touche les relations avec les autres : bien-être social. S'inquiéter touche les émotions : bien-être mental."},"adapte":{"indice":"DOC. 1 : repérer quelle dimension concerne les relations avec les autres et laquelle concerne les émotions.","explication":"Voir moins ses amis touche les relations avec les autres : bien-être social. S'inquiéter de ne pas tenir le rythme touche les émotions : bien-être mental."},"essentiel":{"indice":"DOC. 1 : se demander si l'inquiétude touche le corps, les émotions ou les relations.","explication":"L'inquiétude est une émotion. Le DOC. 1 rattache les émotions et la confiance en soi au bien-être mental."}}},{"id":"a1_s1_q21_tab","type":"tableau","data":{"titre":"","table_student_style":"lines","cells":[[{"type":"prof","content":"Ce que vit Sofiane"},{"type":"prof","content":"Dimension du bien-être concernée"}],[{"type":"prof","content":"Sofiane se sent fatigué et il a mal au dos."},{"type":"eleve","content":"","reponse":"Le bien-être physique"}],[{"type":"prof","content":"Sofiane a arrêté le football et voit moins ses amis."},{"type":"eleve","content":"","reponse":"Le bien-être social"}],[{"type":"prof","content":"Sofiane s'inquiète de ne pas tenir le rythme."},{"type":"eleve","content":"","reponse":"Le bien-être mental"}]],"variantes":{"adapte":{"cells":[[{"type":"prof","content":"Ce que vit Sofiane"},{"type":"prof","content":"Dimension du bien-être concernée"}],[{"type":"prof","content":"Sofiane se sent fatigué et il a mal au dos."},{"type":"prof","content":"Le bien-être physique"}],[{"type":"prof","content":"Sofiane a arrêté le football et voit moins ses amis."},{"type":"eleve","content":"","reponse":"Le bien-être social"}],[{"type":"prof","content":"Sofiane s'inquiète de ne pas tenir le rythme."},{"type":"eleve","content":"","reponse":"Le bien-être mental"}]]},"essentiel":{"cells":[[{"type":"prof","content":"Ce que vit Sofiane"},{"type":"prof","content":"Dimension du bien-être concernée"}],[{"type":"prof","content":"Sofiane se sent fatigué et il a mal au dos."},{"type":"prof","content":"Le bien-être physique"}],[{"type":"prof","content":"Sofiane a arrêté le football et voit moins ses amis."},{"type":"prof","content":"Le bien-être social"}],[{"type":"prof","content":"Sofiane s'inquiète de ne pas tenir le rythme."},{"type":"eleve","content":"","reponse":"Le bien-être mental"}]]}}}},{"id":"a1_s1_q22","type":"sous_question","data":{"competence":"C3","numero":"2.2","texte":"**Expliquer** pourquoi le capital santé d'une personne peut évoluer au cours de sa vie, en rédigeant des phrases complètes.","lignes":4,"style_lignes":"tiret_guide","support_type":"","reponse_attendue":"Le capital santé évolue : certaines habitudes le dégradent, d'autres le préservent.","indice":"Penser à ce qui a changé pour Sofiane depuis le début de son alternance.","variantes":{"adapte":{"texte":"**Compléter** l'explication ci-dessous.\n« Le capital santé évolue au cours de la vie parce que les …………………………… de vie agissent sur lui. Le manque de …………………………… et le tabac le dégradent ; le sport et un suivi médical régulier le …………………………… »","lignes":0,"reponse_attendue":"Le capital santé évolue au cours de la vie parce que les habitudes de vie agissent sur lui. Le manque de sommeil et le tabac le dégradent ; le sport et un suivi médical régulier le préservent."},"essentiel":{"texte":"**Compléter** l'explication ci-dessous avec les mots proposés.\n(Mots à utiliser : habitudes — sommeil — préservent.)\n« Le capital santé évolue au cours de la vie parce que les …………………………… de vie agissent sur lui. Le manque de …………………………… et le tabac le dégradent ; le sport et un suivi médical régulier le …………………………… »","lignes":0,"reponse_attendue":"Le capital santé évolue au cours de la vie parce que les habitudes de vie agissent sur lui. Le manque de sommeil et le tabac le dégradent ; le sport et un suivi médical régulier le préservent."}}},"el":{"standard":{"indice":"DOC. 1, dernière phrase : ce qui dégrade ou préserve le capital santé ; situation : ce qui a changé pour Sofiane depuis le début de son alternance.","explication":"Le DOC. 1 indique que le capital santé n'est pas fixé une fois pour toutes : certaines habitudes le dégradent, d'autres le préservent. Chez Sofiane, le manque de sommeil et le tabac le dégradent ; dormir suffisamment, bouger et se faire suivre par un médecin le préservent."},"adapte":{"indice":"DOC. 1 : relire la dernière phrase ; situation : repérer ce qui manque à Sofiane la nuit.","explication":"Le DOC. 1 indique que certaines habitudes dégradent le capital santé et que d'autres le préservent. Sofiane dort environ six heures par nuit : le manque de sommeil fait partie des habitudes qui le dégradent.","trous":["habitudes|habitude","sommeil","préservent|preservent|protègent|protegent"]},"essentiel":{"indice":"DOC. 1 : la dernière phrase contient deux des mots proposés ; le troisième concerne les nuits de Sofiane.","explication":"Le DOC. 1 indique que certaines habitudes dégradent le capital santé et que d'autres le préservent. Sofiane dort environ six heures par nuit : le manque de sommeil fait partie des habitudes qui le dégradent.","trous":["habitudes|habitude","sommeil","préservent|preservent"]}}},{"id":"a1_doc2","type":"document_texte_image","data":{"label":"DOC. 2","titre":"Les facteurs qui influencent la santé","corps":"Les facteurs qui influencent la santé se répartissent en deux grandes catégories.\nLes **facteurs internes** dépendent de la personne elle-même. Certains ne peuvent pas être modifiés : l'âge, le sexe, l'hérédité, c'est-à-dire ce qui est transmis par la famille. D'autres dépendent des habitudes de vie et peuvent être modifiés : le sommeil, l'alimentation, l'activité physique, la consommation de tabac, d'alcool ou d'autres produits.\nLes **facteurs externes** viennent de ce qui entoure la personne. Il s'agit de son environnement de vie et de travail : la qualité de l'air, le bruit, les poussières, le logement, les horaires, les trajets. Il s'agit aussi de ses conditions sociales et économiques, et de la facilité avec laquelle elle peut accéder aux soins.\nUne même personne est exposée aux deux catégories en même temps. Elle peut agir seule sur une partie des facteurs internes. Les facteurs externes, eux, relèvent le plus souvent d'une action collective, conduite par l'employeur, par la commune ou par l'État.","source":"D'après Santé publique France, les déterminants de santé.","img":"bcp_2nde_A1/images/systeme-sante_facteurs-influencent-sante.jpg","img_desc":"Infographie en deux colonnes. À gauche, les facteurs internes, séparés en deux ensembles : ce qui ne se modifie pas, avec l'hérédité, l'âge et le sexe ; ce qui se modifie, avec le sommeil, l'alimentation, l'activité physique et la consommation de tabac, d'alcool ou d'autres produits. À droite, les facteurs externes, répartis en trois ensembles : l'environnement, avec la qualité de l'air, le bruit, la pollution et la nature du logement ; le travail, avec les conditions de travail, les horaires, les déplacements et les risques professionnels ; les conditions sociales, avec le niveau de revenus, l'accès à l'éducation, l'accès aux soins et le soutien social.","img_w":2260,"img_h":1450}},{"id":"a1_s1_ch3","type":"question_chapeau","data":{"numero":"3","texte":"À partir du document 2 :","reponse_attendue":""}},{"id":"a1_s1_q31","type":"classer","data":{"competence":"C1","numero":"3.1","titre":"","consigne":"**Classer** les six éléments relevés chez Sofiane dans l'une des deux catégories, en complétant le tableau.","categories":["Facteur interne","Facteur externe"],"items":["Le manque de sommeil","La consommation de tabac","L'arrêt du football","Le bruit de l'atelier","La poussière de l'atelier","Son âge"],"classement":[0,0,0,1,1,0],"indice":"Se demander pour chaque élément s'il vient de Sofiane lui-même ou de ce qui l'entoure.","variantes":{"adapte":{"consigne":"**Classer** quatre éléments relevés chez Sofiane dans l'une des deux catégories.","items":["Le manque de sommeil","La consommation de tabac","Le bruit de l'atelier","Son âge"],"classement":[0,0,1,0]},"essentiel":{"consigne":"**Classer** trois éléments relevés chez Sofiane dans l'une des deux catégories.","items":["Le manque de sommeil","La consommation de tabac","Le bruit de l'atelier"],"classement":[0,0,1],"indice":"Se demander pour chaque élément s'il vient de Sofiane lui-même ou de l'atelier où il travaille."}}},"el":{"standard":{"indice":"Se demander pour chaque élément s'il vient de Sofiane lui-même ou de ce qui l'entoure.","explication":"Le manque de sommeil, le tabac et l'arrêt du football sont des habitudes de vie : facteurs internes modifiables. L'âge est un facteur interne qui ne se modifie pas. Le bruit et la poussière viennent de l'atelier, donc de l'environnement de travail : facteurs externes."},"adapte":{"indice":"Se demander pour chaque élément s'il vient de Sofiane lui-même ou de ce qui l'entoure.","explication":"Le manque de sommeil et le tabac sont des habitudes de vie : facteurs internes modifiables. L'âge est un facteur interne qui ne se modifie pas. Le bruit vient de l'atelier, donc de l'environnement de travail : facteur externe."},"essentiel":{"indice":"Se demander pour chaque élément s'il vient de Sofiane lui-même ou de l'atelier où il travaille.","explication":"Le sommeil et le tabac dépendent des habitudes de Sofiane : facteurs internes. Le bruit vient de l'atelier : facteur externe."}}},{"id":"a1_doc3","type":"document","data":{"label":"DOC. 3","titre":"Ce que certains facteurs font au capital santé","corps":"**Le tabac.** En 2023, en France, le tabagisme a été responsable de plus de 68 000 décès prématurés, soit environ 11 % de l'ensemble des décès. Le cancer est la première cause de ces décès ; viennent ensuite les maladies respiratoires chroniques et les maladies cardiovasculaires.\n**Le manque de sommeil.** Un sommeil trop court, répété plusieurs semaines, diminue la vigilance dans la journée. Il augmente le risque d'accident sur la route et au travail. Il favorise aussi la prise de poids et les troubles de l'humeur.\n**Le bruit et les poussières au travail.** Une exposition répétée au bruit provoque d'abord une fatigue auditive, puis peut entraîner une perte d'audition définitive. L'inhalation répétée de poussières peut provoquer des maladies respiratoires.\n**L'arrêt de l'activité physique.** L'arrêt d'une pratique sportive régulière réduit les capacités cardiaques et musculaires. La sédentarité augmente le risque de surpoids, de diabète de type 2 et de maladies cardiovasculaires.","source":"Santé publique France, décès attribuables au tabagisme en 2023, publication du 16 février 2026."}},{"id":"a1_s1_ch4","type":"question_chapeau","data":{"numero":"4","texte":"À partir du document 3 :","reponse_attendue":""}},{"id":"a1_s1_q41","type":"sous_question","data":{"competence":"C1","numero":"4.1","texte":"**Relever** deux effets du tabac sur la santé.","lignes":2,"style_lignes":"tirets_comptage","support_type":"","reponse_attendue":"Le tabac provoque des cancers et des maladies respiratoires.","indice":"","lignes_par_reponse":1,"variantes":{"adapte":{"texte":"**Relever** un effet du tabac sur la santé.","lignes":1,"reponse_attendue":"Le tabac provoque des cancers."},"essentiel":{"texte":"**Compléter** la phrase : « Le tabac provoque des …… et des maladies …… »","lignes":0,"reponse_attendue":"Le tabac provoque des cancers et des maladies respiratoires chroniques."}}},"el":{"standard":{"indice":"DOC. 3, paragraphe « Le tabac » : repérer les maladies citées.","explication":"Le DOC. 3 cite trois causes des décès liés au tabac : le cancer, les maladies respiratoires chroniques et les maladies cardiovasculaires. Deux d'entre elles suffisent. Le chiffre de 68 000 décès mesure les conséquences, il ne nomme pas un effet."},"adapte":{"indice":"DOC. 3, paragraphe « Le tabac » : repérer les maladies citées.","explication":"Un seul effet suffit parmi les trois cités dans le DOC. 3 : le cancer, les maladies respiratoires chroniques, les maladies cardiovasculaires."},"essentiel":{"indice":"DOC. 3, paragraphe « Le tabac » : la première cause de décès, puis le type de maladie cité ensuite.","explication":"Le DOC. 3 indique que le cancer est la première cause des décès liés au tabac ; viennent ensuite les maladies respiratoires chroniques et les maladies cardiovasculaires.","trous":["cancers|cancer","respiratoires|respiratoire|respiratoires chroniques|cardiovasculaires|cardiovasculaire"]}}},{"id":"a1_s1_q42","type":"sous_question","data":{"competence":"C1","numero":"4.2","texte":"**Relier** chaque habitude de Sofiane à un effet possible sur sa santé, en complétant le tableau.","lignes":0,"style_lignes":"","support_type":"","reponse_attendue":"Il fume pendant les pauses. : Risque de cancer et de maladie respiratoire. • Il dort environ six heures par nuit. : Baisse de vigilance, donc risque d'accident. • Il travaille dans un atelier bruyant. : Fatigue auditive, puis perte d'audition.","indice":"","variantes":{"essentiel":{"texte":"**Relier** chaque habitude de Sofiane à un effet possible sur sa santé, en complétant le tableau.\n(Effets possibles : baisse de vigilance, fatigue auditive.)"}}},"el":{"standard":{"indice":"DOC. 3 : chaque habitude de Sofiane correspond à un paragraphe dont le titre est en gras.","explication":"Tabac : le DOC. 3 cite le cancer et les maladies respiratoires. Sommeil trop court : baisse de vigilance, donc risque d'accident. Bruit répété : fatigue auditive, puis perte d'audition définitive."},"adapte":{"indice":"DOC. 3 : paragraphes « Le manque de sommeil » et « Le bruit et les poussières au travail ».","explication":"Un sommeil trop court diminue la vigilance et augmente le risque d'accident au travail. Une exposition répétée au bruit provoque une fatigue auditive, puis peut entraîner une perte d'audition définitive."},"essentiel":{"indice":"DOC. 3, paragraphe « Le bruit et les poussières au travail ».","explication":"Le DOC. 3 indique qu'une exposition répétée au bruit provoque d'abord une fatigue auditive, puis peut entraîner une perte d'audition. La baisse de vigilance est liée au manque de sommeil."}}},{"id":"a1_s1_q42_tab","type":"tableau","data":{"titre":"","table_student_style":"lines","cells":[[{"type":"prof","content":"Habitude ou exposition de Sofiane"},{"type":"prof","content":"Effet possible sur sa santé"}],[{"type":"prof","content":"Il fume pendant les pauses."},{"type":"eleve","content":"","reponse":"Risque de cancer et de maladie respiratoire."}],[{"type":"prof","content":"Il dort environ six heures par nuit."},{"type": tation ou la consommation de tabac."},{"notion":"Facteur externe","definition":"Facteur qui vient de l'environnement de vie ou de travail : bruit, poussières, qualité de l'air, horaires, conditions sociales, accès aux soins."}]}},{"id":"a1_autoeval_s1","type":"auto_eval","data":{"questions":[{"type":"vf","consigne":"Selon l'OMS, une personne qui n'est pas malade est nécessairement en bonne santé.","options":["Vrai","Faux"],"correct":"Faux"},{"type":"qcm","consigne":"Le capital santé désigne :","options":["l'argent qu'une personne consacre à ses dépenses de santé","l'état de santé dont une personne dispose à un moment donné et qui évolue","la liste des maladies qu'une personne a déjà contractées"],"correct":"l'état de santé dont une personne dispose à un moment donné et qui évolue"},{"type":"qcm_m","consigne":"Indiquer les facteurs externes (plusieurs réponses exactes) :","options":["l'hérédité","la poussière de l'atelier","les horaires de travail","la consommation de tabac"],"correct":"la poussière de l'atelier, les horaires de travail"},{"type":"redige","consigne":"Indiquer les trois dimensions de la santé retenues par l'OMS.","correct":"La santé comprend le bien-être physique, le bien-être mental et le bien-être social."},{"type":"redige","consigne":"Expliquer pourquoi un manque de sommeil répété peut dégrader le capital santé.","correct":"Un sommeil trop court baisse la vigilance et augmente le risque d'accident."}],"remed_rouge":"0 à 2 réponses exactes sur 5 : reprendre le document « La santé selon l'OMS et le capital santé », puis refaire le classement des facteurs internes et externes.","remed_orange":"3 ou 4 réponses exactes sur 5 : revoir la distinction entre facteur interne et facteur externe dans le document « Les facteurs qui influencent la santé », en particulier le cas de l'hérédité.","remed_vert":"5 réponses exactes sur 5 : les notions de la séance sont acquises ; passer à l'étude des plans santé.","variantes":{"adapte":{"questions":[{"type":"vf","cons des actions et des moyens, pour une durée déterminée, le plus souvent de quatre ou cinq ans.\nUn plan santé répond à une **priorité de santé publique**, c'est-à-dire à un problème identifié comme important parce qu'il touche beaucoup de personnes, parce qu'il est grave, ou parce qu'il pourrait être évité.\nUn plan santé relève de la **prévention collective** : ses actions s'adressent à toute la population ou à un public précis, et non à une personne en particulier. La prévention individuelle, elle, dépend des choix de chacun : dormir suffisamment, ne pas fumer, pratiquer une activité physique.\nIl existe de nombreux plans santé : la stratégie décennale de lutte contre les cancers, le plan chlordécone, le programme national nutrition santé, le plan santé au travail.","source":"D'après le ministère du Travail et des Solidarités.","variantes":{"essentiel":{"corps":"Un **plan santé** est un programme d'actions décidé par l'État pour répondre à un problème de santé important.\n**Sa durée.** Elle est déterminée, le plus souvent quatre ou cinq ans.\n**Son public.** Un plan santé relève de la **prévention collective** : ses actions s'adressent à toute une population, et non à une personne en particulier. La prévention individuelle, elle, dépend des choix de chacun."}}}},{"id":"a1_s2_ch1","type":"question_chapeau","data":{"numero":"1","texte":"À partir du document 4 :","reponse_attendue":""}},{"id":"a1_s2_q11","type":"sous_question","data":{"competence":"C1","numero":"1.1","texte":"**Indiquer** qui décide d'un plan santé.","lignes":1,"style_lignes":"tirets_comptage","support_type":"","reponse_attendue":"Un plan santé est décidé par l'État.","indice":"","lignes_par_reponse":1},"el":{"standard":{"indice":"DOC. 4, première phrase.","explication":"Le DOC. 4 définit un plan santé comme un programme d'actions décidé par l'État. « Le gouvernement » ou « un ministère » désignent aussi l'État."},"adapte":{"indice":"DOC. 4, première phrase.","explication":"Le DOC. 4 définit un plan santé comme un programme d'actions décidé par l'État. « Le gouvernement » ou « un ministère » désignent aussi l'État."},"essentiel":{"indice":"DOC. 4, première phrase.","explication":"Le DOC. 4 définit un plan santé comme un programme d'actions décidé par l'État. « Le gouvernement » ou « un ministère » désignent aussi l'État."}}},{"id":"a1_s2_q11b","type":"sous_question","data":{"competence":"C1","numero":"1.2","texte":"**Indiquer** la durée d'un plan santé.","lignes":1,"style_lignes":"tirets_comptage","support_type":"","reponse_attendue":"Un plan santé porte sur une durée déterminée, le plus souvent de quatre ou cinq ans.","indice":"","lignes_par_reponse":1},"el":{"standard":{"indice":"DOC. 4 : repérer la phrase qui parle des objectifs, des actions et des moyens.","explication":"Le DOC. 4 indique qu'un plan santé porte sur une durée déterminée, le plus souvent quatre ou cinq ans."},"adapte":{"indice":"DOC. 4 : repérer la phrase qui parle des objectifs, des actions et des moyens.","explication":"Le DOC. 4 indique qu'un plan santé porte sur une durée déterminée, le plus souvent quatre ou cinq ans."},"essentiel":{"indice":"DOC. 4, paragraphe « Sa durée ».","explication":"Le DOC. 4 indique qu'un plan santé porte sur une durée déterminée, le plus souvent quatre ou cinq ans."}}},{"id":"a1_s2_q12","type":"sous_question","data":{"competence":"C1","numero":"1.3","texte":"**Nommer** le type de prévention mis en œuvre par un plan santé.","lignes":1,"style_lignes":"tirets_comptage","support_type":"","reponse_attendue":"Il s'agit de la prévention collective.","indice":"","lignes_par_reponse":1,"variantes":{"adapte":{"texte":"**Nommer** le type de prévention mis en œuvre par un plan santé. Deux réponses possibles : prévention collective, prévention individuelle."},"essentiel":{"texte":"**Nommer** le type de prévention mis en œuvre par un plan santé, en cochant la réponse exacte.\n☐ La prévention collective.\n☐ La prévention individuelle.","lignes":0}}},"el":{"standard":{"indice":"DOC. 4 : repérer à qui s'adressent les actions d'un plan santé.","explication":"Les actions d'un plan santé s'adressent à toute la population ou à un public précis, et non à une personne en particulier : c'est la prévention collective."},"adapte":{"indice":"DOC. 4 : se demander si un plan santé vise une personne en particulier ou toute une population.","explication":"Les actions d'un plan santé s'adressent à toute la population ou à un public précis. La prévention individuelle, elle, dépend des choix de chacun : un plan santé relève donc de la prévention collective."},"essentiel":{"indice":"DOC. 4, paragraphe « Son public ».","explication":"Un plan santé s'adresse à toute une population : c'est la prévention collective. La prévention individuelle dépend des choix de chacun.","choix_corrects":[0]}}},{"id":"a1_s2_q13","type":"sous_question","data":{"competence":"C3","numero":"1.4","texte":"**Préciser** ce qui distingue la prévention collective de la prévention individuelle, en rédigeant des phrases complètes.","lignes":4,"style_lignes":"tiret_guide","support_type":"","reponse_attendue":"La prévention collective s'adresse à une population ; la prévention individuelle dépend des choix de chacun.","indice":"Se demander qui décide de l'action, puis qui elle concerne.","variantes":{"adapte":{"texte":"**Compléter** l'explication ci-dessous.\n« La prévention collective s'adresse à toute une …………………………… , alors que la prévention individuelle dépend des choix de …………………………… . Un plan santé relève donc de la prévention …………………………… »","lignes":0,"reponse_attendue":"La prévention collective s'adresse à toute une population, alors que la prévention individuelle dépend des choix de chacun. Un plan santé relève donc de la prévention collective."},"essentiel":{"texte":"**Compléter** l'explication ci-dessous avec les mots proposés.\n(Mots à utiliser : population — chacun — collective.)\n« La prévention collective s'adresse à toute une …………………………… , alors que la prévention individuelle dépend des choix de …………………………… . Un plan santé relève donc de la prévention …………………………… »","lignes":0,"reponse_attendue":"La prévention collective s'adresse à toute une population, alors que la prévention individuelle dépend des choix de chacun. Un plan santé relève donc de la prévention collective."}}},"el":{"standard":{"indice":"DOC. 4 : se demander qui décide de l'action, puis qui elle concerne.","explication":"Le DOC. 4 oppose deux formes de prévention. La prévention collective s'adresse à toute la population ou à un public précis, comme un plan santé. La prévention individuelle dépend des choix de chacun : dormir suffisamment, ne pas fumer, pratiquer une activité physique."},"adapte":{"indice":"DOC. 4, troisième paragraphe : repérer à qui s'adresse chaque forme de prévention.","explication":"Le DOC. 4 indique que la prévention collective s'adresse à toute la population et que la prévention individuelle dépend des choix de chacun. Un plan santé vise une population : il relève de la prévention collective.","trous":["population","chacun|chaque personne","collective"]},"essentiel":{"indice":"DOC. 4, paragraphe « Son public ».","explication":"Le DOC. 4 indique que la prévention collective s'adresse à toute la population et que la prévention individuelle dépend des choix de chacun. Un plan santé vise une population : il relève de la prévention collective.","trous":["population","chacun","collective"]}}},{"id":"a1_doc5","type":"document_texte_image","data":{"label":"DOC. 5","titre":"Le Plan santé au travail 2026-2030","corps":"Le **Plan santé au travail** fixe, tous les cinq ans, les orientations nationales en matière de prévention des risques professionnels. Le plan pour la période 2026-2030 a été présenté le 5 juin 2026 par le ministre du Travail et des Solidarités. Il a été préparé avec les partenaires sociaux, c'est-à-dire les représentants des employeurs et des salariés.\nSon objectif est de renforcer la prévention dans les entreprises et d'agir avant l'accident ou la maladie plutôt que de réparer ensuite : c'est ce que l'on appelle la prévention primaire.\nCe plan retient notamment quatre orientations. La première est la prévention des accidents du travail graves et mortels, en visant particulièrement les publics les plus exposés, c'est-à-dire les jeunes et les intérimaires. La deuxième est l'amélioration de la qualité de vie et des conditions de travail. La troisième est la promotion de la santé mentale et la prévention des risques psychosociaux. La quatrième est la prise en compte des risques nouveaux, notamment ceux liés au changement climatique.\nLe plan national est ensuite décliné dans chaque région par les directions régionales de l'économie, de l'emploi, du travail et des solidarités (DREETS), sous la forme d'un plan régional santé travail.","source":"Ministère du Travail et des Solidarités, Plan santé au travail 2026-2030, 5 juin 2026.","variantes":{"adapte":{"corps":"Le **Plan santé au travail** fixe, tous les cinq ans, les orientations nationales en matière de prévention des risques professionnels.\n**Sa durée.** Cinq ans, de 2026 à 2030. Il a été présenté le 5 juin 2026 par le ministre du Travail et des Solidarités.\n**Son objectif.** Renforcer la prévention dans les entreprises et agir avant l'accident ou la maladie.\n**Ses orientations.** Prévenir les accidents graves et mortels, en visant les publics les plus exposés, c'est-à-dire les jeunes et les intérimaires. Améliorer la qualité de vie et les conditions de travail. Promouvoir la santé mentale. Prendre en compte les risques nouveaux.\n**Son application.** Le plan est décliné dans chaque région par les DREETS."},"essentiel":{"corps":"Le **Plan santé au travail** fixe les orientations nationales en matière de prévention des risques professionnels.\n**Sa durée.** Cinq ans, de 2026 à 2030.\n**Son objectif.** Renforcer la prévention dans les entreprises et agir avant l'accident ou la maladie.\n**Les publics les plus exposés.** Le plan vise particulièrement les jeunes et les intérimaires."}},"img":"bcp_2nde_A1/images/systeme-sante_plan-sante-travail-2026-2030.png","img_desc":"Schéma du Plan santé au travail 2026-2030. En haut, le titre du plan et sa date de présentation, le 5 juin 2026. En dessous, son objectif : renforcer la prévention dans les entreprises et agir avant l'accident ou la maladie. Puis quatre encadrés numérotés présentant ses quatre orientations : prévenir les accidents graves et mortels, en visant les jeunes et les intérimaires ; améliorer la qualité de vie et les conditions de travail ; promouvoir la santé mentale et prévenir les risques psychosociaux ; prendre en compte les risques nouveaux, notamment ceux liés au changement climatique. En bas, une flèche conduit à la déclinaison du plan en région par les DREETS, sous la forme d'un plan régional santé travail.","img_w":1800,"img_h":1280}},{"id":"a1_s2_ch2","type":"question_chapeau","data":{"numero":"2","texte":"À partir du document 5 :","reponse_attendue":""}},{"id":"a1_s2_q21","type":"sous_question","data":{"competence":"C1","numero":"2.1","texte":"**Relever** les caractéristiques du Plan santé au travail 2026-2030, en complétant le tableau.","lignes":0,"style_lignes":"","support_type":"","reponse_attendue":"Durée du plan : Cinq ans, de 2026 à 2030. • Objectif principal : Renforcer la prévention dans les entreprises. • Publics particulièrement visés : Les jeunes et les intérimaires. • Deux orientations annoncées : Les accidents graves et mortels ; la santé mentale. • Qui applique le plan dans les régions : Les DREETS, par un plan régional santé travail.","indice":""},"el":{"standard":{"indice":"DOC. 5 : chaque ligne du tableau correspond à une information du texte (durée, objectif, publics, orientations, région).","explication":"Le DOC. 5 donne : une durée de cinq ans, de 2026 à 2030 ; l'objectif de renforcer la prévention dans les entreprises ; les jeunes et les intérimaires comme publics les plus exposés ; quatre orientations, dont deux suffisent ; une déclinaison dans chaque région par les DREETS."},"adapte":{"indice":"DOC. 5 : paragraphes « Ses orientations » et « Son application ».","explication":"Le DOC. 5 désigne les jeunes et les intérimaires comme les publics les plus exposés. Il annonce quatre orientations, dont deux suffisent : par exemple les accidents graves et mortels, la santé mentale. Les DREETS appliquent le plan dans chaque région."},"essentiel":{"indice":"DOC. 5 : schéma, les quatre encadrés numérotés puis la flèche du bas.","explication":"Le schéma du DOC. 5 présente quatre orientations, dont deux suffisent : par exemple les accidents graves et mortels, la santé mentale. La flèche du bas indique que les DREETS appliquent le plan dans chaque région."}}},{"id":"a1_s2_q21_tab","type":"tableau","data":{"titre":"","table_student_style":"lines","cells":[[{"type":"prof","content":"Ce que l'on cherche"},{"type":"prof","content":"Réponse"}],[{"type":"prof","content":"Durée du plan"},{"type":"eleve","content":"","reponse":"Cinq ans, de 2026 à 2030."}],[{"type":"prof","content":"Objectif principal"},{"type":"eleve","content":"","reponse":"Renforcer la prévention dans les entreprises."}],[{"type":"prof","content":"Publics particulièrement visés"},{"type":"eleve","content":"","reponse":"Les jeunes et les intérimaires."}],[{"type":"prof","content":"Deux orientations annoncées"},{"type":"eleve","content":"","reponse":"Les accidents graves et mortels ; la santé mentale."}],[{"type":"prof","content":"Qui applique le plan dans les régions"},{"type":"eleve","content":"","reponse":"Les DREETS, par un plan régional santé travail."}]],"variantes":{"adapte":{"cells":[[{"type":"prof","content":"Ce que l'on cherche"},{"type":"prof","content":"Réponse"}],[{"type":"prof","content":"Durée du plan"},{"type":"prof","content":"Cinq ans, de 2026 à 2030."}],[{"type":"prof","content":"Objectif principal"},{"type":"prof","content":"Renforcer la prévention dans les entreprises."}],[{"type":"prof","content":"Publics particulièr amélioration de la qualité de vie au travail.","lignes":0,"reponse_attendue":"La prévention des accidents graves et mortels chez les jeunes."},"essentiel":{"texte":"**Identifier** l'orientation du plan qui concerne le plus directement Sofiane, en cochant la proposition exacte.\n☐ La prévention des accidents graves et mortels chez les jeunes.\n☐ La prise en compte des risques liés au changement climatique.\n☐ L'amélioration de la qualité de vie au travail.","lignes":0,"reponse_attendue":"La prévention des accidents graves et mortels chez les jeunes."}}},"el":{"standard":{"indice":"Repérer d'abord les publics que le plan désigne comme les plus exposés, puis les comparer à la situation de Sofiane.","explication":"Le DOC. 5 désigne les jeunes et les intérimaires comme les publics les plus exposés aux accidents graves et mortels. Sofiane a 18 ans et vient de commencer son alternance : cette orientation le concerne directement."},"adapte":{"indice":"DOC. 5 : repérer l'orientation qui désigne un public précis, puis comparer ce public à l'âge de Sofiane.","explication":"Le DOC. 5 désigne les jeunes et les intérimaires comme les publics les plus exposés aux accidents graves et mortels. Sofiane a 18 ans et vient de commencer son alternance : cette orientation le concerne directement. Les deux autres orientations figurent dans le plan, mais ne visent pas ce public.","choix_corrects":[0]},"essentiel":{"indice":"DOC. 5 : repérer l'orientation qui désigne un public précis, puis comparer ce public à l'âge de Sofiane.","explication":"Le DOC. 5 désigne les jeunes et les intérimaires comme les publics les plus exposés aux accidents graves et mortels. Sofiane a 18 ans et vient de commencer son alternance : cette orientation le concerne directement. Les deux autres orientations figurent dans le plan, mais ne visent pas ce public.","choix_corrects":[0]}}},{"id":"a1_s2_q23","type":"sous_question","data":{"competence":"C3","numero":"2.3","texte":"**Expliquer** en quoi un plan national peut protéger la santé d'un salarié, en rédigeant des phrases complètes.","lignes":5,"style_lignes":"tiret_guide","support_type":"","reponse_attendue":"Un plan national agit sur les conditions de travail, que le salarié ne peut pas modifier seul.","indice":"Reprendre la distinction entre les facteurs sur lesquels une personne peut agir seule et les autres.","variantes":{"adapte":{"texte":"**Compléter** l'explication : « Un plan national demande aux …… d'agir en prévention. Un salarié seul ne peut changer ni le …… de son atelier, ni ses …… de travail. »","lignes":0,"reponse_attendue":"Un plan national demande aux entreprises d'agir en prévention. Un salarié seul ne peut changer ni le bruit de son atelier, ni ses conditions de travail."},"essentiel":{"texte":"**Compléter** l'explication : « Un plan national demande aux …… d'agir en prévention. Un salarié seul ne peut changer ni le …… de son atelier, ni ses …… de travail. »\nMots à utiliser : entreprises, bruit, conditions.","lignes":0,"reponse_attendue":"Un plan national demande aux entreprises d'agir en prévention. Un salarié seul ne peut changer ni le bruit de son atelier, ni ses conditions de travail."}}},"el":{"standard":{"indice":"Reprendre la distinction entre les facteurs sur lesquels une personne peut agir seule et les autres (DOC. 2).","explication":"Le bruit, les poussières ou les horaires sont des facteurs externes : Sofiane ne peut pas les changer seul. Le DOC. 2 indique que ces facteurs relèvent d'une action collective, conduite par l'employeur ou l'État. Le Plan santé au travail renforce la prévention dans les entreprises : il protège le salarié avant l'accident ou la maladie."},"adapte":{"indice":"DOC. 5 : l'objectif du plan ; situation : ce qui caractérise l'atelier de Sofiane.","explication":"Le Plan santé au travail vise à renforcer la prévention dans les entreprises (DOC. 5). Le bruit de l'atelier et les conditions de travail sont des facteurs externes (DOC. 2) : un salarié seul ne peut pas les modifier.","trous":["entreprises|entreprise|employeurs","bruit","conditions|horaires"]},"essentiel":{"indice":"DOC. 5 : l'objectif du plan ; situation : la description de l'atelier de Sofiane.","explication":"Le Plan santé au travail vise à renforcer la prévention dans les entreprises (DOC. 5). Le bruit de l'atelier et les conditions de travail sont des facteurs externes (DOC. 2) : un salarié seul ne peut pas les modifier.","trous":["entreprises|entreprise","bruit","conditions"]}}},{"id":"a1_notions_s2","type":"notions","data":{"titre":"Notions à retenir — séance 2","items":[{"notion":"Plan santé","definition":"Programme d'actions décidé par l'État pour répondre à un problème de santé important, avec des objectifs, des moyens et une durée déterminée."},{"notion":"Prévention collective","definition":"Ensemble d'actions qui s'adressent à toute la population ou à un public précis, et non à une personne en particulier."},{"notion":"Priorité de santé publique","definition":"Problème de santé identifié comme important pour la population, parce qu'il touche beaucoup de personnes, parce qu'il est grave ou parce qu'il pourrait être évité."}]}},{"id":"a1_autoeval_s2","type":"auto_eval","data":{"questions":[{"type":"vf","consigne":"Un plan santé s'adresse à une personne en particulier.","options":["Vrai","Faux"],"correct":"Faux"},{"type":"qcm","consigne":"Un plan santé est décidé par :","options":["une entreprise","l'État","une caisse d'assurance maladie"],"correct":"l'État"},{"type":"qcm_m","consigne":"Indiquer les publics particulièrement visés par le Plan santé au travail 2026-2030 (plusieurs réponses exactes) :","options":["les jeunes","les intérimaires","les retraités","les élèves de collège"],"correct":"les jeunes, les intérimaires"},{"type":"redige","consigne":"Définir la prévention collective.","correct":"La prévention collective désigne des actions qui s'adressent à une population."},{"type":"redige","consigne":"Préciser l'objectif principal du Plan santé au travail 2026-203 nt visés par le Plan santé au travail 2026-2030 (plusieurs réponses exactes) :","options":["les jeunes","les intérimaires","les retraités","les élèves de collège"],"correct":"les jeunes, les intérimaires"},{"type":"qcm","consigne":"La prévention collective désigne des actions qui s'adressent :","options":["à une population","à une seule personne","à un seul patient"],"correct":"à une population"},{"type":"qcm","consigne":"Quel est l'objectif principal du Plan santé au travail 2026-2030 ?","options":["Renforcer la prévention dans les entreprises.","Augmenter les salaires.","Réduire la durée du travail."],"correct":"Renforcer la prévention dans les entreprises."}]}}},"el":{"seuils":{"rouge_max":2,"orange_max":4},"standard":[{"explication":"Un plan santé relève de la prévention collective : ses actions s'adressent à toute la population ou à un public précis, et non à une personne en particulier.","renvoi":"DOC. 4 — Qu'est-ce qu'un plan santé ?","renvoi_bloc":"a1_doc4","accepte":[]},{"explication":"Le DOC. 4 définit un plan santé comme un programme d'actions décidé par l'État.","renvoi":"DOC. 4 — Qu'est-ce qu'un plan santé ?","renvoi_bloc":"a1_doc4","accepte":[]},{"explication":"Le DOC. 5 désigne les jeunes et les intérimaires comme les publics les plus exposés aux accidents graves et mortels.","renvoi":"DOC. 5 — Le Plan santé au travail 2026-2030","renvoi_bloc":"a1_doc5","accepte":[]},{"explication":"La prévention collective regroupe des actions qui s'adressent à toute la population ou à un public précis, et non à une personne en particulier.","renvoi":"DOC. 4 — Qu'est-ce qu'un plan santé ?","renvoi_bloc":"a1_doc4","accepte":["population","un public","public precis","public précis","ensemble de la population","tout le monde"]},{"explication":"Le DOC. 5 fixe l'objectif de renforcer la prévention dans les entreprises et d'agir avant l'accident ou la maladie plutôt que de réparer ensuite.","renvoi":"DOC. 5 — Le Plan santé au travail 2026-2030","renvoi_bloc":"a1_doc5","acc
