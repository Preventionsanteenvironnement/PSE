<title>Escape game B4 — Aider Camille à protéger son audition · CAP · PSE</title>
<!-- [ESCAPE GAME B4 v2, 19/11/2026, demande de Brahim, « fais tout maintenant »]
     Tout le cours B4 (CAP) en 12 salles avec Camille : le son et le bruit, les seuils, niveau et durée, trajet du son,
     effets, troubles de Camille, obligations de l'employeur, concert, protecteurs, loisirs, plan de prévention
     collective et individuelle, conduite à tenir. Environ une heure.
     Code élève (annuaire.js ; essai : ESSAI). Chemin bleu (lecture) / vert (phrases courtes, images) : mêmes points.
     ▶/⏸ sur chaque texte, choix, document, indice ; jamais de lecture automatique ; gros bouton « Arrêter ».
     Une erreur : indice 1, puis indice 2, puis la réponse expliquée. « Je passe pour l'instant » sur chaque question ;
     avant le coffre, retour sur les questions passées (ou non). Note sur 20 + grille par compétence envoyées
     dans resultats/{code}/copies/ESCAPE-B4-CAP_copie_N ; l'élève ne voit jamais sa note. Ouvert jusqu'au 30/11/2026.
     Contenu repris des documents du cours B4 de l'Atelier (INRS, OMS, Inserm, Code de la santé publique, Assurance Maladie).
     Images : cours B4, bibliothèque de l'Atelier, pictogrammes ARASAAC (CC BY-NC-SA, S. Palao, Gouvernement d'Aragon),
     AAC, PiCom. -->
<style>

  .case-cocher { width: 1.6rem; height: 1.6rem; border: 3px solid var(--texte); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; flex: 0 0 auto; }

  .rang.cliquable { cursor: pointer; }
  .ordre-pioche, .ordre-suite { display: grid; gap: 6px; margin: 6px 0; }

  .ordre-suite .rang::before { counter-increment: etape; content: counter(etape); font-weight: 800; width: 2rem; height: 2rem; border-radius: 50%; background: var(--chemin); color: #fff; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .vide-ordre { color: var(--doux); text-align: center; padding: 8px; }

  .phrase { font-size: 1.12rem; margin: 10px 0; }
  .trou { display: inline-block; min-width: 7rem; border-bottom: 3px solid var(--chemin); text-align: center; font-weight: 800; padding: 0 6px; }
  .banque { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0; align-items: center; }
  .mot { font: inherit; font-size: 1.1rem; font-weight: 700; padding: 8px 16px; border-radius: 12px; border: 3px solid var(--bord); background: var(--carte); color: var(--texte); cursor: pointer; }

  .actions { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; margin: 14px 0; }
  .outils-q { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  .coffre-img { display: block; margin: 0 auto; height: 140px; }

  .ecran { animation: porte .55s ease; }
  @keyframes porte { from { opacity: 0; transform: perspective(900px) rotateY(-14deg) translateX(30px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.18); } 100% { transform: scale(1); } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .acces { position: fixed; right: 10px; bottom: 10px; z-index: 50; display: flex; gap: 6px; flex-wrap: wrap; background: rgba(38,50,56,.94); padding: 6px; border-radius: 12px; }
  .acces button { font: inherit; font-size: 15px; font-weight: 800; min-width: 42px; min-height: 40px; border: 0; border-radius: 8px; background: #fff; color: #263238; cursor: pointer; }

<script>
(function () {
  "use strict";
  var ID = "ESCAPE-B4-CAP", TITRE = "Escape game B4 — Aider Camille à protéger son audition", IMG = "cap_B4/escape/", IMC = "cap_B4/images/";
  var FERMETURE = new Date("2026-11-30T23:59:59+01:00");
  function estFerme() { return Date.now() > FERMETURE.getTime(); }
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function txt(h) { var d = document.createElement("div"); d.innerHTML = h.replace(/<\/(p|tr|td|th)>/g, " </$1>"); return d.textContent; }

  /* ════════ CONTENU — d'après le cours B4 (CAP) de l'Atelier PSE ════════ */
  var SITUATION = {
    bleu: "Camille, 24 ans, est serveuse dans une salle de concert. Les soirs de concert, son exposition au bruit, mesurée sur sa journée de travail de 8 heures, est de 92 dB(A). Son employeur lui a donné des bouchons d'oreilles, mais elle les enlève pour entendre les clients. Après le service, elle rentre chez elle en bus en écoutant de la musique avec ses écouteurs, au volume maximal : son téléphone indique alors 100 dB(A). Depuis lundi, elle entend des sifflements dans les oreilles, elle dort mal et elle se sent fatiguée. Camille se demande si ses oreilles vont guérir et ce qu'elle doit changer.",
    vert: "Camille a 24 ans. Elle est serveuse dans une salle de concert. Au travail, elle est dans le bruit 8 heures : 92 dB(A). Elle a des bouchons d'oreilles. Mais elle les enlève pour entendre les clients. Après le travail, dans le bus, elle écoute de la musique très fort avec ses écouteurs : 100 dB(A). Depuis lundi, elle entend des sifflements. Elle dort mal. Elle est fatiguée. Camille se demande : mes oreilles vont-elles guérir ? Que dois-je changer ?"
  };

  var DOCS = {
    d1: { titre: "Document 1 — Le son et le bruit", source: "D'après l'INRS, Bruit — Définitions.",
          html: "<p>Un <b>son</b> est une vibration de l'air qui se propage sous la forme d'une <b>onde sonore</b>.</p><p>On parle de <b>bruit</b> lorsqu'un son, ou un ensemble de sons, est perçu comme <b>gênant</b>.</p><p>L'<b>intensité</b> dit si le son est faible ou fort ; elle se mesure en décibels, dB(A). La <b>fréquence</b> dit si le son est grave ou aigu ; elle se mesure en hertz, Hz.</p>",
          img: [IMC + "b4-onde-sonore-2026.png", "L'onde sonore : l'intensité (faible ou fort) et la fréquence (grave ou aigu)"] },
    d2: { titre: "Document 2 — L'échelle des niveaux sonores", source: "D'après l'INRS et le Code de la santé publique, article R. 1336-1.",
          html: "<p>Le <b>niveau sonore</b> est l'intensité d'un bruit, mesurée en dB(A).</p><p>0 dB(A) : seuil d'audibilité, le bruit le plus faible que l'oreille perçoit. 80 dB(A) : seuil de nocivité, pour 8 heures par jour. 120 dB(A) : seuil de douleur.</p><p>De 0 à 80 dB(A) : pas de risque pour l'audition. De 80 à 120 dB(A) : risque selon la durée. Au-delà de 120 dB(A) : douleur.</p>",
          img: [IMC + "b4-echelle-niveaux-sonores-2026.png", "L'échelle des niveaux sonores, de 0 à 130 dB(A)"] },
    d3: { titre: "Document 3 — Le niveau sonore et la durée d'exposition", source: "D'après l'Organisation mondiale de la santé (OMS).",
          html: "<p>Le risque pour l'audition dépend du <b>niveau sonore</b> et de la <b>durée d'exposition</b>, c'est-à-dire le temps passé dans le bruit. Durée d'écoute sans risque, par semaine (musique et loisirs) :</p><table class='doc-t'><tr><th>Niveau sonore</th><th>Durée sans risque par semaine</th></tr><tr><td>80 dB(A)</td><td>40 heures</td></tr><tr><td>85 dB(A)</td><td>12 heures 30 minutes</td></tr><tr><td>90 dB(A)</td><td>4 heures</td></tr><tr><td>95 dB(A)</td><td>1 heure 15 minutes</td></tr><tr><td>100 dB(A)</td><td>20 minutes</td></tr></table>" },
    d4: { titre: "Document 4 — Le trajet du son dans l'oreille", source: "D'après l'Inserm, Troubles de l'audition.",
          html: "<p>Le <b>pavillon</b> capte l'onde sonore ; le <b>conduit auditif</b> la conduit jusqu'au <b>tympan</b>, qui vibre. Dans l'oreille moyenne, trois petits os, les <b>osselets</b>, transmettent les vibrations. Dans l'oreille interne, la <b>cochlée</b> contient les <b>cellules ciliées</b>, qui transforment les vibrations en <b>influx nerveux</b>. Le <b>nerf auditif</b> conduit l'influx nerveux jusqu'au <b>cerveau</b>.</p>",
          img: [IMC + "b4-trajet-son-schema.png", "Le trajet du son : oreille externe, oreille moyenne, oreille interne, puis le cerveau"] },
    d5: { titre: "Document 5 — Les effets du bruit sur la santé", source: "D'après l'INRS, Bruit — Effets sur la santé, et l'Inserm.",
          html: "<p><b>Les effets auditifs</b> touchent l'oreille. La <b>fatigue auditive</b> : après un bruit intense, des sifflements ou des bourdonnements (les <b>acouphènes</b>) et une baisse de l'audition ; elle disparaît avec le repos si l'exposition au bruit ne recommence pas. La <b>surdité</b> : un bruit intense et prolongé détruit peu à peu les cellules ciliées ; elles ne se réparent pas, la perte d'audition est définitive.</p><p><b>Les effets extra-auditifs</b> touchent le reste du corps : fatigue, stress, troubles du sommeil, baisse de la concentration.</p>",
          pictos: [["Effets auditifs", [["picto-acouphene.png", "Acouphènes"], ["picto-sourd.png", "Perte d'audition"]]],
                   ["Effets extra-auditifs", [["picto-fatigue.png", "Fatigue"], ["picto-stress.png", "Stress"], ["picto-insomnie.png", "Troubles du sommeil"]]]] },
    d6: { titre: "Document 6 — La réglementation contre le bruit", source: "D'après l'INRS et le Code de la santé publique, article R. 1336-1.",
          html: "<p><b>Au travail</b>, l'employeur évalue le bruit et le réduit, d'abord à la source. Au-dessus de 80 dB(A) sur 8 heures, il met à disposition des protecteurs individuels contre le bruit et forme les salariés à leur usage. Au-dessus de 85 dB(A) sur 8 heures, il signale les zones bruyantes, met en place un programme de réduction du bruit et contrôle le port des protecteurs.</p><p><b>Dans les concerts</b>, le niveau sonore ne doit pas dépasser 102 dB(A) en moyenne sur 15 minutes. L'organisateur informe le public des risques, met à disposition gratuitement des protections auditives et crée des zones de repos auditif, où le bruit est plus faible.</p>",
          img: [IMC + "b4-panneau-protections-auditives.png", "Panneau de signalisation : port obligatoire de protections auditives"] },
    d7: { titre: "Document 7 — Protéger son audition", source: "D'après l'OMS, l'INRS et l'Assurance Maladie.",
          html: "<p>1. <b>Réduire le niveau sonore</b> : régler le volume des écouteurs à 60 % au plus du maximum ; s'éloigner des enceintes et des machines bruyantes.</p><p>2. <b>Limiter la durée</b> : écouter moins longtemps et faire des pauses.</p><p>3. <b>Porter des protecteurs individuels</b> : bouchons d'oreilles ou casque antibruit. Ils ne protègent que s'ils sont bien mis et portés pendant toute la durée du bruit.</p><p>4. <b>Réagir aux symptômes</b> : après un bruit très fort, si le sifflement ou la baisse d'audition persiste, consulter en urgence à l'hôpital.</p>",
          figs: [["volume60.jpg", "Volume des écouteurs à 60 %"], ["concert-distance.jpg", "Près des enceintes, ou à distance avec des bouchons"], [IMC + "b4-protecteurs.jpg", "Bouchons d'oreilles et casque antibruit"]] }
  };

  function afficherItem(it) { var el = $("item-" + kid(it.id)); if (!el) return; var tmp = document.createElement("div"); tmp.innerHTML = htmlItem(it); el.replaceWith(tmp.firstChild); }
  function valider(it, bouton) {
    if (!complet(it)) { retour(it, "indice", it.type === "ordre" ? "Place toutes les étapes avant de valider." : it.type === "cocher" ? "Coche au moins une réponse avant de valider." : "Réponds à chaque ligne avant de valider."); return; }
    var res = verifier(it), juste = res.every(Boolean), r = R(it.id);
    var fini = essai(it, juste, JSON.stringify(r.sel), bouton);
    if (!fini) {
      var bons = res.filter(Boolean).length;
      if (it.type === "ordre") retour(it, "indice", "Ce n'est pas encore ça : " + bons + " étape" + (bons > 1 ? "s" : "") + " sur " + res.length + " à la bonne place. Indice " + r.essais + " : " + it.indices[r.essais - 1]);
      else res.forEach(function (ok, i) { var row = $("rg-" + kid(it.id) + "-" + i); if (row) { row.classList.toggle("ko", !ok); row.classList.toggle("okk", ok); } });
    }
  }

  /* ════════ QUESTIONS À REVOIR, COFFRE, FIN ════════ */
  function ecranRevoir() {
    var restent = ITEMS.filter(function (it) { return !(P.rep[it.id] && P.rep[it.id].fait); });
    if (!restent.length) { P.ecran = "coffre"; return ecranCoffre(); }
    var t = "Il te reste " + restent.length + " question" + (restent.length > 1 ? "s" : "") + " à faire. Tu peux y retourner, ou aller directement au coffre.";
    return '<div class="carte salle"><h2>Questions à revoir</h2><div class="ligne" id="t-rev"><div class="txt gros">' + esc(t) + "</div>" + bL(t, "t-rev") + "</div>" +
      '<div class="plan-salles" style="margin-top:10px">' + restent.map(function (it) { return '<button data-aller="s' + it.salle + '">Question ' + esc(it.id) + " ·" + esc(SALLES[it.salle].titre.split("·")[1] || "") + "</button>"; }).join("") + "</div></div>" +
      '<div class="actions"><button class="btn second" data-aller="s' + (SALLES.length - 1) + '">← Revenir</button><button class="btn" data-aller="coffre">Aller au coffre →</button></div>';
  }
  var roues = [];
  function ecranCoffre() {
    roues = SALLES.map(function () { return 0; });
    var t = "Tourne chaque roue pour mettre le chiffre de ta clé, salle par salle. Tu peux aussi appuyer sur Recopier mes clés. Puis appuie sur Ouvrir le coffre.";
    return '<div class="carte salle" style="text-align:center"><h2>Le coffre</h2><img class="coffre-img" id="coffre-img" src="' + IMG + 'coffre.png" alt="Le coffre fermé">' +
      '<div class="ligne" id="t-cof" style="text-align:left"><div class="txt gros">' + esc(t) + "</div>" + bL(t, "t-cof") + "</div>" +
      '<div class="roues">' + SALLES.map(function (s, k) { return '<div class="roue"><button data-roue="' + k + '" data-d="1" aria-label="Augmenter le chiffre de la salle ' + (k + 1) + '">▲</button><b id="roue-' + k + '">0</b><button data-roue="' + k + '" data-d="-1" aria-label="Diminuer le chiffre de la salle ' + (k + 1) + '">▼</button><small>S' + (k + 1) + "</small></div>"; }).join("") + "</div>" +
      '<p><button class="btn" id="b-ouvrir">🔓 Ouvrir le coffre</button> <button class="btn second" id="b-recopier">Recopier mes clés</button></p><div class="retour" id="r-coffre"></div>' +
      '<p><button class="btn second petit" id="b-terminer">Terminer sans ouvrir le coffre</button></p></div>';
  }
  function msgCoffre(cls, t) { var z = $("r-coffre"); z.className = "retour " + cls; z.innerHTML = '<div class="ligne"><div class="txt">' + esc(t) + "</div>" + bL(t) + "</div>"; annoncer(t); }
  function ouvrirCoffre() {
    var faux = [];
    SALLES.forEach(function (s, k) { var b = $("roue-" + k); b.classList.remove("vert", "rouge"); void b.offsetWidth; if (String(roues[k]) === CODE_COFFRE[k]) b.classList.add("vert"); else { b.classList.add("rouge"); faux.push(k + 1); } });
    if (!faux.length) { $("coffre-img").classList.add("ouvre"); msgCoffre("ok", "Le coffre s'ouvre !"); confettis(); setTimeout(terminer, 1800); return; }
    var manque = SALLES.map(function (s, si) { return salleFinie(si) ? null : si + 1; }).filter(Boolean);
    msgCoffre("indice", "Pas encore. Roues à corriger (cadre en pointillés rouges) : salles " + faux.join(", ") + "." + (manque.length ? " Il te manque les clés des salles " + manque.join(", ") + " : retourne finir leurs questions, ou termine sans ouvrir le coffre." : " Regarde tes clés en haut de l'écran."));
  }
  function terminer() { P.fini = P.fini || new Date().toISOString(); aller("fin"); envoyer(); }
  function confettis() {
    var c = ["#f9a825", "#2e7d32", "#1d4e89", "#c62828", "#8e24aa"];
    for (var i = 0; i < 70; i++) { var d = document.createElement("div"); d.className = "confetti"; d.style.left = Math.random() * 100 + "vw"; d.style.background = c[i % 5]; d.style.animationDuration = (1.8 + Math.random() * 1.8) + "s"; d.style.animationDelay = (Math.random() * .6) + "s"; document.body.appendChild(d); setTimeout(function (x) { return function () { x.remove(); }; }(d), 4200); }
  }
  function ecranFin() {
    var t = "Mission terminée ! Tu as aidé Camille à protéger son audition. Camille garde ses bouchons bien mis pendant tout le service, règle ses écouteurs à 60 % au plus et fait des pauses. Son employeur réduit le bruit à la source. Et pour ses sifflements qui durent, elle consulte en urgence. Ton travail est envoyé à ton professeur.";
    return '<div class="carte salle bravo"><img src="' + IMG + 'bravo.png" alt="" style="height:7rem;display:block;margin:8px auto"><h2 style="text-align:center">Mission terminée</h2>' +
      '<div class="ligne" id="t-bravo" style="text-align:left;color:var(--texte);font-weight:400"><div class="txt">' + esc(t) + "</div>" + bL(t, "t-bravo") + "</div>" +
      '<p class="discret" id="etat-envoi">Envoi en cours…</p><p><button class="btn" id="b-renvoyer" hidden>Réessayer l\'envoi</button></p></div>';
  }

  /* ════════ NOTE, GRILLE, ENVOI (pour le professeur seul) ════════ */
  function bilan() {
    var g = {}, total = 0, max = 0, detail = {};
    Object.keys(COMP).forEach(function (k) { g[COMP[k]] = { t: 0, m: 0 }; });
    ITEMS.forEach(function (it) {
      var r = P.rep[it.id] || { essais: 0, reps: [] }, n = r.fait ? r.niveau : 0;
      total += n; max += 3; g[COMP[it.comp]].t += n; g[COMP[it.comp]].m += 3;
      detail[it.id] = { salle: SALLES[it.salle].titre, competence: COMP[it.comp], niveau: r.fait ? NIVEAUX[n] : "Non traité", essais: r.essais || 0, reponses: (r.reps || []).join(" / "), reponse_montree: !!r.montre };
    });
    var competences = {};
    Object.keys(g).forEach(function (k) { var x = g[k], ratio = x.m ? x.t / x.m : 0; competences[k] = ratio >= 0.85 ? "Maîtrisé" : ratio >= 0.6 ? "Satisfaisant" : ratio >= 0.35 ? "Fragile" : "Insuffisant"; });
    return { note: Math.round(total / max * 200) / 10, competences: competences, detail: detail, cles: SALLES.filter(function (s, si) { return salleFinie(si); }).length };
  }
  function attendreDb(delai) {
    return new Promise(function (ok, ko) { var t0 = Date.now();
      (function e() { try { if (window._ensureDb) { var db = window._ensureDb(); if (db) return ok(db); } } catch (x) {} if (Date.now() - t0 > delai) return ko(new Error("Connexion impossible")); setTimeout(e, 300); })(); });
  }
  function envoyer() {
    if (!P || P.envoye) return etatEnvoi(true);
    var b = bilan();
    var data = { eleveCode: P.code, devoirId: ID, exercice: ID, titre: TITRE, type: "escape_game", version: 2, module: "B4", diplome: "CAP",
      classe: P.classe, eleve: { userCode: P.code, classe: P.classe }, chemin: P.chemin, note_auto: b.note, score: b.note, note_sur: 20,
      competences: b.competences, reponses: b.detail, cles: b.cles + "/" + SALLES.length,
      debut: P.debut, fin: P.fini, tempsSecondes: Math.round((new Date(P.fini) - new Date(P.debut)) / 1000),
      createdAtISO: new Date().toISOString(), appareil: /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? "Mobile" : "Ordinateur" };
    $("etat-envoi").textContent = "Envoi en cours…";
    attendreDb(12000).then(function (db) {
      var col = db.collection("resultats").doc(P.code).collection("copies");
      if (window.firebase && firebase.firestore && firebase.firestore.FieldValue) data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      function tenter(n) { if (n > 9) throw new Error("Trop de parties"); var ref = col.doc(ID + "_copie_" + n);
        return ref.get().then(function (s) { if (s.exists) return tenter(n + 1); data.tentative = n; return ref.set(data); }); }
      return tenter(1);
    }).then(function () { P.envoye = new Date().toISOString(); sauver(); etatEnvoi(true); }).catch(function (e) { console.warn(e); etatEnvoi(false); });
  }
  function etatEnvoi(ok) { var e = $("etat-envoi"), b = $("b-renvoyer"); if (!e) return; e.textContent = ok ? "✅ Ton travail est bien arrivé chez ton professeur." : "⚠️ L'envoi n'a pas marché (connexion ?). Ton travail est gardé sur cet appareil : appuie sur « Réessayer », ou appelle ton professeur."; b.hidden = ok; }

  /* ════════ CLICS ════════ */
  document.addEventListener("click", function (e) {
    var lb = e.target.closest(".lire");
    if (lb) { e.preventDefault(); e.stopPropagation(); lire(lb, lb.dataset.texte, lb.dataset.cible ? $(lb.dataset.cible) : null); return; }
    var co = e.target.closest("[data-cocher]");
    if (co) { var itc = item(co.dataset.cocher), r0 = R(itc.id); if (r0.fait) return; r0.sel = r0.sel || {}; r0.sel[co.dataset.o] = !r0.sel[co.dataset.o]; sauver(); var on = !!r0.sel[co.dataset.o]; co.classList.toggle("coche", on); co.classList.remove("ko", "okk"); co.setAttribute("aria-checked", on); co.querySelector(".case-cocher").textContent = on ? "✓" : ""; return; }
    var b = e.target.closest("button"); if (!b) return;
    if (b.id === "b-code") return entrerCode();
    if (b.dataset.chemin) { P.chemin = b.dataset.chemin; P.ecran = P.ecran || "situation"; document.body.classList.toggle("chemin-vert", P.chemin === "vert"); sauver(); return afficher(); }
    if (b.dataset.cheminChange) { P.chemin = null; sauver(); return afficher(); }
    if (b.dataset.aller) return aller(b.dataset.aller);
    if (b.classList.contains("choix") && !b.disabled) { var it1 = item(b.dataset.q); return essai(it1, +b.dataset.v === it1.bon, b.dataset.v, b); }
    if (b.classList.contains("mot") && !b.disabled) { var it2 = item(b.dataset.q); $("trou-" + kid(it2.id)).textContent = b.dataset.mot; return essai(it2, b.dataset.mot === it2.bon, b.dataset.mot, b); }
    if (b.dataset.relier) { var it3 = item(b.dataset.relier), r3 = R(it3.id); r3.sel = r3.sel || {}; r3.sel[b.dataset.g] = b.dataset.l; sauver(); b.parentNode.querySelectorAll(".opt").forEach(function (x) { x.classList.toggle("sel", x === b); }); b.parentNode.classList.remove("ko", "okk"); return; }
    if (b.dataset.trier) { var it4 = item(b.dataset.trier), r4 = R(it4.id); r4.sel = r4.sel || {}; r4.sel[b.dataset.e] = b.dataset.c; sauver(); b.parentNode.querySelectorAll(".opt").forEach(function (x) { x.classList.toggle("sel", x === b); }); b.parentNode.classList.remove("ko", "okk"); return; }
    if (b.dataset.ordre) { var it5 = item(b.dataset.ordre), r5 = R(it5.id); r5.sel = r5.sel || []; r5.sel.push(+b.dataset.e); sauver(); return afficherItem(it5); }
    if (b.dataset.ordreRetire) { var it6 = item(b.dataset.ordreRetire), r6 = R(it6.id); r6.sel = (r6.sel || []).filter(function (x) { return x !== +b.dataset.e; }); sauver(); return afficherItem(it6); }
    if (b.dataset.valider) return valider(item(b.dataset.valider), b);
    if (b.dataset.passer) { var it7 = item(b.dataset.passer); R(it7.id).passe = true; sauver(); afficherItem(it7); retour(it7, "indice", "Question passée : tu pourras y revenir avant le coffre."); return; }
    if (b.dataset.roue != null) { var k = +b.dataset.roue; roues[k] = (roues[k] + (+b.dataset.d) + 10) % 10; var rb = $("roue-" + k); rb.textContent = roues[k]; rb.classList.remove("tourne", "rouge", "vert"); void rb.offsetWidth; rb.classList.add("tourne"); return; }
    if (b.id === "b-recopier") { SALLES.forEach(function (s, si) { roues[si] = salleFinie(si) ? s.cle : 0; $("roue-" + si).textContent = roues[si]; }); return; }
    if (b.id === "b-ouvrir") return ouvrirCoffre();

  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "in-code") entrerCode();
    if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.cocher) { e.preventDefault(); e.target.click(); }
  });

  function entrerCode() {
    if (estFerme()) return afficher();
    var code = ($("in-code").value || "").trim().toUpperCase(), z = $("r-code"), A = window.ANNUAIRE || null, classe = null;
    if (code === "ESSAI") classe = "ESSAI"; else if (A && A[code]) classe = A[code];
    if (!classe) { z.className = "retour indice"; z.textContent = !A ? "Patiente quelques secondes (connexion en cours), puis appuie de nouveau sur « Entrer »." : "Ce code n'est pas reconnu. Vérifie ton code (4 caractères) ou demande à ton professeur."; return; }
    var ancien = null; try { ancien = JSON.parse(localStorage.getItem(cle(code)) || "null"); } catch (x) {}
    P = (ancien && !ancien.envoye) ? ancien : { code: code, classe: classe, chemin: null, ecran: "situation", rep: {}, debut: new Date().toISOString() };
    document.body.classList.toggle("chemin-vert", P.chemin === "vert");
    sauver(); afficher();
    if (P.ecran === "fin" && !P.envoye) envoyer();
  }

  $("a-stop").addEventListener("click", arreter);
  $("stop-lecture").addEventListener("click", arreter);
  if (!synth) $("a-stop").hidden = true;
  var ZOOMS = [0.9, 1, 1.15, 1.3, 1.5, 1.75, 2], zi = 1, LUMS = [0.6, 0.75, 0.9, 1, 1.15, 1.3, 1.45], li = 3, nb = false;
  try { var pa = JSON.parse(localStorage.getItem("mapse_escape_b4_affichage") || "null"); if (pa) { zi = pa.zi | 0; li = pa.li | 0; nb = !!pa.nb; if (pa.sombre) document.documentElement.classList.add("sombre"); } } catch (e) {}
  function appliquer() {
    var r = document.documentElement; zi = Math.min(ZOOMS.length - 1, Math.max(0, zi)); li = Math.min(LUMS.length - 1, Math.max(0, li));
    r.style.setProperty("--zoom", ZOOMS[zi]); r.style.setProperty("--lum", LUMS[li]); r.style.setProperty("--gris", nb ? 1 : 0);
    var s = r.classList.contains("sombre"); $("a-sombre").textContent = s ? "☀️" : "🌙"; $("a-nb").classList.toggle("actif", nb); $("a-nb").setAttribute("aria-pressed", nb ? "true" : "false");
    try { localStorage.setItem("mapse_escape_b4_affichage", JSON.stringify({ zi: zi, li: li, nb: nb, sombre: s })); } catch (e) {}
  }
  $("a-moins").addEventListener("click", function () { zi--; appliquer(); });
  $("a-plus").addEventListener("click", function () { zi++; appliquer(); });
  $("a-sombre").addEventListener("click", function () { document.documentElement.classList.toggle("sombre"); appliquer(); });
  $("a-nb").addEventListener("click", function () { nb = !nb; appliquer(); });
  $("a-lum-moins").addEventListener("click", function () { li--; appliquer(); });
  $("a-lum-plus").addEventListener("click", function () { li++; appliquer(); });
  appliquer();
  afficher();
})();
</script>
