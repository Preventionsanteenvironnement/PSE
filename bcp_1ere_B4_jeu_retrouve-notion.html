<style>
:root{--fond1:#0F3D36;--fond2:#1D5E50;--clair:#F4F8F5;--encre:#13302A;--doux:#5B7A71;--jaune:#FFD23F;--vrai:#2FBF71;--vrai-f:#16733F;--faux:#FF6B57;--faux-f:#B3261E;--ligne:rgba(255,255,255,.22);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--clair);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:1.08rem;line-height:1.5;
  background:radial-gradient(1200px 600px at 15% -10%,rgba(255,210,63,.13),transparent 60%),radial-gradient(900px 700px at 110% 110%,rgba(120,220,180,.14),transparent 60%),linear-gradient(160deg,var(--fond1),var(--fond2));background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--jaune);outline-offset:3px}
.page{max-width:760px;margin:0 auto;padding:1.4rem 1.1rem 3rem}
header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1.9rem,5.5vw,2.8rem);line-height:1.02;margin:0}
header p{margin:.45rem 0 0;opacity:.85}
.filtres{display:flex;gap:.5rem;overflow-x:auto;padding:1.1rem .1rem .4rem;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.puce{flex:none;border:2px solid var(--ligne);background:rgba(255,255,255,.06);border-radius:999px;padding:.4rem 1rem;font-weight:700;font-size:1rem}
.puce[aria-pressed="true"]{background:var(--clair);color:var(--encre);border-color:var(--clair)}
.stats{display:flex;gap:.6rem;margin:.8rem 0;flex-wrap:wrap;align-items:center}
.stat{background:rgba(255,255,255,.08);border:2px solid var(--ligne);border-radius:14px;padding:.3rem .8rem;display:flex;gap:.4rem;align-items:baseline}
.stat b{font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat small{opacity:.75}
.stat.feu b{color:var(--jaune)}
.compte{margin-left:auto;font-weight:700;opacity:.85}
.piste{height:6px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin-bottom:1rem}
.piste span{display:block;height:100%;background:var(--jaune);transition:width .3s}
.carte{background:linear-gradient(155deg,#FFFFFF,#EEF4F0);color:var(--encre);border-radius:24px;padding:clamp(1.2rem,4vw,2rem);box-shadow:0 30px 60px -20px rgba(0,0,0,.55)}
.carte .qui{font-weight:700;color:var(--doux);font-size:.95rem;display:flex;justify-content:space-between;align-items:center}
.voix{border:0;background:rgba(19,48,42,.08);width:42px;height:42px;border-radius:50%;font-size:1.2rem}
.def{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(1.25rem,3.6vw,1.65rem);line-height:1.3;margin:.6rem 0 1.2rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.opt{border:2px solid #B9C5BE;background:#fff;border-radius:16px;padding:.9rem .7rem;font-weight:700;font-size:1.05rem;min-height:64px}
.opt:hover{border-color:var(--encre)}
.opt:disabled{cursor:default}
.opt.bon{background:#DDF4E7;border-color:var(--vrai-f)}
.opt.mauvais{background:#FFE3DE;border-color:var(--faux-f)}
.fb{margin-top:.9rem;border-radius:14px}
.fb:not(:empty){padding:.7rem .9rem}
.fb.ok{background:#DDF4E7;border-left:6px solid var(--vrai-f)}
.fb.ko{background:#FFE3DE;border-left:6px solid var(--faux-f)}
.continuer{width:100%;height:56px;border-radius:999px;border:0;background:var(--encre);color:var(--clair);font-weight:700;font-size:1.08rem;margin-top:.9rem}
.sec{background:transparent;color:var(--encre);border:2px solid var(--encre)}
.fin h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.9rem;margin:0}
.gros{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:3.6rem;line-height:1;margin:.5rem 0}
.gros small{font-size:.4em;color:var(--doux)}
.fin ul{list-style:none;padding:0}
.fin li{border-left:5px solid var(--faux);padding:.3rem 0 .3rem .8rem;margin-bottom:.6rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:480px){.opts{grid-template-columns:1fr}}

.fil{margin:0 0 .7rem}
.fil a{color:var(--clair);opacity:.85;text-decoration:underline;text-underline-offset:4px;font-size:1rem;padding:.35rem .1rem;display:inline-block}
.fil a:hover{opacity:1}
</style>

<body>
<div class="page">
  <header>
    <h1>Retrouve la notion</h1>
    <p>Lis la définition et trouve le bon mot du lexique — B4 Bac Pro 1re · L'eau et le développement durable</p>
  </header>
  <nav class="fil" aria-label="Fil d'Ariane"><a href="bcp_1ere_B4_jeux.html">← Toutes les révisions B4</a></nav>
  <nav class="filtres" id="filtres" aria-label="Choisir la séance"></nav>
  <div class="stats">
    <div class="stat"><b id="sScore">0</b><small>justes</small></div>
    <div class="stat feu"><b id="sSerie">0</b><small>🔥 série</small></div>
    <div class="stat"><b id="sRecord">0</b><small>🏆 record</small></div>
    <span class="compte" id="sPos"></span>
  </div>
  <div class="piste" aria-hidden="true"><span id="barre"></span></div>
  <main class="carte" id="carte"></main>
  <div class="sr" aria-live="polite" id="annonce"></div>
</div>
<script>
(function(){const S=window.SpeechSynthesisUtterance;if(!S)return;
 const sig=t=>String(t).replace(/\bOMS\b/g,"O M S").replace(/\bDMP\b/g,"D M P").replace(/\bCAP\b/g,"cap").replace(/(\d+),(\d+) €/g,"$1 euros $2").replace(/(\d+) €/g,"$1 euros").replace(/ ?m³/g," mètres cubes").replace(/ ?mg\/L/g," milligrammes par litre").replace(/ ?µg\/L/g," microgrammes par litre").replace(/ ?°f\b/g," degrés français").replace(/(\d) L\b/g,"$1 litres").replace(/\bONU\b/g,"O N U").replace(/\bOFB\b/g,"O F B").replace(/\bARS\b/g,"A R S").replace(/\bWC\b/g,"W C");
 window.SpeechSynthesisUtterance=function(t){return new S(sig(t))};})();

/* ===== LEXIQUE — v = notions voisines (distracteurs proches) ===== */
const NOTIONS=[{"n": "Eau douce", "s": 1, "d": "Eau non salée : 2,5 % de toute l'eau de la Terre.", "v": ["Eau salée", "Eau potable", "Eau brute"]}, {"n": "Eau salée", "s": 1, "d": "Eau qui représente 97,5 % de toute l'eau de la Terre.", "v": ["Eau douce", "Eau usée", "Eaux souterraines"]}, {"n": "Eaux souterraines", "s": 1, "d": "Eaux du sous-sol, qui représentent 30,1 % de l'eau douce.", "v": ["Eaux de surface", "Eau salée", "Eau usée"]}, {"n": "Stress hydrique", "s": 1, "d": "Situation où les ressources en eau disponibles sont inférieures à la demande en eau.", "v": ["Pénurie", "Pollution", "Eutrophisation"]}, {"n": "Pénurie", "s": 1, "d": "Situation où l'eau disponible ne couvre plus les besoins ; selon l'ONU, sous 1 000 m³ par personne et par an.", "v": ["Stress hydrique", "Restriction", "Pollution"]}, {"n": "Ressource locale", "s": 1, "d": "Eau disponible dans une région : rivières, nappes, pluies.", "v": ["Ressource mondiale", "Consommation directe", "Eau virtuelle"]}, {"n": "Ressource mondiale", "s": 1, "d": "Eau disponible sur la planète, mal répartie entre les continents.", "v": ["Ressource locale", "Empreinte eau", "Eau salée"]}, {"n": "Nappe", "s": 1, "d": "Réserve d'eau souterraine qui alimente la maison d'Aurélie et Guillaume.", "v": ["Château d'eau", "Station d'épuration", "Égout"]}, {"n": "Circuit urbain de l'eau", "s": 2, "d": "Parcours de l'eau : captage, potabilisation, stockage, distribution, collecte, dépollution, rejet.", "v": ["Empreinte eau", "Potabilisation", "Ressource locale"]}, {"n": "Eau brute", "s": 2, "d": "Eau prélevée, le plus souvent non naturellement potable.", "v": ["Eau potable", "Eau usée", "Eau virtuelle"]}, {"n": "Eau potable", "s": 2, "d": "Eau qui peut être consommée sans porter atteinte à la santé, à court ou long terme.", "v": ["Eau brute", "Eau douce", "Eau usée"]}, {"n": "Potabilisation", "s": 2, "d": "Traitement de l'eau brute, par clarification puis désinfection.", "v": ["Épuration", "Dépollution", "Distribution"]}, {"n": "Clarification", "s": 2, "d": "Étape du traitement qui retient les particules et matières en suspension.", "v": ["Désinfection", "Épuration", "Collecte"]}, {"n": "Désinfection", "s": 2, "d": "Étape du traitement qui élimine tous les germes pathogènes.", "v": ["Clarification", "Dépollution", "Captage"]}, {"n": "Eau usée", "s": 2, "d": "Eau salie après usage, collectée par les égouts.", "v": ["Eau brute", "Eau potable", "Eau salée"]}, {"n": "Dépollution", "s": 2, "d": "Retrait des déchets et des polluants des eaux usées.", "v": ["Potabilisation", "Désinfection", "Collecte"]}, {"n": "Épuration", "s": 2, "d": "Traitement des eaux usées en station avant leur rejet.", "v": ["Potabilisation", "Clarification", "Distribution"]}, {"n": "Pollution", "s": 2, "d": "Présence dans l'eau de micro-organismes, de particules ou de produits chimiques.", "v": ["Eutrophisation", "Stress hydrique", "Pénurie"]}, {"n": "Contamination microbiologique", "s": 2, "d": "Présence dans l'eau de bactéries, de parasites ou de virus pathogènes.", "v": ["Eutrophisation", "Clarification", "Filtration complémentaire"]}, {"n": "Eutrophisation", "s": 2, "d": "Ensemble des symptômes d'un écosystème aquatique après un apport excessif de nutriments.", "v": ["Contamination microbiologique", "Épuration", "Potabilisation"]}, {"n": "Filtration complémentaire", "s": 2, "d": "Traitement mis en œuvre quand l'eau brute contient trop de nitrates.", "v": ["Désinfection", "Clarification", "Dépollution"]}, {"n": "Consommation directe", "s": 3, "d": "Eau utilisée par le consommateur lui-même : 143 litres par habitant et par jour en moyenne.", "v": ["Consommation indirecte", "Empreinte eau", "Eau virtuelle"]}, {"n": "Consommation indirecte", "s": 3, "d": "Eau utilisée pour produire les biens que l'on achète.", "v": ["Consommation directe", "Ressource locale", "Prélèvement"]}, {"n": "Eau virtuelle", "s": 3, "d": "Eau cachée dans les aliments, les vêtements et les objets.", "v": ["Eau brute", "Eau usée", "Consommation directe"]}, {"n": "Empreinte eau", "s": 3, "d": "Quantité d'eau douce consommée ou polluée pour produire les biens et services que l'on utilise.", "v": ["Eau virtuelle", "Consommation directe", "Rendement"]}, {"n": "Mesure individuelle", "s": 3, "d": "Geste de chacun pour économiser l'eau.", "v": ["Mesure collective", "Restriction", "Redevance"]}, {"n": "Mesure collective", "s": 3, "d": "Décision de l'État, du préfet ou de la commune pour préserver l'eau.", "v": ["Mesure individuelle", "Consommation directe", "Empreinte eau"]}, {"n": "Principe pollueur-payeur", "s": 3, "d": "Principe selon lequel les frais de lutte contre la pollution sont supportés par le pollueur.", "v": ["Patrimoine commun", "Redevance", "Restriction"]}, {"n": "Redevance", "s": 3, "d": "Somme versée à l'agence de l'eau, qui finance la réduction de la pollution et la gestion durable de l'eau.", "v": ["Restriction", "Rendement", "Prélèvement"]}, {"n": "Restriction", "s": 3, "d": "Mesure qui limite les usages ou les prélèvements d'eau en cas de sécheresse.", "v": ["Redevance", "Pénurie", "Mesure individuelle"]}];
const $=id=>document.getElementById(id);
function annoncer(t){$("annonce").textContent=t}
const CLE="notion-BCPB4";let pref={record:0};
try{pref=Object.assign(pref,JSON.parse(localStorage.getItem(CLE)||"{}"))}catch(e){}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(pref))}catch(e){}}
function melanger(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let seance=0,paquet,pos,score,serie,erreurs,premier,resolu;

function filtres(){
  $("filtres").innerHTML=[[0,"Tout le module"],[1,"Séance 1"],[2,"Séance 2"],[3,"Séance 3"]].map(([v,t])=>`<button class="puce" data-s="${v}" aria-pressed="${v===seance}">${t}</button>`).join("");
  $("filtres").querySelectorAll(".puce").forEach(b=>b.onclick=()=>{seance=+b.dataset.s;filtres();demarrer()});
}
function stats(){$("sScore").textContent=score;$("sSerie").textContent=serie;$("sRecord").textContent=pref.record;$("sPos").textContent=pos<paquet.length?`${pos+1} / ${paquet.length}`:"";$("barre").style.width=(pos/paquet.length*100)+"%"}
function demarrer(liste){
  paquet=liste||melanger(NOTIONS.filter(x=>!seance||x.s===seance)).slice(0,seance?99:12);
  pos=0;score=0;serie=0;erreurs=[];question();
}
function question(){
  if(pos>=paquet.length){fin();return}
  const N=paquet[pos];resolu=false;premier=true;
  const opts=melanger([N.n,...N.v]);
  $("carte").innerHTML=`<div class="qui"><span>Quelle notion correspond à cette définition ?</span><button class="voix" id="bVoix" aria-label="Écouter la définition">🔊</button></div>
    <p class="def">${N.d}</p>
    <div class="opts">${opts.map(o=>`<button class="opt" data-n="${o}">${o}</button>`).join("")}</div>
    <div class="fb" id="fb" role="status" aria-live="polite"></div><div id="suite"></div>`;
  $("bVoix").onclick=()=>lire(N.d);
  $("carte").querySelectorAll(".opt").forEach(b=>b.onclick=()=>repondre(b,N));
  stats();annoncer(`Définition : ${N.d}`);
}
function repondre(b,N){
  if(resolu)return;
  if(b.dataset.n===N.n){
    resolu=true;b.classList.add("bon");$("carte").querySelectorAll(".opt").forEach(x=>x.disabled=true);
    if(premier){score++;serie++;if(serie>pref.record){pref.record=serie;sauver()}}
    const f=$("fb");f.className="fb ok";f.innerHTML=`<b>✓ ${premier?"Bravo !":"Oui, c'est ça."}</b> ${N.n}.`;
    const c=document.createElement("button");c.className="continuer";c.textContent=pos<paquet.length-1?"Définition suivante":"Voir mon résultat";
    c.onclick=()=>{pos++;question()};$("suite").appendChild(c);c.focus({preventScroll:true});stats();
  }else{
    if(premier){premier=false;serie=0;erreurs.push(N);if(navigator.vibrate)navigator.vibrate(50)}
    b.classList.add("mauvais");b.disabled=true;
    const faux=NOTIONS.find(x=>x.n===b.dataset.n);
    const f=$("fb");f.className="fb ko";f.innerHTML=`<b>Pas tout à fait.</b> ${faux?`« ${faux.n} », c'est : ${faux.d.charAt(0).toLowerCase()+faux.d.slice(1)}`:""} Réessaie.`;
    stats();
  }
}
function fin(){
  stats();
  $("carte").innerHTML=`<div class="fin"><h2>${score===paquet.length?"Sans faute !":"Série terminée"}</h2>
    <div class="gros">${score}<small> / ${paquet.length}</small></div>
    <p>🏆 Record de série : <b>${pref.record}</b></p>
    ${erreurs.length?`<p><b>À revoir :</b></p><ul>${erreurs.map(x=>`<li><b>${x.n}</b> — ${x.d}</li>`).join("")}</ul>`:""}
    ${erreurs.length?`<button class="continuer" id="bErr">Rejouer mes ${erreurs.length} erreur${erreurs.length>1?"s":""}</button>`:""}
    <button class="continuer ${erreurs.length?"sec":""}" id="bRej">Nouvelle série</button></div>`;
  if($("bErr")){const e=erreurs.slice();$("bErr").onclick=()=>demarrer(melanger(e))}
  $("bRej").onclick=()=>demarrer();
}
let voix=null;
function choisirVoix(){const l=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));voix=l.find(x=>/fr-FR/i.test(x.lang)&&/(google|natural|online|amélie|thomas|denise|henri)/i.test(x.name))||l.find(x=>/fr-FR/i.test(x.lang))||l[0]||null}
if("speechSynthesis" in window){choisirVoix();speechSynthesis.onvoiceschanged=choisirVoix}
function lire(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voix)u.voice=voix;u.rate=.95;speechSynthesis.speak(u)}
filtres();demarrer();
</script>
</body>
