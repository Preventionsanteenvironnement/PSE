<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'enquête d'Inès — La démarche de prévention · C3 · CAP · PSE</title>
<meta name="description" content="Touche un passage de la situation pour l'analyser avec le QQOQCP, puis l'ITaMaMi — C3 CAP · La démarche de prévention">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--fond1:#0F3D36;--fond2:#1D5E50;--clair:#F4F8F5;--encre:#13302A;--doux:#5B7A71;--jaune:#FFD23F;--vrai:#2FBF71;--vrai-f:#16733F;--faux:#FF6B57;--faux-f:#B3261E;--ligne:rgba(255,255,255,.22);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--clair);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:1.08rem;line-height:1.5;
  background:radial-gradient(1200px 600px at 15% -10%,rgba(255,210,63,.13),transparent 60%),radial-gradient(900px 700px at 110% 110%,rgba(120,220,180,.14),transparent 60%),linear-gradient(160deg,var(--fond1),var(--fond2));background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--jaune);outline-offset:3px}
.page{max-width:980px;margin:0 auto;padding:1.4rem 1.1rem 3rem}
header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(2rem,6vw,3rem);line-height:1;margin:0}
header p{margin:.45rem 0 0;opacity:.85;max-width:64ch}
.phases{display:flex;gap:.5rem;flex-wrap:wrap;margin:1.1rem 0}
.phase{border:2px solid var(--ligne);border-radius:999px;padding:.35rem .9rem;font-weight:700;font-size:.95rem;opacity:.6}
.phase.ici{opacity:1;border-color:var(--jaune);color:var(--jaune)}
.phase.fait{opacity:1;background:rgba(47,191,113,.2)}
.jeu{display:grid;gap:1rem}
@media (min-width:900px){.jeu{grid-template-columns:1fr 320px;align-items:start}.panneau{position:sticky;top:1rem}}
.texte{background:#fff;color:#1B1F1D;border-radius:18px;padding:clamp(1rem,3vw,1.6rem);box-shadow:0 30px 60px -25px rgba(0,0,0,.6);font-size:1.12rem;line-height:1.9}
.texte h2{font-size:1rem;margin:0 0 .6rem;color:#5B6660}
.texte p{margin:0 0 .9rem}
.texte p.eteint{opacity:.45}
.seg{display:inline;border:0;background:none;padding:.1rem .1rem;margin:0;font:inherit;color:inherit;text-align:left;line-height:inherit;border-bottom:2px dotted #9AA59F;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:#FFF4C2}
.seg[aria-pressed="true"]{background:#FFE58A;box-shadow:0 0 0 2px #E0A800}
.seg.trouve{border-bottom:0;cursor:default}
.seg.neutre{border-bottom:0;background:#EEF1EF;color:#6B7570;cursor:default}
.seg .tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:0 .45rem;margin-left:.3rem;vertical-align:middle;color:#10231C;line-height:1.5}
.panneau{background:var(--clair);color:var(--encre);border-radius:22px;padding:1.1rem 1.2rem;box-shadow:0 30px 60px -25px rgba(0,0,0,.6)}
.panneau h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.3rem;margin:0 0 .3rem;line-height:1.15}
.consigne{margin:0 0 .6rem;color:var(--doux);font-weight:700;font-size:.98rem}
.compteur{font-weight:700;margin:.4rem 0 .8rem}
.choix{display:grid;gap:.4rem}
.choix button{text-align:left;border:2px solid #B9C5BE;background:#fff;border-radius:12px;padding:.55rem .75rem;font-weight:700;display:flex;gap:.5rem;align-items:center}
.choix button:hover{border-color:var(--encre)}
.choix button:disabled{opacity:.4;cursor:default}
.pastille{width:14px;height:14px;border-radius:4px;flex:none}
.cite{background:#FFF4C2;border-radius:10px;padding:.5rem .7rem;margin:0 0 .7rem;font-style:italic}
.fb{margin-top:.7rem;border-radius:12px}
.fb:not(:empty){padding:.6rem .8rem}
.fb.ok{background:#DDF4E7;border-left:6px solid var(--vrai-f)}
.fb.ko{background:#FFE3DE;border-left:6px solid var(--faux-f)}
.continuer{width:100%;height:54px;border-radius:999px;border:0;background:var(--encre);color:var(--clair);font-weight:700;font-size:1.05rem;margin-top:.9rem}
.bilan ul{list-style:none;padding:0;margin:.6rem 0}
.bilan li{display:flex;gap:.5rem;align-items:flex-start;margin-bottom:.35rem}
.etoiles{font-size:2.1rem;color:#E0A800;letter-spacing:.15rem}
.retenir{border:3px solid var(--encre);border-radius:14px;padding:.7rem .9rem;margin-top:.8rem;font-size:.98rem}
.retenir b{display:block;font-family:Fraunces,Georgia,serif}
.aideSoi{margin-top:1.6rem;font-size:.95rem;opacity:.85}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.fil{margin:0 0 .7rem}
.fil a{color:var(--clair);opacity:.85;text-decoration:underline;text-underline-offset:4px;font-size:1rem;padding:.35rem .1rem;display:inline-block}
.fil a:hover{opacity:1}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>L'enquête d'Inès</h1>
    <p>Touche un passage de la situation pour l'analyser avec le QQOQCP, puis l'ITaMaMi — C3 CAP · La démarche de prévention</p>
  </header>
  <nav class="fil" aria-label="Fil d'Ariane"><a href="cap_C3_jeux.html">← Toutes les révisions C3</a></nav>
  <div class="phases" id="phases" aria-hidden="true"></div>
  <div class="jeu">
    <article class="texte" id="texte" aria-label="Situation d'Inès"></article>
    <aside class="panneau" id="panneau" aria-live="polite"></aside>
  </div>
  
  <div class="sr" aria-live="polite" id="annonce"></div>
</div>
<script>
(function(){const S=window.SpeechSynthesisUtterance;if(!S)return;
 const sig=t=>String(t).replace(/\bPAD\b/g,"P A D").replace(/\bEPI\b/g,"E P I").replace(/\bQQOQCP\b/g,"Q Q O Q C P").replace(/ITaMaMi/g,"i ta ma mi");
 window.SpeechSynthesisUtterance=function(t){return new S(sig(t))};})();

/* ===== PHASES : chaque paragraphe de la situation, découpé en passages ===== */
const PHASES=[
 {titre:"1. Le QQOQCP",court:"QQOQCP",consigne:"Retrouve dans la situation la réponse à chaque question du QQOQCP (Doc. 2).",
  cats:{qui:["Qui ?","#7CC4F0"],quoi:["Quoi ?","#FF9F8A"],ou:["Où ?","#6ED39A"],quand:["Quand ?","#FFD23F"],comment:["Comment ?","#C9A2F0"],pq:["Pourquoi ?","#FFB066"]},
  neutre:"Ne répond à aucune question",
  segs:[
   ["Inès, 24 ans, est employée polyvalente depuis quatre mois","qui","Qui ? Inès, 24 ans, employée polyvalente."],
   ["dans la cafétéria d'un centre commercial.","ou","Où ? Dans la cafétéria d'un centre commercial."],
   ["Après le service de midi,","quand","Quand ? Après le service de midi."],
   ["son responsable lui demande de nettoyer la trancheuse à jambon.","quoi","Quoi ? Nettoyer la trancheuse à jambon."],
   ["À côté de la machine est affichée une fiche de poste : elle indique de débrancher la trancheuse, de mettre des gants anti-coupure et de remettre le protège-lame après le nettoyage.",null,"C'est la consigne de sécurité : elle ne répond pas à une question du QQOQCP."],
   ["La cafétéria rouvre à 14 heures","quand","Quand ? Avant la réouverture à 14 heures."],
   ["et Inès est pressée :","pq","Pourquoi fait-elle ainsi ? Parce qu'elle est pressée."],
   ["elle laisse la trancheuse branchée et nettoie la lame avec une éponge, sans gants.","comment","Comment ? Trancheuse branchée, avec une éponge, sans gants."],
   ["Sa collègue Chloé lui dit qu'elle s'est déjà coupée en faisant de même.",null,"C'est un avertissement de Chloé, pas une réponse du QQOQCP."],
   ["Inès se demande à quoi servent vraiment ces consignes et comment nettoyer la trancheuse sans se blesser.",null,"C'est la question que se pose Inès."]
  ],retenir:"Le QQOQCP décrit la situation avant de chercher les risques : qui, quoi, où, quand, comment, pourquoi."},
 {titre:"2. L'ITaMaMi",court:"ITaMaMi",consigne:"Classe chaque passage dans la bonne composante de l'ITaMaMi (Doc. 2).",
  cats:{ind:["Individu","#7CC4F0"],tache:["Tâche","#6ED39A"],act:["Activité","#FF9F8A"],mat:["Matériel","#FFD23F"],mil:["Milieu","#C9A2F0"]},
  neutre:"Aucune composante",
  segs:[
   ["Inès, 24 ans, est employée polyvalente depuis quatre mois","ind","Individu : la personne qui travaille (âge, expérience)."],
   ["dans la cafétéria d'un centre commercial.","mil","Milieu : le lieu."],
   ["Après le service de midi,","mil","Milieu : le moment."],
   ["son responsable lui demande de nettoyer","tache","Tâche : le travail demandé."],
   ["la trancheuse à jambon.","mat","Matériel : la machine utilisée."],
   ["À côté de la machine est affichée une fiche de poste : elle indique de débrancher la trancheuse, de mettre des gants anti-coupure et de remettre le protège-lame après le nettoyage.","tache","Tâche : la fiche de poste précise comment le travail doit être fait."],
   ["La cafétéria rouvre à 14 heures et Inès est pressée :","mil","Milieu : le moment et l'organisation, avec la contrainte de temps."],
   ["elle laisse la trancheuse branchée et nettoie la lame","act","Activité : ce qu'elle fait réellement."],
   ["avec une éponge,","mat","Matériel : l'outil utilisé."],
   ["sans gants.","act","Activité : elle ne porte pas les gants prévus."],
   ["Sa collègue Chloé lui dit qu'elle s'est déjà coupée en faisant de même.",null,"C'est un avertissement, pas une composante de l'activité d'Inès."],
   ["Inès se demande à quoi servent vraiment ces consignes et comment nettoyer la trancheuse sans se blesser.",null,"C'est la question que se pose Inès."]
  ],retenir:"L'ITaMaMi montre l'écart entre la tâche (débrancher, mettre des gants) et l'activité réelle (branchée, sans gants) : cet écart expose Inès à la lame."}
];
const $=id=>document.getElementById(id);
function annoncer(t){$("annonce").textContent=t}
const CLE="enquete-ines-CAPC3";let pref={etoiles:0};
try{pref=Object.assign(pref,JSON.parse(localStorage.getItem(CLE)||"{}"))}catch(e){}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(pref))}catch(e){}}
let ph,etat,sel,err;

function demarrer(){ph=0;err=0;etat=PHASES.map(p=>p.segs.map(()=>null));sel=null;rendre()}
function reste(p){return PHASES[p].segs.filter((s,i)=>s[1]&&etat[p][i]!=="ok").length}
function rendre(){
  $("phases").innerHTML=PHASES.map((p,i)=>`<span class="phase ${i<ph?"fait":i===ph?"ici":""}">${i<ph?"✓ ":""}${p.court}</span>`).join("");
  $("texte").innerHTML=`<h2>Situation — Inès, cafétéria</h2>`+PHASES.map((P,p)=>`<p class="${p!==ph&&ph<PHASES.length?"eteint":""}">${P.segs.map((s,i)=>{
    const e=etat[p][i];
    if(e==="ok"&&s[1]){const c=P.cats[s[1]];return `<span class="seg trouve" style="background:${c[1]}55">${s[0]}<span class="tag" style="background:${c[1]}">${c[0]}</span></span>`}
    if(e==="ok")return `<span class="seg neutre">${s[0]}</span>`;
    if(p!==ph)return `<span>${s[0]}</span>`;
    return `<button class="seg" data-i="${i}" aria-pressed="${sel===i}">${s[0]}</button>`;
  }).join(" ")}</p>`).filter((_,p)=>p===Math.min(ph,PHASES.length-1)).join("");
  $("texte").querySelectorAll("button.seg").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;rendre();$("panneau").querySelector("button")?.focus({preventScroll:true})});
  panneau();
}
function panneau(){
  if(ph>=PHASES.length){bilan();return}
  const P=PHASES[ph],r=reste(ph);
  let h=`<h2>${P.titre}</h2><p class="consigne">${P.consigne}</p><div class="compteur">${r?`🔎 Encore ${r} indice${r>1?"s":""} à trouver`:"✅ Tous les indices sont trouvés !"}</div>`;
  if(sel!==null){
    h+=`<p class="cite">« ${P.segs[sel][0]} »</p><div class="choix">${Object.entries(P.cats).map(([k,c])=>`<button data-k="${k}"><span class="pastille" style="background:${c[1]}"></span>${c[0]}</button>`).join("")}<button data-k="aucun"><span class="pastille" style="background:#D5DBD8"></span>${P.neutre}</button></div>`;
  }else if(r)h+=`<p style="margin:0">👆 Touche un passage souligné dans le texte.</p>`;
  h+=`<div class="fb" id="fb" role="status"></div>`;
  if(!r)h+=`<div class="retenir"><b>À retenir</b>${P.retenir}</div><button class="continuer" id="bSuite">${ph<PHASES.length-1?"Étape suivante":"Voir le bilan de l'enquête"}</button>`;
  $("panneau").innerHTML=h;
  $("panneau").querySelectorAll(".choix button").forEach(b=>b.onclick=()=>classer(b.dataset.k));
  if($("bSuite"))$("bSuite").onclick=()=>{ph++;sel=null;rendre();scrollTo({top:0,behavior:"smooth"})};
}
function classer(k){
  const P=PHASES[ph],s=P.segs[sel],bon=s[1]||"aucun";
  if(k===bon){
    etat[ph][sel]="ok";const i=sel;sel=null;rendre();
    const f=$("fb");f.className="fb ok";f.innerHTML=`<b>✓ Bien vu.</b> ${s[2]}`;annoncer(s[2]);
  }else{
    err++;const f=$("fb");f.className="fb ko";
    f.innerHTML=k==="aucun"?`<b>Regarde mieux.</b> Ce passage contient bien un indice : relis le document.`:bon==="aucun"?`<b>Pas tout à fait.</b> ${s[2]}`:`<b>Pas cette famille.</b> Relis le document et compare avec les exemples de chaque famille.`;
    $("panneau").querySelector(`.choix button[data-k="${k}"]`).disabled=true;
    if(bon==="aucun"){etat[ph][sel]="ok";const t=s[2];sel=null;rendre();const g=$("fb");g.className="fb ko";g.innerHTML=`<b>Attention.</b> ${t}`}
  }
}
function bilan(){
  const et=err<=2?3:err<=6?2:1;pref.etoiles=Math.max(pref.etoiles,et);sauver();
  const c=PHASES[0].cats;
  $("panneau").innerHTML=`<div class="bilan"><h2>Enquête terminée</h2>
    <div class="etoiles" aria-label="${et} étoiles sur 3">${"★".repeat(et)}<span style="opacity:.25">${"★".repeat(3-et)}</span></div>
    <p style="margin:0">${err} erreur${err>1?"s":""} de classement.</p>
    <p style="margin:.7rem 0 0"><b>Les six questions du QQOQCP :</b></p>
    <ul>${Object.values(c).map(x=>`<li><span class="pastille" style="background:${x[1]};margin-top:.3rem"></span>${x[0]}</li>`).join("")}</ul>
    <div class="retenir"><b>Conclusion de l'enquête</b>Inès est pressée : son activité réelle (trancheuse branchée, sans gants) s'écarte de sa tâche (respecter la fiche de poste). Cet écart l'expose à la lame. Prochaine étape : construire son PAD.</div>
    <button class="continuer" id="bRec">Refaire l'enquête</button></div>`;
  $("bRec").onclick=demarrer;
}
demarrer();
</script>
</body>
</html>
