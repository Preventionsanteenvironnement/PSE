uis le réveil. Le sommeil lent profond occupe donc le plus de temps au début de la nuit, le sommeil paradoxal occupe le plus de temps à la fin de la nuit. Encadré : un cycle dure environ 90 minutes ; les cycles se suivent toute la nuit, sans que le dormeur s'en aperçoive.", "img_w": 1800, "img_h": 940, "image_pos": "haut"}}, {"id": "a2_s2_q1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 3 :", "reponse_attendue": "", "explication": ""}}, {"id": "a2_s2_q1_1", "type": "sous_question", "data": {"competence": "C1", "numero": "1.1", "texte": "**Relever** la durée d'un cycle de sommeil.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Environ 90 minutes.", "explication": "", "variantes": {"adapte": {}, "essentiel": {"texte": "**Identifier** la durée d'un cycle de sommeil en cochant la proposition exacte.\n☐ 30 minutes\n☐ 90 minutes\n☐ 24 heures", "lignes": 0, "reponse_attendue": "90 minutes"}}}, "el": {"standard": {"indice": "DOC. 3 : la durée d'un cycle est rappelée dans l'encadré, sous le graphique.", "explication": "Une nuit est faite de cycles qui se suivent. Chaque cycle dure environ 90 minutes, soit une heure et demie, et enchaîne toujours les mêmes phases."}, "adapte": {"indice": "La durée est écrite dans l'encadré, sous le graphique.", "explication": "Une nuit est faite de cycles qui se suivent. Chaque cycle dure environ 90 minutes, soit une heure et demie, et enchaîne toujours les mêmes phases."}, "essentiel": {"indice": "DOC. 3 : la durée d'un cycle est rappelée dans l'encadré, sous le graphique.", "explication": "Une nuit est faite de cycles qui se suivent. Chaque cycle dure environ 90 minutes, soit une heure et demie, et enchaîne toujours les mêmes phases.", "choix_corrects": [1]}}}, {"id": "a2_s2_q1_2", "type": "sous_question", "data": {"competence": "C1", "numero": "1.2", "texte": "**Calculer** le nombre de cycles complets dans une nuit de cinq heures.", "points": "", "lignes": 2, "style_lignes": "", "support_type": "calcul", "reponse_attendue": "Calcul : 300 ÷ 90 = 3,3.\nRésultat : 3 cycles complets.", "explication": "", "variantes": {"adapte": {}, "essentiel": {"texte": "**Calculer** le nombre de cycles complets dans une nuit de cinq heures : 300 ÷ 90 = 3,3, soit ……… cycles complets.", "lignes": 0, "reponse_attendue": "3"}}}, "el": {"standard": {"indice": "Convertir d'abord les cinq heures en minutes, puis diviser par la durée d'un cycle ; seuls les cycles entiers comptent.", "explication": "Cinq heures font 300 minutes. 300 ÷ 90 = 3,3 : Noah ne termine donc que 3 cycles complets, au lieu des 5 cycles d'une nuit de 7 h 30. Les derniers cycles de la nuit sont perdus."}, "adapte": {"indice": "Convertir d'abord les cinq heures en minutes, puis diviser par la durée d'un cycle.", "explication": "Cinq heures font 300 minutes. 300 ÷ 90 = 3,3 : Noah ne termine donc que 3 cycles complets, au lieu des 5 cycles d'une nuit de 7 h 30. Les derniers cycles de la nuit sont perdus."}, "essentiel": {"indice": "Convertir d'abord les cinq heures en minutes, puis diviser par la durée d'un cycle ; seuls les cycles entiers comptent.", "explication": "Cinq heures font 300 minutes. 300 ÷ 90 = 3,3 : Noah ne termine donc que 3 cycles complets, au lieu des 5 cycles d'une nuit de 7 h 30. Les derniers cycles de la nuit sont perdus.", "trous": ["3"]}}}, {"id": "a2_s2_q1_3", "type": "sous_question", "data": {"competence": "C1", "numero": "1.3", "texte": "**Indiquer** la phase du sommeil qui occupe le plus de temps au début, puis à la fin de la nuit.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Au début de la nuit : le sommeil lent profond.\n– À la fin de la nuit : le sommeil paradoxal.", "explication": "", "lignes_par_reponse": 1, "variantes": {"adapte": {}, "essentiel": {"texte": "**Identifier** la phase qui occupe le plus de temps à chaque moment de la nuit, en cochant deux propositions.\nAu début de la nuit : ☐ le sommeil lent profond ☐ le sommeil paradoxal\nÀ la fin de la nuit : ☐ le sommeil lent profond ☐ le sommeil paradoxal", "lignes": 0, "style_lignes": "", "reponse_attendue": "Au début de la nuit : le sommeil lent profond.\nÀ la fin de la nuit : le sommeil paradoxal."}}}, "el": {"standard": {"indice": "DOC. 3 : comparer la longueur des plages de sommeil lent profond, en bas du graphique, et celle des plages de sommeil paradoxal, en haut, dans le 1er puis dans le 5e cycle.", "explication": "Au début de la nuit, le sommeil lent profond occupe le plus de temps : 50 puis 45 minutes dans les deux premiers cycles. À la fin de la nuit, c'est le sommeil paradoxal qui domine : 40 puis 55 minutes dans les deux derniers cycles."}, "adapte": {"indice": "Comparer la longueur des traits du 1er cycle et celle du 5e cycle.", "explication": "Au début de la nuit, le sommeil lent profond occupe le plus de temps : 50 puis 45 minutes dans les deux premiers cycles. À la fin de la nuit, c'est le sommeil paradoxal qui domine : 40 puis 55 minutes dans les deux derniers cycles."}, "essentiel": {"indice": "DOC. 3 : comparer la longueur des plages de sommeil lent profond, en bas du graphique, et celle des plages de sommeil paradoxal, en haut, dans le 1er puis dans le 5e cycle.", "explication": "Au début de la nuit, le sommeil lent profond occupe le plus de temps : 50 puis 45 minutes dans les deux premiers cycles. À la fin de la nuit, c'est le sommeil paradoxal qui domine : 40 puis 55 minutes dans les deux derniers cycles.", "choix_corrects": [0, 3]}}}, {"id": "a2_s2_doc4", "type": "document_image", "data": {"label": "DOC. 4", "titre": "Les rôles du sommeil", "cadre": true, "source": "D'après Inserm, dossier Sommeil.", "img": "bcp_2nde_A2/images/a2_doc4_roles_du_sommeil.png", "img_desc": "Planche « Les rôles du sommeil ». Un cycle de sommeil est une suite de phases qui se succèdent toujours dans le même ordre ; chaque phase joue un rôle différent. Première phase, sommeil lent léger : le corps se détend, la respiration et les battements du cœur ralentissent, les bruits réveillent encore facilement le dormeur ; cette phase conduit au sommeil lent profond. Deuxième phase, sommeil lent profond : récupération physique ; le corps récupère de la fatigue de la journée, l'organisme se répare et renforce ses défenses, les muscles sont relâchés et il est difficile de réveiller le dormeur. Troisième phase, sommeil paradoxal : récupération mentale ; le cerveau trie et mémorise ce qui a été appris, la respiration et les battements du cœur sont irréguliers, c'est la phase pendant laquelle surviennent les rêves. Après la dernière phase, un nouveau cycle commence : un sommeil récupérateur suppose donc que les cycles puissent aller jusqu'au bout, les uns après les autres.", "img_w": 1800, "img_h": 940, "image_pos": "haut"}}, {"id": "a2_s2_q2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir des documents 3 et 4 :", "reponse_attendue": "", "explication": ""}}, {"id": "a2_s2_q2_1", "type": "relier", "data": {"numero": "2.1", "competence": "C1", "titre": "", "consigne": "**Associer** chaque phase du sommeil à son rôle.", "gauche": ["Le sommeil lent léger", "Le sommeil lent profond", "Le sommeil paradoxal"], "droite": ["La récupération mentale et la mémorisation", "La détente du corps et le passage vers le sommeil profond", "La récupération physique"], "correspondances": [1, 2, 0]}, "el": {"standard": {"indice": "DOC. 4 : chaque phase porte un rôle différent, écrit à côté de son nom ; le sommeil lent léger prépare le passage vers le sommeil profond.", "explication": "Le sommeil lent léger détend le corps et conduit au sommeil lent profond. Le sommeil lent profond assure la récupération physique : le corps se répare et renforce ses défenses. Le sommeil paradoxal assure la récupération mentale : le cerveau trie et mémorise ce qui a été appris."}, "adapte": {"indice": "DOC. 4 : chaque phase porte un rôle différent, écrit à côté de son nom ; le sommeil lent léger prépare le passage vers le sommeil profond.", "explication": "Le sommeil lent léger détend le corps et conduit au sommeil lent profond. Le sommeil lent profond assure la récupération physique : le corps se répare et renforce ses défenses. Le sommeil paradoxal assure la récupération mentale : le cerveau trie et mémorise ce qui a été appris."}, "essentiel": {"indice": "DOC. 4 : chaque phase porte un rôle différent, écrit à côté de son nom ; le sommeil lent léger prépare le passage vers le sommeil profond.", "explication": "Le sommeil lent léger détend le corps et conduit au sommeil lent profond. Le sommeil lent profond assure la récupération physique : le corps se répare et renforce ses défenses. Le sommeil paradoxal assure la récupération mentale : le cerveau trie et mémorise ce qui a été appris."}}}, {"id": "a2_s2_q2_2", "type": "sous_question", "data": {"competence": "C3", "numero": "2.2", "texte": "**Expliquer** pourquoi une nuit de cinq heures réduit surtout la récupération mentale.", "points": "", "lignes": 3, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Une nuit de cinq heures supprime les derniers cycles, où le sommeil paradoxal, qui assure la récupération mentale, est le plus long.", "explication": "", "variantes": {"adapte": {"texte": "**Compléter** l'explication.\nUne nuit de cinq heures supprime les derniers cycles, où le sommeil ……… est le plus long. Or c'est cette phase qui assure la récupération ……… .", "lignes": 0, "reponse_attendue": "paradoxal ; mentale"}, "essentiel": {"texte": "**Identifier** l'explication de la baisse de récupération mentale après une nuit de cinq heures, en cochant une proposition.\n☐ Une nuit de cinq heures supprime les derniers cycles, où le sommeil paradoxal est le plus long.\n☐ Une nuit de cinq heures supprime les premiers cycles, où le sommeil lent profond est le plus long.\n☐ Une nuit de cinq heures ne change rien à la répartition des phases du sommeil.", "lignes": 0, "reponse_attendue": "Une nuit de cinq heures supprime les derniers cycles, où le sommeil paradoxal est le plus long."}}}, "el": {"standard": {"indice": "DOC. 3 et 4 : repérer d'abord la phase la plus longue dans les derniers cycles, puis le rôle de cette phase.", "explication": "Une nuit de cinq heures ne laisse passer que trois cycles. Or le sommeil paradoxal est le plus long dans le quatrième et le cinquième cycle. Comme c'est cette phase qui assure la récupération mentale, c'est elle qui manque le plus."}, "adapte": {"indice": "Regarder quelle phase occupe le plus de temps dans le 4e et le 5e cycle.", "explication": "Une nuit de cinq heures ne laisse passer que trois cycles. Or le sommeil paradoxal est le plus long dans le quatrième et le cinquième cycle. Comme c'est cette phase qui assure la récupération mentale, c'est elle qui manque le plus.", "trous": ["paradoxal", "mentale"]}, "essentiel": {"indice": "DOC. 3 et 4 : repérer d'abord la phase la plus longue dans les derniers cycles, puis le rôle de cette phase.", "explication": "Une nuit de cinq heures ne laisse passer que trois cycles. Or le sommeil paradoxal est le plus long dans le quatrième et le cinquième cycle. Comme c'est cette phase qui assure la récupération mentale, c'est elle qui manque le plus.", "choix_corrects": [0]}}}, {"id": "a2_s2_doc5", "type": "document_image", "data": {"label": "DOC. 5", "titre": "La lumière et la mélatonine", "cadre": true, "source": "D'après Inserm, dossiers Sommeil et Chronobiologie.", "img": "bcp_2nde_A2/images/a2_doc5_lumiere_melatonine.png", "img_desc": "Schéma « La lumière et la mélatonine ». Une chaîne de quatre étapes reliées par des flèches. La lumière : lumière du jour ou lumière d'un écran, même le soir. L'œil : le fond de l'œil perçoit la lumière et prévient le cerveau. L'horloge biologique : située dans le cerveau, elle règle l'heure du sommeil sur 24 heures. La mélatonine : hormone produite par une glande du cerveau. Deux encadrés. Dans l'obscurité : la mélatonine est produite ; le corps se prépare à dormir, la température baisse, l'envie de dormir arrive ; l'endormissement est facilité. À la lumière : la production de mélatonine est freinée ; le corps réagit comme s'il faisait jour, l'envie de dormir n'arrive pas ; l'endormissement est retardé. Deux conséquences connues : regarder un écran tard le soir retarde l'endormissement ; dormir le jour, à la lumière, expose au même effet, le sommeil vient plus difficilement.", "img_w": 1800, "img_h": 940, "image_pos": "haut"}}, {"id": "a2_s2_q3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir du document 5 :", "reponse_attendue": "", "explication": ""}}, {"id": "a2_s2_q3_1", "type": "sous_question", "data": {"competence": "C1", "numero": "3.1", "texte": "**Nommer** l'hormone produite dans l'obscurité.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "La mélatonine.", "explication": "", "variantes": {"adapte": {}, "essentiel": {"texte": "**Identifier** l'hormone produite dans l'obscurité en cochant la proposition exacte.\n☐ L'insuline\n☐ La mélatonine\n☐ L'adrénaline", "lignes": 0, "reponse_attendue": "La mélatonine"}}}, "el": {"standard": {"indice": "DOC. 5 : le nom de l'hormone se lit à la fin de la chaîne, puis dans l'encadré « Dans l'obscurité ».", "explication": "La mélatonine est une hormone produite par une glande du cerveau. Elle est produite dans l'obscurité : la température baisse, l'envie de dormir arrive et l'endormissement est facilité."}, "adapte": {"indice": "Le nom de l'hormone est écrit à la fin de la chaîne.", "explication": "La mélatonine est une hormone produite par une glande du cerveau. Elle est produite dans l'obscurité : la température baisse, l'envie de dormir arrive et l'endormissement est facilité."}, "essentiel": {"indice": "DOC. 5 : le nom de l'hormone se lit à la fin de la chaîne, puis dans l'encadré « Dans l'obscurité ».", "explication": "La mélatonine est une hormone produite par une glande du cerveau. Elle est produite dans l'obscurité : la température baisse, l'envie de dormir arrive et l'endormissement est facilité.", "choix_corrects": [1]}}}, {"id": "a2_s2_q3_2", "type": "sous_question", "data": {"competence": "C1", "numero": "3.2", "texte": "**Relever** l'effet de la lumière sur la production de mélatonine.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "La lumière freine la production de mélatonine.", "explication": "", "variantes": {"adapte": {}, "essentiel": {"texte": "**Identifier** l'effet de la lumière sur la production de mélatonine en cochant la proposition exacte.\n☐ La lumière augmente la production de mélatonine.\n☐ La lumière freine la production de mélatonine.\n☐ La lumière n'a aucun effet sur la production de mélatonine.", "lignes": 0, "reponse_attendue": "La lumière freine la production de mélatonine."}}}, "el": {"standard": {"indice": "DOC. 5 : comparer les deux encadrés, « Dans l'obscurité » et « À la lumière ».", "explication": "À la lumière, la production de mélatonine est freinée : le corps réagit comme s'il faisait jour, l'envie de dormir n'arrive pas et l'endormissement est retardé."}, "adapte": {"indice": "La réponse est écrite dans l'encadré « À la lumière ».", "explication": "À la lumière, la production de mélatonine est freinée : le corps réagit comme s'il faisait jour, l'envie de dormir n'arrive pas et l'endormissement est retardé."}, "essentiel": {"indice": "DOC. 5 : comparer les deux encadrés, « Dans l'obscurité » et « À la lumière ».", "explication": "À la lumière, la production de mélatonine est freinée : le corps réagit comme s'il faisait jour, l'envie de dormir n'arrive pas et l'endormissement est retardé.", "choix_corrects": [1]}}}, {"id": "a2_s2_q3_3", "type": "sous_question", "data": {"competence": "C3", "numero": "3.3", "texte": "**Expliquer** pourquoi Noah s'endort difficilement après avoir consulté son téléphone.", "points": "", "lignes": 3, "style  baisse de la vigilance. Les accidents sont plus nombreux pendant le travail de nuit et sur le trajet du retour. Des troubles digestifs apparaissent. Le temps partagé avec les amis et avec la famille diminue.", "source": "D'après INRS, Travail en horaires atypiques (mis à jour le 02/07/2021) et Inserm, dossier Chronobiologie."}}, {"id": "a2_s3_q1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir des documents 5 et 6 :", "reponse_attendue": "", "explication": ""}}, {"id": "a2_s3_q1_1", "type": "sous_question", "data": {"competence": "C1", "numero": "1.1", "texte": "**Relever** la définition de la désynchronisation.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Les rythmes biologiques et les rythmes sociaux ne coïncident plus.", "explication": "", "variantes": {"adapte": {}, "essentiel": {"texte": "**Identifier** la définition de la désynchronisation en cochant la proposition exacte.\n☐ Les rythmes biologiques et les rythmes sociaux ne coïncident plus.\n☐ Le salarié travaille toujours aux mêmes heures.\n☐ Le salarié dort plus de huit heures par nuit.", "lignes": 0, "reponse_attendue": "Les rythmes biologiques et les rythmes sociaux ne coïncident plus."}}}, "el": {"standard": {"indice": "DOC. 6 : la définition est écrite dans le deuxième paragraphe, juste avant « c'est la désynchronisation ».", "explication": "La désynchronisation est la situation dans laquelle les rythmes biologiques et les rythmes sociaux ne coïncident plus. Le travail de nuit en est la cause la plus fréquente : le salarié reste éveillé quand son organisme prépare le sommeil.", "cherche": [{"bloc": "a2_s3_doc6", "texte": "les rythmes biologiques et les rythmes sociaux ne coïncident plus"}]}, "adapte": {"indice": "La définition est écrite dans le deuxième paragraphe, après les deux points.", "explication": "La désynchronisation est la situation dans laquelle les rythmes biologiques et les rythmes sociaux ne coïncident plus.  tout travail effectué entre 21 heures et 6 heures est du travail de nuit.\n\n**Le travailleur de nuit.** Est travailleur de nuit le salarié qui accomplit, au moins deux fois par semaine, au moins trois heures de travail pendant cette période. La durée quotidienne de son travail ne dépasse pas huit heures.\n\n**Ses protections.** Le travailleur de nuit bénéficie :\n- d'un repos quotidien de onze heures après la période travaillée ;\n- d'un repos compensateur obligatoire, auquel peut s'ajouter une majoration de salaire ;\n- d'une visite d'information et de prévention avant son affectation à un poste de nuit ;\n- d'une priorité pour occuper un poste de jour dans l'entreprise.", "source": "D'après Service-Public, Travail de nuit d'un salarié du secteur privé (page vérifiée le 21/05/2025)."}}, {"id": "a2_s3_q2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 7 :", "reponse_attendue": "", "explication": ""}}, {"id": "a2_s3_q2_1", "type": "sous_question", "data": {"competence": "C2", "numero": "2.1", "texte": "**Vérifier** si Noah remplit les conditions du travailleur de nuit.", "points": "", "lignes": 0, "style_lignes": "", "support_type": "", "reponse_attendue": "Au moins trois heures de travail entre 21 heures et 6 heures, la situation de Noah : Il travaille de 21 h à 5 h, soit huit heures. • Au moins trois heures de travail entre 21 heures et 6 heures, condition remplie : Oui • Au moins deux fois par semaine, la situation de Noah : Il travaille quatre nuits par semaine. • Au moins deux fois par semaine, condition remplie : Oui", "explication": "", "variantes": {"adapte": {"reponse_attendue": "Au moins trois heures de travail entre 21 heures et 6 heures, condition remplie : Oui • Au moins deux fois par semaine, la situation de Noah : Il travaille quatre nuits par semaine. • Au moins deux fois par semaine, condition remplie : Oui"}, "essentiel": {"reponse_attendue": "Au moins trois heures de travail entre 21 heures et 6 heures, condit
