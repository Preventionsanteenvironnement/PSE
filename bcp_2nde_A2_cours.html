isme sont soumises à des rythmes circadiens, c’est-à-dire à des cycles d’environ 24 heures. »\n« Chez les mammifères dont l’humain, cette horloge se trouve dans l’hypothalamus, une région cérébrale de la taille d’une amande située à la base du cerveau, et plus exactement dans deux structures nommées noyaux suprachiasmatiques. […] »\n« L’horloge interne est donc resynchronisée en permanence sur un cycle de 24 heures par des agents extérieurs. »\n« Plusieurs synchroniseurs agissent simultanément. Le plus puissant est la lumière, mais la prise des repas, l’activité physique et la température extérieure jouent aussi un rôle, plus modeste. »", "source": "Inserm, « Chronobiologie », 2026.", "date_consultation": "2026-10-26"}}, {"type": "question_chapeau", "id": "a2_ch2", "data": {"numero": "2", "texte": "À partir du document 1 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "a2_q21", "data": {"competence": "C2", "numero": "2.1", "texte": "**Relever** la durée d’un rythme circadien.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Environ 24 heures.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase.\nUn rythme circadien est un cycle d’environ ……………………… heures.", "lignes": 0, "reponse_allegee": "environ {{24}} heures", "reponse_attendue": "24"}, "essentiel": {"texte": "**Compléter** la phrase.\nMots proposés : 24 – 12.\nUn rythme circadien dure environ ……………………… heures.", "lignes": 0, "reponse_attendue": "24"}}}, "el": {"standard": {"indice": "DOC. 1 : la première phrase, « c’est-à-dire à des cycles d’environ… ».", "explication": "Un rythme circadien est un cycle d’environ 24 heures."}, "adapte": {"indice": "DOC. 1 : la première phrase, après « c’est-à-dire ».", "explication": "Un rythme circadien est un cycle d’environ 24 heures.", "trous": ["24|24 heures|24 h|24h|vingt-quatre"]}, "essentiel": {"indice": "DOC. 1 : la première phrase.", "explication": "Un rythme emble jouer un rôle particulier […]. »\n**Sommeil paradoxal** — « […] de plus en plus de données permettent de lui attribuer un rôle important dans l’acquisition de la mémoire émotionnelle […]. »\n« […] une mauvaise qualité/quantité de sommeil accentue le risque d’irritabilité, de symptômes dépressifs, mais aussi de prise de poids, de diabète de type 2, d’hypertension ou d’infection. »", "source": "Inserm, « Sommeil », 2024.", "date_consultation": "2026-10-26"}}, {"type": "question_chapeau", "id": "a2_ch6", "data": {"numero": "2", "texte": "À partir de la situation de Laurent et du document 6 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "a2_q61", "data": {"competence": "C2", "numero": "2.1", "texte": "**Relever** deux rôles du sommeil.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Récupérer sur le plan physique et mental.\n– Concentration, apprentissage, mémorisation.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** les phrases sur les rôles du sommeil.\n– Le sommeil permet de ……………………… sur le plan physique et mental.\n– Il joue un rôle dans la concentration et la ……………………… .", "lignes": 0, "reponse_allegee": "– {{récupérer}}\n– {{mémorisation}}", "reponse_attendue": "récupérer · mémorisation"}, "essentiel": {"texte": "**Compléter** les phrases sur les rôles du sommeil.\nMots proposés : récupérer – mémorisation – digestion.\n– Le sommeil permet de ……………………… .\n– Il aide la ……………………… .", "lignes": 0, "reponse_attendue": "récupérer · mémorisation"}}, "lignes_par_reponse": 1}, "el": {"standard": {"indice": "DOC. 6 : la première phrase et la deuxième phrase.", "explication": "Le sommeil permet de récupérer sur le plan physique et mental. Il joue aussi un rôle dans la concentration, l’apprentissage et la mémorisation."}, "adapte": {"indice": "DOC. 6 : « Il permet ainsi à l’organisme de… », puis la liste des phénomènes.", "explication": "Le sommeil permet d "}}}, "el": {"standard": {"indice": "Situation : la durée du sommeil de Laurent ; DOC. 6 : la dernière phrase.", "explication": "Laurent ne dort que 5 heures : une mauvaise quantité de sommeil accentue le risque d’irritabilité."}, "adapte": {"indice": "DOC. 6 : la dernière phrase, « une mauvaise qualité/quantité… ».", "explication": "Une mauvaise quantité de sommeil accentue le risque d’irritabilité.", "trous": ["quantité|quantite", "irritabilité|irritabilite"]}, "essentiel": {"indice": "DOC. 6 : la dernière phrase.", "explication": "Une mauvaise quantité de sommeil augmente le risque d’irritabilité.", "trous": ["quantité|quantite", "irritabilité|irritabilite"]}}}, {"type": "analyse", "id": "a2_analyse7", "data": {"titre": "LA LUMIÈRE ET LA MÉLATONINE"}}, {"type": "document_texte_image", "id": "a2_doc7", "data": {"label": "DOC. 7", "titre": "La lumière, l’horloge biologique et la mélatonine", "cadre": true, "corps": "« L’induction du sommeil est sous la dépendance hormonale de la mélatonine. Surnommée l’hormone du sommeil, cette substance est produite en situation d’obscurité par la glande pinéale (ou épiphyse), située à l’arrière de l’hypothalamus. […] Sa synthèse est à l’inverse inhibée lorsque les cellules rétiniennes perçoivent la lumière. »\n« Néanmoins, l’usage tardif d’écrans ou de lumière LED, riches en lumière bleue, stimule ces cellules et retarde l’endormissement. »", "source": "Inserm, « Sommeil », 2024 ; illustration réalisée pour le cours.", "date_consultation": "2026-10-26", "image_w": 1536, "image_h": 1024, "image_pos": "centre", "image_align": "centre", "image_largeur": 100, "image_taille": "pleine", "image_nom": "Deux têtes en coupe. À gauche, « Le soir, devant une lumière vive » : un écran éclaire l’œil ; rétine, horloge biologique, glande pinéale. À droite, « La nuit, dans l’obscurité » : rétine, horloge biologique, glande pinéale et mélatonine libérée.", "img": "bcp_2nde_A2/images/bcp_2nde_A2_a2_doc7.jpg", "img_desc": "Deux têtes en coupe. À gau lusieurs stades", "le sommeil", "plusieurs phases du sommeil", "plusieurs phases", "les stades du sommeil"], "explication": "DOC. 6 : la récupération et les apprentissages ne dépendent pas d’un seul stade ; plusieurs stades du sommeil y contribuent.", "renvoi": "DOC. 6 — Les rôles du sommeil", "renvoi_bloc": "a2_doc6"}, {"accepte": ["La mélatonine", "la mélatonine", "mélatonine", "melatonine", "la melatonine"], "explication": "DOC. 7 : la mélatonine, surnommée l’hormone du sommeil, facilite l’endormissement.", "renvoi": "DOC. 7 — La lumière, l’horloge biologique et la mélatonine", "renvoi_bloc": "a2_doc7"}, {"accepte": ["Le sommeil paradoxal", "le sommeil paradoxal", "sommeil paradoxal", "paradoxal"], "explication": "DOC. 5 : sur l’hypnogramme, le sommeil paradoxal est plus long en fin de nuit.", "renvoi": "DOC. 5 — Une nuit de sommeil", "renvoi_bloc": "a2_doc5"}]}}, {"id": "a2_s3_seance", "type": "seance", "data": {"numero": "3", "titre": "Sommeil, rythmes sociaux et vie professionnelle", "objectif": "Être capable de proposer des mesures d'hygiène du sommeil.", "competences": ["C2", "C3", "C4", "C5"]}}, {"type": "analyse", "id": "a2_analyse8", "data": {"titre": "LE TRAVAIL DE NUIT : CE QUE PRÉVOIT LE CODE DU TRAVAIL"}}, {"type": "document", "id": "a2_doc8", "data": {"label": "DOC. 8", "titre": "Le travail de nuit dans le Code du travail", "cadre": true, "corps": "**Article L. 3122-1** — « Le recours au travail de nuit est exceptionnel. Il prend en compte les impératifs de protection de la santé et de la sécurité des travailleurs et est justifié par la nécessité d'assurer la continuité de l'activité économique ou des services d'utilité sociale. »\n**Article L. 3122-5** — « Le salarié est considéré comme travailleur de nuit dès lors que :\n1° Soit il accomplit, au moins deux fois par semaine, selon son horaire de travail habituel, au moins trois heures de travail de nuit quotidiennes ;\n2° Soit il accomplit, au cours d'une période de référence, un nombre minimal d'heures de travail de nuit […]. »\n**Article L. 3122-20** — « A défaut de convention ou d'accord collectif, tout travail accompli entre 21 heures et 6 heures est considéré comme du travail de nuit […]. »\n**Article L. 3122-11** — « Tout travailleur de nuit bénéficie d'un suivi individuel régulier de son état de santé dans les conditions fixées à l'article L. 4624-1. »\n**Article L. 3122-14** — « Le travailleur de nuit, lorsque son état de santé, constaté par le médecin du travail, l'exige, est transféré à titre définitif ou temporaire sur un poste de jour correspondant à sa qualification et aussi comparable que possible à l'emploi précédemment occupé. […] »\n**Article L. 3131-1** — « Tout salarié bénéficie d’un repos quotidien d’une durée minimale de onze heures consécutives […]. »", "source": "Code du travail, articles L. 3122-1, L. 3122-5, L. 3122-20, L. 3122-11, L. 3122-14 et L. 3131-1 (extraits).", "date_consultation": "2026-10-26"}}, {"type": "question_chapeau", "id": "a2_ch8", "data": {"numero": "1", "texte": "À partir de la situation de Laurent et du document 8 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "a2_q81", "data": {"competence": "C3", "numero": "1.1", "texte": "**Indiquer** les deux conditions du 1° de l’article L. 3122-5 que Laurent remplit pendant ses semaines de nuit.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "– Au moins trois heures de nuit (il en fait 8).\n– Au moins deux fois par semaine (il en fait 5).", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** les conditions remplies par Laurent.\nDe 21 h à 5 h, il travaille au moins ……………………… heures de nuit, au moins ……………………… fois par semaine.", "lignes": 0, "reponse_allegee": "au moins {{trois}} heures de nuit, au moins {{deux}} fois par semaine", "reponse_attendue": "trois · deux"}, "essentiel": {"texte": "**Compléter** les conditions remplies par Laurent.\nMots proposés : trois – deux – dix.\nLaurent fait au moins ……………………… heures de nuit, au moins ……………………… fois par semaine.", "lignes": 0, "reponse_attendue": "trois · deux"}}}, "el": {"standard": {"indice": "DOC. 8 : l’article L. 3122-5, point 1° ; situation : les horaires et le nombre de nuits de la semaine de nuit.", "explication": "Laurent fait au moins trois heures de nuit (il en fait 8, de 21 h à 5 h) et au moins deux fois par semaine (il en fait 5)."}, "adapte": {"indice": "DOC. 8 : l’article L. 3122-5, point 1°.", "explication": "Il travaille au moins trois heures de nuit, au moins deux fois par semaine.", "trous": ["trois|3", "deux|2"]}, "essentiel": {"indice": "DOC. 8 : l’article L. 3122-5.", "explication": "Laurent fait au moins trois heures de nuit, au moins deux fois par semaine.", "trous": ["trois|3", "deux|2"]}}}, {"type": "sous_question", "id": "a2_q82", "data": {"competence": "C2", "numero": "1.2", "texte": "**Relever** deux droits du travailleur de nuit liés à sa santé.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Un suivi individuel régulier de son état de santé.\n– Un transfert sur un poste de jour si son état de santé l’exige.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** les deux droits du travailleur de nuit.\n– Un ……………………… individuel régulier de son état de santé.\n– Un transfert sur un poste de ……………………… si sa santé l’exige.", "lignes": 0, "reponse_allegee": "– un {{suivi}}\n– un poste de {{jour}}", "reponse_attendue": "suivi · jour"}, "essentiel": {"texte": "**Compléter** les deux droits du travailleur de nuit.\nMots proposés : suivi – jour – salaire.\n– Laurent a droit à un ……………………… régulier de sa santé.\n– Si sa santé l’exige, il passe sur un poste de ……………………… .", "lignes": 0, "reponse_attendue": "suivi · jour"}}, "lignes_par_reponse": 1}, "el": {"standard": {"indice": "DOC. 8 : les articles L. 3122-11 et L. 3122-14.", "explication": "Le travailleur de nuit a droit à un suivi individuel régulier de son état de santé, et à un transfert sur un poste de jour si son état de santé l’exige."}, "adapte": {"indice": "DOC. 8 : les articles L. 3122-11 et L. 3122-14.", "explication": "Un suivi individuel régulier de son état de santé ; un transfert sur un poste de jour si sa santé l’exige.", "trous": ["suivi", "jour"]}, "essentiel": {"indice": "DOC. 8 : les articles L. 3122-11 et L. 3122-14.", "explication": "Laurent a droit à un suivi régulier de sa santé ; si sa santé l’exige, il passe sur un poste de jour.", "trous": ["suivi", "jour"]}}}, {"type": "analyse", "id": "a2_analyse9", "data": {"titre": "LES EFFETS DU TRAVAIL DE NUIT ET LA PRÉVENTION"}}, {"type": "document", "id": "a2_doc9", "data": {"label": "DOC. 9", "titre": "Le travail de nuit : effets sur la santé et prévention", "cadre": true, "corps": "**INRS (d’après Anses, 2016)** — Effets avérés : troubles du sommeil ; somnolence ; syndrome métabolique. Effets probables : baisse des capacités de concentration et de mémoire ; anxiété, dépression ; surpoids et obésité ; diabète ; maladies cardiovasculaires ; cancer. Effets possibles : augmentation des lipides dans le sang ; hypertension artérielle ; accident vasculaire cérébral.\n**INRS** — « Le travail de nuit et le travail posté provoquent une somnolence, une baisse de vigilance, des troubles de la concentration et de la mémorisation. Ceci augmente la fréquence et la gravité des accidents du travail notamment les accidents de la route entre le lieu de travail et le domicile. »\n« Le travail posté et le travail de nuit limitent le temps disponible pour les moments de rencontre et de partage. Cela peut impacter la vie familiale ou sociale des travailleurs concernés. »\n**INRS (organisation)** — « L’organisation en 3 x 8 est à éviter car c’est l’organisation du travail qui soumet le plus l’organisme à des états de désynchronisation répétés. » « […] fixez l’heure de début de poste du matin au plus tôt à 6 heures […] »\n**INRS (sommeil)** — « Lors du coucher après un poste de nuit, il faut respecter un rituel de sommeil et avoir des conditions matérielles adéquates (chambre isolée, calme et bien occultée). » « La consommation de caféine doit être limitée (trois tasses au maximum), et peut avoir lieu en début de poste mais pas pendant les dernières 6 heures de travail qui précèdent l’heure du coucher […] »", "source": "D’après INRS, ED 6305 (2026, tableau des effets d’après Anses 2016) ; INRS, ED 6324 (2019) et dossier « Travail en horaires atypiques » (2021).", "date_consultation": "2026-10-26"}}, {"type": "question_chapeau", "id": "a2_ch9", "data": {"numero": "2", "texte": "À partir de la situation de Laurent et du document 9 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "a2_q91", "data": {"competence": "C3", "numero": "2.1", "texte": "**Expliquer** pourquoi Laurent a failli avoir un accident en rentrant chez lui.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Le travail de nuit provoque une somnolence et une baisse de vigilance : le risque d’accident sur le trajet augmente.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** l’explication.\nLe travail de nuit provoque une ……………………… et une baisse de ……………………… : le risque d’accident de la route augmente.", "lignes": 0, "reponse_allegee": "une {{somnolence}} et une baisse de {{vigilance}}", "reponse_attendue": "somnolence · vigilance"}, "essentiel": {"texte": "**Compléter** l’explication.\nMots proposés : somnolence – vigilance – force.\nEn rentrant de nuit, Laurent souffre de ……………………… et d’une baisse de ……………………… .", "lignes": 0, "reponse_attendue": "somnolence · vigilance"}}}, "el": {"standard": {"indice": "DOC. 9 : la phrase de l’INRS sur les accidents de la route entre le lieu de travail et le domicile.", "explication": "Le travail de nuit provoque une somnolence et une baisse de vigilance : le risque d’accident sur le trajet augmente."}, "a il de nuit limite le temps avec la famille : Laurent voit peu ses enfants.", "trous": ["temps", "enfants|enfant"]}}}, {"type": "document", "id": "a2_doc10", "data": {"label": "DOC. 10", "titre": "Le compte professionnel de prévention (C2P)", "cadre": true, "corps": "**Code du travail, article L. 4161-1** — « I.-Constituent des facteurs de risques professionnels au sens du présent titre les facteurs liés à : […] 3° Certains rythmes de travail : a) Travail de nuit dans les conditions fixées aux articles L. 3122-2 à L. 3122-5 ; b) Travail en équipes successives alternantes ; […] »\n**Code du travail, article D. 4163-2** — Travail en équipes successives alternantes « impliquant au minimum une heure de travail entre 24 heures et 5 heures » : seuil de « 30 nuits par an ». Travail de nuit : « Une heure de travail entre 24 heures et 5 heures », « 100 nuits par an ».\n**Le C2P** — À partir de ces seuils, l’exposition du salarié est déclarée par l’employeur et lui permet d’acquérir des points (formation, temps partiel, départ à la retraite anticipé).", "source": "Code du travail, articles L. 4161-1 et D. 4163-2 (extraits) ; d’après service-public.fr.", "date_consultation": "2026-10-26"}}, {"type": "question_chapeau", "id": "a2_ch11", "data": {"numero": "3", "texte": "À partir de la situation de Laurent et du document 10 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "a2_q111", "data": {"competence": "C3", "numero": "3.1", "texte": "**Expliquer** pourquoi Laurent peut acquérir des points sur son compte professionnel de prévention.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Il travaille en équipes successives alternantes : une semaine sur trois de nuit, soit environ 80 nuits par an, au-delà du seuil de 30 nuits : il peut acquérir des points s’il remplit les conditions du C2P.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** l’explication.\nLaurent travaille en équipes
