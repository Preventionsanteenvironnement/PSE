ommeil.", "corps": "Ce graphique est un **modèle simplifié**. Les cycles réels varient d’une personne à l’autre et d’une nuit à l’autre ; on retient environ **90 minutes** par cycle.\n**Exemple à calculer.** Une nuit de cinq heures, avec des cycles de 90 minutes.", "image_taille": "pleine", "img": "bcp_2nde_A2/images/bcp_2nde_A2_a2_s2_doc3.jpg", "img_desc": "Graphique « Une nuit de sommeil de 7 h 30 : exemple simplifié ». Quatre niveaux, de haut en bas : éveil, sommeil paradoxal, sommeil lent léger, sommeil lent profond. Cinq cycles se suivent. Premier cycle : 35 minutes de sommeil lent profond, 10 minutes de sommeil paradoxal. Deuxième cycle : 30 minutes de sommeil lent profond, 15 minutes de sommeil paradoxal. Troisième cycle : 15 minutes de sommeil lent profond, 20 minutes de sommeil paradoxal. Quatrième cycle : 5 minutes de sommeil lent profond, 30 minutes de sommeil paradoxal. Cinquième cycle : pas de sommeil lent profond, 35 minutes de sommeil paradoxal. Le reste de chaque cycle est du sommeil lent léger. Le sommeil lent profond est donc surtout présent dans les premiers cycles, le sommeil paradoxal dans les derniers.", "img_w": 1400, "img_h": 597}}, {"id": "a2_s2_q1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 3 :", "reponse_attendue": ""}}, {"id": "a2_s2_q1_1", "type": "sous_question", "data": {"competence": "C1", "numero": "1.1", "texte": "**Citer** la durée moyenne d’un cycle de sommeil.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "indice": "", "reponse_attendue": "Environ 90 minutes.", "variantes": {"adapte": {"texte": "**Citer** la durée moyenne d’un cycle de sommeil.\nChercher dans le texte placé au-dessus du graphique."}, "essentiel": {"texte": "**Citer** la durée moyenne d’un cycle de sommeil.\nEnviron …………… minutes.", "reponse_attendue": "90", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 3 : le texte placé au-dessus du graphique, le nombre en gras.", "explication": "Un cycle de sommeil dure environ 90 minutes. Les cycles réels varient d’une personne à l’autre et d’une nuit à l’autre."}, "essentiel": {"indice": "DOC. 3 : le nombre en gras, dans le texte.", "explication": "Un cycle de sommeil dure environ 90 minutes.", "trous": ["90|90 minutes|90 min"]}}}, {"id": "a2_s2_q1_2", "type": "sous_question", "data": {"competence": "C1", "numero": "1.2", "texte": "**Calculer** le nombre de cycles complets de la nuit donnée en exemple.", "points": "", "lignes": 2, "style_lignes": "", "support_type": "calcul", "indice": "", "reponse_attendue": "Calcul : 5 heures = 300 minutes ; 300 ÷ 90 ≈ 3,3.\nRésultat : 3 cycles complets.", "variantes": {"adapte": {"texte": "**Calculer** le nombre de cycles complets de la nuit donnée en exemple.\nCalcul : 5 heures = …………… minutes ; …………… ÷ 90 = …………… . Résultat : …………… cycles complets.", "reponse_attendue": "300 ; 300 ; 3,3 ; 3", "lignes": 0}, "essentiel": {"texte": "**Calculer** le nombre de cycles complets de la nuit donnée en exemple.\nCalcul : 5 heures = 300 minutes ; 300 ÷ 90 = …………… . Résultat : …………… cycles complets.", "reponse_attendue": "3,3\n3", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 3 : l’exemple à calculer. Convertir les heures en minutes, puis diviser par la durée d’un cycle.", "explication": "Calcul : 5 heures = 5 × 60 = 300 minutes ; 300 ÷ 90 ≈ 3,3. Résultat : 3 cycles complets. Le quatrième cycle n’est pas terminé."}, "adapte": {"indice": "Une heure dure 60 minutes. Un cycle complet est un cycle terminé.", "explication": "Calcul : 5 heures = 300 minutes ; 300 ÷ 90 ≈ 3,3. Résultat : 3 cycles complets.", "trous": ["300|300 minutes|300 min", "300", "3,3|3.3|3,33|3.33", "3|trois"]}, "essentiel": {"indice": "Une division : 300 minutes partagées en cycles de 90 minutes. Un cycle complet est un cycle terminé.", "explication": "Calcul : 300 ÷ 90 ≈ 3,3. Résultat : 3 cycles complets.", "trous": ["3,3|3.3|3,33|3.33", "3|trois"]}}}, {"id": "a2_s2_q1_3", "type": "sous_question", "data": {"competence": "C1", "numero": "1.3", "texte": "**Indiquer** le stade qui dure le plus longtemps dans le premier cycle, puis dans le dernier cycle, en dehors du sommeil lent léger.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "indice": "", "reponse_attendue": "– Premier cycle : le sommeil lent profond.\n– Dernier cycle : le sommeil paradoxal.", "lignes_par_reponse": 1, "variantes": {"adapte": {"texte": "**Indiquer** le stade qui dure le plus longtemps dans le premier cycle, puis dans le dernier cycle, en dehors du sommeil lent léger.\nComparer la longueur des traits du cycle 1 et celle du cycle 5."}, "essentiel": {"texte": "**Identifier** le stade le plus long de chaque cycle, en dehors du sommeil lent léger, en cochant une proposition par ligne.\nPremier cycle : ☐ le sommeil lent profond ☐ le sommeil paradoxal\nDernier cycle : ☐ le sommeil lent profond ☐ le sommeil paradoxal", "reponse_attendue": "Premier cycle : le sommeil lent profond.\nDernier cycle : le sommeil paradoxal.", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 3 : comparer la longueur des traits du cycle 1 et celle des traits du cycle 5.", "explication": "Premier cycle : le sommeil lent profond, 35 minutes contre 10 minutes de sommeil paradoxal. Dernier cycle : le sommeil paradoxal, 35 minutes, sans sommeil lent profond."}, "essentiel": {"indice": "DOC. 3 : le trait le plus long du cycle 1, puis du cycle 5.", "explication": "Premier cycle : le sommeil lent profond. Dernier cycle : le sommeil paradoxal."}}}, {"id": "a2_s2_doc4", "type": "document", "data": {"label": "DOC. 4", "titre": "Les stades et les rôles du sommeil", "cadre": true, "corps": "1. Une nuit comporte plusieurs cycles ; chaque cycle fait se succéder des **phases du sommeil**, ou stades.\n2. Pendant le **sommeil lent léger**, le réveil reste facile.\n3. Pendant le **sommeil lent profond**, le réveil est difficile ; ce stade est surtout présent en début de nuit.\n4. Pendant le **sommeil paradoxal**, le cerveau est très actif et les muscles sont relâchés ; ce stade s’allonge en fin de nuit.\n5. Ces stades contribuent ensemble à la **récupération physique** (le corps se repose et se répare) et à la **récupération mentale** (la mémoire et les apprentissages se consolident).", "source": "D’après l’Inserm, dossiers Sommeil et Mémoire.", "date_consultation": "2026-10-10"}}, {"id": "a2_s2_q2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 4 :", "reponse_attendue": ""}}, {"id": "a2_s2_q2_1", "type": "relier", "data": {"numero": "2.1", "competence": "C1", "titre": "", "consigne": "**Associer** chaque stade du sommeil à une caractéristique.", "gauche": ["Le sommeil lent léger", "Le sommeil lent profond", "Le sommeil paradoxal"], "droite": ["Le cerveau est très actif et les muscles sont relâchés.", "Le réveil reste assez facile.", "Le réveil est plus difficile ; ce stade est surtout présent en début de nuit."], "correspondances": [1, 2, 0]}, "el": {"standard": {"indice": "DOC. 4 : les points 2, 3 et 4, un stade par point.", "explication": "Sommeil lent léger : le réveil reste assez facile. Sommeil lent profond : le réveil est plus difficile, et ce stade est surtout présent en début de nuit. Sommeil paradoxal : le cerveau est très actif et les muscles sont relâchés."}, "essentiel": {"indice": "DOC. 4 : les points 2, 3 et 4.", "explication": "Léger : réveil facile. Profond : réveil difficile, en début de nuit. Paradoxal : cerveau très actif, muscles relâchés."}}}, {"id": "a2_s2_q2_2", "type": "sous_question", "data": {"competence": "C3", "numero": "2.2", "texte": "**Déduire** les conséquences d’une nuit trop courte sur la récupération et les apprentissages.", "points": "", "lignes": 3, "style_lignes": "tiret_guide", "support_type": "", "indice": "", "reponse_attendue": "Une nuit trop courte réduit le temps passé dans les stades du sommeil : le corps récupère moins bien, la mémoire et les apprentissages se consolident moins bien.", "variantes": {"adapte": {"texte": "**Déduire** les conséquences d’une nuit trop courte sur la récupération et les apprentissages.\nLes stades du sommeil contribuent à la récupération du corps, à la ……… et aux apprentissages. Une nuit trop courte réduit le temps de ……… .", "reponse_attendue": "mémoire ; sommeil", "lignes": 0}, "essentiel": {"texte": "**Déduire** les conséquences d’une nuit trop courte sur la récupération et les apprentissages.\nMots proposés : mémoire – sommeil – repas.\nLes stades du sommeil contribuent à la récupération du corps, à la ……… et aux apprentissages. Une nuit trop courte réduit le temps de ……… .", "reponse_attendue": "mémoire\nsommeil", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 4 : le point 5, les deux récupérations en gras.", "explication": "Une nuit trop courte réduit le temps passé dans les stades du sommeil. Le corps récupère moins bien ; la mémoire et les apprentissages se consolident moins bien."}, "adapte": {"indice": "DOC. 4 : le point 5, la parenthèse sur la récupération mentale.", "explication": "Les stades du sommeil contribuent à la récupération du corps, à la mémoire et aux apprentissages. Une nuit trop courte réduit le temps de sommeil.", "trous": ["mémoire|memoire", "sommeil"]}, "essentiel": {"indice": "DOC. 4 : le point 5.", "explication": "Le sommeil sert au corps, à la mémoire et aux apprentissages. Une nuit trop courte réduit le temps de sommeil.", "trous": ["mémoire|memoire", "sommeil"]}}}, {"id": "a2_s2_doc5", "type": "document_image", "data": {"label": "DOC. 5", "titre": "La lumière, l’horloge biologique et la mélatonine", "cadre": true, "image_nom": "Planche anatomique en deux cadres : la même tête de profil, en coupe. Dans chaque cadre, un trajet fléché va de la rétine, au fond de l’œil, à l’horloge biologique, à la base du cerveau, puis à la glande pinéale, au centre du cerveau. Cadre de gauche, « Le soir, devant une lumière vive » : un écran éclaire l’œil ; la sécrétion de mélatonine est freinée ; « La lumière freine la sécrétion de mélatonine. » Cadre de droite, « La nuit, dans l’obscurité » : la glande pinéale libère de la mélatonine ; « L’obscurité favorise la sécrétion de mélatonine. »", "image_w": 1500, "image_h": 1000, "image_largeur": 85, "source": "D’après l’Inserm, dossier Chronobiologie.", "image_taille": "pleine", "corps": "La **mélatonine** est une hormone sécrétée par une petite glande du cerveau, le soir et la nuit, sous la commande de l’**horloge biologique**. Elle facilite l’endormissement.", "date_consultation": "2026-10-10", "img": "bcp_2nde_A2/images/bcp_2nde_A2_a2_s2_doc5.jpg", "img_desc": "Planche anatomique en deux cadres : la même tête de profil, en coupe. Dans chaque cadre, un trajet fléché va de la rétine, au fond de l’œil, à l’horloge biologique, à la base du cerveau, puis à la glande pinéale, au centre du cerveau. Cadre de gauche, « Le soir, devant une lumière vive » : un écran éclaire l’œil ; la sécrétion de mélatonine est freinée ; « La lumière freine la sécrétion de mélatonine. » Cadre de droite, « La nuit, dans l’obscurité » : la glande pinéale libère de la mélatonine ; « L’obscurité favorise la sécrétion de mélatonine. »", "img_w": 1400, "img_h": 933}}, {"id": "a2_s2_q3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir du document 5 :", "reponse_attendue": ""}}, {"id": "a2_s2_q3_1", "type": "sous_question", "data": {"competence": "C1", "numero": "3.1", "texte": "**Nommer** l’hormone qui facilite l’endormissement.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "indice": "", "reponse_attendue": "La mélatonine.", "variantes": {"adapte": {"texte": "**Nommer** l’hormone qui facilite l’endormissement.\nChercher dans le texte du document."}, "essentiel": {"texte": "**Nommer** l’hormone qui facilite l’endormissement.\nLa …………… .", "reponse_attendue": "mélatonine", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 5 : le texte du document, le premier mot en gras.", "explication": "La mélatonine est l’hormone qui facilite l’endormissement. Une petite glande du cerveau la sécrète le soir et la nuit."}, "essentiel": {"indice": "DOC. 5 : le premier mot en gras du texte.", "explication": "La mélatonine facilite l’endormissement.", "trous": ["mélatonine|melatonine"]}}}, {"id": "a2_s2_q3_2", "type": "sous_question", "data": {"competence": "C1", "numero": "3.2", "texte": "**Relever** l’effet d’une lumière vive, le soir, sur la sécrétion de mélatonine.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "indice": "", "reponse_attendue": "La lumière freine la sécrétion de mélatonine.", "variantes": {"adapte": {"texte": "**Relever** l’effet d’une lumière vive, le soir, sur la sécrétion de mélatonine.\nChercher sous le cadre de gauche de la planche."}, "essentiel": {"texte": "**Relever** l’effet d’une lumière vive, le soir, sur la sécrétion de mélatonine.\nLa lumière …………… la sécrétion de mélatonine.", "reponse_attendue": "freine", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 5 : la phrase écrite sous le cadre de gauche de la planche.", "explication": "La lumière freine la sécrétion de mélatonine. L’obscurité, au contraire, la favorise."}, "essentiel": {"indice": "DOC. 5 : la phrase sous le cadre de gauche.", "explication": "La lumière freine la sécrétion de mélatonine.", "trous": ["freine|frene|ralentit|diminue"]}}}, {"id": "a2_s2_q3_3", "type": "sous_question", "data": {"competence": "C3", "numero": "3.3", "texte": "**Expliquer** pourquoi l’usage d’un écran au lit retarde l’endormissement.", "points": "", "lignes": 3, "style_lignes": "tiret_guide", "support_type": "", "indice": "", "reponse_attendue": "La lumière de l’écran freine la sécrétion de mélatonine, l’hormone qui facilite l’endormissement : l’endormissement est retardé.", "variantes": {"adapte": {"texte": "**Expliquer** pourquoi l’usage d’un écran au lit retarde l’endormissement.\nLa lumière de l’écran freine la sécrétion de ……… , l’hormone qui facilite l’……… .", " , "type": "document", "data": {"label": "DOC. 6", "titre": "Les rythmes sociaux et la désynchronisation", "cadre": true, "corps": "**Les rythmes sociaux.** Les horaires de travail, les heures des repas, les transports, les loisirs et la vie de famille imposent des heures de lever, de coucher et d’activité : ce sont les rythmes sociaux.\n\n**La désynchronisation.** Quand ces horaires s’opposent au rythme circadien, les rythmes biologiques et les rythmes sociaux ne coïncident plus : c’est la désynchronisation. Le travail de nuit en est un exemple : le salarié reste éveillé quand son organisme prépare le sommeil, et il dort le jour, quand son horloge biologique favorise l’éveil, à la lumière et dans le bruit.\n\n**Ce que la désynchronisation produit.** Le sommeil de jour est souvent plus court et morcelé : il manque fréquemment une à deux heures de sommeil par jour. Le salarié ressent une somnolence et une baisse de la vigilance. Les accidents sont plus nombreux pendant le travail de nuit et sur le trajet du retour. Des troubles digestifs peuvent apparaître. Le temps partagé avec les amis et avec la famille diminue.", "source": "D'après INRS, Travail en horaires atypiques, et Inserm, dossier Chronobiologie."}}, {"id": "a2_s3_q1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 6 :", "reponse_attendue": ""}}, {"id": "a2_s3_q1_1", "type": "sous_question", "data": {"competence": "C1", "numero": "1.1", "texte": "**Définir** la désynchronisation.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "indice": "", "reponse_attendue": "Les rythmes biologiques et les rythmes sociaux ne coïncident plus.", "variantes": {"adapte": {"indice": "La définition est écrite dans le deuxième paragraphe, après les deux points.", "texte": "**Définir** la désynchronisation.\nLa définition est écrite dans le deuxième paragraphe, après les deux points."}, "essentiel": {"texte": "**Sélectionner** la définition de la désynchronisation en cochant la proposition exacte.\n☐ Les rythmes biologiques et les rythmes sociaux ne coïncident plus.\n☐ Le salarié travaille toujours aux mêmes heures.\n☐ Le salarié dort plus de huit heures par nuit.", "lignes": 0, "reponse_attendue": "Les rythmes biologiques et les rythmes sociaux ne coïncident plus."}}}, "el": {"standard": {"indice": "DOC. 6 : le deuxième paragraphe, juste avant les deux points.", "explication": "La désynchronisation : les rythmes biologiques et les rythmes sociaux ne coïncident plus. Les horaires s’opposent alors au rythme circadien."}, "essentiel": {"indice": "DOC. 6 : le deuxième paragraphe.", "explication": "Les rythmes biologiques et les rythmes sociaux ne coïncident plus. Les deux autres propositions ne sont pas dans le document."}}}, {"id": "a2_s3_q1_2", "type": "sous_question", "data": {"competence": "C1", "numero": "1.2", "texte": "**Compléter** le tableau des conséquences du travail de nuit.", "points": "", "lignes": 0, "style_lignes": "", "support_type": "", "indice": "", "reponse_attendue": "", "variantes": {"adapte": {"indice": "Les conséquences sont écrites dans le troisième paragraphe.", "texte": "**Compléter** le tableau des conséquences du travail de nuit.\nLes conséquences sont écrites dans le troisième paragraphe."}, "essentiel": {"indice": "Deux cases restent à compléter, une dans la deuxième colonne, une dans la troisième."}}}, "el": {"standard": {"indice": "DOC. 6 : le troisième paragraphe ; chaque conséquence va dans la colonne de la santé, de la vie sociale et familiale, ou du travail.", "explication": "Santé : un sommeil plus court et morcelé, des troubles digestifs. Vie sociale et familiale : moins de temps partagé avec les amis et avec la famille. Travail : une somnolence et une baisse de la vigilance, des accidents plus nombreux."}, "essentiel": {"indice": "DOC. 6 : le troisième paragraphe, la phrase sur le salarié et la dernière phrase.", "explication": "Sur le travail : une somnolence et une baisse de la vigilance. Sur la vie familiale : moins de temps partagé avec la famille."}}}, {"id": "a2_s3_tab_consequences", "type": "tableau", "data": {"titre": "Les conséquences du travail de nuit", "table_preset": "pse", "table_border": "fine", "table_row_height": "compact", "table_student_style": "lines", "table_col_widths": [33, 34, 33], "cells": [[{"type": "prof", "content": "Sur la santé"}, {"type": "prof", "content": "Sur la vie sociale et familiale"}, {"type": "prof", "content": "Sur le travail"}], [{"type": "eleve", "content": "", "reponse": "Un sommeil plus court et morcelé."}, {"type": "eleve", "content": "", "reponse": "Moins de temps partagé avec les amis."}, {"type": "eleve", "content": "", "reponse": "Une somnolence et une baisse de la vigilance."}], [{"type": "eleve", "content": "", "reponse": "Des troubles digestifs."}, {"type": "eleve", "content": "", "reponse": "Moins de temps partagé avec la famille."}, {"type": "eleve", "content": "", "reponse": "Des accidents plus nombreux."}]], "variantes": {"adapte": {"cells": [[{"type": "prof", "content": "Sur la santé"}, {"type": "prof", "content": "Sur la vie sociale et familiale"}, {"type": "prof", "content": "Sur le travail"}], [{"type": "prof", "content": "Un sommeil plus court et morcelé."}, {"type": "eleve", "content": "", "reponse": "Moins de temps partagé avec les amis."}, {"type": "eleve", "content": "", "reponse": "Une somnolence et une baisse de la vigilance."}], [{"type": "eleve", "content": "", "reponse": "Des troubles digestifs."}, {"type": "eleve", "content": "", "reponse": "Moins de temps partagé avec la famille."}, {"type": "prof", "content": "Des accidents plus nombreux."}]]}, "essentiel": {"cells": [[{"type": "prof", "content": "Sur la santé"}, {"type": "prof", "content": "Sur la vie sociale et familiale"}, {"type": "prof", "content": "Sur le travail"}], [{"type": "prof", "content": "Un sommeil plus court et morcelé."}, {"type": "prof", "content": "Moins de temps partagé avec les amis."}, {"type": "eleve", " ous": ["éveil|eveil", "lumière|lumiere"]}, "essentiel": {"indice": "DOC. 6 : la fin du deuxième paragraphe.", "explication": "Le jour, l’horloge biologique favorise l’éveil. La lumière et le bruit gênent le sommeil.", "trous": ["éveil|eveil", "lumière|lumiere"]}}}, {"id": "a2_s3_doc7", "type": "document", "data": {"label": "DOC. 7", "titre": "Le travail de nuit : ce que prévoit la réglementation", "cadre": true, "corps": "**La période de travail de nuit.** À défaut d’accord collectif, tout travail effectué entre 21 heures et 6 heures est du travail de nuit.\n\n**Le travailleur de nuit.** Dans le cas général, est travailleur de nuit le salarié qui accomplit, au moins deux fois par semaine, au moins trois heures de travail pendant cette période. La durée quotidienne de son travail ne dépasse pas, en principe, huit heures.\n\n**Ses protections.** Le travailleur de nuit bénéficie :\n- d’un repos compensateur obligatoire, auquel peut s’ajouter une majoration de salaire ;\n- d’une visite d’information et de prévention avant son affectation à un poste de nuit ;\n- d’une priorité pour occuper un poste de jour disponible dans l’entreprise.\n\nComme tout salarié, il a droit, en principe, à un repos quotidien d’au moins onze heures entre deux journées de travail : c’est du temps sans travail, pas onze heures de sommeil.\n\n**Exemple.** Noah, employé de rayon, travaille de 21 h à 5 h, quatre nuits par semaine, sans accord collectif.", "source": "D'après Service-Public, Travail de nuit d'un salarié du secteur privé."}}, {"id": "a2_s3_q2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir des documents 6 et 7 :", "reponse_attendue": ""}}, {"id": "a2_s3_q2_1", "type": "sous_question", "data": {"competence": "C2", "numero": "2.1", "texte": "**Compléter** le tableau qui compare la situation de Noah aux conditions du travailleur de nuit.", "points": "", "lignes": 0, "style_lignes": "", "support_type": "", "indice": "", "reponse_attendue": "", "variantes": {"adapt ard": {"indice": "DOC. 6 : le troisième paragraphe, la phrase sur le sommeil de jour.", "explication": "Le sommeil de jour est plus court et morcelé. Le repos compensateur laisse du temps pour dormir et récupérer, et préserve la vigilance."}, "adapte": {"indice": "DOC. 6 : « Le sommeil de jour est souvent plus… ».", "explication": "Son sommeil de jour est plus court et morcelé : ce repos lui laisse du temps pour récupérer.", "trous": ["court", "récupérer|recuperer|dormir"]}, "essentiel": {"indice": "DOC. 6 : « Le sommeil de jour est souvent plus… ».", "explication": "Le sommeil de jour est plus court. Le repos compensateur laisse du temps pour récupérer.", "trous": ["court", "récupérer|recuperer"]}}}, {"id": "a2_s3_solutions", "type": "analyse", "data": {"titre": "PROPOSER DES SOLUTIONS"}}, {"id": "a2_s3_doc8", "type": "document", "data": {"label": "DOC. 8", "titre": "Les mesures d'hygiène du sommeil", "cadre": true, "corps": "Pour un sommeil récupérateur, l'Assurance Maladie conseille :\n- se coucher et se lever à heures régulières, même les jours de repos ;\n- ne pas résister aux signes du sommeil : bâillements, paupières lourdes ;\n- dormir volets ou rideaux fermés, dans l'obscurité ;\n- dormir dans une chambre calme et aérée, qui n'est pas chauffée au-delà de 18 à 20 °C ;\n- arrêter les écrans, si possible une heure avant le coucher ;\n- éviter les boissons caféinées dans les heures qui précèdent le coucher ;\n- prendre un repas léger avant de dormir ;\n- pratiquer une activité physique, mais pas dans les heures qui précèdent le coucher.", "source": "D'après ameli.fr, Comment mieux dormir à l'âge adulte ?"}}, {"id": "a2_s3_q3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir du document 8 :", "reponse_attendue": ""}}, {"id": "a2_s3_q3_1", "type": "sous_question", "data": {"competence": "C4", "numero": "3.1", "texte": "**Proposer** trois mesures d’hygiène du sommeil pour une personne qui doit dormir le jour, après une nuit de travail.", "points": "", "lignes": 3, "style_lignes": "tirets_comptage", "support_type": "", "indice": "", "reponse_attendue": "Trois mesures adaptées du document 8, par exemple : obscurité ; chambre calme ; arrêt des écrans avant le coucher. Accepter aussi : horaires réguliers, absence de boisson caféinée avant de dormir, chambre aérée.", "lignes_par_reponse": 1, "variantes": {"adapte": {"texte": "**Proposer** trois mesures d’hygiène du sommeil pour une personne qui doit dormir le jour, après une nuit de travail.\nTrois mesures du document peuvent agir sur la lumière, le bruit et les écrans."}, "essentiel": {"texte": "**Proposer** trois mesures d’hygiène du sommeil pour une personne qui doit dormir le jour, à l’aide des mots proposés.\nMots utiles : calme – obscurité – écrans – horaires réguliers – café.\nMesure 1 : ………………………………………………\nMesure 2 : ………………………………………………\nMesure 3 : ………………………………………………", "reponse_attendue": "Trois mesures parmi : dormir dans l’obscurité ; chambre calme ; arrêter les écrans avant le coucher ; horaires réguliers ; éviter le café avant de dormir.", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 8 : les mesures qui agissent sur la lumière, le bruit et les écrans.", "explication": "Trois mesures adaptées au sommeil de jour, par exemple : dormir volets fermés, dans l’obscurité ; dormir dans une chambre calme ; arrêter les écrans avant de se coucher. Conviennent aussi : des heures régulières, pas de boisson caféinée avant de dormir, une chambre aérée."}, "essentiel": {"indice": "DOC. 8 : une ligne de la liste pour chaque mot utile.", "explication": "Par exemple : dormir dans l’obscurité ; dormir dans une chambre calme ; arrêter les écrans avant de se coucher. Conviennent aussi : garder des horaires réguliers, éviter le café avant de dormir.", "ouvert": true}}}, {"id": "a2_s3_q4", "type": "question_chapeau", "data": {"numero": "4", "texte": "À partir du document 5 de la séance 2 :", "reponse_attendue": ""}}, {"id": "a2_s3_q3_2", "type": "sous_question", "
