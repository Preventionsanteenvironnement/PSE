<script>window.COURS = {"slug": "cap_B4", "classe": "CAP", "retour": "cap_B4.html", "pied": "Module B4 — CAP. Prévention, santé, environnement — M. MECHERI. Sources indiquées sous chaque document.", "version": "1.3", "entete": {"module_code": "B4", "titre": "Le bruit au quotidien", "niveau": "CAP 1re année", "annee": "2026-2027", "thematique": "B — L'individu responsable dans son environnement", "objectif_general": "Être capable de prévenir les risques liés au bruit."}, "blocks": [{"id": "b4_seance1", "type": "seance", "data": {"numero": "1", "titre": "Le son et le bruit", "objectif": "Être capable de caractériser le bruit par son intensité et sa fréquence.", "competences": ["C1", "C2", "C3"]}}, {"id": "b4_situation", "type": "situation", "data": {"source": "", "texte": "Yanis, 22 ans, est employé depuis six mois dans une menuiserie. Dans l’atelier, son exposition au bruit, mesurée sur sa journée de travail de 8 heures, est de 86 dB(A) : son employeur lui a remis un casque antibruit, mais Yanis l’enlève souvent parce qu’il a chaud. Chaque jour, dans le bus, il écoute de la musique avec ses écouteurs pendant une heure, au volume maximal ; l’application de son téléphone indique alors 95 dB(A). Samedi soir, il est allé à un concert et s’est placé tout près des enceintes. Depuis dimanche, il entend un sifflement dans les oreilles et comprend mal ce que disent ses collègues. Il dort mal et se sent fatigué. Mardi, son voisin est venu se plaindre de sa musique, trop forte après 23 heures. Yanis se demande si ses oreilles vont guérir et ce qu’il devrait changer dans ses habitudes.", "image_largeur": 100, "image_taille": "pleine", "img": "cap_B4/images/b4-yanis-situation.jpg", "img_desc": "Deux photos : Yanis, 22 ans, à la scie à format avec lunettes, casque antibruit autour du cou ; Yanis dans le bus avec des écouteurs.", "img_w": 1400, "img_h": 412}}, {"id": "b4_analyse1", "type": "analyse", "data": {"titre": "ANALYSER LA SITUATION"}}, {"id": "b4_ch1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir de la situation de Yanis :", "reponse_attendue": ""}}, {"id": "b4_q11", "type": "sous_question", "data": {"competence": "C2", "numero": "1.1", "texte": "**Identifier** les éléments de la situation en renseignant le tableau.", "points": "", "lignes": 0, "style_lignes": "pointilles", "support_type": "", "reponse_attendue": "", "indice": "", "reponse_allegee": ""}, "el": {"standard": {"indice": "Situation de Yanis : une information pour chaque ligne du tableau (qui, quels bruits, où, quand, quelles conséquences).", "explication": "Toutes les réponses sont dans la situation : Yanis, 22 ans, employé en menuiserie ; les machines de l’atelier, les écouteurs et les enceintes du concert ; l’atelier, le bus, le concert et chez lui ; chaque jour et le samedi soir ; sifflement, audition baissée, mauvais sommeil, fatigue et voisin gêné."}, "essentiel": {"indice": "Situation de Yanis : les bruits de l’atelier, du bus et du concert.", "explication": "Les bruits de Yanis viennent des machines, des écouteurs et des enceintes. Ils reviennent chaque jour, et le samedi soir au concert. Ses troubles : sifflement, audition baissée, sommeil, fatigue, voisin gêné."}}}, {"id": "b4_q11_tab", "type": "tableau", "data": {"titre": "", "cells": [[{"type": "prof", "content": "Les éléments de la situation"}, {"type": "prof", "content": "Réponses"}], [{"type": "prof", "content": "Qui ?"}, {"type": "eleve", "content": "", "reponse": "Yanis, 22 ans, employé en menuiserie"}], [{"type": "prof", "content": "Quoi ? Les sources de bruit"}, {"type": "eleve", "content": "", "reponse": "Machines de l’atelier, écouteurs, enceintes du concert"}], [{"type": "prof", "content": "Où ?"}, {"type": "eleve", "content": "", "reponse": "Atelier, bus, concert, chez lui"}], [{"type": "prof", "content": "Quand ?"}, {"type": "eleve", "content": "", "reponse": "Chaque jour (atelier, bus) ; samedi soir (concert)"}], [{"type": "prof", "content": "Quelles conséquences ?"}, {"type": "eleve", "content": "", "reponse": "Sifflement, audition baissée, mauvais sommeil, fatigue, voisin gêné"}]], "table_preset": "pse", "table_border": "fine", "table_row_height": "large", "table_col_widths": [26, 74], "table_student_style": "lines", "variantes": {"adapte": {"cells": [[{"type": "prof", "content": "Les éléments de la situation"}, {"type": "prof", "content": "Réponses"}], [{"type": "prof", "content": "Qui ?"}, {"type": "prof", "content": "Yanis, 22 ans, employé en menuiserie"}], [{"type": "prof", "content": "Quoi ? Les sources de bruit"}, {"type": "eleve", "content": "", "reponse": "Machines de l’atelier, écouteurs, enceintes du concert"}], [{"type": "prof", "content": "Où ?"}, {"type": "eleve", "content": "", "reponse": "Atelier, bus, concert, chez lui"}], [{"type": "prof", "content": "Quand ?"}, {"type": "eleve", "content": "", "reponse": "Chaque jour (atelier, bus) ; samedi soir (concert)"}], [{"type": "prof", "content": "Quelles conséquences ?"}, {"type": "eleve", "content": "", "reponse": "Sifflement, audition baissée, mauvais sommeil, fatigue, voisin gêné"}]]}, "essentiel": {"table_student_style": "choix", "cells": [[{"type": "prof", "content": "Les éléments de la situation"}, {"type": "prof", "content": "Réponses"}], [{"type": "prof", "content": "Qui ?"}, {"type": "prof", "content": "Yanis, 22 ans, employé en menuiserie"}], [{"type": "prof", "content": "Quoi ? Les sources de bruit"}, {"type": "eleve", "content": "", "options": ["Machines de l’atelier, écouteurs, enceintes du concert", "Voitures de la rue, télévision du voisin"], "reponse": "Machines de l’atelier, écouteurs, enceintes du concert"}], [{"type": "prof", "content": "Où ?"}, {"type": "prof", "content": "Atelier, bus, concert, chez lui"}], [{"type": "prof", "content": "Quand ?"}, {"type": "eleve", "content": "", "options": ["Une seule fois, samedi soir au concert", "Chaque jour (atelier, bus) ; samedi soir (concert)"], "reponse": "Chaque jour (atelier, bus) ; samedi soir (concert)"}], [{"type": "prof", "content": "Quelles conséquences ?"}, {"type": "eleve", "content": "", "options": ["Sifflement, audition baissée, mauvais sommeil, fatigue, voisin gêné", "Mal au dos, mal aux genoux, mal à la tête"], "reponse": "Sifflement, audition baissée, mauvais sommeil, fatigue, voisin gêné"}]]}}}}, {"id": "b4_q12", "type": "qcm", "data": {"competence": "C2", "numero": "1.2", "titre": "", "consigne": "**Identifier** le problème posé dans la situation en cochant la proposition exacte.", "items": [{"question": "Le problème de Yanis est le suivant :", "options": ["Yanis ne sait pas régler les machines de la menuiserie.", "Yanis est exposé à des bruits forts au travail et dans ses loisirs, et il ne sait pas comment protéger son audition.", "Yanis doit changer de logement à cause de son voisin."], "reponse": 1}]}, "el": {"standard": {"indice": "Situation de Yanis : les bruits au travail, la musique, le concert et ce que Yanis se demande à la fin.", "explication": "Yanis est exposé au bruit à l’atelier, dans le bus et au concert, et il a déjà des troubles. Il se demande ce qu’il doit changer : le problème porte sur la protection de son audition, pas sur les machines ni sur son logement."}}}, {"id": "b4_analyse2", "type": "analyse", "data": {"titre": "LE SON ET LE BRUIT"}}, {"id": "b4_doc1", "type": "document_texte_image", "data": {"label": "DOC. 1", "titre": "Le son et le bruit", "corps": "1. Un **son** est une vibration de l’air qui se propage sous la forme d’une **onde sonore**.\n2. On parle de **bruit** lorsqu’un son ou un ensemble de sons est perçu comme **gênant**.\n3. Le décibel pondéré A, noté dB(A), tient compte de la sensibilité de l’oreille humaine. L’oreille perçoit les fréquences de **20 à 20 000 Hz**.", "cadre": true, "image_nom": "Schéma en deux parties, titre : « Le son : une onde sonore ». En haut, de gauche à droite : un haut-parleur, « La source émet le son » ; une flèche en pointillés, « L’onde sonore : l’air vibre et transmet le son » ; une oreille, « L’oreille reçoit le son ». En bas, deux cadres. Cadre 1, « L’intensité » : une onde de faible amplitude, « Faible amplitude = son faible » ; une onde de grande amplitude, « Grande amplitude = son fort » ; « Elle se mesure en décibels : dB(A). » Cadre 2, « La fréquence » : une onde avec peu de vibrations, « Peu de vibrations par seconde = son grave » ; une onde avec beaucoup de vibrations, « Beaucoup de vibrations par seconde = son aigu » ; « Elle se mesure en hertz : Hz. »", "image_w": 1800, "image_h": 940, "image_largeur": 85, "image_fichier": "images/B4_doc1_onde_sonore.png", "source": "D’après l’INRS, Bruit — Définitions.", "source_originale": "INRS, « Bruit — Définitions », https://www.inrs.fr/risques/bruit/definitions.html, mise à jour du 26/10/2022, consulté le 23/09/2026. Schéma dessiné pour le cours.", "date_consultation": "2026-09-23", "img": "cap_B4/images/b4-onde-sonore-2026.png", "img_desc": "Schéma noir et blanc : source, onde sonore, oreille ; amplitude faible/forte = son faible/fort ; peu/beaucoup de vibrations = son grave/aigu ; dB(A) et Hz.", "img_w": 1400, "img_h": 731}}, {"id": "b4_ch2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 1 :", "reponse_attendue": ""}}, {"id": "b4_q21", "type": "relier", "data": {"competence": "C1", "numero": "2.1", "titre": "", "consigne": "**Relier** chaque notion à sa définition.", "gauche": ["Le son", "Le bruit", "L’intensité", "La fréquence"], "droite": ["Un son ou un ensemble de sons perçu comme gênant", "Une vibration de l’air qui se propage sous la forme d’une onde sonore", "Elle indique si le son est grave ou aigu ; elle se mesure en hertz (Hz)", "Elle indique si le son est faible ou fort ; elle se mesure en dB(A)"], "correspondances": [1, 0, 3, 2], "indice": "", "variantes": {"adapte": {"indice": "Chercher chaque notion en gras dans le document « Le son et le bruit »."}, "essentiel": {"indice": "Fort ou faible : l’intensité. Grave ou aigu : la fréquence."}}}, "el": {"standard": {"indice": "DOC. 1 : les mots en gras « son », « bruit », puis le schéma « l’intensité » et « la fréquence ».", "explication": "Le son est une vibration de l’air (onde sonore). Le bruit est un son gênant. L’intensité dit si le son est faible ou fort (dB(A)) ; la fréquence dit s’il est grave ou aigu (Hz)."}}}, {"id": "b4_q22", "type": "sous_question", "data": {"competence": "C1", "numero": "2.2", "texte": "**Indiquer** l’unité de mesure de l’intensité, puis celle de la fréquence.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "Intensité : le décibel pondéré A, dB(A).\nFréquence : le hertz, Hz.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1, "variantes": {"adapte": {"reponse_allegee": "Intensité : le {{décibel}} pondéré A, dB(A).\nFréquence : le {{hertz}}, Hz.", "texte": "**Indiquer** l’unité de mesure de l’intensité, puis celle de la fréquence.\nIntensité : le ……………………… pondéré A, dB(A).\nFréquence : le ………………………, Hz.", "lignes": 0, "reponse_attendue": "décibel\nhertz"}, "essentiel": {"texte": "**Compléter** les deux phrases avec les unités du document.\nL’intensité se mesure en ……………………… .\nLa fréquence se mesure en ……………………… .", "lignes": 0, "style_lignes": "pointilles", "lignes_par_reponse": 1, "reponse_attendue": "dB(A)\nhertz (Hz)"}}}, "el": {"standard": {"indice": "DOC. 1 : la dernière ligne de chaque cadre du schéma, « Elle se mesure en… ».", "explication": "L’intensité se mesure en décibels pondérés A, notés dB(A). La fréquence se mesure en hertz, notés Hz."}, "adapte": {"indice": "DOC. 1 : « Elle se mesure en… » sous l’intensité, puis sous la fréquence.", "explication": "L’intensité : décibel pondéré A, dB(A). La fréquence : hertz, Hz.", "trous": ["décibel|décibels|decibel", "hertz|hz"]}, "essentiel": {"indice": "DOC. 1 : le bas du schéma, sous « L’intensité » et sous « La fréquence ».", "explication": "L’intensité se mesure en dB(A). La fréquence se mesure en hertz (Hz).", "trous": ["dB(A)|décibels|décibel|db|dba", "hertz (Hz)|hertz|Hz"]}}}, {"id": "b4_doc2", "type": "document_image", "data": {"label": "DOC. 2", "titre": "L’échelle des niveaux sonores", "corps": "Le **niveau sonore** est l’intensité d’un bruit mesurée à un endroit donné, en dB(A).", "cadre": true, "image_nom": "Échelle horizontale de 0 à 130 dB(A), en trois zones. De 0 à 80 dB(A), zone blanche : « Pas de risque pour l’audition ». De 80 à 120 dB(A), zone hachurée : « Risque selon la durée ». Au-delà de 120 dB(A), zone foncée : « Douleur ». Repères sous l’échelle : 0 dB(A), seuil d’audibilité : le bruit le plus faible que l’oreille perçoit ; 50 dB(A), conversation habituelle ; 80 dB(A), seuil de nocivité, pour 8 heures par jour ; 102 dB(A), niveau maximal autorisé dans un concert (moyenne sur 15 minutes) ; 120 dB(A), seuil de douleur. Phrase en bas : « Plus le niveau sonore est élevé, plus le bruit est dangereux pour l’oreille. »", "image_w": 1800, "image_h": 940, "image_largeur": 90, "image_fichier": "images/B4_doc2_echelle_niveaux_sonores.png", "source": "D’après l’INRS et le Code de la santé publique, article R. 1336-1.", "source_originale": "INRS, « Bruit — Définitions » (mise à jour du 26/10/2022) ; Légifrance, Code de la santé publique, article R. 1336-1, version en vigueur depuis le 10/08/2017. Consultés le 23/09/2026. Schéma dessiné pour le cours.", "date_consultation": "2026-09-23", "img": "cap_B4/images/b4-echelle-niveaux-sonores-2026.png", "img_desc": "Échelle 0–130 dB(A) : 0 seuil d'audibilité, 50 conversation, 80 seuil de nocivité (8 h/j), 102 maximum en concert (15 min), 120 seuil de douleur ; zones sans risque / risque selon la durée / douleur.", "img_w": 1400, "img_h": 521}}, {"id": "b4_ch3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir du document 2 :", "reponse_attendue": ""}}, {"id": "b4_q31", "type": "sous_question", "data": {"competence": "C1", "numero": "3.1", "texte": "**Compléter** le tableau avec le niveau sonore de chaque seuil.", "points": "", "lignes": 0, "style_lignes": "pointilles", "support_type": "", "reponse_attendue": "", "indice": "", "reponse_allegee": ""}, "el": {"standard": {"indice": "DOC. 2 : les nombres écrits sous l’échelle, en face de chaque seuil.", "explication": "Seuil d’audibilité : 0 dB(A), le bruit le plus faible entendu. Seuil de nocivité : 80 dB(A) pour 8 heures par jour. Seuil de douleur : 120 dB(A)."}}}, {"id": "b4_q31_tab", "type": "tableau", "data": {"titre": "", "cells": [[{"type": "prof", "content": "Le seuil"}, {"type": "prof", "content": "Le niveau sonore"}], [{"type": "prof", "content": "Le seuil d’audibilité"}, {"type": "eleve", "content": "", "reponse": "0 dB(A)"}], [{"type": "prof", "content": "Le seuil de nocivité, pour 8 heures par jour"}, {"type": "eleve", "content": "", "reponse": "80 dB(A)"}], [{"type": "prof", "content": "Le seuil de douleur"}, {"type": "eleve", "content": "", "reponse": "120 dB(A)"}]], "table_preset": "pse", "table_border": "fine", "table_row_height": "large", "table_col_widths": [60, 40], "table_student_style": "lines", "variantes": {"adapte": {"cells": [[{"type": "prof", "content": "Le seuil"}, {"type": "prof", "content": "Le niveau sonore"}], [{"type": "prof", "content": "Le seuil d’audibilité"}, {"type": "prof", "content": "0 dB(A)"}], [{"type": "prof", "content": "Le seuil de nocivité, pour 8 heures par jour"}, {"type": "eleve", "content": "", "reponse": "80 dB(A)"}], [{"type": "prof", "content": "Le seuil de douleur"}, {"type": "eleve", "content": "", "reponse": "120 dB(A)"}]]}, "essentiel": {"table_student_style": "choix", "cells": [[{"type": "prof", "content": "Le seuil"}, {"type": "prof", "content": "Le niveau sonore"}], [{"type": "prof", "content": "Le seuil d’audibilité"}, {"type": "prof", "content": "0 dB(A)"}], [{"type": "prof", "content": "Le seuil de nocivité, pour 8 heures par jour"}, {"type": "eleve", "content": "", "options": ["50 dB(A)", "80 dB(A)"], "reponse": "80 dB(A)"}], [{"type": "prof", "content": "Le seuil de douleur"}, {"type": "eleve", "content": "", "options": ["102 dB(A)", "120 dB(A)"], "reponse": "120 dB(A)"}]]}}}}, {"id": "b4_doc3", "type": "document", "data": {"label": "DOC. 3", "titre": "Le niveau sonore et la durée d’exposition", "cadre": true, "corps": "Le risque pour l’audition dépend de deux grandeurs : le **niveau sonore** et la **durée d’exposition**, c’est-à-dire le temps passé dans le bruit. Le tableau donne la durée d’écoute sans risque pour une semaine. Ces repères de l’OMS concernent l’écoute de musique et les loisirs ; au travail, la réglementation fixe ses propres seuils, calculés sur une journée de 8 heures.", "source": "D’après l’Organisation mondiale de la santé (OMS).", "source_originale": "OMS, « Deafness and hearing loss: Safe listening », questions-réponses du 6 mars 2026, https://www.who.int/news-room/questions-and-answers/item/deafness-and-hearing-loss-safe-listening, consulté le 23/09/2026.", "date_consultation": "2026-09-23"}}, {"id": "b4_doc3_tab", "type": "tableau", "data": {"titre": "", "cells": [[{"type": "prof", "content": "Le niveau sonore"}, {"type": "prof", "content": "La durée d’écoute sans risque, par semaine"}], [{"type": "prof", "content": "80 dB(A)"}, {"type": "prof", "content": "40 heures"}], [{"type": "prof", "content": "85 dB(A)"}, {"type": "prof", "content": "12 heures 30 minutes"}], [{"type": "prof", "content": "90 dB(A)"}, {"type": "prof", "content": "4 heures"}], [{"type": "prof", "content": "95 dB(A)"}, {"type": "prof", "content": "1 heure 15 minutes"}], [{"type": "prof", "content": "100 dB(A)"}, {"type": "prof", "content": "20 minutes"}]], "table_preset": "sobre", "table_border": "fine", "table_row_height": "normal", "table_col_widths": [40, 60]}}, {"id": "b4_ch4", "type": "question_chapeau", "data": {"numero": "4", "texte": "À partir du document 3 :", "reponse_attendue": ""}}, {"id": "b4_q41", "type": "sous_question", "data": {"competence": "C1", "numero": "4.1", "texte": "**Relever** la durée d’écoute sans risque, par semaine, à 90 dB(A).", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "4 heures.", "indice": "", "reponse_allegee": "", "variantes": {}, "niveaux": ["standard", "adapte"]}, "el": {"standard": {"indice": "DOC. 3 : la ligne « 90 dB(A) » du tableau.", "explication": "À 90 dB(A), le tableau donne 4 heures d’écoute sans risque par semaine."}}}, {"id": "b4_q41_ess", "type": "qcm", "data": {"competence": "C1", "numero": "4.1", "titre": "", "consigne": "**Relever** la durée d’écoute sans risque, par semaine, à 90 dB(A), en cochant la bonne réponse.", "items": [{"question": "À 90 dB(A), la durée d’écoute sans risque par semaine est de :", "options": ["40 heures", "20 minutes", "4 heures"], "reponse": 2}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 3 : la ligne « 90 dB(A) » du tableau.", "explication": "Le tableau donne 4 heures pour 90 dB(A). 40 heures, c’est pour 80 dB(A) ; 20 minutes, pour 100 dB(A)."}}}, {"id": "b4_q42", "type": "sous_question", "data": {"competence": "C3", "numero": "4.2", "texte": "**Établir le lien** entre le niveau sonore et la durée d’écoute sans risque.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Plus le niveau sonore augmente, plus la durée d’écoute sans risque diminue.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"reponse_allegee": "Plus le niveau sonore {{augmente}}, plus la durée d’écoute sans risque {{diminue}}.", "texte": "**Établir le lien** entre le niveau sonore et la durée d’écoute sans risque.\nPlus le niveau sonore ………………………, plus la durée d’écoute sans risque ……………………….", "lignes": 0, "reponse_attendue": "augmente\ndiminue"}}}, "el": {"standard": {"indice": "DOC. 3 : comparer la première et la dernière ligne du tableau.", "explication": "80 dB(A) : 40 heures ; 100 dB(A) : 20 minutes. Plus le son est fort, moins on peut l’écouter longtem se de la concentration.", "source": "D’après l’INRS, Bruit — Effets sur la santé, et l’Inserm.", "source_originale": "INRS, « Bruit — Effets sur la santé », https://www.inrs.fr/risques/bruit/effets-sante.html, mise à jour du 26/10/2022 ; Inserm, dossier « Troubles de l’audition, surdités », 7 novembre 2023. Consultés le 23/09/2026.", "date_consultation": "2026-09-23"}}, {"id": "b4_ch7", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 5 :", "reponse_attendue": ""}}, {"id": "b4_q71", "type": "classer", "data": {"competence": "C1", "numero": "2.1", "titre": "", "consigne": "**Classer** chaque effet du bruit en écrivant sa catégorie dans le tableau.", "categories": ["Effet auditif", "Effet extra-auditif"], "items": ["Les acouphènes", "Les troubles du sommeil", "La surdité", "Le stress", "La fatigue auditive", "La baisse de la concentration"], "classement": [0, 1, 0, 1, 0, 1], "indice": "", "variantes": {"adapte": {"indice": "Un effet auditif touche l’oreille ; un effet extra-auditif touche le reste de l’organisme."}, "essentiel": {"indice": "Un effet auditif touche l’oreille ; un effet extra-auditif touche le reste de l’organisme."}}}, "el": {"standard": {"indice": "DOC. 5 : la partie 1 (effets auditifs) et la partie 2 (effets extra-auditifs).", "explication": "Effets auditifs, sur l’oreille : acouphènes, fatigue auditive, surdité. Effets extra-auditifs, sur le reste du corps : troubles du sommeil, stress, baisse de la concentration."}}}, {"id": "b4_q72", "type": "sous_question", "data": {"competence": "C1", "numero": "2.2", "texte": "**Relever** la condition pour que la fatigue auditive disparaisse.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Le repos, si l’exposition au bruit ne recommence pas.", "indice": "", "reponse_allegee": "", "variantes": {}, "niveaux": ["standard", "adapte"]}, "el": {"standard": {"indice": "DOC. 5 : la phrase sur la fatigue auditive, « Elle disparaît… »  [], "explication": "DOC. 5 : les troubles du sommeil touchent le reste de l’organisme : effet extra-auditif.", "renvoi": "DOC. 5 — Les effets du bruit sur la santé", "renvoi_bloc": "b4_doc5"}, {"accepte": ["auditif"], "explication": "DOC. 4 : le nerf auditif conduit l’influx nerveux jusqu’au cerveau.", "renvoi": "DOC. 4 — Le trajet du son dans l’oreille", "renvoi_bloc": "b4_doc4"}, {"accepte": ["surdité", "une surdité"], "explication": "DOC. 5 : une perte d’audition définitive due au bruit est une surdité.", "renvoi": "DOC. 5 — Les effets du bruit sur la santé", "renvoi_bloc": "b4_doc5"}], "essentiel": [{"accepte": [], "explication": "DOC. 4 : la cochlée, dans l’oreille interne, transforme les vibrations en influx nerveux.", "renvoi": "DOC. 4 — Le trajet du son dans l’oreille", "renvoi_bloc": "b4_doc4"}, {"accepte": [], "explication": "Vrai : les trois osselets sont dans l’oreille moyenne.", "renvoi": "DOC. 4 — Le trajet du son dans l’oreille", "renvoi_bloc": "b4_doc4"}, {"accepte": [], "explication": "DOC. 5 : les troubles du sommeil touchent le reste de l’organisme : effet extra-auditif.", "renvoi": "DOC. 5 — Les effets du bruit sur la santé", "renvoi_bloc": "b4_doc5"}, {"accepte": ["auditif"], "explication": "DOC. 4 : le nerf auditif conduit l’influx nerveux jusqu’au cerveau.", "renvoi": "DOC. 4 — Le trajet du son dans l’oreille", "renvoi_bloc": "b4_doc4"}, {"accepte": ["surdité", "une surdité"], "explication": "DOC. 5 : une perte d’audition définitive due au bruit est une surdité.", "renvoi": "DOC. 5 — Les effets du bruit sur la santé", "renvoi_bloc": "b4_doc5"}]}}, {"id": "b4_seance3", "type": "seance", "data": {"numero": "3", "titre": "La prévention du bruit", "objectif": "Être capable de proposer des mesures de prévention contre le bruit.", "competences": ["C1", "C3", "C4", "C5"]}}, {"id": "b4_analyse7", "type": "analyse", "data": {"titre": "LES CONSÉQUENCES DU BRUIT"}}, {"id": "b4_doc6", "type": "document", "data": {"label": "DOC. 6", "titre": "Les conséquences du bruit sur la vie sociale et professionnelle", "cadre": true, "corps": "1. **Dans la vie sociale** : une personne qui entend mal suit difficilement une conversation et peut s’**isoler** ; la fatigue et l’irritabilité créent des tensions avec l’entourage ; le bruit fait par un voisin provoque des **conflits**.\n2. **Dans la vie professionnelle** : le bruit diminue la **concentration** et augmente la fatigue ; il peut masquer un signal d’alarme et favoriser les **accidents du travail**.", "source": "D’après l’INRS, Bruit — Effets sur la santé.", "source_originale": "INRS, « Bruit — Effets sur la santé », mise à jour du 26/10/2022, consulté le 23/09/2026. Les conséquences sociales (isolement, conflits) sont reformulées d’après les effets décrits par l’INRS et l’Inserm.", "date_consultation": "2026-09-23"}}, {"id": "b4_ch10", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 6 :", "reponse_attendue": ""}}, {"id": "b4_q101", "type": "classer", "data": {"competence": "C1", "numero": "1.1", "titre": "", "consigne": "**Classer** chaque conséquence du bruit en écrivant sa catégorie dans le tableau.", "categories": ["Vie sociale", "Vie professionnelle"], "items": ["L’isolement", "La baisse de la concentration au travail", "Un conflit avec un voisin", "Un accident du travail"], "classement": [0, 1, 0, 1], "indice": "", "variantes": {"adapte": {"indice": "Chercher chaque conséquence dans le paragraphe qui lui correspond."}, "essentiel": {"indice": "Le travail, l’atelier, l’alarme : la vie professionnelle."}}}, "el": {"standard": {"indice": "DOC. 6 : la partie 1 (vie sociale) et la partie 2 (vie professionnelle).", "explication": "Vie sociale : l’isolement, les conflits avec un voisin. Vie professionnelle : la baisse de la concentration au travail, les accidents du travail."}}}, {"id": "b4_analyse8", "type": "analyse", "data": {"titre": "PRÉVENIR LE BRUIT"}}, {"id": "b4_doc7", "type": "document", "data": {"label": "DOC. 7", "titre": "Protéger son audition", "cadre": true, "corps": "1. **Réduire le niveau sonore** : régler le volume des écouteurs à **60 % au plus** du volume maximal ; s’éloigner des enceintes et des machines bruyantes.\n2. **Limiter la durée d’exposition** : écouter moins longtemps et faire des **pauses** pour reposer les oreilles.\n3. **Porter des protecteurs individuels contre le bruit** : les **bouchons d’oreilles** ou le **casque antibruit**. Ils ne protègent que s’ils sont bien mis et portés pendant toute la durée du bruit.\n4. **Surveiller le niveau sonore**, par exemple avec une application.\n5. **Réagir aux symptômes** : après un bruit très fort, si la baisse d’audition ou le sifflement persiste, consulter **en urgence** à l’hôpital.", "source": "D’après l’OMS, l’INRS et l’Assurance Maladie.", "source_originale": "OMS, « Deafness and hearing loss: Safe listening », 6 mars 2026 ; INRS, « Bruit — Réglementation » et « Bruit — Effets sur la santé », mises à jour du 26/10/2022. Consultés le 23/09/2026. Assurance Maladie, « Perte d’acuité auditive : bons réflexes et cas où il faut consulter », https://www.ameli.fr/assure/sante/themes/perte-acuite-auditive/bons-reflexes-cas-faut-consulter, lu le 25/09/2026 : « Consultez en urgence à l’hôpital si […] vous venez d’être exposé à un traumatisme sonore intense et les symptômes de la surdité persistent après l’exposition au bruit ».", "date_consultation": "2026-09-23", "image_largeur": 70, "img": "cap_B4/images/b4-protecteurs.jpg", "img_desc": "Bouchons en mousse et casque antibruit sur un établi ; Yanis porte le casque sur les deux oreilles.", "img_w": 1383, "img_h": 662}}, {"id": "b4_ch11", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 7 :", "reponse_attendue": ""}}, {"id": "b4_q111", "type": "sous_question", "data": {"competence": "C1", "numero": "2.1", "texte": "**Nommer** les deux protecteurs individuels contre le bruit.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "Les bouchons d’oreilles.\nLe casque antibruit.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1, "variantes": {"adapte": {"reponse_allegee": "Les {{bouchons}} d’oreilles.\nLe {{casque}} antibruit.", "texte": "**Nommer** les deux protecteurs individuels contre le bruit.\nLes ……………………… d’oreilles.\nLe ……………………… antibruit.", "lignes": 0, "reponse_attendue": "bouchons\ncasque"}, "essentiel": {"reponse_allegee": "Les {{bouchons}} d’oreilles.\nLe {{casque}} antibruit.", "texte": "**Nommer** les deux protecteurs individuels contre le bruit.\nLes ……………………… d’oreilles.\nLe ……………………… antibruit.", "lignes": 0, "reponse_attendue": "bouchons\ncasque"}}}, "el": {"standard": {"indice": "DOC. 7 : le point 3 et les deux photos.", "explication": "Les deux protecteurs individuels contre le bruit : les bouchons d’oreilles et le casque antibruit."}, "adapte": {"indice": "DOC. 7 : le point 3 et la légende des photos.", "explication": "Les bouchons d’oreilles et le casque antibruit.", "trous": ["bouchons|bouchon", "casque"]}, "essentiel": {"indice": "DOC. 7 : la légende des photos.", "explication": "Les bouchons d’oreilles et le casque antibruit.", "trous": ["bouchons|bouchon", "casque"]}}}, {"id": "b4_q112", "type": "sous_question", "data": {"competence": "C1", "numero": "2.2", "texte": "**Relever** la condition pour qu’un protecteur contre le bruit soit efficace.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Il doit être bien mis et porté pendant toute la durée du bruit.", "indice": "", "reponse_allegee": "", "variantes": {}, "niveaux": ["standard", "adapte"]}, "el": {"standard": {"indice": "DOC. 7 : la dernière phrase du point 3.", "explication": "Un protecteur ne protège que s’il est bien mis et porté pendant toute la durée du bruit : un casque autour du cou ne sert à rien."}}}, {"id": "b4_q112_ess", "type": "qcm", "data": {"competence": "C1", "numero": "2.2", "titre": "", "consigne": "**Relever** la condition pour qu’un protecteur contre le bruit soit efficace, en cochant la bonne réponse.", "items": [{"question": "Un protecteur contre le bruit est efficace si on :", "options": ["le porte seulement quand il fait froid", "le met bien et le porte pendant toute la durée du bruit", "le porte autour du cou"], "reponse": 1}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 7 : la phrase « Ils ne protègent que s’ils sont… ».", "explication": "Bien mis et porté pendant tout le bruit : sinon, il ne protège pas."}}}, {"id": "b4_doc8", "type": "document", "data": {"label": "DOC. 8", "titre": "La réglementation contre le bruit", "cadre": true, "corps": "1. **Au travail**, l’employeur évalue le bruit et le réduit, d’abord à la source.\n– Au-dessus de **80 dB(A)** sur 8 heures, il **met à disposition** des protecteurs individuels contre le bruit et forme les salariés à leur usage.\n– Au-dessus de **85 dB(A)** sur 8 heures, il signale les zones bruyantes, met en place un programme de réduction du bruit et **contrôle le port** des protecteurs.\n2. **Dans les concerts et les discothèques**, le niveau sonore ne doit pas dépasser **102 dB(A)** en moyenne sur 15 minutes. L’organisateur informe le public des risques, met à disposition **gratuitement** des protections auditives et crée des **zones de repos auditif**, où le bruit est plus faible.", "source": "D’après l’INRS et le Code de la santé publique, article R. 1336-1.", "source_originale": "INRS, « Bruit — Réglementation », https://www.inrs.fr/risques/bruit/reglementation.html, mise à jour du 26/10/2022 ; Légifrance, Code de la santé publique, article R. 1336-1 (version du 10/08/2017). Consultés le 23/09/2026. La valeur limite de 87 dB(A) n’est pas citée : elle tient compte de l’atténuation des protecteurs et n’est pas une notion du programme.", "date_consultation": "2026-09-23", "image_largeur": 22, "image_pos": "droite", "img": "cap_B4/images/b4-panneau-protections-auditives.png", "img_desc": "Pictogramme d’obligation bleu (tête avec casque antibruit), dessiné pour le cours.", "img_w": 609, "img_h": 700}}, {"id": "b4_ch12", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir du document 8 :", "reponse_attendue": ""}}, {"id": "b4_q121", "type": "cocher_exactes", "data": {"competence": "C1", "numero": "3.1", "consigne": "**Cocher** les trois obligations de l’organisateur d’un concert.", "items": [{"texte": "Informer le public des risques", "correct": true}, {"texte": "Vendre des bouchons d’oreilles à l’entrée", "correct": false}, {"texte": "Mettre à disposition gratuitement des protections auditives", "correct": true}, {"texte": "Créer des zones de repos auditif", "correct": true}, {"texte": "Interdire l’entrée aux moins de 20 ans", "correct": false}]}, "el": {"standard": {"indice": "DOC. 8 : la partie 2, sur les concerts.", "explication": "L’organisateur informe le public des risques, met à disposition gratuitement des protections et crée des zones de repos auditif. Les bouchons ne sont pas vendus, et le document ne parle pas d’âge."}}}, {"id": "b4_q122", "type": "sous_question", "data": {"competence": "C3", "numero": "3.2", "texte": "**Indiquer l’intérêt** des zones de repos auditif pour le public d’un concert.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Une pause au calme : moins de temps d’exposition au bruit fort.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"reponse_allegee": "Elles permettent de faire une {{pause}} : la {{durée d’exposition}} au bruit fort diminue, et les oreilles se reposent.", "texte": "**Indiquer l’intérêt** des zones de repos auditif pour le public d’un concert.\nElles permettent de faire une ……………………… : la ……………………… au bruit fort diminue, et les oreilles se reposent.", "lignes": 0, "reponse_attendue": "pause\ndurée d’exposition"}}}, "el": {"standard": {"indice": "DOC. 8 : « où le bruit est plus faible » ; DOC. 3 : le rôle de la durée.", "explication": "Dans une zone de repos auditif, le bruit est plus faible : le public fait une pause, passe moins de temps au bruit fort, et les oreilles se reposent."}, "adapte": {"indice": "DOC. 8 : la fin de la partie 2.", "explication": "Une pause au calme réduit la durée d’exposition au bruit fort.", "trous": ["pause|coupure", "duree d'exposition|duree|duree d exposition"]}}}, {"id": "b4_q122_ess", "type": "qcm", "data": {"competence": "C3", "numero": "3.2", "titre": "", "consigne": "**Cocher** l’intérêt des zones de repos auditif.", "items": [{"question": "Les zones de repos auditif permettent :", "options": ["d’écouter la musique plus fort", "de diminuer la durée d’exposition au bruit fort", "d’acheter des boissons moins chères"], "reponse": 1}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 8 : « où le bruit est plus faible ».", "explication": "Une zone plus calme permet de passer moins de temps au bruit fort."}}}, {"id": "b4_doc9", "type": "document", "data": {"label": "DOC. 9", "titre": "Les bruits de voisinage : comportement civique et répression", "cadre": true, "corps": "1. Un bruit de voisinage peut être **sanctionné de jour comme de nuit** lorsqu’il est anormal par son **intensité**, sa **durée** ou sa **répétition**.\n2. Le **comportement civique** consiste à limiter le bruit que l’on fait chez soi : baisser la musique, prévenir ses voisins avant une fête, porter un casque le soir.\n3. En cas de gêne, il est conseillé de parler d’abord au voisin, puis de lui écrire. Un conciliateur de justice peut aider gratuitement.\n4. La **répression** : la police ou la gendarmerie peut constater l’infraction. L’amende forfaitaire est de **68 €** ; elle peut aller jusqu’à 450 €.", "source": "D’après Service-Public, Troubles de voisinage.", "source_originale": "Service-Public, « Troubles de voisinage : bruits créés par des comportements anormaux », https://www.service-public.gouv.fr/particuliers/vosdroits/F612, mis
