<!DOCTYPE html>

<meta charset="UTF-8">

<title>CPS C1.6 — Revenir à l'instant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f4f7fc;color:#1e293b;line-height:1.6;padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.back{display:inline-block;color:#1d4ed8;text-decoration:none;font-weight:800;font-size:1rem;margin-bottom:10px}
.back:hover{text-decoration:underline}
.prog{position:sticky;top:0;z-index:5;background:#f4f7fc;padding:6px 0 10px}
.prog .label{font-size:.78rem;font-weight:800;color:#1e40af;margin-bottom:4px;text-align:center}
.prog .track{height:10px;background:#dbeafe;border-radius:20px;overflow:hidden}
.prog .track > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1d4ed8,#3b82f6);border-radius:20px;transition:width .4s ease}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 3px 14px rgba(0,0,0,.06);animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hero{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border-radius:20px;padding:26px 20px;text-align:center;margin-bottom:6px}
.hero .ic{font-size:3rem;display:block;margin-bottom:6px}
.hero h1{font-size:1.5rem;font-weight:900}
.hero p{opacity:.95;font-size:.96rem;margin-top:6px}
.txt{font-size:1.12rem;font-weight:600;line-height:1.5;margin:6px 0 12px}
.teach{background:#eff6ff;border-left:6px solid #1d4ed8;border-radius:0 12px 12px 0;padding:12px 14px;font-size:1.04rem;margin-bottom:12px}
.q{font-size:1.12rem;font-weight:800;color:#1e40af;margin:6px 0 12px}
.opts{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:14px;border:2px solid #bfdbfe;background:#fff;cursor:pointer;font-family:inherit;font-size:1.05rem;font-weight:700;color:#1e293b;transition:.15s}
.opt.center{text-align:center}
.opt:hover:not(:disabled){border-color:#1d4ed8;background:#eff6ff}
.opt:disabled{cursor:default}
.opt.ok{border-color:#22c55e;background:#dcfce7;color:#166534}
.opt.no{border-color:#fca5a5;background:#fee2e2;color:#991b1b}
.breathwrap{display:flex;flex-direction:column;align-items:center;gap:16px;margin:26px 0 10px}
.breath{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bfdbfe,#1d4ed8);transition:transform 4s ease-in-out;transform:scale(.7);box-shadow:0 6px 24px rgba(29,78,216,.35)}
.breathlabel{font-size:1.4rem;font-weight:900;color:#1e40af;min-height:1.5em}
.sense{text-align:center;padding:8px 0}
.sense .si{font-size:3.4rem;display:block;margin-bottom:8px}
.sense .sp{font-size:1.15rem;font-weight:700}
.fb{margin-top:14px}
.msg{border-radius:14px;padding:13px 15px;font-weight:700;font-size:1rem;animation:fade .3s}
.msg.good{background:#dcfce7;border:2px solid #86efac;color:#166534}
.msg.bad{background:#fff7ed;border:2px solid #fed7aa;color:#9a3412}
.msg.win{background:#dbeafe;border:2px solid #93c5fd;color:#1e40af}
.btn{display:block;width:100%;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border:none;border-radius:14px;padding:15px;font-size:1.1rem;font-weight:800;cursor:pointer;font-family:inherit;margin-top:12px;text-align:center;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.soft{background:#e0e7ff;color:#3730a3}
.say{float:right;background:#eff6ff;color:#1d4ed8;border:none;border-radius:10px;padding:6px 11px;font-size:.95rem;font-weight:800;cursor:pointer}
.recap{list-style:none;margin:10px 0 0}
.recap li{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 13px;margin-bottom:8px;font-size:.98rem}
.badge{text-align:center;font-size:1.1rem;font-weight:900;color:#1e40af;margin:10px 0}
@media(max-width:600px){.wrap{padding:10px}.card{padding:16px}.txt{font-size:1.05rem}.hero h1{font-size:1.3rem}}
.jimg{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:14px;margin:6px 0 10px;background:#fff}
.jimgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
<link rel="stylesheet" href="assets/acces.css?v=5">

<script src="assets/acces.js?v=5" defer></script>

<script>window.goatcounter={path:function(){return location.pathname||"/"}};</script>

</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Accueil</a>
  <div data-cps-moi="retour" data-code="C1.6" data-titre="Être attentif au présent" data-fam="Penser et agir"></div>
  <div class="prog"><div class="label" id="proglabel"></div><div class="track"><i id="progbar"></i></div></div>
  <div id="scene"></div>
  <div id="moi-park" hidden>
    <div id="moi-perso">
      <div data-cps-moi="sequence" data-code="C1.6" data-titre="Être attentif au présent" data-fam="Penser et agir"><script type="application/json">{"tag": "Et moi ?", "title": "Le 3-2-1, maintenant", "steps": [{"kind": "echelle", "q": "Avant l’exercice : ton agitation, à combien ?", "carnet": "Agitation avant le 3-2-1", "bas": "Très calme", "haut": "Très agité(e)"}, {"kind": "info", "q": "Je m’arrête", "img": "assets/cps/cognitif/present-3-2-1.jpg", "alt": "Noa est assis dans une salle de cours, les pieds à plat au sol. Il regarde autour de lui.", "html": "Pose tes pieds à plat. Remarque ta respiration : l’air qui entre, l’air qui sort. <strong>Ne la change pas.</strong> Regarde-la simplement passer."}, {"kind": "info", "q": "Le 3-2-1", "html": "<strong>3</strong> : nomme dans ta tête 3 choses que tu vois.<br><strong>2</strong> : écoute. Nomme 2 sons que tu entends.<br><strong>1</strong> : remarque 1 chose que tu sens : la chaise, tes pieds, le chaud, le froid.<br>Prends ton temps pour chaque chiffre."}, {"kind": "echelle", "q": "Après l’exercice : ton agitation, à combien ?", "carnet": "Agitation après le 3-2-1", "bas": "Très calme", "haut": "Très agité(e)"}, {"kind": "choix", "q": "Où je peux faire cet exercice ?", "carnet": "Où je peux faire le 3-2-1", "multi": true, "autre": true, "opts": ["En classe, avant une évaluation", "Avant un entretien ou un rendez-vous", "En stage ou au travail", "Pendant une pause", "Dans les transports", "Chez moi, le soir"]}], "fin": "L’agitation peut baisser, ou non. Les deux sont normaux. L’exercice s’apprend en le répétant."}</script></div>
    </div>
    <div id="moi-fin">
      <div data-cps-moi="defi" data-code="C1.6" data-titre="Être attentif au présent" data-fam="Penser et agir"><script type="application/json">{"q": "Choisis une seule chose à essayer cette semaine.", "opts": ["Faire le 3-2-1 une fois avant un moment important", "Manger un repas sans écran, en remarquant le goût", "Observer ma respiration une minute, sans la changer"]}</script></div>
      <div data-cps-moi="duo"><script type="application/json">{"duree": "10 minutes", "situation": "En classe, au calme. Chacun reste assis à sa place.", "roleA": "Guide le 3-2-1 lentement, à voix basse : 3 choses vues, 2 sons, 1 sensation.", "roleB": "Fais l’exercice. Nomme à voix haute ce que tu remarques, sans juger.", "observe": ["A laisse du temps entre chaque étape", "B nomme des choses précises", "B décrit sans dire « c’est bien » ou « c’est nul »"]}</script></div>
    </div>
  </div>
</div>
<script src="assets/cps_moi.js?v=20261107"></script>
<script>
(function(){
  var scene=document.getElementById('scene');
  var idx=0;
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function speak(t){ try{ if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,'')); u.lang='fr-FR'; u.rate=0.95; speechSynthesis.speak(u);}catch(e){} }
  function go(i){ idx=i; try{speechSynthesis.cancel();}catch(e){} render(); }
  function progress(){ document.getElementById('progbar').style.width=Math.round(idx/(STEPS.length-1)*100)+'%'; document.getElementById('proglabel').textContent='Étape '+(idx+1)+' / '+STEPS.length; }
  function continueBtn(label){ var b=document.createElement('button'); b.className='btn'; b.textContent=label||'Continuer →'; b.onclick=function(){ go(idx+1); }; return b; }

  var STEPS=[
    { type:'intro', text:"Souvent, on agit sans être vraiment là : on mange sans goûter, on écoute sans entendre. C’est le <strong>« pilote automatique »</strong>. Tu vas t’entraîner à <strong>revenir à l’instant présent</strong>." },

    { type:'notion',
      teach:"Être <strong>au présent</strong>, c’est faire attention à ce que tu fais et ressens <strong>maintenant</strong>. Pas à hier, pas à demain.",
      q:"Être attentif au présent, c’est…",
      options:[
        {l:"penser sans cesse à hier et à demain",ok:false},
        {l:"ne plus penser à rien du tout",ok:false},
        {l:"remarquer ce que je fais et ressens maintenant",ok:true}
      ],
      wrong:"Pas tout à fait. Les pensées continuent. Tu remarques simplement ce qui se passe maintenant.",
      good:"Oui. Tu remarques ce qui se passe ici et maintenant." },

    { type:'sort',
      teach:"Repère la différence : <strong>présent</strong> (attentif à l’instant) ou <strong>pilote automatique</strong> (l’esprit ailleurs).",
      q:"Présent, ou pilote automatique ?",
      items:[
        {l:"Tu manges en regardant ton téléphone, sans sentir le goût.",present:false,ex:"Pilote automatique : tu manges, mais ton esprit est ailleurs."},
        {l:"Sous la douche, tu sens l’eau chaude couler sur tes épaules.",present:true,ex:"Présent : tu remarques ce que tu sens, ici et maintenant."},
        {l:"En cours, tu écris mais tu repenses à ta dispute d’hier.",present:false,ex:"Pilote automatique : ton esprit est resté dans le passé."},
        {l:"Tu écoutes vraiment un ami, sans penser à ta réponse.",present:true,ex:"Présent : ton attention est là, avec lui."}
      ] },

    { type:'senses',
      title:"Observer ma respiration",
      intro:"Tu ne changes rien. Tu <strong>regardes</strong> ta respiration comme elle est, puis tu valides.",
      items:[
        {si:"",sp:"Laisse ta respiration comme elle est. Ne la force pas."},
        {si:"",sp:"Remarque où tu sens l’air : le nez, la poitrine ou le ventre."},
        {si:"",sp:"Compte trois respirations, sans les ralentir ni les accélérer."}
      ],
      done:"Rapide, lente, calme ou agitée : tu l’as <strong>observée</strong> telle qu’elle est." },

    { type:'senses',
      title:"L’exercice 3-2-1",
      img:"assets/cps/cognitif/present-3-2-1.jpg",
      alt:"Noa est assis dans une salle de cours, les pieds à plat au sol. Il regarde calmement autour de lui.",
      intro:"D’abord tu t’arrêtes. Puis tu comptes à rebours : 3, 2, 1. Valide chaque étape.",
      items:[
        {si:"",sp:"Arrête-toi. Pose tes pieds à plat au sol."},
        {si:"3",sp:"Nomme 3 choses que tu vois autour de toi."},
        {si:"2",sp:"Écoute. Nomme 2 sons que tu entends."},
        {si:"1",sp:"Remarque 1 sensation dans ton corps : chaud, froid, lourd…"}
      ],
      done:"Te voilà revenu <strong>ici et maintenant</strong>." },

    { type:'notion',
      teach:"Revenir au présent, ce n’est pas fuir. Tu remarques ce qui se passe, et ton attention revient sur ta tâche.",
      q:"Très stressé avant un contrôle, le 3-2-1 t’aide surtout à…",
      options:[
        {l:"oublier complètement le contrôle",ok:false},
        {l:"revenir à ce qui se passe maintenant",ok:true},
        {l:"t’endormir sur la table",ok:false}
      ],
      wrong:"Pas tout à fait. Il ne s’agit pas de fuir ni de dormir, mais de revenir à l’instant.",
      good:"Oui : tu reviens à l’instant, et tu peux te remettre au travail." },

    { type:'perso',
      text:"À toi. Fais le 3-2-1 maintenant, là où tu es. Rien n’est noté." },

    { type:'bilan',
      recap:[
        "Le <strong>« pilote automatique »</strong>, c’est agir sans être vraiment là.",
        "J’<strong>observe</strong> ma respiration comme elle est, sans la changer.",
        "Le <strong>3-2-1</strong> : je m’arrête, puis 3 choses vues, 2 sons, 1 sensation."
      ] }
  ];
  function park(){ var p=document.getElementById('moi-park'); ['moi-perso','moi-fin'].forEach(function(id){ var n=document.getElementById(id); if(p && n && n.parentNode!==p) p.appendChild(n); }); }
  function render(){
    park(); var s=STEPS[idx]; progress(); window.scrollTo({top:0,behavior:'smooth'});

    if(s.type==='intro'){
      scene.innerHTML='<div class="hero"><span class="ic"></span><h1>Revenir à l’instant</h1><p>Compétence C1.6</p></div><div class="card"><p class="txt">'+s.text+'</p></div>';
      var b=document.createElement('button'); b.className='btn'; b.textContent='Commencer'; b.onclick=function(){ go(idx+1); }; scene.querySelector('.card').appendChild(b); return;
    }

    if(s.type==='notion'){
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div class="opts"></div><div class="fb"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach+' '+s.q); };
      var opts=scene.querySelector('.opts'), fb=scene.querySelector('.fb'), done=false;
      shuffle(s.options).forEach(function(o){
        var b=document.createElement('button'); b.className='opt'; b.textContent=o.l;
        b.onclick=function(){
          if(done)return;
          if(o.ok){ done=true; opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); b.classList.add('ok'); fb.innerHTML='<div class="msg good">✓ '+s.good+'</div>'; fb.appendChild(continueBtn()); }
          else { b.classList.add('no'); b.disabled=true; fb.innerHTML='<div class="msg bad">'+s.wrong+' <strong>Réessaie.</strong></div>'; }
        };
        opts.appendChild(b);
      });
      return;
    }

    if(s.type==='sort'){
      var j=0;
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div id="so"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach); };
      var area=scene.querySelector('#so');
      function drawItem(){
        var it=s.items[j];
        area.innerHTML='<p class="txt">'+it.l+'</p><div class="two"><button class="opt center" data-v="1">Présent</button><button class="opt center" data-v="0">Pilote auto</button></div><div class="fb"></div>';
        var fb=area.querySelector('.fb'), answered=false;
        area.querySelectorAll('.opt').forEach(function(b){
          b.onclick=function(){
            if(answered)return; answered=true;
            var said=b.getAttribute('data-v')==='1';
            var ok=(said===it.present);
            area.querySelectorAll('.opt').forEach(function(x){x.disabled=true;});
            b.classList.add(ok?'ok':'no');
            fb.innerHTML='<div class="msg '+(ok?'good':'bad')+'">'+(ok?'✓ ':'')+it.ex+'</div>';
            var nb=document.createElement('button'); nb.className='btn'; nb.textContent=(j>=s.items.length-1)?'Continuer →':'Suivant →';
            nb.onclick=function(){ if(j>=s.items.length-1){ go(idx+1); } else { j++; drawItem(); } };
            fb.appendChild(nb);
          };
        });
      }
      drawItem();
      return;
    }

    if(s.type==='senses'){
      var j=0;
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="q">'+s.title+'</div>'+(s.img?'<img class="jimg" src="'+s.img+'" alt="'+(s.alt||'')+'">':'')+'<p class="txt" style="font-weight:600;font-size:1rem">'+s.intro+'</p><div id="se"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.intro); };
      var area=scene.querySelector('#se');
      function drawSense(){
        var it=s.items[j];
        area.innerHTML='<div class="sense"><span class="si">'+it.si+'</span><div class="sp">'+it.sp+'</div></div><div class="fb"></div>';
        var fb=area.querySelector('.fb');
        var b=document.createElement('button'); b.className='btn'; b.textContent='✓ C’est fait';
        b.onclick=function(){
          if(j>=s.items.length-1){ fb.innerHTML='<div class="msg win">'+s.done+'</div>'; fb.appendChild(continueBtn()); }
          else { j++; drawSense(); }
        };
        fb.appendChild(b);
      }
      drawSense();
      return;
    }

    if(s.type==='perso'){
      scene.innerHTML='<div class="card"><p class="txt">'+s.text+'</p></div>';
      var pc=scene.querySelector('.card'), mp=document.getElementById('moi-perso'); if(mp) pc.appendChild(mp);
      pc.appendChild(continueBtn('Continuer →'));
      return;
    }

    if(s.type==='bilan'){
      var h='<div class="hero"><span class="ic"></span><h1>Bilan</h1><p>Tu sais revenir à l’instant présent.</p></div><div class="card"><p class="txt" style="font-size:1rem;font-weight:800;color:#1e40af">Ce que tu as appris :</p><ul class="recap">';
      s.recap.forEach(function(r){ h+='<li>'+r+'</li>'; });
      h+='</ul></div>';
      scene.innerHTML=h;
      var c=scene.querySelector('.card');
      var mf=document.getElementById('moi-fin'); if(mf) c.appendChild(mf);
      var rb=document.createElement('button'); rb.className='btn'; rb.textContent='Recommencer'; rb.onclick=function(){ go(0); }; c.appendChild(rb);
      var hb=document.createElement('a'); hb.className='btn soft'; hb.href='index.html'; hb.textContent='← Retour à l’accueil'; c.appendChild(hb);
      return;
    }
  }
  render();
})();
</script>
</body>
</html>
