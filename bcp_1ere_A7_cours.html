ins nutritionnels en restant végétarienne, malgré ses horaires et l’équipement de la salle de pause ? La situation ne porte ni sur le sommeil ni sur l’impact environnemental des repas."}, "essentiel": {"indice": "Une seule proposition parle à la fois du régime végétarien et de la salle de pause.", "explication": "Agathe doit couvrir ses besoins nutritionnels en restant végétarienne, malgré ses horaires et la salle de pause."}}}, {"type": "analyse", "id": "a7_analyse2", "data": {"titre": "LE DEVENIR DES ALIMENTS"}}, {"type": "document_texte_image", "id": "a7_doc1", "data": {"label": "DOC. 1", "titre": "L’appareil digestif", "cadre": true, "corps": "", "source": "", "date_consultation": "2026-10-27", "image_w": 1500, "image_h": 1000, "image_pos": "centre", "image_align": "centre", "image_largeur": 84, "image_taille": "pleine", "image_nom": "Planche d’anatomie « L’appareil digestif » : le tronc et la tête d’un adulte, vus de face. Neuf organes sont reliés à leur nom par un trait. De haut en bas : la bouche ; les glandes salivaires, près de la bouche ; l’œsophage, tube qui descend de la bouche à l’estomac ; le foie, gros organe en haut de l’abdomen ; l’estomac, poche à côté du foie ; le pancréas, sous l’estomac ; l’intestin grêle, long tube replié au centre de l’abdomen ; le gros intestin, qui encadre l’intestin grêle ; l’anus, à l’extrémité du tube digestif.", "img": "bcp_1ere_A7/images/bcp_1ere_A7_a7_doc1.jpg", "img_desc": "Planche d’anatomie « L’appareil digestif » : le tronc et la tête d’un adulte, vus de face. Neuf organes sont reliés à leur nom par un trait. De haut en bas : la bouche ; les glandes salivaires, près de la bouche ; l’œsophage, tube qui descend de la bouche à l’estomac ; le foie, gros organe en haut de l’abdomen ; l’estomac, poche à côté du foie ; le pancréas, sous l’estomac ; l’intestin grêle, long tube replié au centre de l’abdomen ; le gros intestin, qui encadre l’intestin grêle ; l’anus, à l’extrémité du tube digestif.", "img_w": 1400, "img_h": 933}}, {"type": "question_chapeau", "id": "a7_ch2", "data": {"numero": "2", "texte": "À partir du document 1 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "a7_q21", "data": {"competence": "C2", "numero": "2.1", "texte": "**Nommer** les six organes du tube digestif, dans l’ordre du trajet des aliments.", "points": "", "lignes": 6, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Bouche.\n– Œsophage.\n– Estomac.\n– Intestin grêle.\n– Gros intestin.\n– Anus.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** le trajet des aliments.\nBouche → ……………………… → estomac → ……………………… → gros intestin → ……………………… .", "lignes": 0, "reponse_allegee": "→ {{œsophage}} → estomac → {{intestin grêle}} → gros intestin → {{anus}}", "reponse_attendue": "œsophage · intestin grêle · anus"}, "essentiel": {"texte": "**Compléter** le trajet des aliments.\nMots proposés : œsophage – intestin grêle – anus – foie.\nBouche → ……………………… → estomac → ……………………… → gros intestin → ……………………… .", "lignes": 0, "reponse_attendue": "œsophage · intestin grêle · anus"}}, "lignes_par_reponse": 1}, "el": {"standard": {"indice": "DOC. 1 : suivre le tube du haut vers le bas, de la bouche jusqu’à l’extrémité du tube digestif.", "explication": "Les aliments traversent six organes : la bouche, l’œsophage, l’estomac, l’intestin grêle, le gros intestin et l’anus."}, "adapte": {"indice": "DOC. 1 : le tube entre la bouche et l’estomac, le long tube replié au centre de l’abdomen, puis l’extrémité du tube digestif.", "explication": "Bouche → œsophage → estomac → intestin grêle → gros intestin → anus.", "trous": ["œsophage|oesophage|l’œsophage|l'oesophage", "intestin grêle|intestin grele|l’intestin grêle|grêle|grele", "anus|l’anus|l'anus"]}, "essentiel": {"indice": "DOC. 1 : le tube digestif. Le foie n’est pas sur le trajet des aliments.", "explication": "Bouche → œsophage → estomac → intestin grêle → gros intestin → anus.", "trous": ["œsophage|oesophage", "intestin grêle|intestin grele|grêle|grele", "anus"]}}}, {"type": "sous_question", "id": "a7_q22", "data": {"competence": "C2", "numero": "2.2", "texte": "**Relever** trois organes de l’appareil digestif situés hors du trajet des aliments.", "points": "", "lignes": 3, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Glandes salivaires.\n– Foie.\n– Pancréas.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** les trois organes.\nLes aliments ne traversent pas les glandes ……………………… , le ……………………… et le ……………………… .", "lignes": 0, "reponse_allegee": "les glandes {{salivaires}}, le {{foie}} et le {{pancréas}}", "reponse_attendue": "salivaires · foie · pancréas"}, "essentiel": {"texte": "**Compléter** les trois organes.\nMots proposés : salivaires – foie – pancréas – estomac.\nLes aliments ne traversent pas les glandes ……………………… , le ……………………… et le ……………………… .", "lignes": 0, "reponse_attendue": "salivaires · foie · pancréas"}}, "lignes_par_reponse": 1}, "el": {"standard": {"indice": "DOC. 1 : les organes reliés au tube digestif, mais que les aliments ne traversent pas.", "explication": "Les glandes salivaires, le foie et le pancréas appartiennent à l’appareil digestif, mais les aliments ne les traversent pas."}, "adapte": {"indice": "DOC. 1 : les glandes près de la bouche, le gros organe en haut de l’abdomen, l’organe sous l’estomac.", "explication": "Les glandes salivaires, le foie et le pancréas.", "trous": ["salivaires|salivaire", "foie", "pancréas|pancreas"]}, "essentiel": {"indice": "DOC. 1 : les aliments traversent l’estomac ; il ne convient donc pas.", "explication": "Les glandes salivaires, le foie et le pancréas.", "trous": ["salivaires|salivaire", "foie", "pancréas|pancreas"]}}}, {"type": "texte_libre", "id": "a7_tr1", "data": {"texte": "*Le long du tube digestif, les aliments sont transformés.*"}}, {"type": "document", "id": "a7_doc2", "data": {"label": "DOC. 2", "titre": "La digestion mécanique et la digestion chimique", "cadre": true, "corps": "« De la bouche au gros intestin, l’aliment parcourt un long chemin. Il est transformé par des processus de digestion mécaniques et chimiques, afin que les nutriments puissent être utilisés ou stockés par l’organisme. »\n« La digestion mécanique a lieu dans la bouche et l’estomac. Elle réduit les aliments en bouillie. Les dents broient les aliments en petits morceaux et dans l’estomac le brassage et les contractions continuent ce travail de fragmentation. »\n« La digestion chimique se déroule tout au long du tube digestif grâce à des enzymes et à des sucs digestifs comme la salive, l’acide chlorhydrique sécrété par l’estomac ou la bile sécrétée par le foie. »\n« Dans le contexte de la digestion, les enzymes ont pour fonction de fractionner les molécules complexes en éléments plus simples et plus facilement absorbables par le tube digestif. »", "source": "VIDAL, « Comment digérons-nous les aliments ? » et « La digestion continue dans l’estomac », 2019 (extraits).", "date_consultation": "2026-10-27"}}, {"type": "question_chapeau", "id": "a7_ch3", "data": {"numero": "3", "texte": "À partir du document 2 :", "reponse_attendue": ""}}, {"type": "classer", "id": "a7_q31", "data": {"competence": "C2", "numero": "3.1", "titre": "", "consigne": "**Classer** chaque étape selon le type de digestion.", "categories": ["Digestion mécanique", "Digestion chimique"], "items": ["La mastication du pain", "L’action de la salive sur l’amidon", "Le brassage de la bouillie dans l’estomac", "L’action des enzymes du suc pancréatique", "Le découpage des protéines par les enzymes"], "classement": [0, 1, 0, 1, 1], "indice": ""}, "el": {"standard": {"indice": "DOC. 2 : la digestion mécanique broie et brasse (dents, estomac) ; la digestion chimique fait agir des enzymes et des sucs digestifs.", "explication": "Digestion mécanique : la mastication du pain et le brassage dans l’estomac. Digestion chimique : l’action de la salive sur l’amidon, l’action des enzymes du suc pancréatique et le découpage des protéines par les enzymes."}}}, {"type": "sous_question", "id": "a7_q32", "data": {"competence": "C2", "numero": "3.2", "texte": "**Relever** le rôle des enzymes dans la digestion.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Les enzymes fractionnent les molécules complexes des aliments en éléments plus simples, absorbables par le tube digestif.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** l’explication.\nLes enzymes fractionnent les molécules ……………………… en éléments plus ……………………… , absorbables par le tube digestif.", "lignes": 0, "reponse_allegee": "les molécules {{complexes}} en éléments plus {{simples}}", "reponse_attendue": "complexes · simples"}, "essentiel": {"texte": "**Compléter** l’explication.\nMots proposés : complexes – simples – sucrées.\nLes enzymes fractionnent les molécules ……………………… en éléments plus ……………………… .", "lignes": 0, "reponse_attendue": "complexes · simples"}}}, "el": {"standard": {"indice": "DOC. 2 : la dernière citation, « les enzymes ont pour fonction de… ».", "explication": "Les enzymes fractionnent les molécules complexes des aliments en éléments plus simples, absorbables par le tube digestif."}, "adapte": {"indice": "DOC. 2 : la dernière citation.", "explication": "Les enzymes fractionnent les molécules complexes en éléments plus simples.", "trous": ["complexes|complexe", "simples|simple"]}, "essentiel": {"indice": "DOC. 2 : la dernière citation. « Sucrées » ne s’y trouve pas.", "explication": "Molécules complexes, éléments plus simples.", "trous": ["complexes|complexe", "simples|simple"]}}}, {"type": "texte_libre", "id": "a7_tr2", "data": {"texte": "*Chaque constituant des aliments donne un nutriment.*"}}, {"type": "document", "id": "a7_doc3", "data": {"label": "DOC. 3", "titre": "Des constituants des aliments aux nutriments", "cadre": false, "corps": "", "source": "", "dat se": 1}, "el": {"standard": {"indice": "DOC. 3 : la dernière colonne, lignes « Amidon » et « Lipides ».", "explication": "L’amidon de la farine donne du glucose ; les lipides du chocolat donnent des acides gras et du glycérol."}, "adapte": {"indice": "DOC. 3 : la colonne « Nutriment obtenu après digestion ».", "explication": "L’amidon donne du glucose ; les lipides donnent des acides gras et du glycérol.", "trous": ["glucose|du glucose", "gras"]}, "essentiel": {"indice": "DOC. 3 : la dernière colonne. Les acides aminés viennent des protéines.", "explication": "Amidon : glucose. Lipides : acides gras et glycérol.", "trous": ["glucose", "gras"]}}}, {"type": "texte_libre", "id": "a7_tr3", "data": {"texte": "*Les nutriments traversent ensuite la paroi de l’intestin grêle.*"}}, {"type": "document_texte_image", "id": "a7_doc4", "data": {"label": "DOC. 4", "titre": "L’absorption intestinale", "cadre": true, "corps": "« Celle-ci [la paroi de l’intestin grêle] forme une succession de replis, appelés villosités, sur toute sa longueur. […] Ces villosités et ces microvillosités accroissent considérablement la surface de contact, donc d’absorption, entre les aliments et l’intestin grêle […]. »", "source": "Texte : d’après VIDAL, « Le rôle de l’intestin grêle dans la digestion », 2023.", "date_consultation": "2026-10-27", "image_w": 1774, "image_h": 887, "image_pos": "centre", "image_align": "centre", "image_largeur": 90, "image_taille": "pleine", "image_nom": "Planche en deux cadres « L’absorption intestinale ». Cadre de gauche : un segment d’intestin grêle ouvert, dont la paroi interne porte de très nombreux replis en forme de doigts, les villosités. Cadre de droite : une villosité agrandie, en coupe. À l’intérieur de l’intestin, des nutriments ; ils traversent la paroi très fine de la villosité ; au centre de la villosité passent des vaisseaux sanguins (le sang) et un vaisseau lymphatique (la lymphe). Des flèches vont des nutriments vers le sang et vers la lymphe.", "img": "bcp_1ere_A7/images/bcp_1ere_A7_a7_doc4.jpg", "img_desc": "Planche en deux cadres « L’absorption intestinale ». Cadre de gauche : un segment d’intestin grêle ouvert, dont la paroi interne porte de très nombreux replis en forme de doigts, les villosités. Cadre de droite : une villosité agrandie, en coupe. À l’intérieur de l’intestin, des nutriments ; ils traversent la paroi très fine de la villosité ; au centre de la villosité passent des vaisseaux sanguins (le sang) et un vaisseau lymphatique (la lymphe). Des flèches vont des nutriments vers le sang et vers la lymphe.", "img_w": 1400, "img_h": 700}}, {"type": "question_chapeau", "id": "a7_ch5", "data": {"numero": "5", "texte": "À partir des documents 3 et 4 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "a7_q51", "data": {"competence": "C2", "numero": "5.1", "texte": "**Indiquer** les deux liquides qui reçoivent les nutriments.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Le sang.\n– La lymphe.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** les deux liquides.\nLes nutriments passent dans le ……………………… ou dans la ……………………… .", "lignes": 0, "reponse_allegee": "le {{sang}} ou la {{lymphe}}", "reponse_attendue": "sang · lymphe"}, "essentiel": {"texte": "**Compléter** les deux liquides.\nMots proposés : sang – lymphe – salive.\nLes nutriments passent dans le ……………………… ou dans la ……………………… .", "lignes": 0, "reponse_attendue": "sang · lymphe"}}, "lignes_par_reponse": 1}, "el": {"standard": {"indice": "DOC. 4 : le cadre de droite, ce qui passe au centre de la villosité.", "explication": "Les nutriments passent dans le sang et dans la lymphe."}, "adapte": {"indice": "DOC. 4 : le cadre de droite, les flèches qui partent des nutriments.", "explication": "Le sang et la lymphe.", "trous": ["sang", "lymphe"]}, "essentiel": {"indice": "DOC. 4 : le cadre de droite. La salive est dans la bouche.", "explication": "Le sang es.", "trous": ["48", "19"]}}}, {"type": "texte_libre", "id": "a7_tr7", "data": {"texte": "*Le Nutri-Score et la liste des ingrédients renseignent différemment.*"}}, {"type": "document", "id": "a7_doc11", "data": {"label": "DOC. 11", "titre": "Le Nutri-Score et les aliments ultra-transformés", "cadre": true, "corps": "**Santé publique France** — « Le logo est attribué sur la base d’un score prenant en compte pour 100 gr ou 100 mL de produit, la teneur : en nutriments et aliments à favoriser (fibres, protéines, fruits, légumes, légumes secs) ; et en nutriments à limiter (énergie, acides gras saturés, sucres, sel et édulcorants pour les boissons). »\n« En plus d’être gras, sucrés ou salés, ces produits sont souvent ultra-transformés, c’est-à-dire qu’ils contiennent de nombreux additifs (colorants, émulsifiants, conservateurs, exhausteurs de goût, arômes…). Ces additifs figurent sur la liste des ingrédients, souvent avec la lettre E. »\n**Pourquoi Docteur** — « Contrairement au score Nova, le Nutri-Score ne tient pas compte du degré de transformation des aliments. »", "source": "D’après Santé publique France (2018, 2026) et Pourquoi Docteur, 14/09/2025.", "date_consultation": "2026-10-27"}}, {"type": "question_chapeau", "id": "a7_ch12", "data": {"numero": "3", "texte": "À partir de la situation d’Agathe et des documents 10 et 11 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "a7_q121", "data": {"competence": "C2", "numero": "3.1", "texte": "**Relever** deux indices qui montrent que le produit A est ultra-transformé.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Un émulsifiant (E471).\n– Un colorant (E150d) (ou un arôme).", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** les deux indices.\nIl contient un ……………………… (E471) et un ……………………… (E150d).", "lignes": 0, "reponse_allegee": "un {{émulsifiant}} et un {{colorant}}", "reponse_attendue": "émulsifiant · colo
