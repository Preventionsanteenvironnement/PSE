<style>

<script>
(function(){const S=window.SpeechSynthesisUtterance;if(!S)return;
 const sig=t=>String(t).replace(/\bOMS\b/g,"O M S").replace(/\bDMP\b/g,"D M P").replace(/\bCAP\b/g,"cap").replace(/(\d+),(\d+) €/g,"$1 euros $2").replace(/(\d+) €/g,"$1 euros");
 window.SpeechSynthesisUtterance=function(t){return new S(sig(t))};})();


/* ===== CAS — actions [texte, 1 si utile, message] · blocs a/f/e : [texte, 1 si juste, message] ===== */
const CAS=[{"id": "collation", "titre": "La collation d'Agathe", "situation": "Agathe, cariste dans un entrepôt, travaille de 5 h à 12 h 30. À la pause de 9 h, elle achète le plus souvent au distributeur une barre chocolatée et une boisson sucrée. Elle se sent très fatiguée en fin de poste.", "doc": "Doc. 7, 10 et 13 : Santé publique France recommande de limiter les boissons sucrées, les aliments gras, sucrés, salés et ultra-transformés. Pour 100 g, la barre chocolatée au caramel contient 48 g de sucres et 5 g de protéines ; le mélange amandes et noisettes non salées, 4,5 g de sucres et 19 g de protéines. L'INRS conseille une collation légère pour les postes du matin.", "qv": "Choisir", "qp": "deux mesures de prévention individuelle utiles à Agathe, en cochant deux propositions.", "actions": [["Préparer une collation peu sucrée, comme des amandes et noisettes non salées.", 1], ["Boire de l'eau plutôt qu'une boisson sucrée.", 1], ["Remplacer la boisson sucrée par une boisson énergisante.", 0, "Ce n'est pas la mesure du cours : il s'agit de boire de l'eau."], ["Prendre deux barres chocolatées pour tenir jusqu'à la fin du poste.", 0, "Santé publique France recommande de limiter les aliments gras et sucrés."]], "debut": "Pour sa collation, la mesure la plus utile pour Agathe est", "a": [["de préparer une collation peu sucrée, comme le mélange amandes et noisettes", 1], ["de garder la barre chocolatée au caramel", 0, "Elle contient 48 g de sucres pour 100 g."], ["de supprimer toute collation", 0, "L'INRS conseille une collation légère pour les postes du matin."]], "f": [["le plus souvent, elle achète une barre chocolatée et une boisson sucrée et se sent très fatiguée en fin de poste", 1], ["son métier de cariste dure depuis six ans", 0, "Ce fait n'explique pas le choix."], ["l'entrepôt emploie 80 salariés", 0, "Ce fait concerne le local de restauration, pas la collation."]], "e": [["Santé publique France recommande de limiter les boissons sucrées et les aliments gras, sucrés, salés et ultra-transformés", 1], ["la barre chocolatée contient plus de protéines que les amandes et noisettes", 0, "C'est l'inverse : 5 g contre 19 g pour 100 g."], ["l'INRS conseille une collation copieuse pour les postes du matin", 0, "Il conseille une collation légère."]]}, {"id": "refrigerateur", "titre": "La salle de pause sans réfrigérateur", "situation": "L'entrepôt où travaille Agathe emploie 80 salariés. La salle de pause comporte un micro-ondes et un distributeur automatique, mais aucun réfrigérateur ni autre moyen de conserver les aliments.", "doc": "Doc. 12 : « Dans les établissements d'au moins cinquante salariés, l'employeur […] met à leur disposition un local de restauration. […] Il est doté d'un moyen de conservation ou de réfrigération des aliments et des boissons et d'une installation permettant de réchauffer les plats. » (Code du travail, article R. 4228-22)", "qv": "Choisir", "qp": "deux mesures de prévention collective, en cochant deux propositions.", "actions": [["Équiper la salle de pause d'un réfrigérateur.", 1], ["Proposer au distributeur des produits peu sucrés.", 1], ["Conseiller à chaque salarié d'apporter sa propre glacière.", 0, "C'est une mesure individuelle, laissée à chaque salarié."], ["Retirer le micro-ondes de la salle de pause.", 0, "Le local doit comporter une installation pour réchauffer les plats."]], "debut": "Pour la salle de pause, la mesure collective la plus utile est", "a": [["d'équiper la salle d'un réfrigérateur", 1], ["d'ajouter un distributeur de boissons sucrées", 0, "Santé publique France recommande de limiter les boissons sucrées."], ["de supprimer la pause de 9 h", 0, "L'INRS conseille d'insérer des pauses pour les repas."]], "f": [["l'entrepôt emploie 80 salariés et la salle de pause n'a aucun moyen de conserver les aliments", 1], ["son personnel compte des végétariens", 0, "Ce fait n'explique pas l'obligation de l'employeur."], ["la salle de pause comporte un micro-ondes", 0, "Ce fait n'explique pas le choix d'un réfrigérateur."]], "e": [["dès 50 salariés, le local de restauration doit être doté d'un moyen de conservation ou de réfrigération des aliments", 1], ["un réfrigérateur n'est obligatoire qu'au-delà de 500 salariés", 0, "Le seuil est d'au moins 50 salariés."], ["le local de restauration n'est jamais obligatoire", 0, "Il l'est dans les établissements d'au moins 50 salariés."]]}, {"id": "fer", "titre": "Rester végétarienne", "situation": "Agathe est végétarienne depuis deux ans, pour le bien-être animal et pour la planète. Depuis quelques mois, elle se sent très fatiguée en fin de poste et elle en a parlé au médecin du travail.", "doc": "Doc. 7 : le régime végétarien est associé à un risque plus faible de diabète de type 2 ; le statut en fer des végétariens est moins favorable. « Le fer héminique est présent exclusivement dans les aliments d'origine animale […]. » Une déficience en fer peut provoquer « fatigue, maux de tête, vertige, essoufflement… »", "qv": "Choisir", "qp": "deux mesures utiles à Agathe, en cochant deux propositions.", "actions": [["Faire vérifier son taux de fer par un médecin.", 1], ["Consommer des légumes secs, sources de protéines.", 1], ["Ignorer sa fatigue.", 0, "La fatigue est un symptôme possible d'une carence en fer : il faut la faire vérifier."], ["Manger du bœuf tous les jours.", 0, "Agathe a choisi d'être végétarienne ; le bœuf utilise beaucoup plus de surface agricole."]], "debut": "Agathe peut rester végétarienne à condition", "a": [["de surveiller ses apports en fer avec un médecin", 1], ["de manger davantage de barres chocolatées", 0, "Santé publique France recommande de les limiter."], ["de ne rien changer malgré sa fatigue", 0, "La fatigue peut être liée à une carence en fer."]], "f": [["depuis deux ans, elle ne mange plus de chair animale et se sent très fatiguée en fin de poste", 1], ["son entrepôt appartient à la grande distribution", 0, "Ce fait n'explique pas le choix."], ["la salle de pause comporte un distributeur", 0, "Ce fait n'explique pas la surveillance du fer."]], "e": [["le fer héminique, mieux absorbé, n'existe que dans les aliments d'origine animale, et une carence en fer peut provoquer de la fatigue", 1], ["le régime végétarien augmente le risque de diabète de type 2", 0, "Il est associé à un risque plus faible."], ["les légumes contiennent du fer héminique", 0, "Le fer héminique est présent exclusivement dans les aliments d'origine animale."]]}, {"id": "galette", "titre": "La galette végétale de Solène", "situation": "Solène, déménageuse, mange beaucoup moins de viande depuis un an. À la place du steak haché, elle achète des galettes végétales au soja. Ingrédients : eau, protéines de soja, huile, farine de blé, sel, E461, arôme.", "doc": "Doc. 11 : « […] ces produits sont souvent ultra-transformés, c'est-à-dire qu'ils contiennent de nombreux additifs […]. Ces additifs figurent sur la liste des ingrédients, souvent avec la lettre E. » « Contrairement au score Nova, le Nutri-Score ne tient pas compte du degré de transformation des aliments. »", "qv": "Choisir", "qp": "deux mesures utiles à Solène, en cochant deux propositions.", "actions": [["Lire la liste des ingrédients pour repérer les additifs.", 1], ["Cuisiner parfois des légumes secs, sources de protéines.", 1], ["Se fier au seul Nutri-Score pour savoir si la galette est ultra-transformée.", 0, "Le Nutri-Score ne tient pas compte du degré de transformation."], ["Ne jamais lire l'étiquette.", 0, "C'est la liste des ingrédients qui signale les additifs."]], "debut": "Pour savoir si la galette est ultra-transformée, Solène doit", "a": [["lire la liste des ingrédients", 1], ["regarder seulement le Nutri-Score", 0, "Il ne tient pas compte du degré de transformation."], ["regarder seulement le prix", 0, "Le prix ne renseigne pas sur la transformation."]], "f": [["la galette contient un additif, E461, et un arôme", 1], ["Solène est déménageuse", 0, "Ce fait n'explique pas le choix."], ["Solène mange moins de viande depuis un an", 0, "Ce fait n'explique pas comment repérer un aliment ultra-transformé."]], "e": [["les additifs figurent sur la liste des ingrédients, souvent avec la lettre E, et le Nutri-Score ne tient pas compte du degré de transformation", 1], ["le Nutri-Score tient compte du degré de transformation", 0, "Contrairement au score Nova, il n'en tient pas compte."], ["les additifs n'apparaissent jamais sur l'étiquette", 0, "Ils figurent sur la liste des ingrédients."]]}];
const $=id=>document.getElementById(id);
function annoncer(t){$("annonce").textContent=t}
const CLE="justifier-BCPA7";let pref={etoiles:{}};
try{pref=Object.assign(pref,JSON.parse(localStorage.getItem(CLE)||"{}"))}catch(e){}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(pref))}catch(e){}}
function melanger(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let C,err,phrase,etapeBloc,sel;

function onglets(){
  $("onglets").innerHTML=CAS.map(c=>`<button class="puce" data-id="${c.id}" aria-pressed="${C===c}">${c.titre}${pref.etoiles[c.id]?`<span class="et">${"★".repeat(pref.etoiles[c.id])}</span>`:""}</button>`).join("");
  $("onglets").querySelectorAll(".puce").forEach(b=>b.onclick=()=>demarrer(CAS.find(c=>c.id===b.dataset.id)));
}
function entete(){return `<div class="situation"><b>Situation</b>${C.situation}<div class="doc">${C.doc}</div></div>`}
function demarrer(c){C=c;err=0;phrase={};sel=new Set();onglets();proposer()}

/* Étape 1 : proposer deux actions */
function proposer(){
  const opts=melanger(C.actions.map((a,i)=>[a,i]));
  $("carte").innerHTML=`${entete()}<div class="num">Étape 1 / 2 · C4</div>
    <p class="q"><b>${C.qv||"Proposer"}</b> ${C.qp||"deux actions utiles, en cochant deux propositions."}<small>Deux réponses attendues.</small></p>
    <div class="opts">${opts.map(([a,i])=>`<button class="opt" data-i="${i}" aria-pressed="false">☐ ${a[0]}</button>`).join("")}</div>
    <button class="valider" id="bVal" disabled>Valider mes deux actions</button>
    <div class="fb" id="fb" role="status" aria-live="polite"></div><div id="suite"></div>
    <button class="outil" id="bLire">🔊 Écouter</button>`;
  $("bLire").onclick=()=>lire(`${C.situation} Choisir ${C.qp||"deux actions utiles."} ${C.actions.map(a=>a[0]).join(" ")}`);
  $("carte").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;if(b.disabled)return;
    if(sel.has(i))sel.delete(i);else if(sel.size<2)sel.add(i);
    $("carte").querySelectorAll(".opt").forEach(x=>{const on=sel.has(+x.dataset.i);x.setAttribute("aria-pressed",on);x.textContent=(on?"☑ ":"☐ ")+C.actions[+x.dataset.i][0]});
    $("bVal").disabled=sel.size!==2;
  });
  $("bVal").onclick=()=>{
    const faux=[...sel].filter(i=>!C.actions[i][1]);
    if(!faux.length){
      $("carte").querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(sel.has(+x.dataset.i))x.classList.add("bon")});$("bVal").remove();
      fb("ok","<b>✓ Bien proposé.</b> Ces deux propositions sont les bonnes.");
      const b=document.createElement("button");b.className="continuer";b.textContent="Étape 2 : justifier";b.onclick=justifier;$("suite").appendChild(b);b.focus({preventScroll:true});
    }else{
      err+=faux.length;
      faux.forEach(i=>{const x=$("carte").querySelector(`.opt[data-i="${i}"]`);x.classList.add("mauvais");x.disabled=true;x.setAttribute("aria-pressed","false");sel.delete(i)});
      $("bVal").disabled=true;
      fb("ko",`<b>Pas tout à fait.</b> ${faux.map(i=>C.actions[i][2]).join(" ")} Choisis une autre action.`);
    }
  };
}

/* Étape 2 : construire la justification */
const ORDRE=["a","f","e"];
const NOMS={a:"l'action",f:"le fait de la situation",e:"l'effet tiré du document"};
function justifier(){etapeBloc=0;phrase={};rendrePhrase()}
function conj(){return phrase.e&&/^[aeiouyéèêh]/i.test(phrase.e)?"qu'":"que "}
function slot(x){return phrase[x]?`<span class="slot ${x}">${phrase[x]}</span>`:`<span class="slot vide${ORDRE[etapeBloc]===x?" ici":""}">${NOMS[x]}</span>`}
function rendrePhrase(){
  const x=ORDRE[etapeBloc];
  $("carte").innerHTML=`${entete()}<div class="num">Étape 2 / 2 · C5</div>
    <p class="q"><b>Justifier</b> en construisant la phrase.</p>
    <div class="phrase" aria-live="polite">${C.debut||"L'action la plus utile est"} ${slot("a")}, parce que ${slot("f")}, et ${conj()}${slot("e")}.</div>
    <div id="zoneB"></div><div class="fb" id="fb" role="status" aria-live="polite"></div><div id="suite"></div>`;
  if(!x){finJustif();return}
  const blocs=melanger(C[x].map((b,i)=>[b,i]));
  $("zoneB").innerHTML=`<div class="blocs"><h3>Choisis ${NOMS[x]} :</h3>${blocs.map(([b,i])=>`<button class="bloc" data-i="${i}">${b[0]}</button>`).join("")}</div>`;
  $("zoneB").querySelectorAll(".bloc").forEach(b=>b.onclick=()=>{
    const bl=C[x][+b.dataset.i];
    if(bl[1]){phrase[x]=bl[0];etapeBloc++;rendrePhrase();
      const msg={a:"C'est bien l'action la plus utile.",f:"C'est un fait précis, écrit dans la situation.",e:"C'est un effet tiré du document."}[x];
      if($("fb"))fb("ok",`<b>✓</b> ${msg}`)}
    else{err++;b.classList.add("mauvais");b.disabled=true;fb("ko",`<b>Pas tout à fait.</b> ${bl[2]}`)}
  });
}
function finJustif(){
  const et=err===0?3:err<=2?2:1;pref.etoiles[C.id]=Math.max(pref.etoiles[C.id]||0,et);sauver();onglets();
  const texte=`${C.debut||"L'action la plus utile est"} ${phrase.a}, parce que ${phrase.f}, et ${conj()}${phrase.e}.`;
  const i=CAS.indexOf(C),s=CAS[i+1];
  $("suite").innerHTML=`<div class="fb ok" style="padding:.7rem .9rem;margin-top:.8rem"><b>✓ Justification complète !</b> Recopie-la sur ta feuille : c'est ce qu'on attend à l’épreuve.</div>
    <div class="etoiles" aria-label="${et} étoiles sur 3">${"★".repeat(et)}<span style="opacity:.25">${"★".repeat(3-et)}</span></div>
    <button class="outil" id="bLireP">🔊 Écouter ma justification</button>
    <div class="retenir"><b>À retenir</b>À l’épreuve, « Justifier », ce n'est pas donner son avis : on relie l'action à un fait précis de la situation et à un effet donné par le document.</div>
    ${s?`<button class="continuer" id="bSuiv">Cas suivant : ${s.titre} →</button>`:""}`;
  $("bLireP").onclick=()=>lire(texte.replace(/€/g,"euros"));
  if(s){$("bSuiv").onclick=()=>{demarrer(s);scrollTo({top:0,behavior:"smooth"})};$("bSuiv").focus({preventScroll:true})}
  annoncer(texte);
}
