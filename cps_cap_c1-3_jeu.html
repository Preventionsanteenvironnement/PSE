<!DOCTYPE html>
<html lang="fr">
<head>
<script src="assets/audio-pause.js?v=2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPS C1.3 — Ce qui compte pour moi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f4f7fc;color:#1e293b;line-height:1.6;padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.back{display:inline-block;color:#1d4ed8;text-decoration:none;font-weight:800;font-size:1rem;margin-bottom:10px}
.back:hover{text-decoration:underline}
.prog{position:sticky;top:0;z-index:5;background:#f4f7fc;padding:6px 0 10px}
.prog .label{font-size:.78rem;font-weight:800;color:#1e40af;margin-bottom:4px;text-align:center}
.prog .track{height:10px;background:#dbeafe;border-radius:20px;overflow:hidden}
.prog .track > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1d4ed8,#3b82f6);border-radius:20px;transition:width .4s ease}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 3px 14px rgba(0,0,0,.06);animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hero{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border-radius:20px;padding:26px 20px;text-align:center;margin-bottom:6px}
.hero .ic{font-size:3rem;display:block;margin-bottom:6px}
.hero h1{font-size:1.5rem;font-weight:900}
.hero p{opacity:.95;font-size:.96rem;margin-top:6px}
.txt{font-size:1.12rem;font-weight:600;line-height:1.5;margin:6px 0 12px}
.teach{background:#eff6ff;border-left:6px solid #1d4ed8;border-radius:0 12px 12px 0;padding:12px 14px;font-size:1.04rem;margin-bottom:12px}
.q{font-size:1.12rem;font-weight:800;color:#1e40af;margin:6px 0 12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:14px;border:2px solid #bfdbfe;background:#fff;cursor:pointer;font-family:inherit;font-size:1.05rem;font-weight:700;color:#1e293b;transition:.15s}
.opt:hover:not(:disabled){border-color:#1d4ed8;background:#eff6ff}
.opt:disabled{cursor:default}
.opt.ok{border-color:#22c55e;background:#dcfce7;color:#166534}
.opt.no{border-color:#fca5a5;background:#fee2e2;color:#991b1b}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0}
.chip{border:2px solid #bfdbfe;background:#fff;border-radius:30px;padding:10px 15px;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit;color:#1e293b;transition:.12s}
.chip:hover{border-color:#1d4ed8}
.chip.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.hint{font-size:.92rem;color:#64748b;font-weight:700;text-align:center;margin-top:4px}
.fb{margin-top:14px}
.msg{border-radius:14px;padding:13px 15px;font-weight:700;font-size:1rem;animation:fade .3s}
.msg.good{background:#dcfce7;border:2px solid #86efac;color:#166534}
.msg.bad{background:#fff7ed;border:2px solid #fed7aa;color:#9a3412}
.msg.win{background:#dbeafe;border:2px solid #93c5fd;color:#1e40af}
.btn{display:block;width:100%;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border:none;border-radius:14px;padding:15px;font-size:1.1rem;font-weight:800;cursor:pointer;font-family:inherit;margin-top:12px;text-align:center;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.btn:active{transform:translateY(1px)}
.btn.soft{background:#e0e7ff;color:#3730a3}
.say{float:right;background:#eff6ff;color:#1d4ed8;border:none;border-radius:10px;padding:6px 11px;font-size:.95rem;font-weight:800;cursor:pointer}
.recap{list-style:none;margin:10px 0 0}
.recap li{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 13px;margin-bottom:8px;font-size:.98rem}
.badge{text-align:center;font-size:1.1rem;font-weight:900;color:#1e40af;margin:10px 0}
@media(max-width:600px){.wrap{padding:10px}.card{padding:16px}.txt{font-size:1.05rem}.hero h1{font-size:1.3rem}}
.jimg{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:14px;margin:6px 0 10px;background:#fff}
.jimgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
<link rel="stylesheet" href="assets/acces.css?v=5">
<link rel="stylesheet" href="assets/cps_moi.css?v=20261107">
<script src="assets/acces.js?v=5" defer></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Accueil</a>
  <div data-cps-moi="retour" data-code="C1.3" data-titre="Mes valeurs et mes buts" data-fam="Penser et agir"></div>
  <div class="prog"><div class="label" id="proglabel"></div><div class="track"><i id="progbar"></i></div></div>
  <div id="scene"></div>
  <div id="moi-park" hidden>
    <div id="moi-perso">
      <div data-cps-moi="sequence" data-code="C1.3" data-titre="Mes valeurs et mes buts" data-fam="Penser et agir"><script type="application/json">{"tag": "Et moi ?", "title": "Une valeur, un but", "steps": [{"kind": "texte", "q": "Un moment où j’ai agi selon une de ces valeurs :", "carnet": "J’ai agi selon ma valeur", "aide": "Exemple : j’ai aidé un camarade à finir sa pièce avant la fin du cours.", "criteres": ["Je dis ce que j’ai fait", "Je peux nommer la valeur"]}, {"kind": "texte", "q": "Un but pour les prochaines semaines, relié à cette valeur :", "carnet": "Mon but", "aide": "Exemple : rendre mon dossier de stage complet avant le 15 décembre.", "criteres": ["Il est précis : je sais quoi faire", "Il est réaliste : je peux le faire", "Il a une date", "Je peux le tenir jusqu’au bout"]}, {"kind": "choix", "q": "Qui peut m’aider à atteindre ce but ?", "carnet": "Qui peut m’aider", "multi": true, "opts": ["Un professeur", "Mon tuteur de stage", "Un camarade de confiance", "Un proche", "Le CPE", "L’infirmier ou l’infirmière du lycée", "Personne pour l’instant"]}], "fin": "Un but qui suit tes valeurs te ressemble. Il est plus facile à tenir."}</script></div>
    </div>
    <div id="moi-fin">
      <div data-cps-moi="defi" data-code="C1.3" data-titre="Mes valeurs et mes buts" data-fam="Penser et agir"><script type="application/json">{"q": "Choisis une seule chose à essayer cette semaine.", "opts": ["Faire la première étape de mon but", "Repérer un moment où j’agis selon une de mes valeurs", "Avant un choix, me demander : est-ce que cela me ressemble ?"]}</script></div>
      <div data-cps-moi="duo"><script type="application/json">{"duree": "10 minutes", "situation": "Chacun a choisi une valeur et un but pour les prochaines semaines.", "roleA": "Présente ta valeur et ton but en deux phrases.", "roleB": "Vérifie le but avec quatre questions : quoi exactement ? Possible ? Pour quand ? Tenable ?", "etapes": ["A présente sa valeur et son but.", "B pose les quatre questions.", "A précise son but si besoin.", "On inverse les rôles."], "observe": ["Le but dit une action précise", "Le but a une date", "B pose ses questions sans juger le but"]}</script></div>
    </div>
  </div>
</div>
<script src="assets/cps_moi.js?v=20261107"></script>
<script>
(function(){
  var scene=document.getElementById('scene');
  var idx=0;
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function speak(t){ try{ if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,'')); u.lang='fr-FR'; u.rate=0.95; speechSynthesis.speak(u);}catch(e){} }
  function go(i){ idx=i; try{speechSynthesis.cancel();}catch(e){} render(); }
  function progress(){ document.getElementById('progbar').style.width=Math.round(idx/(STEPS.length-1)*100)+'%'; document.getElementById('proglabel').textContent='Étape '+(idx+1)+' / '+STEPS.length; }
  function continueBtn(label){ var b=document.createElement('button'); b.className='btn'; b.textContent=label||'Continuer →'; b.onclick=function(){ go(idx+1); }; return b; }

  var STEPS=[
    { type:'intro', text:"Qu’est-ce qui compte vraiment pour toi ? De quoi as-tu besoin pour aller bien ? Le savoir t’aide à choisir des <strong>buts qui te ressemblent</strong>." },

    { type:'pick',
      teach:"Une <strong>valeur</strong>, c’est ce qui compte pour toi et guide tes choix : le respect, la famille, l’honnêteté…",
      q:"Choisis ce qui compte le plus pour toi.",
      min:3, max:5,
      options:["La famille","Les amis","Le respect","L’honnêteté","La santé","Le travail bien fait","Le sport","Aider les autres","La justice","La liberté","Le calme","La nature"],
      done:"Voilà <strong>tes valeurs</strong> : ce qui compte pour toi. Elles t’aident à faire tes choix." },

    { type:'notion',
      teach:"Une valeur n’est pas un objet : c’est ce qui est <strong>important</strong> pour toi et qui guide tes décisions.",
      q:"Une valeur, c’est…",
      options:[
        {l:"un objet qui coûte cher",ok:false},
        {l:"ce qui compte pour moi",ok:true},
        {l:"l’avis des autres sur moi",ok:false}
      ],
      wrong:"Pas tout à fait. Une valeur, c’est ce qui compte pour toi : le respect, la santé…",
      good:"Oui. C’est ce qui est important pour toi et qui oriente tes choix." },

    { type:'cases',
      teach:"Un <strong>besoin</strong>, c’est ce qu’il te faut pour aller bien : être reconnu, être libre, te sentir capable, faire partie d’un groupe…",
      q:"De quoi cette personne a-t-elle besoin ?",
      items:[
        { text:"Malik a fini son panier. Il aimerait que quelqu’un le remarque.",
          options:[
            {l:"Être reconnu",good:true,fb:"Oui : il a besoin qu’on voie son travail."},
            {l:"Être seul",good:false,fb:"Non : il cherche au contraire le regard des autres."},
            {l:"Se reposer",good:false,fb:"Non : il ne parle pas de fatigue."}
          ] },
        { text:"Inès est nouvelle. Elle mange seule à la pause et trouve ça dur.",
          options:[
            {l:"Être libre",good:false,fb:"Non : elle n’est pas empêchée de faire quelque chose."},
            {l:"Faire partie d’un groupe",good:true,fb:"Oui : elle a besoin de se sentir liée aux autres."},
            {l:"Être reconnue pour son travail",good:false,fb:"Non : il ne s’agit pas de son travail ici."}
          ] },
        { text:"Noa veut essayer seul le nouveau geste, sans qu’on le guide à chaque instant.",
          options:[
            {l:"Être rassuré",good:false,fb:"Non : il ne dit pas qu’il a peur."},
            {l:"Être félicité",good:false,fb:"Non : il veut d’abord essayer."},
            {l:"Se sentir capable",good:true,fb:"Oui : il a besoin d’essayer par lui-même."}
          ] }
      ] },

    { type:'cases',
      teach:"Un but qui <strong>me correspond</strong> suit mes valeurs et mes besoins. Un but choisi seulement pour faire comme les autres ne me ressemble pas.",
      q:"Quel but correspond vraiment à la personne ?",
      items:[
        { text:"Lina aime cuisiner pour sa famille. La famille compte beaucoup pour elle.",
          options:[
            {l:"Préparer le repas de l’anniversaire de sa sœur",good:true,fb:"Oui : ce but suit ce qui compte pour elle."},
            {l:"Acheter un couteau de marque pour frimer",good:false,fb:"Ce but vient du regard des autres, pas de sa valeur."},
            {l:"Faire la recette que tout le monde poste",good:false,fb:"Ce but suit la mode, pas ce qui compte pour elle."}
          ] },
        { text:"Malik aime le travail bien fait. Ses amis veulent qu’il finisse vite pour sortir.",
          options:[
            {l:"Bâcler son panier pour partir avec eux",good:false,fb:"Ce choix suit la pression du groupe, pas sa valeur."},
            {l:"Finir proprement, puis les rejoindre",good:true,fb:"Oui : il respecte ce qui compte pour lui."},
            {l:"Dire qu’il a fini alors que non",good:false,fb:"Ce choix ne respecte ni son travail ni ses amis."}
          ] }
      ] },

    { type:'perso',
      text:"À toi. Tu as choisi tes valeurs. Relie-les maintenant à un but. Rien n’est noté." },

    { type:'bilan',
      recap:[
        "Mes <strong>valeurs</strong>, c’est ce qui compte pour moi. Elles guident mes choix.",
        "Mes <strong>besoins</strong>, c’est ce qu’il me faut pour aller bien.",
        "Un but qui me correspond respecte <strong>mes valeurs et mes besoins</strong>."
      ] }
  ];
  function park(){ var p=document.getElementById('moi-park'); ['moi-perso','moi-fin'].forEach(function(id){ var n=document.getElementById(id); if(p && n && n.parentNode!==p) p.appendChild(n); }); }
  function render(){
    park(); var s=STEPS[idx]; progress(); window.scrollTo({top:0,behavior:'smooth'});

    if(s.type==='intro'){
      scene.innerHTML='<div class="hero"><span class="ic"></span><h1>Ce qui compte pour moi</h1><p>Compétence C1.3</p></div><div class="card"><p class="txt">'+s.text+'</p></div>';
      var b=document.createElement('button'); b.className='btn'; b.textContent='Commencer'; b.onclick=function(){ go(idx+1); }; scene.querySelector('.card').appendChild(b); return;
    }

    if(s.type==='pick'){
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div class="chips"></div><div class="hint"></div><div class="fb"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach+' '+s.q); };
      var chips=scene.querySelector('.chips'), hint=scene.querySelector('.hint'), fb=scene.querySelector('.fb'), sel=[];
      var cont=continueBtn('Valider mon choix →'); cont.disabled=true;
      function refresh(){ hint.textContent=sel.length+' sélectionné(s) — choisis-en '+s.min+' à '+s.max+'.'; cont.disabled=(sel.length<s.min||sel.length>s.max); }
      shuffle(s.options).forEach(function(o){
        var c=document.createElement('button'); c.className='chip'; c.textContent=o;
        c.onclick=function(){
          var i=sel.indexOf(o);
          if(i>=0){ sel.splice(i,1); c.classList.remove('on'); }
          else { if(sel.length>=s.max) return; sel.push(o); c.classList.add('on'); }
          refresh();
        };
        chips.appendChild(c);
      });
      cont.onclick=function(){ try{ if(window.CPSMoi) CPSMoi.carnet.noter({"code": "C1.3", "titre": "Mes valeurs et mes buts", "fam": "Penser et agir"}, "Mes valeurs", sel.join(', ')); }catch(e){} go(idx+1); };
      fb.innerHTML='<div class="msg win">'+s.done+'</div>'; fb.appendChild(cont);
      refresh();
      return;
    }

    if(s.type==='notion'){
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div class="opts"></div><div class="fb"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach+' '+s.q); };
      var opts=scene.querySelector('.opts'), fb=scene.querySelector('.fb'), done=false;
      shuffle(s.options).forEach(function(o){
        var b=document.createElement('button'); b.className='opt'; b.textContent=o.l;
        b.onclick=function(){
          if(done)return;
          if(o.ok){ done=true; opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); b.classList.add('ok'); fb.innerHTML='<div class="msg good">✓ '+s.good+'</div>'; fb.appendChild(continueBtn()); }
          else { b.classList.add('no'); b.disabled=true; fb.innerHTML='<div class="msg bad">'+s.wrong+' <strong>Réessaie.</strong></div>'; }
        };
        opts.appendChild(b);
      });
      return;
    }

    if(s.type==='cases'){
      var j=0;
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div id="cc"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach); };
      var area=scene.querySelector('#cc');
      function drawCase(){
        var it=s.items[j];
        area.innerHTML=(it.img?'<img class="jimg" src="'+it.img+'" alt="'+(it.alt||'')+'">':'')+'<p class="txt">'+it.text+'</p><div class="opts"></div><div class="fb"></div>';
        var opts=area.querySelector('.opts'), fb=area.querySelector('.fb'), done=false;
        shuffle(it.options).forEach(function(o){
          var b=document.createElement('button'); b.className='opt'; b.textContent=o.l;
          b.onclick=function(){
            if(done)return;
            if(o.good){ done=true; opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); b.classList.add('ok'); fb.innerHTML='<div class="msg good">✓ '+o.fb+'</div>'; var nb=document.createElement('button'); nb.className='btn'; nb.textContent=(j>=s.items.length-1)?'Continuer →':'Suivant →'; nb.onclick=function(){ if(j>=s.items.length-1){ go(idx+1);} else {j++; drawCase();} }; fb.appendChild(nb); }
            else { b.classList.add('no'); b.disabled=true; fb.innerHTML='<div class="msg bad">'+o.fb+' <strong>Réessaie.</strong></div>'; }
          };
          opts.appendChild(b);
        });
      }
      drawCase();
      return;
    }

    if(s.type==='perso'){
      scene.innerHTML='<div class="card"><p class="txt">'+s.text+'</p></div>';
      var pc=scene.querySelector('.card'), mp=document.getElementById('moi-perso'); if(mp) pc.appendChild(mp);
      pc.appendChild(continueBtn('Continuer →'));
      return;
    }

    if(s.type==='bilan'){
      var h='<div class="hero"><span class="ic"></span><h1>Bilan</h1><p>Tu sais ce qui compte pour toi.</p></div><div class="card"><p class="txt" style="font-size:1rem;font-weight:800;color:#1e40af">Ce que tu as appris :</p><ul class="recap">';
      s.recap.forEach(function(r){ h+='<li>'+r+'</li>'; });
      h+='</ul></div>';
      scene.innerHTML=h;
      var c=scene.querySelector('.card');
      var mf=document.getElementById('moi-fin'); if(mf) c.appendChild(mf);
      var rb=document.createElement('button'); rb.className='btn'; rb.textContent='Recommencer'; rb.onclick=function(){ go(0); }; c.appendChild(rb);
      var hb=document.createElement('a'); hb.className='btn soft'; hb.href='index.html'; hb.textContent='← Retour à l’accueil'; c.appendChild(hb);
      return;
    }
  }
  render();
})();
</script>
</body>
</html>
