CAP ; il tousse depuis un mois et se sent fatigué ; il a arrêté le sport il y a un an. Phrase « Il n'a pas de médecin traitant » : réponse « non »."},"adapte":{"indice":"Situation de Nolan : la phrase sur la toux, la phrase sur le sport, la phrase sur le médecin traitant.","explication":"Problème de santé : il tousse depuis un mois et il se sent fatigué. Il a arrêté le sport il y a un an. Phrase « Il n'a pas de médecin traitant » : réponse « non »."},"essentiel":{"indice":"Situation de Nolan : la phrase avec les mots « il y a un an ».","explication":"La situation dit : « Il a arrêté le sport il y a un an. » Réponse : le sport."}}},{"id":"a1_q2_tab","type":"tableau","data":{"titre":"","cells":[[{"type":"prof","content":"Les éléments de la situation"},{"type":"prof","content":"Ma réponse"}],[{"type":"prof","content":"La personne concernée par la situation"},{"type":"eleve","content":"","reponse":"Nolan, 18 ans, en première année de CAP."}],[{"type":"prof","content":"Le problème de santé de Nolan"},{"type":"eleve","content":"","reponse":"Il tousse depuis un mois et il se sent fatigué."}],[{"type":"prof","content":"Ce que Nolan a arrêté il y a un an"},{"type":"eleve","content":"","reponse":"Le sport."}],[{"type":"prof","content":"A-t-il un médecin traitant ?"},{"type":"eleve","content":"","reponse":"Non."}]],"table_student_style":"lines","variantes":{"adapte":{"cells":[[{"type":"prof","content":"Les éléments de la situation"},{"type":"prof","content":"Ma réponse"}],[{"type":"prof","content":"La personne concernée par la situation"},{"type":"prof","content":"Nolan, 18 ans, en première année de CAP."}],[{"type":"prof","content":"Le problème de santé de Nolan"},{"type":"eleve","content":"","reponse":"Il tousse depuis un mois et il se sent fatigué."}],[{"type":"prof","content":"Ce que Nolan a arrêté il y a un an"},{"type":"eleve","content":"","reponse":"Le sport."}],[{"type":"prof","content":"A-t-il un médecin traitant ?"},{"type":"eleve","content":"","reponse":"Non."}]]},"essentiel":{"cells":[[{"type":"prof","content":"Les éléments de la situation"},{"type":"prof","content":"Ma réponse"}],[{"type":"prof","content":"La personne concernée par la situation"},{"type":"prof","content":"Nolan, 18 ans, en première année de CAP."}],[{"type":"prof","content":"Le problème de santé de Nolan"},{"type":"prof","content":"Il tousse depuis un mois et il se sent fatigué."}],[{"type":"prof","content":"Ce que Nolan a arrêté il y a un an"},{"type":"eleve","content":"","reponse":"Le sport."}],[{"type":"prof","content":"A-t-il un médecin traitant ?"},{"type":"prof","content":"Non."}]]}}}},{"id":"a1_analyse2","type":"analyse","data":{"titre":"MOBILISER SES CONNAISSANCES"}},{"id":"a1_doc1","type":"document_texte_image","data":{"label":"DOC. 1","titre":"La santé, c'est trois choses","corps":"L'OMS est l'Organisation mondiale de la santé. Elle donne cette définition :\n\n**La santé est un état de complet bien-être physique, mental et social. Ce n'est pas seulement l'absence de maladie.**\n\nLa santé, c'est donc trois choses :\n• le **bien-être physique** : le corps va bien ;\n• le **bien-être mental** : les pensées et les émotions vont bien ;\n• le **bien-être social** : les relations avec les autres vont bien.","image_pos":"bas","source":"D'après l'OMS, Constitution de l'Organisation mondiale de la santé — définition reformulée pour la classe.","img":"cap_A1/images/systeme-sante_cap-a1-trois-bien-etre.jpg","img_desc":"Schéma « La santé = 3 bien-être » : trois pictogrammes alignés, chacun avec son titre sous l'image (Bien-être physique / Bien-être mental / Bien-être social), reliés par des signes + à un cadre central « LA SANTÉ ».","img_w":1400,"img_h":605}},{"id":"a1_q3","type":"classer","data":{"numero":"3","competence":"C1","titre":"","consigne":"À partir du document 1 : **classer** chaque exemple dans la bonne colonne.","categories":["Bien-être physique","Bien-être mental","Bien-être social"],"items":["Faire du sport","Avoir des amis","Être calme, sans stress","Bien manger","Parler avec sa famille","Avoir confiance en soi"],"classement":[0,2,1,0,2,1],"variantes":{"adapte":{"items":["Faire du sport","Avoir des amis","Être calme, sans stress","Bien manger"],"classement":[0,2,1,0]},"essentiel":{"items":["Faire du sport","Avoir des amis","Être calme, sans stress"],"classement":[0,2,1]}}},"el":{"standard":{"indice":"DOC. 1 : les trois lignes qui disent ce que veut dire chaque bien-être.","explication":"Le corps (faire du sport, bien manger) : bien-être physique. Les pensées et les émotions (être calme, sans stress ; avoir confiance en soi) : bien-être mental. Les relations avec les autres (avoir des amis, parler avec sa famille) : bien-être social."},"adapte":{"indice":"DOC. 1 : physique = le corps ; mental = les pensées et les émotions ; social = les relations avec les autres.","explication":"Faire du sport et bien manger : le corps, donc bien-être physique. Être calme, sans stress : les émotions, donc bien-être mental. Avoir des amis : les relations avec les autres, donc bien-être social."},"essentiel":{"indice":"DOC. 1 : physique = le corps ; mental = les émotions ; social = les autres.","explication":"Faire du sport : le corps, bien-être physique. Être calme : les émotions, bien-être mental. Avoir des amis : les autres, bien-être social."}}},{"id":"a1_doc2","type":"document_texte_image","data":{"label":"DOC. 2","titre":"Le capital santé et les facteurs","corps":"Chaque personne a un **capital santé** dès sa naissance : ce sont ses **ressources de santé**. Ce capital santé peut être protégé ou abîmé tout au long de la vie.\n\n**Les facteurs internes** viennent de la personne :\n• ses **gènes**, reçus de ses parents ;\n• son **âge** ;\n• ses **comportements** : le sport, l'alimentation, le sommeil, le tabac.\n\n**Les facteurs externes** viennent de ce qui entoure la personne :\n• la **pollution de l'air** ;\n• le **bruit** ;\n• le **logement** et les **conditions de travail**.\n\nQuelques effets connus :\n• la pollution de l'air peut provoquer des maladies du cœur et des poumons ;\n• le bruit peut provoquer des troubles du sommeil ;\n• le manque d'activité physique peut provoquer une prise de poids.","image_pos":"bas","source":"D'après Santé publique France et l'Agence européenne pour l'environnement — texte construit pour la classe.","img":"cap_A1/images/systeme-sante_cap-a1-capital-sante.jpg","img_desc":"Schéma « Le capital santé » : au centre un personnage et un bouclier contenant un cœur, légendé « CAPITAL SANTÉ ». À gauche un cadre bleu « FACTEURS INTERNES » (ADN, silhouette avec âge, chaussure de sport, assiette). À droite un cadre vert « FACTEURS EXTERNES » (voiture avec fumée, haut-parleur, immeuble, atelier). Flèches des deux cadres vers le centre.","img_w":1400,"img_h":641}},{"id":"a1_q4","type":"classer","data":{"numero":"4","competence":"C1","titre":"","consigne":"À partir de la situation de Nolan et du document 2 : **classer** chaque phrase dans la bonne colonne.","categories":["Facteur interne","Facteur externe"],"items":["Nolan a arrêté le sport.","Nolan habite au bord d'une route où passent beaucoup de voitures.","Nolan a 18 ans.","Il y a du bruit près de chez Nolan."],"classement":[0,1,0,1],"variantes":{"essentiel":{"items":["Nolan a arrêté le sport.","Nolan habite au bord d'une route où passent beaucoup de voitures."],"classement":[0,1]}}},"el":{"standard":{"indice":"DOC. 2 : la liste des facteurs internes et la liste des facteurs externes.","explication":"L'âge (18 ans) et l'arrêt du sport viennent de Nolan : ce sont des facteurs internes. La route avec beaucoup de voitures (pollution de l'air) et le bruit viennent de ce qui entoure Nolan : ce sont des facteurs externes."},"adapte":{"indice":"DOC. 2 : interne = vient de la personne ; externe = vient de ce qui entoure la personne.","explication":"Son âge et le sport viennent de Nolan : facteurs internes. La route et le bruit sont autour de Nolan : facteurs externes."},"essentiel":{"indice":"DOC. 2 : interne = vient de la personne ; externe = vient de ce qui l'entoure.","explication":"Le sport est un comportement de Nolan : facteur interne. La route avec beaucoup de voitures est autour de Nolan : facteur externe."}}},{"id":"a1_doc3","type":"document_texte_image","data":{"label":"DOC. 3","titre":"Les plans santé","corps":"Un **plan santé** est un programme de l'État. Il est mis en place pour **plusieurs années**.\nIl sert à faire de la **prévention** : agir avant la maladie pour protéger la population.\n\nExemples d'actions inscrites dans les plans santé :\n• aider les personnes à arrêter le tabac ;\n• faire bouger les jeunes : plus de sport à l'école ;\n• réduire la pollution de l'air ;\n• protéger les jeunes du bruit trop fort ;\n• vacciner la population.","image_pos":"bas","source":"D'après la Stratégie nationale de santé et le Plan national de santé publique, sante.gouv.fr — texte reformulé pour la classe.","img":"cap_A1/images/systeme-sante_cap-a1-plan-sante.jpg","img_desc":"Schéma « Un plan santé » : un dossier intitulé PLAN SANTÉ, une flèche vers cinq pictogrammes légendés (arrêt du tabac, sport à l'école, air propre, protection auditive, vaccination).","img_w":1400,"img_h":707}},{"id":"a1_q5","type":"question","data":{"competence":"C3","numero":"5","texte":"À partir de la situation de Nolan et du document 3 : **indiquer** deux actions des plans santé qui peuvent protéger la santé de Nolan.","lignes":2,"lignes_par_reponse":1,"style_lignes":"tirets_comptage","reponse_attendue":"Faire bouger les jeunes, plus de sport à l'école. Réduire la pollution de l'air.","support_type":"","niveaux":["standard","adapte"],"variantes":{"adapte":{"texte":"À partir de la situation de Nolan et du document 3 : **indiquer** deux actions des plans santé qui peuvent protéger la santé de Nolan : une action pour le sport, une action pour l'air ou le bruit."}}},"el":{"standard":{"indice":"Situation de Nolan : le sport et la route ; DOC. 3 : la liste des actions des plans santé.","explication":"Nolan a arrêté le sport : action « faire bouger les jeunes : plus de sport à l'école ». Il habite au bord d'une route avec beaucoup de voitures : action « réduire la pollution de l'air » ou « protéger les jeunes du bruit trop fort »."},"adapte":{"indice":"DOC. 3 : une action avec le mot « sport », une action avec le mot « air » ou « bruit ».","explication":"Pour le sport : faire bouger les jeunes, plus de sport à l'école. Pour la route : réduire la pollution de l'air, ou protéger les jeunes du bruit trop fort."}}},{"id":"a1_q5_ess","type":"qcm","data":{"numero":"5","competence":"C3","titre":"","consigne":"À partir de la situation de Nolan et du document 3 : **repérer** l'action des plans santé qui peut le protéger, en cochant la bonne réponse.","items":[{"question":"Nolan a arrêté le sport. Quelle action peut l'aider ?","options":["Faire bouger les jeunes : plus de sport à l'école","Vacciner la population","Aider à arrêter le tabac"],"reponse":0},{"question":"Nolan habite au bord d'une route où passent beaucoup de voitures. Quelle action peut le protéger ?","options":["Réduire la pollution de l'air","Vacciner la population","Aider à arrêter le tabac"],"reponse":0}],"niveaux":["essentiel"]},"el":{"essentiel":{"indice":"DOC. 3 : le mot « sport », puis le mot « air ».","explication":"Nolan a arrêté le sport : plus de sport à l'école peut l'aider. Il habite près d'une route avec beaucoup de voitures : réduire la pollution de l'air le protège. La situation ne parle ni de tabac, ni de vaccin."}}},{"id":"a1_notions_s1","type":"notions","data":{"items":[{"notion":"Santé (OMS)","definition":"État de complet bien-être physique, mental et social. Ce n'est pas seulement l'absence de maladie."},{"notion":"Capital santé","definition":"Ensemble des ressources de santé d'une personne, qu'elle peut préserver ou abîmer tout au long de sa vie."},{"notion":"Facteur interne","definition":"Élément qui vient de la personne et agit sur sa santé : gènes, âge, comportements."},{"notion":"Facteur externe","definition":"Élément qui vient de l'environnement et agit sur la santé : pollution, bruit, logement, travail."},{"notion":"Plan santé","definition":"Ensemble organisé d'actions de prévention mises en place par l'État pour protéger la santé de la population."},{"notion":"Prévention","definition":"Agir avant la maladie pour éviter qu'elle arrive."}]}},{"id":"a1_autoeval1","type":"auto_eval","data":{"questions":[{"type":"qcm","consigne":"Selon l'OMS, la santé c'est :","options":["seulement ne pas être malade","le bien-être physique, mental et social","seulement faire du sport"],"correct":"le bien-être physique, mental et social"},{"type":"qcm","consigne":"Un plan santé sert surtout à :","options":["protéger la santé de la population","rembourser les consultations","fabriquer les cartes Vitale"],"correct":"protéger la santé de la population"},{"type":"vf","consigne":"La pollution de l'air est un facteur externe.","options":["Vrai","Faux"],"correct":"Vrai"},{"type":"redige","consigne":"Nommer les ressources de santé que chaque personne possède dès sa naissance.","correct":"Le capital santé."},{"type":"redige","consigne":"Nommer les actions menées avant la maladie pour protéger la population.","correct":"La prévention."}],"remed_rouge":"0 à 2 bonnes réponses sur 5 : relire le document 1 (les trois bien-être) et le document 2 (facteurs internes et externes) avec le professeur.","remed_orange":"3 bonnes réponses sur 5 : revoir le document 2 (facteurs internes et externes) et le document 3 (rôle des plans santé).","remed_vert":"4 ou 5 bonnes réponses sur 5 : les notions de la séance 1 sont en place.","variantes":{"adapte":{"questions":[{"type":"qcm","consigne":"Selon l'OMS, la santé c'est :","options":["seulement ne pas être malade","le bien-être physique, mental et social","seulement faire du sport"],"correct":"le bien-être physique, mental et social"},{"type":"qcm","consigne":"Un plan santé sert surtout à :","options":["protéger la santé de la population","rembourser les consultations","fabriquer les cartes Vitale"],"correct":"protéger la santé de la population"},{"type":"vf","consigne":"La pollution de l'air est un facteur externe.","options":["Vrai","Faux"],"correct":"Vrai"},{"type":"qcm","consigne":"Comment appelle-t-on les ressources de santé de chaque personne ?","options":["Le capital santé","Le carnet de santé","La carte Vitale"],"correct":"Le capital santé"},{"type":"qcm","consigne":"Comment appelle-t-on les actions menées avant la maladie ?","options":["La prévention","Le remboursement","La cotisation"],"correct":"La prévention"}]},"essentiel":{"questions":[{"type":"qcm","consigne":"Selon l'OMS, la santé c'est :","options":["seulement ne pas être malade","le bien-être physique, mental et social","seulement faire du sport"],"correct":"le bien-être physique, mental et social"},{"type":"qcm","consigne":"Un plan santé sert surtout à :","options":["protéger la santé de la population","rembourser les consultations","fabriquer les cartes Vitale"],"correct":"protéger la santé de la population"},{"type":"vf","consigne":"La pollution de l'air est un facteur externe.","options":["Vrai","Faux"],"correct":"Vrai"},{"type":"qcm","consigne":"Comment appelle-t-on les ressources de santé de chaque personne ?","options":["Le capital santé","Le carnet de santé","La carte Vitale"],"correct":"Le capital santé"},{"type":"qcm","consigne":"Comment appelle-t-on les actions menées avant la maladie ?","options":["La prévention","Le remboursement","La cotisation"],"correct":"La prévention"}]}}},"el":{"seuils":{"rouge_max":2,"orange_max":3},"standard":[{"explication":"DOC. 1 : la santé est un état de complet bien-être physique, mental et social. Ce n'est pas seulement l'absence de maladie, ni seulement le sport.","renvoi":"DOC. 1 — La santé, c'est trois choses","renvoi_bloc":"a1_doc1","accepte":[]},{"explication":"DOC. 3 : un plan santé est un programme de l'État qui fait de la prévention pour protéger la population. Rembourser les soins est le rôle de l'Assurance maladie.","renvoi":"DOC. 3 — Les plans santé","renvoi_bloc":"a1_doc3","accepte":[]},{"explication":"La pollution de l'air vient de ce qui entoure la personne, pas de la personne elle-même : c'est un facteur externe.","renvoi":"DOC. 2 — Le capital santé et les facteurs","renvoi_bloc":"a1_doc2","accepte":[]},{"explication":"DOC. 2 : dès sa naissance, chaque personne a des ressources de santé. Ces ressources forment son capital santé.","renvoi":"DOC. 2 — Le capital santé et les facteurs","renvoi_bloc":"a1_doc2","accepte":["capital santé","capital sante","capital-santé","capital-sante"]},{"explication":"DOC. 3 : agir avant la maladie pour protéger la population, c'est la prévention.","renvoi":"DOC. 3 — Les plans santé","renvoi_bloc":"a1_doc3","accepte":["prévention","prevention","préventions"]}],"adapte":[{"explication":"DOC. 1 : la santé est un état de complet bien-être physique, mental et social. Ce n'est pas seulement l'absence de maladie, ni seulement le sport.","renvoi":"DOC. 1 — La santé, c'est trois choses","renvoi_bloc":"a1_doc1","accepte":[]},{"explication":"DOC. 3 : un plan santé est un programme de l'État qui fait de la prévention pour protéger la population. Rembourser les soins est le rôle de l'Assurance maladie.","renvoi":"DOC. 3 — Les plans santé","renvoi_bloc":"a1_doc3","accepte":[]},{"explication":"La pollution de l'air vient de ce qui entoure la personne : c'est un facteur externe.","renvoi":"DOC. 2 — Le capital santé et les facteurs","renvoi_bloc":"a1_doc2","accepte":[]},{"explication":"DOC. 2 : les ressources de santé de chaque personne forment son capital santé. Le carnet de santé et la carte Vitale sont des documents.","renvoi":"DOC. 2 — Le capital santé et les facteurs","renvoi_bloc":"a1_doc2","accepte":[]},{"explication":"DOC. 3 : agir avant la maladie, c'est la prévention. Le remboursement et la cotisation concernent la Sécurité sociale.","renvoi":"DOC. 3 — Les plans santé","renvoi_bloc":"a1_doc3","accepte":[]}],"essentiel":[{"explication":"DOC. 1 : la santé, c'est le bien-être physique, mental et social. Ne pas être malade ne suffit pas.","renvoi":"DOC. 1 — La santé, c'est trois choses","renvoi_bloc":"a1_doc1","accepte":[]},{"explication":"DOC. 3 : un plan santé sert à protéger la santé de la population. L'Assurance maladie rembourse les soins.","renvoi":"DOC. 3 — Les plans santé","renvoi_bloc":"a1_doc3","accepte":[]},{"explication":"La pollution de l'air est autour de la personne : facteur externe.","renvoi":"DOC. 2 — Le capital santé et les facteurs","renvoi_bloc":"a1_doc2","accepte":[]},{"explication":"DOC. 2 : les ressources de santé d'une personne forment son capital santé.","renvoi":"DOC. 2 — Le capital santé et les facteurs","renvoi_bloc":"a1_doc2","accepte":[]},{"explication":"DOC. 3 : agir avant la maladie, c'est la prévention.","renvoi":"DOC. 3 — Les plans santé","renvoi_bloc":"a1_doc3","accepte":[]}]}},{"id":"a1_saut1","type":"saut_page","data":{}},{"id":"a1_seance2","type":"seance","data":{"numero":"2","titre":"Le système solidaire de soins","objectif":"Être capable d'expliquer le fonctionnement du parcours de soins.","competences":["C1","C4","C5"]}},{"id":"a1_doc4","type":"document_texte_image","data":{"label":"DOC. 4","titre":"La Sécurité sociale et la solidarité","corps":"Les **travailleurs** et les **employeurs** versent chaque mois de l'argent à la **Sécurité sociale** : ce sont les **cotisations**. L'État verse aussi de l'argent.\n\nAvec cet argent, la Sécurité sociale aide toute la population : les malades, les accidentés du travail, les familles, les personnes âgées.\n\nC'est la **solidarité nationale** : chacun donne selon ses moyens, chacun reçoit selon ses besoins.\n\nL'**Assurance maladie** est la partie de la Sécurité sociale qui **rembourse les soins**.","image_pos":"bas","source":"D'après securite-sociale.fr et ameli.fr — texte reformulé pour la classe.","img":"cap_A1/images/systeme-sante_cap-a1-solidarite.jpg","img_desc":"Schéma de flux « La solidarité » : en haut trois groupes légendés (Les travailleurs / Les employeurs / L'État) avec des flèches et des pièces qui descendent vers un cadre central « SÉCURITÉ SOCIALE » ; du cadre partent quatre flèches vers quatre pictogrammes légendés (Les malades / Les accidentés du travail / Les familles / Les personnes âgées).","img_w":1314,"img_h":1653}},{"id":"a1_q6","type":"texte_trous","data":{"numero":"1","competence":"C1","titre":"","consigne":"À partir du document 4 : **compléter** le texte avec les mots : Assurance maladie – cotisations – solidarité.","texte":"Les travailleurs et les employeurs versent des {{cotisations}} à la Sécurité sociale. La Sécurité sociale protège toute la population : c'est la {{solidarité}} nationale. L'{{Assurance maladie}} rembourse les soins.","niveaux":["standard","adapte"],"variantes":{"adapte":{"consigne":"À partir du document 4 : **compléter** le texte avec les mots : cotisations – solidarité.","texte":"Les travailleurs et les employeurs versent des {{cotisations}} à la Sécurité sociale. La Sécurité sociale protège toute la population : c'est la {{solidarité}} nationale. L'Assurance maladie rembourse les soins."}}},"el":{"standard":{"indice":"DOC. 4 : les mots en gras, dans le même ordre que les phrases du texte.","explication":"L'argent versé chaque mois par les travailleurs et les employeurs : les **cotisations**. Aider toute la population : la **solidarité** nationale. La partie de la Sécurité sociale qui rembourse les soins : l'**Assurance maladie**."},"adapte":{"indice":"DOC. 4 : les mots en gras du premier et du troisième paragraphe.","explication":"L'argent versé chaque mois à la Sécurité sociale : les **cotisations**. Aider toute la population : la **solidarité** nationale."}}},{"id":"a1_q6_ess","type":"qcm","data":{"numero":"1","competence":"C1","titre":"","consigne":"À partir du document 4 : **repérer** la bonne réponse en la cochant.","items":[{"question":"Qui verse des cotisations à la Sécurité sociale ?","options":["Les travailleurs et les employeurs","Les élèves","Les magasins"],"reponse":0},{"question":"Qui rembourse les soins ?","options":["L'Assurance maladie","La mairie","L'école"],"reponse":0}],"niveaux":["essentiel"]},"el":{"essentiel":{"indice":"DOC. 4 : la première phrase et la dernière phrase.","explication":"DOC. 4 : les travailleurs et les employeurs versent les cotisations. L'Assurance maladie rembourse les soins. Les élèves, les magasins, la mairie et l'école ne sont pas cités."}}},{"id":"a1_doc5","type":"document_texte_image","data":{"label":"DOC. 5","titre":"Le parcours de soins coordonnés","corps":"À partir de **16 ans**, chaque personne choisit un **médecin traitant** et le déclare à l'Assurance maladie.\n\nLe **parcours de soins coordonnés**, c'est consulter d'abord son médecin traitant. Si c'est nécessaire, il envoie le patient chez un spécialiste.\nLe patient est alors mieux suivi et **mieux remboursé**.\n\nUne consultation chez le médecin généraliste coûte **30 €**.\n• Avec un médecin traitant déclaré : l'Assurance maladie rembourse **19 €**.\n• Sans médecin traitant déclaré : l'Assurance maladie rembourse **8,40 €**.\n\nCes montants concernent les personnes majeures.\n\nQuelques spécialistes peuvent être consultés directement, sans passer par le médecin traitant : ophtalmologue, gynécologue, psychiatre, stomatologue.","image_pos":"bas","source":"ameli.fr, Le rôle du médecin traitant et le parcours de soins coordonnés ; La participation forfaitaire de 2 €. Tarif du généraliste de secteur 1 : 30 €. Remboursement de 19 € = 70 % de 30 € moins 2 € de participation forfaitaire. Sans médecin traitant déclaré : 70 % de 30 € moins 10,60 € de majoration et 2 € de participation forfaitaire, soit 8,40 €.","img":"cap_A1/images/systeme-sante_cap-a1-parcours-soins.jpg","img_desc":"Schéma en deux temps. Partie haute : un patient → flèche « consulte » → un médecin traitant → flèche « oriente » → un médecin spécialiste. Partie basse : deux colonnes comparées, « Avec médecin traitant déclaré » et « Sans médecin traitant déclaré », chacune avec un billet de 30 € et le montant remboursé écrit en chiffres (19 € / 8,40 €).","img_w":1286,"img_h":1428}},{"id":"a1_q7","type":"question","data":{"competence":"C1","numero":"2","texte":"À partir du document 5 : **compléter** le tableau des remboursements.","lignes":0,"style_lignes":"tiret_guide","reponse_attendue":"Somme remboursée par l'Assurance maladie : 19 € avec un médecin traitant déclaré ; 8,40 € sans médecin traitant déclaré. — Somme qui reste à payer : 11 € avec un médecin traitant déclaré ; 21,60 € sans médecin traitant déclaré.","support_type":"","niveaux":["standard","adapte"]},"el":{"standard":{"indice":"DOC. 5 : les deux montants remboursés en gras, puis une soustraction à partir de 30 €.","explication":"Sommes remboursées, lues dans le DOC. 5 : 19 € avec un médecin traitant déclaré, 8,40 € sans. Reste à payer : 30 − 19 = 11 € ; 30 − 8,40 = 21,60 €."},"adapte":{"indice":"DOC. 5 : les deux montants remboursés en gras ; pour le reste à payer, même calcul que 30 − 19 = 11 €.","explication":"Sommes remboursées : 19 € avec un médecin traitant déclaré, 8,40 € sans. Reste à payer sans médecin traitant : 30 − 8,40 = 21,60 €."}}},{"id":"a1_q7_tab","type":"tableau","data":{"titre":"","cells":[[{"type":"prof","content":"Consultation à 30 €"},{"type":"prof","content":"Avec un médecin traitant déclaré"},{"type":"prof","content":"Sans médecin traitant déclaré"}],[{"type":"prof","content":"Somme remboursée par l'Assurance maladie"},{"type":"eleve","content":"","reponse":"19 €"},{"type":"eleve","content":"","reponse":"8,40 €"}],[{"type":"prof","content":"Somme qui reste à payer"},{"type":"eleve","content":"","reponse":"11 €"},{"type":"eleve","content":"","reponse":"21,60 €"}]],"table_student_style":"lines","niveaux":["standard","adapte"],"variantes":{"adapte":{"cells":[[{"type":"prof","content":"Consultation à 30 €"},{"type":"prof","content":"Avec un médecin traitant déclaré"},{"type":"prof","content":"Sans médecin traitant déclaré"}],[{"type":"prof","content":"Somme remboursée par l'Assurance maladie"},{"type":"eleve","content":"","reponse":"19 €"},{"type":"eleve","content":"","reponse":"8,40 €"}],[{"type":"prof","content":"Somme qui reste à payer"},{"type":"prof","content":"11 €"},{"type":"eleve","content":"","reponse":"21,60 €"}]]}}}},{"id":"a1_q7_ess","type":"qcm","data":{"numero":"2","competence":"C1","titre":"","consigne":"À partir du document 5 : **relever** la somme remboursée en la cochant. La consultation coûte 30 €.","items":[{"question":"AVEC un médecin traitant déclaré, l'Assurance maladie rembourse :","options":["19 €","8,40 €"],"reponse":0},{"question":"SANS médecin traitant déclaré, l'Assurance maladie rembourse :","options":["19 €","8,40 €"],"reponse":1}],"niveaux":["essentiel"]},"el":{"essentiel":{"indice":"DOC. 5 : la ligne « Avec un médecin traitant déclaré » et la ligne « Sans médecin traitant déclaré ».","explication":"Avec un médecin traitant déclaré : 19 € remboursés. Sans médecin traitant déclaré : 8,40 € seulement. Reste à payer : 30 − 19 = 11 € et 30 − 8,40 = 21,60 €."}}},{"id":"a1_q7_ess_tab","type":"tableau","data":{"titre":"","cells":[[{"type":"prof","content":"Consultation à 30 €"},{"type":"prof","content":"Avec un médecin traitant déclaré"},{"type":"prof","content":"Sans médecin traitant déclaré"}],[{"type":"prof","content":"Somme qui reste à payer"},{"type":"prof","content":"11 €"},{"type":"prof","content":"21,60 €"}]],"niveaux":["essentiel"]}},{"id":"a1_q8","type":"question","data":{"competence":"C5","numero":"3","texte":"À partir du document 5 : **justifier** l'intérêt pour Nolan de déclarer un médecin traitant.","lignes":2,"style_lignes":"tiret_guide","reponse_attendue":"Nolan a intérêt à déclarer un médecin traitant car il sera mieux remboursé : 19 € au lieu de 8,40 € pour une consultation à 30 €.","support_type":"","niveaux":["standard","adapte"],"variantes":{"adapte":{"texte":"À partir du document 5 : **justifier** l'intérêt pour Nolan de déclarer un médecin traitant, en utilisant les sommes remboursées du tableau."}}},"el":{"standard":{"indice":"DOC. 5 : les mots « mieux suivi » et « mieux remboursé », et les deux montants remboursés.","explication":"Avec un médecin traitant déclaré, Nolan est mieux remboursé : 19 € au lieu de 8,40 € pour une consultation à 30 €. Il est aussi mieux suivi : le médecin traitant l'envoie chez un spécialiste si c'est nécessaire."},"adapte":{"indice":"Tableau des remboursements : la somme remboursée avec et sans médecin traitant déclaré.","explication":"Pour une consultation à 30 €, Nolan reçoit 19 € avec un médecin traitant déclaré, et seulement 8,40 € sans. Déclarer un médecin traitant : être mieux remboursé."}}},{"id":"a1_q8_ess","type":"qcm","data":{"numero":"3","competence":"C5","titre":"","consigne":"À partir du document 5 : **justifier** l'intérêt pour Nolan de déclarer un médecin traitant, en cochant les deux bonnes réponses.","items":[{"question":"En déclarant un médecin traitant, Nolan sera :","options":["mieux remboursé","moins remboursé","pas remboursé"],"reponse":0},{"question":"Pour une consultation à 30 €, il recevra :","options":["19 € au lieu de 8,40 €","8,40 € au lieu de 19 €"],"reponse":0}],"niveaux":["essentiel"]},"el":{"essentiel":{"indice":"DOC. 5 : la phrase avec « mieux remboursé » et les deux montants.","explication":"DOC. 5 : avec un médecin traitant déclaré, le patient est mieux remboursé. Pour 30 €, Nolan reçoit 19 € au lieu de 8,40 €."}}},{"id":"a1_doc6","type":"document_texte_image","data":{"label":"DOC. 6","titre":"La carte Vitale et Mon espace santé","corps":"**La carte Vitale**\n• Elle est **gratuite** et **personnelle**.\n• Elle peut être demandée dès 15 ans. À **16 ans**, l'Assurance maladie envoie le formulaire pour l'obtenir.\n• Elle prouve que la personne est assurée.\n• Elle permet d'être **remboursé plus vite**, sans envoyer de papier.\n• Dans certaines situations, elle permet le **tiers payant** : ne pas avancer la part payée par l'Assurance maladie.\n\n**Mon espace santé et le dossier médical partagé (DMP)**\n• C'est un carnet de santé sur Internet.\n• On y trouve les traitements, les résultats d'examens et les vaccins.\n• Le patient et les professionnels de santé autorisés peuvent le consulter.\n• Il aide les médecins à mieux soigner le patient.","image_pos":"bas","source":"ameli.fr, La carte Vitale ; Mon espace santé, le carnet de santé numérique — textes reformulés pour la classe.","img":"cap_A1/images/systeme-sante_cap-a1-carte-vitale-dmp.jpg","img_desc":"Deux encadrés côte à côte. À gauche : une carte à puce verte de type carte d'assurance maladie, avec trois pictogrammes légendés (gratuite / personnelle / remboursement plus rapide). À droite : un smartphone affichant un dossier médical, avec trois pictogrammes légendés (traitements / résultats d'examens / vaccins).","img_w":1400,"img_h":785}},{"id":"a1_q9","type":"question","data":{"competence":"C1","numero":"4","texte":"À partir du document 6 : **repérer** les phrases exactes en cochant Vrai ou Faux.","lignes":0,"style_lignes":"tiret_guide","reponse_attendue":"La carte Vitale est gratuite : vrai. — La carte Vitale permet d'être remboursé plus vite : vrai. — La carte Vitale sert à payer le médecin : faux. — Mon espace santé contient les résultats d'examens : vrai. — Tout le monde peut regarder Mon espace santé d'une personne : faux.","support_type":"","variantes":{"adapte":{"reponse_attendue":"La carte Vitale est gratuite : vrai. — La carte Vitale permet d'être remboursé plus vite : vrai. — La carte Vitale sert à payer le médecin : faux. — Mon espace santé contient les résultats d'examens : vrai."},"essentiel":{"reponse_attendue":"La carte Vitale permet d'être remboursé plus vite : vrai. — La carte Vitale sert à payer le médecin : faux. — Mon espace santé contient les résultats d'examens : vrai."}}},"el":{"standard":{"indice":"DOC. 6 : l'encadré « La carte Vitale » et l'encadré « Mon espace santé ».","explication":"La carte Vitale est gratuite et permet d'être remboursé plus vite ; elle ne sert pas à payer le médecin, elle prouve que la personne est assurée. Mon espace santé contient les résultats d'examens ; seuls le patient et les professionnels de santé autorisés peuvent le consulter."},"adapte":{"indice":"DOC. 6 : l'encadré « La carte Vitale » et l'encadré « Mon espace santé ».","explication":"La carte Vitale est gratuite et permet d'être remboursé plus vite. Elle ne sert pas à payer le médecin : elle prouve que la personne est assurée. Mon espace santé contient les résultats d'examens."},"essentiel":{"indice":"DOC. 6 : les points de la liste sur la carte Vitale et sur Mon espace santé.","explication":"La carte Vitale permet d'être remboursé plus vite. Elle ne sert pas à payer : elle prouve que la personne est assurée. Mon espace santé contient les résultats d'examens."}}},{"id":"a1_q9_vf","type":"vrai_faux","data":{"label1":"Vrai","label2":"Faux","items":[{"texte":"La carte Vitale est gratuite.","answer":"vrai"},{"texte":"La carte Vitale permet d'être remboursé plus vite.","answer":"vrai"},{"texte":"La carte Vitale sert à payer le médecin.","answer":"faux"},{"texte":"Mon espace santé contient les résultats d'examens.","answer":"vrai"},{"texte":"Tout le monde peut regarder Mon espace santé d'une personne.","answer":"faux"}],"variantes":{"adapte":{"items":[{"texte":"La carte Vitale est gratuite.","answer":"vrai"},{"texte":"La carte Vitale permet d'être remboursé plus vite.","answer":"vrai"},{"texte":"La carte Vitale sert à payer le médecin.","answer":"faux"},{"texte":"Mon espace santé contient les résultats d'examens.","answer":"vrai"}]},"essentiel":{"items":[{"texte":"La carte Vitale permet d'être remboursé plus vite.","answer":"vrai"},{"texte":"La carte Vitale sert à payer le médecin.","answer":"faux"},{"texte":"Mon espace santé contient les résultats d'examens.","answer":"vrai"}]}}},"el":{"standard":{"indice":"DOC. 6 : l'encadré « La carte Vitale » et l'encadré « Mon espace santé ».","explication":"La carte Vitale est gratuite et permet d'être remboursé plus vite ; elle ne sert pas à payer le médecin, elle prouve que la personne est assurée. Mon espace santé contient les résultats d'examens ; seuls le patient et les professionnels de santé autorisés peuvent le consulter."},"adapte":{"indice":"DOC. 6 : l'encadré « La carte Vitale » et l'encadré « Mon espace santé ».","explication":"La carte Vitale est gratuite et permet d'être remboursé plus vite. Elle ne sert pas à payer le médecin : elle prouve que la personne est assurée. Mon espace santé contient les résultats d'examens."},"essentiel":{"indice":"DOC. 6 : les points de la liste sur la carte Vitale et sur Mon espace santé.","explication":"La carte Vitale permet d'être remboursé plus vite. Elle ne sert pas à payer : elle prouve que la personne est assurée. Mon espace santé contient les résultats d'examens."}}},{"id":"a1_analyse3","type":"analyse","data":{"titre":"PROPOSER DES SOLUTIONS"}},{"id":"a1_q10","type":"question","data":{"competence":"C4","numero":"5","texte":"À partir de la situation de Nolan et des documents 3, 5 et 6 : **proposer** deux actions que Nolan peut faire pour prendre soin de sa santé.","lignes":2,"lignes_par_reponse":2,"style_lignes":"tirets_comptage","reponse_attendue":"Déclarer un médecin traitant à l'Assurance maladie. Reprendre une activité physique.","support_type":"","niveaux":["standard","adapte"],"variantes":{"adapte":{"texte":"À partir de la situation de Nolan et des documents 3, 5 et 6 : **proposer** deux actions que Nolan peut faire : une action pour son corps, une action pour être mieux remboursé."}}},"el":{"standard":{"indice":"Situation de Nolan : le sport arrêté, l'absence de médecin traitant, la toux ; DOC. 3, 5 et 6 : les actions possibles.","explication":"Nolan n'a pas de médecin traitant : en déclarer un à l'Assurance maladie permet d'être mieux suivi et mieux remboursé (DOC. 5). Il a arrêté le sport : reprendre une activité physique protège son
