e l'entreprise, entre des personnes ou entre des équipes : harcèlement moral, harcèlement sexuel, conflits exacerbés. Le code du travail interdit le harcèlement moral, défini comme des agissements répétés qui ont pour objet ou pour effet une dégradation des conditions de travail susceptible de porter atteinte aux droits et à la dignité du salarié, d'altérer sa santé physique ou mentale ou de compromettre son avenir professionnel (article L. 1152-1). Il interdit de la même façon le harcèlement sexuel : des propos ou comportements à connotation sexuelle ou sexiste répétés (article L. 1153-1).\n\n**Les violences externes.** Elles sont commises contre un salarié par des personnes extérieures à l'entreprise : insultes, menaces, agressions.\n\nCes trois familles peuvent être induites par l'activité elle-même ou générées par l'organisation du travail et les relations de travail.","source":"D'après l'INRS et le code du travail, articles L. 1152-1 et L. 1153-1.","variantes":{"essentiel":{"corps":"**Le stress au travail.** Il apparaît quand les **contraintes** du travail sont perçues comme plus fortes que les **ressources** du salarié pour y faire face.\n\n**Les violences internes.** Elles sont commises à l'intérieur de l'entreprise, entre des personnes ou entre des équipes : **harcèlement moral**, **harcèlement sexuel**, conflits exacerbés.\n\n**Les violences externes.** Elles sont commises contre un salarié par des personnes **extérieures à l'entreprise** : insultes, menaces, agressions."}}}},{"id":"c9_s2_q1","type":"question_chapeau","data":{"numero":"1","texte":"À partir du document 4 :","reponse_attendue":"","explication":""}},{"id":"c9_s2_q1_1","type":"sous_question","data":{"competence":"C1","numero":"1.1","texte":"**Relever** les trois familles de risques psychosociaux.","lignes":3,"style_lignes":"tirets_comptage","support_type":"","indice":"","reponse_attendue":"– Le stress au travail.\n– Les violences internes.\n– Les violences externes.","explication":"","lignes_par_reponse":1,"variantes":{"adapte":{"indice":"Chaque famille ouvre un paragraphe, en gras."},"essentiel":{"texte":"**Relever** les trois familles de risques psychosociaux.\n– Le ………………………… au travail.\n– Les violences ………………………… .\n– Les violences ………………………… .","lignes":0,"style_lignes":"","indice":"Chaque famille ouvre un paragraphe, en gras."}}},"el":{"standard":{"indice":"DOC. 4 : chaque famille ouvre un paragraphe et est écrite en gras.","explication":"Les trois familles sont le stress au travail, les violences internes et les violences externes.","cherche":[{"bloc":"c9_s2_doc4","texte":"Le stress au travail."},{"bloc":"c9_s2_doc4","texte":"Les violences internes."},{"bloc":"c9_s2_doc4","texte":"Les violences externes."}]},"adapte":{"indice":"DOC. 4 : chaque famille ouvre un paragraphe, en gras.","explication":"Les trois familles sont le stress au travail, les violences internes et les violences externes.","cherche":[{"bloc":"c9_s2_doc4","texte":"Le stress au travail."},{"bloc":"c9_s2_doc4","texte":"Les violences internes."},{"bloc":"c9_s2_doc4","texte":"Les violences externes."}]},"essentiel":{"indice":"DOC. 4 : chaque famille ouvre un paragraphe, en gras. Un mot par blanc.","explication":"Les trois familles sont le stress au travail, les violences internes et les violences externes.","trous":["stress","internes","externes"],"cherche":[{"bloc":"c9_s2_doc4","texte":"Le stress au travail."},{"bloc":"c9_s2_doc4","texte":"Les violences internes."},{"bloc":"c9_s2_doc4","texte":"Les violences externes."}]}}},{"id":"c9_s2_q1_2","type":"relier","data":{"numero":"1.2","competence":"C1","titre":"","consigne":"**Classer** chaque situation dans la famille de risques psychosociaux correspondante.","gauche":["Un client insulte une caissière à cause de l'attente.","Un salarié tient deux postes sans savoir à quelle heure il finira.","Un responsable tient chaque semaine des propos qui rabaissent un salarié.","Un usager menace un agent d'accueil.","Deux équipes de l'entreprise sont en conflit ouvert depuis des mois.","Les objectifs demandés sont irréalisables avec les moyens donnés."],"droite":["Violences internes","Violences externes","Stress au travail"],"correspondances":[1,2,0,1,0,2]},"el":{"standard":{"indice":"Pour chaque situation, se demander : l'acte vient-il d'une personne de l'entreprise, d'une personne extérieure, ou bien est-ce le travail lui-même qui pèse ?","explication":"Les insultes d'un client et les menaces d'un usager viennent de l'extérieur : violences externes. Les propos répétés d'un responsable et le conflit entre deux équipes viennent de l'intérieur : violences internes. Tenir deux postes sans horaires connus et recevoir des objectifs irréalisables créent un déséquilibre entre contraintes et ressources : stress au travail.","cherche":[{"bloc":"c9_s2_doc4","texte":"commises à l'intérieur de l'entreprise"},{"bloc":"c9_s2_doc4","texte":"commises contre un salarié par des personnes"}]},"adapte":{"indice":"Pour chaque situation, se demander : l'acte vient-il d'une personne de l'entreprise, d'une personne extérieure, ou bien est-ce le travail lui-même qui pèse ?","explication":"Les insultes d'un client et les menaces d'un usager viennent de l'extérieur : violences externes. Les propos répétés d'un responsable et le conflit entre deux équipes viennent de l'intérieur : violences internes. Tenir deux postes sans horaires connus et recevoir des objectifs irréalisables créent un déséquilibre entre contraintes et ressources : stress au travail.","cherche":[{"bloc":"c9_s2_doc4","texte":"commises à l'intérieur de l'entreprise"},{"bloc":"c9_s2_doc4","texte":"commises contre un salarié par des personnes"}]},"essentiel":{"indice":"Pour chaque situation, se demander : l'acte vient-il d'une personne de l'entreprise, d'une personne extérieure, ou bien est-ce le travail lui-même qui pèse ?","explication":"Les insultes d'un client et les menaces d'un usager viennent de l'extérieur : violences externes. Les propos répétés d'un responsable et le conflit entre deux équipes viennent de l'intérieur : violences internes. Tenir deux postes sans horaires connus et recevoir des objectifs irréalisables créent un déséquilibre entre contraintes et ressources : stress au travail.","cherche":[{"bloc":"c9_s2_doc4","texte":"commises à l'intérieur de l'entreprise"},{"bloc":"c9_s2_doc4","texte":"commises contre un salarié par des personnes"}]}}},{"id":"c9_s2_q1_3","type":"sous_question","data":{"competence":"C3","numero":"1.3","texte":"**Expliquer** ce qui provoque un état de stress chez un salarié.","lignes":2,"style_lignes":"tiret_guide","support_type":"","indice":"","reponse_attendue":"Le stress apparaît quand les contraintes du travail sont perçues comme plus fortes que les ressources pour y faire face.","explication":"","variantes":{"adapte":{"texte":"**Expliquer** ce qui provoque un état de stress chez un salarié, en complétant la phrase.\nLe stress apparaît quand les ……………………………………… du travail sont perçues comme plus fortes que les ……………………………………… du salarié.","lignes":0,"reponse_attendue":"Le stress apparaît quand les contraintes du travail sont perçues comme plus fortes que les ressources du salarié.","indice":"Les deux mots manquants sont dans la première phrase du document 4."},"essentiel":{"texte":"**Expliquer** ce qui provoque un état de stress chez un salarié, en cochant la proposition exacte.\n☐ Le salarié n'aime pas son métier.\n☐ Les contraintes du travail sont perçues comme plus fortes que les ressources du salarié.\n☐ Le salarié travaille depuis moins d'un an dans l'entreprise.","lignes":0,"reponse_attendue":"Les contraintes du travail sont perçues comme plus fortes que les ressources du salarié.","indice":"Une seule proposition parle à la fois des contraintes et des ressources."}}},"el":{"standard":{"indice":"DOC. 4 : la première phrase du paragraphe sur le stress au travail.","explication":"Le stress apparaît quand les contraintes du travail sont perçues comme plus fortes que les ressources dont le salarié dispose pour y faire face.","cherche":[{"bloc":"c9_s2_doc4","texte":"un déséquilibre entre la perception qu'une personne a des contraintes de son environnement de travail"}]},"adapte":{"indice":"DOC. 4 : les deux mots manquants sont dans la première phrase du document.","explication":"Le stress apparaît quand les contraintes du travail sont perçues comme plus fortes que les ressources du salarié.","trous":["contraintes","ressources"],"cherche":[{"bloc":"c9_s2_doc4","texte":"un déséquilibre entre la perception qu'une personne a des contraintes de son environnement de travail"}]},"essentiel":{"indice":"DOC. 4 : une seule proposition parle à la fois des contraintes et des ressources.","explication":"Le stress apparaît quand les contraintes du travail sont perçues comme plus fortes que les ressources du salarié.","cherche":[{"bloc":"c9_s2_doc4","texte":"contraintes"},{"bloc":"c9_s2_doc4","texte":"ressources"}]}}},{"id":"c9_s2_doc5","type":"document_texte_image","data":{"label":"DOC. 5","titre":"Les six familles de facteurs de risques psychosociaux","cadre":true,"source":"D'après l'INRS, Facteurs de risques psychosociaux (rapport du collège d'expertise Gollac).","corps":"Ces facteurs se cumulent : la présence de plusieurs d'entre eux dans une même situation de travail est un élément aggravant.","variantes":{"essentiel":{"corps":"**Plusieurs facteurs présents en même temps aggravent la situation.**"}},"img":"bcp_term_C9/images/C9_six_familles_facteurs_RPS.jpg","img_desc":"Illustration des six familles de facteurs de risques psychosociaux, présentées dans six cadres, trois en haut et trois en bas. 1. INTENSITÉ ET TEMPS DE TRAVAIL, illustrée par une pile de dossiers et une horloge : trop de travail ; horaires imprévisibles ; délai à respecter. 2. EXIGENCES ÉMOTIONNELLES, illustrée par une employée soucieuse entre deux bulles de dialogue, l'une souriante, l'autre en colère : gérer le contact avec le public ; rester calme et souriant ; cacher ses émotions. 3. MANQUE D'AUTONOMIE, illustrée par un salarié hésitant devant un panneau à deux directions, l'une barrée d'une croix, l'autre cochée : peu de choix dans l'organisation ; peu de possibilités de décider ; travail très contrôlé. 4. RAPPORTS SOCIAUX DÉGRADÉS, illustrée par une salariée isolée face à des collègues fermés et un responsable qui la pointe du doigt : peu de soutien des collègues ou de l'encadrement ; manque de reconnaissance ; conflits, tensions. 5. CONFLITS DE VALEURS, illustrée par un salarié songeur et une balance dans une bulle de pensée : devoir faire un travail contraire à ses valeurs ; avoir l'impression de mal faire son travail. 6. INSÉCURITÉ DE LA SITUATION DE TRAVAIL, illustrée par une salariée inquiète devant un contrat marqué d'un point d'interrogation : incertitude sur l'emploi ; changements fréquents ; réorganisation, avenir peu clair.","img_w":1536,"img_h":1024,"image_pos":"bas"}},{"id":"c9_s2_q2","type":"question_chapeau","data":{"numero":"2","texte":"À partir de la situation de Léa et du document 5 :","reponse_attendue":"","explication":""}},{"id":"c9_s2_q2_1","type":"sous_question","data":{"competence":"C2","numero":"2.1","texte":"**Compléter** le tableau des facteurs de risques psychosociaux présents dans le travail de Léa.","lignes":0,"style_lignes":"","support_type":"","indice":"","reponse_attendue":"Intensité et temps de travail : Deux collègues non remplacés et des horaires connus la veille au soir. • Exigences émotionnelles : Rester souriante quelles que soient les remarques des clients. • Manque d'autonomie : Ses propositions sur la mise en rayon sont refusées. • Rapports sociaux dégradés : Son travail n'est commenté que lorsqu'une erreur est constatée. • Conflits de valeurs : Annoncer aux clients une livraison qu'elle sait déjà annulée. • Insécurité de la situation de travail : La réorganisation prévue en janvier prochain, sans savoir quels postes seront conservés.","explication":"","variantes":{"adapte":{"indice":"Les éléments à releve  et l'entreprise, et Stress au travail — Conséquences pour l'entreprise.","variantes":{"essentiel":{"corps":"Les risques psychosociaux ont aussi des conséquences pour l'entreprise :\n- une augmentation de l'**absentéisme** et du **turn-over**, c'est-à-dire du nombre de départs ;\n- des **difficultés pour remplacer le personnel ou recruter** de nouveaux employés ;\n- une augmentation des accidents du travail ;\n- une baisse de la productivité ;\n- une dégradation du **climat social**, c'est-à-dire des relations et de l'ambiance de travail ;\n- des atteintes à l'image de l'entreprise.\n\nCes conséquences représentent un **coût** pour l'entreprise."}}}},{"id":"c9_s3_q1","type":"question_chapeau","data":{"numero":"1","texte":"À partir de la situation de Léa et du document 6 :","reponse_attendue":"","explication":""}},{"id":"c9_s3_q1_1","type":"sous_question","data":{"competence":"C2","numero":"1.1","texte":"**Compléter** le tableau en nommant la conséquence pour l'entreprise.","lignes":0,"style_lignes":"","support_type":"","indice":"","reponse_attendue":"Quatre salariés ont été arrêtés depuis le début de l'année. : Une augmentation de l'absentéisme. • Deux salariés ont démissionné. : Une augmentation du turn-over. • Le responsable n'arrive pas à recruter. : Des difficultés pour recruter de nouveaux employés.","explication":"","variantes":{"adapte":{"indice":"Les trois conséquences sont nommées dans les deux premières lignes de la liste du document 6.","reponse_attendue":"Deux salariés ont démissionné. : Une augmentation du turn-over. • Le responsable n'arrive pas à recruter. : Des difficultés pour recruter de nouveaux employés."},"essentiel":{"indice":"Des salariés arrêtés : l'absentéisme. Des salariés qui partent : le turn-over.","reponse_attendue":"Quatre salariés ont été arrêtés depuis le début de l'année. : Une augmentation de l'absentéisme. • Deux salariés ont démissionné. : Une augmentation du turn-over."}}},"el":{"standard":{"indice":"DOC. 6 : les deux premières ","support_type":"","indice":"","reponse_attendue":"Les tensions, les arrêts et les départs répétés dégradent les relations entre les salariés et l'ambiance de travail.","explication":"","variantes":{"adapte":{"texte":"**Expliquer** pourquoi les risques psychosociaux dégradent le climat social, en complétant la phrase.\nLes tensions, les arrêts et les départs répétés dégradent les ……………………………… entre les salariés et l'……………………………… de travail.","lignes":0,"reponse_attendue":"Les tensions, les arrêts et les départs répétés dégradent les relations entre les salariés et l'ambiance de travail.","indice":"Les deux mots manquants définissent le climat social dans le document 6."},"essentiel":{"texte":"**Expliquer** pourquoi les risques psychosociaux dégradent le climat social, en cochant la proposition exacte.\n☐ Les tensions, les arrêts et les départs répétés dégradent les relations et l'ambiance de travail.\n☐ Les salariés changent d'horaires chaque semaine.\n☐ L'entreprise vend moins de produits frais.","lignes":0,"reponse_attendue":"Les tensions, les arrêts et les départs répétés dégradent les relations et l'ambiance de travail.","indice":"Une seule proposition parle des relations entre les salariés."}}},"el":{"standard":{"indice":"DOC. 6 : la ligne de la liste qui définit le climat social.","explication":"Les tensions, les arrêts et les départs répétés dégradent les relations entre les salariés et l'ambiance de travail : c'est le climat social.","cherche":[{"bloc":"c9_s3_doc6","texte":"climat social"},{"bloc":"c9_s3_doc6","texte":"des relations et de l'ambiance de travail"}]},"adapte":{"indice":"DOC. 6 : les deux mots manquants définissent le climat social.","explication":"Les tensions, les arrêts et les départs répétés dégradent les relations entre les salariés et l'ambiance de travail.","trous":["relations","ambiance"],"cherche":[{"bloc":"c9_s3_doc6","texte":"climat social"},{"bloc":"c9_s3_doc6","texte":"des relations et de l'ambiance de travail"}]},"essentiel":{"indice":"DOC. 6 : une seule proposition parle des relations entre les salariés.","explication":"Les tensions, les arrêts et les départs répétés dégradent les relations et l'ambiance de travail.","cherche":[{"bloc":"c9_s3_doc6","texte":"climat social"},{"bloc":"c9_s3_doc6","texte":"des relations et de l'ambiance de travail"}]}}},{"id":"c9_s3_doc7","type":"document","data":{"label":"DOC. 7","titre":"Les obligations de l'employeur","cadre":true,"corps":"**L'obligation générale de sécurité.** « L'employeur prend les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs » (article L. 4121-1 du code du travail). Les risques psychosociaux sont concernés : ils doivent être évalués comme les autres risques professionnels et inscrits dans le document unique d'évaluation des risques.\n\n**Les principes généraux de prévention.** L'article L. 4121-2 demande notamment de combattre les risques à la source, d'adapter le travail à l'homme et de planifier la prévention en y intégrant l'organisation du travail, les conditions de travail et les relations sociales.\n\n**L'interdiction du harcèlement.** Le harcèlement moral et le harcèlement sexuel sont interdits ; l'employeur doit les prévenir.\n\n**Deux accords nationaux interprofessionnels** complètent ces règles : l'accord du 2 juillet 2008 sur le stress au travail et l'accord du 26 mars 2010 sur le harcèlement et la violence au travail.","source":"D'après le code du travail et l'INRS, Réglementation applicable aux risques psychosociaux.","variantes":{"essentiel":{"corps":"**L'obligation de sécurité.** « L'employeur prend les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs » (article L. 4121-1 du code du travail).\n\nLes risques psychosociaux doivent être **évalués** comme les autres risques professionnels, puis inscrits dans le **document unique**. L'employeur **planifie** ensuite les mesures de prévention.\n\n**Le harcèlement moral et le harcèlement sexuel sont interdits.**"}}}},{"id":"c9_s3_q2","type":"question_chapeau","data":{"numero":"2","texte":"À partir du document 7 :","reponse_attendue":"","explication":""}},{"id":"c9_s3_q2_1","type":"sous_question","data":{"competence":"C1","numero":"2.1","texte":"**Relever** l'obligation de l'employeur posée par l'article L. 4121-1.","lignes":2,"style_lignes":"tiret_guide","support_type":"","indice":"","reponse_attendue":"Prendre les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs.","explication":"","variantes":{"adapte":{"indice":"Emplacement : la phrase entre guillemets du premier paragraphe."},"essentiel":{"indice":"La phrase à souligner est entre guillemets, au début du document.","texte":"**Identifier** en cochant l'obligation de l'employeur posée par l'article L. 4121-1.\n☐ Prendre les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs.\n☐ Fixer le montant des salaires de l'entreprise.\n☐ Soigner les salariés dont la santé est atteinte.","lignes":0,"style_lignes":"","reponse_attendue":"Prendre les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs."}}},"el":{"standard":{"indice":"DOC. 7 : la phrase entre guillemets, au début du document.","explication":"L'employeur prend les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs (article L. 4121-1 du code du travail).","cherche":[{"bloc":"c9_s3_doc7","texte":"prend les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs"}]},"adapte":{"indice":"DOC. 7 : la phrase entre guillemets, au début du document.","explication":"L'employeur prend les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs (article L. 4121-1 du code du travail).","cherche":[{"bloc":"c9_s3_doc7","texte":"prend les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs"}]},"essentiel":{"indice":"DOC. 7 : la phrase à cocher est celle qui est entre guillemets, au début du document.","explication":"L'employeur prend les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs (article L. 4121-1 du code du travail).","cherche":[{"bloc":"c9_s3_doc7","texte":"prend les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs"}]}}},{"id":"c9_s3_q2_2","type":"sous_question","data":{"competence":"C3","numero":"2.2","texte":"**Expliquer** pourquoi l'employeur doit évaluer les risques psychosociaux.","lignes":2,"style_lignes":"tiret_guide","support_type":"","indice":"","reponse_attendue":"Sans évaluation, l'employeur ne peut pas planifier de mesures de prévention adaptées à son entreprise.","explication":"","variantes":{"adapte":{"texte":"**Expliquer** pourquoi l'employeur doit évaluer les risques psychosociaux, en complétant la phrase.\nSans ………………………………, l'employeur ne peut pas ……………………………… de mesures de prévention adaptées à son entreprise.","lignes":0,"reponse_attendue":"Sans évaluation, l'employeur ne peut pas planifier de mesures de prévention adaptées à son entreprise.","indice":"Le premier mot manquant est dans le premier paragraphe, le second dans le deuxième."},"essentiel":{"texte":"**Expliquer** pourquoi l'employeur doit évaluer les risques psychosociaux, en cochant la proposition exacte.\n☐ Pour obtenir une réduction de ses impôts.\n☐ Pour connaître l'âge de ses salariés.\n☐ Sans évaluation, il ne peut pas planifier de mesures de prévention adaptées.","lignes":0,"reponse_attendue":"Sans évaluation, il ne peut pas planifier de mesures de prévention adaptées.","indice":"Une seule proposition relie l'évaluation et le choix des mesures."}}},"el":{"standard":{"indice":"DOC. 7 : les risques psychosociaux doivent être évalués ; le deuxième paragraphe dit ce que l'employeur doit faire ensuite.","explication":"Sans évaluation, l'employeur ne sait pas quels facteurs sont présents dans son entreprise : il ne peut pas planifier de mesures de prévention adaptées.","cherche":[{"bloc":"c9_s3_doc7","texte":"évalués"},{"bloc":"c9_s3_doc7","texte":"planifier la prévention"}]},"adapte":{"indice":"DOC. 7 : le premier mot manquant est dans le premier paragraphe, le second dans le deuxième.","explication":"Sans évaluation, l'employeur ne peut pas planifier de mesures de prévention adaptées à son entreprise.","trous":["évaluation","planifier"],"cherche":[{"bloc":"c9_s3_doc7","texte":"évalués"},{"bloc":"c9_s3_doc7","texte":"planifier la prévention"}]},"essentiel":{"indice":"DOC. 7 : une seule proposition relie l'évaluation et le choix des mesures.","explication":"Sans évaluation, l'employeur ne peut pas planifier de mesures de prévention adaptées.","cherche":[{"bloc":"c9_s3_doc7","texte":"évalués"},{"bloc":"c9_s3_doc7","texte":"planifie"}]}}},{"id":"c9_s3_doc8","type":"document_texte_image","data":{"label":"DOC. 8","titre":"Les trois niveaux de prévention des risques psychosociaux","cadre":true,"source":"D'après l'INRS, Prévenir les risques psychosociaux, et le portail de la fonction publique, Santé et sécurité au travail.","corps":"**La prévention collective** agit sur le travail et son organisation : elle protège l'ensemble des salariés.\n**La prévention individuelle** agit sur une seule personne : elle vient en complément, jamais à la place.","variantes":{"essentiel":{"corps":"**La prévention collective** agit sur le travail : elle protège tous les salariés.\n**La prévention individuelle** agit sur une seule personne. Elle complète la prévention collective, elle ne la remplace pas."}},"img":"bcp_term_C9/images/C9_trois_niveaux_prevention_RPS.jpg","img_desc":"Illustration des trois niveaux de prévention, présentés de gauche à droite en trois colonnes reliées par des flèches. PRÉVENTION PRIMAIRE, illustrée par des engrenages : « Agir sur les causes pour éviter l'apparition des risques. » Améliorer l'organisation du travail ; supprimer ou réduire les risques ; agir sur l'environnement de travail. Flèche vers la PRÉVENTION SECONDAIRE, illustrée par une loupe placée sur une personne : « Repérer tôt les difficultés pour limiter leurs effets. » Informer sur les risques ; former les salariés ; repérer les signaux d'alerte ; proposer un accompagnement adapté. Flèche vers la PRÉVENTION TERTIAIRE, illustrée par une main qui soutient une personne : « Limiter les conséquences lorsque le dommage est survenu. » Favoriser le retour au travail ; adapter le poste ou les conditions de travail ; éviter l'aggravation des problèmes de santé. Sous les trois colonnes, une longue flèche porte la phrase : « Agir le plus tôt possible et privilégier les actions collectives. »","img_w":1774,"img_h":887,"image_pos":"bas"}},{"id":"c9_s3_q3","type":"question_chapeau","data":{"numero":"3","texte":"À partir du document 8 :","reponse_attendue":"","explication":""}},{"id":"c9_s3_q3_1","type":"sous_question","data":{"competence":"C2","numero":"3.1","texte":"**Compléter** le tableau en indiquant le niveau de prévention de chaque action.","lignes":0,"style_lignes":"","support_type":"","indice":"","reponse_attendue":"Créer deux postes supplémentaires pour absorber les pics d'activité. : La prévention primaire. • Former les responsables d'équipe à repérer les signes de mal-être. : La prévention secondaire. • Proposer un accompagnement psychologique à un salarié dont la santé est déjà atteinte. : La prévention tertiaire. • Consulter les salariés avant de modifier l'organisation des équipes. : La prévention primaire. • Aménager le poste d'un salarié qui reprend après un arrêt. : La prévention tertiaire.","explication":"","variantes":{"adapte":{"indice":"Se demander chaque fois si l'action agit avant, pendant ou après l'apparition des troubles.","reponse_attendue":"Former les responsables d'équipe à repérer les signes de mal-être. : L , parce qu'elle agit sur les ……………………………… pour éviter l'apparition des risques et protège tous les salariés.","lignes":0,"reponse_attendue":"La prévention primaire, parce qu'elle agit sur les causes pour éviter l'apparition des risques et protège tous les salariés.","indice":"Le premier mot manquant est le nom d'un des trois niveaux du document 8."},"essentiel":{"texte":"**Justifier** le niveau de prévention à mettre en œuvre en priorité, en cochant la proposition exacte.\n☐ La prévention tertiaire, parce qu'elle soigne les salariés déjà touchés.\n☐ La prévention primaire, parce qu'elle agit sur les causes et protège tous les salariés.\n☐ La prévention secondaire, parce qu'elle coûte moins cher à l'entreprise.","lignes":0,"reponse_attendue":"La prévention primaire, parce qu'elle agit sur les causes et protège tous les salariés.","indice":"Une seule proposition parle d'agir sur les causes."}}},"el":{"standard":{"indice":"DOC. 8 : le niveau placé à gauche du schéma, puis la phrase portée par la flèche du bas.","explication":"La prévention primaire agit sur les causes pour éviter l'apparition des risques, et la prévention collective protège tous les salariés : c'est elle qu'il faut mettre en œuvre en priorité.","cherche":[{"bloc":"c9_s3_doc8","texte":"La prévention collective"}]},"adapte":{"indice":"DOC. 8 : le premier mot manquant est le nom d'un des trois niveaux du schéma.","explication":"La prévention primaire agit sur les causes pour éviter l'apparition des risques et protège tous les salariés.","trous":["primaire","causes"],"cherche":[{"bloc":"c9_s3_doc8","texte":"La prévention collective"}]},"essentiel":{"indice":"DOC. 8 : une seule proposition parle d'agir sur les causes.","explication":"La prévention primaire agit sur les causes et protège tous les salariés.","cherche":[{"bloc":"c9_s3_doc8","texte":"La prévention collective"}]}}},{"id":"c9_s3_retenir_prevention","type":"encadre","data":{"variante":"retenir","titre":"À retenir","texte":"L'article L. 4121-1 du code du travail demande des actions de prévention, des actions d'information et de formation, et une organisation adaptée. L'article L. 4121-2 donne la priorité aux mesures de protection collective, et le document 8 conclut : « Agir le plus tôt possible et privilégier les actions collectives. »\n\nPrévention collective : agir sur le travail et son organisation pour protéger l'ensemble des salariés.\nFormation : développer les connaissances et les compétences nécessaires pour prévenir les risques psychosociaux.\nInformation : faire connaître les risques, les moyens de prévention et les personnes ou services à contacter."}},{"id":"c9_s3_doc9","type":"document","data":{"label":"DOC. 9","titre":"Alerter et se faire aider","cadre":true,"corps":"**L'employeur et l'encadrement.** Ils doivent être informés d'une situation qui met en cause la santé d'un salarié, et prendre les mesures nécessaires.\n\n**Le comité social et économique (CSE).** Lorsqu'un de ses membres constate une atteinte aux droits des personnes, à leur santé physique ou mentale, ou aux libertés individuelles, il en saisit immédiatement l'employeur. Celui-ci procède sans délai à une enquête avec ce membre et prend les mesures nécessaires pour remédier à la situation (article L. 2312-59 du code du travail). C'est le droit d'alerte du CSE.\n\n**Le service de prévention et de santé au travail.** Le médecin du travail reçoit le salarié, examine sa situation et peut l'orienter vers une prise en charge médicale ou psychologique.\n\n**L'inspection du travail.** Peut être saisie par le salarié, notamment en cas de harcèlement.\n\n**Le salarié lui-même.** S'il a un motif raisonnable de penser qu'une situation de travail présente un danger grave et imminent pour sa santé, il alerte immédiatement l'employeur (articles L. 4131-1 et suivants).\n\n**Pendant une période de formation en milieu professionnel**, l'élève prévient son tuteur et son professeur référent.","source":"D'après Service-Public et le code du travail.","variantes":{"essentiel":{"corps":"**L'employeur et l'encadrement.** Ils doivent être informés d'une situation qui met en cause la santé d'un salarié, et prendre les mesures nécessaires.\n\n**Le comité social et économique (CSE).** Lorsqu'un de ses membres constate une atteinte à la santé physique ou mentale d'un salarié, il **saisit immédiatement l'employeur**. Celui-ci **procède sans délai à une enquête avec ce membre**. C'est le **droit d'alerte** du CSE.\n\n**Le médecin du travail.** Il **reçoit le salarié** et peut l'**orienter vers une prise en charge** médicale ou psychologique.\n\n**L'inspection du travail.** Elle **peut être saisie par le salarié**, notamment en cas de harcèlement.\n\n**Le salarié.** Devant un danger grave et imminent, il **alerte immédiatement l'employeur**.\n\n**Pendant une période de formation en milieu professionnel**, l'élève prévient son tuteur et son professeur référent."}}}},{"id":"c9_s3_q4","type":"question_chapeau","data":{"numero":"4","texte":"À partir du document 9 :","reponse_attendue":"","explication":""}},{"id":"c9_s3_q4_1","type":"relier","data":{"numero":"4.1","competence":"C1","titre":"","consigne":"**Associer** chaque acteur de prévention à ce qu'il fait.","gauche":["Le comité social et économique (CSE)","Le médecin du travail","L'inspection du travail","Le salarié"],"droite":["Peut être saisie par le salarié, notamment en cas de harcèlement.","Il alerte l'employeur devant un danger grave et imminent.","Il reçoit le salarié et peut l'orienter vers une prise en charge.","Il saisit immédiatement l'employeur lorsqu'il constate une atteinte à la santé d'un salarié."],"correspondances":[3,2,0,1]},"el":{"standard":{"indice":"DOC. 9 : chaque acteur a son paragraphe, en gras.","explication":"Le comité social et économique saisit immédiatement l'employeur. Le médecin du travail reçoit le salarié et peut l'orienter vers une prise en charge. L'inspection du travail peut être saisie par le salarié. Le salarié alerte immédiatement l'emp
