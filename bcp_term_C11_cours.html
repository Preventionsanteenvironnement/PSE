** est ce que l’entreprise demande : la **tâche**, avec ses objectifs, ses consignes et ses moyens.\n2. Le **travail réel** est ce que la personne fait vraiment : son **activité**. Il s’écarte souvent du travail prescrit.\n3. Les **déterminants** expliquent l’activité réelle. Ils sont liés à l’**opérateur** (âge, expérience, santé), à la **tâche** (objectifs, cadence), au **matériel** (outils, poste) et au **milieu** (lieu, horaires, organisation, clients).\n4. L’outil **ITaMaMi** décrit une situation de travail : Individu, Tâche, Activité, Matériel, Milieu.", "source": "D’après l’INRS, ED 950, 08/2025.", "date_consultation": "2026-10-10"}}, {"id": "bc11_ch2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 1 :", "reponse_attendue": ""}}, {"id": "bc11_q20", "type": "sous_question", "data": {"competence": "C1", "numero": "2.1", "texte": "**Différencier** le travail prescrit et le travail réel.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Le travail prescrit est ce que l’entreprise demande ; le travail réel est ce que la personne fait vraiment.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Différencier** le travail prescrit et le travail réel.\nLe travail prescrit est ce que l’entreprise …………… ; le travail réel est ce que la personne …………… vraiment.", "reponse_attendue": "demande ; fait", "lignes": 0}, "essentiel": {"texte": "**Différencier** le travail prescrit et le travail réel.\nMots proposés : demande – fait – paie.\nLe travail prescrit est ce que l’entreprise …………… ; le travail réel est ce que la personne …………… vraiment.", "reponse_attendue": "demande\nfait", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 1 : le point 1 et le point 2.", "explication": "Le travail prescrit est ce que l’entreprise demande : la tâche. Le travail réel est ce que la personne fait vraiment : son activité."}, "adapte": {"indice": "DOC. 1 : le début du point 1, p  conseil de posture ne corrige pas, à lui seul, un matériel en panne ou une cadence imposée.", "source": "D’après le Code du travail, article L. 4121-2, et l’INRS.", "date_consultation": "2026-10-10", "image_nom": "Planche de deux vignettes à la même caisse. « Avant » : longue file d’attente, l’hôtesse soulève un pack, la douchette est en panne. « Après » : la douchette fonctionne (étiquette « Aménagement du poste ») et une seconde caisse est ouverte (étiquette « Organisation du travail ») ; la file est courte.", "image_w": 1500, "image_h": 1000, "image_pos": "centre", "image_align": "centre", "image_largeur": 80, "image_taille": "pleine", "img": "bcp_term_C11/images/bcp_term_C11_bc11_doc4.jpg", "img_desc": "Planche de deux vignettes à la même caisse. « Avant » : longue file d’attente, l’hôtesse soulève un pack, la douchette est en panne. « Après » : la douchette fonctionne (étiquette « Aménagement du poste ») et une seconde caisse est ouverte (étiquette « Organisation du travail ») ; la file est courte.", "img_w": 1400, "img_h": 933}}, {"id": "bc11_ch5", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 5 :", "reponse_attendue": ""}}, {"id": "bc11_q51", "type": "sous_question", "data": {"competence": "C2", "numero": "1.1", "texte": "**Formuler** une hypothèse sur l’origine possible des douleurs de Chloé à l’épaule.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "La panne de la douchette oblige Chloé à soulever les packs : cela pourrait contribuer à ses douleurs.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Formuler** une hypothèse sur l’origine possible des douleurs de Chloé à l’épaule.\nLa panne de la …………… oblige Chloé à …………… les packs : cela pourrait contribuer à ses douleurs.", "reponse_attendue": "douchette ; soulever", "lignes": 0}}, "absorber": false}, "el": {"standard": {"indice": "DOC. 5 : le point 1. DOC.
