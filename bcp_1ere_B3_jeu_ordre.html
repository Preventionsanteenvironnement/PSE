<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Remets le trajet du son dans l&#x27;ordre, puis associe chaque moyen et chaque valeur à son rôle — B3 1re Bac Pro · Doc. 3, 7 et 8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--fond1:#0F3D36;--fond2:#1D5E50;--clair:#F4F8F5;--encre:#13302A;--doux:#5B7A71;--jaune:#FFD23F;--vrai:#2FBF71;--vrai-f:#16733F;--faux:#FF6B57;--faux-f:#B3261E;--ligne:rgba(255,255,255,.22);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--clair);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:1.07rem;line-height:1.45;
  background:radial-gradient(1200px 600px at 15% -10%,rgba(255,210,63,.13),transparent 60%),radial-gradient(900px 700px at 110% 110%,rgba(120,220,180,.14),transparent 60%),linear-gradient(160deg,var(--fond1),var(--fond2));background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--jaune);outline-offset:3px}
.page{max-width:960px;margin:0 auto;padding:1.4rem 1.1rem 3rem}
header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(2rem,6vw,3rem);line-height:1;margin:0}
header p{margin:.45rem 0 0;opacity:.85;max-width:64ch}
.onglets{display:flex;gap:.5rem;overflow-x:auto;padding:1.1rem .1rem .6rem;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.puce{flex:none;border:2px solid var(--ligne);background:rgba(255,255,255,.06);border-radius:999px;padding:.4rem 1rem;font-weight:700}
.puce[aria-pressed="true"]{background:var(--clair);color:var(--encre);border-color:var(--clair)}
.puce .et{color:var(--jaune);margin-left:.3rem}
.puce[aria-pressed="true"] .et{color:#B8860B}
.carte{background:var(--clair);color:var(--encre);border-radius:24px;padding:clamp(1rem,3vw,1.6rem);box-shadow:0 30px 60px -25px rgba(0,0,0,.6)}
.situ{background:#fff;border:2px solid #C5CEC9;border-radius:14px;padding:.8rem 1rem;margin-bottom:1rem;font-size:1.08rem}
.situ b{display:block;margin-bottom:.2rem}
/* ===== Schéma PAD ===== */
.pad{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;align-items:stretch}
.case{border:3px dashed #9AA59F;border-radius:14px;background:#fff;padding:.5rem .6rem;min-height:86px;display:flex;flex-direction:column;gap:.3rem;text-align:left}
.case .lab{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.case .val{font-weight:700;color:#1B1F1D}
.case .vide{color:#9AA59F;font-style:italic;font-weight:400}
.case.plein{border-style:solid}
.case.cible{background:#FFF4C2;border-color:#E0A800}
.case.bon{background:#DDF4E7;border-color:var(--vrai-f);cursor:default}
.case.faux{animation:secoue .45s;background:#FFE3DE}
@keyframes secoue{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ovales{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.3rem}
.ovales .case{border-radius:999px;min-height:96px;padding:.6rem 1.4rem;justify-content:center;text-align:center}
.eclair{font-size:2.2rem}
.bas{grid-column:1/-1}
.c-sit .lab{color:#8A6A00}.c-evt .lab{color:#8A6A00}.c-dan .lab{color:var(--faux-f)}.c-op .lab{color:#1F5FA8}.c-dom .lab{color:#6B3FA0}
.fl{grid-column:1/-1;text-align:center;font-size:1.4rem;line-height:1;color:var(--doux)}
.banque{margin-top:1.1rem;border:2px dashed #B9C5BE;border-radius:18px;padding:.7rem;display:flex;flex-wrap:wrap;gap:.45rem;min-height:60px}
.eti{border:0;background:var(--encre);color:var(--clair);border-radius:12px;padding:.5rem .8rem;font-weight:700;text-align:left;line-height:1.25}
.eti[aria-pressed="true"]{outline:4px solid var(--jaune);outline-offset:2px}
.aide{min-height:1.4rem;margin:.6rem 0 0;font-weight:700;color:#8A6A00}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem}
.valider{flex:1 1 220px;height:56px;border-radius:999px;border:0;background:var(--encre);color:var(--clair);font-weight:700;font-size:1.08rem}
.valider:disabled{opacity:.4;cursor:default}
.sec{height:56px;border-radius:999px;border:2px solid #B9C5BE;background:transparent;font-weight:700;padding:0 1.1rem}
.fb{margin-top:.8rem;border-radius:14px}
.fb:not(:empty){padding:.7rem .9rem}
.fb.ok{background:#DDF4E7;border-left:6px solid var(--vrai-f)}
.fb.ko{background:#FFE3DE;border-left:6px solid var(--faux-f)}
.opts{display:grid;gap:.45rem;margin-top:.6rem}
.opt{text-align:left;border:2px solid #B9C5BE;background:#fff;border-radius:14px;padding:.65rem .9rem;font-weight:700}
.opt.bon{background:#DDF4E7;border-color:var(--vrai-f)}.opt.mauvais{background:#FFE3DE;border-color:var(--faux-f)}
.etoiles{font-size:2rem;color:#E0A800;letter-spacing:.15rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.pad{grid-template-columns:1fr}.ovales{grid-template-columns:1fr}.eclair{text-align:center}.ovales .case{border-radius:18px}}
@media (prefers-reduced-motion:reduce){.case.faux{animation:none}}
.echelle{display:grid;gap:.45rem;position:relative;padding-left:2.4rem}
.echelle::before{content:"";position:absolute;left:.9rem;top:.3rem;bottom:.3rem;width:8px;border-radius:8px;background:linear-gradient(#16733F,#FFD23F,#B3261E)}
.echelle .haut,.echelle .basE{position:absolute;left:-.2rem;font-size:.75rem;font-weight:800;writing-mode:vertical-rl;transform:rotate(180deg)}
.echelle .haut{top:.2rem;color:#16733F}.echelle .basE{bottom:.2rem;color:#B3261E}
.echelle .case{min-height:70px;flex-direction:row;align-items:center;gap:.8rem}
.echelle .case .lab{min-width:9.5rem}
.num{display:inline-grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--encre);color:#fff;font-weight:800;flex:none}
@media (max-width:560px){.echelle .case{flex-direction:column;align-items:flex-start}.echelle .case .lab{min-width:0}}

.fil{margin:0 0 .7rem}
.fil a{color:var(--clair);opacity:.85;text-decoration:underline;text-underline-offset:4px;font-size:1rem;padding:.35rem .1rem;display:inline-block}
.fil a:hover{opacity:1}
</style>

<body>
<div class="page">
  <header>
    <h1>Les étapes, dans l&#x27;ordre</h1>
    <p>Remets le trajet du son dans l&#x27;ordre, puis associe chaque moyen et chaque valeur à son rôle — B3 1re Bac Pro · Doc. 3, 7 et 8</p>
  </header>
  <nav class="fil" aria-label="Fil d'Ariane"><a href="bcp_1ere_B3_jeux.html">← Toutes les révisions B3</a></nav>
  <nav class="onglets" id="onglets" aria-label="Choisir la situation"></nav>
  <main class="carte" id="carte"></main>
  <div class="sr" aria-live="polite" id="annonce"></div>
</div>
<script>
(function(){const S=window.SpeechSynthesisUtterance;if(!S)return;
 const sig=t=>String(t).replace(/dB\(A\)/g,"décibels A").replace(/(\d) Hz/g,"$1 hertz").replace(/\bHz\b/g,"hertz").replace(/\bOMS\b/g,"O M S").replace(/(\d+) €/g,"$1 euros").replace(/(\d+) %/g,"$1 pour cent");
 window.SpeechSynthesisUtterance=function(t){return new S(sig(t))};})();

const AIDE={"o1": "l'oreille externe", "o2": "la membrane", "o3": "l'oreille moyenne", "o4": "l'oreille interne", "o5": "vers le cerveau", "src": "là où le bruit naît", "pro": "sur son chemin", "rec": "près de l'oreille", "v80": "valeur inférieure", "v85": "valeur supérieure", "v87": "la limite"};
const SITUATIONS=[{"id": "trajet", "titre": "Le trajet du son dans l'oreille", "texte": "Remets dans l'ordre les cinq étapes du trajet du son, du pavillon jusqu'au cerveau (Doc. 3).", "bravo": "Le pavillon et le conduit captent le son, le tympan vibre, les osselets transmettent, les cellules ciliées de la cochlée transforment les vibrations en signaux électriques, le nerf auditif les conduit au cerveau.", "cases": [["o1", "Étape 1"], ["o2", "Étape 2"], ["o3", "Étape 3"], ["o4", "Étape 4"], ["o5", "Étape 5"]], "bons": {"o1": "Le pavillon et le conduit auditif captent le son et le conduisent au tympan", "o2": "Le tympan se met à vibrer", "o3": "Les osselets transmettent les vibrations jusqu'à la fenêtre ovale", "o4": "Les cellules ciliées de la cochlée transforment les vibrations en signaux électriques", "o5": "Le nerf auditif transmet ces signaux au cerveau"}, "pieges": ["Le nerf auditif renvoie les vibrations vers le tympan"], "q": {"p": "Pourquoi une surdité due au bruit est-elle irréversible ?", "o": [["Parce que les cellules ciliées détruites ne se régénèrent pas.", 1], ["Parce que le tympan ne peut jamais être opéré.", 0, "Quand le tympan ou les osselets sont atteints, une opération peut parfois rétablir l'audition."], ["Parce que le nerf auditif se bouche avec le temps.", 0, "Le cours ne parle pas de nerf bouché : le bruit détruit les cellules ciliées de la cochlée."]], "e": "Le bruit intense et prolongé détruit les cellules ciliées de la cochlée, qui ne se régénèrent pas : la surdité de perception est irréversible."}}, {"id": "moyens", "titre": "Source, propagation, réception", "texte": "Associe chaque façon d'agir contre le bruit à un moyen du cours (Doc. 8).", "bravo": "Source : des équipements qui émettent le moins de bruit possible. Propagation : des écrans et des capotages. Réception : s'éloigner des enceintes.", "cases": [["src", "Agir sur la source"], ["pro", "Agir sur la propagation"], ["rec", "Agir sur la réception"]], "bons": {"src": "Choisir des équipements qui émettent le moins de bruit possible", "pro": "Installer des écrans et des capotages", "rec": "S'éloigner des enceintes"}, "pieges": ["Allonger la durée du travail dans le bruit"], "q": {"p": "Quelle mesure l'employeur choisit-il en priorité ?", "o": [["Réduire le bruit à la source, car cela protège tous les salariés.", 1], ["Distribuer des bouchons d'oreilles avant toute autre mesure.", 0, "Les protecteurs individuels sont prévus quand les risques ne peuvent pas être évités par d'autres moyens."], ["Laisser chaque salarié choisir s'il se protège ou non.", 0, "À partir de 85 dB(A), l'employeur veille à ce que les protecteurs soient effectivement utilisés ; et il réduit d'abord le bruit à la source."]], "e": "Réduire le bruit à la source est prioritaire : cela protège tous les salariés ; les protecteurs n'apportent qu'une protection individuelle complémentaire."}}, {"id": "valeurs", "titre": "Les valeurs du Code du travail", "texte": "Associe chaque niveau d'exposition quotidienne au bruit à ce que dit le Code du travail (Doc. 7).", "bravo": "Plus de 80 dB(A) : protecteurs mis à disposition. 85 dB(A) ou plus : l'employeur veille à leur utilisation. 87 dB(A) : valeur limite d'exposition.", "cases": [["v80", "Plus de 80 dB(A)"], ["v85", "85 dB(A) ou plus"], ["v87", "87 dB(A)"]], "bons": {"v80": "L'employeur met des protecteurs auditifs individuels à disposition", "v85": "L'employeur veille à ce que les protecteurs soient effectivement utilisés", "v87": "Valeur limite d'exposition quotidienne au bruit"}, "pieges": ["Seuil de douleur de l'oreille"], "q": {"p": "Antoine est exposé à 86 dB(A). Que doit faire son employeur pour les protecteurs ?", "o": [["Veiller à ce qu'ils soient effectivement utilisés.", 1], ["Seulement les mettre à disposition d'Antoine.", 0, "86 dB(A), c'est plus que 85 dB(A) : l'employeur doit aussi veiller à leur utilisation."], ["Rien, car 87 dB(A) n'est pas dépassé.", 0, "Pour les protecteurs, l'obligation commence au-dessus de 80 dB(A), pas à 87 dB(A)."]], "e": "86 dB(A) dépasse 85 dB(A) : l'employeur veille à ce que les protecteurs auditifs individuels soient effectivement utilisés."}}];
const $=id=>document.getElementById(id);
function annoncer(t){$("annonce").textContent=t}
function melanger(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const CLE="ordre-BCP1B3";let pref={etoiles:{}};
try{pref=Object.assign(pref,JSON.parse(localStorage.getItem(CLE)||"{}"))}catch(e){}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(pref))}catch(e){}}
let S,etis,place,bons,sel,premier,fini;
function onglets(){
  $("onglets").innerHTML=SITUATIONS.map(s=>`<button class="puce" data-id="${s.id}" aria-pressed="${S===s}">${s.titre}${pref.etoiles[s.id]?`<span class="et">${"★".repeat(pref.etoiles[s.id])}</span>`:""}</button>`).join("");
  $("onglets").querySelectorAll(".puce").forEach(b=>b.onclick=()=>demarrer(SITUATIONS.find(s=>s.id===b.dataset.id)));
}
function demarrer(s){S=s;etis=melanger(Object.entries(s.bons).map(([k,t])=>({id:k,t})).concat(s.pieges.map((t,i)=>({id:"p"+i,t}))));place={};bons=new Set();sel=null;premier=null;fini=false;onglets();rendre()}
function rendre(){
  const util=new Set(Object.values(place).map(e=>e.id)),dispo=etis.filter(e=>!util.has(e.id)),plein=S.cases.every(([k])=>place[k]);
  $("carte").innerHTML=`<div class="situ"><b>Situation</b>${S.texte}</div>
    <div class="echelle"><span class="haut">début</span><span class="basE">fin</span>
    ${S.cases.map(([k,lab],i)=>{const e=place[k],ok=bons.has(k);return `<button class="case${e?" plein":""}${ok?" bon":""}${sel&&!e&&!ok?" cible":""}" data-k="${k}" aria-label="${lab}${e?" : "+e.t:" : vide"}"><span class="lab"><span class="num">${i+1}</span> ${lab}</span>${e?`<span class="val">${e.t}</span>`:`<span class="vide">${AIDE[k]}</span>`}</button>`}).join("")}</div>
    <div class="banque" aria-label="Étiquettes">${dispo.length?dispo.map(e=>`<button class="eti" data-e="${e.id}" aria-pressed="${sel===e.id}">${e.t}</button>`).join(""):'<span style="color:var(--doux);font-style:italic">Toutes les cases sont remplies.</span>'}</div>
    <p class="aide" aria-live="polite">${sel?"Touche maintenant la bonne case.":"Touche une étiquette, puis une case. Attention : une étiquette est un piège."}</p>
    <div class="actions"><button class="valider" id="bV" ${plein&&!fini?"":"disabled"}>${fini?"Terminé ✓":plein?"Vérifier":"Remplis toutes les cases"}</button><button class="sec" id="bR">Recommencer</button></div>
    <div class="fb" id="fb" role="status"></div><div id="suite"></div>`;
  $("carte").querySelectorAll(".eti").forEach(b=>b.onclick=()=>{sel=sel===b.dataset.e?null:b.dataset.e;rendre()});
  $("carte").querySelectorAll(".case").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(bons.has(k)||fini)return;
    if(sel){Object.keys(place).forEach(x=>{if(place[x].id===sel)delete place[x]});place[k]=etis.find(e=>e.id===sel);sel=null;rendre()}else if(place[k]){delete place[k];rendre()}});
  $("bV").onclick=verifier;$("bR").onclick=()=>demarrer(S);
}
function verifier(){
  const faux=[];S.cases.forEach(([k])=>{if(bons.has(k))return;if(place[k].id===k)bons.add(k);else{faux.push([k,place[k]]);delete place[k]}});
  if(premier===null)premier=S.cases.length-faux.length;
  if(!faux.length){fin();return}
  rendre();faux.forEach(([k])=>$("carte").querySelector(`.case[data-k="${k}"]`).classList.add("faux"));
  const f=$("fb");f.className="fb ko";f.innerHTML=`<b>${faux.length} case${faux.length>1?"s":""} à revoir.</b>${faux.map(([k,e])=>`<br>• « ${e.t} » ${e.id.startsWith("p")?"est un piège.":"n'est pas « "+S.cases.find(c=>c[0]===k)[1].toLowerCase()+" »."}`).join("")}`;
}
function fin(){
  fini=true;const n=S.cases.length,et=premier===n?3:premier>=n-2?2:1;
  pref.etoiles[S.id]=Math.max(pref.etoiles[S.id]||0,et);sauver();onglets();rendre();
  const f=$("fb");f.className="fb ok";f.innerHTML=`<b>✓ Bravo !</b> ${S.bravo}<div class="etoiles" aria-label="${et} étoiles sur 3">${"★".repeat(et)}<span style="opacity:.25">${"★".repeat(3-et)}</span></div>`;
  const i=SITUATIONS.indexOf(S),suiv=SITUATIONS[i+1];
  const bout=()=>{if(suiv){const b=document.createElement("button");b.className="valider";b.style.width="100%";b.style.marginTop=".8rem";b.textContent=`Situation suivante : ${suiv.titre} →`;b.onclick=()=>{demarrer(suiv);scrollTo({top:0,behavior:"smooth"})};$("suite").appendChild(b);b.focus({preventScroll:true})}};
  if(S.q){const opts=melanger(S.q.o);
    $("suite").innerHTML=`<p style="font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.2rem;margin:1rem 0 0"><b style="color:#8A6A00">Expliquer</b> — ${S.q.p}</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join("")}</div><div class="fb" id="fb2"></div>`;
    $("suite").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i],f2=$("fb2");
      if(o[1]){b.classList.add("bon");$("suite").querySelectorAll(".opt").forEach(x=>x.disabled=true);f2.className="fb ok";f2.innerHTML=`<b>✓ Exact.</b> ${S.q.e}`;bout()}
      else{b.classList.add("mauvais");b.disabled=true;f2.className="fb ko";f2.innerHTML=`<b>Pas tout à fait.</b> ${o[2]}`}});
  }else bout();
}
demarrer(SITUATIONS[0]);
</script>
