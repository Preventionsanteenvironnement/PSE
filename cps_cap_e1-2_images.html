var OPTS = function(bonne){
  return [
    {"l":"Joie","ok":bonne==="joie"},
    {"l":"Tristesse","ok":bonne==="tristesse"},
    {"l":"Colère","ok":bonne==="colere"},
    {"l":"Peur","ok":bonne==="peur"},
    {"l":"Surprise","ok":bonne==="surprise"},
    {"l":"Dégoût","ok":bonne==="degout"}
  ];
};
/* Une carte pour le quiz « Quelle émotion ? » */
var QUIZ = function(nom, ex, hint){
  var c = CARTES[nom];
  return {"img":K+c.f,"alt":c.alt,"text":"Quelle émotion montre ce visage ?","audio":"Observe le visage et les gestes. Quelle émotion montre cette personne ?","opts":OPTS(c.k),"ex":ex,"hint":hint};
};
/* Quatre cartes à comparer : la première est la bonne */
var CHOIX = function(bonne, autres, ex){
  return [bonne].concat(autres).map(function(nom, i){
    var c = CARTES[nom];
    return i===0 ? {"img":K+c.f,"alt":c.alt,"ok":true,"ex":ex} : {"img":K+c.f,"alt":c.alt};
  });
};
/* Mur des visages : les 14 cartes, celles de l'émotion cherchée sont justes */
var MUR = function(k){
  return ORDRE_MUR.map(function(nom){ var c = CARTES[nom]; return {"img":K+c.f,"alt":c.alt,"ok":c.k===k}; });
};

        {"ic":"","html":"<strong>Surprise</strong> : yeux ronds, sourcils hauts, bouche ouverte en rond."},

        {"ic":"","html":"On dit : <strong>il semble…</strong> ou <strong>elle a l’air…</strong>. Un visage donne des indices, pas une certitude."},

        {"text":"Trouve le visage qui montre la surprise.","audio":"Trouve le visage qui montre la surprise.",
         "options":CHOIX("lina-surprise",["ines-peur","ines-joie","lina-colere"],"Oui : yeux ronds, bouche ouverte en rond, visage non crispé."),
         "bad":"Pas celui-ci. Dans la surprise, la bouche s’ouvre en rond et le visage n’est pas crispé."},
        {"text":"Trouve le visage qui montre le dégoût.","audio":"Trouve le visage qui montre le dégoût.",
         "options":CHOIX("ines-degout",["noa-colere","lina-tristesse","malik-surprise"],"Oui : nez plissé, bouche tordue, main qui repousse."),
         "bad":"Pas celui-ci. Dans le dégoût, le nez se plisse et la main repousse."},
        {"text":"Trouve le visage qui montre la colère.","audio":"Trouve le visage qui montre la colère.",

      ]
    },
    {

    },
    {
