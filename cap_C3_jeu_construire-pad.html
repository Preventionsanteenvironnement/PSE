<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Construire le PAD — La démarche de prévention · C3 · CAP · PSE</title>
<meta name="description" content="Place chaque étiquette dans la bonne case du processus d'apparition d'un dommage — C3 CAP · Doc. 4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--fond1:#0F3D36;--fond2:#1D5E50;--clair:#F4F8F5;--encre:#13302A;--doux:#5B7A71;--jaune:#FFD23F;--vrai:#2FBF71;--vrai-f:#16733F;--faux:#FF6B57;--faux-f:#B3261E;--ligne:rgba(255,255,255,.22);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--clair);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:1.07rem;line-height:1.45;
  background:radial-gradient(1200px 600px at 15% -10%,rgba(255,210,63,.13),transparent 60%),radial-gradient(900px 700px at 110% 110%,rgba(120,220,180,.14),transparent 60%),linear-gradient(160deg,var(--fond1),var(--fond2));background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--jaune);outline-offset:3px}
.page{max-width:960px;margin:0 auto;padding:1.4rem 1.1rem 3rem}
header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(2rem,6vw,3rem);line-height:1;margin:0}
header p{margin:.45rem 0 0;opacity:.85;max-width:64ch}
.onglets{display:flex;gap:.5rem;overflow-x:auto;padding:1.1rem .1rem .6rem;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.puce{flex:none;border:2px solid var(--ligne);background:rgba(255,255,255,.06);border-radius:999px;padding:.4rem 1rem;font-weight:700}
.puce[aria-pressed="true"]{background:var(--clair);color:var(--encre);border-color:var(--clair)}
.puce .et{color:var(--jaune);margin-left:.3rem}
.puce[aria-pressed="true"] .et{color:#B8860B}
.carte{background:var(--clair);color:var(--encre);border-radius:24px;padding:clamp(1rem,3vw,1.6rem);box-shadow:0 30px 60px -25px rgba(0,0,0,.6)}
.situ{background:#fff;border:2px solid #C5CEC9;border-radius:14px;padding:.8rem 1rem;margin-bottom:1rem;font-size:1.08rem}
.situ b{display:block;margin-bottom:.2rem}
/* ===== Schéma PAD ===== */
.pad{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;align-items:stretch}
.case{border:3px dashed #9AA59F;border-radius:14px;background:#fff;padding:.5rem .6rem;min-height:86px;display:flex;flex-direction:column;gap:.3rem;text-align:left}
.case .lab{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.case .val{font-weight:700;color:#1B1F1D}
.case .vide{color:#9AA59F;font-style:italic;font-weight:400}
.case.plein{border-style:solid}
.case.cible{background:#FFF4C2;border-color:#E0A800}
.case.bon{background:#DDF4E7;border-color:var(--vrai-f);cursor:default}
.case.faux{animation:secoue .45s;background:#FFE3DE}
@keyframes secoue{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ovales{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.3rem}
.ovales .case{border-radius:999px;min-height:96px;padding:.6rem 1.4rem;justify-content:center;text-align:center}
.eclair{font-size:2.2rem}
.bas{grid-column:1/-1}
.c-sit .lab{color:#8A6A00}.c-evt .lab{color:#8A6A00}.c-dan .lab{color:var(--faux-f)}.c-op .lab{color:#1F5FA8}.c-dom .lab{color:#6B3FA0}
.fl{grid-column:1/-1;text-align:center;font-size:1.4rem;line-height:1;color:var(--doux)}
.banque{margin-top:1.1rem;border:2px dashed #B9C5BE;border-radius:18px;padding:.7rem;display:flex;flex-wrap:wrap;gap:.45rem;min-height:60px}
.eti{border:0;background:var(--encre);color:var(--clair);border-radius:12px;padding:.5rem .8rem;font-weight:700;text-align:left;line-height:1.25}
.eti[aria-pressed="true"]{outline:4px solid var(--jaune);outline-offset:2px}
.aide{min-height:1.4rem;margin:.6rem 0 0;font-weight:700;color:#8A6A00}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem}
.valider{flex:1 1 220px;height:56px;border-radius:999px;border:0;background:var(--encre);color:var(--clair);font-weight:700;font-size:1.08rem}
.valider:disabled{opacity:.4;cursor:default}
.sec{height:56px;border-radius:999px;border:2px solid #B9C5BE;background:transparent;font-weight:700;padding:0 1.1rem}
.fb{margin-top:.8rem;border-radius:14px}
.fb:not(:empty){padding:.7rem .9rem}
.fb.ok{background:#DDF4E7;border-left:6px solid var(--vrai-f)}
.fb.ko{background:#FFE3DE;border-left:6px solid var(--faux-f)}
.opts{display:grid;gap:.45rem;margin-top:.6rem}
.opt{text-align:left;border:2px solid #B9C5BE;background:#fff;border-radius:14px;padding:.65rem .9rem;font-weight:700}
.opt.bon{background:#DDF4E7;border-color:var(--vrai-f)}.opt.mauvais{background:#FFE3DE;border-color:var(--faux-f)}
.etoiles{font-size:2rem;color:#E0A800;letter-spacing:.15rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.pad{grid-template-columns:1fr}.ovales{grid-template-columns:1fr}.eclair{text-align:center}.ovales .case{border-radius:18px}}
@media (prefers-reduced-motion:reduce){.case.faux{animation:none}}

.fil{margin:0 0 .7rem}
.fil a{color:var(--clair);opacity:.85;text-decoration:underline;text-underline-offset:4px;font-size:1rem;padding:.35rem .1rem;display:inline-block}
.fil a:hover{opacity:1}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Construire le PAD</h1>
    <p>Place chaque étiquette dans la bonne case du processus d'apparition d'un dommage — C3 CAP · Doc. 4</p>
  </header>
  <nav class="fil" aria-label="Fil d'Ariane"><a href="cap_C3_jeux.html">← Toutes les révisions C3</a></nav>
  <nav class="onglets" id="onglets" aria-label="Choisir la situation"></nav>
  <main class="carte" id="carte"></main>
  <div class="sr" aria-live="polite" id="annonce"></div>
</div>
<script>
const CASES=[["sit","Situation dangereuse"],["evt","Événement dangereux"],["dan","Danger"],["op","Opérateur"],["dom","Dommage potentiel"]];
const AIDE={sit:"la situation dans laquelle l'opérateur est exposé au danger",evt:"ce qui provoque le dommage",dan:"ce qui peut provoquer un dommage",op:"la personne qui réalise le travail",dom:"l'atteinte à la santé qui peut en résulter"};
const SITUATIONS=[
 {id:"ines",titre:"La trancheuse",texte:"Inès nettoie la lame de la trancheuse à jambon, machine branchée, sans gants.",
  bons:{dan:"La lame coupante de la trancheuse",op:"Inès",sit:"Inès nettoie la lame de la trancheuse branchée, sans gants",evt:"La main glisse sur la lame, ou la trancheuse se met en marche",dom:"Une coupure de la main ou des doigts"},
  pieges:["La fiche de poste","Chloé, la collègue"],
  q:{p:"Quel élément du PAD la consigne « Débrancher la trancheuse » supprime-t-elle ?",o:[["L'événement dangereux « la trancheuse se met en marche ».",1],["Le danger : la lame n'est plus coupante.",0,"La lame reste coupante ! Mais débranchée, elle ne peut plus tourner."],["L'opérateur : Inès ne travaille plus.",0,"Inès travaille toujours ; c'est l'événement « la trancheuse démarre » qui disparaît."]],e:"Débranchée, la lame ne peut plus tourner : cet événement dangereux ne peut plus se produire."}},
 {id:"sol",titre:"Le sol mouillé",texte:"Un agent d'entretien vient de laver le sol de la cuisine. Il traverse la pièce pour ranger son seau.",
  bons:{dan:"Le sol mouillé",op:"L'agent d'entretien",sit:"L'agent marche sur le sol mouillé",evt:"L'agent glisse",dom:"Une entorse ou une fracture"},pieges:["Le seau","La cuisine"]},
 {id:"four",titre:"Le four",texte:"Un cuisinier sort un plat du four très chaud. Il n'a pas pris ses maniques.",
  bons:{dan:"Le four chaud",op:"Le cuisinier",sit:"Le cuisinier sort un plat du four sans maniques",evt:"Sa main touche la plaque brûlante",dom:"Une brûlure de la main"},pieges:["Le plat cuisiné","Les clients"]},
 {id:"couteau",titre:"Le couteau",texte:"Un commis coupe des légumes avec un couteau, sur une planche qui glisse sur le plan de travail.",
  bons:{dan:"Le couteau",op:"Le commis",sit:"Le commis coupe des légumes sur une planche qui glisse",evt:"Le couteau dérape",dom:"Une coupure"},pieges:["Les légumes","Le plan de travail"]},
 {id:"carton",titre:"Le carton lourd",texte:"Un employé range la réserve. Il soulève un carton lourd posé au sol, en se penchant, le dos rond.",
  bons:{dan:"Le carton lourd",op:"L'employé de la réserve",sit:"L'employé soulève le carton lourd, dos rond",evt:"Il fait un faux mouvement",dom:"Une douleur au dos"},pieges:["L'étagère","La réserve"]}
];
const $=id=>document.getElementById(id);
function annoncer(t){$("annonce").textContent=t}
function melanger(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const CLE="pad-CAPC3";let pref={etoiles:{}};
try{pref=Object.assign(pref,JSON.parse(localStorage.getItem(CLE)||"{}"))}catch(e){}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(pref))}catch(e){}}
let S,etis,place,bons,sel,premier,fini;

function onglets(){
  $("onglets").innerHTML=SITUATIONS.map(s=>`<button class="puce" data-id="${s.id}" aria-pressed="${S===s}">${s.titre}${pref.etoiles[s.id]?`<span class="et">${"★".repeat(pref.etoiles[s.id])}</span>`:""}</button>`).join("");
  $("onglets").querySelectorAll(".puce").forEach(b=>b.onclick=()=>demarrer(SITUATIONS.find(s=>s.id===b.dataset.id)));
}
function demarrer(s){
  S=s;etis=melanger(Object.entries(s.bons).map(([k,t])=>({id:k,t})).concat(s.pieges.map((t,i)=>({id:"p"+i,t}))));
  place={};bons=new Set();sel=null;premier=null;fini=false;onglets();rendre();
}
function caseHTML(k,lab,extra=""){
  const e=place[k],ok=bons.has(k);
  return `<button class="case c-${k}${e?" plein":""}${ok?" bon":""}${sel&&!e&&!ok?" cible":""} ${extra}" data-k="${k}" aria-label="${lab}${e?" : "+e.t:" : vide"}"><span class="lab">${lab}</span>${e?`<span class="val">${e.t}</span>`:`<span class="vide">${AIDE[k]}</span>`}</button>`;
}
function rendre(){
  const util=new Set(Object.values(place).map(e=>e.id));
  const dispo=etis.filter(e=>!util.has(e.id));
  const plein=CASES.every(([k])=>place[k]);
  $("carte").innerHTML=`<div class="situ"><b>Situation</b>${S.texte}</div>
    <div class="pad">
      ${caseHTML("sit","Situation dangereuse")}${caseHTML("evt","Événement dangereux")}
      <div class="fl" aria-hidden="true">↘ ↙</div>
      <div class="ovales">${caseHTML("dan","Danger")}<span class="eclair" aria-hidden="true">⚡</span>${caseHTML("op","Opérateur")}</div>
      <div class="fl" aria-hidden="true">↓</div>
      <div class="bas">${caseHTML("dom","Dommage potentiel")}</div>
    </div>
    <div class="banque" aria-label="Étiquettes">${dispo.length?dispo.map(e=>`<button class="eti" data-e="${e.id}" aria-pressed="${sel===e.id}">${e.t}</button>`).join(""):'<span style="color:var(--doux);font-style:italic">Toutes les cases sont remplies.</span>'}</div>
    <p class="aide" aria-live="polite">${sel?"Touche maintenant la bonne case du schéma.":"Touche une étiquette, puis une case du schéma. Attention : deux étiquettes sont des pièges."}</p>
    <div class="actions"><button class="valider" id="bV" ${plein&&!fini?"":"disabled"}>${fini?"PAD complet ✓":plein?"Vérifier mon PAD":"Remplis les 5 cases"}</button><button class="sec" id="bR">Recommencer</button></div>
    <div class="fb" id="fb" role="status"></div><div id="suite"></div>`;
  $("carte").querySelectorAll(".eti").forEach(b=>b.onclick=()=>{sel=sel===b.dataset.e?null:b.dataset.e;rendre()});
  $("carte").querySelectorAll(".case").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;if(bons.has(k)||fini)return;
    if(sel){Object.keys(place).forEach(x=>{if(place[x].id===sel)delete place[x]});place[k]=etis.find(e=>e.id===sel);sel=null;rendre()}
    else if(place[k]){delete place[k];rendre()}
  });
  $("bV").onclick=verifier;$("bR").onclick=()=>demarrer(S);
}
function verifier(){
  const faux=[];
  CASES.forEach(([k])=>{if(bons.has(k))return;if(place[k].id===k)bons.add(k);else{faux.push(k);delete place[k]}});
  if(premier===null)premier=5-faux.length;
  if(!faux.length){fin();return}
  rendre();
  faux.forEach(k=>$("carte").querySelector(`.case[data-k="${k}"]`).classList.add("faux"));
  const f=$("fb");f.className="fb ko";f.innerHTML=`<b>${faux.length} case${faux.length>1?"s":""} à revoir.</b> Rappel : ${faux.map(k=>`<br>• ${CASES.find(c=>c[0]===k)[1]} = ${AIDE[k]}`).join("")}`;
}
function fin(){
  fini=true;const et=premier===5?3:premier>=3?2:1;
  pref.etoiles[S.id]=Math.max(pref.etoiles[S.id]||0,et);sauver();onglets();rendre();
  const f=$("fb");f.className="fb ok";f.innerHTML=`<b>✓ PAD complet !</b> ${premier} case${premier>1?"s":""} sur 5 juste${premier>1?"s":""} du premier coup.<div class="etoiles" aria-label="${et} étoiles sur 3">${"★".repeat(et)}<span style="opacity:.25">${"★".repeat(3-et)}</span></div>`;
  const i=SITUATIONS.indexOf(S),suiv=SITUATIONS[i+1];
  const bout=()=>{ if(suiv){const b=document.createElement("button");b.className="valider";b.style.width="100%";b.style.marginTop=".8rem";b.textContent=`Situation suivante : ${suiv.titre} →`;b.onclick=()=>{demarrer(suiv);scrollTo({top:0,behavior:"smooth"})};$("suite").appendChild(b);b.focus({preventScroll:true})}};
  if(S.q){
    const opts=melanger(S.q.o);
    $("suite").innerHTML=`<p style="font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.2rem;margin:1rem 0 0"><b style="color:#8A6A00">Indiquer</b> — ${S.q.p}</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join("")}</div><div class="fb" id="fb2"></div>`;
    $("suite").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i],f2=$("fb2");
      if(o[1]){b.classList.add("bon");$("suite").querySelectorAll(".opt").forEach(x=>x.disabled=true);f2.className="fb ok";f2.innerHTML=`<b>✓ Exact.</b> ${S.q.e}`;bout()}
      else{b.classList.add("mauvais");b.disabled=true;f2.className="fb ko";f2.innerHTML=`<b>Pas tout à fait.</b> ${o[2]}`}});
  }else bout();
  annoncer("PAD complet.");
}
demarrer(SITUATIONS[0]);
</script>
</body>
</html>
