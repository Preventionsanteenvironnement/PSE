ir", "objectif": "Être capable d’indiquer une conduite à tenir après une prise de risque.", "competences": ["C2", "C3", "C4", "C5"]}}, {"type": "analyse", "id": "ba6_analyse4", "data": {"titre": "SE PROTÉGER ET SE FAIRE DÉPISTER"}}, {"type": "document", "id": "ba6_doc7", "data": {"label": "DOC. 7", "titre": "Le dépistage, le préservatif et la vaccination contre les IST", "cadre": true, "corps": "« Les IST sont souvent silencieuses et vous ne vous plaignez de rien. L’unique façon de savoir si vous êtes porteur d’une IST est le dépistage. »\n« Seules deux méthodes contraceptives dite « barrières » protègent des IST : le préservatif masculin et le préservatif féminin. »\n« Les préservatifs protègent imparfaitement contre l’infection à HPV, car ils ne couvrent pas l’intégralité des parties génitales. Seule la vaccination des jeunes filles et garçons protège contre le HPV. »\n« Le vaccin contre les papillomavirus est recommandé pour toutes les jeunes filles et également tous les garçons âgés de 11 à 14 ans révolus. […] En rattrapage, le vaccin est recommandé pour les personnes des deux sexes de 15 à 26 ans révolus non encore vaccinées. »\n« La vaccination ne protège pas contre tous les HPV liés au cancer du col de l’utérus. C’est la raison pour laquelle un dépistage doit être réalisé chez la femme […]. »\n« La vaccination contre l’hépatite B est obligatoire chez tous les nourrissons nés depuis le 1er janvier 2018 dès l’âge de 2 mois. »", "source": "D’après l’Assurance Maladie (2025, 2026) et Vaccination Info Service (2026).", "date_consultation": "2026-10-27"}}, {"type": "question_chapeau", "id": "ba6_ch8", "data": {"numero": "1", "texte": "À partir du document 7 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "ba6_q81", "data": {"competence": "C3", "numero": "1.1", "texte": "**Expliquer** l’intérêt du dépistage des IST.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Les IST sont souvent silencieuses : l
