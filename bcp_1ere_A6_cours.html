document", "data": {"label": "DOC. 5", "titre": "Prévenir les IST", "cadre": true, "corps": "1. **Protection** : le **préservatif**, externe ou interne, à chaque rapport, réduit le risque d’IST. Il ne protège pas complètement des infections transmises par la peau non couverte. La pilule et l’implant ne protègent d’aucune IST.\n2. **Vaccins** : contre le papillomavirus (HPV) et contre l’hépatite B.\n3. **Dépistage** : seul un test repère une IST sans symptôme. « Mon test IST » se fait en laboratoire, sans ordonnance, pour cinq infections ; il est pris en charge à 100 % avant 26 ans. Les **CeGIDD** dépistent gratuitement.", "source": "D’après l’Assurance Maladie, 2025.", "date_consultation": "2026-10-10"}}, {"id": "ba6_ch4", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 5 :", "reponse_attendue": ""}}, {"id": "ba6_q41", "type": "sous_question", "data": {"competence": "C1", "numero": "1.1", "texte": "**Relever** trois moyens de prévention des IST.", "points": "", "lignes": 3, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Le préservatif à chaque rapport.\n– La vaccination (HPV, hépatite B).\n– Le dépistage.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1, "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"reponse_allegee": "– Le {{préservatif}}.\n– La {{vaccination}}.\n– Le {{dépistage}}.", "texte": "**Relever** trois moyens de prévention des IST.\n– Le …………….\n– La …………….\n– Le …………….", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 5 : le mot en gras au début de chacun des trois points.", "explication": "Trois moyens de prévention : le préservatif à chaque rapport, la vaccination (papillomavirus, hépatite B) et le dépistage."}, "adapte": {"indice": "DOC. 5 : un moyen dans chacun des points 1, 2 et 3.", "explication": "Le préservatif. La vaccination. Le dépistage.", "trous": ["préservatif|preservatif|préservatifs|preservatifs", "vaccination|vaccinations", "dépistage|depistage|test|test de dépistage"]}}}, {"id": "ba6_q41_ess", "type": "cocher_exactes", "data": {"competence": "C1", "numero": "1.1", "consigne": "**Identifier** trois moyens de prévention en cochant trois propositions.", "items": [{"texte": "Le préservatif", "correct": true}, {"texte": "La pilule", "correct": false}, {"texte": "La vaccination", "correct": true}, {"texte": "Le dépistage", "correct": true}, {"texte": "Les antibiotiques pris à l’avance", "correct": false}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 5 : les mots en gras des points 1, 2 et 3. Le point 1 parle aussi de la pilule.", "explication": "Les trois moyens : le préservatif, la vaccination, le dépistage. La pilule ne protège d’aucune IST. Les antibiotiques soignent, ils ne se prennent pas à l’avance."}}}, {"id": "ba6_doc5", "type": "document", "data": {"label": "DOC. 6", "titre": "Après une prise de risque", "cadre": true, "corps": "1. **Risque de VIH** : consulter immédiatement, aux urgences ou dans un CeGIDD. Le médecin évalue le risque et peut prescrire un traitement post-exposition (TPE), idéalement dans les 4 heures, au plus tard dans les 48 heures. Il dure environ un mois.\n2. **Traitements** : les **antibiotiques** traitent les IST bactériennes. Le VIH est contrôlé par des **antiviraux**, les antirétroviraux, sans être éliminé.\n3. Dépistages de contrôle, et information des partenaires pour qu’ils se fassent dépister.\n4. **Structures d’accompagnement** : CeGIDD, centres de santé sexuelle, Sida Info Service (0 800 840 800, gratuit et anonyme).\n**Exemple.** Mathis, 22 ans, a eu hier soir un rapport au cours duquel le préservatif s’est rompu. Il ne connaît pas le statut de sa partenaire pour le VIH. Il se sent en pleine forme et pense attendre.", "source": "D’après la Haute Autorité de santé, 07/2024, et Sida Info Service.", "date_consultation": "2026-10-10"}}, {"id": "ba6_ch4b", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 6 :", "reponse_
