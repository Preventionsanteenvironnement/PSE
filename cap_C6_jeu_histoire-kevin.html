<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'histoire de Kévin — Les acteurs et organismes de la prévention · C6 · CAP · PSE</title>
<meta name="description" content="De l'huile rend le sol glissant au garage de Kévin. À chaque étape, choisis le bon acteur pour faire avancer l'histoire.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--fond1:#0F3D36;--fond2:#1D5E50;--clair:#F4F8F5;--encre:#13302A;--doux:#5B7A71;--jaune:#FFD23F;--vrai:#2FBF71;--vrai-f:#16733F;--faux:#FF6B57;--faux-f:#B3261E;--ligne:rgba(255,255,255,.22);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--clair);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:1.08rem;line-height:1.5;
  background:radial-gradient(1200px 600px at 15% -10%,rgba(255,210,63,.13),transparent 60%),radial-gradient(900px 700px at 110% 110%,rgba(120,220,180,.14),transparent 60%),linear-gradient(160deg,var(--fond1),var(--fond2));background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--jaune);outline-offset:3px}
.page{max-width:1000px;margin:0 auto;padding:1.4rem 1.1rem 3rem}
header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(2rem,6vw,3rem);line-height:1;margin:0}
header p{margin:.45rem 0 0;opacity:.85;max-width:62ch}
.jeu{display:grid;gap:1.1rem;margin-top:1.2rem}
@media (min-width:880px){.jeu{grid-template-columns:290px 1fr;align-items:start}.bord{position:sticky;top:1rem}}
.bord{background:rgba(9,38,33,.9);border:2px solid var(--ligne);border-radius:24px;padding:1.1rem}
.bord h2{font-size:1rem;margin:0 0 .5rem;opacity:.9}
.douleur .lab{display:flex;justify-content:space-between;font-weight:700;margin-bottom:.3rem}
.douleur .piste{height:14px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.douleur .piste span{display:block;height:100%;border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1),background .5s}
.poste{margin:.9rem 0;padding:.6rem .7rem;border-radius:12px;background:rgba(255,255,255,.08);font-size:.95rem}
.poste b{display:block}
.jetons{display:flex;flex-wrap:wrap;gap:.35rem}
.jeton{border-radius:999px;padding:.2rem .6rem;font-size:.85rem;font-weight:700;background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.35);opacity:.55}
.jeton.on{background:var(--vrai);color:#04230F;border:1px solid var(--vrai);opacity:1}
.scene{background:var(--clair);color:var(--encre);border-radius:24px;padding:clamp(1.1rem,3.5vw,1.8rem);box-shadow:0 30px 60px -25px rgba(0,0,0,.6)}
.num{font-weight:700;color:var(--doux);font-size:.95rem;display:flex;justify-content:space-between}
.pts{display:flex;gap:5px;align-items:center}
.pts i{width:10px;height:10px;border-radius:50%;background:#C9D3CD}
.pts i.fait{background:var(--vrai-f)}.pts i.ici{background:#E0A800}
.moment{display:flex;gap:.8rem;align-items:center;margin:.5rem 0 .3rem}
.moment .emo{font-size:2.6rem;line-height:1}
.moment h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1.35rem,3.6vw,1.8rem);margin:0;line-height:1.15}
.recit{font-size:1.14rem;margin:.3rem 0 .8rem}
.question{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.25rem;line-height:1.25;margin:0 0 .7rem}
.opts{display:grid;gap:.5rem}
.opt{text-align:left;border:2px solid #B9C5BE;background:#fff;border-radius:16px;padding:.8rem 1rem;font-weight:700;display:flex;gap:.6rem;align-items:center}
.opt .ic{font-size:1.4rem}
.opt:hover{border-color:var(--encre)}
.opt:disabled{cursor:default}
.opt.bon{background:#DDF4E7;border-color:var(--vrai-f)}
.opt.mauvais{background:#FFE3DE;border-color:var(--faux-f)}
.suite{margin-top:1rem;border-radius:16px;padding:.8rem 1rem}
.suite.ok{background:#DDF4E7;border-left:6px solid var(--vrai-f)}
.suite.ko{background:#FFE3DE;border-left:6px solid var(--faux-f)}
.suite b{display:block}
.continuer{width:100%;height:56px;border-radius:999px;border:0;background:var(--encre);color:var(--clair);font-weight:700;font-size:1.1rem;margin-top:.9rem}
.lire{border:2px solid #B9C5BE;background:transparent;border-radius:999px;padding:.3rem .8rem;font-size:.95rem;font-weight:700;margin-top:.8rem}
.frise{list-style:none;padding:0;margin:1rem 0;border-left:4px solid var(--vrai-f)}
.frise li{padding:.2rem 0 .7rem 1rem;position:relative}
.frise li::before{content:"";position:absolute;left:-11px;top:.45rem;width:14px;height:14px;border-radius:50%;background:var(--vrai-f);border:3px solid var(--clair)}
.etoiles{font-size:2.2rem;color:#E0A800;letter-spacing:.15rem}
.retenir{border:3px solid var(--encre);border-radius:16px;padding:.8rem 1rem;margin-top:.8rem}
.retenir b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.1rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.douleur .piste span{transition:none}}

.fil{margin:0 0 .7rem}
.fil a{color:var(--clair);opacity:.85;text-decoration:underline;text-underline-offset:4px;font-size:1rem;padding:.35rem .1rem;display:inline-block}
.fil a:hover{opacity:1}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>L'histoire de Kévin</h1>
    <p>De l'huile rend le sol glissant au garage de Kévin. À chaque étape, choisis le bon acteur pour faire avancer l'histoire.</p>
  </header>
  <nav class="fil" aria-label="Fil d'Ariane"><a href="cap_C6_jeux.html">← Toutes les révisions C6</a></nav>
  <div class="jeu">
    <aside class="bord" aria-label="Suivi">
      <h2>Niveau de risque au garage</h2>
      <div class="douleur"><div class="lab"><span id="dLab"></span><span id="dVal"></span></div><div class="piste"><span id="dBar"></span></div></div>
      <div class="poste" id="poste"></div>
      <h2>Acteurs mobilisés</h2>
      <div class="jetons" id="jetons"></div>
    </aside>
    <main class="scene" id="scene"></main>
  </div>
  <div class="sr" aria-live="polite" id="annonce"></div>
</div>
<script>
(function(){const S=window.SpeechSynthesisUtterance;if(!S)return;
 const sig=t=>String(t).replace(/\bCSE\b/g,"C S E").replace(/\bSST\b/g,"S S T").replace(/\bPPRP\b/g,"P P R P").replace(/\bSPST\b/g,"S P S T").replace(/\bIPRP\b/g,"I P R P").replace(/\bEPI\b/g,"E P I");
 window.SpeechSynthesisUtterance=function(t){return new S(sig(t))};})();

/* ===== SCÈNES — opts [icône, texte, 1 si juste, conséquence] ===== */
const JETONS=[["emp","Employeur"],["pprp","Salarié compétent"],["sst","SST"],["cse","CSE"],["med","SPST"],["carsat","Carsat"],["iprp","IPRP"],["insp","Inspection du travail"]];
const SCENES=[
 {emoji:"🛢️",titre:"Mardi matin",jeton:"emp",douleur:8,poste:"Huile au sol, personne ne l'a essuyée",
  recit:"Kévin doit vidanger une voiture sur le pont élévateur. De l'huile est répandue au sol depuis la veille : c'est glissant.",
  q:"À qui Kévin doit-il signaler le danger ?",
  opts:[["💶","À la Carsat.",0,"La Carsat est un organisme extérieur. Dans le garage, on s'adresse d'abord à l'employeur."],
        ["👔","À l'employeur ou à son représentant dans le garage.",1,"Le chef d'atelier fait nettoyer l'huile tout de suite. L'employeur peut faire supprimer le sol glissant."],
        ["⚖️","À l'inspection du travail.",0,"L'inspection du travail contrôle depuis l'extérieur. Pour un problème immédiat au garage, on prévient l'employeur."]]},
 {emoji:"📋",titre:"Mardi après-midi",jeton:"pprp",douleur:6,poste:"Sol nettoyé",
  recit:"L'employeur veut comprendre pourquoi l'huile se répand et éviter que ça recommence.",
  q:"Quel salarié l'aide à évaluer ce risque ?",
  opts:[["📋","Le salarié compétent (PPRP).",1,"Il participe à l'évaluation des risques et aide à mettre en place des actions de prévention."],
        ["⛑️","Le sauveteur secouriste du travail.",0,"Le SST porte les premiers secours ; c'est le salarié compétent qui aide l'employeur à évaluer les risques."],
        ["🧑","Un client du garage.",0,"Un client n'est pas un acteur de la prévention."]]},
 {emoji:"⛑️",titre:"Jeudi",jeton:"sst",douleur:6,poste:"Sol nettoyé, mais l'huile revient",
  recit:"Un collègue glisse sur une nouvelle flaque d'huile et se fait mal au poignet.",
  q:"Qui porte les premiers secours ?",
  opts:[["🩺","Le médecin du travail.",0,"Il n'est pas dans le garage : c'est le SST, présent sur place, qui intervient."],
        ["⛑️","Le sauveteur secouriste du travail (SST).",1,"Il est formé au secours aux victimes : il s'occupe du collègue blessé."],
        ["⏳","Personne : on attend la fin de la journée.",0,"Face à un accident, il faut agir tout de suite."]]},
 {emoji:"🗣️",titre:"La semaine suivante",jeton:"cse",douleur:5,poste:"Un accident du travail a eu lieu",
  recit:"Les salariés veulent comprendre comment l'accident a pu arriver. Le garage emploie 24 salariés.",
  q:"Qui peut réaliser une enquête après cet accident du travail ?",
  opts:[["🗣️","Le comité social et économique (CSE).",1,"Avec 24 salariés, le garage a un CSE. Il réalise des enquêtes après un accident du travail."],
        ["💶","La Carsat.",0,"Dans l'entreprise, l'enquête après un accident est une mission du CSE."],
        ["⛑️","Le sauveteur secouriste du travail.",0,"Le SST porte les secours ; l'enquête est une mission du CSE."]]},
 {emoji:"🩺",titre:"Deux mois plus tard",jeton:"med",douleur:4,poste:"Enquête faite : il faut un équipement",
  recit:"Le collègue blessé reprend le travail après deux mois d'arrêt. Il doit revoir un professionnel de santé.",
  q:"Qui assure le suivi de sa santé ?",
  opts:[["⚖️","L'inspection du travail.",0,"Elle contrôle le droit du travail, elle ne suit pas la santé des salariés."],
        ["🗣️","Le CSE.",0,"Le CSE représente les salariés ; le suivi de la santé est assuré par le SPST."],
        ["🩺","Le service de prévention et de santé au travail (SPST).",1,"Le médecin du travail et son équipe suivent la santé des travailleurs."]]},
 {emoji:"💶",titre:"Le budget",jeton:"carsat",douleur:2,poste:"Équipement de récupération d'huile installé",
  recit:"L'enquête montre qu'il faut un équipement pour récupérer l'huile des vidanges. Il coûte cher.",
  q:"Quel organisme peut aider le garage à le financer ?",
  opts:[["💶","La Carsat.",1,"Elle accorde une aide financière pour investir dans la prévention. L'équipement est installé !"],
        ["⚖️","L'inspection du travail.",0,"L'inspection du travail ne verse pas d'aides financières."],
        ["🩺","Le SPST.",0,"Le SPST suit la santé ; il ne finance pas les équipements."]]},
 {emoji:"🧪",titre:"Les produits",jeton:"iprp",douleur:1,poste:"Équipement installé, produits étudiés",
  recit:"L'employeur veut aussi étudier les risques des produits utilisés au garage, mais personne n'a les compétences nécessaires.",
  q:"À qui peut-il faire appel ?",
  opts:[["🧑‍🔬","À un intervenant en prévention des risques professionnels (IPRP).",1,"Quand l'entreprise n'a pas les compétences, l'employeur peut faire appel à un IPRP."],
        ["🗣️","Au CSE.",0,"Le CSE représente les salariés, il n'apporte pas ces compétences techniques."],
        ["🧑‍🔧","À Kévin.",0,"Kévin participe à la prévention, mais il n'est pas spécialiste."]]},
 {emoji:"⚖️",titre:"Et si…",jeton:"insp",douleur:1,poste:"Garage plus sûr",
  recit:"Imaginons que rien n'ait été fait et qu'un travailleur soit exposé à un danger grave et imminent.",
  q:"Qui pourrait décider l'arrêt temporaire de l'activité ?",
  opts:[["💶","La Carsat.",0,"Elle conseille et aide ; c'est l'agent de contrôle de l'inspection du travail qui peut arrêter une activité."],
        ["⚖️","L'agent de contrôle de l'inspection du travail.",1,"Dans certaines situations prévues par le Code du travail, il peut arrêter temporairement l'activité pour protéger le travailleur."],
        ["⛑️","Le sauveteur secouriste du travail.",0,"Le SST porte les secours ; il ne peut pas arrêter une activité."]]}
];
const $=id=>document.getElementById(id);
function annoncer(t){$("annonce").textContent=t}
const CLE="histoire-kevin-C6";let pref={etoiles:0};
try{pref=Object.assign(pref,JSON.parse(localStorage.getItem(CLE)||"{}"))}catch(e){}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(pref))}catch(e){}}
function melanger(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let k,err,gagnes,douleur,poste;

function bord(){
  $("dLab").textContent=douleur>=6?"Risque élevé":douleur>=3?"Risque moyen":"Risque faible";
  $("dVal").textContent=`${douleur} / 10`;
  $("dBar").style.width=(douleur*10)+"%";$("dBar").style.background=douleur>=6?"#FF6B57":douleur>=3?"#FFD23F":"#2FBF71";
  $("poste").innerHTML=`<b>Zone du pont élévateur</b>${poste}`;
  $("jetons").innerHTML=JETONS.map(([id,n])=>`<span class="jeton${gagnes.has(id)?" on":""}">${gagnes.has(id)?"✓ ":""}${n}</span>`).join("");
}
function accueil(){
  k=0;err=0;gagnes=new Set();douleur=8;poste="Huile au sol, personne ne l'a essuyée";bord();
  $("scene").innerHTML=`<div class="moment"><span class="emo" aria-hidden="true">🔧</span><h2>Le garage, pont élévateur</h2></div>
    <p class="recit">Kévin, 19 ans, est mécanicien depuis trois mois dans un garage de 24 salariés. Mardi matin, de l'huile est répandue autour du pont élévateur depuis la veille : le sol est glissant.</p>
    <p class="recit"><b>Ta mission :</b> à chaque étape, choisis l'acteur qui peut agir. Si tu te trompes, l'histoire t'explique pourquoi et tu peux réessayer.</p>
    <button class="continuer" id="bGo">Commencer l'histoire</button>`;
  $("bGo").onclick=scene;$("bGo").focus({preventScroll:true});
}
function scene(){
  const S=SCENES[k],opts=melanger(S.opts.map((o,i)=>[o,i]));let premier=true;
  $("scene").innerHTML=`<div class="num"><span>Étape ${k+1} / ${SCENES.length}</span><span class="pts" aria-hidden="true">${SCENES.map((_,j)=>`<i class="${j<k?"fait":j===k?"ici":""}"></i>`).join("")}</span></div>
    <div class="moment"><span class="emo" aria-hidden="true">${S.emoji}</span><h2>${S.titre}</h2></div>
    <p class="recit">${S.recit}</p><p class="question">${S.q}</p>
    <div class="opts">${opts.map(([o,i])=>`<button class="opt" data-i="${i}"><span class="ic" aria-hidden="true">${o[0]}</span>${o[1]}</button>`).join("")}</div>
    <div id="suite"></div><button class="lire" id="bLire">🔊 Écouter</button>`;
  $("bLire").onclick=()=>lire(`${S.recit} ${S.q} ${S.opts.map(o=>o[1]).join(" Ou : ")}`);
  $("scene").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=S.opts[+b.dataset.i];
    if(o[2]){
      $("scene").querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add("bon");
      gagnes.add(S.jeton);douleur=S.douleur;poste=S.poste;
      const nxt=SCENES[k+1];if(nxt){douleur=Math.min(douleur,nxt.douleur)}
      bord();
      $("suite").innerHTML=`<div class="suite ok"><b>✓ ${premier?"Bon choix !":"C'est ça."}</b>${o[3]}</div><button class="continuer" id="bCont">${k<SCENES.length-1?"La suite de l'histoire":"Voir la fin"}</button>`;
      $("bCont").onclick=()=>{arreterVoix();k++;k<SCENES.length?scene():fin()};$("bCont").focus({preventScroll:true});
      annoncer(o[3]);
    }else{
      if(premier){premier=false}err++;b.classList.add("mauvais");b.disabled=true;
      $("suite").innerHTML=`<div class="suite ko"><b>Pas le bon acteur.</b>${o[3]}</div>`;annoncer(o[3]);
    }
  });
  annoncer(`${S.titre}. ${S.recit} ${S.q}`);
}
function fin(){
  const et=err===0?3:err<=3?2:1;pref.etoiles=Math.max(pref.etoiles,et);sauver();
  douleur=1;poste="Garage plus sûr : équipement de récupération d'huile installé";bord();
  $("scene").innerHTML=`<div class="moment"><span class="emo" aria-hidden="true">🎉</span><h2>Le garage est plus sûr</h2></div>
    <div class="etoiles" aria-label="${et} étoiles sur 3">${"★".repeat(et)}<span style="opacity:.25">${"★".repeat(3-et)}</span></div>
    <p style="margin:0">${err} erreur${err>1?"s":""} d'aiguillage.</p>
    <ol class="frise">
      <li><b>Employeur :</b> fait supprimer le sol glissant et organise la prévention.</li>
      <li><b>Salarié compétent :</b> aide à évaluer le risque.</li>
      <li><b>SST :</b> porte les premiers secours au collègue blessé.</li>
      <li><b>CSE :</b> réalise l'enquête après l'accident.</li>
      <li><b>SPST :</b> suit la santé du salarié à sa reprise.</li>
      <li><b>Carsat :</b> aide à financer l'équipement.</li>
      <li><b>IPRP :</b> apporte des compétences que le garage n'a pas.</li>
      <li><b>Inspection du travail :</b> peut arrêter une activité en cas de danger grave et imminent.</li>
    </ol>
    <div class="retenir"><b>À retenir</b>Pour la santé et la sécurité au travail, chaque acteur a son rôle : dans l'entreprise, ils agissent au quotidien ; à l'extérieur, ils conseillent, contrôlent et accompagnent. Tous agissent ensemble.</div>
    <button class="continuer" id="bRec">Rejouer l'histoire</button>`;
  $("bRec").onclick=accueil;$("bRec").focus({preventScroll:true});
}
let voix=null;
function choisirVoix(){const l=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));voix=l.find(x=>/fr-FR/i.test(x.lang)&&/(google|natural|online|amélie|thomas|denise|henri)/i.test(x.name))||l.find(x=>/fr-FR/i.test(x.lang))||l[0]||null}
if("speechSynthesis" in window){choisirVoix();speechSynthesis.onvoiceschanged=choisirVoix}
function lire(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\bCSE\b/g,"C S E").replace(/\bSST\b/g,"S S T").replace(/\bPPRP\b/g,"P P R P").replace(/\bIPRP\b/g,"I P R P").replace(/\bSPST\b/g,"S P S T"));u.lang="fr-FR";if(voix)u.voice=voix;u.rate=.95;speechSynthesis.speak(u)}
function arreterVoix(){if("speechSynthesis" in window)speechSynthesis.cancel()}
accueil();
</script>
</body>
</html>
