rticles L. 411-1 et L. 411-2.", "date_consultation": "2026-09-24", "image_w": 1500, "image_h": 630, "image_nom": "Illustration « Les trajets protégés » : sur une même rue, le domicile, le lieu de travail et le lieu habituel du repas. Une double flèche « Trajet habituel » relie le domicile au lieu de travail, une autre relie le lieu de travail au lieu habituel du repas. Un salarié marche entre son domicile et son lieu de travail.", "image_pos": "centre", "image_largeur": 80, "img": "cap_C2/images/cap_C2_c2cap_doc3.jpg", "img_desc": "Illustration « Les trajets protégés » : sur une même rue, le domicile, le lieu de travail et le lieu habituel du repas. Une double flèche « Trajet habituel » relie le domicile au lieu de travail, une autre relie le lieu de travail au lieu habituel du repas. Un salarié marche entre son domicile et son lieu de travail.", "img_w": 1400, "img_h": 588}}, {"id": "c2cap_ch5", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 3 :", "reponse_attendue": ""}}, {"id": "c2cap_q51", "type": "cocher_exactes", "data": {"competence": "C1", "numero": "1.1", "consigne": "**Cocher** les quatre critères d’un accident du travail.", "items": [{"texte": "La victime est salariée", "correct": true}, {"texte": "La victime a plus de 25 ans", "correct": false}, {"texte": "L’événement est soudain", "correct": true}, {"texte": "L’événement arrive par le fait ou à l’occasion du travail", "correct": true}, {"texte": "La victime est hospitalisée", "correct": false}, {"texte": "L’événement provoque une lésion", "correct": true}]}, "el": {"standard": {"indice": "DOC. 3 : le point 1, les mots en gras.", "explication": "Les quatre critères : la victime est salariée ; l’événement est soudain ; il arrive par le fait ou à l’occasion du travail ; il provoque une lésion. L’âge de la victime et l’hospitalisation ne sont pas des critères."}, "essentiel": {"indice": "DOC. 3 : le point 1, les mots en gras.", "explication": "Quatre critères : un salarié, un événement soudain, pendant le travail, une lésion. L’âge et l’hôpital ne comptent pas."}}}, {"id": "c2cap_q52", "type": "classer", "data": {"competence": "C1", "numero": "1.2", "titre": "", "consigne": "**Identifier** la catégorie de chaque accident,.", "categories": ["Accident du travail", "Accident de trajet", "Accident de droit commun"], "items": ["Une serveuse se brûle avec une casserole pendant le service.", "Un cuisinier glisse sur le trottoir en allant de chez lui au restaurant.", "Un mécanicien se tord la cheville pendant un match de football, le dimanche.", "Une coiffeuse se coupe avec ses ciseaux en coupant les cheveux d’une cliente.", "Un livreur salarié tombe de vélo pendant un détour personnel, pour rendre visite à un ami."], "classement": [0, 1, 2, 0, 2], "indice": "", "variantes": {"adapte": {"indice": "Pour chaque accident, chercher s’il arrive pendant le travail, sur le trajet habituel, ou en dehors des deux."}, "essentiel": {"indice": "Un accident pendant un loisir ou pendant un détour personnel est un accident de droit commun."}}}, "el": {"standard": {"indice": "DOC. 3 : un point par catégorie d’accident. Pour chaque cas : pendant le travail, sur le trajet habituel, ou en dehors des deux.", "explication": "La serveuse et la coiffeuse se blessent pendant leur travail : accidents du travail. Le cuisinier glisse sur le trajet habituel entre son domicile et le restaurant : accident de trajet. Le match de football du dimanche n’a pas de lien avec le travail : accident de droit commun. Le livreur fait un détour personnel : accident de droit commun."}, "essentiel": {"indice": "DOC. 3 : le point 1 pour le travail, le point 2 pour le trajet, le point 3 pour le reste.", "explication": "Pendant le travail : la serveuse et la coiffeuse, accidents du travail. Sur le trajet habituel : le cuisinier, accident de trajet. Le match de football et le détour personnel : accidents de droit commun."}}}, {"id": "c2cap_analyse6", "type": "analyse", "data": {"titre": "LA MALADIE PROFESSIONNELLE"}}, {"id": "c2cap_doc4", "type": "document", "data": {"label": "DOC. 4", "titre": "La maladie professionnelle", "cadre": true, "corps": "1. Une **maladie professionnelle** est la conséquence d’une **exposition** à un risque pendant le travail habituel.\n2. Le plus souvent, cette exposition est **chronique** : elle se répète ou elle dure pendant des mois ou des années. La maladie apparaît alors **lentement**, parfois après la fin de l’activité.\n3. Quand une maladie figure dans un **tableau de maladies professionnelles** et que les conditions du tableau sont remplies, elle est reconnue comme maladie professionnelle sans autre preuve à apporter. Les autres maladies peuvent être étudiées au cas par cas par la caisse.\n4. Le tableau ci-dessous est simplifié : la caisse vérifie aussi le diagnostic précis et le délai de prise en charge.\n**Exemple.** Un déménageur porte des meubles et des cartons lourds depuis douze ans. Son médecin constate une sciatique par hernie discale et la relie au port répété de charges.", "source": "D’après l’INRS, tableau n° 98 du régime général.", "date_consultation": "2026-09-24", "image_w": 1200, "image_h": 800, "image_nom": "Illustration : un déménageur se redresse avec difficulté, la main sur le bas du dos, devant son camion de déménagement.", "image_pos": "droite", "image_largeur": 22, "img": "cap_C2/images/cap_C2_c2cap_doc4.jpg", "img_desc": "Illustration : un déménageur se redresse avec difficulté, la main sur le bas du dos, devant son camion de déménagement.", "img_w": 1200, "img_h": 800}}, {"id": "c2cap_doc4_tab", "type": "tableau", "data": {"titre": "", "cells": [[{"type": "prof", "content": "Tableau n° 98 (simplifié)"}, {"type": "prof", "content": "Ce que dit le tableau"}], [{"type": "prof", "content": "La maladie"}, {"type": "prof", "content": "Une sciatique par hernie discale : un mal de dos avec une douleur qui descend dans la jambe."}], [{"type": "prof", "content": "Les travaux qui peuvent la provoquer"}, {"type": "prof", "content": "La manutention manuelle habituelle de charges lourdes, par exemple dans le bâtiment, le déménagement ou le ramassage des ordures."}], [{"type": "prof", "content": "La durée d’exposition"}, {"type": "prof", "content": "Au moins 5 ans."}]], "table_preset": "sobre", "table_border": "fine", "table_row_height": "normal", "table_col_widths": [32, 68]}}, {"id": "c2cap_ch6", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir des documents 3 et 4 :", "reponse_attendue": ""}}, {"id": "c2cap_q61", "type": "sous_question", "data": {"competence": "C3", "numero": "2.1", "texte": "**Expliquer** pourquoi le mal de dos du déménageur donné en exemple est une maladie professionnelle et non un accident du travail.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Son mal de dos ne vient pas d’un événement soudain : il est dû à une exposition chronique, le port répété de charges lourdes pendant des années.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"reponse_allegee": "Son mal de dos ne vient pas d’un événement {{soudain}} : il est dû à une exposition {{chronique}}, le port répété de charges lourdes pendant des années.", "texte": "**Expliquer** pourquoi le mal de dos du déménageur donné en exemple est une maladie professionnelle et non un accident du travail.\nSon mal de dos ne vient pas d’un événement …………… : il est dû à une exposition ……………, le port répété de charges lourdes pendant des années.", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 3 : le point 1, le mot qui décrit l’événement d’un accident du travail. DOC. 4 : le point 2 et l’exemple.", "explication": "Un accident du travail vient d’un événement soudain. Le mal de dos du déménageur ne vient pas d’un événement soudain : il est dû à une exposition chronique, le port répété de charges lourdes pendant des années. C’est une maladie professionnelle."}, "adapte": {"indice": "DOC. 3 : le point 1, l’adjectif en gras après « événement ». DOC. 4 : le point 2, l’adjectif en gras après « exposition ».", "explication": "Son mal de dos ne vient pas d’un événement soudain : il est dû à une exposition chronique, le port répété de charges lourdes pendant des années.", "trous": ["soudain|brutal", "chronique|répétée|repetee|longue"]}}}, {"id": "c2cap_q61_ess", "type": "sous_question", "data": {"competence": "C3", "numero": "2.1", "texte": "**Expliquer** pourquoi le mal de dos du déménageur est une maladie professionnelle.\nMots proposés : soudain – répété – chronique – rapide.\nSon mal de dos ne vient pas d’un événement …………… : il est dû au port …………… de charges lourdes pendant des années, une exposition …………… .", "points": "", "lignes": 0, "style_lignes": "pointilles", "support_type": "", "reponse_attendue": "soudain\nrépété\nchronique", "indice": "", "reponse_allegee": "", "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 3 : le point 1, « un événement… ». DOC. 4 : le point 2, « cette exposition est… ». Un des quatre mots proposés ne sert pas.", "explication": "Son mal de dos ne vient pas d’un événement soudain. Il est dû au port répété de charges lourdes pendant des années : c’est une exposition chronique. Le mot « rapide » ne sert pas.", "trous": ["soudain", "répété|repete", "chronique"]}}}, {"id": "c2cap_q62", "type": "sous_question", "data": {"competence": "C2", "numero": "2.2", "texte": "**Indiquer** si la maladie du déménageur remplit chaque condition du tableau des maladies professionnelles, en complétant le tableau.", "points": "", "lignes": 0, "style_lignes": "pointilles", "support_type": "", "reponse_attendue": "", "indice": "", "reponse_allegee": ""}, "el": {"standard": {"indice": "DOC. 4 : comparer l’exemple du déménageur avec chaque ligne du tableau n° 98.", "explication": "La maladie : une sciatique par hernie discale, elle figure dans le tableau. Les travaux : le port de charges lourdes dans le déménagement, ils leur sécurité et protéger leur santé, par des actions de **prévention**, d’**information** et de **formation**.\n3. Le **salarié** prend soin de sa **sécurité** et de sa santé, et de celles des autres personnes concernées par son travail, selon sa formation et les **consignes** de l’employeur.\n4. Le salarié a un **droit d’alerte** et un **droit de retrait** : s’il pense, pour un motif raisonnable, qu’une situation présente un **danger grave et imminent**, il prévient l’employeur et peut s’en retirer, sans sanction, à condition de ne pas mettre d’autres personnes en danger.", "source": "Code du travail, articles L. 4121-1, L. 4122-1 et L. 4131-1.", "date_consultation": "2026-09-24"}}, {"id": "c2cap_ch8", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 5 :", "reponse_attendue": ""}}, {"id": "c2cap_q81", "type": "classer", "data": {"competence": "C1", "numero": "1.1", "titre": "", "consigne": "**Classer** chaque action selon la personne qui doit la faire, en écrivant la catégorie dans le tableau.", "categories": ["L’employeur", "Le salarié"], "items": ["Former les salariés à la sécurité", "Respecter les consignes de sécurité", "Prendre soin de la sécurité des autres personnes", "Prendre les mesures pour protéger la santé des salariés", "Informer les salariés sur les risques", "Prévenir l’employeur d’un danger grave et imminent"], "classement": [0, 1, 1, 0, 0, 1], "indice": "", "variantes": {"adapte": {"indice": "Chercher dans le document ce que fait l’employeur (point 2) et ce que fait le salarié (points 3 et 4)."}, "essentiel": {"indice": "Former et informer : c’est le rôle de celui qui dirige l’entreprise."}}}, "el": {"standard": {"indice": "DOC. 5 : le point 2 pour l’employeur, les points 3 et 4 pour le salarié.", "explication": "L’employeur : former les salariés à la sécurité, prendre les mesures pour protéger leur santé, les informer sur les risques. Le salarié : respecter les consignes de sécurité, prendre soin de la sécurité des autres personnes, prévenir l’employeur d’un danger grave et imminent."}, "essentiel": {"indice": "DOC. 5 : le point 2 parle de l’employeur, les points 3 et 4 parlent du salarié.", "explication": "L’employeur forme, informe et protège les salariés. Le salarié respecte les consignes, prend soin des autres et prévient l’employeur d’un danger."}}}, {"id": "c2cap_analyse9", "type": "analyse", "data": {"titre": "LE NOUVEL EMBAUCHÉ ET LE JEUNE TRAVAILLEUR"}}, {"id": "c2cap_doc6", "type": "document", "data": {"label": "DOC. 6", "titre": "Le nouvel embauché et le jeune travailleur", "cadre": true, "corps": "1. Tout **nouvel embauché** reçoit une **formation** pratique à la **sécurité** : les risques de son poste, les **consignes**, les **équipements de protection** et la conduite à tenir en cas d’accident.\n2. Un **jeune travailleur** a moins de **18 ans**.\n3. Certains travaux sont **interdits** aux jeunes travailleurs, car ils sont trop dangereux : ils restent toujours interdits.\n4. D’autres travaux sont **réglementés**, par exemple utiliser certaines machines ou monter un échafaudage. Un jeune de 15 à moins de 18 ans en formation professionnelle peut les faire seulement si l’employeur a déclaré une **dérogation**, a évalué les risques, le forme et l’**encadre**, et si un **avis médical** l’y autorise.", "source": "D’après le Code du travail, article L. 4141-2, et Service-Public.", "date_consultation": "2026-09-24", "image_w": 1200, "image_h": 800, "image_nom": "Illustration : une responsable accueille un nouvel employé dans la réserve d’un supermarché, lui remet des gants et lui montre les pictogrammes de sécurité.", "image_pos": "droite", "image_largeur": 22, "img": "cap_C2/images/cap_C2_c2cap_doc6.jpg", "img_desc": "Illustration : une responsable accueille un nouvel employé dans la réserve d’un supermarché, lui remet des gants et lui montre les pictogrammes de sécurité.", "img_w": 1200, "img_h": 800}}, {"id": "c2cap_ch9", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 6 :", "reponse_attendue": ""}}, {"id": "c2cap_q91", "type": "sous_question", "data": {"competence": "C1", "numero": "2.1", "texte": "**Relever** trois éléments de la formation à la sécurité d’un nouvel embauché.", "points": "", "lignes": 3, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "Trois éléments parmi :\n– les risques de son poste ;\n– les consignes ;\n– les équipements de protection ;\n– la conduite à tenir en cas d’accident.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1, "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"reponse_allegee": "– Les {{risques}} de son poste.\n– Les {{consignes}}.\n– Les {{équipements}} de protection.", "texte": "**Relever** trois éléments de la formation à la sécurité d’un nouvel embauché.\n– Les …………… de son poste.\n– Les …………….\n– Les …………… de protection.", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 6 : le point 1, la liste après les deux-points.", "explication": "Trois éléments parmi : les risques de son poste, les consignes, les équipements de protection, la conduite à tenir en cas d’accident."}, "adapte": {"indice": "DOC. 6 : le point 1, les mots de la liste après les deux-points.", "explication": "Les risques de son poste, les consignes, les équipements de protection.", "trous": ["risques|risque", "consignes|consigne", "équipements|equipements|équipement|equipement"]}}}, {"id": "c2cap_q91_ess", "type": "cocher_exactes", "data": {"competence": "C1", "numero": "2.1", "consigne": "**Sélectionner** les éléments de la formation à la sécurité d’un nouvel embauché.", "items": [{"texte": "Les risques de son poste", "correct": true}, {"texte": "Le prix des matériaux", "correct": false}, {"texte": "Les consignes", "correct": true}, {"texte": "Les équipements de protection", "correct": true}, {"texte": "Les horaires des autres entreprises", "correct": false}, {"texte": "La conduite à tenir en cas d’accident", "correct": true}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 6 : le point 1, la liste après les deux-points.", "explication": "Quatre éléments : les risques de son poste, les consignes, les équipements de protection, la conduite à tenir en cas d’accident. Le prix des matériaux et les horaires des autres entreprises ne sont pas dans la formation."}}}, {"id": "c2cap_q92", "type": "cocher_exactes", "data": {"competence": "C1", "numero": "2.2", "consigne": "**Cocher** les quatre conditions qui permettent à un jeune en formation de faire un travail réglementé.", "items": [{"texte": "L’employeur a déclaré une dérogation", "correct": true}, {"texte": "Le jeune a l’accord de ses amis", "correct": false}, {"texte": "L’employeur a évalué les risques", "correct": true}, {"texte": "L’employeur forme et encadre le jeune", "correct": true}, {"texte": "Le jeune reçoit un salaire plus élevé", "correct": false}, {"texte": "Un avis médical l’y autorise", "correct": true}]}, "el": {"standard": {"indice": "DOC. 6 : le point 4, la phrase qui commence par « Un jeune de 15 à moins de 18 ans… ».", "explication": "Quatre conditions : l’employeur a déclaré une dérogation, il a évalué les risques, il forme et encadre le jeune, et un avis médical l’y autorise. L’accord des amis et le salaire ne sont pas des conditions."}, "essentiel": {"indice": "DOC. 6 : le point 4, la dernière phrase.", "explication": "Quatre conditions : une dérogation déclarée, des risques évalués, un jeune formé et encadré, un avis médical. Les amis et le salaire ne comptent pas."}}}, {"id": "c2cap_q93", "type": "sous_question", "data": {"competence": "C3", "numero": "2.3", "texte": "**Établir le lien** entre la formation à la sécurité d’un nouvel embauché et la prévention des accidents.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Formé, le nouvel embauché connaît les risques de son poste et les consignes : il les applique et risque moins d’avoir un accident.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"reponse_allegee": "Formé, le nouvel embauché connaît les {{risques}} de son poste et les consignes : il les applique et risque moins d’avoir un {{accident}}.", "texte": "**Établir le lien** entre la formation à la sécurité d’un nouvel embauché et la prévention des accidents.\nFormé, le nouvel embauché connaît les …………… de son poste et les consignes : il les applique et risque moins d’avoir un …………….", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 6 : le point 1, ce que le nouvel embauché apprend pendant sa formation.", "explication": "Formé, le nouvel embauché connaît les risques de son poste et les consignes. Il les applique et risque moins d’avoir un accident."}, "adapte": {"indice": "DOC. 6 : le point 1, le premier élément de la liste. Le second mot est ce que la prévention cherche à éviter.", "explication": "Formé, le nouvel embauché connaît les risques de son poste et les consignes : il les applique et risque moins d’avoir un accident.", "trous": ["risques|risque|dangers|danger", "accident|accident du travail"]}}}, {"id": "c2cap_q93_ess", "type": "sous_question", "data": {"competence": "C3", "numero": "2.3", "texte": "**Établir le lien** entre la formation à la sécurité et la prévention des accidents.\nMots proposés : risques – accidents – salaires.\nFormé, le nouvel embauché connaît les …………… de son poste et les consignes : il risque moins d’avoir des …………… .", "points": "", "lignes": 0, "style_lignes": "pointilles", "support_type": "", "reponse_attendue": "risques\naccidents", "indice": "", "reponse_allegee": "", "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 6 : le point 1, le premier élément de la liste. Un des trois mots proposés ne sert pas.", "explication": "Formé, le nouvel embauché connaît les risques de son poste et les consignes : il risque moins d’avoir des accidents. Le mot « salaires » ne sert pas.", "trous": ["risques|risque", "accidents|accident"]}}}, {"id": "c2cap_analyse10", "type": "analyse", "data": {"titre": "DÉCLARER UN ACCIDENT DU TRAVAIL"}}, {"id": "c2cap_doc7", "type": "document_texte_image", "data": {"label": "DOC. 7", "titre": "Déclarer un accident du travail", "corps": "Dès qu’il est informé, l’employeur déclare l’accident dans les 48 heures. Ce délai ne compte ni les dimanches ni les jours fériés.", "cadre": true, "image_nom": "Schéma « Déclarer un accident du travail ». Le salarié informe son employeur dans la journée, au plus tard dans les 24 heures, et consulte un médecin. Deux branches en parallèle : le médecin constate les lésions, établit le certificat médical initial et l’envoie à la CPAM ; l’employeur, dès qu’il est informé, déclare l’accident à la CPAM (ou à la MSA) dans les 48 heures, hors dimanches et jours fériés, remet la feuille d’accident au salarié et envoie une attestation de salaire. La CPAM (ou la MSA) reçoit la déclaration et le certificat. La feuille d’accident : le salarié la présente au médecin, au pharmacien, au kinésithérapeute ; les soins liés à l’accident sont pris en charge à 100 % du tarif de base, sans avance de frais.", "image_w": 1800, "image_h": 1340, "image_largeur": 100, "image_taille": "pleine", "source": "D’après Service-Public.", "date_consultation": "2026-09-24", "img": "cap_C2/images/cap_C2_c2cap_doc7.jpg", "img_desc": "Schéma « Déclarer un accident du travail ». Le salarié informe son employeur dans la journée, au plus tard dans les 24 heures, et consulte un médecin. Deux branches en parallèle : le médecin constate les lésions, établit le certificat médical initial et l’envoie à la CPAM ; l’employeur, dès qu’il est informé, déclare l’accident à la CPAM (ou à la MSA) dans les 48 heures, hors dimanches et jours fériés, remet la feuille d’accident au salarié et envoie une attestation de salaire. La CPAM (ou la MSA) reçoit la déclaration et le certificat. La feuille d’accident : le salarié la présente au médecin, au pharmacien, au kinésithérapeute ; les soins liés à l’accident sont pris en charge à 100 % du tarif de base, sans avance de frais.", "img_w": 1400, "img_h": 1042}}, {"id": "c2cap_ch10", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir du document 7 :", "reponse_attendue": ""}}, {"id": "c2cap_q101", "type": "sous_question", "data": {"competence": "C1", "numero": "3.1", "texte": "**Compléter** le tableau des démarches après un accident du travail.", "points": "", "lignes": 0, "style_lignes": "pointilles", "support_type": "", "reponse_attendue": "", "indice": "", "reponse_allegee": ""}, "el": {"standard": {"indice": "DOC. 7 : la première case du schéma pour le salarié, puis la branche de l’employeur.", "explication": "Le salarié informe son employeur dans la journée, au plus tard dans les 24 heures. L’employeur déclare l’accident à la CPAM dans les 48 heures."}, "essentiel": {"indice": "DOC. 7 : le délai écrit dans la case du salarié, puis la case de l’employeur.", "explication": "Le salarié : dans la journée, au plus tard dans les 24 heures. L’employeur : il déclare l’accident à la CPAM, dans les 48 heures."}}}, {"id": "c2cap_q101_tab", "type": "tableau", "data": {"titre": "", "cells": [[{"type": "prof", "content": "Qui ?"}, {"type": "prof", "content": "Que fait-il ?"}, {"type": "prof", "content": "Dans quel délai ?"}], [{"type": "prof", "content": "Le salarié"}, {"type": "eleve", "content": "", "reponse": "Il informe son employeur."}, {"type": "eleve", "content": "", "reponse": "Dans la journée, au plus tard dans les 24 heures."}], [{"type": "prof", "content": "L’employeur"}, {"type": "eleve", "content": "", "reponse": "Il déclare l’accident à la CPAM."}, {"type": "eleve", "content": "", "reponse": "Dans les 48 heures."}]], "table_preset": "pse", "table_border": "fine", "table_row_height": "compact", "table_col_widths": [22, 42, 36], "table_student_style": "lines", "variantes": {"adapte": {"cells": [[{"type": "prof", "content": "Qui ?"}, {"type": "prof", "content": "Que fait-il ?"}, {"type": "prof", "content": "Dans quel délai ?"}], [{"type": "prof", "content": "Le salarié"}, {"type": "prof", "content": "Il informe son employeur."}, {"type": "eleve", "content": "", "reponse": "Dans la journée, au plus tard dans les 24 heures."}], [{"type": "prof", "content": "L’employeur"}, {"type": "eleve", "content": "", "reponse": "Il déclare l’accident à la CPAM."}, {"type": "eleve", "content": "", "reponse": "Dans les 48 heures."}]]}, "essentiel": {"table_student_style": "choix", "cells": [[{"type": "prof", "content": "Qui ?"}, {"type": "prof", "content": "Que fait-il ?"}, {"type": "prof", "content": "Dans quel délai ?"}], [{"type": "prof", "content": "Le salarié"}, {"type": "prof", "content": "Il informe son employeur."}, {"type": "eleve", "content": "", "options": ["Dans la journée, au plus tard dans les 24 heures.", "Dans le mois qui suit."], "reponse": "Dans la journée, au plus tard dans les 24 heures."}], [{"type": "prof", "content": "L’employeur"}, {"type": "eleve", "content": "", "options": ["Il déclare l’accident à la CPAM.", "Il paie les soins du salarié."], "reponse": "Il déclare l’accident à la CPAM."}, {"type": "eleve", "content": "", "options": ["Dans les 15 jours.", "Dans les 48 heures."], "reponse": "Dans les 48 heures."}]]}}}}, {"id": "c2cap_analyse11", "type": "analyse", "data": {"titre": "L’INDEMNISATION"}}, {"id": "c2cap_doc8", "type": "document", "data": {"label": "DOC. 8", "titre": "L’indemnisation d’un accident du travail", "cadre": true, "corps": "1. Les **soins** (médecin, médicaments, radiographie, kinésithérapie) sont pris en charge à **100 %**, dans la limite des tarifs de l’Assurance Maladie, sans avance de frais grâce à la feuille d’accident.\n2. Pendant l’**arrêt de travail**, le salarié reçoit des **indemnités journalières**. Le jour de l’accident est payé par l’employeur. Les indemnités sont versées dès le lendemain, sans délai de carence :\n– du 1er au 28e jour d’arrêt : **60 %** du salaire journalier de base ;\n– à partir du 29e jour d’arrêt : **80 %** du salaire journalier de base.\n3. S’il garde des **séquelles** (des problèmes de santé qui restent), le salarié peut recevoir une indemnité ou une **rente** (une somme versée régulièrement).\n**Exemple.** Enzo a dix jours d’arrêt indemnisés, après le jour de l’accident. Son salaire journalier de base est de 60 €.", "source": "D’après ameli.fr.", "date_consultation": "2026-09-24"}}, {"id": "c2cap_analyse12", "type": "analyse", "data": {"titre": "REVENIR À LA SITUATION"}}, {"id": "c2cap_ch11", "type": "question_chapeau", "data": {"numero": "4", "texte": "À partir de la situation d’Enzo et du document 8 :", "reponse_attendue": ""}}, {"id": "c2cap_q111", "type": "sous_question", "data": {"competence": "C1", "numero": "4.1", "texte": "**Calculer** les indemnités journalières d’Enzo pour son arrêt de travail.", "points": "", "lignes": 2, "style_lignes": "pointilles", "support_type": "", "reponse_attendue": "Calcul : 60 × 60 % = 36 € par jour ; 36 × 10 = 360 €.\nRésultat : 360 €.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Calculer** les indemnités journalières d’Enzo pour son arrêt de travail.\nRappel : indemnité d’un jour = salaire journalier de base × 60 % (60 % = 60/100)."}, "essentiel": {"texte": "**Calculer** les indemnités journalières d’Enzo pour son arrêt de travail.\nIndemnité d’un jour : 60 × 60/100 = …………… €\nPour dix jours : …………… × 10 = …………… €", "lignes": 0, "reponse_attendue": "36\n36\n360"}}}, "el": {"standard": {"indice": "DOC. 8 : le taux du 1er au 28e jour d’arrêt, puis l’exemple (salaire journalier de base et nombre de jours).", "explication": "Indemnité d’un jour : 60 × 60 % = 36 €. Pour dix jours : 36 × 10 = 360 €. Enzo reçoit 360 € d’indemnités journalières."}, "adapte": {"indice": "DOC. 8 : l’exemple donne le salaire journalier de base et le nombre de jours. Calculer d’abord un jour, puis multiplier par le nombre de jours.", "explication": "Un jour : 60 × 60/100 = 36 €. Dix jours : 36 × 10 = 360 €. Résultat : 360 €."}, "essentiel": {"indice": "Faire la première opération, reporter son résultat à la deuxième ligne, puis multiplier par 10.", "explication": "Un jour : 60 × 60/100 = 36 €. Dix jours : 36 × 10 = 360 €.", "trous": ["36|36 €|36€|36 euros|36,00", "36|36 €|36€|36 euros|36,00", "360|360 €|360€|360 euros|360,00"]}}}, {"id": "c2cap_analyse13", "type": "analyse", "data": {"titre": "PROPOSER DES SOLUTIONS"}}, {"id": "c2cap_ch12", "type": "question_chapeau", "data": {"numero": "5", "texte": "À partir de la situation d’Enzo et du document 7 :", "reponse_attendue": ""}}, {"id": "c2cap_q121", "type": "sous_question", "data": {"competence": "C5", "numero": "5.1", "texte": "**Justifier** auprès d’Enzo l’intérêt de prévenir rapidement son employeur.", "points": "", "lignes": 3, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Prévenu rapidement, l’employeur déclare l’accident à la CPAM sous 48 h, hors dimanches et jours fériés, et remet la feuille d’accident : soins liés à l’accident pris en charge à 100 % du tarif de base ; indemnités journalières pendant l’arrêt.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"reponse_allegee": "Prévenu à temps, l’employeur {{déclare}} l’accident à la CPAM dans les 48 heures : les soins d’Enzo sont remboursés à {{100 %}} du tarif de base et il reçoit des indemnités journalières.", "texte": "**Justifier** auprès d’Enzo l’intérêt de prévenir rapidement son employeur.\nPrévenu à temps, l’employeur …………… l’accident à la CPAM dans les 48 heures : les soins d’Enzo sont remboursés à …………… du tarif de base et il reçoit des indemnités journalières.", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 7 : la branche de l’employeur, puis le cadre sur la feuille d’accident.", "explication": "Prévenu à temps, l’employeur déclare l’accident à la CPAM dans les 48 heures et remet la feuille d’accident. Les soins d’Enzo sont alors remboursés à 10
