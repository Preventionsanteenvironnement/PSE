<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiche d'identité d'un plan santé A1 · A1 — Le système de santé · Seconde Bac Pro · PSE</title>
<meta name="description" content="Mener l'enquête dans le document et remplir la fiche d'identité du Plan santé au travail, puis du plan tabac.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--fond1:#0F3D36;--fond2:#1D5E50;--clair:#F4F8F5;--encre:#13302A;--doux:#5B7A71;--jaune:#FFD23F;--vrai:#2FBF71;--vrai-f:#16733F;--faux:#FF6B57;--faux-f:#B3261E;--ligne:rgba(255,255,255,.22);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--clair);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:1.06rem;line-height:1.5;
  background:radial-gradient(1200px 600px at 15% -10%,rgba(255,210,63,.13),transparent 60%),radial-gradient(900px 700px at 110% 110%,rgba(120,220,180,.14),transparent 60%),linear-gradient(160deg,var(--fond1),var(--fond2));background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--jaune);outline-offset:3px}
.page{max-width:1150px;margin:0 auto;padding:1.4rem 1.1rem 3rem}
header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1.8rem,5vw,2.7rem);line-height:1.02;margin:0}
header p{margin:.45rem 0 0;opacity:.85}
.onglets{display:flex;gap:.5rem;flex-wrap:wrap;margin:1.1rem 0 1rem}
.puce{border:2px solid var(--ligne);background:rgba(255,255,255,.06);border-radius:999px;padding:.4rem 1rem;font-weight:700}
.puce[aria-pressed="true"]{background:var(--clair);color:var(--encre);border-color:var(--clair)}
.puce .et{color:var(--jaune);margin-left:.3rem}
.puce[aria-pressed="true"] .et{color:#B8860B}
.jeu{display:grid;gap:1.1rem}
@media (min-width:920px){.jeu{grid-template-columns:1fr 1fr;align-items:start}.doc{position:sticky;top:1rem}}
.doc{background:#fff;color:#1B1F1D;border-radius:14px;padding:1.1rem 1.2rem;box-shadow:0 20px 40px -25px rgba(0,0,0,.6)}
.doc h2{font-size:1.1rem;margin:0 0 .5rem;text-decoration:underline;text-underline-offset:4px}
.doc .ent{background:#1F3B57;color:#fff;border-radius:10px;padding:.6rem .8rem;text-align:center;margin-bottom:.7rem}
.doc .ent b{display:block;font-size:1.1rem}
.doc p{margin:.4rem 0}
.doc ul{margin:.2rem 0 .4rem;padding-left:1.2rem}
.doc .src{font-size:.8rem;color:#6B7570;margin-top:.7rem}
.enquete{display:grid;gap:1rem}
.panneau{background:var(--clair);color:var(--encre);border-radius:24px;padding:clamp(1.1rem,3.5vw,1.6rem);box-shadow:0 30px 60px -25px rgba(0,0,0,.6)}
.num{font-weight:700;color:var(--doux);font-size:.95rem;display:flex;justify-content:space-between}
.pts{display:flex;gap:5px;align-items:center}
.pts i{width:10px;height:10px;border-radius:50%;background:#C9D3CD}
.pts i.fait{background:var(--vrai-f)}.pts i.ici{background:#E0A800}
.q{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(1.2rem,3vw,1.45rem);line-height:1.25;margin:.3rem 0 .8rem}
.q b{font-weight:800;color:#8A6A00}
.q small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-size:.9rem;color:var(--doux);font-weight:700;margin-top:.2rem}
.opts{display:grid;gap:.45rem}
.opt{text-align:left;border:2px solid #B9C5BE;background:#fff;border-radius:14px;padding:.7rem .9rem;font-weight:700}
.opt:hover{border-color:var(--encre)}
.opt[aria-pressed="true"]{background:#FFF4C2;border-color:var(--encre)}
.opt:disabled{cursor:default}
.opt.bon{background:#DDF4E7;border-color:var(--vrai-f)}
.opt.mauvais{background:#FFE3DE;border-color:var(--faux-f)}
.valider,.continuer{width:100%;height:54px;border-radius:999px;border:0;background:var(--encre);color:var(--clair);font-weight:700;font-size:1.08rem;margin-top:.8rem}
.valider:disabled{opacity:.4;cursor:default}
.fb{margin-top:.7rem;border-radius:14px}
.fb:not(:empty){padding:.65rem .9rem}
.fb.ok{background:#DDF4E7;border-left:6px solid var(--vrai-f)}
.fb.ko{background:#FFE3DE;border-left:6px solid var(--faux-f)}
.fb.ind{background:#FFF4C2;border-left:6px solid #E0A800}
.outils{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.7rem}
.outil{border:2px solid #B9C5BE;background:transparent;border-radius:999px;padding:.3rem .8rem;font-size:.95rem;font-weight:700}
.fiche{background:#FFFDF3;color:var(--encre);border:3px solid var(--encre);border-radius:18px;overflow:hidden}
.fiche h3{margin:0;background:var(--encre);color:var(--clair);padding:.55rem .9rem;font-size:1.05rem}
.fiche div{display:grid;grid-template-columns:minmax(120px,.8fr) 1.6fr;border-top:1px solid #D9D2B8}
.fiche div:first-of-type{border-top:0}
.fiche span{padding:.5rem .7rem}
.fiche span:first-child{font-weight:700;background:#F6F0D8}
.fiche .vide{color:#A09A85}
.fiche .ici span:last-child{background:#FFF4C2}
.fiche .rempli span:last-child{animation:flash .9s}
@keyframes flash{from{background:#C9F0DA}}
.compar{overflow-x:auto}
.compar table{width:100%;border-collapse:collapse;min-width:520px;font-size:.95rem}
.compar th,.compar td{border:1px solid #C5CEC9;padding:.45rem .6rem;text-align:left;vertical-align:top}
.compar th{background:#E0E8E3}
.etoiles{font-size:2.2rem;color:#E0A800;letter-spacing:.15rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.fiche .rempli span:last-child{animation:none}}

.fil{margin:0 0 .7rem}
.fil a{color:var(--clair);opacity:.85;text-decoration:underline;text-underline-offset:4px;font-size:1rem;padding:.35rem .1rem;display:inline-block}
.fil a:hover{opacity:1}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Fiche d'identité d'un plan santé</h1>
    <p>Mène l'enquête dans le document et remplis la fiche — A1 · Séance 2</p>
  </header>
  <nav class="fil" aria-label="Fil d'Ariane"><a href="index.html">← Accueil mapse.fr</a></nav>
  <nav class="onglets" id="onglets" aria-label="Choisir le plan"></nav>
  <div class="jeu">
    <article class="doc" id="doc"></article>
    <div class="enquete"><section class="panneau" id="panneau"></section><section class="fiche" id="fiche" aria-label="Fiche d'identité"></section></div>
  </div>
  <div class="sr" aria-live="polite" id="annonce"></div>
</div>
<script>
/* ===== PLANS =====
   opts : [texte, 1 si juste, message si faux] · multi : plusieurs bonnes réponses */
const PLANS=[
 {id:"pst",titre:"Plan santé au travail",court:"Plan santé au travail 2026-2030",
  doc:`<h2>DOC. 5 — Le Plan santé au travail 2026-2030</h2>
    <div class="ent"><b>PLAN SANTÉ AU TRAVAIL 2026-2030</b>présenté le 5 juin 2026 par le ministre du Travail et des Solidarités</div>
    <p>Le Plan santé au travail fixe les orientations nationales en matière de prévention des risques professionnels.</p>
    <p><b>Sa durée.</b> Cinq ans, de 2026 à 2030.</p>
    <p><b>Son objectif.</b> Renforcer la prévention dans les entreprises et agir avant l'accident ou la maladie.</p>
    <p><b>Cinq orientations :</b></p>
    <ul><li>prévenir les accidents du travail graves et mortels, en particulier chez les jeunes et les intérimaires, publics les plus exposés ;</li>
    <li>promouvoir la santé des femmes au travail ;</li><li>prendre en compte les enjeux émergents : dérèglement climatique, conduites addictives ;</li>
    <li>prévenir l'absentéisme ;</li><li>promouvoir la santé mentale et prévenir les risques psychosociaux.</li></ul>
    <p><b>En région.</b> Le plan national est décliné dans chaque région par les DREETS, sous la forme d'un plan régional santé travail.</p>
    <p class="src">Ministère du Travail et des Solidarités, Plan santé au travail 2026-2030 ; Code du travail numérique. Document du cours.</p>`,
  champs:[
   {k:"decide",lab:"Qui décide ?",q:"Qui a décidé ce plan ?",opts:[["L'État, par le ministère du Travail.",1],["Une entreprise.",0,"Une entreprise applique le plan, elle ne le décide pas."],["L'Assurance maladie.",0,"Regarde qui présente le plan dans l'en-tête du document."]],rep:"L'État (ministère du Travail)"},
   {k:"duree",lab:"Durée",q:"Quelle est la durée du plan ?",opts:[["Dix ans.",0,"Relis le paragraphe « Sa durée »."],["Cinq ans, de 2026 à 2030.",1],["Un an, renouvelable.",0,"Relis le paragraphe « Sa durée »."]],rep:"5 ans (2026-2030)"},
   {k:"objectif",lab:"Objectif principal",q:"Quel est l'objectif principal ?",opts:[["Augmenter les salaires.",0,"Le plan parle de prévention, pas de salaires."],["Réduire la durée du travail.",0,"Relis le paragraphe « Son objectif »."],["Renforcer la prévention dans les entreprises.",1]],rep:"Renforcer la prévention dans les entreprises"},
   {k:"public",lab:"Publics visés",q:"Quels publics sont particulièrement visés ?",multi:true,opts:[["Les jeunes.",1],["Les retraités.",0],["Les intérimaires.",1],["Les élèves de collège.",0]],ko:"Cherche les « publics les plus exposés » dans la première orientation.",rep:"Les jeunes et les intérimaires"},
   {k:"prev",lab:"Type de prévention",q:"Quel type de prévention ce plan met-il en œuvre ?",opts:[["La prévention individuelle.",0,"Le plan ne dépend pas du choix d'une personne : il s'adresse à toutes les entreprises."],["La prévention collective.",1]],rep:"Prévention collective"},
   {k:"region",lab:"Qui l'applique en région ?",q:"Qui applique le plan dans les régions ?",opts:[["Les mairies.",0,"Relis le paragraphe « En région »."],["Les DREETS, avec un plan régional santé travail.",1],["Les médecins traitants.",0,"Relis le paragraphe « En région »."]],rep:"Les DREETS (plan régional santé travail)"},
   {k:"camille",lab:"Pour Camille",q:"Quelle orientation concerne le plus directement Camille, 18 ans, en alternance dans un atelier ?",opts:[["Prévenir l'absentéisme.",0,"Camille est jeune et travaille dans un atelier : quelle orientation cite les jeunes ?"],["Prévenir les accidents graves et mortels chez les jeunes.",1],["Promouvoir la santé des femmes au travail.",0,"Cherche l'orientation qui cite les jeunes."]],rep:"Accidents graves et mortels chez les jeunes"}
  ]},
 {id:"pnlt",titre:"Défi : plan tabac",court:"Programme national de lutte contre le tabac 2023-2027",
  doc:`<h2>DOC. — Le Programme national de lutte contre le tabac 2023-2027</h2>
    <div class="ent"><b>PROGRAMME NATIONAL DE LUTTE CONTRE LE TABAC 2023-2027</b>présenté le 28 novembre 2023 par le ministre de la Santé et de la Prévention</div>
    <p><b>Qui le porte.</b> Les ministères chargés de la santé et des comptes publics.</p>
    <p><b>Sa durée.</b> Cinq ans, de 2023 à 2027.</p>
    <p><b>Son ambition.</b> Bâtir la première génération sans tabac à l'horizon 2032.</p>
    <p><b>Pourquoi ?</b> Le tabac reste la première cause de mortalité évitable en France. Environ 12 millions de personnes fument encore chaque jour.</p>
    <p><b>Deux axes parmi d'autres :</b></p>
    <ul><li>prévenir l'entrée dans le tabagisme, en particulier chez les jeunes ;</li><li>accompagner les fumeurs vers l'arrêt, en particulier les plus vulnérables.</li></ul>
    <p><b>Exemples de mesures.</b> Un paquet de cigarettes à 13 € en 2027 ; plus de contrôles de l'interdiction de vente aux mineurs ; l'interdiction des cigarettes électroniques jetables (puffs) ; plus d'espaces sans tabac.</p>
    <p><b>En région.</b> Les agences régionales de santé (ARS) le déclinent en programme régional de lutte contre le tabac.</p>
    <p class="src">D'après le ministère de la Santé (sante.gouv.fr), info.gouv.fr, novembre 2023, et ARS Grand Est.</p>`,
  champs:[
   {k:"decide",lab:"Qui décide ?",q:"Qui a décidé ce programme ?",opts:[["Les fabricants de cigarettes.",0,"Ils sont visés par les mesures, ils ne les décident pas."],["L'État, par les ministères de la Santé et des Comptes publics.",1],["Les buralistes.",0,"Regarde qui présente et qui porte le programme."]],rep:"L'État (ministères Santé et Comptes publics)"},
   {k:"duree",lab:"Durée",q:"Quelle est la durée du programme ?",opts:[["Jusqu'en 2032.",0,"2032, c'est l'objectif à atteindre, pas la durée du programme."],["Deux ans.",0,"Relis le paragraphe « Sa durée »."],["Cinq ans, de 2023 à 2027.",1]],rep:"5 ans (2023-2027)"},
   {k:"objectif",lab:"Objectif principal",q:"Quel est l'objectif principal ?",opts:[["Bâtir la première génération sans tabac en 2032.",1],["Interdire totalement le tabac dès 2027.",0,"Le document ne parle pas d'interdiction totale."],["Faire baisser le prix des cigarettes.",0,"C'est l'inverse : le paquet doit coûter 13 € en 2027."]],rep:"Une génération sans tabac en 2032"},
   {k:"public",lab:"Publics visés",q:"Quels publics sont particulièrement visés ?",multi:true,opts:[["Les jeunes.",1],["Les buralistes.",0],["Les fumeurs les plus vulnérables.",1],["Les fabricants de tabac.",0]],ko:"Relis les deux axes : « en particulier chez… » et « en particulier les… ».",rep:"Les jeunes et les fumeurs les plus vulnérables"},
   {k:"prev",lab:"Type de prévention",q:"Le paquet à 13 € pour tous : quel type de prévention ?",opts:[["La prévention collective.",1],["La prévention individuelle.",0,"Cette mesure s'applique à toute la population, pas à une personne."]],rep:"Prévention collective"},
   {k:"region",lab:"Qui l'applique en région ?",q:"Qui applique le programme dans les régions ?",opts:[["Les DREETS.",0,"Les DREETS appliquent le Plan santé au travail. Pour le tabac, relis « En région »."],["Les lycées.",0,"Relis le paragraphe « En région »."],["Les agences régionales de santé (ARS).",1]],rep:"Les ARS (programme régional)"},
   {k:"priorite",lab:"Priorité de santé publique",q:"Pourquoi la lutte contre le tabac est-elle une priorité de santé publique ?",opts:[["Parce que le tabac coûte cher aux fumeurs.",0,"Une priorité de santé publique : beaucoup de personnes touchées, grave, ou évitable."],["Parce que le tabac est la première cause de mortalité évitable et touche des millions de personnes.",1],["Parce que le tabac sent mauvais.",0,"Une priorité de santé publique : beaucoup de personnes touchées, grave, ou évitable."]],rep:"1re cause de mortalité évitable, 12 millions de fumeurs"}
  ]}
];
const $=id=>document.getElementById(id);
function annoncer(t){$("annonce").textContent=t}
const CLE="plan-sante-A1";let pref={etoiles:{}};
try{pref=Object.assign(pref,JSON.parse(localStorage.getItem(CLE)||"{}"))}catch(e){}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(pref))}catch(e){}}
let P,k,err,rempli,resolu,choixMulti;

function onglets(){
  $("onglets").innerHTML=PLANS.map(p=>`<button class="puce" data-id="${p.id}" aria-pressed="${P===p}">${p.titre}${pref.etoiles[p.id]?`<span class="et">${"★".repeat(pref.etoiles[p.id])}</span>`:""}</button>`).join("")+
    `<button class="puce" id="bComp" aria-pressed="${P==="comp"}">Comparer les deux</button>`;
  $("onglets").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>demarrer(PLANS.find(p=>p.id===b.dataset.id)));
  $("bComp").onclick=comparer;
}
function demarrer(p){P=p;k=0;err=0;rempli={};onglets();$("doc").innerHTML=p.doc;$("fiche").hidden=false;fiche();question()}
function fiche(){
  $("fiche").innerHTML=`<h3>Fiche d'identité : ${P.court}</h3>`+P.champs.map((c,i)=>`<div class="${i===k?"ici":""} ${rempli[c.k]==="new"?"rempli":""}"><span>${c.lab}</span><span class="${rempli[c.k]?"":"vide"}">${rempli[c.k]?c.rep:"…"}</span></div>`).join("");
  Object.keys(rempli).forEach(x=>rempli[x]="ok");
}
function question(){
  const c=P.champs[k];resolu=false;choixMulti=new Set();
  $("panneau").innerHTML=`<div class="num"><span>Question ${k+1} / ${P.champs.length}</span><span class="pts" aria-hidden="true">${P.champs.map((_,j)=>`<i class="${j<k?"fait":j===k?"ici":""}"></i>`).join("")}</span></div>
    <p class="q"><b>Relever</b> — ${c.q}${c.multi?"<small>Plusieurs réponses exactes.</small>":""}</p>
    <div class="opts">${c.opts.map((o,i)=>`<button class="opt" data-i="${i}" ${c.multi?'aria-pressed="false"':""}>${o[0]}</button>`).join("")}</div>
    ${c.multi?`<button class="valider" id="bVal" disabled>Valider</button>`:""}
    <div class="fb" id="fb" role="status" aria-live="polite"></div><div id="suite"></div>
    <div class="outils"><button class="outil" id="bLire">🔊 Écouter</button></div>`;
  $("bLire").onclick=()=>lire(c.q.replace(/DREETS/g,"D R E E T S")+" "+c.opts.map(o=>o[0]).join(" Ou : "));
  $("panneau").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(resolu)return;const i=+b.dataset.i,o=c.opts[i];
    if(c.multi){if(choixMulti.has(i))choixMulti.delete(i);else choixMulti.add(i);b.setAttribute("aria-pressed",choixMulti.has(i));$("bVal").disabled=!choixMulti.size;return}
    if(o[1]){b.classList.add("bon");reussir(c)}else{err++;b.classList.add("mauvais");b.disabled=true;fb("ko",`<b>Pas tout à fait.</b> ${o[2]}`)}
  });
  if(c.multi)$("bVal").onclick=()=>{
    const bons=c.opts.map((o,i)=>o[1]?i:-1).filter(i=>i>=0);
    const ok=bons.length===choixMulti.size&&bons.every(i=>choixMulti.has(i));
    if(ok){$("panneau").querySelectorAll(".opt").forEach(b=>{if(choixMulti.has(+b.dataset.i))b.classList.add("bon")});reussir(c)}
    else{err++;fb("ko",`<b>Pas tout à fait.</b> ${c.ko}`)}
  };
  annoncer(c.q);
}
function fb(cl,h){const f=$("fb");f.className="fb "+cl;f.innerHTML=h}
function reussir(c){
  resolu=true;$("panneau").querySelectorAll(".opt,#bVal").forEach(b=>b.disabled=true);
  rempli[c.k]="new";fb("ok",`<b>✓ Exact.</b> C'est noté dans la fiche.`);
  const der=k===P.champs.length-1;
  const b=document.createElement("button");b.className="continuer";b.textContent=der?"Terminer la fiche":"Question suivante";
  b.onclick=()=>{if(der)fin();else{k++;fiche();question()}};
  $("suite").appendChild(b);k2=k;fiche();b.focus({preventScroll:true});
}
let k2=0;
function fin(){
  k=-1;fiche();
  const et=err<=1?3:err<=3?2:1;pref.etoiles[P.id]=Math.max(pref.etoiles[P.id]||0,et);sauver();onglets();
  const autre=PLANS.find(p=>p!==P&&!pref.etoiles[p.id]);
  $("panneau").innerHTML=`<p class="q" style="margin-top:0"><b>Fiche complète !</b></p>
    <div class="etoiles" aria-label="${et} étoiles sur 3">${"★".repeat(et)}<span style="opacity:.25">${"★".repeat(3-et)}</span></div>
    <p>${err} erreur${err>1?"s":""}. Tu as relevé les éléments qui définissent un plan santé : qui le décide, sa durée, son objectif, son public.</p>
    ${autre?`<button class="continuer" id="bAut">${autre.titre} →</button>`:`<button class="continuer" id="bAut">Comparer les deux plans →</button>`}`;
  $("bAut").onclick=()=>autre?demarrer(autre):comparer();$("bAut").focus({preventScroll:true});
}
function comparer(){
  P="comp";onglets();$("fiche").hidden=true;
  const [a,b]=PLANS;
  $("doc").innerHTML=`<h2>Les deux plans côte à côte</h2><div class="compar"><table><thead><tr><th></th><th>${a.court}</th><th>${b.court}</th></tr></thead><tbody>
    ${a.champs.filter(c=>b.champs.some(d=>d.k===c.k)).map(c=>`<tr><th>${c.lab}</th><td>${c.rep}</td><td>${b.champs.find(d=>d.k===c.k).rep}</td></tr>`).join("")}</tbody></table></div>`;
  const opts=[["Ils visent tous les deux le bruit au travail.",0,"Seul le Plan santé au travail concerne le travail. Compare les lignes du tableau."],
    ["Ils sont décidés par l'État, ont une durée déterminée et relèvent de la prévention collective.",1],
    ["Ils s'adressent chacun à une personne en particulier.",0,"Un plan santé s'adresse à toute une population."]];
  $("panneau").innerHTML=`<p class="q" style="margin-top:0"><b>Comparer</b> — Qu'ont en commun ces deux plans ?</p>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join("")}</div><div class="fb" id="fb" role="status" aria-live="polite"></div>`;
  $("panneau").querySelectorAll(".opt").forEach(x=>x.onclick=()=>{const o=opts[+x.dataset.i];
    if(o[1]){x.classList.add("bon");$("panneau").querySelectorAll(".opt").forEach(y=>y.disabled=true);fb("ok","<b>✓ Exact.</b> C'est la définition d'un plan santé : un programme d'actions décidé par l'État, pour un problème de santé important, avec des objectifs, des moyens et une durée déterminée.")}
    else{x.classList.add("mauvais");x.disabled=true;fb("ko",`<b>Pas tout à fait.</b> ${o[2]}`)}});
}
let voix=null;
function choisirVoix(){const l=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));voix=l.find(x=>/fr-FR/i.test(x.lang)&&/(google|natural|online|amélie|thomas|denise|henri)/i.test(x.name))||l.find(x=>/fr-FR/i.test(x.lang))||l[0]||null}
if("speechSynthesis" in window){choisirVoix();speechSynthesis.onvoiceschanged=choisirVoix}
function lire(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voix)u.voice=voix;u.rate=.95;speechSynthesis.speak(u)}
demarrer(PLANS[0]);
</script>
