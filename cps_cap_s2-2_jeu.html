<!DOCTYPE html>
<html lang="fr">
<head>
<script src="assets/audio-pause.js?v=2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPS S2.2 — Désamorcer une dispute</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f7f5fc;color:#1e293b;line-height:1.6;padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.back{display:inline-block;color:#7c3aed;text-decoration:none;font-weight:800;font-size:1rem;margin-bottom:10px}
.back:hover{text-decoration:underline}
.prog{position:sticky;top:0;z-index:5;background:#f7f5fc;padding:6px 0 10px}
.prog .label{font-size:.78rem;font-weight:800;color:#6d28d9;margin-bottom:4px;text-align:center}
.prog .track{height:10px;background:#ede9fe;border-radius:20px;overflow:hidden}
.prog .track > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#a855f7);border-radius:20px;transition:width .4s ease}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 3px 14px rgba(0,0,0,.06);animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hero{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border-radius:20px;padding:26px 20px;text-align:center;margin-bottom:6px}
.hero .ic{font-size:3rem;display:block;margin-bottom:6px}
.hero h1{font-size:1.5rem;font-weight:900}
.hero p{opacity:.95;font-size:.96rem;margin-top:6px}
.txt{font-size:1.12rem;font-weight:600;line-height:1.5;margin:6px 0 12px}
.teach{background:#f5f3ff;border-left:6px solid #7c3aed;border-radius:0 12px 12px 0;padding:12px 14px;font-size:1.04rem;margin-bottom:12px}
.q{font-size:1.12rem;font-weight:800;color:#6d28d9;margin:6px 0 12px}
.opts{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:14px;border:2px solid #ddd6fe;background:#fff;cursor:pointer;font-family:inherit;font-size:1.05rem;font-weight:700;color:#1e293b;transition:.15s}
.opt.center{text-align:center}
.opt:hover:not(:disabled){border-color:#7c3aed;background:#f5f3ff}
.opt:disabled{cursor:default}
.opt.ok{border-color:#22c55e;background:#dcfce7;color:#166534}
.opt.no{border-color:#fca5a5;background:#fee2e2;color:#991b1b}
.fb{margin-top:14px}
.msg{border-radius:14px;padding:13px 15px;font-weight:700;font-size:1rem;animation:fade .3s}
.msg.good{background:#dcfce7;border:2px solid #86efac;color:#166534}
.msg.bad{background:#fff7ed;border:2px solid #fed7aa;color:#9a3412}
.msg.win{background:#f5f3ff;border:2px solid #c4b5fd;color:#6d28d9}
.btn{display:block;width:100%;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:14px;padding:15px;font-size:1.1rem;font-weight:800;cursor:pointer;font-family:inherit;margin-top:12px;text-align:center;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.soft{background:#ede9fe;color:#5b21b6}
.say{float:right;background:#f5f3ff;color:#7c3aed;border:none;border-radius:10px;padding:6px 11px;font-size:.95rem;font-weight:800;cursor:pointer}
.recap{list-style:none;margin:10px 0 0}
.recap li{background:#faf9ff;border:1px solid #ede9fe;border-radius:12px;padding:10px 13px;margin-bottom:8px;font-size:.98rem}
.badge{text-align:center;font-size:1.1rem;font-weight:900;color:#6d28d9;margin:10px 0}
@media(max-width:600px){.wrap{padding:10px}.card{padding:16px}.txt{font-size:1.05rem}.hero h1{font-size:1.3rem}}
/* images, tri à 3 cases, choix d'images, remise en ordre */
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pic{margin:0 0 12px;text-align:center}
.pic img{max-width:100%;max-height:300px;border-radius:14px;display:inline-block}
.imgopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.imgopt{padding:6px;border-radius:14px;border:3px solid #ddd6fe;background:#fff;cursor:pointer}
.imgopt img{width:100%;border-radius:10px;display:block}
.imgopt.ok{border-color:#22c55e;background:#dcfce7}
.imgopt.no{border-color:#fca5a5;background:#fee2e2;opacity:.6}
.slots{list-style:decimal inside;margin:0 0 12px;display:flex;flex-direction:column;gap:8px}
.slot{min-height:46px;border:2px dashed #c4b5fd;border-radius:12px;padding:8px 12px;font-weight:700}
.slot.full{border-style:solid;border-color:#22c55e;background:#f0fdf4}
.slot .pic,.chip .pic{margin:0 0 6px}
.slot .pic img,.chip .pic img{max-height:120px}
.pool{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.chip{padding:8px;border-radius:14px;border:2px solid #ddd6fe;background:#fff;cursor:pointer;font-family:inherit;font-size:1rem;font-weight:700;color:#1e293b}
.chip.used{opacity:.3;cursor:default}
</style>
<link rel="stylesheet" href="assets/acces.css?v=4">
<script src="assets/acces.js?v=4" defer></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Accueil</a>
  <div class="prog"><div class="label" id="proglabel"></div><div class="track"><i id="progbar"></i></div></div>
  <div id="scene"></div>
</div>
<script>
(function(){
  var scene=document.getElementById('scene');
  var idx=0;
  function speak(t){ try{ if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,'')); u.lang='fr-FR'; u.rate=0.95; speechSynthesis.speak(u);}catch(e){} }
  function go(i){ idx=i; try{speechSynthesis.cancel();}catch(e){} render(); }
  function progress(){ document.getElementById('progbar').style.width=Math.round(idx/(STEPS.length-1)*100)+'%'; document.getElementById('proglabel').textContent='Étape '+(idx+1)+' / '+STEPS.length; }
  function continueBtn(label){ var b=document.createElement('button'); b.className='btn'; b.textContent=label||'Continuer →'; b.onclick=function(){ go(idx+1); }; return b; }

  var HERO={title:"Désamorcer une dispute", sub:"Compétence S2.2 · Santé publique France 2025"};
  var STEPS=[
    { type:'intro', text:"Une dispute, ça arrive. Le but n’est pas de <strong>gagner</strong> contre l’autre. C’est de <strong>régler le problème sans casser la relation</strong>. Entraîne-toi." },

    { type:'order',
      teach:"Pour sortir d’un conflit : <strong>se calmer</strong>, <strong>écouter</strong>, <strong>dire son besoin</strong>, <strong>trouver un accord</strong>.",
      q:"Touche les images dans le bon ordre.",
      steps:[
        {l:"Je me calme",img:"assets/cps/social/conflit-1-se-calmer.jpg",alt:"En cuisine, Lina s’écarte du plan de travail et respire."},
        {l:"J’écoute l’autre",img:"assets/cps/social/conflit-2-ecouter.jpg",alt:"Lina regarde Noa, qui parle en faisant des gestes."},
        {l:"Je dis mon besoin",img:"assets/cps/social/conflit-3-dire-besoin.jpg",alt:"Lina parle calmement à Noa, une main sur la poitrine."},
        {l:"On trouve un accord",img:"assets/cps/social/conflit-4-accord.jpg",alt:"Lina et Noa travaillent côte à côte sur le plan de travail."}
      ],
      wrong:"Pas encore. Que fait-on d’abord, avant de parler ?",
      good:"Oui : se calmer, écouter, dire son besoin, puis trouver un accord." },

    { type:'sort',
      teach:"Pendant une dispute, certaines réactions <strong>calment</strong>, d’autres <strong>enveniment</strong>. Fais le tri.",
      q:"Ça calme, ou ça envenime ?",
      bins:[{v:'calme',l:'Ça calme'},{v:'envenime',l:'Ça envenime'}],
      items:[
        {l:"Tu cries encore plus fort qu’elle.",v:'envenime',ex:"Ça envenime : quand le ton monte, la dispute monte aussi."},
        {l:"Tu respires et tu baisses la voix.",v:'calme',ex:"Ça calme : un ton posé fait redescendre la tension."},
        {l:"Tu dis : « On n’est pas d’accord. On en parle calmement ? »",v:'calme',ex:"Ça calme : tu proposes de discuter au lieu de t’affronter."},
        {l:"Tu ressors toutes les vieilles histoires.",v:'envenime',ex:"Ça envenime : on s’éloigne du problème et la dispute grossit."}
      ] },

    { type:'cases',
      teach:"Parfois, <strong>un seul</strong> est contrarié. Je l’aide d’abord à se calmer, et je l’écoute.",
      q:"Que fais-tu ?",
      items:[
        { img:"assets/cps/scenes/scene-lina-colere-cuisine.jpg", alt:"En cuisine, Lina regarde sa préparation renversée au sol. Noa s’éloigne.",
          text:"Tu es Noa. Tu as renversé la préparation de Lina sans faire exprès.",
          options:[
            {l:"Tu reviens : « Pardon, c’est moi. T’es furieuse, je comprends. »",good:true,fb:"Oui : tu reconnais ce qu’elle vit. Elle peut se calmer, puis vous nettoyez."},
            {l:"Tu t’éloignes vite, sans rien dire, pour éviter qu’elle crie.",good:false,fb:"Lina reste seule avec sa colère. Elle risque de t’en vouloir."},
            {l:"« Oh ça va, c’est qu’une sauce, t’en refais une ! »",good:false,fb:"Tu dis que ce n’est rien : Lina s’énerve encore plus."}
          ] },
        { who:"Malik revient du bureau du chef…", text:"« Il m’a crié dessus devant tout le monde ! J’en ai marre ! »",
          options:[
            {l:"« Calme-toi ! C’est pas si grave, arrête ton cinéma. »",good:false,fb:"« Calme-toi » et « c’est pas grave » l’énervent souvent plus."},
            {l:"« Devant tout le monde ? T’as dû avoir la honte. Raconte. »",good:true,fb:"Oui : tu redis ce qu’il vit, puis tu l’écoutes. Il redescend."},
            {l:"« Le chef est nul ! Viens, on va lui dire ses quatre vérités ! »",good:false,fb:"Tu ajoutes de l’huile sur le feu : le conflit grossit."}
          ] }
      ] },

    { type:'cases',
      teach:"Toi et l’autre voulez <strong>deux choses différentes</strong> ? Cherche un <strong>accord</strong> qui va aux deux.",
      q:"Quelle solution va aux DEUX ?",
      items:[
        { text:"Toi et un camarade voulez le seul poste de travail libre.",
          options:[
            {l:"« On le partage : toi ce matin, moi cet après-midi ? »",good:true,fb:"Accord : chacun a son tour. La relation tient."},
            {l:"Tu le prends de force, tant pis pour lui.",good:false,fb:"Tu gagnes, il perd : la rancune s’installe."},
            {l:"Tu laisses tomber et tu rumines dans ton coin.",good:false,fb:"Tu perds et tu gardes ta colère : personne n’y gagne."}
          ] },
        { text:"En groupe, ton idée et celle d’Inès s’opposent.",
          options:[
            {l:"Tu imposes la tienne, un point c’est tout.",good:false,fb:"Inès se sent écrasée et elle décroche."},
            {l:"« On prend un bout de chaque idée ? »",good:true,fb:"Accord : vos deux idées comptent."},
            {l:"« Laisse tomber, on fait rien du tout. »",good:false,fb:"Tout le monde perd : ce n’est pas une solution."}
          ] }
      ] },

    { type:'cases',
      teach:"Après une dispute, <strong>réparer</strong> aide à repartir. Reconnaître sa part compte.",
      q:"Que fais-tu ?",
      items:[
        { text:"Pendant la dispute, tu as dit des mots qui ont blessé.",
          options:[
            {l:"« Désolé pour tout à l’heure, je suis allé trop loin. »",good:true,fb:"Oui : t’excuser répare la relation."},
            {l:"Tu fais comme si rien ne s’était passé.",good:false,fb:"Le non-dit laisse une gêne qui dure."},
            {l:"Tu attends qu’il s’excuse le premier.",good:false,fb:"Si chacun attend, personne ne fait le premier pas."}
          ] }
      ] },

    { type:'perso',
      text:"À toi. Pense à une <strong>dispute récente</strong>. Quel accord aurait pu aller à <strong>vous deux</strong> ? Y a-t-il quelque chose à réparer ?" },

    { type:'bilan', title:"Dispute désamorcée !", sub:"Tu sais régler un conflit sans casser la relation.",
      recap:[
        "Je me <strong>calme d’abord</strong> : on ne règle rien en criant.",
        "Si l’autre est contrarié, je l’aide à se calmer et je l’<strong>écoute</strong>.",
        "Je dis mon besoin, puis on cherche un <strong>accord</strong>. Je <strong>répare</strong> si je suis allé trop loin."
      ] }
  ];

  /* L’ordre des réponses est mélangé à chaque affichage : la bonne réponse n’a pas de place fixe. */
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function esc(t){ return String(t||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function pic(src,alt){ return src ? '<figure class="pic"><img src="'+esc(src)+'" alt="'+esc(alt)+'" loading="lazy"></figure>' : ''; }
  function nextBtn(last,onNext){ var nb=document.createElement('button'); nb.className='btn'; nb.textContent=last?'Continuer →':'Suivant →'; nb.onclick=onNext; return nb; }

  function render(){
    var s=STEPS[idx]; progress(); window.scrollTo({top:0,behavior:'smooth'});

    if(s.type==='intro'){
      scene.innerHTML='<div class="hero"><h1>'+HERO.title+'</h1><p>'+HERO.sub+'</p></div><div class="card">'+pic(s.img,s.alt)+'<p class="txt">'+s.text+'</p></div>';
      var b=document.createElement('button'); b.className='btn'; b.textContent='Commencer'; b.onclick=function(){ go(idx+1); }; scene.querySelector('.card').appendChild(b); return;
    }

    if(s.type==='notion'){
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div>'+pic(s.img,s.alt)+'<div class="q">'+s.q+'</div><div class="opts"></div><div class="fb"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach+' '+s.q); };
      var opts=scene.querySelector('.opts'), fb=scene.querySelector('.fb'), done=false;
      shuffle(s.options).forEach(function(o){
        var b=document.createElement('button'); b.className='opt'; b.innerHTML=o.l;
        b.onclick=function(){
          if(done)return;
          if(o.ok){ done=true; opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); b.classList.add('ok'); fb.innerHTML='<div class="msg good">✓ '+s.good+'</div>'; fb.appendChild(continueBtn()); }
          else { b.classList.add('no'); b.disabled=true; fb.innerHTML='<div class="msg bad">'+s.wrong+' <strong>Réessaie.</strong></div>'; }
        };
        opts.appendChild(b);
      });
      return;
    }

    /* tri : les cases restent les mêmes pour toutes les cartes */
    if(s.type==='sort'){
      var j=0;
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div id="so"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach+' '+s.q); };
      var area=scene.querySelector('#so');
      function drawItem(){
        var it=s.items[j];
        var bins=s.bins.map(function(bn){ return '<button class="opt center" data-v="'+bn.v+'">'+bn.l+'</button>'; }).join('');
        area.innerHTML=pic(it.img,it.alt)+'<p class="txt">'+it.l+'</p><div class="'+(s.bins.length===3?'three':'two')+'">'+bins+'</div><div class="fb"></div>';
        var fb=area.querySelector('.fb'), answered=false;
        area.querySelectorAll('.opt').forEach(function(b){
          b.onclick=function(){
            if(answered)return; answered=true;
            var ok=(b.getAttribute('data-v')===it.v);
            area.querySelectorAll('.opt').forEach(function(x){ x.disabled=true; if(x.getAttribute('data-v')===it.v) x.classList.add('ok'); });
            if(!ok) b.classList.add('no');
            fb.innerHTML='<div class="msg '+(ok?'good':'bad')+'">'+(ok?'✓ ':'✗ ')+it.ex+'</div>';
            var last=(j>=s.items.length-1);
            fb.appendChild(nextBtn(last,function(){ if(last){ go(idx+1); } else { j++; drawItem(); } }));
          };
        });
      }
      drawItem();
      return;
    }

    if(s.type==='cases'){
      var j=0;
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div id="cc"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach+' '+s.q); };
      var area=scene.querySelector('#cc');
      function drawCase(){
        var it=s.items[j];
        var head = it.who ? '<div class="bubble"><span class="who">'+it.who+'</span>'+it.text+'</div>' : '<p class="txt">'+it.text+'</p>';
        area.innerHTML=pic(it.img,it.alt)+head+'<div class="opts"></div><div class="fb"></div>';
        var opts=area.querySelector('.opts'), fb=area.querySelector('.fb'), done=false;
        shuffle(it.options).forEach(function(o){
          var b=document.createElement('button'); b.className='opt'; b.innerHTML=o.l;
          b.onclick=function(){
            if(done)return;
            if(o.good){ done=true; opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); b.classList.add('ok'); fb.innerHTML='<div class="msg good">✓ '+o.fb+'</div>'; var last=(j>=s.items.length-1); fb.appendChild(nextBtn(last,function(){ if(last){ go(idx+1);} else {j++; drawCase();} })); }
            else { b.classList.add('no'); b.disabled=true; fb.innerHTML='<div class="msg bad">'+o.fb+' <strong>Réessaie.</strong></div>'; }
          };
          opts.appendChild(b);
        });
      }
      drawCase();
      return;
    }

    /* choisir une image parmi plusieurs (ordre mélangé) */
    if(s.type==='imagepick'){
      var j=0;
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div id="ip"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach+' '+(s.items[j]?s.items[j].q:'')); };
      var area=scene.querySelector('#ip');
      function drawPick(){
        var it=s.items[j];
        area.innerHTML='<div class="q">'+it.q+'</div><div class="imgopts"></div><div class="fb"></div>';
        var box=area.querySelector('.imgopts'), fb=area.querySelector('.fb'), done=false;
        shuffle(it.options).forEach(function(o){
          var b=document.createElement('button'); b.className='imgopt';
          b.innerHTML='<img src="'+esc(o.img)+'" alt="'+esc(o.alt)+'" loading="lazy">';
          b.onclick=function(){
            if(done)return;
            if(o.ok){ done=true; box.querySelectorAll('.imgopt').forEach(function(x){x.disabled=true;}); b.classList.add('ok'); fb.innerHTML='<div class="msg good">✓ '+it.ex+'</div>'; var last=(j>=s.items.length-1); fb.appendChild(nextBtn(last,function(){ if(last){ go(idx+1);} else {j++; drawPick();} })); }
            else { b.classList.add('no'); b.disabled=true; fb.innerHTML='<div class="msg bad">'+(o.fb||it.bad)+' <strong>Réessaie.</strong></div>'; }
          };
          box.appendChild(b);
        });
      }
      drawPick();
      return;
    }

    /* remettre des étapes dans l’ordre (étiquettes mélangées) */
    if(s.type==='order'){
      var expect=0;
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><ol class="slots"></ol><div class="pool"></div><div class="fb"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach+' '+s.q); };
      var slots=scene.querySelector('.slots'), pool=scene.querySelector('.pool'), fb=scene.querySelector('.fb');
      s.steps.forEach(function(){ var li=document.createElement('li'); li.className='slot'; slots.appendChild(li); });
      shuffle(s.steps.map(function(st,k){ return {st:st,k:k}; })).forEach(function(o){
        var b=document.createElement('button'); b.className='chip';
        b.innerHTML=pic(o.st.img,o.st.alt)+'<span>'+o.st.l+'</span>';
        b.onclick=function(){
          if(b.disabled)return;
          if(o.k===expect){
            b.disabled=true; b.classList.add('used');
            var li=slots.children[expect]; li.classList.add('full'); li.innerHTML=pic(o.st.img,o.st.alt)+'<span>'+o.st.l+'</span>';
            expect++;
            if(expect>=s.steps.length){ fb.innerHTML='<div class="msg good">✓ '+s.good+'</div>'; fb.appendChild(continueBtn()); }
            else fb.innerHTML='';
          } else {
            fb.innerHTML='<div class="msg bad">'+s.wrong+'</div>';
          }
        };
        pool.appendChild(b);
      });
      return;
    }

    if(s.type==='dialog'){
      var t=0, rel=s.start;
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="q">'+s.title+'</div>'+pic(s.img,s.alt)+'<p class="txt" style="font-weight:600;font-size:1rem">'+s.intro+'</p><div class="rel"></div><div id="dz"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.intro); };
      var relEl=scene.querySelector('.rel'), dz=scene.querySelector('#dz');
      function paintRel(){ var e= rel>=66?'Relation : bonne': (rel>=33?'Relation : tendue':'Relation : fragile'); relEl.textContent=e; }
      function drawTurn(){
        paintRel();
        var tn=s.turns[t];
        dz.innerHTML='<p class="txt" style="font-size:1rem">'+tn.prompt+'</p><div class="opts"></div><div class="fb"></div>';
        var opts=dz.querySelector('.opts'), fb=dz.querySelector('.fb'), picked=false;
        shuffle(tn.choices).forEach(function(c){
          var b=document.createElement('button'); b.className='opt'; b.innerHTML=c.l;
          b.onclick=function(){
            if(picked)return; picked=true;
            opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;});
            b.classList.add(c.delta>0?'ok':'no');
            rel=Math.max(0,Math.min(100,rel+c.delta)); paintRel();
            fb.innerHTML='<div class="bubble"><span class="who">Réponse</span>'+c.reply+'</div>';
            var nb=document.createElement('button'); nb.className='btn';
            if(t>=s.turns.length-1){ nb.textContent='Voir le résultat →'; nb.onclick=function(){ showEnd(); }; }
            else { nb.textContent='Continuer la discussion →'; nb.onclick=function(){ t++; drawTurn(); }; }
            fb.appendChild(nb);
          };
          opts.appendChild(b);
        });
      }
      function showEnd(){
        paintRel();
        var okEnd = rel>=60;
        dz.innerHTML='<div class="msg '+(okEnd?'win':'bad')+'">'+(okEnd?s.good:s.bad)+'</div>';
        var retry=document.createElement('button'); retry.className='btn soft'; retry.textContent='↺ Refaire la conversation'; retry.onclick=function(){ t=0; rel=s.start; drawTurn(); };
        dz.appendChild(retry);
        dz.appendChild(continueBtn());
      }
      drawTurn();
      return;
    }

    if(s.type==='perso'){
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><p class="txt">'+s.text+'</p><div class="msg" style="background:#f5f3ff;border:2px solid #ddd6fe;color:#6d28d9">Réponds dans ta tête, à l’oral ou en une phrase. Il n’y a pas de mauvaise réponse.</div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.text); };
      var b=document.createElement('button'); b.className='btn'; b.textContent="J’y ai réfléchi →"; b.onclick=function(){ go(idx+1); }; scene.querySelector('.card').appendChild(b); return;
    }

    if(s.type==='bilan'){
      var h='<div class="hero"><h1>'+s.title+'</h1><p>'+s.sub+'</p></div><div class="card"><p class="txt" style="font-size:1rem;font-weight:800;color:#6d28d9">Ce que tu as appris :</p><ul class="recap">';
      s.recap.forEach(function(r){ h+='<li>'+r+'</li>'; });
      h+='</ul></div>';
      scene.innerHTML=h;
      var c=scene.querySelector('.card');
      var rb=document.createElement('button'); rb.className='btn'; rb.textContent='Recommencer'; rb.onclick=function(){ go(0); }; c.appendChild(rb);
      var hb=document.createElement('a'); hb.className='btn soft'; hb.href='index.html'; hb.textContent='← Retour à l’accueil'; c.appendChild(hb);
      return;
    }
  }
  render();
})();
</script>
</body>
</html>
