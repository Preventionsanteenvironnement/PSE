<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Le bruit en puzzles</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f3f5f2;color:#162921;font:600 1rem system-ui;-webkit-user-select:none;user-select:none}
header,main,footer{max-width:900px;margin:auto;padding:.6rem 1rem}
header{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
button{font:inherit;background:#fff;color:inherit;border:2px solid #537369;border-radius:16px;padding:.5rem .8rem;cursor:pointer;min-height:52px;touch-action:manipulation}
button:focus-visible{outline:4px solid #994b08;outline-offset:2px}
.etapes{display:flex;gap:.4rem;align-items:center}
.etapes span{width:44px;height:44px;border-radius:12px;border:3px solid #cfdcd6;background:#fff center/80% no-repeat;opacity:.55}
.etapes span.ici{opacity:1;border-color:#135a46;width:56px;height:56px}
.etapes span.fini{opacity:1;border-color:#7fb69f}
.outils{display:flex;gap:.4rem}.outils button{font-size:1.5rem;min-width:56px}
#horaire{display:flex;gap:.3rem;justify-content:center;flex-wrap:wrap;margin:.2rem 0 .6rem}
#horaire span{min-width:38px;height:38px;border-radius:10px;background:#e3ebe7;display:grid;place-items:center;font-size:1.15rem;opacity:.6}
#horaire span.fait{background:#cfe9dc;opacity:1}#horaire span.ici{background:#135a46;opacity:1;transform:scale(1.18)}
#ecran{background:#fff;border-radius:24px;padding:clamp(10px,3vw,26px);min-height:420px;position:relative}
.consigne{display:flex;align-items:center;justify-content:center;gap:.6rem;margin:0 0 .8rem;font-size:1.1rem;text-align:center}
.consigne button{font-size:1.6rem;min-width:60px}
figure{margin:0 auto;text-align:center}
.vue{display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap}
.vue>*,.vue>img.v{width:min(300px,28%)}.vue.une>*,.vue.une>img.v{width:min(440px,90%)}.vue.deux>*,.vue.deux>img.v{width:min(320px,42%)}
img.v{display:block;width:100%;height:auto;max-height:300px;object-fit:contain;-webkit-user-drag:none;pointer-events:none}
.crop{display:block;width:100%;background-repeat:no-repeat;pointer-events:none}
.jauge{display:grid;place-items:center;width:100%;aspect-ratio:1;font-size:clamp(1.6rem,6vw,3rem);letter-spacing:.08em;color:#135a46;pointer-events:none}
.vue>.jauge{width:min(240px,40%);border:3px solid #aec3ba;border-radius:16px}
.fleche{font-size:2rem;color:#537369;width:auto!important}
/* plateau du puzzle */
.plateau{display:grid;gap:0;margin:0 auto 1rem;border:3px solid #537369;border-radius:10px;overflow:hidden;background:#eef2f0}
.plateau.bande{gap:.6rem;border:0;background:none;overflow:visible;align-items:center}
.case{position:relative;padding:0;border:1px dashed #b9ccc4;border-radius:0;min-height:0;background:#fafcfb;overflow:hidden;display:block}
.bande .case{border:3px dashed #9fb8ae;border-radius:14px;aspect-ratio:1}
.case>*{pointer-events:none}
.case .fantome{opacity:.4}.case .pale{opacity:.14}.case .rien{opacity:0}
.case .ombre{filter:brightness(0);opacity:.28}
.case.pleine{border-style:solid;border-color:transparent;background:#fff}
.bande .case.pleine{border-color:#7fb69f}
.case.indice{outline:5px dashed #e0a100;outline-offset:-5px}
.case.survol{background:#fff6d6}
.plateau.complet{border-color:#2e8b64;box-shadow:0 0 0 6px #cfe9dc}
.local{width:min(260px,70%);margin:0 auto 1rem;aspect-ratio:1;border:10px solid #6b7d76;border-top-width:16px;border-radius:6px}
.local.ferme{border-color:#2e8b64;background:#e8f5ee}
/* réserve */
.reserve{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;min-height:80px;padding:.6rem;border-radius:16px;background:#f1f5f3}
.piece{padding:3px;border-radius:10px;border:3px solid #aec3ba;background:#fff;min-height:0;touch-action:none;overflow:hidden}
.piece>*{pointer-events:none}
.piece.choisie{border-color:#135a46;box-shadow:0 0 0 4px #9fd6bd;transform:scale(1.06)}
.piece.secoue{animation:secoue .45s}
@keyframes secoue{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.volant{position:fixed;z-index:20;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 8px 24px #0004}
/* choix */
.cartes{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:.8rem}
.cartes button{width:min(190px,30%);padding:.4rem;border-width:3px}
.cartes button.bonne{border-color:#2e8b64;box-shadow:0 0 0 5px #cfe9dc}
.cartes button.indice{outline:5px dashed #e0a100;outline-offset:3px}
.cartes button.attenue{opacity:.4}
/* tri */
.boites{display:flex;gap:1rem;justify-content:center;margin-bottom:1rem}
.boite{flex:1;max-width:330px;min-height:190px;border:3px solid #537369;border-radius:18px;padding:.4rem;display:flex;flex-direction:column;align-items:center;background:#fafcfb}
.boite .tete{width:90px}.boite .dedans{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center}.boite .dedans>*{width:70px}
.boite.indice{outline:5px dashed #e0a100}.boite.survol{background:#fff6d6}
/* memory */
.memo{display:grid;gap:.6rem;max-width:560px;margin:auto}
.memo button{aspect-ratio:1;padding:.3rem;border-width:3px;background:#dfeae5;min-height:0}
.memo button.dos{background:#135a46 radial-gradient(#ffffff33 20%,transparent 22%) 0 0/24px 24px}
.memo button.dos>*{visibility:hidden}
.memo button.trouve{border-color:#2e8b64;background:#fff}
/* récompense */
.tresor{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:min(360px,86%);margin:0 auto}
.tresor div{aspect-ratio:1;border-radius:6px;background:#dfe7e3}
.tresor div.vu{background-repeat:no-repeat}
.tresor div.neuf{animation:apparait 1s both}
@keyframes apparait{from{transform:scale(.3);opacity:0}}
#bravo{min-height:3.2rem;display:flex;justify-content:center;align-items:center;gap:.6rem;font-size:1.6rem;color:#2e8b64}
nav{display:flex;justify-content:space-between;align-items:center;margin-top:.4rem}
nav button{font-size:1.8rem;min-width:84px}
#suivant{background:#135a46;color:#fff;min-width:140px}
#suivant.pret{animation:pret 1.4s infinite}
@keyframes pret{50%{box-shadow:0 0 0 9px #9fd6bd}}
footer{font-size:.82rem;font-weight:400;color:#40564d}
footer details{margin-bottom:.6rem}footer summary{cursor:pointer;font-weight:700}
.reglages{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}.reglages button{font-size:.95rem;min-height:44px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){.etapes span{width:34px;height:34px}.etapes span.ici{width:44px;height:44px}}
</style>
<script>window.goatcounter={path:function(){return location.pathname||"/"}};</script>
<script data-goatcounter="https://brahms.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head><body>
<header><div class="etapes" id="etapes" aria-label="Étapes"></div>
<div class="outils"><button id="ecouter" aria-label="Écouter la consigne">🔊</button><button id="muet" aria-label="Couper la voix" aria-pressed="false">🗣️</button></div></header>
<main><div id="horaire" aria-hidden="true"></div>
<section id="ecran" aria-live="polite"></section>
<div id="bravo" role="status"></div>
<nav><button id="avant" aria-label="Revenir">←</button><button id="suivant" aria-label="Suivant">→</button></nav></main>
<footer><details><summary>Pour l’adulte</summary>
<div class="reglages" id="reglages"></div></details>
