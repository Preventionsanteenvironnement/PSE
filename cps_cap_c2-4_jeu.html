<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f4f7fc;color:#1e293b;line-height:1.6;padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.back{display:inline-block;color:#1d4ed8;text-decoration:none;font-weight:800;font-size:1rem;margin-bottom:10px}
.back:hover{text-decoration:underline}
.prog{position:sticky;top:0;z-index:5;background:#f4f7fc;padding:6px 0 10px}
.prog .label{font-size:.78rem;font-weight:800;color:#1e40af;margin-bottom:4px;text-align:center}
.prog .track{height:10px;background:#dbeafe;border-radius:20px;overflow:hidden}
.prog .track > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1d4ed8,#3b82f6);border-radius:20px;transition:width .4s ease}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 3px 14px rgba(0,0,0,.06);animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hero{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border-radius:20px;padding:26px 20px;text-align:center;margin-bottom:6px}
.hero .ic{font-size:3rem;display:block;margin-bottom:6px}
.hero h1{font-size:1.5rem;font-weight:900}
.hero p{opacity:.95;font-size:.96rem;margin-top:6px}
.txt{font-size:1.12rem;font-weight:600;line-height:1.5;margin:6px 0 12px}
.teach{background:#eff6ff;border-left:6px solid #1d4ed8;border-radius:0 12px 12px 0;padding:12px 14px;font-size:1.04rem;margin-bottom:12px}
.q{font-size:1.12rem;font-weight:800;color:#1e40af;margin:6px 0 12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:14px;border:2px solid #bfdbfe;background:#fff;cursor:pointer;font-family:inherit;font-size:1.05rem;font-weight:700;color:#1e293b;transition:.15s}
.opt:hover:not(:disabled){border-color:#1d4ed8;background:#eff6ff}
.opt:disabled{cursor:default}
.opt.ok{border-color:#22c55e;background:#dcfce7;color:#166534}
.opt.no{border-color:#fca5a5;background:#fee2e2;color:#991b1b}
.match{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
.mcol{display:flex;flex-direction:column;gap:9px}
.mhead{font-size:.78rem;font-weight:800;color:#1e40af;text-transform:uppercase;letter-spacing:.4px;text-align:center}
.mitem{width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:2px solid #cbd5e1;background:#fff;cursor:pointer;font-family:inherit;font-size:.96rem;font-weight:700;color:#1e293b;transition:.12s}
.mitem:hover:not(:disabled){border-color:#1d4ed8}
.mitem.sel{border-color:#1d4ed8;background:#eff6ff}
.mitem.ok{border-color:#22c55e;background:#dcfce7;color:#166534;cursor:default}
.mitem.shake{animation:shake .3s}
.fb{margin-top:14px}
.msg{border-radius:14px;padding:13px 15px;font-weight:700;font-size:1rem;animation:fade .3s}
.msg.good{background:#dcfce7;border:2px solid #86efac;color:#166534}
.msg.bad{background:#fff7ed;border:2px solid #fed7aa;color:#9a3412}
.msg.win{background:#dbeafe;border:2px solid #93c5fd;color:#1e40af}
.btn{display:block;width:100%;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border:none;border-radius:14px;padding:15px;font-size:1.1rem;font-weight:800;cursor:pointer;font-family:inherit;margin-top:12px;text-align:center;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.soft{background:#e0e7ff;color:#3730a3}
.say{float:right;background:#eff6ff;color:#1d4ed8;border:none;border-radius:10px;padding:6px 11px;font-size:.95rem;font-weight:800;cursor:pointer}
.recap{list-style:none;margin:10px 0 0}
.recap li{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 13px;margin-bottom:8px;font-size:.98rem}
.badge{text-align:center;font-size:1.1rem;font-weight:900;color:#1e40af;margin:10px 0}
@media(max-width:600px){.wrap{padding:10px}.card{padding:16px}.txt{font-size:1.05rem}.hero h1{font-size:1.3rem}.mitem{font-size:.9rem}}
.jimg{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:14px;margin:6px 0 10px;background:#fff}
.jimgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>

<script>
(function(){
  var MOI={code:"C2.4", titre:"Savoir demander de l’aide", fam:"Penser et agir", defi:{"q": "Choisis une seule chose à essayer cette semaine.", "opts": ["Poser une question quand je ne comprends pas", "Utiliser ma phrase de demande avec un adulte", "Enregistrer le 3114 et le 3018 dans mon téléphone"]}, duo:{"duree": "10 minutes", "situation": "En atelier, tu ne comprends pas comment régler la machine. Le professeur est occupé.", "roleA": "Tu fais ta demande d’aide : tu demandes un moment, tu dis la difficulté, tu dis ce que tu attends.", "roleB": "Tu joues le professeur. Tu écoutes, puis tu reformules la demande.", "observe": ["A attend un moment adapté", "A dit sa difficulté clairement", "A dit ce qu’il attend"]}};
  var scene=document.getElementById('scene');
  var idx=0;
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function speak(t){ try{ if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,'')); u.lang='fr-FR'; u.rate=0.95; speechSynthesis.speak(u);}catch(e){} }
  function go(i){ idx=i; try{speechSynthesis.cancel();}catch(e){} render(); }
  function progress(){ document.getElementById('progbar').style.width=Math.round(idx/(STEPS.length-1)*100)+'%'; document.getElementById('proglabel').textContent='Étape '+(idx+1)+' / '+STEPS.length; }
  function continueBtn(label){ var b=document.createElement('button'); b.className='btn'; b.textContent=label||'Continuer →'; b.onclick=function(){ go(idx+1); }; return b; }

  var STEPS=[
    { type:'intro', text:"Personne ne s’en sort seul sur tout. Demander de l’aide n’est <strong>pas une faiblesse</strong>. Encore faut-il savoir <strong>à qui</strong>, et <strong>comment</strong>." },

    { type:'notion',
      teach:"Quand tu es bloqué, demander de l’aide est une <strong>bonne idée</strong> : c’est souvent en demandant qu’on avance.",
      q:"Demander de l’aide, c’est…",
      options:[
        {l:"une faiblesse à cacher",ok:false},
        {l:"déranger les autres pour rien",ok:false},
        {l:"un bon moyen d’avancer",ok:true}
      ],
      wrong:"Pas tout à fait. Demander n’est ni une honte ni un dérangement.",
      good:"Exactement. Bien demander, c’est te donner les moyens de réussir." },

    { type:'match',
      teach:"Selon le problème, on ne demande pas à la même personne. Relie chaque situation à la <strong>bonne personne</strong>.",
      q:"Clique une situation, puis la personne qui peut aider.",
      left:[
        {k:0,t:"On me harcèle au lycée ou en ligne"},
        {k:1,t:"Je me suis blessé, je me sens mal"},
        {k:2,t:"Je ne comprends pas le cours de maths"},
        {k:3,t:"Une dispute avec un camarade dure depuis des semaines"}
      ],
      right:[
        {k:2,t:"Le professeur de maths"},
        {k:0,t:"Le CPE ou le 3018"},
        {k:3,t:"Le professeur principal"},
        {k:1,t:"L’infirmier ou l’infirmière scolaire"}
      ],
      bad:"Pas tout à fait : qui s’occupe de ce genre de problème ?",
      done:"À chaque problème, sa bonne personne." },

    { type:'cases',
      teach:"Une bonne demande est <strong>claire</strong> et <strong>polie</strong> : tu dis ce dont tu as besoin.",
      q:"Quelle est la bonne façon de demander ?",
      items:[
        { text:"Tu n’as pas compris la consigne du professeur.",
          options:[
            {l:"« J’ai rien compris, c’est nul. »",good:false,fb:"Ce n’est ni poli ni clair : on ne sait pas ce qu’il te faut."},
            {l:"« Pardon, vous pouvez réexpliquer la consigne ? »",good:true,fb:"Oui : poli, clair, et tu dis ce qu’il te faut."},
            {l:"Je ne dis rien et je reste bloqué.",good:false,fb:"Rester bloqué sans demander, c’est te priver d’aide."}
          ] },
        { text:"Tu veux l’aide d’un camarade sur un exercice.",
          options:[
            {l:"« Fais-le à ma place. »",good:false,fb:"Là, tu demandes qu’on travaille pour toi."},
            {l:"« Donne-moi tes réponses. »",good:false,fb:"Copier n’est pas demander de l’aide. Tu n’apprends rien."},
            {l:"« Tu m’expliques celui-là ? »",good:true,fb:"Oui : tu demandes à comprendre, simplement."}
          ] },
        { text:"Tu bloques depuis vingt minutes. Une voix dit : « si je demande, on va me prendre pour un nul ».",
          options:[
            {l:"Je demande quand même",good:true,fb:"Oui : cette pensée est un avis, pas un fait. Demander te fait avancer."},
            {l:"Je reste bloqué pour ne pas avoir l’air bête",good:false,fb:"Tu perds du temps et l’aide dont tu as besoin."},
            {l:"Je copie discrètement sur le voisin",good:false,fb:"Tu n’apprends rien, et le problème reste entier."}
          ] }
      ] },

    { type:'cases',
      teach:"Face à un danger, d’abord tu <strong>protèges</strong> : tu arrêtes la machine. Ensuite tu <strong>alertes</strong> les secours.",
      imgs:[
        {src:"assets/cps/cognitif/urgence-arret-machine.jpg",alt:"Malik appuie sur le gros bouton rouge d’une machine d’atelier."},
        {src:"assets/cps/cognitif/urgence-appel-secours.jpg",alt:"Inès téléphone, calme. Elle lève une main pour faire signe."}
      ],
      q:"Que fais-tu ?",
      items:[
        { text:"À l’atelier, la main d’un camarade est coincée dans une machine qui tourne. Que fais-tu d’abord ?",
          options:[
            {l:"J’appelle le 15 tout de suite",good:false,fb:"Alerter, oui, mais après. La machine tourne encore : tu protèges d’abord."},
            {l:"J’appuie sur l’arrêt d’urgence",good:true,fb:"Oui : tu protèges d’abord. La machine s’arrête, le danger aussi."},
            {l:"Je tire sa main pour la dégager",good:false,fb:"La machine tourne : tu risques d’être blessé aussi."}
          ] },
        { text:"La machine est arrêtée. Sa main est toujours coincée. Que fais-tu maintenant ?",
          options:[
            {l:"Je dégage sa main moi-même",good:false,fb:"Bouger la victime peut aggraver la blessure."},
            {l:"J’attends le retour du formateur",good:false,fb:"Chaque minute compte : tu alertes tout de suite."},
            {l:"J’appelle le 15, puis le formateur",good:true,fb:"Oui : tu as protégé, maintenant tu alertes."}
          ] }
      ] },

    { type:'cases',
      teach:"Les numéros d’urgence : <strong>15</strong> SAMU, <strong>18</strong> pompiers, <strong>17</strong> police, <strong>112</strong> dans toute l’Europe, <strong>114</strong> par SMS si tu ne peux pas parler, <strong>119</strong> enfance en danger, <strong>3018</strong> cyberharcèlement, <strong>3114</strong> prévention du suicide (gratuit, 24 h/24).",
      q:"Quel numéro appelles-tu ?",
      items:[
        { text:"Un début d’incendie dans l’atelier.",
          options:[
            {l:"18",good:true,fb:"Oui : le 18, ce sont les pompiers."},
            {l:"119",good:false,fb:"Le 119, c’est pour un enfant en danger."},
            {l:"3018",good:false,fb:"Le 3018, c’est pour le cyberharcèlement."}
          ] },
        { text:"Une camarade s’effondre et ne répond plus.",
          options:[
            {l:"17",good:false,fb:"Le 17, c’est la police. Ici, c’est un problème de santé."},
            {l:"15",good:true,fb:"Oui : le 15, c’est le SAMU, pour les urgences de santé."},
            {l:"3018",good:false,fb:"Le 3018, c’est pour le cyberharcèlement."}
          ] },
        { text:"Une bagarre violente éclate devant le lycée.",
          options:[
            {l:"119",good:false,fb:"Le 119, c’est pour un enfant en danger."},
            {l:"15",good:false,fb:"Le 15, c’est pour la santé. Ici, il faut arrêter la violence."},
            {l:"17",good:true,fb:"Oui : le 17, c’est la police, pour les violences."}
          ] },
        { text:"En voyage en Espagne, tu vois un accident de la route.",
          options:[
            {l:"112",good:true,fb:"Oui : le 112 marche dans toute l’Europe."},
            {l:"114",good:false,fb:"Le 114, c’est par SMS, si tu ne peux pas parler."},
            {l:"3018",good:false,fb:"Le 3018, c’est pour le cyberharcèlement."}
          ] },
        { text:"Tu dois alerter les secours, mais tu ne peux pas parler au téléphone.",
          options:[
            {l:"112",good:false,fb:"Le 112 est un appel vocal. Ici, tu ne peux pas parler."},
            {l:"114",good:true,fb:"Oui : au 114, tu écris par SMS."},
            {l:"18",good:false,fb:"Le 18 est un appel vocal. Ici, tu ne peux pas parler."}
          ] },
        { text:"Un enfant de ton immeuble est souvent frappé chez lui.",
          options:[
            {l:"3018",good:false,fb:"Le 3018, c’est pour le cyberharcèlement."},
            {l:"114",good:false,fb:"Le 114, c’est par SMS, si tu ne peux pas parler."},
            {l:"119",good:true,fb:"Oui : le 119, c’est pour un enfant en danger."}
          ] },
        { text:"Des photos de toi circulent en ligne, avec des insultes.",
          options:[
            {l:"3018",good:true,fb:"Oui : le 3018 aide en cas de cyberharcèlement. Gratuit et confidentiel."},
            {l:"18",good:false,fb:"Le 18, ce sont les pompiers."},
            {l:"119",good:false,fb:"Le 119, c’est pour un enfant en danger."}
          ] }
      ] },

    { type:'moi', spec:{"tag": "Et moi ?", "title": "Ma demande d’aide", "intro": "Pense à une difficulté où une aide te serait utile. Tu n’as pas à la raconter.", "steps": [{"kind": "choix", "q": "À qui pourrais-tu demander ?", "carnet": "À qui je peux demander", "multi": true, "opts": ["Mon professeur principal", "Le ou la CPE", "L’infirmier ou l’infirmière scolaire", "Mon tuteur de stage", "Une personne de ma famille", "Un camarade de confiance"], "autre": true}, {"kind": "phrase", "q": "Construis ta phrase de demande.", "carnet": "Ma phrase pour demander de l’aide", "parts": [{"t": "Est-ce que je peux vous parler ? J’ai besoin d’aide pour"}, {"label": "Ma difficulté", "opts": ["comprendre une consigne", "m’organiser", "un souci en stage", "un souci avec un camarade"], "libre": true}, {"t": ". Je voudrais"}, {"label": "Ce que je demande", "opts": ["une explication", "un conseil", "un rendez-vous"], "libre": true}, {"t": "."}], "criteres": ["Je demande d’abord si la personne est disponible", "Je dis ma difficulté en une phrase", "Je dis ce que j’attends"]}], "fin": "Tu peux relire cette phrase avant d’aller voir la personne."} },

    { type:'bilan',
      recap:[
        "Je choisis la <strong>bonne personne</strong> selon mon problème.",
        "Je fais une demande <strong>claire et polie</strong> : je dis ce dont j’ai besoin.",
        "Face à un danger : je <strong>protège</strong>, puis j’<strong>alerte</strong> le bon numéro."
      ] }
  ];
  function render(){
    var s=STEPS[idx]; progress(); window.scrollTo({top:0,behavior:'smooth'});

    if(s.type==='intro'){
      scene.innerHTML='<div class="hero"><span class="ic"></span><h1>Savoir demander de l’aide</h1><p>Compétence C2.4</p></div><div class="card"><p class="txt">'+s.text+'</p></div>';
      var b=document.createElement('button'); b.className='btn'; b.textContent='Commencer'; b.onclick=function(){ go(idx+1); }; scene.querySelector('.card').appendChild(b); return;
    }

    if(s.type==='notion'){
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div class="opts"></div><div class="fb"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach+' '+s.q); };
      var opts=scene.querySelector('.opts'), fb=scene.querySelector('.fb'), done=false;
      shuffle(s.options).forEach(function(o){
        var b=document.createElement('button'); b.className='opt'; b.textContent=o.l;
        b.onclick=function(){
          if(done)return;
          if(o.ok){ done=true; opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); b.classList.add('ok'); fb.innerHTML='<div class="msg good">✓ '+s.good+'</div>'; fb.appendChild(continueBtn()); }
          else { b.classList.add('no'); b.disabled=true; fb.innerHTML='<div class="msg bad">'+s.wrong+' <strong>Réessaie.</strong></div>'; }
        };
        opts.appendChild(b);
      });
      return;
    }

    if(s.type==='match'){
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q" style="font-size:1rem">'+s.q+'</div><div class="match"><div class="mcol" id="ml"><div class="mhead">Situation</div></div><div class="mcol" id="mr"><div class="mhead">Qui peut aider</div></div></div><div class="fb"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach); };
      var ml=scene.querySelector('#ml'), mr=scene.querySelector('#mr'), fb=scene.querySelector('.fb');
      var selLeft=null, pairsLeft=0;
      shuffle(s.left).forEach(function(it){
        var b=document.createElement('button'); b.className='mitem'; b.textContent=it.t; b.setAttribute('data-k',it.k);
        b.onclick=function(){
          if(b.classList.contains('ok'))return;
          ml.querySelectorAll('.mitem').forEach(function(x){x.classList.remove('sel');});
          b.classList.add('sel'); selLeft=b;
        };
        ml.appendChild(b);
      });
      shuffle(s.right).forEach(function(it){
        var b=document.createElement('button'); b.className='mitem'; b.textContent=it.t; b.setAttribute('data-k',it.k);
        b.onclick=function(){
          if(b.classList.contains('ok'))return;
          if(!selLeft){ fb.innerHTML='<div class="msg bad">Choisis d’abord une situation à gauche.</div>'; return; }
          if(selLeft.getAttribute('data-k')===b.getAttribute('data-k')){
            selLeft.classList.remove('sel'); selLeft.classList.add('ok'); selLeft.disabled=true;
            b.classList.add('ok'); b.disabled=true; selLeft=null; pairsLeft++;
            if(pairsLeft===s.left.length){ fb.innerHTML='<div class="msg win">'+s.done+'</div>'; fb.appendChild(continueBtn()); }
            else { fb.innerHTML='<div class="msg good">✓ Bonne association.</div>'; }
          } else {
            b.classList.add('shake'); setTimeout(function(){ b.classList.remove('shake'); },350);
            fb.innerHTML='<div class="msg bad">'+s.bad+'</div>';
          }
        };
        mr.appendChild(b);
      });
      return;
    }

    if(s.type==='cases'){
      var j=0;
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div>'+(s.imgs?'<div class="jimgs">'+s.imgs.map(function(m){return '<img class="jimg" src="'+m.src+'" alt="'+m.alt+'">';}).join('')+'</div>':'')+'<div class="q">'+s.q+'</div><div id="cc"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach); };
      var area=scene.querySelector('#cc');
      function drawCase(){
        var it=s.items[j];
        area.innerHTML=(it.img?'<img class="jimg" src="'+it.img+'" alt="'+(it.alt||'')+'">':'')+'<p class="txt">'+it.text+'</p><div class="opts"></div><div class="fb"></div>';
        var opts=area.querySelector('.opts'), fb=area.querySelector('.fb'), done=false;
        shuffle(it.options).forEach(function(o){
          var b=document.createElement('button'); b.className='opt'; b.textContent=o.l;
          b.onclick=function(){
            if(done)return;
            if(o.good){ done=true; opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); b.classList.add('ok'); fb.innerHTML='<div class="msg good">✓ '+o.fb+'</div>'; var nb=document.createElement('button'); nb.className='btn'; nb.textContent=(j>=s.items.length-1)?'Continuer →':'Suivant →'; nb.onclick=function(){ if(j>=s.items.length-1){ go(idx+1);} else {j++; drawCase();} }; fb.appendChild(nb); }
            else { b.classList.add('no'); b.disabled=true; fb.innerHTML='<div class="msg bad">'+o.fb+' <strong>Réessaie.</strong></div>'; }
          };
          opts.appendChild(b);
        });
      }
      drawCase();
      return;
    }

    if(s.type==='moi'){
      scene.innerHTML='<div class="moi-zone"></div>';
      var mz=scene.querySelector('.moi-zone');
      if(window.CPSMoi){ CPSMoi.sequence(mz, s.spec, {code:MOI.code, titre:MOI.titre, fam:MOI.fam, next:function(){ go(idx+1); }, nextLabel:'Continuer →'}); }
      else { var mb=document.createElement('button'); mb.className='btn'; mb.textContent='Continuer →'; mb.onclick=function(){ go(idx+1); }; mz.appendChild(mb); }
      return;
    }

    if(s.type==='bilan'){
      var h='<div class="hero"><span class="ic"></span><h1>Fin de l’activité</h1><p>Savoir à qui demander, et comment.</p></div><div class="card"><div class="badge">Je sais demander</div><p class="txt" style="font-size:1rem;font-weight:800;color:#1e40af">Ce que tu as appris :</p><ul class="recap">';
      s.recap.forEach(function(r){ h+='<li>'+r+'</li>'; });
      h+='</ul></div>';
      scene.innerHTML=h;
      var c=scene.querySelector('.card');
      if(window.CPSMoi){ var fz=document.createElement('div'); c.appendChild(fz); CPSMoi.defi(fz, MOI.defi, MOI); CPSMoi.duo(fz, MOI.duo); }
      var rb=document.createElement('button'); rb.className='btn'; rb.textContent='Recommencer'; rb.onclick=function(){ go(0); }; c.appendChild(rb);
      var hb=document.createElement('a'); hb.className='btn soft'; hb.href='index.html'; hb.textContent='← Retour à l’accueil'; c.appendChild(hb);
      return;
    }
  }
  render();
})();
</script>
