LA PRÉVENTION"}},{"id":"c6_doc1","type":"document_image","data":{"label":"DOC. 1","titre":"Les acteurs et les organismes de la prévention","corps":"Les acteurs qui travaillent dans l’entreprise sont les **acteurs internes** de la prévention. Ceux qui interviennent depuis l’extérieur sont les **acteurs externes**.","cadre":true,"source":"INRS, « Acteurs de la prévention : à chacun son rôle », inrs.fr.","img":"cap_C6/images/C6_acteurs_de_prevention.jpg","img_desc":"Planche en deux colonnes. Colonne de gauche, titre : « Dans l’entreprise – Des acteurs qui agissent au quotidien. » L’employeur : organise la prévention et met en place les moyens nécessaires. Le salarié : respecte les consignes de sécurité et participe à la prévention. Le salarié compétent (PPRP) : aide l’employeur à prévenir les risques professionnels. Le comité social et économique (CSE) : représente les salariés et donne son avis sur la santé, la sécurité et les conditions de travail. Le sauveteur secouriste du travail (SST) : repère les situations dangereuses et porte les premiers secours. Colonne de droite, titre : « Autres acteurs et organismes de prévention – Ils conseillent, contrôlent et accompagnent. » Le service de prévention et de santé au travail (SPST) : assure le suivi de la santé des salariés et conseille l’employeur ; peut être propre à l’entreprise ou commun à plusieurs entreprises. L’inspection du travail : contrôle le respect de la réglementation du travail. La Caisse d’assurance retraite et de la santé au travail (Carsat) : conseille et accompagne les entreprises pour prévenir les risques professionnels. Bandeau du bas : « L’ensemble de ces acteurs agissent tous ensemble pour la santé et la sécurité au travail. »","img_w":1536,"img_h":1024,"image_pos":"bas"}},{"id":"c6_ch2","type":"question_chapeau","data":{"numero":"2","texte":"À partir du document 1 :","reponse_attendue":"","explication":""}},{"id":"c6_q21","type":"classer","data":{"competence":"C1","numero":"2.1","titre":"","consigne":"**Classer** chaque acteur en écrivant sa catégorie dans le tableau.","categories":["Acteur interne","Acteur externe"],"items":["L’employeur","L’inspection du travail","Le salarié compétent (PPRP)","La Caisse d’assurance retraite et de la santé au travail (Carsat)","Le comité social et économique (CSE)","Le sauveteur secouriste du travail (SST)"],"classement":[0,1,0,1,0,0],"explication":"","indice":"","variantes":{"adapte":{"indice":"Repérer chaque acteur dans le document « Les acteurs et les organismes de la prévention »."},"essentiel":{"indice":"Les acteurs internes travaillent dans l’entreprise ; les acteurs externes interviennent depuis l’extérieur."}}},"el":{"standard":{"indice":"DOC. 1 : la phrase sous le titre dit où travaillent les acteurs internes et d’où viennent les acteurs externes.","explication":"L’employeur, le salarié compétent (PPRP), le comité social et économique et le sauveteur secouriste du travail travaillent dans l’entreprise : ce sont des acteurs internes. L’inspection du travail et la Carsat interviennent depuis l’extérieur : ce sont des acteurs externes.","cherche":[{"bloc":"c6_doc1","texte":"Les acteurs qui travaillent dans l’entreprise sont les"},{"bloc":"c6_doc1","texte":"Ceux qui interviennent depuis l’extérieur sont les"}]},"adapte":{"indice":"DOC. 1 : la phrase sous le titre dit où travaillent les acteurs internes et d’où viennent les acteurs externes.","explication":"L’employeur, le salarié compétent (PPRP), le comité social et économique et le sauveteur secouriste du travail travaillent dans l’entreprise : ce sont des acteurs internes. L’inspection du travail et la Carsat interviennent depuis l’extérieur : ce sont des acteurs externes.","cherche":[{"bloc":"c6_doc1","texte":"Les acteurs qui travaillent dans l’entreprise sont les"},{"bloc":"c6_doc1","texte":"Ceux qui interviennent depuis l’extérieur sont les"}]},"essentiel":{"indice":"DOC. 1 : la phrase sous le titre dit où travaillent les acteurs internes et d’où viennent les acteurs externes.","explication":"L’employeur, le salarié compétent (PPRP), le comité social et économique et le sauveteur secouriste du travail travaillent dans l’entreprise : ce sont des acteurs internes. L’inspection du travail et la Carsat interviennent depuis l’extérieur : ce sont des acteurs externes.","cherche":[{"bloc":"c6_doc1","texte":"Les acteurs qui travaillent dans l’entreprise sont les"},{"bloc":"c6_doc1","texte":"Ceux qui interviennent depuis l’extérieur sont les"}]}}},{"id":"c6_q22","type":"sous_question","data":{"competence":"C1","numero":"2.2","texte":"**Indiquer** le rôle de l’employeur, puis celui du salarié, dans la prévention.","lignes":2,"style_lignes":"tirets_comptage","support_type":"","reponse_attendue":"Employeur : il organise la prévention et met en place les moyens nécessaires.\nSalarié : il respecte les consignes de sécurité et participe à la prévention.","explication":"","indice":"","lignes_par_reponse":2,"variantes":{"adapte":{},"essentiel":{"texte":"**Compléter** les deux phrases avec les mots du document.\nL’employeur …………… la prévention et met en place les moyens nécessaires.\nLe salarié …………… les consignes de sécurité et participe à la prévention.","lignes":0,"style_lignes":"pointilles","lignes_par_reponse":1,"reponse_attendue":"organise\nrespecte"}}},"el":{"standard":{"indice":"DOC. 1 : colonne de gauche du schéma, les deux premières lignes, « L’employeur » puis « Le salarié ».","explication":"L’employeur organise la prévention et met en place les moyens nécessaires. Le salarié respecte les consignes de sécurité et participe à la prévention."},"adapte":{"indice":"DOC. 1 : colonne de gauche du schéma, les deux premières lignes, « L’employeur » puis « Le salarié ».","explication":"L’employeur organise la prévention et met en place les moyens nécessaires. Le salarié respecte les consignes de sécurité et participe à la prévention."},"essentiel":{"indice":"DOC. 1 : le premier verbe est celui de l’employeur, le second celui du salarié.","explication":"L’employeur organise la prévention et met en place les moyens nécessaires. Le salarié respecte les consignes de sécurité et participe à la prévention.","trous":["organise","respecte"]}}},{"id":"c6_doc2","type":"document_image","data":{"label":"DOC. 2","titre":"Le salarié compétent (PPRP) et le sauveteur secouriste du travail (SST)","corps":"1. **Tout employeur** désigne un ou plusieurs salariés compétents pour s’occuper des activités de **protection et de prévention des risques professionnels** (article **L. 4644-1** du Code du travail). Lorsque l’entreprise ne dispose pas des compétences nécessaires, l’employeur peut faire appel à un **intervenant en prévention des risques professionnels (IPRP)**.\n2. La formation du sauveteur secouriste du travail (SST) porte sur **deux dimensions** : la **prévention** des risques professionnels et le **secours** aux victimes.","cadre":true,"source":"Code du travail, article L. 4644-1, code.travail.gouv.fr ; INRS, « Sauveteur secouriste du travail (SST) » et « Salarié compétent », inrs.fr.","img":"cap_C6/images/C6_salarie_competent_PPRP_et_SST.jpg","img_desc":"Planche en deux colonnes. Colonne de gauche, titre : « Le salarié compétent (PPRP) ». Un salarié désigné par l’employeur pour s’occuper de la prévention des risques professionnels. Participe à l’évaluation des risques. Aide à la mise en place d’actions de prévention. Suit la mise en œuvre des actions. Colonne de droite, titre : « Le sauveteur secouriste du travail (SST) ». Un salarié formé pour intervenir en cas d’accident ou de malaise sur le lieu de travail. Porte les premiers secours à une victime. Repère les situations dangereuses. Participe à la prévention dans l’entreprise. Bandeau du bas : « Ces deux salariés agissent avec l’employeur pour prévenir les risques professionnels. »","img_w":1536,"img_h":1024,"image_pos":"bas"}},{"id":"c6_ch3","type":"question_chapeau","data":{"numero":"3","texte":"À partir du document 2 :","reponse_attendue":"","explication":""}},{"id":"c6_q31","type":"sous_question","data":{"competence":"C1","numero":"3.1","texte":"**Relever** les deux dimensions de la formation du sauveteur secouriste du travail (SST).","lignes":2,"style_lignes":"tirets_comptage","support_type":"","reponse_attendue":"La prévention des risques professionnels.\nLe secours aux victimes.","explication":"","indice":"","variantes":{"adapte":{},"essentiel":{"texte":"**Compléter** la phrase avec les mots du document.\nLa formation du sauveteur secouriste du travail (SST) porte sur la …………… des risques professionnels et le …………… aux victimes.","lignes":0,"style_lignes":"pointilles","reponse_attendue":"prévention\nsecours"}},"absorber":false},"el":{"standard":{"indice":"DOC. 2, paragraphe 2 : les deux dimensions sont écrites en gras.","explication":"La formation du sauveteur secouriste du travail porte sur deux dimensions : la prévention des risques professionnels et le secours aux victimes.","cherche":[{"bloc":"c6_doc2","texte":"deux dimensions"},{"bloc":"c6_doc2","texte":"secours"}]},"adapte":{"indice":"DOC. 2, paragraphe 2 : les deux dimensions sont écrites en gras.","explication":"La formation du sauveteur secouriste du travail porte sur deux dimensions : la prévention des risques professionnels et le secours aux victimes.","cherche":[{"bloc":"c6_doc2","texte":"deux dimensions"},{"bloc":"c6_doc2","texte":"secours"}]},"essentiel":{"indice":"DOC. 2, paragraphe 2 : deux mots en gras après « deux dimensions ».","explication":"La formation du sauveteur secouriste du travail porte sur deux dimensions : la prévention des risques professionnels et le secours aux victimes.","trous":["prévention","secours"],"cherche":[{"bloc":"c6_doc2","texte":"deux dimensions"},{"bloc":"c6_doc2","texte":"secours"}]}}},{"id":"c6_q32","type":"sous_question","data":{"competence":"C3","numero":"3.2","texte":"**Établir le lien** entre le repérage des situations dangereuses par le sauveteur secouriste du travail (SST) et la prévention des accidents.","lignes":2,"style_lignes":"tiret_guide","support_type":"","reponse_attendue":"En repérant les situations dangereuses, le sauveteur secouriste du travail permet de les faire corriger avant qu’un accident se produise.","explication":"","indice":"","niveaux":["standard","adapte"],"variantes":{"adapte":{}}},"el":{"standard":{"indice":"DOC. 2, paragraphe 2 : la formation du SST porte sur deux dimensions, dont l’une vient avant l’accident.","explication":"En repérant une situation dangereuse, le sauveteur secouriste du travail permet de la faire corriger avant qu’un accident se produise : c’est de la prévention.","cherche":[{"bloc":"c6_doc2","texte":"deux dimensions"}]},"adapte":{"indice":"DOC. 2, paragraphe 2 : la formation du SST porte sur deux dimensions, dont l’une vient avant l’accident.","explication":"En repérant une situation dangereuse, le sauveteur secouriste du travail permet de la faire corriger avant qu’un accident se produise : c’est de la prévention.","cherche":[{"bloc":"c6_doc2","texte":"deux dimensions"}]}}},{"id":"c6_q32_ess","type":"qcm","data":{"competence":"C3","numero":"3.2","titre":"","consigne":"**Cocher** ce que permet le repérage des situations dangereuses.","items":[{"question":"En repérant une situation dangereuse, le sauveteur secouriste du travail (SST) permet :","options":["de soigner la maladie professionnelle d’un salarié","de corriger la situation avant qu’un accident se produise","de fixer le montant des cotisations de l’entreprise"],"reponse":1}],"niveaux":["essentiel"]},"el":{"essentiel":{"indice":"DOC. 2 : la formation du SST porte aussi sur la prévention, pas seulement sur le secours.","explication":"Repérer une situation dangereuse permet de la corriger avant l’accident. Le SST ne soigne pas les maladies professionnelles et ne fixe pas les cotisations de l’entreprise.","cherche":[{"bloc":"c6_doc2","texte":"deux dimensions"}]}}},{"id":"c6_doc3","type":"document_texte_image","data":{"label":"DOC. 3","titre":"Le comité social et économique (CSE)","corps":"1. Le comité social et économique est l’**instance unique de représentation du personnel** dans l’entreprise.\n2. Il dispose d’un **droit d’alerte** : lorsqu’un de ses membres constate un **danger grave et imminent** ou une **atteinte aux droits des personnes**, il en saisit immédiatement l’employeur.\n3. Il peut aussi **saisir l’inspection du travail** des plaintes et des observations relatives à l’application du droit du travail.","cadre":true,"source":"Code du travail, articles L. 2311-2 et L. 2312-5, code.travail.gouv.fr.","img":"cap_C6/images/C6_le_CSE.png","img_desc":"Schéma intitulé « Le comité social et économique (CSE) ». Première bande : « Au moins 11 salariés pendant 12 mois consécutifs », puis une flèche, puis « Un CSE est mis en place ». Deuxième bande, titre : « Qui compose le comité ? ». « L’employeur : il préside le comité. » « Une délégation du personnel : elle est élue par les salariés. » Troisième bande, titre : « Ses missions en santé et sécurité au travail ». 1. Présenter les réclamations des salariés. 2. Contribuer à promouvoir la santé, la sécurité et les conditions de travail. 3. Réaliser des enquêtes après un accident du travail.","img_w":1900,"img_h":1200,"image_pos":"bas"}},{"id":"c6_ch4","type":"question_chapeau","data":{"numero":"4","texte":"À partir du document 3 :","reponse_attendue":"","explication":""}},{"id":"c6_q41","type":"cocher_exactes","data":{"competence":"C1","numero":"4.1","consigne":"**Cocher** les trois missions du comité social et économique (CSE) en santé et sécurité au travail.","items":[{"texte":"Présenter les réclamations des salariés","correct":true},{"texte":"Soigner les salariés malades","correct":false},{"texte":"Contribuer à promouvoir la santé, la sécurité et les conditions de travail","correct":true},{"texte":"Fixer le montant des salaires","correct":false},{"texte":"Réaliser des enquêtes après un accident du travail","correct":true}]},"el":{"standard":{"indice":"DOC. 3 : la troisième bande du * l’employeur et les salariés, **conduit des actions de prévention** dans l’entreprise, **assure le suivi de l’état de santé** des travailleurs et **participe à la traçabilité des expositions** professionnelles.\n4. Son **équipe pluridisciplinaire** est **animée et coordonnée par le médecin du travail**. Elle comprend notamment des **infirmiers en santé au travail** et des **intervenants en prévention des risques professionnels (IPRP)**.","cadre":true,"source":"Code du travail, articles L. 4622-2, L. 4622-5 et L. 4622-8, code.travail.gouv.fr."}},{"id":"c6_ch6","type":"question_chapeau","data":{"numero":"1","texte":"À partir du document 4 :","reponse_attendue":"","explication":""}},{"id":"c6_q61","type":"sous_question","data":{"competence":"C1","numero":"1.1","texte":"**Relever** les deux formes que peut prendre le service de prévention et de santé au travail (SPST).","lignes":2,"style_lignes":"tirets_comptage","support_type":"","reponse_attendue":"– Un service propre à l’entreprise (service autonome).\n– Un service commun à plusieurs entreprises (service interentreprises).","explication":"","indice":"","variantes":{"adapte":{},"essentiel":{"texte":"**Compléter** les deux phrases avec les mots du document.\nLe service peut être propre à l’entreprise : c’est un service …………… .\nIl peut être commun à plusieurs entreprises : c’est un service …………… .","lignes":0,"style_lignes":"pointilles","reponse_attendue":"autonome\ninterentreprises"}}},"el":{"standard":{"indice":"DOC. 4, paragraphe 1 : les deux mots écrits en gras entre parenthèses.","explication":"Le service peut être propre à l’entreprise : c’est un service autonome. Il peut être commun à plusieurs entreprises : c’est un service interentreprises.","cherche":[{"bloc":"c6_doc4","texte":"autonome"},{"bloc":"c6_doc4","texte":"interentreprises"}]},"adapte":{"indice":"DOC. 4, paragraphe 1 : les deux mots écrits en gras entre parenthèses.","explication":"Le service peut être propre à l’entreprise : c’est un service autonome. Il peut être commun à plusieurs entreprises : c’est un service interentreprises.","cherche":[{"bloc":"c6_doc4","texte":"autonome"},{"bloc":"c6_doc4","texte":"interentreprises"}]},"essentiel":{"indice":"DOC. 4, paragraphe 1 : un mot pour une seule entreprise, un mot pour plusieurs.","explication":"Le service peut être propre à l’entreprise : c’est un service autonome. Il peut être commun à plusieurs entreprises : c’est un service interentreprises.","trous":["autonome","interentreprises"],"cherche":[{"bloc":"c6_doc4","texte":"autonome"},{"bloc":"c6_doc4","texte":"interentreprises"}]}}},{"id":"c6_q62","type":"sous_question","data":{"competence":"C1","numero":"1.2","texte":"**Nommer** le professionnel qui anime et coordonne l’équipe pluridisciplinaire.","lignes":1,"style_lignes":"tiret_guide","support_type":"","reponse_attendue":"Le médecin du travail.","explication":"","indice":"","variantes":{"adapte":{"indice":"Ce professionnel est un médecin."},"essentiel":{"texte":"**Compléter** la phrase avec les mots du document.\nL’équipe pluridisciplinaire est animée et coordonnée par le …………… .","lignes":0,"style_lignes":"pointilles","reponse_attendue":"médecin du travail"}}},"el":{"standard":{"indice":"DOC. 4, paragraphe 4 : la phrase qui dit qui anime et coordonne l’équipe.","explication":"L’équipe pluridisciplinaire est animée et coordonnée par le médecin du travail.","cherche":[{"bloc":"c6_doc4","texte":"animée et coordonnée par le médecin du travail"}]},"adapte":{"indice":"DOC. 4, paragraphe 4 : ce professionnel est un médecin.","explication":"L’équipe pluridisciplinaire est animée et coordonnée par le médecin du travail.","cherche":[{"bloc":"c6_doc4","texte":"animée et coordonnée par le médecin du travail"}]},"essentiel":{"indice":"DOC. 4, paragraphe 4 : ce professionnel est un médecin.","explication":"L’équipe pluridisciplinaire est animée et coordonnée par le médecin du travail.","trous":["médecin du travail|le médecin du travail"],"cherche":[{"bloc":"c6_doc4","texte":"animée et coordonnée par le médecin du travail"}]}}},{"id":"c6_doc5","type":"document","data":{"label":"DOC. 5","titre":"L’inspection du travail","corps":"1. L’inspection du travail **contrôle l’application du droit du travail** dans les entreprises : **santé**, **sécurité**, durée du travail, représentation du personnel.\n2. Elle **informe et conseille** les employeurs, les salariés et les représentants du personnel sur leurs **droits** et leurs **obligations**. Elle peut aussi servir de **médiateur** lors d’un conflit collectif du travail.\n3. Ses **agents de contrôle** ont le **droit d’entrer** dans les établissements pour y mener leurs **enquêtes** et y **constater les infractions**.\n4. Dans certaines situations prévues par le Code du travail, lorsqu’un travailleur est exposé à un **danger grave et imminent**, l’agent de contrôle peut décider l’**arrêt temporaire** de travaux ou d’une activité.","cadre":true,"source":"Service-Public, « Quand faire appel à l’inspection du travail ? », service-public.gouv.fr ; Code du travail, articles L. 8113-1 et L. 4731-1, code.travail.gouv.fr."}},{"id":"c6_ch7","type":"question_chapeau","data":{"numero":"2","texte":"À partir du document 5 :","reponse_attendue":"","explication":""}},{"id":"c6_q71","type":"cocher_exactes","data":{"competence":"C1","numero":"2.1","consigne":"**Cocher** les trois activités qui relèvent de l’inspection du travail.","items":[{"texte":"Contrôler l’application du droit du travail","correct":true},{"texte":"Verser des aides financières aux entreprises pour la prévention","correct":false},{"texte":"Constater les infractions au droit du travail","correct":true},{"texte":"Prononcer l’aptitude médicale d’un salarié à son poste","correct":false},{"texte":"Entrer dans un établissement pour y mener une enquête","correct":true}]},"el":{"standard":{"indice":"DOC. 5 : les paragraphes 1 et 3.","explication":"L’inspection du travail contrôle l’application du droit du travail, constate les infractions et entr
