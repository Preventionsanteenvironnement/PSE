nt", "id": "c5_doc2", "data": {"label": "DOC. 2", "titre": "Les familles de risques professionnels (extrait de la liste INRS)", "cadre": true, "corps": "1 Risques de chute de plain-pied\n2 Risques de chute de hauteur\n3 Risques liés aux circulations internes de véhicules et d’engins\n5 Risques liés à la charge physique de travail\n9 Risques liés aux équipements de travail\n11 Risques et nuisances liés au bruit\n14 Risques liés à l’électricité\n17 Risques psychosociaux\n[…]", "source": "INRS, « Évaluation des risques professionnels. Aide au repérage des risques dans les PME-PMI », ED 840, octobre 2023 (extrait du sommaire, 20 fiches).", "date_consultation": "2026-10-26"}}, {"type": "document", "id": "c5_doc3", "data": {"label": "DOC. 3", "titre": "Du danger au dommage", "cadre": true, "corps": "**Danger** — « caractéristique non seulement d’un équipement, d’un produit ou d’un agent, d’une source d’énergie, mais également d’une situation de travail, d’une organisation de travail, d’un environnement de travail ou la survenue d’événements, susceptible de porter atteinte à la santé mentale ou physique du salarié » (INRS).\n**Risque professionnel** — il « résulte de l’exposition du travailleur, du fait de son activité professionnelle, à un danger. L’exposition peut être ponctuelle ou prolongée, les effets sur la santé peuvent être immédiats ou différés (accident ou maladie) […] » (INRS).\n**Situation dangereuse** — situation dans laquelle l’opérateur est exposé au danger.\n**Événement dangereux ou déclencheur** — événement susceptible, dans la situation dangereuse, de causer le dommage.\n**Dommage** — atteinte à la santé : blessure ou maladie.", "source": "INRS, « Fondamentaux de la prévention », 2024 ; d’après Foucher, Les Nouveaux Cahiers PSE Bac Pro, 2025.", "date_consultation": "2026-10-26"}}, {"type": "question_chapeau", "id": "c5_ch3", "data": {"numero": "1", "texte": "À partir de la situation de Nathalie et du document 2 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "c5_q31", "data": {"competence": "C2", "numero": "1.1", "texte": "**Identifier** les deux familles de risques de chute présentes au cours du rangement des archives.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Risques de chute de hauteur (escabeau).\n– Risques de chute de plain-pied (couloir encombré).", "indice": "", "reponse_allegee": "", "variantes": {"essentiel": {"texte": "**Identifier** les deux familles de risques de chute présentes aux archives, en écrivant leur numéro.\nNuméros proposés : 1 – 2 – 14.\n– Le couloir encombré : risque n° ……………………… .\n– L’escabeau : risque n° ……………………… .", "lignes": 0, "reponse_attendue": "1 · 2"}}, "lignes_par_reponse": 1}, "el": {"standard": {"indice": "DOC. 2 : les deux premières familles de la liste ; situation : l’escabeau et le couloir.", "explication": "Deux familles : les risques de chute de hauteur (l’escabeau) et les risques de chute de plain-pied (le couloir encombré)."}, "essentiel": {"indice": "DOC. 2 : les familles n° 1 et n° 2. Plain-pied = au niveau du sol ; hauteur = en montant.", "explication": "Le couloir encombré : risque n° 1, chute de plain-pied. L’escabeau : risque n° 2, chute de hauteur. Le n° 14 concerne l’électricité.", "trous": ["1", "2"]}}}, {"type": "question_chapeau", "id": "c5_ch4", "data": {"numero": "2", "texte": "À partir de la situation de Nathalie et du document 3 :", "reponse_attendue": ""}}, {"id": "c5_q41_pad", "type": "sous_question", "data": {"competence": "C2", "numero": "2.1", "texte": "**Compléter** le schéma du processus d’apparition du dommage pour une chute possible de Nathalie depuis l’escabeau.", "lignes": 0, "reponse_attendue": ""}, "el": {"standard": {"indice": "DOC. 3 : les définitions du danger, de la situation dangereuse, de l’événement déclencheur et du dommage ; situation : l’escabeau et les étagères de 2 m.", "explication": "Danger : la hauteur de travail (étagères de 2 m). Opérateur : Nathalie. Situation dangereuse : elle monte sur l’escabeau avec un carton de 10 kg. Événement déclencheur : elle perd l’équilibre en posant le carton. Dommage : une fracture ou une entorse."}, "essentiel": {"indice": "DOC. 3 : le danger est ce qui peut blesser ; le dommage est la blessure.", "explication": "Danger : la hauteur. Opérateur : Nathalie. Situation dangereuse : sur l’escabeau avec un carton. Événement : perte d’équilibre. Dommage : une fracture ou une entorse."}}}, {"id": "c5_q41_pad_tab", "type": "tableau", "data": {"titre": "", "cells": [[{"type": "prof", "content": "L’élément du processus"}, {"type": "prof", "content": "Dans la situation"}], [{"type": "prof", "content": "Le danger"}, {"type": "eleve", "content": "", "reponse": "La hauteur de travail (étagères de 2 m)."}], [{"type": "prof", "content": "L’opérateur"}, {"type": "eleve", "content": "", "reponse": "Nathalie."}], [{"type": "prof", "content": "La situation dangereuse"}, {"type": "eleve", "content": "", "reponse": "Elle monte sur l’escabeau avec un carton de 10 kg."}], [{"type": "prof", "content": "L’événement déclencheur"}, {"type": "eleve", "content": "", "reponse": "Elle perd l’équilibre en posant le carton."}], [{"type": "prof", "content": "Le dommage"}, {"type": "eleve", "content": "", "reponse": "Une fracture (ou une entorse)."}]], "table_col_widths": [34, 66]}}, {"type": "sous_question", "id": "c5_q42", "data": {"competence": "C2", "numero": "2.2", "texte": "**Identifier** l’événement dangereux ou déclencheur et le dommage du collègue de Nathalie.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Événement : il trébuche sur un carton.\n– Dommage : une entorse de la cheville.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** les phrases sur la chute du collègue de Nathalie.\n– Événement dangereux ou déclencheur : il ……………………… sur un carton.\n– Dommage : une ……………………… de la cheville.", "lignes": 0, "re 7", "data": {"titre": "LES PRINCIPES GÉNÉRAUX DE PRÉVENTION"}}, {"type": "document", "id": "c5_doc5", "data": {"label": "DOC. 5", "titre": "Les principes généraux de prévention", "cadre": true, "corps": "**Code du travail, article L. 4121-2** — « L’employeur met en oeuvre les mesures prévues à l’article L. 4121-1 sur le fondement des principes généraux de prévention suivants :\n1° Eviter les risques ;\n2° Evaluer les risques qui ne peuvent pas être évités ;\n3° Combattre les risques à la source ;\n4° Adapter le travail à l’homme, […] ;\n5° Tenir compte de l’état d’évolution de la technique ;\n6° Remplacer ce qui est dangereux par ce qui n’est pas dangereux ou par ce qui est moins dangereux ;\n7° Planifier la prévention […] ;\n8° Prendre des mesures de protection collective en leur donnant la priorité sur les mesures de protection individuelle ;\n9° Donner les instructions appropriées aux travailleurs. »", "source": "Code du travail, article L. 4121-2 (extrait).", "date_consultation": "2026-10-26"}}, {"type": "question_chapeau", "id": "c5_ch7", "data": {"numero": "1", "texte": "À partir du document 5 :", "reponse_attendue": ""}}, {"type": "relier", "id": "c5_q71", "data": {"competence": "C2", "numero": "1.1", "titre": "", "consigne": "**Relier** chaque mesure au principe de prévention qu’elle applique.", "gauche": ["Remplacer un produit de nettoyage toxique par un produit sans danger", "Afficher en atelier la consigne de port des gants", "Apprécier la gravité et la probabilité de chaque risque"], "droite": ["2° Évaluer les risques", "6° Remplacer ce qui est dangereux", "9° Donner les instructions appropriées", "4° Adapter le travail à l’homme"], "correspondances": [1, 2, 0]}, "el": {"standard": {"indice": "DOC. 5 : chercher le verbe de chaque principe (remplacer, donner les instructions, évaluer). Un principe reste sans mesure.", "explication": "Remplacer un produit toxique par un produit sans danger : 6° Remplacer ce qui est dangereux. Afficher la consigne de port des gants : 9° Donner les instructions appropriées. Apprécier la gravité et la probabilité : 2° Évaluer les risques. Le principe 4° reste sans mesure."}}}, {"type": "analyse", "id": "c5_analyse8", "data": {"titre": "PROTECTION COLLECTIVE, PROTECTION INDIVIDUELLE ET DOCUMENT UNIQUE"}}, {"type": "document", "id": "c5_doc6", "data": {"label": "DOC. 6", "titre": "La protection des salariés : collective, individuelle et formation", "cadre": true, "corps": "**INRS** — « [Un équipement de protection] est dit de protection collective s’il assure indistinctement la sécurité du salarié affecté au poste et celle des autres personnes présentes à proximité. Les équipements de protection collective permettent de protéger l’ensemble des salariés et sont dans ce sens à privilégier. »\n**Code du travail, article R. 4311-8** — « Les équipements de protection individuelle […] sont des dispositifs ou moyens destinés à être portés ou tenus par une personne en vue de la protéger contre un ou plusieurs risques susceptibles de menacer sa santé ou sa sécurité. »\n**INRS** — Les échelles et escabeaux « doivent donc absolument être bannis comme poste de travail au profit de matériels comme les plates-formes individuelles roulantes. »\n**INRS, ED 840** — « […] privilégiez les aides techniques adaptées pour les manutentions […], formez les salariés à la prévention des risques liés à l’activité physique (formation-action Prap) […] »", "source": "INRS (2022, 2023 ; ED 840, fiche 5) ; Code du travail, article R. 4311-8.", "date_consultation": "2026-10-26"}}, {"type": "document", "id": "c5_doc7", "data": {"label": "DOC. 7", "titre": "Le document unique d’évaluation des risques professionnels (DUERP)", "cadre": true, "corps": "**Code du travail, article L. 4121-3-1** — « I.-Le document unique d’évaluation des risques professionnels répertorie l’ensemble des risques professionnels auxquels sont exposés les travailleurs et assure la traçabilité collective de ces expositions. […] »\n**Code du travail, article R. 4121-2** — « La mise à jour du document unique d’évaluation des risques professionnels est réalisée :\n1° Au moins chaque année dans les entreprises d’au moins onze salariés ;\n2° Lors de toute décision d’aménagement important modifiant les conditions de santé et de sécurité ou les conditions de travail ;\n3° Lorsqu’une information supplémentaire intéressant l’évaluation d’un risque est portée à la connaissance de l’employeur. […] »", "source": "Code du travail, articles L. 4121-3-1 et R. 4121-2 (extraits).", "date_consultation": "2026-10-26"}}, {"type": "question_chapeau", "id": "c5_ch8", "data": {"numero": "2", "texte": "À partir de la situation de Nathalie et des documents 6 et 7 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "c5_q81", "data": {"competence": "C3", "numero": "2.1", "texte": "**Expliquer** pourquoi une protection collective est prioritaire sur une protection individuelle.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Elle protège à la fois le salarié au poste et les autres personnes présentes, sans dépendre d’un équipement porté.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase sur la priorité de la protection collective.\nElle protège le salarié au poste et les ……………………… personnes présentes, sans dépendre d’un équipement ……………………… .", "lignes": 0, "reponse_allegee": "Elle protège le salarié au poste et les {{autres}} personnes présentes, sans dépendre d’un équipement {{porté}}.", "reponse_attendue": "autres · porté"}, "essentiel": {"texte": "**Compléter** la phrase sur la protection collective.\nMots proposés : autres – porté – vendu.\nElle protège aussi les ……………………… personnes, sans équipement ……………………… .", "lignes": 0, "reponse_attendue": "autres · porté"}}}, "el": {"standard": {"indice": "DOC. 6 : la phrase de l’INRS sur l’équipement de protection collective, puis l’article R. 4311-8 sur l’équipement porté par une personne.", "explication": "La protection collective protège à la fois le salarié au poste et les autres personnes présentes. Elle ne dépend pas d’un équipement porté par chacun : elle est à privilégier."}, "adapte": {"indice": "DOC. 6 : « celle des autres personnes présentes » ; « portés ou tenus par une personne ».", "explication": "La protection collective protège le salarié au poste et les autres personnes présentes, sans dépendre d’un équipement porté.", "trous": ["autres", "porté|porte|portés|portes|individuel"]}, "essentiel": {"indice": "DOC. 6 : la première phrase de l’INRS.", "explication": "La protection collective protège aussi les autres personnes, sans équipement porté. Le mot « vendu » ne convient pas.", "trous": ["autres", "porté|porte"]}}}, {"type": "sous_question", "id": "c5_q82", "data": {"competence": "C2", "numero": "2.2", "texte": "**Indiquer** les deux raisons pour lesquelles l’employeur de Nathalie doit mettre à jour le document unique.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– L’accident du collègue est une information nouvelle : mise à jour dès maintenant.\n– L’entreprise compte 25 salariés : mise à jour au moins chaque année.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** les phrases sur la mise à jour du document unique.\n– L’accident du collègue est une information ……………………… : mise à jour dès maintenant.\n– L’entreprise compte 25 salariés : mise à jour au moins chaque ……………………… .", "lignes": 0, "reponse_allegee": "– information {{supplémentaire}} (ou nouvelle)\n– au moins chaque {{année}}.", "reponse_attendue": "supplémentaire (ou nouvelle) · année"}, "essentiel": {"texte": "**Compléter** les phrases sur la mise à jour du document unique.\nMots proposés : supplémentaire – année – mois.\n– L’accident est une information ……………………… : mise à jour dès maintenant.\n– 25 salariés : mise à jour au moins chaque ……………………… .", "lignes": 0, "reponse_attendue": "supplémentaire · année"}}, "lignes_par_reponse": 1}, "el": {"standard": {"indice": "DOC. 7 : l’article R. 4121-2, points 1° et 3° ; situation : le nombre de salariés et l’accident du collègue.", "explication": "L’accident du collègue est une information supplémentaire sur un risque : mise à jour dès maintenant (point 3°). L’entreprise compte 25 salariés, donc au moins onze : mise à jour au moins chaque année (point 1°)."}, "adapte": {"indice": "DOC. 7 : l’article R. 4121-2, point 3° (une information…) et point 1° (au moins chaque…).", "explication": "L’accident est une information supplémentaire, ou nouvelle. Avec 25 salariés, la mise à jour a lieu au moins chaque année.", "trous": ["supplémentaire|supplementaire|nouvelle", "année|annee|an"]}, "essentiel": {"indice": "DOC. 7 : l’article R. 4121-2, points 1° et 3°.", "explication": "L’accident est une information supplémentaire. Avec 25 salariés : mise à jour au moins chaque année. Le mot « mois » ne convient pas.", "trous": ["supplémentaire|supplementaire", "année|annee"]}}}, {"type": "analyse", "id": "c5_analyse9", "data": {"titre": "REVENIR À LA SITUATION : PROPOSER DES SOLUTIONS"}}, {"type": "question_chapeau", "id": "c5_ch9", "data": {"numero": "3", "texte": "À partir du tableau ITaMaMi (séance 1), de l’évaluation des risques (séance 3) et des documents 5, 6 et 7 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "c5_q91", "data": {"competence": "C4", "numero": "3.1", "texte": "**Proposer** une mesure sur le milieu qui supprime à la source le risque de chute dans le couloir.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Créer une zone de stockage pour les cartons de livraison et dégager le couloir.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Proposer** une mesure sur le milieu qui supprime à la source le risque de chute dans le couloir.\nPistes : les cartons de livraison, une zone réservée."}}, "absorber": false}, "el": {"standard": {"indice": "DOC. 5 : les principes 1° et 3° (éviter, combattre à la source) ; le milieu : ce qui encombre le couloir.", "explication": "Créer une zone de stockage pour les cartons de livraison et dégager le couloir : l’obstacle disparaît, le risque de chute de plain-pied est supprimé à la source."}, "adapte": {"indice": "DOC. 5 : le principe 3° ; les pistes : les cartons de livraison, une zone réservée.", "explication": "Créer une zone de stockage réservée aux cartons de livraison et dégager le couloir."}}}, {"type": "qcm", "id": "c5_q91_ess", "data": {"competence": "C4", "numero": "3.1", "titre": "", "consigne": "**Choisir** la mesure qui supprime à la source le risque de chute dans le couloir, en cochant la proposition exacte.", "items": [{"question": "La mesure est :", "options": ["Créer une zone de stockage pour les cartons de livraison et dégager le couloir.", "Demander aux salariés de regarder où ils marchent.", "Poser un panneau « Attention aux cartons » dans le couloir."], "reponse": 0}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "Une mesure à la source enlève l’obstacle du couloir.", "explication": "Créer une zone de stockage pour les cartons et dégager le couloir. Un panneau ou une consigne de prudence laisse les cartons au sol."}}}, {"type": "sous_question", "id": "c5_q92", "data": {"competence": "C4", "numero": "3.2", "texte": "**Proposer** une protection collective sur le matériel contre la chute de hauteur de Nathalie.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Remplacer l’escabeau par une plateforme individuelle roulante avec garde-corps.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Proposer** une protection collective sur le matériel contre la chute de hauteur de Nathalie.\nPistes : l’escabeau, le garde-corps."}}, "absorber": false}, "el": {"standard": {"indice": "DOC. 6 : la phrase de l’INRS sur les échelles et escabeaux ; une protection collective agit sur le matériel.", "explication": "Remplacer l’escabeau par une plateforme individuelle roulante avec garde-corps : le garde-corps protège sans dépendre d’un équipement porté."}, "adapte": {"indice": "DOC. 6 : la phrase de l’INRS sur les escabeaux ; les pistes : l’escabeau, le garde-corps.", "explication": "Remplacer l’escabeau par une plateforme individuelle roulante avec garde-corps."}}}, {"type": "qcm", "id": "c5_q92_ess", "data": {"competence": "C4", "numero": "3.2", "titre": "", "consigne": "**Choisir** la protection collective contre la chute de hauteur, en cochant la proposition exacte.", "items": [{"question": "La mesure est :", "options": ["Remplacer l’escabeau par une plateforme individuelle roulante avec garde-corps.", "Fournir à Nathalie des chaussures antidérapantes.", "Ajouter une marche à l’escabeau."], "reponse": 0}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 6 : les escabeaux sont à remplacer comme poste de travail.", "explication": "Remplacer l’escabeau par une plateforme roulante avec garde-corps. Les chaussures sont une protection individuelle ; une marche de plus ne protège pas de la chute."}}}, {"type": "sous_question", "id": "c5_q93", "data": {"competence": "C4", "numero": "3.3", "texte": "**Proposer** une protection individuelle complémentaire pour Nathalie contre le risque de chute de plain-pied.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Des chaussures fermées à semelle antidérapante.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Proposer** une protection individuelle complémentaire pour Nathalie contre le risque de chute de plain-pied.\nPistes : les pieds, les chaussures."}}, "absorber": false}, "el": {"standard": {"indice": "DOC. 6 : l’article R. 4311-8, un équipement porté par la personne ; le risque : trébucher et glisser au sol.", "explication": "Des chaussures fermées à semelle antidérapante : un équipement porté par Nathalie, en complément de la protection collective."}, "adapte": {"indice": "DOC. 6 : l’article R. 4311-8 ; les pistes : les pieds, les chaussures.", "explication": "Des chaussures fermées à semelle antidérapante."}}}, {"type": "qcm", "id": "c5_q93_ess", "data": {"competence": "C4", "numero": "3.3", "titre": "", "consigne": "**Choisir** la protection individuelle complémentaire contre la chute de plain-pied, en cochant la proposition exacte.", "items": [{"question": "La mesure est :", "options": ["Des chaussures fermées à semelle antidérapante.", "Des gants de manutention.", "Une plateforme roulante avec garde-corps."], "reponse": 0}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "La chute de plain-pied concerne les pieds.", "explication": "Des chaussures fermées à semelle antidérapante. Les gants protègent les mains ; la plateforme est une protection collective."}}}, {"type": "sous_question", "id": "c5_q94", "data": {"competence": "C4", "numero": "3.4", "texte": "**Proposer** une action de formation pour les salariés qui descendent l’escalier chargés de cartons.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Une formation-action Prap (port des cartons, aides techniques).", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Proposer** une action de formation pour les salariés qui descendent l’escalier chargés de cartons.\nPistes : le port des cartons, le document 6."}}, "absorber": false}, "el": {"standard": {"indice": "DOC. 6 : l’extrait de l’ED 840 sur les manutentions et la formation des salariés.", "explication": "Une formation-action Prap : prévention des risques liés à l’activité physique, port des cartons et usage des aides techniques."}, "adapte": {"indice": "DOC. 6 : la dernière phrase de l’INRS ; les pistes : le port des cartons.", "explication": "Une formation-action Prap au port des cartons, avec les aides techniques."}}}, {"type": "qcm", "id": "c5_q94_ess", "data": {"competence": "C4", "numero": "3.4", "titre": "", "consigne": "**Choisir** l’action de formation pour le port des cartons dans l’escalier, en cochant la proposition exacte.", "items": [{"question": "La mesure est :", "options": ["Une formation-action Prap au port des cartons.", "Une affiche sur les dangers de l’escabeau.", "Une formation à la saisie des commandes."], "reponse": 0}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 6 : la formation citée par l’INRS.", "explication": "Une formation-action Prap au port des cartons. Une affiche n’est pas une formation ; la saisie des commandes ne concerne pas les cartons."}}}, {"type": "sous_question", "id": "c5_q95", "data": {"competence": "C2", "numero": "3.5", "texte": "**Compléter** la ligne du document unique pour le risque de chute de hauteur aux archives.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "", "indice": "", "reponse_allegee": "", "variantes": {"essentiel": {"texte": "**Compléter** la ligne du document unique pour la chute de hauteur, en cochant la proposition exacte dans chaque case."}}}, "el": {"standard": {"indice": "Le tableau de la séance 3 : la priorité de la chute de hauteur ; la question 3.2 : la protection collective sur le matériel.", "explication": "Archives, chute de hauteur depuis l’escabeau : priorité 1 ; mesure prévue : une plateforme individuelle roulante avec garde-corps."}, "essentiel": {"indice": "La séance 3 : la priorité de la chute de hauteur ; la protection collective passe en premier.", "explication": "Priorité 1 ; mesure prévue : une plateforme roulante avec garde-corps. Les chaussures seules ne suffisent pas."}}}, {"type": "tableau", "id": "c5_q95_tab", "data": {"titre": "", "cells": [[{"type": "prof", "content": "Unité de travail"}, {"type
