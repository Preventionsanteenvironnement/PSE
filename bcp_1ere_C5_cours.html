illé.", "image_pos": "droite", "image_largeur": 22, "img": "bcp_1ere_C5/images/bcp_1ere_C5_c5_doc2.jpg", "img_desc": "Illustration : un agent d’entretien lave le sol d’un couloir ; une salariée s’apprête à marcher sur le sol mouillé.", "img_w": 1100, "img_h": 733}}, {"id": "c5_ch3", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 2 :", "reponse_attendue": ""}}, {"id": "c5_q31", "type": "relier", "data": {"competence": "C1", "numero": "1.1", "titre": "", "consigne": "**Relier** chaque élément du PAD à sa définition.", "gauche": ["Le danger", "L’opérateur", "La situation dangereuse", "L’événement déclencheur", "Le dommage"], "droite": ["La personne qui réalise le travail", "L’événement qui peut causer le dommage", "Une source possible de dommage", "L’atteinte à la santé qui peut en résulter", "La situation dans laquelle l’opérateur est exposé au danger"], "correspondances": [2, 0, 4, 1, 3], "indice": "", "variantes": {"adapte": {"indice": "Chercher chaque élément en gras dans le document « Le processus d’apparition d’un dommage »."}, "essentiel": {"indice": "Commencer par l’opérateur : c’est une personne."}}}, "el": {"standard": {"indice": "DOC. 2 : la définition qui suit chaque mot en gras.", "explication": "Le danger : une source possible de dommage. L’opérateur : la personne qui réalise le travail. La situation dangereuse : la situation dans laquelle l’opérateur est exposé au danger. L’événement déclencheur : l’événement qui peut causer le dommage. Le dommage : l’atteinte à la santé qui peut en résulter."}, "essentiel": {"indice": "DOC. 2 : chaque mot en gras est suivi de sa définition.", "explication": "Le danger est une source possible de dommage. L’opérateur est la personne qui travaille. La situation dangereuse expose l’opérateur au danger. L’événement déclencheur peut causer le dommage. Le dommage est l’atteinte à la santé."}}}, {"id": "c5_analyse4", "type": "analyse", "data": {"titre": "REVENIR À LA SITUATION"}}, {"id": "c5_ ule : Juliette perd l’équilibre."}], [{"type": "prof", "content": "Le dommage"}, {"type": "eleve", "content": "", "reponse": "Une blessure : entorse du poignet, voire fracture."}]], "table_col_widths": [34, 66]}}, {"id": "c5_q42", "type": "sous_question", "data": {"competence": "C2", "numero": "2.2", "texte": "**Analyser** le mal de dos de Juliette en complétant le tableau du processus d’apparition du dommage.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "", "indice": "", "reponse_allegee": ""}, "el": {"standard": {"indice": "DOC. 2 : la dernière phrase, sur le dommage sans événement soudain ; situation : les packs d’eau et le mal de dos.", "explication": "Le danger : les packs d’eau de 9 kg. L’opérateur : Juliette. La situation dangereuse : elle porte et lève des packs chaque matin, jusqu’à 1,80 m. Pas d’événement soudain : des ports de charge répétés, bras levés, jour après jour. Le dommage : des douleurs au dos, qui peuvent devenir durables."}, "adapte": {"indice": "Situation : le poids des packs et le mal de dos ; DOC. 2 : la dernière phrase.", "explication": "Le danger : les packs d’eau de 9 kg. Pas d’événement soudain : des ports de charge répétés, bras levés, jour après jour. Le dommage : des douleurs au dos, qui peuvent devenir durables."}, "essentiel": {"indice": "DOC. 2 : la dernière phrase ; situation : ce que Juliette ressent presque chaque soir.", "explication": "Il n’y a pas d’événement soudain : Juliette porte des charges, bras levés, jour après jour. Le dommage : des douleurs au dos, qui peuvent devenir durables."}}}, {"id": "c5_q42_tab", "type": "tableau", "data": {"titre": "", "cells": [[{"type": "prof", "content": "L’élément du PAD"}, {"type": "prof", "content": "Pour le mal de dos de Juliette"}], [{"type": "prof", "content": "Le danger"}, {"type": "eleve", "content": "", "reponse": "Les packs d’eau de 9 kg."}], [{"type": "prof", "content": "L’opérateur"}, {"type": "eleve", "content": "", "rep : "c5_seance3", "type": "seance", "data": {"numero": "3", "titre": "L’évaluation du risque", "objectif": "Être capable d’évaluer un risque d’atteinte à la santé.", "competences": ["C1", "C2", "C3"]}}, {"id": "c5_analyse5", "type": "analyse", "data": {"titre": "ÉVALUER UN RISQUE"}}, {"id": "c5_doc3", "type": "document", "data": {"label": "DOC. 3", "titre": "Apprécier un risque pour fixer des priorités", "cadre": true, "corps": "1. L’**appréciation des risques** permet d’ordonner les risques, pour planifier les actions de prévention et établir leurs priorités.\n2. Les règles d’appréciation sont définies dans l’entreprise, avec des critères comme la **gravité** potentielle de l’atteinte à la santé, la durée d’exposition, le nombre de personnes exposées, le nombre d’accidents déjà survenus.\n3. Beaucoup d’entreprises croisent deux critères :\n– la **gravité** : l’importance du dommage possible ;\n– la **probabilité d’occurrence** : la possibilité que le dommage arrive ; elle augmente avec la **fréquence d’exposition** (combien de fois l’opérateur est exposé) et avec la probabilité de l’événement déclencheur.", "source": "D’après l’INRS, Évaluation des risques professionnels (ED 840).", "date_consultation": "2026-09-23", "image_w": 1100, "image_h": 733, "image_nom": "Illustration : la responsable et Juliette observent l’étagère haute et l’escabeau ; la responsable prend des notes.", "image_pos": "droite", "image_largeur": 22, "img": "bcp_1ere_C5/images/bcp_1ere_C5_c5_doc3.jpg", "img_desc": "Illustration : la responsable et Juliette observent l’étagère haute et l’escabeau ; la responsable prend des notes.", "img_w": 1100, "img_h": 733}}, {"id": "c5_doc4", "type": "document", "data": {"label": "DOC. 4", "titre": "La grille d’appréciation d’un magasin", "cadre": true, "corps": "Exemple de grille simplifiée utilisée par une entreprise. Gravité du dommage potentiel : 1 = sans arrêt de travail ; 2 = avec arrêt de travail ou hospitalisation ; 3 = avec incapacité permanente ; 4  1, "reponse_attendue": "risques\nprévention"}}}, "el": {"standard": {"indice": "DOC. 6 : le point 1 (ce que le document contient) et le point 3 (ce à quoi il sert).", "explication": "Le DUERP recense les risques identifiés et appréciés, et il sert à définir et à suivre les actions de prévention."}, "essentiel": {"indice": "DOC. 6 : le point 1, « le recensement des… », et le point 3, « les actions de… ».", "explication": "Le DUERP recense les risques. Il sert à définir les actions de prévention.", "trous": ["risques|risque|risques professionnels", "prévention|prevention"]}}}, {"id": "c5_analyse9", "type": "analyse", "data": {"titre": "PROPOSER DES SOLUTIONS"}}, {"id": "c5_ch9", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir de la situation de Juliette et du document 5 :", "reponse_attendue": ""}}, {"id": "c5_q91", "type": "sous_question", "data": {"competence": "C4", "numero": "3.1", "texte": "**Proposer** des mesures de prévention hiérarchisées contre la chute de Juliette, en complétant l’échelle.", "points": "", "lignes": 0, "style_lignes": "", "support_type": "", "reponse_attendue": "", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Proposer** des mesures hiérarchisées contre la chute de Juliette en complétant l’échelle. Mots proposés : plateforme à garde-corps ; chaussures antidérapantes."}, "essentiel": {"texte": "**Proposer** des mesures contre la chute en écrivant à chaque niveau le numéro de la bonne mesure :\n1 garde-corps ; 2 formation ; 3 plateforme par rayon ; 4 packs à hauteur accessible depuis le sol ; 5 chaussures antidérapantes."}}}, "el": {"standard": {"indice": "DOC. 5 : l’ordre des principes, du principe 1 au principe 9 ; situation : les packs, l’étagère haute, la plateforme dans la réserve.", "explication": "Du plus efficace au complément : ranger les packs à une hauteur accessible depuis le sol ; mettre une plateforme à disposition dans chaque rayon ; utiliser une plateforme à garde-corps pour t
