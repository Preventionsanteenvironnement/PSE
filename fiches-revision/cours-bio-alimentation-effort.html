Après une journée de plantation, Jérôme va directement à sa séance de musculation, de 18 h 30 à 19 h 15. Il n’a rien mangé depuis son déjeuner de midi et sa gourde est restée au camion.\nAu milieu de la séance, il a très faim, transpire beaucoup, devient pâle et se sent très fatigué. Il ne dînera qu’à 21 h 30."}}, {"id": "ba_t2", "type": "analyse", "data": {"titre": "AVANT, PENDANT, APRÈS L’EFFORT"}}, {"id": "ba_doc4", "type": "document_texte_image", "data": {"label": "DOC. 4", "titre": "Repères pour manger et boire autour d’un entraînement", "cadre": true, "corps": "", "source": "D’après l’INSEP (fiches récupération, 2025) et l’Assurance Maladie (ameli.fr).", "image_w": 1600, "image_h": 630, "image_pos": "centre", "image_align": "centre", "image_largeur": 100, "image_taille": "pleine", "image_nom": "BIO_alimentation_effort_frise.png", "img": "images/capa_BIO_alimentation_effort_ba_doc4.jpg", "img_desc": "BIO_alimentation_effort_frise.png", "img_w": 1400, "img_h": 551}}, {"id": "ba_ch2_1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir de la situation et du document 4 :", "reponse_attendue": ""}}, {"id": "ba_q2_1", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "1.1", "texte": "**Comparer** ce qu’a mangé Jérôme avant sa séance au repère du document 4.", "points": "", "lignes": 3, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Jérôme n’a rien mangé depuis midi, soit 6 h 30 avant sa séance, sans collation. Le repère conseille, quand le repas a lieu plus de 5 h avant, une collation au moins 1 h avant l’entraînement.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Compléter** la comparaison : « Jérôme a déjeuné 6 h 30 avant sa séance, sans ……………………… . Le repère conseille une collation au moins ……………………… h avant l’entraînement. »\nMots à placer : collation · 1 · 3", "lignes": 0, "reponse_attendue": "collation · 1"}}, "absorber": false}, "el": {"standard": {"indice": "Situation : l’heure du dernier repas. DOC. 4 : le repère quand le repas a lieu plus de 5 h avant.", "explication": "Jérôme n’a rien mangé depuis midi, soit 6 h 30 avant sa séance, sans collation. Le repère conseille une collation au moins 1 h avant l’entraînement."}, "adapte": {"indice": "Situation : le dernier repas de Jérôme. DOC. 4 : le repère de la collation.", "explication": "Jérôme n’a pas pris de collation. Le repère conseille une collation au moins 1 h avant l’entraînement.", "trous": ["collation", "1|une|1 h|1h"]}}}, {"id": "ba_q2_1e", "type": "qcm", "data": {"competence": "CG2.2", "numero": "1.1", "titre": "", "consigne": "**Cocher** ce que Jérôme aurait dû faire avant sa séance.", "items": [{"question": "D’après le repère, Jérôme aurait dû :", "options": ["prendre une collation au moins 1 h avant la séance", "ne rien manger pour se sentir plus léger", "prendre un grand repas juste avant la séance"], "reponse": 0}], "niveaux": ["essentiel"]}, "el": {"standard": {"indice": "DOC. 4 : le repère quand le repas a lieu plus de 5 h avant.", "explication": "Le repère conseille une collation au moins 1 h avant la séance."}}}, {"id": "ba_q2_2", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "1.2", "texte": "**Indiquer** ce que Jérôme peut manger et boire après sa séance, puisqu’il ne dîne qu’à 21 h 30.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Une collation : un fruit, un produit laitier, des céréales ou du pain, et de l’eau.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Compléter** ce que Jérôme peut prendre : « Une ……………………… : un fruit, un produit ……………………… , du pain, et de l’eau. »\nMots à placer : collation · laitier · gras", "lignes": 0, "reponse_attendue": "collation · laitier"}}, "absorber": false}, "el": {"standard": {"indice": "DOC. 4 : le repère de l’après-séance.", "explication": "Une collation est conseillée : un fruit, un produit laitier, des céréales ou du pain, et de l’eau."}, "adapte": {"indice": "DOC. 4 : le repère de l’après-séance.", "explication": "Une collation : un fruit, un produit laitier, du pain, et de l’eau.", "trous": ["collation", "laitier|laitiers"]}}}, {"id": "ba_q2_2e", "type": "qcm", "data": {"competence": "CG2.2", "numero": "1.2", "titre": "", "consigne": "**Cocher** ce que Jérôme peut prendre après sa séance.", "items": [{"question": "Après la séance, en attendant le dîner de 21 h 30, Jérôme peut prendre :", "options": ["rien jusqu’au dîner", "une boisson énergisante seule", "un fruit, un produit laitier, du pain et de l’eau"], "reponse": 2}], "niveaux": ["essentiel"]}, "el": {"standard": {"indice": "DOC. 4 : le repère de l’après-séance.", "explication": "Après la séance : un fruit, un produit laitier, du pain et de l’eau."}}}, {"id": "ba_t3", "type": "analyse", "data": {"titre": "UN MALAISE PENDANT L’EFFORT"}}, {"id": "ba_doc5", "type": "document", "data": {"label": "DOC. 5", "titre": "Signes et correction d’un malaise", "cadre": true, "corps": "L’hypoglycémie est due à une baisse de sucre dans le sang. Elle est fréquente chez les personnes diabétiques. Elle se traduit par une fatigue, une sensation de faim, une irritabilité, des sueurs, des maux de tête, une vision floue, une pâleur et elle peut s’accompagner d’une baisse de la conscience. Pour corriger l’hypoglycémie, la personne doit consommer du sucre sans attendre (morceaux de sucre, boisson sucrée...). Si elle a perdu connaissance et respire normalement : la mettre en position latérale de sécurité et appeler le 15 ou le 112.", "source": "D’après l’Assurance Maladie, « Perte de connaissance », ameli.fr, 04/09/2024."}}, {"id": "ba_ch2_2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir de la situation et du document 5 :", "reponse_attendue": ""}}, {"id": "ba_q2_3", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "2.1", "texte": "**Identifier** le malaise auquel font penser les signes de Jérôme au milieu de la séance.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Un malaise hypoglycémique (par manque de sucre dans le sang), sans certitude.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Compléter** : « Ces signes font penser à un malaise ……………………… , par manque de ……………………… dans le sang. »\nMots à placer : hypoglycémique · sucre · cardiaque", "lignes": 0, "reponse_attendue": "hypoglycémique · sucre"}}, "absorber": false}, "el": {"standard": {"indice": "Situation : les signes de Jérôme. DOC. 5 : les signes de l’hypoglycémie.", "explication": "Faim, sueurs, pâleur et grande fatigue : ce sont des signes de l’hypoglycémie. Ces signes font penser à un malaise par manque de sucre dans le sang, sans certitude."}, "adapte": {"indice": "Situation : les signes de Jérôme. DOC. 5 : le début du texte.", "explication": "Les signes font penser à un malaise hypoglycémique, par manque de sucre dans le sang.", "trous": ["hypoglycémique|hypoglycemique|hypoglycémie|hypoglycemie", "sucre"]}}}, {"id": "ba_q2_3e", "type": "qcm", "data": {"competence": "CG2.2", "numero": "2.1", "titre": "", "consigne": "**Cocher** le malaise auquel font penser les signes de Jérôme.", "items": [{"question": "Les signes de Jérôme font penser à :", "options": ["une crampe", "un malaise par manque de sucre", "un coup de chaleur"], "reponse": 1}], "niveaux": ["essentiel"]}, "el": {"standard": {"indice": "DOC. 5 : les signes de l’hypoglycémie.", "explication": "Faim, sueurs, pâleur et fatigue : malaise par manque de sucre."}}}, {"id": "ba_doc6", "type": "document", "data": {"label": "DOC. 6", "titre": "L’eau", "cadre": true, "corps": "Tous les jours, nous en perdons une partie par les urines, la transpiration et la respiration (eau éliminée lors de l’expiration).\nSi vous ressentez le besoin de vous désaltérer, cela signifie que vous manquez déjà d’eau. Pour éviter d’être déshydraté(e), buvez sans attendre d’avoir soif.", "source": "Assurance Maladie, « L’eau », ameli.fr, 24/06/2024."}}, {"id": "ba_t4", "type": "analyse", "data": {"titre": "REVENIR À LA SITUATION : PROPOSER DES SOLUTIONS"}}, {"id": "ba_ch2_3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir de la situation et des documents 4 et 6 :", "reponse_attendue": ""}}, {"id": "ba_q2_4", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "3.1", "texte": "**Proposer** une mesure individuelle pour que Jérôme ne manque plus d’eau pendant sa séance.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Garder une gourde pleine avec lui et boire 3 à 4 gorgées d’eau toutes les 30 minutes, sans attendre d’avoir soif.", "indice": "", "reponse_allegee": "", "niveaux": ["standard"]}, "el": {"standard": {"indice": "DOC. 4 : le repère pour boire. DOC. 6 : la dernière phrase.", "explication": "Mesure individuelle : garder une gourde pleine et boire 3 à 4 gorgées d’eau toutes les 30 minutes, sans attendre d’avoir soif."}}}, {"id": "ba_q2_4a", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "3.1", "texte": "**Compléter** la mesure individuelle pour Jérôme : « Garder une ……………………… pleine et boire 3 à 4 ……………………… d’eau toutes les 30 minutes. »\nMots à placer : gourde · gorgées · litres", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "gourde · gorgées", "indice": "", "reponse_allegee": "", "niveaux": ["adapte"], "absorber": false}, "el": {"adapte": {"indice": "DOC. 4 : le repère pour boire.", "explication": "Garder une gourde pleine et boire 3 à 4 gorgées d’eau toutes les 30 minutes.", "trous": ["gourde", "gorgées|gorgee|gorgées d’eau|gorgees"]}}}, {"id": "ba_q2_4e", "type": "qcm", "data": {"competence": "CG2.2", "numero": "3.1", "titre": "", "consigne": "**Coc
