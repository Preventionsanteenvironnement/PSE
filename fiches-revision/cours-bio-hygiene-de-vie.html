<script>window.COURS = {"slug": "capa_BIO_hygiene_de_vie", "classe": "CAPa Jardinier paysagiste · Horticulture", "retour": "../index.html#capa-bio-hygiene-de-vie", "pied": "Biologie — Hygiène de vie : sommeil, santé mentale, risques du métier. CAPa. M. MECHERI. Sources indiquées sous chaque document.", "version": "2026-11-05", "entete": {"module_code": "MG2", "titre": "Hygiène de vie : sommeil, santé mentale, risques du métier", "niveau": "CAPa", "annee": "2026-2027", "thematique": "BIO · Biologie — Le corps à l’effort (CG2.2 · CCF4)", "objectif_general": "Être capable d’adopter une hygiène de vie qui protège sa santé : sommeil, soin des plaies, santé mentale, protection contre le bruit et les gaz d’échappement."}, "blocks": [{"id": "b_seance_01", "type": "seance", "data": {"numero": "1", "titre": "Le sommeil", "objectif": "1. Compter les cycles d’une nuit. 2. Expliquer l’effet des écrans sur l’endormissement. 3. Relever des conseils pour bien dormir.", "competences": ["CG2.2"]}}, {"id": "bh_sit1", "type": "situation", "data": {"source": "", "texte": "Jules, 23 ans, est ouvrier paysagiste. Il se lève à 6 h 15 pour être au dépôt à 6 h 45. Hier soir, il a joué en ligne sur son téléphone et s’est couché à 0 h 30. Sa collègue Agnès, 22 ans, se couche vers 22 h 30. Ce matin, sur le chantier, Jules a raté une marche en descendant du camion. Il pense qu’il « récupérera le week-end »."}}, {"id": "bh_t1", "type": "analyse", "data": {"titre": "LE SOMMEIL ET LA RÉCUPÉRATION"}}, {"id": "bh_doc1", "type": "document", "data": {"label": "DOC. 1", "titre": "Le sommeil de l’adulte", "cadre": true, "corps": "Le sommeil permet à l’organisme de récupérer, sur le plan physique comme mental. Une nuit est une succession de cycles de 90 minutes en moyenne ; une bonne nuit en compte au moins 3 à 5. En moyenne, un adulte devrait dormir entre 7 et 8 heures par nuit.\nLa mélatonine, produite dans l’obscurité, favorise l’endormissement. La lumière freine sa production : l’usage tardif des écrans retarde l’endormissement.\nDormir moins de 6 heures par nuit expose au risque de somnolence dans la journée et aux accidents.", "source": "D’après Inserm (2024) et Assurance Maladie (2020)."}}, {"id": "bh_doc2", "type": "document_texte_image", "data": {"label": "DOC. 2", "titre": "Les nuits d’Agnès et de Jules, du coucher au réveil", "cadre": true, "corps": "", "source": "", "image_w": 1600, "image_h": 512, "image_pos": "centre", "image_align": "centre", "image_largeur": 90, "image_taille": "pleine", "image_nom": "BIO_hygiene_de_vie_nuits.png", "img": "images/capa_BIO_hygiene_de_vie_bh_doc2.jpg", "img_desc": "BIO_hygiene_de_vie_nuits.png", "img_w": 1400, "img_h": 448}}, {"id": "bh_ch1_1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir des documents 1 et 2 :", "reponse_attendue": ""}}, {"id": "bh_q1_1", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "1.1", "texte": "**Compter** le nombre de cycles de sommeil complets d’Agnès et de Jules.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "lignes", "reponse_attendue": "– Agnès : 5 cycles.\n– Jules : 3 cycles.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase : « Agnès fait ……………………… cycles complets ; Jules fait ……………………… cycles complets. »", "lignes": 0, "reponse_attendue": "5 · 3"}, "essentiel": {"texte": "**Compléter** la phrase : « Agnès fait ……………………… cycles complets ; Jules fait ……………………… cycles complets. »", "lignes": 0, "reponse_attendue": "5 · 3"}}}, "el": {"standard": {"indice": "DOC. 2 : les deux nuits dessinées, un cycle après l’autre.", "explication": "Agnès fait 5 cycles complets. Jules en fait 3."}, "adapte": {"indice": "DOC. 2 : la nuit d’Agnès, puis la nuit de Jules. Compter les cycles complets.", "explication": "Agnès : 5 cycles complets. Jules : 3 cycles complets.", "trous": ["5|cinq", "3|trois"]}, "essentiel": {"indice": "DOC. 2 : la nuit d’Agnès, puis la nuit de Jules.", "expli elever les gestes de soin d’une plaie.", "competences": ["CG2.2"]}}, {"id": "bh_sit2", "type": "situation", "data": {"source": "", "texte": "En plantant un tuteur, Agnès, 22 ans, ouvrière paysagiste, se coupe la main à travers un gant usé. La plaie est petite mais pleine de terre. Elle la rince à l’eau de sa gourde, sans se laver les mains ni mettre de pansement, et veut reprendre le travail. Agnès ne sait plus quand elle a fait son dernier rappel contre le tétanos ; elle pense que c’était à 11 ans."}}, {"id": "bh_t2", "type": "analyse", "data": {"titre": "LE TÉTANOS"}}, {"id": "bh_doc4", "type": "document", "data": {"label": "DOC. 4", "titre": "Le tétanos", "cadre": true, "corps": "Le tétanos est une maladie grave, souvent mortelle sans une prise en charge lourde en réanimation. Il est dû à une toxine produite par une bactérie naturellement présente dans la terre. La contamination peut se faire par n’importe quelle blessure, coupure ou plaie banale.\nLa protection n’est réalisée que par la vaccination.", "source": "D’après Vaccination Info Service, « Tétanos », avril 2026."}}, {"id": "bh_ch2_1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir de la situation et du document 4 :", "reponse_attendue": ""}}, {"id": "bh_q2_1", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "1.1", "texte": "**Expliquer** pourquoi la petite coupure d’Agnès peut lui transmettre le tétanos.", "points": "", "lignes": 3, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "La bactérie du tétanos vit dans la terre : elle peut entrer par n’importe quelle coupure, même petite, et la plaie d’Agnès est pleine de terre.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Compléter** la phrase : « La bactérie du tétanos vit dans la ……………………… : elle peut entrer par n’importe quelle ……………………… , même petite. »\nMots à placer : terre · coupure · eau", "lignes": 0, "reponse_attendue": "terre · coupure"}}, "absorber": false}, "el": {"standard": {"indice": "DOC. 4 : où vit la bactérie, et par où elle entre. Situation : l’état de la plaie.", "explication": "La bactérie du tétanos vit dans la terre. Elle entre par n’importe quelle coupure, même petite. La plaie d’Agnès est pleine de terre."}, "adapte": {"indice": "DOC. 4 : le premier paragraphe.", "explication": "La bactérie du tétanos vit dans la terre. Elle entre par n’importe quelle coupure, même petite.", "trous": ["terre", "coupure|blessure|plaie"]}}}, {"id": "bh_q2_1e", "type": "qcm", "data": {"competence": "CG2.2", "numero": "1.1", "titre": "", "consigne": "**Cocher** la raison pour laquelle la coupure d’Agnès peut transmettre le tétanos.", "items": [{"question": "La petite coupure est dangereuse parce que :", "options": ["la bactérie du tétanos vit dans la terre et entre par n’importe quelle coupure", "le tétanos n’entre que par les plaies profondes", "le gant usé contient un poison"], "reponse": 0}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 4 : le premier paragraphe.", "explication": "La bactérie du tétanos vit dans la terre. Elle entre par n’importe quelle coupure, même petite."}}}, {"id": "bh_doc5", "type": "document_texte_image", "data": {"label": "DOC. 5", "titre": "Les rappels du vaccin contre le tétanos chez l’adulte", "cadre": true, "corps": "", "source": "D’après Vaccination Info Service, avril 2026.", "image_w": 1600, "image_h": 352, "image_pos": "centre", "image_align": "centre", "image_largeur": 85, "image_taille": "pleine", "image_nom": "BIO_hygiene_de_vie_rappels_tetanos.png", "img": "images/capa_BIO_hygiene_de_vie_bh_doc5.jpg", "img_desc": "BIO_hygiene_de_vie_rappels_tetanos.png", "img_w": 1400, "img_h": 308}}, {"id": "bh_ch2_2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir de la situation et du document 5 :", "reponse_attendue": ""}}, {"id": "bh_q2_2", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "2.1", "texte": "**Indiquer** l’âge du prochain rappel contre le tétanos d’Agnès.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "À 25 ans.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase : « Le prochain rappel d’Agnès est à ……………………… ans. »", "lignes": 0, "reponse_attendue": "25"}, "essentiel": {"texte": "**Compléter** la phrase : « Le prochain rappel d’Agnès est à ……………………… ans. »", "lignes": 0, "reponse_attendue": "25"}}}, "el": {"standard": {"indice": "DOC. 5 : la frise des rappels. Situation : le dernier rappel d’Agnès.", "explication": "Le dernier rappel d’Agnès date de 11 ans. Le rappel suivant, chez l’adulte, est à 25 ans."}, "adapte": {"indice": "DOC. 5 : la frise des rappels, le rappel qui suit celui de 11 ans.", "explication": "Le prochain rappel d’Agnès est à 25 ans.", "trous": ["25|25 ans|vingt-cinq|vingt cinq"]}, "essentiel": {"indice": "DOC. 5 : la frise des rappels, le rappel qui suit celui de 11 ans.", "explication": "Le prochain rappel d’Agnès est à 25 ans.", "trous": ["25|25 ans|vingt-cinq|vingt cinq"]}}}, {"id": "bh_doc6", "type": "document", "data": {"label": "DOC. 6", "titre": "Comment bien soigner une plaie ?", "cadre": true, "corps": "Avant de soigner une plaie, se laver les mains à l’eau et au savon.\nNettoyer la plaie : la rincer à l’eau claire, puis la laver à l’eau et au savon (suffisant si elle est superficielle).\nDésinfecter une plaie profonde ou étendue.\nProtéger la plaie avec un pansement adhésif ou une compresse stérile fixée par un sparadrap.\nSi la vaccination contre le tétanos n’est pas à jour, ou en cas de doute, consulter rapidement son médecin, surtout si la plaie est souillée de terre.", "source": "D’après Assurance Maladie, ameli.fr (« Soigner une plaie », août 2025 ; « Coupure cutanée ») et Vaccination Info Service."}}, {"id": "bh_ch2_3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir de la situation et du document 6 :", "reponse_attendue": ""}}, {"id": "bh_q2_3", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "3.1", "texte": "**Relever** deux gestes de soin qu’Agnès n’a pas faits.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "lignes", "reponse_attendue": "– Se laver les mains à l’eau et au savon.\n– Protéger la plaie avec un pansement.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase : « Se laver les ……………………… à l’eau et au savon ; protéger la plaie avec un ……………………… . »\nMots à placer : mains · pansement · garrot", "lignes": 0, "reponse_attendue": "mains · pansement"}, "essentiel": {"texte": "**Compléter** la phrase : « Se laver les ……………………… à l’eau et au savon ; protéger la plaie avec un ……………………… . »\nMots à placer : mains · pansement · garrot", "lignes": 0, "reponse_attendue": "mains · pansement"}}}, "el": {"standard": {"indice": "DOC. 6 : le premier geste, puis le dernier geste avant la consultation. Situation : ce qu’Agnès a fait.", "explication": "Agnès ne s’est pas lavé les mains à l’eau et au savon. Elle n’a pas protégé la plaie avec un pansement."}, "adapte": {"indice": "DOC. 6 : le premier geste et le geste de protection.", "explication": "Se laver les mains à l’eau et au savon. Protéger la plaie avec un pansement.", "trous": ["mains|main", "pansement"]}, "essentiel": {"indice": "DOC. 6 : le premier geste et le geste de protection. Un mot proposé ne sert pas.", "explication": "Se laver les mains à l’eau et au savon. Protéger la plaie avec un pansement.", "trous": ["mains|main", "pansement"]}}}, {"id": "bh_q2_4", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "3.2", "texte": "**Indiquer** ce qu’Agnès doit faire si elle n’est pas sûre d’être à jour de son vaccin.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Consulter rapidement son médecin.", "indice": "", "repons es qui doivent alerter. 2. Relier ces signes aux appuis de la santé mentale. 3. Indiquer vers qui se tourner.", "competences": ["CG2.2"]}}, {"id": "bh_sit3", "type": "situation", "data": {"source": "", "texte": "Depuis plusieurs semaines, Agnès trouve que Jules a changé : il reste à l’écart de l’équipe pendant les pauses, il a arrêté le foot du mercredi, il dort mal et il s’énerve pour un rien. Quand elle lui en parle, il répond qu’il est juste fatigué. Agnès ne sait pas quoi faire.", "image_w": 1536, "image_h": 1024, "image_pos": "centre", "image_align": "centre", "image_largeur": 55, "image_taille": "pleine", "image_nom": "BIO_hygiene_de_vie_pause_collegues.png", "img": "images/capa_BIO_hygiene_de_vie_bh_sit3.jpg", "img_desc": "BIO_hygiene_de_vie_pause_collegues.png", "img_w": 1400, "img_h": 933}}, {"id": "bh_t3", "type": "analyse", "data": {"titre": "PRENDRE SOIN DE SA SANTÉ MENTALE"}}, {"id": "bh_doc7", "type": "document", "data": {"label": "DOC. 7", "titre": "On a toutes et tous une santé mentale", "cadre": true, "corps": "Selon l’Organisation mondiale de la santé, la santé mentale est « un état de bien-être dans lequel une personne peut se réaliser, surmonter les tensions normales de la vie » […].\nPour en prendre soin : pratiquer une activité physique régulière ; manger équilibré ; bien dormir ; garder des liens avec ses proches ; parler de ses émotions et demander de l’aide.\nDes signes peuvent alerter, surtout s’ils sont inhabituels : changements d’appétit ou de sommeil, irritabilité inhabituelle, perte de motivation, difficultés de concentration.\nEn parler : à une personne de confiance, à son médecin traitant, à une ligne d’écoute. Avec Mon soutien psy, on prend rendez-vous directement avec un psychologue partenaire ; l’Assurance Maladie rembourse jusqu’à 12 séances par année civile. Le 3114, numéro national de prévention du suicide, est joignable à toute heure et gratuitement, par une personne en détresse ou par ses proches.", "source": "D’après sante.fr (juin 2026), ameli.fr (sept. 2026) et 3114.fr."}}, {"id": "bh_ch3_1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir de la situation et du document 7 :", "reponse_attendue": ""}}, {"id": "bh_q3_1", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "1.1", "texte": "**Classer** chaque changement de Jules selon l’appui de la santé mentale qu’il fragilise, en complétant le tableau.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Classer** chaque changement de Jules selon l’appui de la santé mentale qu’il fragilise, en cochant une case par ligne du tableau."}, "essentiel": {"texte": "**Classer** chaque changement de Jules selon l’appui de la santé mentale qu’il fragilise, en cochant une case par ligne du tableau."}}}, "el": {"standard": {"indice": "DOC. 7 : la liste des façons de prendre soin de sa santé mentale. Une ligne du tableau, un appui.", "explication": "Le foot arrêté : l’activité physique. Le mauvais sommeil : le sommeil. Le repli loin de l’équipe : le lien social."}, "adapte": {"indice": "DOC. 7 : la liste des façons de prendre soin de sa santé mentale.", "explication": "Le foot arrêté : l’activité physique. Le mauvais sommeil : le sommeil. Le repli loin de l’équipe : le lien social."}, "essentiel": {"indice": "DOC. 7 : la liste des façons de prendre soin de sa santé mentale.", "explication": "Le foot arrêté : l’activité physique. Le mauvais sommeil : le sommeil. Le repli loin de l’équipe : le lien social."}}}, {"id": "bh_tab3_1", "type": "tableau", "data": {"titre": "", "cells": [[{"type": "prof", "content": "Changement de Jules"}, {"type": "prof", "content": "Appui fragilisé"}], [{"type": "prof", "content": "Il a arrêté le foot du mercredi"}, {"type": "eleve", "content": "", "reponse": "L’activité physique."}], [{"type": "prof", "content": "Il dort mal"}, {"type": "eleve", "content": "", "reponse": "Le sommeil."}], [{"type": "prof", "content": "Il reste à l’écart de l’équipe pendant les pauses"}, {"type": "eleve", "content": "", "reponse": "Le lien social."}]], "table_preset": "pse", "table_border": "fine", "table_row_height": "compact", "table_col_widths": [50, 50], "table_student_style": "lines", "variantes": {"adapte": {"cells": [[{"type": "prof", "content": "Changement de Jules"}, {"type": "prof", "content": "Appui fragilisé"}], [{"type": "prof", "content": "Il a arrêté le foot du mercredi"}, {"type": "eleve", "content": "", "reponse": "L’activité physique.", "options": ["L’activité physique.", "Le sommeil."]}], [{"type": "prof", "content": "Il dort mal"}, {"type": "eleve", "content": "", "reponse": "Le sommeil.", "options": ["Le lien social.", "Le sommeil."]}], [{"type": "prof", "content": "Il reste à l’écart de l’équipe pendant les pauses"}, {"type": "eleve", "content": "", "reponse": "Le lien social.", "options": ["Le lien social.", "L’activité physique."]}]]}, "essentiel": {"cells": [[{"type": "prof", "content": "Changement de Jules"}, {"type": "prof", "content": "Appui fragilisé"}], [{"type": "prof", "content": "Il a arrêté le foot du mercredi"}, {"type": "eleve", "content": "", "reponse": "L’activité physique.", "options": ["L’activité physique.", "Le sommeil."]}], [{"type": "prof", "content": "Il dort mal"}, {"type": "eleve", "content": "", "reponse": "Le sommeil.", "options": ["Le lien social.", "Le sommeil."]}], [{"type": "prof", "content": "Il reste à l’écart de l’équipe pendant les pauses"}, {"type": "eleve", "content": "", "reponse": "Le lien social.", "options": ["Le lien social.", "L’activité physique."]}]]}}}}, {"id": "bh_q3_2", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "1.2", "texte": "**Relever** le changement de Jules qui correspond à un signe d’alerte du document 7, autre que le sommeil.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Il s’énerve pour un rien (irritabilité inhabituelle). Accepté aussi : il a arrêté le foot (perte de motivation).", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "absorber": false}, "el": {"standard": {"indice": "DOC. 7 : le paragraphe des signes qui alertent. Situation : ce qui change chez Jules, hors sommeil.", "explication": "Jules s’énerve pour un rien : c’est une irritabilité inhabituelle. L’arrêt du foot peut aussi se lire comme une perte de motivation."}, "adapte": {"indice": "DOC. 7 : le paragraphe des signes qui alertent.", "explication": "Jules s’énerve pour un rien : c’est une irritabilité inhabituelle. L’arrêt du foot est accepté aussi : perte de motivation."}}}, {"id": "bh_q3_2e", "type": "qcm", "data": {"competence": "CG2.2", "numero": "1.2", "titre": "", "consigne": "**Cocher** le changement de Jules qui correspond à un signe d’alerte du document 7.", "items": [{"question": "Un signe qui doit alerter :", "options": ["il s’énerve pour un rien", "il est fatigué après une longue journée", "il a faim à midi"], "reponse": 0}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 7 : le paragraphe des signes qui alertent.", "explication": "S’énerver pour un rien est une irritabilité inhabituelle : un signe d’alerte. Être fatigué après une longue journée n’est pas dans la liste."}}}, {"id": "bh_q3_3", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "1.3", "texte": "**Indiquer** deux personnes ou services vers qui Agnès peut conseiller à Jules de se tourner.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "lignes", "reponse_attendue": "– Son médecin traitant.\n– Un psychologue partenaire de Mon soutien psy (ou : une personne de confiance ; une ligne d’écoute).", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase : « Jules peut en parler à son médecin ……………………… ou à un ……………………… partenaire de Mon soutien psy. »\nMots à placer : traita on ou l’arrêt des activités peuvent alerter, surtout s’ils sont inhabituels.", "renvoi": "DOC. 7 — On a toutes et tous une santé mentale", "renvoi_bloc": "bh_doc7"}, {"accepte": [], "explication": "DOC. 7 : le lien social fait partie des façons de prendre soin de sa santé mentale.", "renvoi": "DOC. 7 — On a toutes et tous une santé mentale", "renvoi_bloc": "bh_doc7"}, {"accepte": [], "explication": "DOC. 7 : le 3114 est le numéro national de prévention du suicide, joignable à toute heure et gratuitement.", "renvoi": "DOC. 7 — On a toutes et tous une santé mentale", "renvoi_bloc": "bh_doc7"}, {"accepte": ["Mon soutien psy", "mon soutien psy", "Mon Soutien Psy"], "explication": "DOC. 7 : Mon soutien psy permet de prendre rendez-vous avec un psychologue partenaire. L’Assurance Maladie rembourse jusqu’à 12 séances par année civile.", "renvoi": "DOC. 7 — On a toutes et tous une santé mentale", "renvoi_bloc": "bh_doc7"}, {"accepte": ["L’activité physique", "L'activité physique", "activité physique", "le sommeil", "bien dormir", "manger équilibré", "l’alimentation équilibrée", "le sommeil", "dormir", "parler de ses émotions", "garder des liens avec ses proches"], "explication": "DOC. 7 : activité physique régulière, alimentation équilibrée, bon sommeil, liens avec les proches, parole sur ses émotions.", "renvoi": "DOC. 7 — On a toutes et tous une santé mentale", "renvoi_bloc": "bh_doc7"}]}}, {"id": "b_seance_04", "type": "seance", "data": {"numero": "4", "titre": "Le bruit et l’air du chantier", "objectif": "1. Repérer où le bruit abîme l’oreille. 2. Comparer une exposition au seuil de danger. 3. Proposer une mesure collective et une mesure individuelle.", "competences": ["CG2.2"]}}, {"id": "bh_sit4", "type": "situation", "data": {"source": "", "texte": "Pendant trois semaines, l’équipe débroussaille des talus. Jules et Aurélie, ouvriers paysagistes, utilisent chacun une débroussailleuse à moteur thermique, trois heures par jour ; au poste, le niveau sonore est de 95 dB(A). Ramenée à une journée de 8 heures, leur exposition moyenne au bruit est de 91 dB(A). Le moteur rejette ses gaz d’échappement près de leur visage. Un soir, Aurélie entend un sifflement dans les oreilles, qui disparaît le lendemain."}}, {"id": "bh_t4", "type": "analyse", "data": {"titre": "LE BRUIT ET L’OREILLE"}}, {"id": "bh_doc8", "type": "document_texte_image", "data": {"label": "DOC. 8", "titre": "Une coupe de l’oreille", "cadre": true, "corps": "", "source": "D’après Servier Medical Art, CC BY 4.0.", "image_w": 1540, "image_h": 992, "image_pos": "centre", "image_align": "centre", "image_largeur": 55, "image_taille": "pleine", "image_nom": "BIO_hygiene_de_vie_oreille_reperes.png", "img": "images/capa_BIO_hygiene_de_vie_bh_doc8.jpg", "img_desc": "BIO_hygiene_de_vie_oreille_reperes.png", "img_w": 1400, "img_h": 902}}, {"id": "bh_doc9", "type": "document", "data": {"label": "DOC. 9", "titre": "Le bruit et l’audition au travail", "cadre": true, "corps": "Dans l’oreille interne, la cochlée, un conduit enroulé en escargot, contient les cellules ciliées. Un bruit trop fort et trop long détruit peu à peu ces cellules : la surdité qui en résulte est irréversible.\nAprès une exposition à un bruit intense, des sifflements d’oreilles (acouphènes) et une fatigue auditive peuvent apparaître : c’est un signal d’alarme. Cette fatigue disparaît en général avec le repos si aucune nouvelle exposition ne survient ; des expositions répétées abîment l’oreille pour toujours.\nL’ouïe est en danger à partir d’une exposition moyenne de 80 dB(A) sur une journée de travail de 8 heures. Lorsque le risque ne peut pas être évité autrement, l’employeur met des protecteurs auditifs à disposition au-delà de 80 dB(A) d’exposition moyenne sur 8 heures ; à partir de 85 dB(A), il contrôle leur utilisation effective.", "source": "D’après INRS (2022), Code du travail, ameli (2025) et Manuels MSD (2025)."}}, {"id": "bh_ch4_1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir des documents 8 et 9 :", "reponse_attendue": ""}}, {"id": "bh_q4_1", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "1.1", "texte": "**Repérer** le numéro de la partie de l’oreille où se trouvent les cellules ciliées.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Le numéro 3 (la cochlée).", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "absorber": false}, "el": {"standard": {"indice": "DOC. 9 : le nom de la partie où se trouvent les cellules ciliées ; DOC. 8 : ce nom sur la coupe.", "explication": "Les cellules ciliées sont dans la cochlée, conduit enroulé en escargot de l’oreille interne. Sur la coupe, la cochlée porte le numéro 3."}, "adapte": {"indice": "DOC. 9 : le nom de la partie ; DOC. 8 : ce nom sur la coupe.", "explication": "Les cellules ciliées sont dans la cochlée. Sur la coupe, la cochlée porte le numéro 3."}}}, {"id": "bh_q4_1e", "type": "qcm", "data": {"competence": "CG2.2", "numero": "1.1", "titre": "", "consigne": "**Cocher** le numéro de la partie de l’oreille où se trouvent les cellules ciliées.", "items": [{"question": "Les cellules ciliées se trouvent dans la partie :", "options": ["numéro 1", "numéro 2", "numéro 3"], "reponse": 2}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 9 : le nom de la partie ; DOC. 8 : ce nom sur la coupe.", "explication": "Les cellules ciliées sont dans la cochlée. Sur la coupe, la cochlée porte le numéro 3."}}}, {"id": "bh_ch4_2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir de la situation et du document 9 :", "reponse_attendue": ""}}, {"id": "bh_q4_2", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "2.1", "texte": "**Comparer** l’exposition moyenne d’Aurélie au bruit au seuil à partir duquel l’ouïe est en danger.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "91 dB(A) en moyenne sur 8 heures, c’est au-dessus du seuil de 80 dB(A) : l’ouïe d’Aurélie est en danger.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Compléter** la phrase : « L’exposition moyenne d’Aurélie est de ……………………… dB(A) ; c’est au-dessus du seuil de ……………………… dB(A). »", "lignes": 0, "reponse_attendue": "91 · 80"}}, "absorber": false}, "el": {"standard": {"indice": "Situation : l’exposition moyenne d’Aurélie. DOC. 9 : le dernier paragraphe, le seuil de danger.", "explication": "L’exposition moyenne d’Aurélie est de 91 dB(A) sur 8 heures. Le seuil de danger est de 80 dB(A). 91 est supérieur à 80 : l’ouïe d’Aurélie est en danger."}, "adapte": {"indice": "Situation : l’exposition moyenne. DOC. 9 : le seuil de danger.", "explication": "L’exposition moyenne d’Aurélie est de 91 dB(A). Le seuil de danger est de 80 dB(A).", "trous": ["91|91 dB(A)|91 db", "80|80 dB(A)|80 db"]}}}, {"id": "bh_q4_2e", "type": "qcm", "data": {"competence": "CG2.2", "numero": "2.1", "titre": "", "consigne": "**Cocher** la comparaison exacte.", "items": [{"question": "L’exposition moyenne d’Aurélie, 91 dB(A) sur 8 heures, est :", "options": ["au-dessus du seuil de danger de 80 dB(A)", "en dessous du seuil de danger de 80 dB(A)", "égale au seuil de danger de 80 dB(A)"], "reponse": 0}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "Situation : 91 dB(A). DOC. 9 : le seuil de 80 dB(A).", "explication": "91 dB(A) est supérieur au seuil de danger de 80 dB(A). L’exposition d’Aurélie est trop forte."}}}, {"id": "bh_q4_3", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "2.2", "texte": "**Expliquer** pourquoi le sifflement d’Aurélie doit l’alerter.", "points": "", "lignes": 3, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "C’est un acouphène, signal d’alarme de fatigue auditive : si l’exposition au bruit se répète, ses cellules ciliées seront détruites et la surdité sera irréversible.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Compléter** la phrase : « Ce sifflement est un ……………………… : si le bruit se répète, les cellules ……………………… sont détruites et la surdité est irréversible. »\nMots à placer : acouphène · ciliées · crampe", "lignes": 0, "reponse_attendue": "acouphène · ciliées"}}, "absorber": false}, "el": {"standard": {"indice": "DOC. 9 : le deuxième paragraphe, le sifflement ; le premier, ce que le bruit détruit.", "explication": "Le sifflement est un acouphène, signal d’alarme de fatigue auditive. Si l’exposition se répète, les cellules ciliées sont détruites et la surdité est irréversible."}, "adapte": {"indice": "DOC. 9 : le premier et le deuxième paragraphe.", "explication": "Le sifflement est un acouphène. Si le bruit se répète, les cellules ciliées sont détruites et la surdité est irréversible.", "trous": ["acouphène|acouphene|acouphènes|acouphenes", "ciliées|ciliees|cilié|cilie"]}}}, {"id": "bh_q4_3e", "type": "qcm", "data": {"competence": "CG2.2", "numero": "2.2", "titre": "", "consigne": "**Cocher** la raison pour laquelle le sifflement doit alerter Aurélie.", "items": [{"question": "Le sifflement doit alerter Aurélie parce que :", "options": ["si le bruit se répète, ses cellules ciliées seront détruites pour toujours", "il annonce un rhume", "il prouve que ses oreilles s’habituent au bruit"], "reponse": 0}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 9 : le premier et le deuxième paragraphe.", "explication": "Le sifflement est un signal d’alarme. Si le bruit se répète, les cellules ciliées sont détruites pour toujours."}}}, {"id": "bh_t5", "type": "analyse", "data": {"titre": "REVENIR À LA SITUATION : PROPOSER DES SOLUTIONS"}}, {"id": "bh_doc10", "type": "document", "data": {"label": "DOC. 10", "titre": "Une solution testée dans l’entretien des espaces verts", "cadre": true, "corps": "Les moteurs thermiques des taille-haies et des débroussailleuses sont proches de la tête de l’utilisateur. Leurs gaz d’échappement contiennent notamment du monoxyde de carbone, des oxydes d’azote et des composés organiques volatils.\nDans une entreprise, les machines thermiques ont été remplacées par des machines électriques, avec des batteries de grande capacité. Il n’y a plus de gaz d’échappement au poste de travail, et les nuisances sonores ont diminué. Le risque électrique doit alors être pris en compte.", "source": "D’après INRS, fiche n° 96 (2025) et ED 6246 (2021)."}}, {"id": "bh_ch4_3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir de la situation et des documents 9 et 10 :", "reponse_attendue": ""}}, {"id": "bh_q4_4", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "3.1", "texte": "**Proposer** une mesure collective que l’employeur peut prendre pour réduire le bruit et les gaz d’échappement au poste de débroussaillage.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Remplacer les débroussailleuses thermiques par des débroussailleuses électriques à batterie.", "indice": "", "reponse_allegee": "", "niveaux": ["standard"]}, "el": {"standard": {"indice": "DOC. 10 : les machines changées dans l’entreprise.", "explication": "Mesure collective de l’employeur : remplacer les débroussailleuses thermiques par des débroussailleuses électriques à batterie. Il n’y a plus de gaz d’échappement et le bruit diminue."}}}, {"id": "bh_q4_4a", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "3.1", "texte": "**Compléter** la mesure collective : « L’employeur remplace les débroussailleuses ……………………… par des débroussailleuses ……………………… à batterie. »\nMots à placer : thermiques · électriques · lourdes", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "thermiques · électriques", "indice": "", "reponse_allegee": "", "niveaux": ["adapte"], "absorber": false}, "el": {"adapte": {"indice": "DOC. 10 : les machines changées dans l’entreprise.", "explication": "L’employeur remplace les débroussailleuses thermiques par des débroussailleuses électriques à batterie.", "trous": ["thermiques|thermique", "électriques|electriques|électrique|electrique"]}}}, {"id": "bh_q4_4e", "type": "qcm", "data": {"competence": "CG2.2", "numero": "3.1", "titre": "", "consigne": "**Cocher** la mesure collective que l’employeur peut prendre.", "items": [{"question": "Pour réduire le bruit et les gaz d’échappement, l’employeur :", "options": ["remplace les débroussailleuses thermiques par des machines électriques à batterie", "fournit des bouchons d’oreilles à chacun", "allonge la durée du débroussaillage pour finir plus vite"], "reponse": 0}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 10 : les machines changées dans l’entreprise.", "explication": "Mesure collective : remplacer les débroussailleuses thermiques par des machines électriques à batterie. Les bouchons d’oreilles sont une mesure individuelle."}}}, {"id": "bh_q4_5", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "3.2", "texte": "**Proposer** une mesure individuelle pour qu’Aurélie protège son audition.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Porter des bouchons d’oreilles (ou un casque antibruit) pendant tout le débroussaillage.", "indice": "", "reponse_allegee": "", "niveaux": ["standard"]}, "el": {"standard": {"indice": "DOC. 9 : le dernier paragraphe, les protecteurs auditifs.", "explication": "Mesure individuelle : porter des bouchons d’oreilles, ou un casque antibruit, pendant tout le débroussaillage."}}}, {"id": "bh_q4_5a", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "3.2", "texte": "**Compléter** la mesure individuelle : « Aurélie porte des ……………………… d’oreilles pendant ……………………… le débroussaillage. »\nMots à placer : bouchons · tout · une partie", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "bouchons · tout", "indice": "", "reponse_allegee": "", "niveaux": ["adapte"], "absorber": false}, "el": {"adapte": {"indice": "DOC. 9 : le dernier paragraphe, les protecteurs auditifs.", "explication": "Aurélie porte des bouchons d’oreilles pendant tout le débroussaillage.", "trous": ["bouchons|bouchon", "tout|toute la durée|tout le temps"]}}}, {"id": "bh_q4_5e", "type": "qcm", "data": {"competence": "CG2.2", "numero": "3.2", "titre": "", "consigne": "**Cocher** la mesure individuelle qui protège l’audition d’Aurélie.", "items": [{"question": "Pour protéger son audition, Aurélie :", "options": ["porte des bouchons d’oreilles pendant tout le débroussaillage", "met des bouchons seulement quand le bruit la gêne", "écoute de la musique au casque pour couvrir le bruit"], "reponse": 0}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 9 : le dernier paragraphe, les protecteurs auditifs.", "explication": "Aurélie porte des bouchons d’oreilles pendant tout le débroussaillage. Les mettre seulement par moments ne protège pas assez."}}}, {"id": "b_noti_04", "type": "notions", "data": {"items": [{"notion": "Cellules ciliées", "definition": "Cellules de l’oreille interne, détruites par le bruit, qui ne se réparent pas."}, {"notion": "Acouphène", "definition": "Sifflement ou bourdonnement dans les oreilles après un bruit fort."}, {"notion": "Décibel", "definition": "Unité du niveau sonore, notée dB(A)."}, {"notion": "Protection auditive", "definition": "Bouchons ou casque, fournis par l’employeur, portés pendant tout le bruit."}], "variantes": {"essentiel": {"items": [{"notion": "Cellules ciliées", "definition": "Les cellules de l’oreille qui ne repoussent pas."}, {"notion": "Acouphène", "definition": "Un sifflement dans les oreilles."}, {"notion": "Décibel", "definition": "L’unité du bruit."}, {"notion": "Protection auditive", "definition": "Bouchons ou casque."}]}}}}, {"id": "b_auto_04", "type"
