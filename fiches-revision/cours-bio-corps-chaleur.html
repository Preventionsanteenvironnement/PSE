g arrive près de la surface de la peau.\nLes glandes sudoripares produisent la sueur. Chacune est formée d’un tube enroulé en pelote, situé dans la peau, prolongé par un canal jusqu’à un orifice à la surface de la peau : le pore. La sueur est faite surtout d’eau et de sels minéraux.\nEn s’évaporant, la sueur refroidit la peau. L’humidité de l’air diminue l’évaporation de la sueur.", "source": "D’après Manuels MSD (2026), INRS (2024) et Société française de dermatologie."}}, {"id": "bc_doc2", "type": "document_texte_image", "data": {"label": "DOC. 2", "titre": "Une coupe de la peau", "cadre": true, "corps": "", "source": "D’après Servier Medical Art, CC BY 4.0.", "image_w": 1540, "image_h": 1168, "image_pos": "centre", "image_align": "centre", "image_largeur": 50, "image_taille": "pleine", "image_nom": "BIO_corps_chaleur_peau_reperes.png", "img": "images/capa_BIO_corps_chaleur_bc_doc2.jpg", "img_desc": "BIO_corps_chaleur_peau_reperes.png", "img_w": 1400, "img_h": 1062}}, {"id": "bc_ch1_1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir des documents 1 et 2 :", "reponse_attendue": ""}}, {"id": "bc_q1_1", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "1.1", "texte": "**Nommer** les éléments numérotés 1, 2 et 3 sur la coupe de la peau.", "points": "", "lignes": 3, "style_lignes": "tirets_comptage", "support_type": "lignes", "reponse_attendue": "– 1 : une glande sudoripare.\n– 2 : un pore.\n– 3 : un vaisseau sanguin.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Compléter** la phrase : « 1 est une glande ……………………… ; 2 est un ……………………… ; 3 est un vaisseau ……………………… . »\nMots à placer : sudoripare · pore · sanguin · poil", "lignes": 0, "reponse_attendue": "sudoripare · pore · sanguin"}}}, "el": {"standard": {"indice": "DOC. 1 : la description des glandes, du pore et des vaisseaux. DOC. 2 : les numéros sur la coupe.", "explication": "1 : une glande sudoripare. 2 : u  haie le long d’une route ; il fait 33 °C. Sur ce chantier, il n’y a ni arbre ni point d’eau. La bouteille d’Antoine, 34 ans, ouvrier paysagiste, est vide depuis midi. Vers 16 heures, Antoine a mal à la tête et des nausées. Sa peau est rouge, chaude et sèche : il ne transpire plus. Il répond à côté quand Lola lui parle.", "image_w": 1536, "image_h": 1024, "image_pos": "centre", "image_align": "centre", "image_largeur": 55, "image_taille": "pleine", "image_nom": "BIO_corps_chaleur_chantier.png", "img": "images/capa_BIO_corps_chaleur_bc_sit2.jpg", "img_desc": "BIO_corps_chaleur_chantier.png", "img_w": 1400, "img_h": 933}}, {"id": "bc_t2", "type": "analyse", "data": {"titre": "LES SIGNAUX D’ALERTE"}}, {"id": "bc_doc4", "type": "document", "data": {"label": "DOC. 4", "titre": "Quand la chaleur devient dangereuse", "cadre": true, "corps": "Le coup de chaleur est une urgence vitale. Ses signes : température du corps élevée, souvent supérieure à 39 °C ; pouls et respiration rapides ; maux de tête, nausées ou vomissements ; peau rouge et chaude, souvent sèche (pendant un effort, la victime peut encore transpirer) ; confusion, comportement inhabituel, parfois perte de connaissance. L’absence de certains signes ne doit pas retarder la prise en charge.\nConduite à tenir : alerter immédiatement les secours (15 ou 112). Si la victime est consciente : la placer à l’ombre ou dans un endroit frais et aéré, lui retirer des vêtements, la rafraîchir sans attendre avec de l’eau froide ; lui faire boire de petites quantités d’eau fraîche seulement si elle n’est pas confuse et peut avaler normalement. Si elle a perdu connaissance et respire normalement : la mettre en position latérale de sécurité et la surveiller jusqu’à l’arrivée des secours ; si elle ne respire pas normalement, suivre les instructions des secours (réanimation).", "source": "D’après INRS (2024), Manuels MSD (coup de chaleur) et Croix-Rouge française."}}, {"id": "bc_ch2_1", "type": "question_chapeau", "data": {"numero": oine est un signe grave.", "points": "", "lignes": 3, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Antoine ne transpire plus : sa peau n’est plus refroidie par l’évaporation de la sueur, et la température de son corps risque de monter.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Compléter** la phrase : « Antoine ne ……………………… plus : sa peau n’est plus refroidie par l’évaporation de la sueur, et la température de son corps risque de ……………………… . »\nMots à placer : transpire · monter · baisser", "lignes": 0, "reponse_attendue": "transpire · monter"}}, "absorber": false}, "el": {"standard": {"indice": "Situation : la peau d’Antoine. DOC. 1 : ce qui refroidit la peau.", "explication": "Antoine ne transpire plus. Sa peau n’est plus refroidie par l’évaporation de la sueur. La température de son corps risque de monter."}, "adapte": {"indice": "Situation : la peau d’Antoine. Un mot proposé ne sert pas.", "explication": "Antoine ne transpire plus : la température de son corps risque de monter.", "trous": ["transpire", "monter"]}}}, {"id": "bc_q2_2e", "type": "qcm", "data": {"competence": "CG2.2", "numero": "1.2", "titre": "", "consigne": "**Cocher** la phrase qui explique pourquoi la peau sèche d’Antoine est grave.", "items": [{"question": "La peau sèche d’Antoine est grave parce que :", "options": ["il a trop transpiré le matin", "il ne transpire plus : la sueur ne refroidit plus sa peau", "sa peau a pris un coup de soleil"], "reponse": 1}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "Situation : la peau d’Antoine. DOC. 1 : ce que fait la sueur.", "explication": "Antoine ne transpire plus. La sueur ne refroidit plus sa peau."}}}, {"id": "bc_q2_3", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "1.3", "texte": "**Indiquer** le premier geste à faire pour aider Antoine.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "  un couvre-chef qui protège la nuque, les oreilles et le front.\nPermettre des pauses plus fréquentes, plus longues, dans des lieux frais et ombragés.\nÉviter le travail isolé, pour que chacun surveille ses collègues.", "source": "D’après INRS, « Périodes de forte chaleur », avril 2024."}}, {"id": "bc_ch2_2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir de la situation et du document 5 :", "reponse_attendue": ""}}, {"id": "bc_q2_4", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "2.1", "texte": "**Proposer** une mesure collective que l’employeur peut prendre pour éviter un nouveau coup de chaleur sur ce chantier.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Installer une source d’eau potable fraîche près du chantier (ou : une zone de pause à l’ombre ; des horaires aux heures les moins chaudes).", "indice": "", "reponse_allegee": "", "niveaux": ["standard"]}, "el": {"standard": {"indice": "DOC. 5 : les mesures qui concernent tout le chantier ; situation : ni arbre ni point d’eau.", "explication": "Une mesure collective : installer une source d’eau potable fraîche près du chantier, ou une zone de pause à l’ombre, ou des horaires aux heures les moins chaudes."}}}, {"id": "bc_q2_4a", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "2.1", "texte": "**Compléter** la mesure collective : « L’employeur installe une source d’eau potable ……………………… près du chantier et une zone de pause à l’……………………… . »\nMots à placer : fraîche · ombre · soleil", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "fraîche · ombre", "indice": "", "reponse_allegee": "", "niveaux": ["adapte"], "absorber": false}, "el": {"adapte": {"indice": "DOC. 5 : les mesures de l’employeur ; situation : ni arbre ni point d’eau. Un mot proposé ne sert pas.", "explication": "L’employeur installe une source d’eau potable fraîche près du
