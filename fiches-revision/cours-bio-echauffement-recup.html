de la fréquence cardiaque de Sandrine.", "items": [{"question": "Pendant les dix minutes, la fréquence cardiaque de Sandrine :", "options": ["augmente d’un coup, puis reste stable", "augmente progressivement", "diminue progressivement"], "reponse": 1}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 1 : la courbe monte-t-elle d’un coup, doucement ou descend-elle ?", "explication": "La fréquence cardiaque augmente progressivement pendant les dix minutes."}}}, {"id": "be_doc2", "type": "document", "data": {"label": "DOC. 2", "titre": "Les conseils pour s’échauffer et le risque de déchirure", "cadre": true, "corps": "Respectez toujours un échauffement : 5 à 10 minutes d’activités cardiorespiratoires et musculaires progressives d’intensité légère à modérée et de mouvements d’assouplissement. L’échauffement permet au corps de se préparer à l’activité physique et réduit le risque de blessure.\n[…] Le risque de déchirure musculaire […] est majoré par certains facteurs : une insuffisance de la préparation musculaire par échauffement et étirements ; […] une action excessive ou brutale […].", "source": "D’après l’Assurance Maladie, ameli.fr, pages consultées le 28/10/2026."}}, {"id": "be_ch1_2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir de la situation et du document 2 :", "reponse_attendue": ""}}, {"id": "be_q1_2", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "2.1", "texte": "**Expliquer** ce qui a pu favoriser la blessure d’Olivier, et pas celle de Sandrine.", "points": "", "lignes": 3, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Olivier a commencé par un effort brutal, sans échauffement : cela augmente le risque de déchirure. Sandrine s’est échauffée progressivement pendant dix minutes.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Compléter** ce qui a pu favoriser la blessure d’Olivier : « Il n’a pas fait d’ ère, le corps produit de la chaleur et transpire.\nSi vous ressentez une douleur, un mal-être ou une fatigue excessive, arrêtez l’exercice en cours.\nSignalez rapidement à votre médecin tout symptôme survenant lors de l’effort ou après : douleur dans la poitrine ; essoufflement anormal ; palpitation cardiaque ; malaise.", "source": "D’après le DA du module MG2 (2015), les Manuels MSD, l’INRS et l’Assurance Maladie (ameli.fr)."}}, {"id": "be_ch1_3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir de la situation et du document 3 :", "reponse_attendue": ""}}, {"id": "be_q1_3", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "3.1", "texte": "**Classer** les sensations de Sandrine en sensations internes ou externes, en complétant le tableau.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Cocher**, pour chaque sensation de Sandrine, la case « Interne » ou « Externe »."}, "essentiel": {"texte": "**Cocher**, pour chaque sensation de Sandrine, la case « Interne » ou « Externe »."}}}, "el": {"standard": {"indice": "DOC. 3 : la première phrase, sensations internes et sensations externes.", "explication": "Interne, venue du corps : la chaleur du corps, le cœur qui bat vite. Externe, venue de l’environnement : la musique forte de la salle, la barre froide sous les mains."}, "adapte": {"indice": "DOC. 3 : la première phrase. Interne : du corps. Externe : de l’environnement.", "explication": "Interne : la chaleur du corps, le cœur qui bat vite. Externe : la musique forte, la barre froide."}, "essentiel": {"indice": "DOC. 3 : la première phrase. Interne : du corps. Externe : autour du corps.", "explication": "Interne : la chaleur du corps, le cœur qui bat vite. Externe : la musique forte, la barre froide."}}}, {"id": "be_tab1_3", "type": "tableau", "data": {"titre": "", "cells": [[{"type": "prof", "conten ements par minute. Fin de la pause : environ 112 battements par minute."}, "adapte": {"indice": "DOC. 4 : le sommet de la série 1, puis le bas de la pause qui suit.", "explication": "Fin de la série 1 : environ 148. Fin de la pause : environ 112.", "trous": ["148|environ 148|145|146|147|149|150", "112|environ 112|110|111|113|114|115"]}, "essentiel": {"indice": "DOC. 4 : le sommet de la série 1, puis le bas de la pause qui suit.", "explication": "Fin de la série 1 : environ 148. Fin de la pause : environ 112.", "trous": ["148|environ 148|145|146|147|149|150", "112|environ 112|110|111|113|114|115"]}}}, {"id": "be_doc5", "type": "document", "data": {"label": "DOC. 5", "titre": "Les conseils de récupération après un effort", "cadre": true, "corps": "La récupération fait partie intégrante de l’entraînement et de la compétition. […] L’objectif est de restaurer ses capacités après un effort. Bien dormir, bien manger et bien s’hydrater sont essentiels pour récupérer quotidiennement. […] Une routine individuelle de récupération doit être élaborée avec des professionnels de la récupération.\nEn fin d’activité physique, une récupération de 10 minutes permet à la fréquence cardiaque de redescendre vers sa valeur de repos […]. « Je bois 3 à 4 gorgées d’eau toutes les 30 min d’exercice […] »\nLes courbatures sont en fait dues à des microlésions musculaires qui apparaissent au cours de l’effort, la douleur survenant ensuite, plusieurs heures à quelques jours après.\nLe sommeil joue un rôle dans la mémoire et la récupération. Il est habituellement recommandé de dormir au moins 7 heures par jour.", "source": "D’après l’INSEP (fiches récupération, 2025), l’Assurance Maladie (ameli.fr) et l’Inserm."}}, {"id": "be_ch2_2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir de la situation et des documents 4 et 5 :", "reponse_attendue": ""}}, {"id": "be_q2_2", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "2.1", "texte": "**Expliquer** à quoi sert
