<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SESG — Le ménage et ses revenus — et si… ? · CAPa Jardinier paysagiste · Horticulture · PSE</title>
<meta name="description" content="Cinq scénarios : prédire puis calculer ce qui arrive au total des ressources et à la part du travail (CAPa).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --fond1:#0F3D36; --fond2:#1D5E50; --clair:#F4F8F5; --encre:#13302A; --doux:#5B7A71;
  --jaune:#FFD23F; --vrai:#2FBF71; --vrai-f:#16733F; --faux:#FF6B57; --faux-f:#B3261E;
  --act:#2FBF71; --cap:#5AB0E6; --tra:#FFD23F; --ligne:rgba(255,255,255,.22);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--clair);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:1.08rem;line-height:1.5;
  background:radial-gradient(1200px 600px at 15% -10%,rgba(255,210,63,.13),transparent 60%),radial-gradient(900px 700px at 110% 110%,rgba(120,220,180,.14),transparent 60%),linear-gradient(160deg,var(--fond1),var(--fond2));background-attachment:fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--jaune);outline-offset:3px}
.page{max-width:920px;margin:0 auto;padding:1.4rem 1.1rem 3rem}
header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(2rem,6vw,3rem);line-height:1;margin:0;letter-spacing:-.01em}
header p{margin:.45rem 0 0;opacity:.85;max-width:60ch}

/* Situation de départ */
.depart{margin:1.3rem 0;background:rgba(255,255,255,.07);border:2px solid var(--ligne);border-radius:22px;padding:1rem 1.1rem}
.depart h2{font-size:1rem;margin:0 0 .5rem;opacity:.85}
.chiffres{display:flex;gap:1.4rem;flex-wrap:wrap;margin-bottom:.6rem}
.chiffres div{font-variant-numeric:tabular-nums}
.chiffres b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.7rem;line-height:1.1}
.chiffres small{opacity:.8}

.barre{display:flex;height:40px;border-radius:12px;overflow:hidden;border:2px solid rgba(0,0,0,.5);background:rgba(255,255,255,.1)}
.barre span{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.barre .act{background:var(--act);color:#062313}.barre .cap{background:var(--cap);color:#061C2A}.barre .tra{background:var(--tra);color:#2A2200}
.legende{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin-top:.5rem;font-size:.9rem;opacity:.9}
.legende i{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:.35rem}

/* Cartes scénario */
.scenarios{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem}
.sc{position:relative;text-align:left;border:2px solid var(--ligne);background:rgba(255,255,255,.07);border-radius:18px;padding:.9rem .9rem 1rem;min-height:120px;display:flex;flex-direction:column;gap:.3rem;transition:transform .15s,background .15s}
.sc:hover{transform:translateY(-3px);background:rgba(255,255,255,.13)}
.sc[aria-current="true"]{background:var(--clair);color:var(--encre);border-color:var(--clair)}
.sc .emo{font-size:1.8rem;line-height:1}
.sc .t{font-weight:700;line-height:1.2}
.sc .etat{position:absolute;top:.6rem;right:.7rem;font-weight:700;color:var(--vrai)}
.sc[aria-current="true"] .etat{color:var(--vrai-f)}
.titreSec{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.5rem;margin:1.6rem 0 .7rem}

/* Panneau scénario */
.panneau{margin-top:1.3rem;background:var(--clair);color:var(--encre);border-radius:24px;padding:clamp(1.1rem,3.5vw,1.8rem);box-shadow:0 30px 60px -25px rgba(0,0,0,.6)}
.evt{display:flex;gap:.9rem;align-items:flex-start}
.evt .emo{font-size:2.6rem;line-height:1}
.evt h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1.4rem,4vw,1.9rem);margin:0;line-height:1.15}
.evt p{margin:.3rem 0 0;font-size:1.12rem}
.tabWrap{overflow-x:auto;margin:1rem 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:440px}
th{background:#E0E8E3;text-align:left;padding:.45rem .6rem;border:1px solid #A9B5AE;font-size:.9rem}
td{padding:.5rem .6rem;border:1px solid #C5CEC9}
td.n,th.n{text-align:right;white-space:nowrap}
tr.total td{font-weight:700;background:#EBF0ED}
tr.suppr td{color:#8A958F;text-decoration:line-through}
tr.change td,tr.nouv td{background:#FFF4C2}
.badge{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:.05rem .5rem;margin-left:.4rem;text-decoration:none;vertical-align:middle}
.badge.n{background:#16733F;color:#fff}.badge.m{background:#E0A800;color:#2A2200}.badge.s{background:#B3261E;color:#fff}
del{color:#8A958F;margin-right:.4rem}
.tag{display:inline-block;border-radius:999px;padding:.05rem .55rem;font-weight:700;font-size:.82rem}
.tag.act{background:#CDEFDC;color:#0F5530}.tag.cap{background:#D3E9F8;color:#0F3E5E}.tag.tra{background:#FFF0B3;color:#5A4500}
.trou{color:#8A958F}

.etape{border-top:2px solid #DDE4E0;padding-top:1rem;margin-top:.4rem}
.num{font-weight:700;color:var(--doux);font-size:.95rem}
.consigne{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(1.2rem,3.2vw,1.45rem);line-height:1.25;margin:.2rem 0 .8rem}
.consigne b{font-weight:800;color:#8A6A00}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.opt{border:2px solid #B9C5BE;background:#fff;border-radius:16px;padding:.8rem .5rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:.2rem}
.opt span{font-size:1.6rem;line-height:1}
.opt:hover{border-color:var(--encre)}
.saisie{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.saisie input{flex:1 1 140px;min-width:0;height:56px;border-radius:14px;border:3px solid var(--encre);background:#fff;color:var(--encre);font-size:1.4rem;font-weight:700;padding:0 .8rem;font-variant-numeric:tabular-nums}
.saisie span{font-weight:700}
.valider,.continuer{height:56px;border-radius:999px;border:0;background:var(--encre);color:var(--clair);font-weight:700;font-size:1.1rem;padding:0 1.4rem}
.continuer{width:100%;margin-top:.8rem}
.fb{margin-top:.8rem;border-radius:14px}
.fb:not(:empty){padding:.7rem .9rem}
.fb.ok{background:#DDF4E7;border-left:6px solid var(--vrai-f)}
.fb.ko{background:#FFE3DE;border-left:6px solid var(--faux-f)}
.fb.ind{background:#FFF4C2;border-left:6px solid #E0A800}
.fb.neutre{background:#EAF0EC;border-left:6px solid var(--doux)}
.outils{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.8rem}
.outil{border:2px solid #B9C5BE;background:transparent;border-radius:999px;padding:.3rem .8rem;font-size:.95rem;font-weight:700}
.calc{margin-top:.8rem;background:#E7EEEA;border-radius:16px;padding:.7rem;max-width:360px}
.calc[hidden]{display:none}
.ecran{background:#fff;border-radius:10px;padding:.4rem .7rem;text-align:right;font-size:1.35rem;font-weight:700;min-height:2.2rem;overflow-x:auto;white-space:nowrap}
.touches{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;margin-top:.5rem}
.touches button{height:46px;border-radius:10px;border:0;background:#fff;font-weight:700;font-size:1.15rem}
.touches .op{background:#FFF0B3}.touches .eg{background:var(--jaune)}.touches .large{grid-column:span 2}

/* Résultat */
.compare{display:grid;gap:.8rem;margin:1rem 0}
.compare .lab{display:flex;justify-content:space-between;gap:.6rem;font-weight:700;margin-bottom:.3rem;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.compare .barre{border-color:#13302A}
.predits{display:grid;gap:.5rem;margin:.8rem 0}
.pred{border-radius:14px;padding:.6rem .8rem;font-weight:700}
.pred.ok{background:#DDF4E7}.pred.ko{background:#FFE3DE}
.pred small{display:block;font-weight:400}
.retenir{border:3px solid var(--encre);border-radius:16px;padding:.8rem 1rem;margin-top:.8rem}
.retenir b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.1rem}

.bilan{margin-top:1.4rem;background:var(--clair);color:var(--encre);border-radius:24px;padding:clamp(1.1rem,3.5vw,1.8rem);border-top:10px solid var(--vrai)}
.bilan h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.8rem;margin:0 0 .4rem}
.bilan ol{padding-left:1.3rem;margin:.6rem 0 0}
.bilan li{margin-bottom:.5rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:520px){.opts{grid-template-columns:1fr}.opt{flex-direction:row;justify-content:flex-start;gap:.6rem}}
@media (prefers-reduced-motion:reduce){.barre span,.sc{transition:none}}

.fil{margin:0 0 .7rem}
.fil a{color:var(--clair);opacity:.85;text-decoration:underline;text-underline-offset:4px;font-size:1rem;padding:.35rem .1rem;display:inline-block}
.fil a:hover{opacity:1}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Et si… ?</h1>
    <p>La vie de Victor et Amanda change. Prédis ce qui arrive à leurs ressources, puis vérifie par le calcul.</p>
  </header>
  <nav class="fil" aria-label="Fil d'Ariane"><a href="revision-sesg-revenus-jeux.html">← Toutes les révisions du cours</a></nav>

  <section class="depart" aria-labelledby="tDep">
    <h2 id="tDep">Situation de départ, mois de septembre</h2>
    <div class="chiffres" id="chDep"></div>
    <div id="barDep"></div>
  </section>

  <h2 class="titreSec">Choisis un scénario</h2>
  <div class="scenarios" id="scenarios"></div>
  <div id="zone"></div>
  <div id="bilan"></div>
  <div class="sr" aria-live="polite" id="annonce"></div>
</div>

<script>
/* ===== DONNÉES ===== */
const BASE=[
  {id:"v",lib:"Salaire net payé de Victor",m:1498,cat:"act"},
  {id:"a",lib:"Somme disponible de l'activité d'Amanda",m:1070,cat:"act"},
  {id:"g",lib:"Loyer du garage",m:80,cat:"cap"},
  {id:"f",lib:"Allocations familiales, deux enfants",m:150,cat:"tra"}
];
const SCEN=[
 {id:"client",emoji:"📈",titre:"Amanda trouve un nouveau client",texte:"Amanda trouve un nouveau client. Sa somme disponible passe de 1 070 € à 1 400 €.",
  modif:{a:1400},
  retenir:"Quand un revenu du travail augmente, le total augmente et la part du travail augmente aussi."},
 {id:"chomage",emoji:"📉",titre:"Victor perd son emploi",texte:"Victor perd son emploi. Il ne touche plus de salaire, mais une allocation chômage de 1 100 €.",
  retrait:["v"],ajout:[{id:"ch",lib:"Allocation chômage de Victor",m:1100,cat:"tra"}],catQ:"ch",
  retenir:"Quand un salaire est remplacé par une allocation, la part du travail s'effondre : le ménage dépend alors surtout de la protection sociale."},
 {id:"garage",emoji:"🚗",titre:"Un deuxième garage loué",texte:"Victor et Amanda louent aussi un deuxième garage. Ils reçoivent 80 € de loyer en plus.",
  ajout:[{id:"g2",lib:"Loyer du deuxième garage",m:80,cat:"cap"}],
  retenir:"La part du travail peut baisser alors que les revenus du travail ne changent pas : c'est le total qui a grandi."},
 {id:"bebe",emoji:"👶",titre:"Un troisième enfant",texte:"Le couple a un troisième enfant. Les allocations familiales passent de 150 € à 340 €.",
  modif:{f:340},modLib:{f:"Allocations familiales, trois enfants"},
  retenir:"Plus de prestations familiales : le total augmente, mais la part du travail baisse."},
 {id:"pause",emoji:"🏡",titre:"Amanda met son activité en pause",texte:"Amanda arrête son activité pendant quelques mois. Elle ne gagne plus rien.",
  retrait:["a"],
  retenir:"Le total baisse beaucoup. La part du travail baisse aussi, mais reste élevée : le salaire de Victor pèse lourd à côté des autres revenus."}
];
const CAT={act:{nom:"Activité",long:"Revenu d'activité"},cap:{nom:"Capital",long:"Revenu du capital"},tra:{nom:"Transfert",long:"Revenu de transfert"}};

/* ===== Outils ===== */
const $=id=>document.getElementById(id);
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const fmt=n=>n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const fmtN=n=>n.toLocaleString("fr-FR",{maximumFractionDigits:2});
const lireNombre=s=>parseFloat(String(s).replace(/[\s\u202f€%]/g,"").replace(",","."));
const tactile=matchMedia("(hover:none)").matches;
function annoncer(t){$("annonce").textContent=t}
const CLE="et-si-ressources";
let pref={faits:{}};
try{pref=Object.assign(pref,JSON.parse(localStorage.getItem(CLE)||"{}"))}catch(e){}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(pref))}catch(e){}}

function stats(lignes){
  const s=k=>r2(lignes.filter(l=>l.cat===k).reduce((a,l)=>a+l.m,0));
  const tot=r2(lignes.reduce((a,l)=>a+l.m,0)),act=s("act");
  return {tot,act,cap:s("cap"),tra:s("tra"),exact:act/tot*100,part:Math.round(act/tot*100)};
}
function nouvellesLignes(S){
  let L=BASE.filter(l=>!(S.retrait||[]).includes(l.id)).map(l=>({...l,m:S.modif&&S.modif[l.id]!==undefined?S.modif[l.id]:l.m,lib:S.modLib&&S.modLib[l.id]||l.lib}));
  return L.concat(S.ajout||[]);
}
function barreHTML(st,label){
  const p={act:st.act/st.tot*100,cap:st.cap/st.tot*100,tra:st.tra/st.tot*100};
  return `<div class="barre" role="img" aria-label="${label||""} Activité ${Math.round(p.act)} %, capital ${Math.round(p.cap)} %, transfert ${Math.round(p.tra)} %">
    ${["act","cap","tra"].map(k=>`<span class="${k}" style="width:${p[k]}%" data-w="${p[k]}">${p[k]>=9?Math.round(p[k])+" %":""}</span>`).join("")}</div>`;
}
const legende=`<div class="legende">${["act","cap","tra"].map(k=>`<span><i style="background:var(--${k})"></i>${CAT[k].long}</span>`).join("")}</div>`;
const B=stats(BASE);

/* ===== Départ + cartes ===== */
$("chDep").innerHTML=`<div><b>${fmt(B.tot)}</b><small>total des ressources</small></div><div><b>${fmt(B.act)}</b><small>viennent du travail</small></div><div><b>${B.part} %</b><small>part du travail</small></div>`;
$("barDep").innerHTML=barreHTML(B,"Situation de départ.")+legende;
let S=null,N,NS,etapes,k,pred,err,ind,niv,resolu;
function cartes(){
  $("scenarios").innerHTML=SCEN.map(s=>`<button class="sc" data-id="${s.id}" aria-current="${S&&S.id===s.id}">
    <span class="emo" aria-hidden="true">${s.emoji}</span><span class="t">${s.titre}</span>${pref.faits[s.id]?`<span class="etat" aria-label="fait">✓</span>`:""}</button>`).join("");
  $("scenarios").querySelectorAll(".sc").forEach(b=>b.onclick=()=>ouvrir(SCEN.find(s=>s.id===b.dataset.id)));
}

/* ===== Scénario ===== */
function ouvrir(sc){
  S=sc;N=nouvellesLignes(S);NS=stats(N);pred={};err=0;ind=0;
  etapes=[...(S.catQ?["cat"]:[]),"predTot","predPart","total","part"];k=0;
  cartes();$("bilan").innerHTML="";
  $("zone").innerHTML=`<article class="panneau" id="pan" tabindex="-1">
    <div class="evt"><span class="emo" aria-hidden="true">${S.emoji}</span><div><h2>Et si… ${S.titre.charAt(0).toLowerCase()+S.titre.slice(1)} ?</h2><p>${S.texte}</p></div></div>
    <div class="tabWrap" id="tab"></div>
    <div class="etape" id="etape"></div>
  </article>`;
  tableau(false);etape();
  $("pan").scrollIntoView({behavior:"smooth",block:"start"});$("pan").focus({preventScroll:true});
  annoncer(`Scénario : ${S.texte}`);
}
function tableau(totalConnu){
  const lignes=[];
  BASE.forEach(l=>{
    if((S.retrait||[]).includes(l.id))lignes.push(`<tr class="suppr"><td>${l.lib}<span class="badge s">supprimé</span></td><td class="n">${fmt(l.m)}</td><td><span class="tag ${l.cat}">${CAT[l.cat].nom}</span></td></tr>`);
    else if(S.modif&&S.modif[l.id]!==undefined){const nl=N.find(x=>x.id===l.id);lignes.push(`<tr class="change"><td>${nl.lib}<span class="badge m">change</span></td><td class="n"><del>${fmt(l.m)}</del>${fmt(nl.m)}</td><td><span class="tag ${l.cat}">${CAT[l.cat].nom}</span></td></tr>`)}
    else lignes.push(`<tr><td>${l.lib}</td><td class="n">${fmt(l.m)}</td><td><span class="tag ${l.cat}">${CAT[l.cat].nom}</span></td></tr>`);
  });
  (S.ajout||[]).forEach(l=>{
    const connue=!S.catQ||S.catQ!==l.id||etapes.indexOf("cat")<k;
    lignes.push(`<tr class="nouv"><td>${l.lib}<span class="badge n">nouveau</span></td><td class="n">${fmt(l.m)}</td><td>${connue?`<span class="tag ${l.cat}">${CAT[l.cat].nom}</span>`:'<span class="trou">?</span>'}</td></tr>`);
  });
  $("tab").innerHTML=`<table><thead><tr><th>Ressource</th><th class="n">Montant</th><th>Catégorie</th></tr></thead><tbody>${lignes.join("")}
    <tr class="total"><td>NOUVEAU TOTAL DES RESSOURCES</td><td class="n">${totalConnu?fmt(NS.tot):'<span class="trou">?</span>'}</td><td></td></tr></tbody></table>`;
}

const ETAPES={
 cat:{verbe:"Indiquer",txt:()=>{const l=S.ajout.find(x=>x.id===S.catQ);return `la catégorie de la nouvelle ressource : « ${l.lib} ».`},type:"cat",
   ind:["D'où vient cet argent : du travail, de ce que l'on possède, ou de la protection sociale ?","L'allocation chômage est versée par la protection sociale quand on a perdu son emploi."]},
 predTot:{verbe:"Prédire",txt:()=>"sans calculer : le total des ressources du ménage va…",type:"pred",quoi:"tot",
   ind:["Regarde les lignes en jaune et en rouge du tableau : le ménage gagne-t-il plus ou moins qu'avant ?"]},
 predPart:{verbe:"Prédire",txt:()=>"sans calculer : la part des ressources qui vient du travail va…",type:"pred",quoi:"part",
   ind:["Pense aux deux morceaux : les revenus du travail d'un côté, le total de l'autre.","Si le total grandit mais pas le travail, la part du travail devient plus petite."]},
 total:{verbe:"Calculer",txt:()=>"le nouveau total des ressources du ménage.",type:"saisie",unite:"€",
   rep:()=>NS.tot,
   ind:["Additionne toutes les lignes, sauf les lignes barrées.",()=>`Calcule ${N.map(l=>fmtN(l.m)).join(" + ")}.`],
   piege:x=>{
     if(Math.abs(x-B.tot)<.01)return "C'est l'ancien total. Tiens compte du changement.";
     const sansRetrait=r2(NS.tot+BASE.filter(l=>(S.retrait||[]).includes(l.id)).reduce((a,l)=>a+l.m,0));
     if(S.retrait&&Math.abs(x-sansRetrait)<.01)return "Tu as gardé une ligne barrée : cette ressource n'existe plus.";
     if(S.modif){const id=Object.keys(S.modif)[0],old=BASE.find(l=>l.id===id).m;if(Math.abs(x-(NS.tot+old))<.01)return "Tu as ajouté le nouveau montant sans enlever l'ancien : le nouveau montant remplace l'ancien."}
     return null}},
 part:{verbe:"Calculer",txt:()=>"la nouvelle part des ressources qui vient du travail, en pourcentage arrondi à l'unité.",type:"saisie",unite:"%",
   rep:()=>NS.part,
   ind:["Part en % = revenus du travail ÷ total × 100.",()=>`Revenus du travail : ${fmtN(NS.act)} €. Calcule ${fmtN(NS.act)} ÷ ${fmtN(NS.tot)} × 100.`],
   piege:x=>x>100?"Une part ne dépasse pas 100 % : c'est la partie divisée par le total."
     :Math.abs(x-NS.act/NS.tot)<.01?"Tu as oublié de multiplier par 100."
     :Math.abs(x-NS.act/B.tot*100)<1?"Tu as divisé par l'ancien total. Prends le nouveau total."
     :Math.abs(x-B.act/NS.tot*100)<1&&B.act!==NS.act?"Tu as pris l'ancien montant du travail. Qu'est-ce qui vient du travail maintenant ?"
     :Math.abs(x-B.part)<.5?"C'est l'ancienne part. Refais le calcul avec les nouveaux montants.":null}
};

function etape(){
  const E=ETAPES[etapes[k]];resolu=false;niv=0;
  let zone="";
  if(E.type==="pred")zone=`<div class="opts">
      <button class="opt" data-v="+"><span>⬆️</span>augmenter</button>
      <button class="opt" data-v="-"><span>⬇️</span>baisser</button>
      <button class="opt" data-v="="><span>➡️</span>rester pareil${E.quoi==="part"?"le":""}</button></div>`;
  else if(E.type==="cat")zone=`<div class="opts">${["act","cap","tra"].map(c=>`<button class="opt" data-c="${c}">${CAT[c].long}</button>`).join("")}</div>`;
  else zone=`<div class="saisie"><input id="inp" inputmode="decimal" autocomplete="off" aria-label="Ta réponse en ${E.unite}"><span>${E.unite}</span><button class="valider" id="bVal">Valider</button></div>`;
  $("etape").innerHTML=`<div class="num">Étape ${k+1} / ${etapes.length}</div>
    <p class="consigne"><b>${E.verbe}</b> ${E.txt()}</p>
    <div id="rep">${zone}</div>
    <div class="fb" id="fb" role="status" aria-live="polite"></div>
    <div class="outils"><button class="outil" id="bInd">💡 Indice</button><button class="outil" id="bLire">🔊 Écouter</button>${E.type==="saisie"?'<button class="outil" id="bCalc">🧮 Calculatrice</button>':""}</div>
    <div class="calc" id="calc" hidden></div>`;
  $("bInd").onclick=indice;
  $("bLire").onclick=()=>lire(`${S.texte} ${E.verbe} ${E.txt()}`);
  if(E.type==="pred")$("rep").querySelectorAll(".opt").forEach(o=>o.onclick=()=>predire(E.quoi,o.dataset.v));
  if(E.type==="cat")$("rep").querySelectorAll(".opt").forEach(o=>o.onclick=()=>categorie(o.dataset.c));
  if(E.type==="saisie"){
    $("bVal").onclick=valider;$("inp").addEventListener("keydown",e=>{if(e.key==="Enter")valider()});
    $("bCalc").onclick=()=>{const c=$("calc");c.hidden=!c.hidden};construireCalc();
    if(!tactile)$("inp").focus({preventScroll:true});
  }
}
function fb(c,h){const f=$("fb");f.className="fb "+c;f.innerHTML=h}
function suivant(msg,cls="ok"){
  resolu=true;fb(cls,msg);
  $("rep").querySelectorAll("button,input").forEach(x=>x.disabled=true);
  const der=k===etapes.length-1;
  const b=document.createElement("button");b.className="continuer";b.textContent=der?"Voir le résultat":"Étape suivante";
  b.onclick=()=>{arreterVoix();k++;der?resultat():(tableau(k>etapes.indexOf("total")),etape())};
  $("rep").appendChild(b);b.focus({preventScroll:true});
  const c=$("calc");if(c)c.hidden=true;
}
function predire(quoi,val){
  if(resolu)return;pred[quoi]=val;
  suivant(`📝 Prédiction notée : ${quoi==="tot"?"le total":"la part du travail"} va ${val==="+"?"augmenter":val==="-"?"baisser":"rester pareil"+(quoi==="part"?"le":"")}. On vérifiera avec le calcul.`,"neutre");
}
function categorie(c){
  if(resolu)return;
  const l=S.ajout.find(x=>x.id===S.catQ);
  if(c===l.cat){suivant(`<b>✓ Bravo !</b> ${l.lib} : ${CAT[c].long.toLowerCase()}, versé par la protection sociale.`);tableau(false)}
  else{err++;fb("ko",`<b>Pas tout à fait.</b> Victor ne travaille plus : cet argent ne vient pas ${c==="act"?"du travail":"de ce qu'il possède"}. Qui le verse ?`)}
}
function valider(){
  if(resolu)return;
  const E=ETAPES[etapes[k]],x=lireNombre($("inp").value);
  if(isNaN(x)){fb("neutre","Écris un nombre.");return}
  if(Math.abs(x-E.rep())<.005){
    suivant(etapes[k]==="total"?`<b>✓ Bravo !</b> ${N.map(l=>fmtN(l.m)).join(" + ")} = ${fmt(NS.tot)}.`
      :`<b>✓ Bravo !</b> ${fmtN(NS.act)} ÷ ${fmtN(NS.tot)} × 100 = ${NS.exact.toFixed(2).replace(".",",")}, arrondi à ${NS.part} %.`);
    if(etapes[k]==="total")tableau(true);
    return;
  }
  if(etapes[k]==="part"&&Math.abs(x-NS.exact)<1){fb("ind","<b>Presque !</b> Arrondis à l'unité.");return}
  err++;const p=E.piege(x);
  fb("ko",`<b>Pas encore.</b> ${p||"Vérifie ton calcul ou demande un indice."}`);
}
function indice(){
  if(resolu)return;
  const E=ETAPES[etapes[k]],t=E.ind[Math.min(niv,E.ind.length-1)];
  if(niv<E.ind.length){ind++;niv++}
  fb("ind",`<b>💡 Indice :</b> ${typeof t==="function"?t():t}`);
}

/* ===== Résultat ===== */
function sens(a,b){return b>a+1e-9?"+":b<a-1e-9?"-":"="}
const mot={"+":"augmente","-":"baisse","=":"reste pareil"};
function resultat(){
  const vt=sens(B.tot,NS.tot),vp=sens(B.exact,NS.exact);
  const okT=pred.tot===vt,okP=pred.part===vp;
  pref.faits[S.id]={pred:(okT?1:0)+(okP?1:0)};sauver();cartes();
  $("etape").innerHTML=`
    <p class="consigne"><b>Résultat</b></p>
    <div class="compare">
      <div><div class="lab"><span>Avant</span><span>${fmt(B.tot)} · ${B.part} % du travail</span></div>${barreHTML(B,"Avant.")}</div>
      <div><div class="lab"><span>Après</span><span>${fmt(NS.tot)} · ${NS.part} % du travail</span></div><div id="barApres">${barreHTML(NS,"Après.")}</div></div>
    </div>
    <div class="predits">
      <div class="pred ${okT?"ok":"ko"}">${okT?"✓":"✗"} Le total ${mot[vt]} : ${fmt(B.tot)} → ${fmt(NS.tot)}.<small>Tu avais prédit : ${mot[pred.tot]}.</small></div>
      <div class="pred ${okP?"ok":"ko"}">${okP?"✓":"✗"} La part du travail ${mot[vp].replace("pareil","pareille")} : ${B.part} % → ${NS.part} %.<small>Tu avais prédit : ${mot[pred.part].replace("pareil","pareille")}.</small></div>
    </div>
    <div class="retenir"><b>À retenir</b>${S.retenir}</div>
    ${prochain()?`<button class="continuer" id="bNext">Scénario suivant : ${prochain().titre} →</button>`:`<button class="continuer" id="bNext">Voir ce que j'ai découvert</button>`}`;
  const ba=$("barApres").querySelectorAll("span");
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches){ba.forEach(s=>s.style.width=(B[s.className==="act"?"act":s.className]/B.tot*100)+"%");
    requestAnimationFrame(()=>requestAnimationFrame(()=>ba.forEach(s=>s.style.width=s.dataset.w+"%")))}
  $("bNext").onclick=()=>prochain()?ouvrir(prochain()):bilan();
  $("bNext").focus({preventScroll:true});
  annoncer(`Le total ${mot[vt]}, la part du travail passe de ${B.part} à ${NS.part} pour cent.`);
}
function prochain(){return SCEN.find(s=>!pref.faits[s.id])||null}
function bilan(){
  const tot=SCEN.reduce((a,s)=>a+(pref.faits[s.id]?pref.faits[s.id].pred:0),0);
  $("zone").innerHTML="";S=null;cartes();
  $("bilan").innerHTML=`<section class="bilan" tabindex="-1" id="bil">
    <h2>Ce que tu as découvert</h2>
    <p style="margin:0">Prédictions justes : <b>${tot} sur ${SCEN.length*2}</b>.</p>
    <ol>${SCEN.map(s=>`<li><b>${s.titre} :</b> ${s.retenir}</li>`).join("")}</ol>
    <div class="retenir"><b>La règle</b>Une part en % = la partie ÷ le total × 100. Elle change si la partie change… ou si le total change.</div>
    <button class="continuer" id="bRaz">Tout recommencer</button></section>`;
  $("bRaz").onclick=()=>{pref.faits={};sauver();$("bilan").innerHTML="";cartes();scrollTo({top:0,behavior:"smooth"})};
  $("bil").scrollIntoView({behavior:"smooth",block:"start"});$("bil").focus({preventScroll:true});
}

/* ===== Calculatrice ===== */
let expr="";
function construireCalc(){
  expr="";const T=["7","8","9","÷","4","5","6","×","1","2","3","−","0",",","=","+","C","⌫"];
  $("calc").innerHTML=`<div class="ecran" id="ecran">0</div><div class="touches">${T.map(t=>`<button data-t="${t}" class="${"÷×−+".includes(t)?"op":t==="="?"eg":""}${t==="C"||t==="⌫"?" large":""}" aria-label="${{"÷":"diviser","×":"multiplier","−":"moins","+":"plus","⌫":"effacer","C":"tout effacer"}[t]||t}">${t}</button>`).join("")}</div>
    <button class="outil" id="bCopie" style="margin-top:.5rem;width:100%">↳ Mettre le résultat dans ma réponse</button>`;
  $("calc").querySelectorAll("[data-t]").forEach(x=>x.onclick=()=>touche(x.dataset.t));
  $("bCopie").onclick=()=>{const i=$("inp");if(i&&expr){calc();i.value=expr;i.focus()}};
}
function touche(t){if(t==="C")expr="";else if(t==="⌫")expr=expr.slice(0,-1);else if(t==="=")calc();else expr+=t;$("ecran").textContent=expr||"0"}
function calc(){const e=expr.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/,/g,".");if(!/^[0-9.+\-*/]+$/.test(e))return;
  try{let r=Function(`"use strict";return (${e})`)();if(!isFinite(r)){expr="";$("ecran").textContent="Erreur";return}r=Math.round(r*10000)/10000;expr=String(r).replace(".",",")}catch(x){expr="";$("ecran").textContent="Erreur";return}$("ecran").textContent=expr}

/* ===== Voix ===== */
let voix=null;
function choisirVoix(){const l=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));voix=l.find(x=>/fr-FR/i.test(x.lang)&&/(google|natural|online|amélie|thomas|denise|henri)/i.test(x.name))||l.find(x=>/fr-FR/i.test(x.lang))||l[0]||null}
if("speechSynthesis" in window){choisirVoix();speechSynthesis.onvoiceschanged=choisirVoix}
function lire(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voix)u.voice=voix;u.rate=.95;speechSynthesis.speak(u)}
function arreterVoix(){if("speechSynthesis" in window)speechSynthesis.cancel()}

cartes();
</script>
