rt *\n* Quels que soient mon âge, mes niveaux d’entraînement et de performance, ou les résultats d’un précédent bilan cardiologique. »\n« Devant une douleur thoracique en étau […], n’hésitez pas à appeler le 15 ou le 112. »", "source": "Club des cardiologues du sport, « Les 10 règles d’or » ; ameli.fr, « Reconnaître un infarctus… », 05/06/2026."}}, {"id": "bk_ch4_1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir de la situation et des documents 3, 7 et 8 :", "reponse_attendue": ""}}, {"id": "bk_q4_1", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "1.1", "texte": "**Classer** l’essoufflement de Marion et celui de Patrick, en complétant le tableau.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Cocher**, pour Marion et pour Patrick, essoufflement normal ou signal d’alerte, une case par ligne du tableau."}, "essentiel": {"texte": "**Cocher**, pour Marion et pour Patrick, essoufflement normal ou signal d’alerte, une case par ligne du tableau."}}}, "el": {"standard": {"indice": "Situation : la durée de l’essoufflement de Marion, puis celle de Patrick ; DOC. 8 : les signes à signaler.", "explication": "Marion : l’essoufflement disparaît en deux minutes, c’est un essoufflement normal. Patrick : essoufflement qui dure plus de dix minutes avec douleur dans la poitrine, c’est un signal d’alerte."}, "adapte": {"indice": "Situation : la durée de l’essoufflement de chacun ; DOC. 8.", "explication": "Marion : essoufflement normal. Patrick : signal d’alerte."}, "essentiel": {"indice": "Situation : qui reparle normalement ? Qui garde une douleur dans la poitrine ?", "explication": "Marion : essoufflement normal. Patrick : signal d’alerte."}}}, {"id": "bk_tab4_1", "type": "tableau", "data": {"titre": "", "cells": [[{"type": "prof", "content": "Personne"}, {"type": "prof", "content": "Essoufflement norma ussant : la pression dans le thorax a monté, le sang est moins bien revenu au cœur et la pression artérielle a pu baisser, d’où le vertige.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Compléter** : « Damien a ……………………… sa respiration : le sang est moins bien revenu au ……………………… et la pression artérielle a pu ……………………… . »\nMots à placer : bloqué · cœur · baisser · poumon", "lignes": 0, "reponse_attendue": "bloqué · cœur · baisser"}}, "absorber": false}, "el": {"standard": {"indice": "DOC. 10 : les points 1, 2 et 3 ; situation : la barre poussée en bloquant la respiration.", "explication": "Damien a bloqué sa respiration en poussant : la pression dans le thorax a monté, le sang est moins bien revenu au cœur, la pression artérielle a pu baisser. D’où le vertige."}, "adapte": {"indice": "DOC. 10 : les points 1, 2 et 3.", "explication": "Respiration bloquée, le sang revient moins bien au cœur, la pression artérielle peut baisser.", "trous": ["bloqué|bloque", "cœur|coeur", "baisser|diminuer|baissé|baisse"]}}}, {"id": "bk_q4_4e", "type": "qcm", "data": {"competence": "CG2.2", "numero": "2.1", "titre": "", "consigne": "**Cocher** l’explication du vertige de Damien.", "items": [{"question": "La tête a pu tourner à Damien parce que :", "options": ["il a bloqué sa respiration et sa pression artérielle a baissé", "il a trop respiré pendant la poussée", "il avait bu de l’eau pendant la pause"], "reponse": 0}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 10 : les points 1 à 3.", "explication": "Damien a bloqué sa respiration : la pression artérielle a baissé, la tête a tourné."}}}, {"id": "bk_q4_5", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "2.2", "texte": "**Indiquer** comment respirer pour amener la barre dans la position du document 9, puis pour la redescendre.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "lignes", "reponse_attendu
