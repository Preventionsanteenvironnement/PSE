<script>window.COURS = {"slug": "capa_BIO_cardio_respiratoire", "classe": "CAPa Jardinier paysagiste · Horticulture", "retour": "../index.html#capa-bio-cardio-respiratoire", "pied": "Biologie — Le cœur, les poumons, le sang : le corps à l'effort. CAPa. M. MECHERI. Sources indiquées sous chaque document.", "version": "2026-11-05", "entete": {"module_code": "MG2", "titre": "Le cœur, les poumons, le sang : le corps à l’effort", "niveau": "CAPa", "annee": "2026-2027", "thematique": "BIO · Biologie — Le corps à l’effort (CG2.2 · CCF4)", "objectif_general": "Être capable d’expliquer comment le dioxygène va de l’air jusqu’aux muscles et pourquoi la respiration et le cœur s’accélèrent pendant l’effort."}, "blocks": [{"id": "b_seance_01", "type": "seance", "data": {"numero": "1", "titre": "De l’air au sang", "objectif": "1. Nommer les organes traversés par l’air. 2. Nommer les deux gaz échangés dans les alvéoles.", "competences": ["CG2.2"]}}, {"id": "bc_sit1", "type": "situation", "data": {"source": "", "texte": "Christophe, 31 ans, est ouvrier paysagiste. Deux soirs par semaine, il fait de la musculation. À la fin d’une série de squats, il respire vite et fort, par le nez et par la bouche. Il se demande où va l’air qu’il respire et à quoi il sert à ses jambes."}}, {"id": "bc_t1", "type": "analyse", "data": {"titre": "LE TRAJET DE L’AIR ET LES ÉCHANGES DANS LES POUMONS"}}, {"id": "bc_doc1", "type": "document_texte_image", "data": {"label": "DOC. 1", "titre": "L’appareil respiratoire d’un adulte", "cadre": true, "corps": "", "source": "D’après Blausen.com staff (2014), « Respiratory System », BruceBlaus, Wikimedia Commons, CC BY 3.0.", "image_w": 1200, "image_h": 890, "image_pos": "centre", "image_align": "centre", "image_largeur": 80, "image_taille": "pleine", "image_nom": "BIO_cardio_appareil_respiratoire.png", "img": "images/capa_BIO_cardio_respiratoire_bc_doc1.jpg", "img_desc": "BIO_cardio_appareil_respiratoire.png", "img_w": 1200, "img_h": 890}}, {"id": "bc_doc2", "type": "document", "data": {"label": "DOC. 2", "titre": "Le trajet de l’air jusqu’au sang", "cadre": true, "corps": "1. L’air entre par le nez et la bouche, passe par la gorge (pharynx) et le larynx, puis descend dans la trachée.\n2. La trachée se divise en deux bronches, une pour chaque poumon.\n3. Les bronches se ramifient jusqu’à des conduits très fins, les bronchioles.\n4. Les bronchioles se terminent par des grappes d’alvéoles, petits sacs d’air entourés de capillaires sanguins. Une barrière extrêmement fine sépare l’air du sang.\n5. Le dioxygène passe de l’alvéole vers le sang ; le dioxyde de carbone, déchet de la production d’énergie, passe du sang vers l’alvéole, puis il est rejeté à l’expiration.\nLes millions d’alvéoles forment une surface de plus de 100 m².", "source": "D’après les Manuels MSD, « Présentation du système respiratoire », juillet 2025."}}, {"id": "bc_ch1_1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir des documents 1 et 2 :", "reponse_attendue": ""}}, {"id": "bc_q1_1", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "1.1", "texte": "**Nommer** les organes numérotés de 1 à 5, en complétant le tableau.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Cocher** le nom des organes numérotés de 2 à 5, une case par ligne du tableau."}, "essentiel": {"texte": "**Cocher** le nom des organes numérotés de 2 à 5, une case par ligne du tableau."}}}, "el": {"standard": {"indice": "DOC. 1 : les numéros 1 à 5 sur le dessin ; DOC. 2 : les points 1 à 4, dans l’ordre du trajet de l’air.", "explication": "1 : les fosses nasales (le nez). 2 : la trachée. 3 : une bronche. 4 : les bronchioles, les plus fines bronches. 5 : le poumon."}, "adapte": {"indice": "DOC. 1 : les numéros 2 à 5 sur le dessin ; DOC. 2 : les points 1 à 4.", "explication": "2 : la trachée. 3 : une bronche. 4 : les bronchi }]}}, {"id": "b_seance_02", "type": "seance", "data": {"numero": "2", "titre": "Le cœur pousse, le sang transporte", "objectif": "1. Nommer le rôle du cœur et les vaisseaux sanguins. 2. Suivre le trajet du sang des poumons aux muscles. 3. Nommer les cellules qui transportent le dioxygène.", "competences": ["CG2.2"]}}, {"id": "bc_sit2", "type": "situation", "data": {"source": "", "texte": "Valérie, 38 ans, est cheffe d’équipe dans la même entreprise que Christophe. Le soir, elle fait de la musculation. Pendant une série de tirages, ses bras travaillent dur. Elle demande : « L’air entre dans ma poitrine. Comment le dioxygène arrive-t-il jusqu’aux muscles de mes bras ? »"}}, {"id": "bc_t2", "type": "analyse", "data": {"titre": "LE CŒUR, LES VAISSEAUX ET LE SANG"}}, {"id": "bc_doc4", "type": "document", "data": {"label": "DOC. 4", "titre": "Le cœur, les vaisseaux sanguins et le débit cardiaque", "cadre": true, "corps": "Le cœur est un organe musculaire creux. Sa fonction principale est de pomper le sang. Le côté droit du cœur envoie le sang vers les poumons, où il se charge en dioxygène et se débarrasse d’une partie du dioxyde de carbone. Le côté gauche envoie ce sang vers le reste du corps, où les organes, dont les muscles, reçoivent le dioxygène et les nutriments.\nLe sang part du cœur dans les artères, traverse les organes dans les capillaires, dont la paroi est extrêmement fine, puis revient au cœur par les veines.\nDébit cardiaque : volume de sang éjecté par chaque ventricule du cœur en une minute.", "source": "D’après les Manuels MSD (« Biologie du cœur », mai 2026 ; « Biologie des vaisseaux sanguins ») et l’OQLF (débit cardiaque)."}}, {"id": "bc_ch2_1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir de la situation et du document 4 :", "reponse_attendue": ""}}, {"id": "bc_q2_1", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "1.1", "texte": "**Indiquer** le rôle du cœur.", "points": "", "lignes": 1, "style_lignes": "tir
