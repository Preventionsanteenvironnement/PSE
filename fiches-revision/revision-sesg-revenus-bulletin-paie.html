    <p>Lire un bulletin et vérifier le SMIC — Séance 2</p>
  </header>
  <nav class="filtres" id="filtres" aria-label="Choisir le bulletin"></nav>

  <div class="jeu">
    <div class="docZone">
      <div class="doc" id="doc"></div>
      <p class="source">Entreprises et salariés fictifs. Modèle d'après service-public.gouv.fr, 2026.</p>
    </div>
    <aside class="mission" id="mission" aria-label="Mission"></aside>
  </div>
</div>

<script>
/* ===== DONNÉES DES BULLETINS (fictifs) ===== */
const SMIC_H=12.31, SMIC_M=1867.02;
const BULLETINS={
 victor:{titre:"Victor (guidé)",prenom:"Victor",nom:"Victor M.",emploi:"Ouvrier paysagiste",contrat:"CDI, temps plein",anc:"depuis le 1er mars 2022",
   heures:151.67,brut:1950,impot:42,parcours:"complet",
   emp:["LES JARDINS DU RHÔNE","Entreprise d'aménagement d'espaces verts","14 route des Peupliers","69100 Villeurbanne","SIRET : 000 000 000 00000","Code APE : 81.30Z"]},
 ines:{titre:"Défi 1 : Inès",prenom:"Inès",nom:"Inès B.",emploi:"Ouvrière paysagiste",contrat:"CDI, temps partiel",anc:"depuis le 2 janvier 2025",
   heures:104,brut:1352,impot:0,parcours:"defi",
   emp:["LES JARDINS DU RHÔNE","Entreprise d'aménagement d'espaces verts","14 route des Peupliers","69100 Villeurbanne","SIRET : 000 000 000 00000","Code APE : 81.30Z"]},
 karim:{titre:"Défi 2 : Karim",prenom:"Karim",nom:"Karim D.",emploi:"Aide jardinier",contrat:"CDD, temps plein",anc:"depuis le 1er juillet 2026",
   heures:151.67,brut:1820,impot:12,parcours:"defi",
   emp:["ESPACES VERTS DELORME","Entretien de parcs et jardins","3 chemin des Saules","69200 Vénissieux","SIRET : 000 000 000 00000","Code APE : 81.30Z"]}
};
const ORDRE=["victor","ines","karim"];

/* ===== Calculs ===== */
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const fmt=n=>n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const fmtN=n=>n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
function calculer(b){
  const B=b.brut,csg=r2(B*0.9825);
  const L=[
    ["c1","Vieillesse plafonnée et déplafonnée",B,r2(B*0.073),r2(B*0.10205)],
    ["c2","Retraite complémentaire Agirc-Arrco",B,r2(B*0.040103),r2(B*0.06)],
    ["c3","CSG déductible de l'impôt",csg,r2(csg*0.068),null],
    ["c4","CSG et CRDS non déductibles",csg,r2(csg*0.029),null],
    ["c5","Complémentaire santé",B,3.61,12],
    ["c6","Santé, maladie, maternité, invalidité, décès",B,null,r2(B*0.07)],
    ["c7","Accidents du travail, famille, autres",B,null,r2(B*0.11564)]
  ];
  const totS=r2(L.reduce((s,l)=>s+(l[3]||0),0)),totE=r2(L.reduce((s,l)=>s+(l[4]||0),0));
  const netAvant=r2(B-totS),netPaye=r2(netAvant-b.impot);
  return {L,brut:B,heures:b.heures,totS,totE,netAvant,impot:b.impot,netPaye,cout:r2(B+totE),taux:r2(B/b.heures),exact:B/b.heures};
}

/* ===== Rendu du bulletin ===== */
function rendreBulletin(b,v){
  const tr=(id,cells,cls="")=>`<tr ${id?`data-id="${id}" tabindex="0" role="button"`:""} class="${cls}">${cells}</tr>`;
  const n=x=>x===null?"-":fmt(x);
  let h=`<div class="docIn">
  <div class="entete">
    <div class="emp"><b>${b.emp[0]}</b>${b.emp.slice(1).join("<br>")}<br>Convention collective nationale des entreprises du paysage</div>
    <div><div class="titreB"><strong>BULLETIN DE PAIE</strong>Période : septembre<br>Du 1er au 30 septembre</div>
      <div class="sal">Salarié : ${b.nom}<br>Emploi : ${b.emploi}<br>Contrat : ${b.contrat}<br>Ancienneté : ${b.anc}</div></div>
  </div>
  <table>
    <thead><tr><th>Désignation</th><th class="n">Base</th><th class="n">Part salarié</th><th class="n">Part employeur</th></tr></thead>
    <tbody>
    <tr class="sect"><td colspan="4">Rémunération</td></tr>
    ${tr("base",`<td>Salaire de base, ${b.contrat.split(", ")[1]}</td><td class="n">${fmtN(b.heures)} h</td><td class="n">${fmt(v.brut)}</td><td class="n">-</td>`)}
    ${tr("hsup",`<td>Heures supplémentaires</td><td class="n">0,00 h</td><td class="n">0,00 €</td><td class="n">-</td>`)}
    ${tr("brut",`<td>SALAIRE BRUT</td><td class="n">${fmtN(b.heures)} h</td><td class="n">${fmt(v.brut)}</td><td class="n">-</td>`,"fort")}
    <tr class="sect"><td colspan="4">Cotisations et contributions sociales</td></tr>
    ${v.L.map(l=>tr(l[0],`<td>${l[1]}</td><td class="n">${fmt(l[2])}</td><td class="n">${n(l[3])}</td><td class="n">${n(l[4])}</td>`)).join("")}
    <tr class="fort"><td>TOTAL DES COTISATIONS</td><td class="n">-</td>
      <td class="n" data-id="totcotS" tabindex="0" role="button">${fmt(v.totS)}</td>
      <td class="n" data-id="totcotE" tabindex="0" role="button">${fmt(v.totE)}</td></tr>
    <tr class="espace"><td colspan="4"></td></tr>
    ${tr("netavant",`<td colspan="3"><b>NET À PAYER AVANT IMPÔT SUR LE REVENU</b><small>salaire brut moins cotisations salariales</small></td><td class="n">${fmt(v.netAvant)}</td>`,"bloc")}
    ${tr("impot",`<td colspan="3"><b>Impôt sur le revenu prélevé à la source</b><small>retenu directement par l'employeur et reversé au Trésor public</small></td><td class="n">− ${fmt(v.impot)}</td>`,"bloc")}
    ${tr("netpaye",`<td colspan="3"><b>NET PAYÉ EN EUROS</b><small>versé par virement le 30 septembre</small></td><td class="n">${fmt(v.netPaye)}</td>`,"bloc")}
    ${tr("cout",`<td colspan="3"><b>Coût total pour l'employeur</b><small>salaire brut plus cotisations patronales</small></td><td class="n">${fmt(v.cout)}</td>`,"bloc")}
    </tbody>
  </table>
  <div class="pied">
    <div><b>Congés payés</b><br>Acquis : 12,50 jours · Pris : 0,00 jour</div>
    <div><b>Paiement</b><br>Virement bancaire, 30 septembre<br>Organisme : Mutualité sociale agricole</div>
  </div>
  <p class="mention">Dans l'intérêt du salarié et pour lui permettre de faire valoir ses droits, ce bulletin est à conserver sans limitation de durée.</p>
  </div>`;
  return h;
}

/* ===== Étapes de la mission ===== */
const DESCR={
  base:"Ça, c'est le salaire de base. Le salaire brut est sur la ligne en majuscules juste en dessous.",
  hsup:"Ça, ce sont les heures supplémentaires.",
  brut:"Ça, c'est le salaire brut : avant les cotisations et l'impôt.",
  c:"Ça, c'est une seule cotisation. Il y en a plusieurs : cherche le total.",
  totcotS:"Ça, c'est le total des cotisations payées par le salarié.",
  totcotE:"Ça, c'est la part payée par l'employeur, pas par le salarié.",
  netavant:"Ça, c'est le net AVANT impôt : l'impôt n'est pas encore retiré.",
  impot:"Ça, c'est l'impôt prélevé à la source.",
  netpaye:"Ça, c'est le net payé : la somme versée sur le compte.",
  cout:"Ça, c'est le coût total pour l'employeur : tout ce que l'entreprise dépense."
};
const ETAPES={
  brut:{type:"clic",cible:"brut",badge:"Brut",verbe:"Relever",txt:b=>`le salaire brut de ${b.prenom}.`,
    ind:[()=>"Le salaire brut, c'est la rémunération AVANT les cotisations et l'impôt.",()=>"Cherche la ligne écrite en majuscules dans la partie « Rémunération »."],
    ok:v=>`Salaire brut : ${fmt(v.brut)}. C'est la rémunération avant cotisations et impôt.`},
  cotis:{type:"clic",cible:"totcotS",badge:"Cotisations",verbe:"Relever",txt:()=>"le total des cotisations salariales.",
    ind:[()=>"Cherche une ligne qui commence par « TOTAL ».",()=>"Prends la colonne « Part salarié » : c'est ce que paie le salarié."],
    ok:v=>`Cotisations salariales : ${fmt(v.totS)}. Elles financent la protection sociale, notamment la retraite.`},
  impot:{type:"clic",cible:"impot",badge:"Impôt",verbe:"Relever",txt:()=>"l'impôt sur le revenu prélevé à la source.",
    ind:[()=>"Cet impôt est retenu par l'employeur, directement sur le salaire.",()=>"Cherche le montant avec un signe moins."],
    ok:v=>`Impôt prélevé à la source : ${fmt(v.impot)}. L'employeur le retient et le reverse au Trésor public.`},
  net:{type:"clic",cible:"netpaye",badge:"Net payé",verbe:"Relever",txt:b=>`le net payé de ${b.prenom}.`,
    ind:[()=>"Le net payé, c'est la somme réellement versée sur le compte bancaire.",()=>"Attention : pas le net AVANT impôt, le net APRÈS."],
    ok:v=>`Net payé : ${fmt(v.netPaye)}. C'est la somme versée sur le compte.`},
  cout:{type:"clic",cible:"cout",badge:"Coût employeur",verbe:"Relever",txt:()=>"le coût total pour l'employeur.",
    ind:[()=>"C'est tout ce que l'entreprise dépense pour ce salarié.",()=>"C'est la dernière ligne du bulletin."],
    ok:v=>`Coût total : ${fmt(v.cout)}. En plus du salaire brut, l'entreprise paie ${fmt(v.totE)} de cotisations patronales.`},
  ecart:{type:"saisie",unite:"€",verbe:"Calculer",txt:()=>"l'écart entre le salaire brut et le net payé.",
    rep:v=>r2(v.brut-v.netPaye),
    ind:[()=>"Écart = salaire brut − net payé.",(b,v)=>`Calcule ${fmt(v.brut)} − ${fmt(v.netPaye)}.`],
    piege:(x,v)=>Math.abs(x-v.totS)<.01?"Ça, ce sont seulement les cotisations. Il manque l'impôt : fais brut − net payé."
      :x<0?"Fais le plus grand moins le plus petit : brut − net payé."
      :Math.abs(x-(v.brut-v.netAvant))<.01?"Tu as pris le net avant impôt. Utilise le net PAYÉ.":null,
    ok:v=>`${fmt(v.brut)} − ${fmt(v.netPaye)} = ${fmt(r2(v.brut-v.netPaye))}. Cet écart = cotisations salariales (${fmt(v.totS)}) + impôt (${fmt(v.impot)}).`},
  heures:{type:"saisie",unite:"h",verbe:"Relever",txt:b=>`le nombre d'heures travaillées par ${b.prenom} dans le mois.`,
    rep:v=>v.heures,
    ind:[()=>"Les heures sont dans la colonne « Base ».",()=>"Regarde la ligne SALAIRE BRUT, colonne « Base »."],
    piege:x=>x===0?"Ça, ce sont les heures supplémentaires. Cherche les heures de la ligne SALAIRE BRUT.":null,
    ok:v=>`${fmtN(v.heures)} heures travaillées dans le mois.`},
  taux:{type:"saisie",unite:"€ / h",verbe:"Calculer",txt:()=>"le taux horaire brut, arrondi au centime.",smic:true,
    rep:v=>v.taux,
    ind:[()=>"Taux horaire brut = salaire brut ÷ nombre d'heures.",(b,v)=>`Calcule ${fmtN(v.brut)} ÷ ${fmtN(v.heures)}, puis garde 2 chiffres après la virgule.`],
    piege:(x,v)=>Math.abs(x-v.heures/v.brut)<.01?"Tu as divisé dans le mauvais sens : c'est le brut divisé par les heures."
      :Math.abs(x-r2(v.netPaye/v.heures))<.011?"Tu as pris le net payé. Le taux horaire se calcule avec le salaire BRUT."
      :Math.abs(x-r2(v.netAvant/v.heures))<.011?"Tu as pris le net avant impôt. Le taux horaire se calcule avec le salaire BRUT.":null,
    ok:v=>`${fmtN(v.brut)} ÷ ${fmtN(v.heures)} = ${fmt(v.taux)} par heure.`},
  smic:{type:"choix",verbe:"Indiquer",txt:b=>`si l'employeur de ${b.prenom} respecte le SMIC.`,smic:true,
    ind:[(b,v)=>`Compare le taux horaire brut (${fmt(v.taux)}) au SMIC horaire brut (${fmt(SMIC_H)}).`,()=>"On ne compare pas les montants du mois : on compare les taux horaires."]}
};
const PARCOURS={complet:["brut","cotis","impot","net","cout","ecart","heures","taux","smic"],defi:["brut","net","heures","taux","smic"]};

/* ===== État ===== */
const $=id=>document.getElementById(id);
const CLE="bulletin-paie-mission";
let pref={etoiles:{}};
try{pref=Object.assign(pref,JSON.parse(localStorage.getItem(CLE)||"{}"))}catch(e){}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(pref))}catch(e){}}
let bId="victor",b,v,seq,i,resolu,erreurs,indices,niv;
const tactile=matchMedia("(hover:none)").matches;

function filtres(){
  const f=$("filtres");f.innerHTML="";
  ORDRE.forEach(id=>{
    const x=document.createElement("button");x.className="puce";x.setAttribute("aria-pressed",id===bId);
    const e=pref.etoiles[id];x.innerHTML=BULLETINS[id].titre+(e?`<span class="et">${"★".repeat(e)}</span>`:"");
    x.onclick=()=>demarrer(id);f.appendChild(x);
  });
}
function demarrer(id){
  bId=id;b=BULLETINS[id];v=calculer(b);seq=PARCOURS[b.parcours];i=0;erreurs=0;indices=0;
  filtres();$("doc").innerHTML=rendreBulletin(b,v);etape();
}

/* ===== Affichage d'une étape ===== */
function etape(){
  const k=seq[i],E=ETAPES[k];resolu=false;niv=0;
  let zone="";
  if(E.type==="clic")zone=`<p class="geste">👆 ${tactile?"Touche":"Clique sur"} la bonne ligne du bulletin.</p>`;
  else if(E.type==="saisie")zone=`<div class="saisie"><input id="inp" inputmode="decimal" autocomplete="off" aria-label="Ta réponse en ${E.unite}"><span>${E.unite}</span><button class="valider" id="bVal">Valider</button></div>`;
  else zone=`<div class="opts">
      <button class="opt" data-v="oui">☐ L'employeur respecte le SMIC.</button>
      <button class="opt" data-v="non">☐ L'employeur ne respecte pas le SMIC.</button>
      <button class="opt" data-v="nsp">☐ Le document ne permet pas de le savoir.</button></div>`;
  $("mission").innerHTML=`
    <div class="m-haut"><span class="m-num">Étape ${i+1} / ${seq.length}</span>
      <div class="pts" aria-hidden="true">${seq.map((_,j)=>`<i class="${j<i?"fait":j===i?"ici":""}"></i>`).join("")}</div></div>
    <p class="consigne"><b>${E.verbe}</b> ${E.txt(b)}</p>
    <div id="rep">${zone}</div>
    <div class="fb" id="fb" role="status" aria-live="polite"></div>
    ${E.smic?`<div class="smicDoc">Doc. 4 — SMIC au 1er juin 2026<br>Horaire brut : <b>${fmt(SMIC_H)}</b><br>Mensuel temps plein (151,67 h) : ${fmt(SMIC_M)}</div>`:""}
    <div class="outils">
      <button class="outil" id="bInd">💡 Indice</button>
      <button class="outil" id="bLire">🔊 Écouter</button>
      ${E.type!=="clic"?`<button class="outil" id="bCalc">🧮 Calculatrice</button>`:""}
    </div>
    <div class="calc" id="calc" hidden></div>`;
  $("bInd").onclick=indice;
  $("bLire").onclick=()=>lire(`${E.verbe} ${E.txt(b)}`);
  if($("bCalc")){$("bCalc").onclick=basculerCalc;construireCalc()}
  if(E.type==="saisie"){
    $("bVal").onclick=valider;
    $("inp").addEventListener("keydown",e=>{if(e.key==="Enter")valider()});
    if(!tactile)$("inp").focus({preventScroll:true});
  }
  if(E.type==="choix")document.querySelectorAll(".opt").forEach(o=>o.onclick=()=>choisir(o));
}
function fb(cls,html){const f=$("fb");f.className="fb "+cls;f.innerHTML=html}

/* ===== Réponses ===== */
$("doc").addEventListener("click",e=>{const el=e.target.closest("[data-id]");if(el)cliquer(el)});
$("doc").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-id]")){e.preventDefault();cliquer(e.target)}});
function cliquer(el){
  if(!seq||resolu)return;
  const E=ETAPES[seq[i]],id=el.dataset.id;
  if(E.type!=="clic"){fb("neutre","Pour cette étape, réponds dans le cadre de la mission.");return}
  if(id===E.cible){
    el.classList.add("trouve");el.dataset.badge=E.badge;reussir(E.ok(v));
  }else{
    erreurs++;el.classList.remove("rate");void el.offsetWidth;el.classList.add("rate");
    setTimeout(()=>el.classList.remove("rate"),900);
    fb("ko",`<b>Pas cette ligne.</b> ${DESCR[id]||DESCR[id.replace(/\d/,"")]||DESCR.c} Relis la consigne.`);
    if(navigator.vibrate)navigator.vibrate(50);
  }
}
const lireNombre=s=>parseFloat(String(s).replace(/[\s\u202f€h\/]/g,"").replace(",","."));
function valider(){
  if(resolu)return;
  const E=ETAPES[seq[i]],x=lireNombre($("inp").value);
  if(isNaN(x)){fb("neutre","Écris un nombre, par exemple 12,50.");return}
  const bon=E.rep(v);
  const ok=seq[i]==="taux"?(Math.abs(x-bon)<.001||Math.abs(x-v.exact)<.0006):Math.abs(x-bon)<.001;
  if(ok){reussir(E.ok(v));return}
  if(seq[i]==="taux"&&Math.abs(x-v.exact)<.01){fb("ind","<b>Presque !</b> Arrondis au centime : garde 2 chiffres après la virgule.");return}
  erreurs++;
  const p=E.piege&&E.piege(x,v);
  fb("ko",`<b>Pas encore.</b> ${p||"Vérifie ton calcul ou demande un indice."}`);
}
function choisir(o){
  if(resolu)return;
  const bon=v.taux>=SMIC_H?"oui":"non",c=o.dataset.v;
  if(c===bon){
    o.textContent="☑ "+o.textContent.slice(2);
    const diff=r2(Math.abs(v.taux-SMIC_H));
    reussir(bon==="oui"
      ?`${fmt(v.taux)} est plus que ${fmt(SMIC_H)} : l'employeur respecte le SMIC.${b.brut<SMIC_M?` Même si le salaire du mois est sous ${fmt(SMIC_M)} : ${b.prenom} travaille à temps partiel.`:""}`
      :`${fmt(v.taux)} est moins que ${fmt(SMIC_H)} : l'employeur ne respecte pas le SMIC. Il manque ${fmt(diff)} par heure.`);
    return;
  }
  erreurs++;
  let m;
  if(c==="nsp")m="Le bulletin donne le salaire brut et les heures : tu peux calculer le taux horaire et le comparer.";
  else if(c==="non"&&b.brut<SMIC_M)m=`Son salaire du mois est plus bas que ${fmt(SMIC_M)}, mais ${b.prenom} travaille à temps partiel. On compare les taux horaires : ${fmt(v.taux)} et ${fmt(SMIC_H)}.`;
  else if(c==="non")m=`Compare : ${fmt(v.taux)} et ${fmt(SMIC_H)}. Lequel est le plus grand ?`;
  else m=`Compare : ${fmt(v.taux)} et ${fmt(SMIC_H)}. Le taux de ${b.prenom} est-il au moins égal au SMIC ?`;
  fb("ko",`<b>Pas tout à fait.</b> ${m}`);
}
function reussir(msg){
  resolu=true;fb("ok",`<b>✓ Bravo !</b> ${msg}`);
  const der=i===seq.length-1;
  $("rep").innerHTML=`<button class="continuer" id="bCont">${der?"Voir mon résultat":"Étape suivante"}</button>`;
  $("bCont").onclick=()=>{arreterVoix();i++;der?fin():etape()};
  $("bCont").focus({preventScroll:true});
  const c=$("calc");if(c)c.hidden=true;
}
function indice(){
  if(resolu)return;
  const E=ETAPES[seq[i]];
  if(niv<E.ind.length){indices++;fb("ind",`<b>💡 Indice ${niv+1} :</b> ${E.ind[niv](b,v)}`);niv++}
  else fb("ind",`<b>💡</b> ${E.ind[E.ind.length-1](b,v)} Tu as vu tous les indices.`);
}

/* ===== Fin ===== */
function fin(){
  const pts=erreurs+indices,et=pts<=1?3:pts<=4?2:1;
  pref.etoiles[bId]=Math.max(pref.etoiles[bId]||0,et);sauver();filtres();
  const suiv=ORDRE[ORDRE.indexOf(bId)+1];
  const lignes=[["Salaire brut",fmt(v.brut)]];
  if(b.parcours==="complet")lignes.push(["Cotisations salariales",fmt(v.totS)],["Impôt à la source",fmt(v.impot)]);
  lignes.push(["Net payé",fmt(v.netPaye)]);
  if(b.parcours==="complet")lignes.push(["Coût pour l'employeur",fmt(v.cout)],["Écart brut − net payé",fmt(r2(v.brut-v.netPaye))]);
  lignes.push(["Heures travaillées",fmtN(v.heures)+" h"],["Taux horaire brut",fmt(v.taux)],["SMIC horaire brut",fmt(SMIC_H)],["SMIC respecté ?",v.taux>=SMIC_H?"Oui ✓":"Non ✗"]);
  $("mission").innerHTML=`
    <p class="consigne" style="margin-bottom:0">Mission accomplie !</p>
    <div class="etoiles" aria-label="${et} étoile${et>1?"s":""} sur 3">${"★".repeat(et)}<span style="opacity:.25">${"★".repeat(3-et)}</span></div>
    <p style="margin:0;opacity:.85">${erreurs} erreur${erreurs>1?"s":""} · ${indices} indice${indices>1?"s":""} utilisé${indices>1?"s":""}</p>
    <table class="recap"><tbody>${lignes.map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td></tr>`).join("")}</tbody></table>
    <div class="fin-act">
      ${suiv?`<button class="continuer" id="bSuiv">${BULLETINS[suiv].titre} →</button>`:""}
      <button class="sec" id="bRec">Recommencer ce bulletin</button>
    </div>`;
  if(suiv)$("bSuiv").onclick=()=>{demarrer(suiv);scrollTo({top:0,behavior:"smooth"})};
  $("bRec").onclick=()=>demarrer(bId);
}

/* ===== Calculatrice ===== */
let expr="";
function construireCalc(){
  expr="";
  const T=["7","8","9","÷","4","5","6","×","1","2","3","−","0",",","=","+","C","⌫"];
  $("calc").innerHTML=`<div class="ecran" id="ecran" aria-live="polite">0</div><div class="touches">${T.map(t=>
    `<button data-t="${t}" class="${"÷×−+".includes(t)?"op":t==="="?"eg":""}${t==="C"||t==="⌫"?" large":""}" aria-label="${{"÷":"diviser","×":"multiplier","−":"moins","+":"plus","⌫":"effacer","C":"tout effacer"}[t]||t}">${t}</button>`).join("")}</div>
    <button class="outil" id="bCopie" style="margin-top:.5rem;width:100%">↳ Mettre le résultat dans ma réponse</button>`;
  $("calc").querySelectorAll("[data-t]").forEach(x=>x.onclick=()=>touche(x.dataset.t));
  $("bCopie").onclick=()=>{const inp=$("inp");if(inp&&expr){calculerExpr();inp.value=expr;inp.focus()}};
}
function touche(t){
  if(t==="C")expr="";else if(t==="⌫")expr=expr.slice(0,-1);else if(t==="=")calculerExpr();else expr+=t;
  $("ecran").textContent=expr||"0";
}
function calculerExpr(){
  const e=expr.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/,/g,".");
  if(!/^[0-9.+\-*/]+$/.test(e))return;
  try{let r=Function(`"use strict";return (${e})`)();if(!isFinite(r)){expr="";$("ecran").textContent="Erreur";return}
    r=Math.round(r*10000)/10000;expr=String(r).replace(".",",");}catch(err){$("ecran").textContent="Erreur";expr="";return}
  $("ecran").textContent=expr;
}
function basculerCalc(){const c=$("calc");c.hidden=!c.hidden}

/* ===== Voix ===== */
let voix=null;
function choisirVoix(){const l=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));voix=l.find(x=>/fr-FR/i.test(x.lang)&&/(google|natural|online|amélie|thomas|denise|henri)/i.test(x.name))||l.find(x=>/fr-FR/i.test(x.lang))||l[0]||null}
if("speechSynthesis" in window){choisirVoix();speechSynthesis.onvoiceschanged=choisirVoix}
function lire(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/SMIC/g,"smic"));u.lang="fr-FR";if(voix)u.voice=voix;u.rate=.95;speechSynthesis.speak(u)}
function arreterVoix(){if("speechSynthesis" in window)speechSynthesis.cancel()}

demarrer("victor");
</script>
</body>
