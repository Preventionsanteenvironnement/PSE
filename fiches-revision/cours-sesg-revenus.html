<script>window.COURS = {"slug":"capa_SESG_revenus","classe":"CAPa Jardinier paysagiste · Horticulture","retour":"../index.html","pied":"SESG — Le ménage et ses revenus. CAPa. M. MECHERI. Situation construite pour le cours ; sources indiquées sous chaque document.","version":"4.1","entete":{"module_code":"SESG","titre":"Le ménage et ses revenus","niveau":"CAPa","annee":"2026-27","thematique":"MG1 · SESG (CG1.2 · CCF2)","objectif_general":"Identifier les sources de revenus possibles pour satisfaire les besoins d'un ménage."},"blocks":[{"id":"b_seance_01","type":"seance","data":{"numero":"1","titre":"Le ménage, le salarié et le travailleur indépendant","objectif":"1. Définir un ménage. 2. Distinguer un salarié d'un travailleur indépendant.","competences":[]}},{"id":"b_situ_01","type":"situation","data":{"texte":"Victor est ouvrier paysagiste. Il travaille en CDI dans une entreprise d'aménagement d'espaces verts, les Jardins du Rhône.\nSa compagne Amanda est micro-entrepreneuse : elle réalise des travaux administratifs pour de petites entreprises. Ils vivent dans le même logement avec leurs deux enfants.\nCe soir, ils remplissent un dossier de demande de prêt. La banque demande : « Indiquez l'ensemble des ressources mensuelles du ménage. »\nVictor sort son bulletin de paie. Amanda hésite : elle a encaissé 1 640 euros ce mois-ci, mais il ne lui reste pas cette somme.","source":""}},{"id":"b_doc_01","type":"document_texte_image","data":{"label":"DOC. 1","titre":"Qu'appelle-t-on un ménage ?","corps":"Définition du ménage au sens du ménage-logement, avec trois cas : une personne seule, des colocataires, un enfant majeur logé ailleurs.","source":"INSEE, définition du ménage au sens du ménage-logement, 2026.","variante":"ecran","img":"images/sesg-revenus_menage.jpg","img_desc":"Encadré de définition à bordure noire. Phrase d'entrée : « Au sens du ménage-logement, un ménage est constitué des personnes qui habitent habituellement dans le même logement, qu'elles aient ou non un lien de parenté. C'est cette définition qui est employée dans ce cours. » Trois cadres côte à côte, chacun avec un titre en blanc sur fond noir. Premier cadre, « Une personne seule » : « Elle constitue à elle seule un ménage. » Deuxième cadre, « Des colocataires » : « Sans lien de parenté, ils forment un seul ménage. » Troisième cadre, « Un enfant majeur logé ailleurs » : « Il forme un ménage distinct de celui de ses parents, même s'il reste de la famille. » Bandeau du bas, « À quoi elle sert » : « Cette notion permet d'étudier les ressources et les dépenses des personnes qui vivent dans un même logement. » Source en petits caractères, en bas à droite : INSEE, définition du ménage au sens du recensement (ménage-logement), 2026."}},{"id":"b_chap_s1_1","type":"question_chapeau","data":{"numero":"1","texte":"A partir de la situation et du document 1 :","reponse_attendue":""}},{"id":"b_s1_q1_1","type":"sous_question","data":{"competence":"CG1.2","numero":"1.1","texte":"**Indiquer** combien de personnes composent le ménage de Victor et Amanda, en écrivant un nombre.","lignes":1,"style_lignes":"tiret_guide","support_type":"lignes","reponse_attendue":"Le ménage compte quatre personnes.","indice":"","variantes":{"adapte":{}},"niveaux":["standard","adapte"]},"el":{"standard":{"indice":"Situation : les personnes qui vivent dans le même logement que Victor.","explication":"Victor, Amanda et leurs deux enfants vivent dans le même logement. 1 + 1 + 2 = 4. Le ménage compte quatre personnes."},"adapte":{"indice":"Situation : Victor, sa compagne et les enfants qui vivent avec eux.","explication":"Victor, Amanda et leurs deux enfants habitent le même logement. Le ménage compte **quatre** personnes."}}},{"id":"b_s1_q1_1_ess","type":"qcm","data":{"competence":"CG1.2","numero":"1.1","titre":"","consigne":"**Indiquer** combien de personnes composent le ménage de Victor et Amanda, en cochant une seule case.","items":[{"question":"","options":["Deux personnes","Trois personnes","Quatre personnes"],"reponse":2}],"niveaux":["essentiel"]},"el":{"essentiel":{"indice":"Situation : la phrase sur le logement et les enfants.","explication":"Victor + Amanda + deux enfants = quatre personnes. Tous vivent dans le même logement. Réponse : quatre personnes."}}},{"id":"b_s1_q1_2","type":"sous_question","data":{"competence":"CG1.2","numero":"1.2","texte":"**Expliquer** pourquoi le frère d'Amanda, qui habite un autre appartement, ne fait pas partie de ce ménage.","lignes":3,"style_lignes":"tiret_guide","support_type":"lignes","reponse_attendue":"Le frère d'Amanda habite un autre logement : le lien de parenté ne définit pas le ménage.","indice":"","variantes":{"adapte":{"texte":"**Compléter** la phrase qui explique pourquoi le frère d'Amanda ne fait pas partie de ce ménage.","lignes":2}},"niveaux":["standard","adapte"]},"el":{"standard":{"indice":"DOC. 1 : la phrase d'entrée et le cadre « Un enfant majeur logé ailleurs ».","explication":"Un ménage regroupe les personnes qui habitent le même logement. Le frère d'Amanda habite un autre appartement. Le lien de parenté ne suffit pas. Il forme un autre ménage, comme l'enfant majeur logé ailleurs du DOC. 1."},"adapte":{"indice":"DOC. 1 : la phrase d'entrée, avec les mots « même logement » et « lien de parenté ».","explication":"Un ménage = les personnes qui habitent le même logement. Le frère d'Amanda n'habite pas le même logement. Être de la même famille ne suffit pas. Mots attendus : logement, parenté."}}},{"id":"b_s1_q1_2_ess","type":"qcm","data":{"competence":"CG1.2","numero":"1.2","titre":"","consigne":"**Indiquer** pourquoi le frère d'Amanda ne fait pas partie de ce ménage, en cochant une seule case.","items":[{"question":"","options":["Il n'habite pas le même logement.","Il est majeur.","Il n'a pas de lien de parenté avec Amanda."],"reponse":0}],"niveaux":["essentiel"]},"el":{"essentiel":{"indice":"DOC. 1 : ce que partagent les personnes d'un même ménage.","explication":"Un ménage = les personnes qui vivent dans le même logement. Le frère d'Amanda vit dans un autre appartement. Il est de la famille, mais cela ne compte pas pour le ménage."}}},{"id":"b_doc_02","type":"document_texte_image","data":{"label":"DOC. 2","titre":"Le salarié et le travailleur indépendant","corps":"Le salarié travaille pour un employeur, qui lui verse un salaire. Le travailleur indépendant vend ses produits ou ses services à des clients : il réalise un chiffre d'affaires, dont il déduit ses dépenses et ses cotisations pour obtenir un revenu disponible lié à son activité.","source":"D'après service-public.gouv.fr, rubriques Salarié et Micro-entrepreneur, 2026.","variante":"ecran","img":"images/sesg-revenus_remunerations.jpg","img_desc":"Infographie en couleurs, en deux colonnes. Colonne de gauche, titre bleu « Le salarié » : « Le salarié travaille pour un employeur. En échange de son travail, il reçoit un salaire. » ; dessin d'un jeune homme en casquette verte portant une caisse de salades, à côté d'un schéma : cadre « Employeur (exploitation agricole, entreprise, collectivité…) » avec un bâtiment, flèche « Verse » vers le cadre « Un salaire (brut, puis net après cotisations) » avec des pièces en euros. Sous ce schéma, cadre « Le salaire permet de : financer la vie quotidienne ; être protégé en cas de maladie, d'accident, de retraite… ; acquérir des droits (santé, retraite, chômage sous conditions). » Colonne de droite, titre vert « Le travailleur indépendant (ex. : agriculteur, artisan, commerçant, micro-entrepreneur) » : « Le travailleur indépendant vend ses produits ou ses services à des clients. Il réalise un chiffre d'affaires, dont il doit déduire ses dépenses et ses cotisations pour obtenir un revenu disponible lié à son activité. » Dessin d'une jeune femme portant une caisse de tomates devant une serre, à côté d'un calcul en colonne avec une facture en euros : « Ventes de produits ou de services = Chiffre d'affaires », moins « Dépenses nécessaires à l'activité (achats, matériel, frais de fonctionnement…) », moins « Cotisations sociales (selon la nature de l'activité) », égal « Revenu disponible lié à l'activité (pour le travailleur indépendant) ». Sous ce calcul, cadre « Le revenu de l'indépendant permet de : financer la vie personnelle et professionnelle ; cotiser pour sa protection sociale (santé, retraite…) ; varier selon le niveau d'activité et les résultats de l'entreprise. » Bandeau orange du bas, « À retenir », en trois points : « Le salaire est un revenu versé par un employeur à un salarié. » ; « Le chiffre d'affaires n'est pas un revenu : il correspond aux ventes réalisées. » ; « Le revenu d'un indépendant est ce qu'il reste après avoir payé les dépenses et les cotisations. »"}},{"id":"b_chap_s1_2","type":"question_chapeau","data":{"numero":"2","texte":"A partir du document 2 :","reponse_attendue":""}},{"id":"b_s1_q2_1","type":"sous_question","data":{"competence":"CG1.2","numero":"2.1","texte":"**Classer** les quatre situations, en écrivant la catégorie en face de chaque ligne.","lignes":0,"style_lignes":"tiret_guide","support_type":"lignes","reponse_attendue":"Salarié - Indépendant - Indépendant - Salarié.","indice":"","variantes":{"essentiel":{"texte":"**Classer** les quatre situations, en écrivant la catégorie en face de chaque ligne. Mots à utiliser : salarié, indépendant."}}},"el":{"standard":{"indice":"DOC. 2 : qui paie le salarié, qui paie le travailleur indépendant.","explication":"Ouvrier paysagiste employé par une entreprise : un employeur lui verse un salaire, donc salarié. Agriculteur qui vend sa production : il vend à des clients, donc indépendant. Micro-entrepreneuse : elle vend ses services à des clients, donc indépendante. Agent employé par une commune : la commune est son employeur, donc salarié."},"adapte":{"indice":"DOC. 2 : le mot « employeur » pour le salarié, le mot « clients » pour l'indépendant.","explication":"Première ligne déjà remplie : salarié. Agriculteur qui vend sa production : des clients, donc indépendant. Micro-e e logement, avec ou sans lien de parenté."},{"notion":"Salarié","definition":"Personne qui travaille pour un employeur et reçoit un salaire."},{"notion":"Salaire","definition":"Rémunération versée par un employeur à un salarié."},{"notion":"Travailleur indépendant","definition":"Personne qui vend ses produits ou ses services à des clients : agriculteur, artisan, commerçant, micro-entrepreneur."},{"notion":"Chiffre d'affaires","definition":"Total encaissé auprès des clients par un indépendant, avant toute dépense."},{"notion":"Honoraires","definition":"Nom de la rémunération versée par le client à une profession libérale."}]}},{"id":"b_auto_01","type":"auto_eval","data":{"questions":[{"type":"vf","consigne":"Deux colocataires sans lien de parenté forment un seul ménage.","options":["Vrai","Faux"],"correct":"Vrai"},{"type":"qcm","consigne":"**Indiquer** la rémunération versée par un employeur à un salarié.","options":["Un salaire","Un chiffre d'affaires","Une allocation","Un loyer"],"correct":"Un salaire"},{"type":"qcm","consigne":"**Indiquer** qui paie un travailleur indépendant.","options":["Ses clients","Son employeur","La collectivité"],"correct":"Ses clients"},{"type":"redige","consigne":"**Nommer** ce que réalise un travailleur indépendant en vendant ses produits.","options":[],"correct":"Un chiffre d'affaires."},{"type":"redige","consigne":"**Nommer** ce qui reste à l'indépendant après ses dépenses et ses cotisations.","options":[],"correct":"La somme restant disponible."}],"remed_rouge":"Relire la phrase d'entrée du document 1, puis refaire la question 1.2.","remed_orange":"Relire le cadre de droite du document 2 : chiffre d'affaires, dépenses, cotisations, somme restant disponible.","remed_vert":"La définition du ménage et la distinction salarié indépendant sont acquises.","variantes":{"adapte":{"questions":[{"type":"vf","consigne":"Deux colocataires sans lien de parenté forment un seul ménage.","options":["Vrai","Faux"],"correct":"Vrai"},{"type":"qcm","consi vice-public.gouv.fr, 2026.","variante":"ecran","img":"images/sesg-revenus_bulletin-paie.jpg","img_desc":"Bulletin de paie en noir et blanc, format portrait. En haut à gauche, l'employeur : LES JARDINS DU RHÔNE, entreprise d'aménagement d'espaces verts, 14 route des Peupliers, 69100 Villeurbanne, SIRET 000 000 000 00000, code APE 81.30Z, convention collective nationale des entreprises du paysage ; en haut à droite, le titre BULLETIN DE PAIE, période septembre, du 1er au 30 septembre, et le cadre Salarié : Victor M., ouvrier paysagiste, CDI temps plein, ancienneté depuis le 1er mars 2022. Tableau à quatre colonnes (Désignation, Base, Part salarié, Part employeur), partie Rémunération : salaire de base temps plein, 151,67 h, 1 950,00 € ; heures supplémentaires, 0,00 h, 0,00 € ; SALAIRE BRUT, 151,67 h, 1 950,00 €. Partie Cotisations et contributions sociales, avec base, part salarié et part employeur : vieillesse plafonnée et déplafonnée, 1 950,00 €, 142,35 €, 199,00 € ; retraite complémentaire Agirc-Arrco, 1 950,00 €, 78,20 €, 117,00 € ; CSG déductible de l'impôt, 1 915,88 €, 130,28 €, sans part employeur ; CSG et CRDS non déductibles, 1 915,88 €, 55,56 €, sans part employeur ; complémentaire santé, 1 950,00 €, 3,61 €, 12,00 € ; santé, maladie, maternité, invalidité, décès, 1 950,00 €, sans part salarié, 136,50 € ; accidents du travail, famille, autres, 1 950,00 €, sans part salarié, 225,50 € ; TOTAL DES COTISATIONS : 410,00 € part salarié et 690,00 € part employeur. Quatre grands cadres superposés : NET À PAYER AVANT IMPÔT SUR LE REVENU, salaire brut moins cotisations salariales, 1 540,00 € ; impôt sur le revenu prélevé à la source, retenu directement par l'employeur et reversé au Trésor public, − 42,00 € ; NET PAYÉ EN EUROS, versé par virement le 30 septembre, 1 498,00 € ; coût total pour l'employeur, salaire brut 1 950,00 € plus cotisations patronales 690,00 €, 2 640,00 €. En bas, trois petits cadres : Congés payés (acquis 12,50 jours, pris 0,00 jour, solde 12,50 jours) ; Cumuls depuis janvier (salaire brut 17 550,00 €, net avant impôt 13 860,00 €, heures travaillées 1 365,03 h) ; Paiement (mode virement bancaire, date 30 septembre, organisme Mutualité sociale agricole). Pied de page : « Entreprise et salarié fictifs. Modèle d'après service-public.gouv.fr, rubrique Bulletin de paie, 2026. Dans l'intérêt du salarié et pour lui permettre de faire valoir ses droits, ce bulletin est à conserver sans limitation de durée. »"}},{"id":"b_chap_s2_1","type":"question_chapeau","data":{"numero":"1","texte":"A partir du document 3 :","reponse_attendue":""}},{"id":"b_s2_q1_1","type":"sous_question","data":{"competence":"CG1.2","numero":"1.1","texte":"**Relever** le salaire brut de Victor, son net payé et le coût total pour l'employeur.","lignes":3,"style_lignes":"tirets_comptage","support_type":"lignes","reponse_attendue":"1 950,00 euros - 1 498,00 euros - 2 640,00 euros","indice":"","lignes_par_reponse":1,"variantes":{"adapte":{},"essentiel":{}}},"el":{"standard":{"indice":"DOC. 3 : la ligne SALAIRE BRUT, puis les cadres NET PAYÉ EN EUROS et Coût total pour l'employeur.","explication":"Salaire brut : 1 950,00 €, ligne SALAIRE BRUT du DOC. 3. Net payé : 1 498,00 €, cadre NET PAYÉ EN EUROS, somme versée par virement le 30 septembre. Coût total pour l'employeur : 2 640,00 €, soit 1 950,00 + 690,00 de cotisations patronales."},"adapte":{"indice":"DOC. 3 : la ligne SALAIRE BRUT, puis les grands cadres du bas.","explication":"Salaire brut : 1 950,00 €, ligne SALAIRE BRUT du DOC. 3. Net payé : 1 498,00 €, cadre NET PAYÉ EN EUROS, somme versée par virement le 30 septembre. Coût total pour l'employeur : 2 640,00 €, soit 1 950,00 + 690,00 de cotisations patronales."},"essentiel":{"indice":"DOC. 3 : les mots SALAIRE BRUT, NET PAYÉ et Coût total, écrits en gras.","explication":"Salaire brut : 1 950,00 €. Net payé : 1 498,00 €, la somme versée sur le compte de Victor. Coût total pour l'employeur : 2 640,00 €."}}},{"id":"b_txt_rap_s2_1","type":"texte_libre","data":{"texte":"Rappel : salaire brut 1 950,00 euros, net payé 1 498,00 euros."}},{"id":"b_s2_q1_2","type":"sous_question","data":{"competence":"CG1.2","numero":"1.2","texte":"**Calculer** l'écart entre le salaire brut et le net payé de Victor.","lignes":2,"style_lignes":"tiret_guide","support_type":"lignes","reponse_attendue":"1 950,00 - 1 498,00 = 452,00 euros","indice":"","variantes":{"adapte":{},"essentiel":{"texte":"**Calculer** 1 950,00 - 1 498,00 à la calculatrice, puis écrire le résultat.","lignes":1}}},"el":{"standard":{"indice":"Rappel : le salaire brut et le net payé ; le plus grand montant moins le plus petit.","explication":"Écart = salaire brut − net payé. 1 950,00 − 1 498,00 = 452,00 €. Victor reçoit 452,00 € de moins que son salaire brut."},"adapte":{"indice":"Rappel : les deux montants à soustraire.","explication":"Écart = salaire brut − net payé. 1 950,00 − 1 498,00 = 452,00 €."},"essentiel":{"indice":"Calculatrice : 1950 − 1498.","explication":"1 950,00 − 1 498,00 = 452,00 €. Écart entre le salaire brut et le net payé : 452,00 €."}}},{"id":"b_s2_q1_3","type":"sous_question","data":{"competence":"CG1.2","numero":"1.3","texte":"**Nommer** les deux prélèvements qui composent cet écart.","lignes":2,"style_lignes":"tirets_comptage","support_type":"lignes","reponse_attendue":"Les cotisations salariales, 410,00 euros. Le prélèvement à la source, 42,00 euros.","indice":"","lignes_par_reponse":1,"variantes":{"adapte":{}},"niveaux":["standard","adapte"]},"el":{"standard":{"indice":"DOC. 3 : la ligne TOTAL DES COTISATIONS, colonne Part salarié, et le cadre sur l'impôt sur le revenu.","explication":"Premier prélèvement : les cotisations salariales, 410,00 €. 1 950,00 − 410,00 = 1 540,00 €. Second prélèvement : l'impôt sur le revenu prélevé à la source, 42,00 €. 1 540,00 − 42,00 = 1 498,00 €. Vérification : 410,00 + 42,00 = 452,00 €, l'écart de la question 1.2."},"adapte":{"indice":"DOC. 3 : les deux montants retirés entre SALAIRE BRUT et NET PAYÉ.","explication":"Cotisations salariales : 410,00 €. Prélèvement à la source : 42,00 €. 410,00 + 42,00 = 452,00 €, l'écart de la question 1.2."}}},{"id":"b_s2_q1_3_ess","type":"cocher_exactes","data":{"competence":"CG1.2","numero":"1.3","consigne":"**Cocher** les deux prélèvements qui composent cet écart.","items":[{"texte":"Les cotisations salariales","correct":true},{"texte":"Le prélèvement à la source de l'impôt sur le revenu","correct":true},{"texte":"Les congés payés","correct":false},{"texte":"Les heures supplémentaires","correct":false}],"niveaux":["essentiel"]},"el":{"essentiel":{"indice":"DOC. 3 : les deux montants retirés entre le salaire brut et le net payé.","explication":"Cotisations salariales : 410,00 €. Prélèvement à la source de l'impôt : 42,00 €. 410,00 + 42,00 = 452,00 €. Congés payés et heures supplémentaires ne sont pas des prélèvements : 0,00 h d'heures supplémentaires sur le bulletin."}}},{"id":"b_doc_04","type":"document_texte_image","data":{"label":"DOC. 4","titre":"Le SMIC, salaire minimum légal","corps":"Le SMIC est le salaire minimum interprofessionnel de croissance. Montants en vigueur et méthode de vérification par le taux horaire brut.","source":"Arrêté du 22 mai 2026 relatif au relèvement du SMIC, travail-emploi.gouv.fr.","variante":"ecran","img":"images/sesg-revenus_smic.jpg","img_desc":"Encadré à bordure noire sur le SMIC. Phrase d'entrée : « Aucun employeur ne peut verser moins que le SMIC, le salaire minimum interprofessionnel de croissance. Il est révisé au moins une fois par an, et peut l'être en cours d'année. » Deux cadres côte à côte, titres en blanc sur fond noir. Cadre de gauche, « Au 1er juin 2026, par heure » : 12,31 € en grands chiffres, « brut de l'heure ». Cadre de droite, « Soit, pour un temps plein » : 1 867,02 € en grands chiffres, « brut par mois, pour 151,67 heures ». Bandeau du bas, « Comment vérifier » : « On ne compare pas les montants mensuels. On calcule le taux horaire brut, en divisant le salaire brut par le nombre d'heures travaillées, puis on le compare au SMIC horaire. » Source en petits caractères, en bas à droite : Ministère du travail, « Le SMIC », montant au 1er juin 2026, travail-emploi.gouv.fr."}},{"id":"b_chap_s2_2","type":"question_chapeau","data":{"numero":"2","texte":"A partir des documents 3 et 4 :","reponse_attendue":""}},{"id":"b_s2_q2_1","type":"sous_question","data":{"competence":"CG1.2","numero":"2.1","texte":"**Calculer** le taux horaire brut de Victor, arrondi au centime.","lignes":2,"style_lignes":"tiret_guide","support_type":"lignes","reponse_attendue":"1 950,00 divisé par 151,67 = 12,86 euros","indice":"","variantes":{"adapte":{},"essentiel":{"texte":"**Calculer** 1 950,00 divisé par 151,67 à la calculatrice, puis écrire le résultat arrondi au centime.","lignes":1}}},"el":{"standard":{"indice":"DOC. 4 : le cadre COMMENT VÉRIFIER ; DOC. 3 : le salaire brut et le nombre d'heures.","explication":"Taux horaire brut = salaire brut ÷ nombre d'heures. 1 950,00 ÷ 151,67 = 12,857. Arrondi au centime : 12,86 € par heure."},"adapte":{"indice":"DOC. 3 : la ligne SALAIRE BRUT, colonnes Base et Part salarié.","explication":"Taux horaire brut = salaire brut ÷ heures. 1 950,00 ÷ 151,67 = 12,857. Arrondi au centime : 12,86 €."},"essentiel":{"indice":"Calculatrice : 1950 ÷ 151,67, puis deux chiffres après la virgule.","explication":"1 950,00 ÷ 151,67 = 12,857. Troisième chiffre après la virgule : 7, donc le centime monte. Résultat : 12,86 €."}}},{"id":"b_txt_rap_s2_2","type":"texte_libre","data":{"texte":"Rappel : taux horaire brut de Victor 12,86 euros, SMIC horaire brut 12,31 euros."}},{"id":"b_s2_q2_2","type":"qcm","data":{"competence":"CG1.2","numero":"2.2","titre":"","consigne":"**Indiquer** si l'employeur de Victor respecte le SMIC, en cochant une seule case.","items":[{"question":"","options":["L'employeur respecte le SMIC.","L'employeur ne respecte pas le SMIC.","Le document ne permet pas de le savoir."],"reponse":0}]},"el":{"standard":{"indice":"Rappel : le ta NT DISPONIBLE"},{"type":"eleve","content":"","reponse":"1 070,00 euros"}]],"table_student_style":"lines","source":"Données fictives. Structure d'après service-public.gouv.fr, rubrique Micro-entrepreneur, 2026."},"el":{"standard":{"indice":"TOTAL DES SORTIES : les trois montants sous le chiffre d'affaires. SOMME RESTANT DISPONIBLE : ce qui reste du chiffre d'affaires après les sorties.","explication":"Total des sorties : 345 + 185 + 40 = 570 €. Somme restant disponible : 1 640 − 570 = 1 070 €. Les 1 640 € encaissés ne restent pas en entier à Amanda : les cotisations et les frais de l'activité sont retirés."}}},{"id":"b_chap_s3_1","type":"question_chapeau","data":{"numero":"1","texte":"A partir du document 5 :","reponse_attendue":""}},{"id":"b_s3_q1_1","type":"sous_question","data":{"competence":"CG1.2","numero":"1.1","texte":"**Calculer** le total des sorties de la micro-entreprise d'Amanda, et l'écrire dans le document 5.","lignes":0,"style_lignes":"tiret_guide","support_type":"lignes","reponse_attendue":"345,00 + 185,00 + 40,00 = 570,00 euros","indice":"","variantes":{"adapte":{"texte":"**Calculer** 345,00 + 185,00 + 40,00 et écrire le résultat dans le document 5."},"essentiel":{"texte":"**Calculer** 345,00 + 185,00 + 40,00 à la calculatrice, et écrire le résultat dans le document 5."}}},"el":{"standard":{"indice":"DOC. 5 : les trois lignes placées sous le chiffre d'affaires.","explication":"Sorties = cotisations sociales + déplacements et petit matériel + assurance professionnelle. 345,00 + 185,00 + 40,00 = 570,00 €. Le chiffre d'affaires est une entrée, pas une sortie."},"adapte":{"indice":"DOC. 5 : la ligne TOTAL DES SORTIES, pour écrire le résultat.","explication":"345,00 + 185,00 + 40,00 = 570,00 €. Total des sorties : cotisations, déplacements et matériel, assurance."},"essentiel":{"indice":"Calculatrice : 345 + 185 + 40.","explication":"345,00 + 185,00 + 40,00 = 570,00 €. Résultat à écrire sur la ligne TOTAL DES SORTIES."}}},{"id":"b_txt_rap_s3_1","type":"texte_libre","data":{"texte":"Rappel : chiffre d'affaires encaissé 1 640,00 euros, total des sorties 570,00 euros."}},{"id":"b_s3_q1_2","type":"sous_question","data":{"competence":"CG1.2","numero":"1.2","texte":"**Calculer** la somme qui reste disponible à Amanda, et l'écrire dans le document 5.","lignes":0,"style_lignes":"tiret_guide","support_type":"lignes","reponse_attendue":"1 640,00 - 570,00 = 1 070,00 euros","indice":"","variantes":{"adapte":{"texte":"**Calculer** 1 640,00 - 570,00 et écrire le résultat dans le document 5."},"essentiel":{"texte":"**Calculer** 1 640,00 - 570,00 à la calculatrice, et écrire le résultat dans le document 5."}}},"el":{"standard":{"indice":"Rappel : le chiffre d'affaires encaissé et le total des sorties.","explication":"Somme restant disponible = chiffre d'affaires − total des sorties. 1 640,00 − 570,00 = 1 070,00 €. Résultat à écrire sur la dernière ligne du DOC. 5."},"adapte":{"indice":"DOC. 5 : la ligne SOMME RESTANT DISPONIBLE, pour écrire le résultat.","explication":"Somme restant disponible = chiffre d'affaires − total des sorties. 1 640,00 − 570,00 = 1 070,00 €. Résultat à écrire sur la dernière ligne du DOC. 5."},"essentiel":{"indice":"Calculatrice : 1640 − 570.","explication":"1 640,00 − 570,00 = 1 070,00 €. Résultat à écrire sur la ligne SOMME RESTANT DISPONIBLE."}}},{"id":"b_s3_q1_3","type":"sous_question","data":{"competence":"CG1.2","numero":"1.3","texte":"**Expliquer** pourquoi les 1 640 € encaissés par Amanda ne correspondent pas à la somme qui lui reste.","lignes":3,"style_lignes":"tiret_guide","support_type":"lignes","reponse_attendue":"Amanda doit payer 570 € de cotisations et de frais. Il lui reste 1 070 €.","indice":"","variantes":{"adapte":{"texte":"**Compléter** la phrase qui explique pourquoi Amanda hésitait à annoncer 1 640 euros.","lignes":2}},"niveaux":["standard","adapte"]},"el":{"standard":{"indice":"Situation : les 1 640 euros encaissés ; DOC. 5 : les sorties à payer.","explication":"Les 1 640 € sont un chiffre d'affaires : l'argent encaissé auprès des clients. Amanda paie ensuite 570 € de cotisations, de frais et d'assurance. 1 640 − 570 = 1 070 €. Seuls 1 070 € restent disponibles."},"adapte":{"indice":"Questions 1.1 et 1.2 : le nom des 1 640 euros et le résultat de la soustraction.","explication":"1 640 € = chiffre d'affaires, avant toute dépense. 1 640 − 570 = 1 070 €. Mots attendus : chiffre d'affaires, 1 070."}}},{"id":"b_s3_q1_3_ess","type":"qcm","data":{"competence":"CG1.2","numero":"1.3","titre":"","consigne":"**Indiquer** pourquoi Amanda hésitait à annoncer 1 640 euros, en cochant une seule case.","items":[{"question":"","options":["Il reste 1 070 euros une fois les charges réglées.","Elle a oublié une facture.","La banque n'accepte pas les micro-entreprises."],"reponse":0}],"niveaux":["essentiel"]},"el":{"essentiel":{"indice":"Question 1.2 : la somme qui reste à Amanda.","explication":"1 640 € = argent encaissé. Moins 570 € de sorties, il reste 1 070 €. La situation ne parle ni de facture oubliée, ni d'un refus de la banque."}}},{"id":"b_doc_06","type":"document_texte_image","data":{"label":"DOC. 6","titre":"Les trois types de revenus d’un ménage","corps":"1. REVENU D’ACTIVITÉ\nArgent obtenu grâce au travail.\nExemples : salaire, revenu d’un travailleur indépendant.\n\n2. REVENU DU CAPITAL\nArgent obtenu grâce à ce que l’on possède.\nExemples : loyer perçu, intérêts d’un livret d’épargne.\n\n3. REVENU DE TRANSFERT\nArgent versé par la protection sociale.\nExemples : allocations familiales, retraite, RSA, allocation chômage.\n\nDu travail → revenu d’activité\nDe ce que l’on possède → revenu du capital\nDe la protection sociale → revenu de transfert","source":"service-public.gouv.fr, rubriques Prestations familiales et Revenus du patrimoine, 2026.","img":"images/sesg-revenus_b_doc_06.jpg","img_desc":"Affiche en noir et blanc intitulée « Les trois types de revenus d'un ménage », avec le sous-titre « Un ménage peut avoir plusieurs sources de revenus. » Trois colonnes numérotées. Colonne 1, « Revenu d'activité » : « Argent obtenu grâce au travail. » ; dessins d'un ouvrier casqué, « Salarié (employé par une entreprise) », et d'une personne devant un ordinateur, « Travailleur indépendant (à son compte) » ; exemples : salaire, revenu d'un travailleur indépendant (artisan, commerçant, micro-entrepreneur…). Colonne 2, « Revenu du capital » : « Argent obtenu grâce à ce que l'on possède. » ; dessins d'une maison, « Loyer perçu (logement, garage…) », et d'une pile de pièces en euros, « Intérêts (livret d'épargne…) » ; exemples : loyer perçu d'un logement, intérêts d'un livret d'épargne, revenus d'actions, de placements. Colonne 3, « Revenu de transfert » : « Argent versé sous forme de prestations sociales. » ; dessins d'une famille, « Allocations familiales », d'une personne âgée avec une canne, « Pension de retraite », et d'un formulaire, « RSA et autres aides » ; exemples : allocations familiales (prestations familiales), pension de retraite, RSA, allocation chômage, AAH et autres prestations sociales. Bandeau du bas, « À retenir » : « Les revenus d'un ménage peuvent venir : » « du travail », flèche vers « revenu d'activité » ; « de ce que l'on possède », flèche vers « revenu du capital » ; « de la protection sociale », flèche vers « revenu de transfert ».","img_w":1000,"img_h":667}},{"id":"b_chap_s3_2","type":"question_chapeau","data":{"numero":"2","texte":"A partir du document 6 :","reponse_attendue":""}},{"id":"b_s3_q2_1","type":"sous_question","data":{"competence":"CG1.2","numero":"2.1","texte":"**Classer** les six ressources, en écrivant la catégorie en face de chaque ligne.","lignes":0,"style_lignes":"tiret_guide","support_type":"lignes","reponse_attendue":"Activité - Capital - Transfert - Activité - Capital - Transfert.","indice":"","variantes":{"essentiel":{"texte":"**Classer** les six ressources, en écrivant la catégorie en face de chaque ligne. Mots à utiliser : revenu d'activité, revenu du capital, revenu de transfert."}}},"el":{"standard":{"indice":"DOC. 6 : le bandeau À RETENIR, avec le travail, ce qui est possédé et la protection sociale.","explication":"Salaire net de Victor : argent du travail, revenu d'activité. Loyer du garage : argent d'un bien possédé, revenu du capital. Allocations familiales : protection sociale, revenu de transfert. Somme restant à Amanda : travail d'indépendante, revenu d'activité. Intérêts d'un livret d'épargne : revenu du capital. Pension de retraite : revenu de transfert."},"adapte":{"indice":"DOC. 6 : les exemples écrits dans chacune des trois colonnes.","explication":"Première ligne déjà remplie. Loyer du garage : revenu du capital. Allocations familiales : revenu de transfert. Somme restant à Amanda : revenu d'activité, car elle vient de son travail. Intérêts d'un livret : revenu du capital. Pension de retraite : revenu de transfert."},"essentiel":{"indice":"DOC. 6 : les dessins et les exemples des trois colonnes.","explication":"Loyer du garage : un bien possédé, revenu du capital. Somme restant à Amanda : son travail, revenu d'activité. Pension de retraite : protection sociale, revenu de transfert."}}},{"id":"b_s3_tab_2_1","type":"tableau","data":{"titre":"","cells":[[{"type":"prof","content":"Ressource"},{"type":"prof","content":"Catégorie"}],[{"type":"prof","content":"Le salaire net de Victor"},{"type":"eleve","content":"","reponse":"Revenu d'activité"}],[{"type":"prof","content":"Le loyer du garage"},{"type":"eleve","content":"","reponse":"Revenu du capital"}],[{"type":"prof","content":"Les allocations familiales"},{"type":"eleve","content":"","reponse":"Revenu de transfert"}],[{"type":"prof","content":"La somme restant à Amanda"},{"type":"eleve","content":"","reponse":"Revenu d'activité"}],[{"type":"prof","content":"Les intérêts d'un livret d'épargne"},{"type":"eleve","content":"","reponse":"Revenu du capital"}],[{"type":"prof","content":"Une pension de retraite"},{"type":"eleve","content":"","reponse":"Revenu de transfert"}]],"table_st
