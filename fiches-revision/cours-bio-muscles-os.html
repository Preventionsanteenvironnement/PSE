tent": "Élongation"}, {"type": "prof", "content": "Étirement d’un muscle avec déchirure de quelques fibres, sans hématome."}, {"type": "prof", "content": "Douleur pendant l’effort."}], [{"type": "prof", "content": "Déchirure (claquage)"}, {"type": "prof", "content": "Rupture d’un plus grand nombre de fibres d’un muscle, avec un hématome."}, {"type": "prof", "content": "Douleur brutale en coup de poignard ; le muscle ne peut plus bouger."}], [{"type": "prof", "content": "Entorse"}, {"type": "prof", "content": "Étirement ou déchirure d’un ligament lors d’une torsion brutale."}, {"type": "prof", "content": "Gonflement, parfois un bleu ; appui sur le pied douloureux, voire impossible."}], [{"type": "prof", "content": "Tendinite"}, {"type": "prof", "content": "Atteinte d’un tendon après des gestes répétés et intensifs."}, {"type": "prof", "content": "Douleur qui revient quand on répète le geste."}], [{"type": "prof", "content": "Fracture de fatigue"}, {"type": "prof", "content": "Petite fissure d’un os due à des chocs répétés, sans chute ni coup."}, {"type": "prof", "content": "Douleur après l’effort, qui disparaît au repos puis revient de plus en plus tôt."}]], "table_preset": "pse", "table_border": "fine", "table_row_height": "compact", "table_col_widths": [20, 45, 35], "table_student_style": "lines"}}, {"id": "bm_ch3_1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir de la situation et du document 5 :", "reponse_attendue": ""}}, {"id": "bm_q3_1", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "1.1", "texte": "**Identifier** la lésion la plus probable de chaque personne, en complétant le tableau.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "", "indice": "", "reponse_allegee": "", "niveaux": ["standard"]}, "el": {"standard": {"indice": "DOC. 5 : la colonne « Signes ». Une lésion par personne de la situation.", "explication": "Juliette : entorse (cheville gonflée, ap "4", "titre": "Progresser sans se blesser", "objectif": "1. Relever les effets de l’entraînement et les besoins du muscle. 2. Proposer une mesure individuelle et une mesure collective de prévention.", "competences": ["CG2.2"]}}, {"id": "bm_sit4", "type": "situation", "data": {"source": "", "texte": "Après un mois de musculation, Thierry veut doubler ses charges dès la semaine prochaine. Juliette pense que c’est trop tôt. Bruno, le coach, se demande ce que sa salle pourrait mettre en place pour que les nouveaux inscrits progressent sans se blesser."}}, {"id": "bm_t4", "type": "analyse", "data": {"titre": "L’ENTRAÎNEMENT TRANSFORME LE CORPS"}}, {"id": "bm_doc8", "type": "document", "data": {"label": "DOC. 11", "titre": "Ce que l’entraînement change dans le corps", "cadre": true, "corps": "Avec un entraînement régulier, les muscles deviennent plus gros et plus forts. L’activité physique renforce aussi les os et les tendons.\nCes transformations se font progressivement, séance après séance. Si les efforts augmentent trop vite ou se répètent sans repos suffisant, l’os n’a pas le temps de se renforcer et les muscles fatigués amortissent moins les chocs : l’os peut se fissurer (fracture de fatigue).", "source": "D’après l’Inserm (expertise collective « Activité physique », 2008) et les Manuels MSD."}}, {"id": "bm_doc8b", "type": "document", "data": {"label": "DOC. 12", "titre": "Les besoins du muscle", "cadre": true, "corps": "Pour se contracter, un muscle a besoin de dioxygène et d’énergie. Il produit cette énergie à partir des nutriments, qui viennent de l’alimentation, et du dioxygène, qui vient de la respiration. Le sang lui apporte les deux.", "source": ""}}, {"id": "bm_ch4_1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir des documents 11 et 12 :", "reponse_attendue": ""}}, {"id": "bm_q4_1", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "1.1", "texte": "**Relever** deux effets de l’entraînement régulier sur le corps.", "p es d’ouverture.\nLe développé couché se pratique toujours avec un partenaire qui assure.", "source": ""}}, {"id": "bm_ch4_2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 13 :", "reponse_attendue": ""}}, {"id": "bm_q4_3", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "2.1", "texte": "**Relever** deux éléments d’une bonne posture au développé couché.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "lignes", "reponse_attendue": "– Les pieds à plat au sol.\n– Les fesses et les épaules posées sur le banc.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "absorber": false}, "el": {"standard": {"indice": "DOC. 13 : les deux premières phrases, les pieds et les fesses.", "explication": "Les pieds sont à plat au sol. Les fesses et les épaules restent posées sur le banc."}}}, {"id": "bm_q4_3e", "type": "qcm", "data": {"competence": "CG2.2", "numero": "2.1", "titre": "", "consigne": "**Cocher** un élément de bonne posture par ligne.", "items": [{"question": "Les pieds :", "options": ["à plat au sol", "posés sur le banc"], "reponse": 0}, {"question": "Les épaules :", "options": ["posées sur le banc", "soulevées du banc"], "reponse": 0}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 13 : les deux premières phrases.", "explication": "Les pieds sont à plat au sol. Les épaules restent posées sur le banc."}}}, {"id": "bm_t5", "type": "analyse", "data": {"titre": "REVENIR À LA SITUATION : PROPOSER DES SOLUTIONS"}}, {"id": "bm_ch4_3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir de la situation et des documents 11, 13 et 14 :", "reponse_attendue": ""}}, {"id": "bm_q4_4", "type": "sous_question", "data": {"competence": "CG2.2", "numero": "3.1", "texte": "**Proposer** une mesure individuelle pour que Thierry progresse sans se blesser.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_
