a": {"source": "", "texte": "Deux mois après son entrée, Kenza reçoit sa première facture d’électricité, pour janvier et février. Son assurance habitation lui coûte 144 € par an. La MSA lui verse une aide au logement de 60 € par mois.", "image_w": 1200, "image_h": 800, "image_nom": "Illustration : Kenza lit sa première facture d’électricité.", "image_pos": "droite", "image_largeur": 34, "img": "images/capa_SESG_se_loger_b_situation_02.jpg", "img_desc": "Illustration : Kenza lit sa première facture d’électricité.", "img_w": 1200, "img_h": 800}}, {"id": "b_doc_03", "type": "tableau", "data": {"titre": "DOC. 3 — La facture d’électricité de Kenza (janvier et février), exemple simplifié", "cells": [[{"type": "prof", "content": "Détail"}, {"type": "prof", "content": "Quantité"}, {"type": "prof", "content": "Montant"}], [{"type": "prof", "content": "Index au 1er janvier : 12 480 ; index au 28 février : 12 780"}, {"type": "prof", "content": ""}, {"type": "prof", "content": ""}], [{"type": "prof", "content": "Abonnement (part fixe)"}, {"type": "prof", "content": "2 mois × 14,00 €"}, {"type": "prof", "content": "28,00 €"}], [{"type": "prof", "content": "Consommation (part variable)"}, {"type": "prof", "content": "300 kWh × 0,20 €"}, {"type": "prof", "content": "60,00 €"}], [{"type": "prof", "content": "Taxes et contributions (TVA comprise)"}, {"type": "prof", "content": ""}, {"type": "prof", "content": "12,00 €"}], [{"type": "prof", "content": "Total à payer"}, {"type": "prof", "content": ""}, {"type": "prof", "content": "100,00 €"}]], "table_preset": "sobre", "table_border": "fine", "table_row_height": "normal", "table_col_widths": [52, 26, 22]}}, {"id": "b_doc_04", "type": "document", "data": {"label": "DOC. 4", "titre": "Le coût réel d’un logement", "cadre": true, "corps": "1. Une facture d’énergie comprend un **abonnement**, part fixe due chaque mois quelle que soit la consommation, une **consommation**, part variable, et des **taxes**.\n2. La consommation en **kilowattheures (kWh)** se calcule par différence : index de fin moins index de début.\n3. Les **charges locatives** s’ajoutent au loyer. Dans le studio de Kenza, elles comprennent l’eau, l’entretien des parties communes et l’enlèvement des ordures ménagères ; l’électricité est payée à part.\n4. La taxe d’habitation est supprimée pour la résidence principale. La **taxe foncière** est payée par le propriétaire, jamais par le locataire.\n5. **Coût réel du logement** = loyer + charges + électricité + assurance − aide au logement. Une même dépense ne se compte qu’une fois.\n6. **Part du salaire consacrée au logement** (en %) = coût réel ÷ salaire × 100.", "source": "D’après Service-Public.", "image_w": 1200, "image_h": 800, "image_nom": "Illustration : Kenza relève l’index du compteur électrique.", "image_pos": "droite", "image_largeur": 22, "img": "images/capa_SESG_se_loger_b_doc_04.jpg", "img_desc": "Illustration : Kenza relève l’index du compteur électrique.", "img_w": 1200, "img_h": 800}}, {"id": "b_chap_s2_1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 3 :", "reponse_attendue": ""}}, {"id": "b_s2_q1_1", "type": "sous_question", "data": {"competence": "CG1.2", "numero": "1.1", "texte": "**Calculer** la consommation d’électricité de Kenza en janvier et février, en kWh.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "calcul", "reponse_attendue": "Calcul : 12 780 − 12 480 = 300 kWh.\nRésultat : 300 kWh.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Calculer** la consommation d’électricité de Kenza, en complétant.\n12 780 − 12 480 = ……… kWh", "lignes": 0, "support_type": "lignes", "reponse_attendue": "300 kWh"}, "essentiel": {"texte": "**Calculer** à la calculatrice la consommation d’électricité de Kenza.\n12 780 − 12 480 = ……… kWh", "lignes": 0, "support_type": "lignes", "reponse_attendue": "300 kWh"}}}, "el": {"standard": {"indice": "DOC. 3 : les deux index de la première ligne de
