er** les trois mentions obligatoires sur l'étiquette d'un produit emballé.", "items": [{"texte": "La liste des ingrédients", "correct": true}, {"texte": "Le prix du produit dans un autre magasin", "correct": false}, {"texte": "La quantité nette", "correct": true}, {"texte": "La date de consommation", "correct": true}, {"texte": "Une recette de cuisine", "correct": false}]}, "el": {"standard": {"indice": "DOC. 4 : la liste des mentions de l’étiquette.", "explication": "Liste des ingrédients, quantité nette et date de consommation sont obligatoires. Le prix ailleurs et une recette ne sont pas des mentions obligatoires."}}}, {"id": "b_s2_q1_2", "type": "sous_question", "data": {"competence": "CG1.2", "numero": "1.2", "texte": "**Expliquer** ce que montre l'ordre de la liste des ingrédients.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Du plus important au moins important : le premier est le plus présent.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Expliquer** ce que montre l'ordre des ingrédients, en complétant.\nLe premier ingrédient de la liste est celui dont le produit contient le ……………………… .", "lignes": 0, "reponse_attendue": "plus"}}}, "el": {"standard": {"indice": "DOC. 4 : le point 2, « par ordre d’importance décroissante ».", "explication": "Les ingrédients sont écrits du plus important au moins important : le premier est celui que le produit contient le plus."}, "adapte": {"indice": "DOC. 4 : le point 2.", "explication": "Le premier ingrédient est celui que le produit contient le plus.", "trous": ["plus"]}}}, {"id": "b_s2_q1_2_ess", "type": "qcm", "data": {"competence": "CG1.2", "numero": "1.2", "titre": "", "consigne": "**Repérer** ce que montre l'ordre des ingrédients, en cochant la proposition exacte.", "items": [{"question": "Le premier ingrédient de la liste est :", "options": ["le moins cher", "le plus sucré", "celui dont le produit contient le plus"], "reponse": 2}], "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 4 : le point 2.", "explication": "Ordre décroissant : le premier ingrédient est le plus présent dans le produit."}}}, {"id": "b_ana_06", "type": "analyse", "data": {"titre": "LES DATES DE CONSOMMATION"}}, {"id": "b_doc_05", "type": "document", "data": {"label": "DOC. 5", "titre": "DLC et DDM : deux dates différentes", "cadre": true, "corps": "1. La **date limite de consommation** (DLC), « à consommer jusqu'au… », est une **limite impérative**. Elle concerne les aliments très périssables, conservés au frais : viande, poisson, plats cuisinés réfrigérés, yaourts. Après la DLC, l'aliment est **impropre à la consommation**.\n2. La **date de durabilité minimale** (DDM), « à consommer de préférence avant… », est **indicative**. Elle concerne les produits secs ou en conserve : pâtes, riz, café, conserves. Après la DDM, le produit peut encore être **consommé** s'il n'a pas été ouvert et n'est pas altéré ; il peut avoir perdu du goût.", "source": "D'après la DGCCRF et Service-Public", "image_largeur": 75, "img": "images/sesg-alimentation-dates-dlc-ddm.jpg", "img_desc": "Deux photos en gros plan : opercule de yaourt « À consommer jusqu'au : 12/09/2026 » ; paquet de pâtes « De préférence avant le : 28/09/2027 ».", "img_w": 1264, "img_h": 660}}, {"id": "b_chap_s2_2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 5 :", "reponse_attendue": ""}}, {"id": "b_s2_q2_1", "type": "classer", "data": {"competence": "CG1.2", "numero": "2.1", "titre": "", "consigne": "**Classer** chaque aliment selon la date qu'il porte, en écrivant DLC ou DDM dans le tableau.", "categories": ["DLC", "DDM"], "items": ["Un yaourt", "Un paquet de pâtes", "Du jambon sous vide", "Une boîte de conserve"], "classement": [0, 1, 0, 1], "indice": ""}, "el": {"standard": {"indice": "DOC. 5 : la DLC pour les produits frais, la DDM pour les produits secs ou en conserve.", "explication": "Yaourt et jambon sous vide, conservés au frais : DLC. Pâtes et conserve : DDM."}}}, {"id": "b_s2_q2_2", "type": "sous_question", "data": {"competence": "CG1.2", "numero": "2.2", "texte": "**Expliquer** ce que peut faire le ménage d'un paquet de riz dont la DDM est dépassée.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Le consommer si le paquet est fermé et le riz non altéré : la DDM est indicative.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Expliquer** ce que peut faire le ménage d'un riz dont la DDM est dépassée, en complétant.\nSi le paquet n'a pas été ouvert, le riz peut encore être ……………………… : la DDM est ……………………… .", "lignes": 0, "reponse_attendue": "consommé\nindicative"}}}, "el": {"standard": {"indice": "DOC. 5 : le point 2, ce qui se passe après la DDM.", "explication": "La DDM est indicative : un riz dont le paquet est fermé et qui n’est pas altéré peut encore être consommé ; il a seulement pu perdre du goût."}, "adapte": {"indice": "DOC. 5 : le point 2.", "explication": "Paquet fermé : le riz peut encore être consommé ; la DDM est indicative.", "trous": ["consomme|mange", "indicative"]}}}, {"id": "b_s2_q2_2_ess", "type": "sous_question", "data": {"competence": "CG1.2", "numero": "2.2", "texte": "**Expliquer** ce que peut faire le ménage d'un riz dont la DDM est dépassée, en complétant.\nSi le paquet est fermé, le riz peut encore être ……………………… .", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "consommé", "indice": "", "reponse_allegee": "", "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 5 : la fin du point 2.", "explication": "Paquet fermé, riz non altéré : il peut encore être consommé.", "trous": ["consomme|mange"]}}}, {"id": "b_ana_07", "type": "analyse", "data": {"titre": "COMPARER DEUX PRODUITS"}}, {"id": "b_doc_06", "type": "document_texte_i ": "**Calculer** le prix au kilo de chaque produit (500 g = 0,5 kg ; 750 g = 0,75 kg).", "points": "", "lignes": 3, "style_lignes": "tiret_guide", "support_type": "calcul", "reponse_attendue": "Produit A : 2,35 ÷ 0,5 = 4,70 € le kilo\nProduit B : 3,15 ÷ 0,75 = 4,20 € le kilo", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Calculer** le prix au kilo de chaque produit, en complétant.\nProduit A : 2,35 ÷ 0,5 = ……………………… € le kilo\nProduit B : 3,15 ÷ 0,75 = ……………………… € le kilo", "lignes": 0, "support_type": "lignes", "reponse_attendue": "4,70 €\n4,20 €"}, "essentiel": {"texte": "**Calculer** le prix au kilo du produit B, en complétant.\nProduit A : 4,70 € le kilo\nProduit B : 3,15 ÷ 0,75 = ……………………… € le kilo", "lignes": 0, "support_type": "lignes", "reponse_attendue": "4,20 €"}}}, "el": {"standard": {"indice": "DOC. 6 : prix au kilo = prix ÷ quantité en kilogrammes (500 g = 0,5 kg ; 750 g = 0,75 kg).", "explication": "Produit A : 2,35 ÷ 0,5 = 4,70 € le kilo. Produit B : 3,15 ÷ 0,75 = 4,20 € le kilo."}, "adapte": {"indice": "Faire chaque division écrite.", "explication": "4,70 € et 4,20 € le kilo.", "trous": ["4,70|4,7|4.70|4.7", "4,20|4,2|4.20|4.2"]}, "essentiel": {"indice": "Faire la division écrite.", "explication": "3,15 ÷ 0,75 = 4,20 € le kilo.", "trous": ["4,20|4,2|4.20|4.2"]}}}, {"id": "b_s2_q3_3", "type": "sous_question", "data": {"competence": "CG1.2", "numero": "3.3", "texte": "**Comparer** les deux produits pour conseiller Amanda, avec deux arguments.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "lignes", "reponse_attendue": "Le produit B est moins cher au kilo : 4,20 € contre 4,70 €.\nLe produit B a une meilleure qualité nutritionnelle : Nutri-Score A contre D.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 2, "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Comparer** les deux produits pour conseiller Amanda, en complétant.\nLe produit ……………………… est moins che mi : carotte, poireau, courgette, haricot vert, tomate.", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1, "variantes": {"essentiel": {"texte": "**Relever** deux légumes de saison en septembre, en complétant.\nEn septembre, la ……………………… et le ……………………… sont de saison.", "lignes": 0, "style_lignes": "tiret_guide", "lignes_par_reponse": 1, "reponse_attendue": "carotte, courgette ou tomate\npoireau ou haricot vert"}}}, "el": {"standard": {"indice": "DOC. 7 : le point 1, la liste de septembre.", "explication": "Deux légumes parmi : carotte, poireau, courgette, haricot vert, tomate. La pomme, la poire et le raisin sont des fruits."}, "essentiel": {"indice": "DOC. 7 : le point 1.", "explication": "La carotte (ou la courgette, la tomate) et le poireau (ou le haricot vert).", "trous": ["carotte|courgette|tomate", "poireau|haricot vert|haricot"]}}}, {"id": "b_s3_q1_2", "type": "sous_question", "data": {"competence": "CG1.2", "numero": "1.2", "texte": "**Expliquer** pourquoi acheter des tomates en décembre pèse davantage sur l'environnement.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Hors saison : 7 fois plus de gaz à effet de serre.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Expliquer** l'effet d'une tomate achetée en décembre, en complétant.\nEn décembre, la tomate est hors ……………………… : elle génère ……………………… fois plus de gaz à effet de serre.", "lignes": 0, "reponse_attendue": "saison\n7"}}}, "el": {"standard": {"indice": "DOC. 7 : le point 2, la tomate hors saison.", "explication": "En décembre, la tomate est hors saison : elle génère 7 fois plus de gaz à effet de serre qu’une tomate de saison."}, "adapte": {"indice": "DOC. 7 : le point 2.", "explication": "Hors saison, 7 fois plus de gaz à effet de serre.", "trous": ["saison", "7|sept"]}}}, {"id": "b_s3_q1_2_ess", "type": "sous_question", "data": {"competence": "CG1.2", "numero": "1.2", "texte": "**Expliquer** l'effet d'une tomate achetée en décembre, en complétant.\nEn décembre, la tomate est hors ……………………… : elle génère ……………………… fois plus de gaz à effet de serre.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "saison\n7", "indice": "", "reponse_allegee": "", "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 7 : le point 2.", "explication": "Hors saison, 7 fois plus de gaz à effet de serre.", "trous": ["saison", "7|sept"]}}}, {"id": "b_ana_09", "type": "analyse", "data": {"titre": "LES SIGNES DE QUALITÉ"}}, {"id": "b_doc_08", "type": "document", "data": {"label": "DOC. 8", "titre": "Les signes officiels de la qualité et de l'origine", "cadre": true, "corps": "1. **Agriculture biologique** (logos AB et Eurofeuille) : un mode de production qui exclut les OGM et limite strictement les produits chimiques de synthèse.\n2. **Label Rouge** : un niveau de qualité supérieur aux produits similaires habituellement vendus.\n3. **Appellation d'origine protégée** (AOP) : toutes les étapes de production sont réalisées dans une même aire géographique, selon un savoir-faire reconnu.\n4. **Indication géographique protégée** (IGP) : au moins une étape de la production a lieu dans l'aire géographique.\nCes signes sont contrôlés par les pouvoirs publics. Une **marque commerciale** appartient à une entreprise : elle ne garantit ni l'origine ni le mode de production.", "source": "D'après l'INAO", "image_largeur": 100, "image_taille": "pleine", "img": "images/sesg-alimentation-signes-qualite.jpg", "img_desc": "Cinq logos légendés : AB, Eurofeuille, Label Rouge, AOP, IGP (images générées d'après les logos officiels).", "img_w": 1400, "img_h": 289}}, {"id": "b_chap_s3_2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 8 :", "reponse_attendue": ""}}, {"id": "b_s3_q2_1", "type": "relier", "data": {"competence": "CG1.2", "numero": "2.1", "titre": "", "consigne": "**Relier** chaque signe à ce qu'il garantit.", "gauche": ["Agriculture biologique", "Label Rouge", "AOP", "IGP"], "droite": ["Au moins une étape de production dans l'aire géographique", "Toutes les étapes de production dans une même aire géographique", "Un mode de production sans OGM et avec très peu de produits chimiques", "Une qualité supérieure aux produits similaires"], "correspondances": [2, 3, 1, 0], "indice": ""}, "el": {"standard": {"indice": "DOC. 8 : un paragraphe par signe.", "explication": "Agriculture biologique : sans OGM, très peu de produits chimiques. Label Rouge : qualité supérieure. AOP : toutes les étapes dans la même aire. IGP : au moins une étape dans l’aire."}}}, {"id": "b_s3_q2_2", "type": "sous_question", "data": {"competence": "CG1.2", "numero": "2.2", "texte": "**Expliquer** la différence entre un signe officiel de qualité et une marque commerciale.", "points": "", "lignes": 3, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Signe officiel : contrôlé par les pouvoirs publics. Marque : appartient à une entreprise, sans garantie.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Expliquer** la différence entre un signe officiel et une marque, en complétant.\nUn signe officiel est ……………………… par les pouvoirs publics. Une marque appartient à une ……………………… .", "lignes": 0, "reponse_attendue": "contrôlé\nentreprise"}}}, "el": {"standard": {"indice": "DOC. 8 : les deux dernières phrases.", "explication": "Un signe officiel est contrôlé par les pouvoirs publics ; une marque appartient à une entreprise et ne garantit ni l’origine ni le mode de production."}, "adapte": {"indice": "DOC. 8 : les deux dernières phrases.", "explication": "Signe officiel : contrôlé par les pouvoirs publics. Marque : à une entreprise.", "trous": ["controle|controles", "entreprise|societe"]}}}, {"id": "b_s3_q2_2_ess", "type": "sous_question", "data": {"competence": "CG1.2", "numero": "2.2", "texte": "**Expliquer** la différence entre un signe officiel et une marque, en complétant.\nUn signe officiel est contrôlé par les pouvoirs ……………………… . Une marque appartient à une ……………………… .", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "publics\nentreprise", "indice": "", "reponse_allegee": "", "niveaux": ["essentiel"]}, "el": {"essentiel": {"indice": "DOC. 8 : les deux dernières phrases.", "explication": "Pouvoirs publics ; entreprise.", "trous": ["publics|public", "entreprise|societe"]}}}, {"id": "b_ana_10", "type": "analyse", "data": {"titre": "LE COMMERCE ÉQUITABLE ET LES EMBALLAGES"}}, {"id": "b_doc_09", "type": "document", "data": {"label": "DOC. 9", "titre": "Le commerce équitable", "cadre": true, "corps": "Le **commerce équitable** cherche une plus grande équité dans le commerce : il veille à **mieux payer** les producteurs et les autres acteurs de la filière. Il concerne des produits venus de pays du Sud (café, thé, chocolat, banane) et, depuis 2014, aussi des **filières françaises**.", "source": "D'après la DGCCRF"}}, {"id": "b_doc_10", "type": "document", "data": {"label": "DOC. 10", "titre": "Réduire et trier les emballages", "cadre": true, "corps": "1. **Tous les emballages se trient** : plastique, métal, carton et bois vont dans le bac de tri ; le **verre** va dans les conteneurs dédiés.\n2. Pour **réduire** les emballages dès les courses : acheter en **vrac**, prendre des **sacs réutilisables**, choisir de grands conditionnements adaptés aux quantités consommées.", "source": "D'après l'ADEME", "image_largeur": 45, "img": "images/sesg-alimentation-tri-emballages.jpg", "img_desc": "Bac jaune ouvert (pot de yaourt, boîte de conserve, carton) et colonne à verre verte avec une bouteille devant.", "img_w": 1400, "img_h": 1175}}, {"id": "b_chap_s3_3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir des documents 9 et 10 :", "reponse_attendue": ""}}, {"id": "b_s3_q
