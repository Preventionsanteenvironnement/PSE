it emballé doit indiquer", "cadre": true, "corps": "1. La **dénomination de vente**, qui définit le produit.\n2. La **liste des ingrédients**, par ordre d'importance décroissante ; les **allergènes** y sont mis en relief.\n3. La **quantité nette**, en masse ou en volume.\n4. La **date** de consommation (DLC ou DDM).\n5. Le nom de l'entreprise qui vend le produit, le **numéro de lot**, les conditions de conservation.\n6. La **déclaration nutritionnelle**, qui peut être complétée par le **Nutri-Score**, facultatif : une note de A à E sur la qualité nutritionnelle, calculée pour 100 g ou 100 mL.", "source": "D'après la DGCCRF et Santé publique France"}}, {"id": "b_chap_s2_1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 4 :", "reponse_attendue": "", "explication": ""}}, {"id": "b_s2_q1_1", "type": "cocher_exactes", "data": {"competence": "CG1.2", "numero": "1.1", "consigne": "**Cocher** les trois mentions obligatoires sur l'étiquette d'un produit emballé.", "items": [{"texte": "La liste des ingrédients", "correct": true}, {"texte": "Le prix du produit dans un autre magasin", "correct": false}, {"texte": "La quantité nette", "correct": true}, {"texte": "La date de consommation", "correct": true}, {"texte": "Une recette de cuisine", "correct": false}]}, "el": {"standard": {"indice": "Relire le document « Ce que l'étiquette d'un produit emballé doit indiquer » et chercher les mots en gras."}, "adapte": {"indice": "Relire le document « Ce que l'étiquette d'un produit emballé doit indiquer » et chercher les mots en gras."}, "essentiel": {"indice": "Relire le document « Ce que l'étiquette d'un produit emballé doit indiquer » et chercher les mots en gras."}}}, {"id": "b_s2_q1_2", "type": "sous_question", "data": {"competence": "CG1.2", "numero": "1.2", "texte": "**Expliquer** ce que montre l'ordre de la liste des ingrédients.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Les ing ate hors saison** génère **7 fois plus** de gaz à effet de serre qu'une tomate produite à la bonne saison, entre juin et septembre.", "source": "D'après Manger Bouger et l'ADEME"}}, {"id": "b_chap_s3_1", "type": "question_chapeau", "data": {"numero": "1", "texte": "À partir du document 7 :", "reponse_attendue": "", "explication": ""}}, {"id": "b_s3_q1_1", "type": "sous_question", "data": {"competence": "CG1.2", "numero": "1.1", "texte": "**Relever** deux légumes de saison au mois de septembre.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "lignes", "reponse_attendue": "La carotte.\nLe poireau.", "explication": "", "indice": "", "reponse_allegee": "", "lignes_par_reponse": 1, "variantes": {"essentiel": {"texte": "**Relever** deux légumes de saison en septembre, en complétant.\nEn septembre, la ……… et le ……… sont de saison.", "lignes": 0, "style_lignes": "tiret_guide", "lignes_par_reponse": 1, "reponse_attendue": "carotte\npoireau"}}}, "el": {"standard": {"indice": "Relire le document « Les fruits et légumes de saison » et chercher les mots en gras."}, "adapte": {"indice": "Relire le document « Les fruits et légumes de saison » et chercher les mots en gras."}, "essentiel": {"indice": "Relire le document « Les fruits et légumes de saison » et chercher les mots en gras."}}}, {"id": "b_s3_q1_2", "type": "sous_question", "data": {"competence": "CG1.2", "numero": "1.2", "texte": "**Expliquer** pourquoi acheter des tomates en décembre pèse davantage sur l'environnement.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "En décembre, la tomate est hors saison : elle génère 7 fois plus de gaz à effet de serre qu'une tomate de saison.", "explication": "", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Expliquer** l'effet d'une tomate achetée en décembre, en complétant.\nEn décembre, la tomate est hors ……… : elle génère ……… fois une étape de la production a lieu dans l'aire géographique.\nCes signes sont contrôlés par les pouvoirs publics. Une **marque commerciale** appartient à une entreprise : elle ne garantit ni l'origine ni le mode de production.", "source": "D'après l'INAO"}}, {"id": "b_chap_s3_2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 8 :", "reponse_attendue": "", "explication": ""}}, {"id": "b_s3_q2_1", "type": "relier", "data": {"competence": "CG1.2", "numero": "2.1", "titre": "", "consigne": "**Relier** chaque signe à ce qu'il garantit.", "gauche": ["Agriculture biologique", "Label Rouge", "AOP", "IGP"], "droite": ["Au moins une étape de production dans l'aire géographique", "Toutes les étapes de production dans une même aire géographique", "Un mode de production sans OGM et avec très peu de produits chimiques", "Une qualité supérieure aux produits similaires"], "correspondances": [2, 3, 1, 0], "explication": "", "indice": ""}, "el": {"standard": {"indice": "Relire le document « Les signes officiels de la qualité et de l'origine » et chercher les mots en gras."}, "adapte": {"indice": "Relire le document « Les signes officiels de la qualité et de l'origine » et chercher les mots en gras."}, "essentiel": {"indice": "Relire le document « Les signes officiels de la qualité et de l'origine » et chercher les mots en gras."}}}, {"id": "b_s3_q2_2", "type": "sous_question", "data": {"competence": "CG1.2", "numero": "2.2", "texte": "**Expliquer** la différence entre un signe officiel de qualité et une marque commerciale.", "points": "", "lignes": 3, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Un signe officiel est contrôlé par les pouvoirs publics et garantit une qualité ou une origine ; une marque appartient à une entreprise et ne garantit ni l'origine ni le mode de production.", "explication": "", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Expliquer** la différence entre un signe officiel et une marque, en complétant.\nUn signe officiel est ……… par les pouvoirs publics. Une marque appartient à une ……… .", "lignes": 0, "reponse_attendue": "Un signe officiel est contrôlé par les pouvoirs publics. Une marque appartient à une entreprise."}}}, "el": {"standard": {"indice": "Relire le document « Les signes officiels de la qualité et de l'origine » et chercher les mots en gras."}, "adapte": {"indice": "Relire le document « Les signes officiels de la qualité et de l'origine » et chercher les mots en gras."}, "essentiel": {"indice": "Relire le document « Les signes officiels de la qualité et de l'origine » et chercher les mots en gras."}}}, {"id": "b_s3_q2_2_ess", "type": "qcm", "data": {"competence": "CG1.2", "numero": "2.2", "titre": "", "consigne": "**Expliquer** la différence entre un signe officiel et une marque, en cochant la proposition exacte.", "items": [{"question": "Un signe officiel de qualité :", "options": ["appartient à une entreprise", "est toujours moins cher", "est contrôlé par les pouvoirs publics"], "reponse": 2}], "niveaux": ["essentiel"]}, "el": {"standard": {"indice": "Relire le document « Les signes officiels de la qualité et de l'origine » et chercher les mots en gras."}, "adapte": {"indice": "Relire le document « Les signes officiels de la qualité et de l'origine » et chercher les mots en gras."}, "essentiel": {"indice": "Relire le document « Les signes officiels de la qualité et de l'origine » et chercher les mots en gras."}}}, {"id": "b_ana_10", "type": "analyse", "data": {"titre": "LE COMMERCE ÉQUITABLE ET LES EMBALLAGES"}}, {"id": "b_doc_09", "type": "document", "data": {"label": "DOC. 9", "titre": "Le commerce équitable", "cadre": true, "corps": "Le **commerce équitable** cherche une plus grande équité dans le commerce : il veille à une **rétribution plus élevée** des producteurs et des autres acteurs de la filière. Il concerne des produits venus de pays du Sud (café, thé, chocolat, banane) et, depuis 2014, aussi des **filières françaises**, qui représentent un tiers du commerce équitable.", "source": "D'après la DGCCRF"}}, {"id": "b_doc_10", "type": "document", "data": {"label": "DOC. 10", "titre": "Réduire et trier les emballages", "cadre": true, "corps": "1. **Tous les emballages se trient** : plastique, métal, carton et bois vont dans le bac de tri ; le **verre** va dans les conteneurs dédiés.\n2. Pour **réduire** les emballages dès les courses : acheter en **vrac**, prendre des **sacs réutilisables**, choisir de grands conditionnements adaptés aux quantités consommées.", "source": "D'après l'ADEME"}}, {"id": "b_chap_s3_3", "type": "question_chapeau", "data": {"numero": "3", "texte": "À partir des documents 9 et 10 :", "reponse_attendue": "", "explication": ""}}, {"id": "b_s3_q3_1", "type": "sous_question", "data": {"competence": "CG1.2", "numero": "3.1", "texte": "**Indiquer** ce que le commerce équitable apporte aux producteurs.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "lignes", "reponse_attendue": "Une rétribution plus élevée.", "explication": "", "indice": "", "reponse_allegee": "", "variantes": {"essentiel": {"texte": "**Indiquer** ce que le commerce équitable apporte aux producteurs, en complétant.\nUne ……… plus élevée.", "lignes": 0, "reponse_attendue": "rétribution"}}}, "el": {"standard": {"indice": "Relire le document « Réduire et trier les emballages » et chercher les mots en gras."}, "adapte": {"indice": "Relire le document « Réduire et trier les emballages » et chercher les mots en gras."}, "essentiel": {"indice": "Relire le document « Réduire et trier les emballages » et chercher les mots en gras."}}}, {"id": "b_s3_q3_2", "type": "classer", "data": {"competence": "CG1.2", "numero": "3.2", "titre": "", "consigne": "**Classer** chaque emballage en écrivant où le déposer dans le tableau.", "categories": ["Bac de tri", "Conteneur à verre"], "items": ["Un pot de yaourt en plastique", "Une bouteille en
