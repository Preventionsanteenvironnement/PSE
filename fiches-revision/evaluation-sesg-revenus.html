 "1.2"}, {"enonce": "**Écrire** le statut de Léa, avec les mots : salariée – travailleuse indépendante.\nAide : Léa a des clientes, elle n'a pas d'employeur.", "type": "ouverte", "points": 2, "document": 1, "support": {"type": "tableau", "headers": ["Personne", "Statut"], "rows": [["Benoît", "salarié"], ["Léa", ""]]}, "lignes": 0, "num": "1.3"}, {"enonce": "**Relever** le salaire brut et le net payé de Benoît.\nSalaire brut : ……………………… €     Net payé : ……………………… €\nAide : chercher les lignes « Salaire brut » et « Net payé » du bulletin.", "type": "ouverte", "points": 2, "document": 2, "lignes": 0, "chapeau": "À partir du document 2 :", "num": "2.1"}, {"enonce": "**Indiquer** ce qui est retiré du brut pour la retraite et la santé, en cochant la case.", "type": "qcm", "points": 1, "document": 2, "options": ["les cotisations salariales", "le SMIC"], "options_en_ligne": true, "lignes": 0, "num": "2.2"}, {"enonce": "**Comparer** le taux horaire de Benoît au SMIC, avec les mots : élevé – bas.\nLe taux horaire de Benoît est plus ……………………… que le SMIC.\nAide : lire les lignes « Taux horaire brut » et « SMIC » du bulletin.", "type": "ouverte", "points": 2, "document": 2, "lignes": 0, "num": "2.3"}, {"enonce": "**Compléter** avec les mots : brut – net.\nAvant les cotisations, c'est le salaire ……………………… .\nAide : c'est le premier montant du bulletin.", "type": "ouverte", "points": 1, "document": 2, "lignes": 0, "num": "2.4"}, {"enonce": "**Calculer** la somme disponible de Léa, en complétant l'opération.\n1 500 € − 400 € = ……………………… €\nAide : on enlève les dépenses du chiffre d'affaires.", "type": "ouverte", "points": 3, "document": 3, "lignes": 0, "chapeau": "À partir de la situation et du document 3 :", "num": "3.1"}, {"enonce": "**Classer** la retraite de Rose, avec les mots : activité – capital – transfert.\nAide : la retraite est versée par la protection sociale.", "type": "ouverte", "points": 3, "document": 3, "support": {"type": "tableau", "headers": ["Ressource", "Type de revenu"], "rows": [["Salaire de Benoît", "activité"], ["Loyer du garage", "capital"], ["Retraite de Rose", ""]]}, "lignes": 0, "num": "3.2"}, {"enonce": "**Indiquer** le meilleur choix pour le ménage, avec les mots : salariée – indépendante.\nLéa a intérêt à devenir ……………………………… , car ……………… € par mois, c'est plus que ……………… €.\nAide : le plus grand montant rapporte le plus.", "type": "ouverte", "points": 4, "lignes": 0, "num": "4"}]}}};
</script>
<script>
(function(){
'use strict';
var E=window.EVAL, NIV={standard:'S',adapte:'A',essentiel:'E'};
var params=new URLSearchParams(location.search), niveau=params.get('niveau');
var main=document.getElementById('main');

/* ---------- accessibilité (préférences gardées sur l'appareil) ---------- */
function pref(k,d){ try{ var v=localStorage.getItem('mapse_eval_acces_'+k); return v===null?d:v; }catch(e){ return d; } }
function garderPref(k,v){ try{ localStorage.setItem('mapse_eval_acces_'+k,v); }catch(e){} }
var root=document.documentElement;
function appliquer(){
  root.style.setProperty('--fs',pref('fs','18')+'px');
  root.style.setProperty('--lh',pref('lh','1.55'));
  document.body.classList.toggle('dys',pref('dys','0')==='1');
  ['creme','bleu','contraste'].forEach(function(c){ document.body.classList.toggle(c,pref('fond','')===c); });
  document.querySelectorAll('[data-lh]').forEach(function(b){ b.setAttribute('aria-pressed',String(b.dataset.lh===pref('lh','1.55'))); });
  document.querySelectorAll('[data-fond]').forEach(function(b){ b.setAttribute('aria-pressed',String(b.dataset.fond===pref('fond',''))); });
  document.getElementById('bDys').setAttribute('aria-pressed',String(pref('dys','0')==='1'));
}
document.querySelectorAll('[data-fs]').forEach(function(b){ b.onclick=function(){ garderPref('fs',Math.max(14,Math.min(30,(+pref('fs','18'))+2*(+b.dataset.fs)))); appliquer(); }; });
document.querySelectorAll('[data-lh]').forEach(function(b){ b.onclick=function(){ garderPref('lh',b.dataset.lh); appliquer(); }; });
document.querySelectorAll('[data-fond]').forEach(function(b){ b.onclick=function(){ garderPref('fond',b.dataset.fond); appliquer(); }; });
document.getElementById('bDys').onclick=function(){ garderPref('dys',pref('dys','0')==='1'?'0':'1'); appliquer(); };
document.getElementById('bAcces').onclick=function(){ var a=document.getElementById('acces'); var o=a.classList.toggle('ouvert'); this.setAttribute('aria-expanded',String(o)); };
var vit=document.getElementById('vitesse'); vit.value=pref('vitesse','0.95'); vit.oninput=function(){ garderPref('vitesse',vit.value); };
appliquer();

/* ---------- lecture à voix haute (voix de l'appareil, rien n'est envoyé) ---------- */
var synth=window.speechSynthesis, enCours=null;
function arreter(){ if(synth) synth.cancel(); if(enCours){ enCours.classList.remove('lu'); enCours=null; } }
function lire(el){ if(!synth){ dire('Lecture à voix haute indisponible sur cet appareil.'); return; }
  arreter(); var t=el.cloneNode(true); t.querySelectorAll('.lire,.pts').forEach(function(x){x.remove();});
  t.querySelectorAll('input.trou').forEach(function(x){ x.replaceWith(' pointillés '); });
  var texte=t.textContent.replace(/…+/g,' pointillés ').replace(/\s+/g,' ').trim();
  var morceaux=texte.match(/[^.!?:]+[.!?:]?/g)||[texte], i=0; enCours=el; el.classList.add('lu');
  (function suite(){ if(i>=morceaux.length||enCours!==el){ if(enCours===el){ el.classList.remove('lu'); enCours=null; } return; }
    var u=new SpeechSynthesisUtterance(morceaux[i++]); u.lang='fr-FR'; u.rate=+vit.value; u.onend=suite; synth.speak(u); })(); }
document.querySelectorAll('[data-clic]').forEach(function(b){ b.onclick=function(){ document.getElementById(b.dataset.clic).click(); }; });
document.getElementById('bStop').onclick=arreter; document.getElementById('bStop2').onclick=arreter;
document.getElementById('bTout').onclick=function(){ var f=document.querySelector('.feuille'); if(f) lire(f); };
function boutonLire(el){ var b=document.createElement('button'); b.className='lire ecran-seul'; b.type='button'; b.title='Écouter'; b.setAttribute('aria-label','Écouter'); b.textContent='🔊'; b.onclick=function(){ lire(el); }; el.appendChild(b); }

/* ---------- utilitaires ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function gras(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function dire(t){ var m=document.getElementById('msg'); m.textContent=t; m.style.display='block'; clearTimeout(dire.t); dire.t=setTimeout(function(){ m.style.display='none'; },3500); }
function h(tag,attrs,html){ var e=document.createElement(tag); if(attrs) for(var k in attrs) e.setAttribute(k,attrs[k]); if(html!==undefined) e.innerHTML=html; return e; }

/* ---------- choix du niveau ---------- */
if(!NIV[niveau]){
  var c=h('div',{'class':'feuille choisir'},'<h1>'+esc(E.titre)+'</h1><p>Lettre de la copie</p>');
  var n=h('div',{'class':'niveaux'});
  Object.keys(NIV).forEach(function(k){ var b=h('button',{type:'button','aria-label':'Copie '+NIV[k]},NIV[k]); b.onclick=function(){ params.set('niveau',k); location.search=params.toString(); }; n.appendChild(b); });
  c.appendChild(n); main.appendChild(c); return;
}
var V=E.niveaux[niveau], CLE='mapse_eval_'+E.slug+'_'+niveau;

/* ---------- la copie ---------- */
var f=h('div',{'class':'feuille'});
var ent=h('div',{'class':'entete'});
var idt=h('div',{'class':'identite'},'<label>Classe<input id="classe" autocomplete="off" maxlength="12" spellcheck="false"></label><label>Code<input id="code" autocomplete="off" maxlength="8" spellcheck="false"></label>');
ent.appendChild(idt);
ent.appendChild(h('div',{style:'text-align:right'},'<span class="pastille" aria-label="Copie '+NIV[niveau]+'">'+NIV[niveau]+'</span><div class="imprime-seul" id="datePrint" style="font-size:.8rem;margin-top:4px"></div>'));
f.appendChild(ent);
f.appendChild(h('div',{'class':'cadre-titre'},'<h1>'+esc(E.titre)+'</h1><p><b>Capacité travaillée :</b> '+esc(E.capacite)+'</p><p style="font-size:.8rem">CAP agricole</p>'));
f.appendChild(h('div',{style:'text-align:right'},'<span class="note">Note : ………… / '+E.total+'</span>'));
var sit=h('div',{'class':'bloc'},'<h2>Situation</h2>'+V.situation.split('\n').map(function(l){return '<p style="margin:2px 0">'+gras(l)+'</p>';}).join(''));
boutonLire(sit); f.appendChild(sit);

var docsPlaces={};
function placerDoc(i){ if(!i||docsPlaces[i]) return; docsPlaces[i]=1; var d=V.documents[i-1]; if(!d) return;
  var b=h('div',{'class':'bloc'},'<h2><u>DOC. '+i+' — '+esc(d.titre)+'</u></h2>'+d.description.split('\n').map(function(l){return '<p style="margin:2px 0">'+gras(l)+'</p>';}).join('')+'<div class="source">'+esc(d.source||'')+'</div>');
  boutonLire(b); f.appendChild(b); }

var champs=[];   // [{id, q, el, type}]
V.questions.forEach(function(q){
  placerDoc(q.document);
  if(q.chapeau) f.appendChild(h('p',{'class':'chapeau'},q.num.split('.')[0]+'. '+esc(q.chapeau)));
  var bq=h('div',{'class':'question',id:'q'+q.num});
  var lignes=q.enonce.split('\n'), trous=0;
  lignes.forEach(function(l,k){
    var p=h('p'); var aide=/^Aide\s*:/.test(l); if(aide) p.className='aide';
    var html=gras(l).replace(/…{3,}|\.{4,}/g,function(){ var id='q'+q.num+'_t'+(trous++); champs.push({id:id,q:q.num}); return '<input class="trou" id="'+id+'" aria-label="Réponse '+q.num+'" autocomplete="off">'; });
    if(k===0) html='<span class="num">'+q.num+(q.num.indexOf('.')<0?'.':'')+'</span> '+html;
    p.innerHTML=html; bq.appendChild(p); });
  if(q.type==='qcm'){
    var ch=h('div',{'class':'choix'+(q.options_en_ligne?'':' colonne'),role:'radiogroup','aria-label':'Réponse '+q.num});
    q.options.forEach(function(o,k){ var id='q'+q.num+'_c'+k; ch.appendChild(h('label',{'for':id},'<input type="radio" name="q'+q.num+'" id="'+id+'" value="'+esc(o)+'"> '+esc(o))); });
    champs.push({id:'q'+q.num+'_choix',q:q.num,radio:'q'+q.num}); bq.appendChild(ch);
  }
  var sup=q.support;
  if(sup&&sup.type==='tableau'){
    var t='<table class="support"><thead><tr>'+sup.headers.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody>';
    sup.rows.forEach(function(r,ri){ t+='<tr>'+r.map(function(c,ci){ if(c) return '<td><b>'+esc(c)+'</b></td>'; var id='q'+q.num+'_r'+ri+'c'+ci; champs.push({id:id,q:q.num,cellule:r[0]}); return '<td><input id="'+id+'" aria-label="'+esc(r[0]+' : '+sup.headers[ci])+'" autocomplete="off"></td>'; }).join('')+'</tr>'; });
    bq.insertAdjacentHTML('beforeend',t+'</tbody></table>');
  } else if(sup&&sup.type==='calcul'){
    var id='q'+q.num+'_calc'; champs.push({id:id,q:q.num}); bq.appendChild(h('textarea',{id:id,'class':'zone-calcul','aria-label':'Calcul '+q.num,placeholder:'Calcul et résultat'}));
  } else if(q.type!=='qcm'&&!trous){
    var id2='q'+q.num+'_texte'; champs.push({id:id2,q:q.num}); bq.appendChild(h('textarea',{id:id2,rows:String(Math.max(2,q.lignes||2)),'aria-label':'Réponse '+q.num}));
  }
  bq.querySelector('p').insertAdjacentHTML('beforeend',' <span class="pts">… / '+q.points+'</span>');
  boutonLire(bq); f.appendChild(bq);
});
main.appendChild(f);

/* ---------- réponses : lire, écrire, garder ---------- */
function valeurs(){ var o={}; champs.forEach(function(c){ if(c.radio){ var r=document.querySelector('input[name="'+c.radio+'"]:checked'); o[c.id]=r?r.value:''; } else o[c.id]=document.getElementById(c.id).value; }); return o; }
function remplir(v){ champs.forEach(function(c){ var x=v[c.id]; if(x===undefined) return; if(c.radio){ document.querySelectorAll('input[name="'+c.radio+'"]').forEach(function(r){ r.checked=(r.value===x); }); } else document.getElementById(c.id).value=x; }); }
function paquet(){ return { type:'mapse-evaluation', version:1, evaluation:E.code+(niveau==='standard'?'':(niveau==='adapte'?'-ADP':'-ESS')), titre:E.titre, niveau:NIV[niveau],
  classe:document.getElementById('classe').value.trim().toUpperCase(), code:document.getElementById('code').value.trim().toUpperCase(),
  enregistre:new Date().toISOString(),
  questions:V.questions.map(function(q){ return {num:q.num, points:q.points, reponses:champs.filter(function(c){return c.q===q.num;}).map(function(c){ var v=valeurs()[c.id]; return c.cellule?c.cellule+' : '+v:v; })}; }),
  champs:valeurs() }; }
function garder(){ try{ localStorage.setItem(CLE,JSON.stringify(paquet())); }catch(e){} }
main.addEventListener('input',garder); main.addEventListener('change',garder);
try{ var s=JSON.parse(localStorage.getItem(CLE)||'null'); if(s){ document.getElementById('classe').value=s.classe||''; document.getElementById('code').value=s.code||''; remplir(s.champs||{}); } }catch(e){}

function identiteOk(){ var cl=document.getElementById('classe'), co=document.getElementById('code');
  if(!cl.value.trim()){ dire('Écrire la classe en haut de la copie.'); cl.focus(); return false; }
  if(!co.value.trim()){ dire('Écrire le code en haut de la copie.'); co.focus(); return false; } return true; }
document.getElementById('bEnreg').onclick=function(){ if(!identiteOk()) return; var p=paquet();
  var blob=new Blob([JSON.stringify(p,null,1)],{type:'application/json'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=E.slug+'_'+p.classe+'_'+p.code+'_'+NIV[niveau]+'.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },2000); dire('Fichier enregistré.'); };
document.getElementById('bOuvrir').onclick=function(){ document.getElementById('fichier').click(); };
document.getElementById('fichier').onchange=function(){ var fi=this.files[0]; if(!fi) return; var r=new FileReader();
  r.onload=function(){ try{ var p=JSON.parse(r.result); if(p.type!=='mapse-evaluation'||p.titre!==E.titre){ dire('Ce fichier n’est pas cette évaluation.'); return; }
    if(p.niveau!==NIV[niveau]){ var k=Object.keys(NIV).find(function(x){return NIV[x]===p.niveau;}); try{ localStorage.setItem('mapse_eval_'+E.slug+'_'+k,JSON.stringify(p)); }catch(e){} params.set('niveau',k); location.search=params.toString(); return; }
    document.getElementById('classe').value=p.classe||''; document.getElementById('code').value=p.code||''; remplir(p.champs||{}); garder(); dire('Copie reprise.'); }catch(e){ dire('Fichier illisible.'); } };
  r.readAsText(fi); this.value=''; };
document.getElementById('bImprimer').onclick=function(){ if(!identiteOk()) return; arreter();
  document.getElementById('datePrint').textContent=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}); window.print(); };
})();
</script>
</body>
</html>
