<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SESG — Le ménage et ses revenus — mission ressources du ménage · CAPa Jardinier paysagiste · Horticulture · PSE</title>
<meta name="description" content="Mission guidée : compléter le récapitulatif des ressources, calculer le total et la part du travail en pourcentage (CAPa, séance 4).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --fond1:#0F3D36; --fond2:#1D5E50; --clair:#F4F8F5; --encre:#13302A; --doux:#5B7A71;
  --jaune:#FFD23F; --vrai:#2FBF71; --vrai-f:#16733F; --faux:#FF6B57; --faux-f:#B3261E;
  --act:#2FBF71; --cap:#5AB0E6; --tra:#FFD23F;
  --ligne:rgba(255,255,255,.22);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--clair);
  font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:1.08rem;line-height:1.5;
  background:
    radial-gradient(1200px 600px at 15% -10%,rgba(255,210,63,.13),transparent 60%),
    radial-gradient(900px 700px at 110% 110%,rgba(120,220,180,.14),transparent 60%),
    linear-gradient(160deg,var(--fond1),var(--fond2));
  background-attachment:fixed;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--jaune);outline-offset:3px}
.page{max-width:1200px;margin:0 auto;padding:1.4rem 1.1rem 0}
header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1.8rem,5vw,2.7rem);line-height:1.05;margin:0;letter-spacing:-.01em}
header p{margin:.35rem 0 0;opacity:.8}
.filtres{display:flex;gap:.5rem;overflow-x:auto;padding:1.1rem .1rem 1rem;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.puce{flex:none;border:2px solid var(--ligne);background:rgba(255,255,255,.06);border-radius:999px;padding:.4rem 1rem;font-weight:700;font-size:1rem}
.puce:hover{border-color:rgba(255,255,255,.5)}
.puce[aria-pressed="true"]{background:var(--clair);color:var(--encre);border-color:var(--clair)}
.puce .et{color:var(--jaune);margin-left:.3rem}
.puce[aria-pressed="true"] .et{color:#B8860B}

.jeu{display:grid;gap:1.2rem;padding-bottom:1.5rem}
@media (min-width:980px){
  .jeu{grid-template-columns:390px 1fr;align-items:start;padding-bottom:3rem}
  .mission{grid-column:1;grid-row:1;position:sticky;top:calc(1rem + env(safe-area-inset-top,0px));border-radius:24px}
  .docZone{grid-column:2;grid-row:1}
}
.mission{background:rgba(9,38,33,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:2px solid var(--ligne);padding:1.2rem 1.2rem 1.3rem;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
@media (max-width:979px){
  .mission{position:sticky;bottom:0;z-index:5;border-radius:24px 24px 0 0;max-height:55vh;overflow:auto;margin:0 -1.1rem;padding-bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));border-bottom:0}
}
.m-haut{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.6rem}
.m-num{font-weight:700;opacity:.85;font-size:.95rem}
.pts{display:flex;gap:5px}
.pts i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2)}
.pts i.fait{background:var(--vrai)}
.pts i.ici{background:var(--jaune);box-shadow:0 0 0 3px rgba(255,210,63,.3)}
.consigne{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(1.25rem,3.3vw,1.55rem);line-height:1.25;margin:.2rem 0 .9rem}
.consigne b{font-weight:800;color:var(--jaune)}
.saisie{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.saisie input{flex:1 1 120px;min-width:0;height:56px;border-radius:14px;border:3px solid var(--clair);background:var(--clair);color:var(--encre);font-size:1.4rem;font-weight:700;padding:0 .8rem;font-variant-numeric:tabular-nums}
.saisie span{font-weight:700;font-size:1.1rem}
.valider,.continuer{height:56px;border-radius:999px;border:0;background:var(--jaune);color:#2A2200;font-weight:700;font-size:1.1rem;padding:0 1.4rem}
.valider:disabled{opacity:.45;cursor:default}
.continuer{width:100%}
.opts{display:grid;gap:.5rem}
.opt{text-align:left;border:2px solid var(--ligne);background:rgba(255,255,255,.08);border-radius:14px;padding:.8rem 1rem;font-weight:700}
.opt:hover{background:rgba(255,255,255,.16)}
.cats{display:grid;gap:.7rem;margin-bottom:.8rem}
.catL{border:2px solid var(--ligne);border-radius:14px;padding:.55rem .6rem}
.catL.ok{border-color:var(--vrai);background:rgba(47,191,113,.12)}
.catL.ko{border-color:var(--faux);background:rgba(255,107,87,.12)}
.catL p{margin:0 0 .4rem;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem}
.seg button{border:2px solid var(--ligne);background:transparent;border-radius:10px;padding:.35rem .2rem;font-weight:700;font-size:.92rem}
.seg button[aria-pressed="true"][data-c="act"]{background:var(--act);border-color:var(--act);color:#062313}
.seg button[aria-pressed="true"][data-c="cap"]{background:var(--cap);border-color:var(--cap);color:#061C2A}
.seg button[aria-pressed="true"][data-c="tra"]{background:var(--tra);border-color:var(--tra);color:#2A2200}
.seg button:disabled{cursor:default}
.fb{margin-top:.8rem;border-radius:14px;font-size:1.02rem}
.fb:not(:empty){padding:.75rem .9rem}
.fb.ok{background:rgba(47,191,113,.18);border-left:6px solid var(--vrai)}
.fb.ko{background:rgba(255,107,87,.16);border-left:6px solid var(--faux)}
.fb.ind{background:rgba(255,210,63,.14);border-left:6px solid var(--jaune)}
.fb.neutre{background:rgba(255,255,255,.08);border-left:6px solid rgba(255,255,255,.4)}
.fb ul{margin:.3rem 0 0;padding-left:1.1rem}
.outils{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.9rem}
.outil{border:2px solid var(--ligne);background:transparent;border-radius:999px;padding:.3rem .8rem;font-size:.95rem;font-weight:700}
.outil:hover{background:rgba(255,255,255,.1)}
.calc{margin-top:.8rem;background:rgba(255,255,255,.07);border-radius:16px;padding:.7rem}
.calc[hidden]{display:none}
.ecran{background:var(--clair);color:var(--encre);border-radius:10px;padding:.4rem .7rem;text-align:right;font-size:1.35rem;font-weight:700;min-height:2.2rem;font-variant-numeric:tabular-nums;overflow-x:auto;white-space:nowrap}
.touches{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;margin-top:.5rem}
.touches button{height:46px;border-radius:10px;border:0;background:rgba(255,255,255,.14);font-weight:700;font-size:1.15rem}
.touches .op{background:rgba(255,210,63,.25)}
.touches .eg{background:var(--jaune);color:#2A2200}
.touches .large{grid-column:span 2}

/* ===== Documents ===== */
.docZone{min-width:0;display:grid;gap:1rem}
.doc{background:#FFFFFF;color:#1B1F1D;border-radius:10px;box-shadow:0 30px 60px -25px rgba(0,0,0,.6);padding:clamp(.9rem,2.5vw,1.5rem)}
.doc h2{font-size:1.15rem;margin:0 0 .2rem;text-decoration:underline;text-underline-offset:4px}
.doc .compo{margin:0 0 .8rem;color:#4A5550;font-size:.95rem}
.tabWrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:460px}
th{background:#E6ECE8;text-align:left;padding:.5rem .6rem;border:1px solid #9AA59F;font-size:.92rem}
td{padding:.55rem .6rem;border:1px solid #C5CEC9;vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr.total td{font-weight:700;background:#F3F6F4;font-size:1.08rem}
.trou{display:inline-block;min-width:6.5rem;border-bottom:2px dotted #8A958F;color:#8A958F;text-align:right}
.ici{background:#FFF4C2!important;box-shadow:inset 0 0 0 3px #E0A800}
.rempli{animation:flash .9s}
@keyframes flash{0%{background:#C9F0DA}100%{background:transparent}}
.tag{display:inline-block;border-radius:999px;padding:.1rem .6rem;font-weight:700;font-size:.85rem}
.tag.act{background:#CDEFDC;color:#0F5530}.tag.cap{background:#D3E9F8;color:#0F3E5E}.tag.tra{background:#FFF0B3;color:#5A4500}
.source{font-size:.85rem;color:#6B7570;text-align:right;margin:.5rem 0 0}

.sources{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.srcDoc{background:#FFFFFF;color:#1B1F1D;border-radius:10px;padding:.9rem 1rem;box-shadow:0 20px 40px -25px rgba(0,0,0,.6);font-size:.95rem}
.srcDoc b.t{display:block;margin-bottom:.4rem}
.srcDoc div{display:flex;justify-content:space-between;gap:.6rem;border-bottom:1px solid #DDE3E0;padding:.3rem 0;font-variant-numeric:tabular-nums}
.srcDoc div:last-child{border-bottom:0}
.srcDoc .fort{font-weight:700}

.repart{background:#FFFFFF;color:#1B1F1D;border-radius:10px;padding:1rem;box-shadow:0 20px 40px -25px rgba(0,0,0,.6)}
.repart b.t{display:block;margin-bottom:.6rem}
.barre{display:flex;height:46px;border-radius:12px;overflow:hidden;border:2px solid #1B1F1D}
.barre span{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.barre .act{background:var(--act);color:#062313}.barre .cap{background:var(--cap);color:#061C2A}.barre .tra{background:var(--tra);color:#2A2200}
.legende{display:flex;flex-wrap:wrap;gap:.4rem 1rem;margin-top:.6rem;font-size:.92rem}
.legende i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:.35rem}

.etoiles{font-size:2.6rem;letter-spacing:.2rem;margin:.2rem 0}
.recap{width:100%;border-collapse:collapse;font-size:.98rem;margin:.8rem 0;min-width:0}
.recap td{border:0;border-bottom:1px solid var(--ligne);padding:.35rem 0;color:var(--clair)}
.recap td:last-child{text-align:right;font-weight:700}
.fin-act{display:grid;gap:.5rem;margin-top:.8rem}
.sec{height:52px;border-radius:999px;border:2px solid var(--ligne);background:transparent;font-weight:700}
@media (max-width:600px){.sources{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.rempli{animation:none}.barre span{transition:none}}

.fil{margin:0 0 .7rem}
.fil a{color:var(--clair);opacity:.85;text-decoration:underline;text-underline-offset:4px;font-size:1rem;padding:.35rem .1rem;display:inline-block}
.fil a:hover{opacity:1}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Mission ressources du ménage</h1>
    <p>Calculer le total des ressources et la part du travail — Séance 4</p>
  </header>
  <nav class="fil" aria-label="Fil d'Ariane"><a href="../index.html">← Accueil mapse.fr</a></nav>
  <nav class="filtres" id="filtres" aria-label="Choisir le ménage"></nav>
  <div class="jeu">
    <div class="docZone" id="docZone"></div>
    <aside class="mission" id="mission" aria-label="Mission"></aside>
  </div>
</div>

<script>
/* ===== DONNÉES (ménages fictifs) =====
   cat : act = revenu d'activité · cap = revenu du capital · tra = revenu de transfert */
const MENAGES={
 victor:{titre:"Victor et Amanda (guidé)",nom:"Victor et Amanda",compo:"Victor, Amanda et leurs deux enfants",parcours:"complet",
  lignes:[
   {id:"v",lib:"Salaire net payé de Victor",m:1498,cat:"act",cache:true},
   {id:"a",lib:"Somme disponible de l'activité d'Amanda",m:1070,cat:"act",cache:true},
   {id:"g",lib:"Loyer du garage",m:80,cat:"cap"},
   {id:"f",lib:"Allocations familiales, deux enfants",m:150,cat:"tra"}]},
 nadia:{titre:"Défi 1 : Nadia",nom:"Nadia",compo:"Nadia, vendeuse en jardinerie, et son fils de 10 ans",parcours:"defi",
  lignes:[
   {id:"n1",lib:"Salaire net payé de Nadia",m:1320,cat:"act"},
   {id:"n2",lib:"Aide au logement",m:260,cat:"tra"},
   {id:"n3",lib:"Prestation familiale",m:190,cat:"tra"},
   {id:"n4",lib:"Intérêts du livret d'épargne",m:5,cat:"cap"}]},
 retraites:{titre:"Défi 2 : Jean et Monique",nom:"Jean et Monique",compo:"Jean et Monique, anciens agriculteurs à la retraite",parcours:"defi",
  lignes:[
   {id:"r1",lib:"Pension de retraite de Jean",m:980,cat:"tra"},
   {id:"r2",lib:"Pension de retraite de Monique",m:720,cat:"tra"},
   {id:"r3",lib:"Location d'un champ à un voisin",m:150,cat:"cap"},
   {id:"r4",lib:"Petits travaux de jardinage de Jean, à son compte",m:120,cat:"act"}]}
};
const ORDRE=["victor","nadia","retraites"];
const CAT={act:{nom:"Activité",long:"Revenu d'activité",pk:"il vient du travail"},cap:{nom:"Capital",long:"Revenu du capital",pk:"il vient de ce que l'on possède"},tra:{nom:"Transfert",long:"Revenu de transfert",pk:"il est versé par la protection sociale"}};

/* ===== Outils ===== */
const $=id=>document.getElementById(id);
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const fmt=n=>n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const fmtN=n=>n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const lireNombre=s=>parseFloat(String(s).replace(/[\s\u202f€%]/g,"").replace(",","."));
const tactile=matchMedia("(hover:none)").matches;
const CLE="ressources-menage-mission";
let pref={etoiles:{}};
try{pref=Object.assign(pref,JSON.parse(localStorage.getItem(CLE)||"{}"))}catch(e){}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(pref))}catch(e){}}

function calculer(M){
  const tot=r2(M.lignes.reduce((s,l)=>s+l.m,0));
  const parCat=k=>r2(M.lignes.filter(l=>l.cat===k).reduce((s,l)=>s+l.m,0));
  const travail=parCat("act");
  return {tot,travail,cap:parCat("cap"),tra:parCat("tra"),part:Math.round(travail/tot*100),exact:travail/tot*100};
}

/* ===== Étapes ===== */
const ETAPES={
 victor:{type:"saisie",unite:"€",cellule:"m-v",verbe:"Écrire",txt:()=>"dans le document 7 le salaire net payé de Victor.",
   rep:()=>1498,
   ind:[()=>"Regarde l'extrait du bulletin de paie de Victor.",()=>"Le ménage reçoit la somme versée sur le compte : le net PAYÉ."],
   piege:x=>x===1950?"Ça, c'est le salaire brut. Le ménage reçoit le net payé, après cotisations et impôt."
     :x===1540?"Ça, c'est le net AVANT impôt. Prends le net payé.":null,
   ok:()=>"Salaire net payé de Victor : 1 498,00 €. C'est la somme réellement versée sur son compte.",
   apres:()=>{remplir("v")}},
 amanda:{type:"saisie",unite:"€",cellule:"m-a",verbe:"Écrire",txt:()=>"dans le document 7 la somme disponible de l'activité d'Amanda.",
   rep:()=>1070,
   ind:[()=>"Regarde le relevé d'activité d'Amanda.",()=>"Ce n'est pas ce qu'elle encaisse : c'est ce qui lui reste après les sorties."],
   piege:x=>x===1640?"Ça, c'est le chiffre d'affaires. Il faut retirer les cotisations et les frais."
     :x===570?"Ça, ce sont les sorties : cotisations et frais. Prends ce qui reste.":null,
   ok:()=>"Somme disponible d'Amanda : 1 070,00 €. C'est ce qui lui reste après 570 € de cotisations et de frais.",
   apres:()=>{remplir("a")}},
 cat:{type:"cat",cellule:"c-all",verbe:"Écrire",txt:()=>"la catégorie de chacune des quatre ressources.",
   ind:[()=>"Du travail → activité. De ce que l'on possède → capital. De la protection sociale → transfert.",()=>"Une retraite ou une aide est versée par la protection sociale ; un loyer ou des intérêts viennent d'un bien que l'on possède."]},
 total:{type:"saisie",unite:"€",cellule:"tot",verbe:"Calculer",txt:M=>`le total des ressources du ménage de ${M.nom}.`,
   rep:(M,v)=>v.tot,
   ind:[()=>"Le total des ressources, c'est l'addition de toutes les lignes.",M=>`Calcule ${M.lignes.map(l=>fmtN(l.m)).join(" + ")}.`],
   piege:(x,M,v)=>{const oubli=M.lignes.find(l=>Math.abs(x-(v.tot-l.m))<.01);return oubli?`Tu as oublié une ligne : « ${oubli.lib} ».`:null},
   ok:(M,v)=>`${M.lignes.map(l=>fmtN(l.m)).join(" + ")} = ${fmt(v.tot)}.`,
   apres:()=>{remplir("tot")}},
 travail:{type:"saisie",unite:"€",cellule:"act",verbe:"Calculer",txt:()=>"le montant des ressources qui viennent du travail.",
   rep:(M,v)=>v.travail,
   ind:[()=>"Le travail donne les revenus d'activité.",M=>`Additionne seulement les lignes « Activité » : ${M.lignes.filter(l=>l.cat==="act").map(l=>l.lib).join(" et ")}.`],
   piege:(x,M,v)=>Math.abs(x-v.tot)<.01?"Ça, c'est le total de toutes les ressources. Garde seulement les revenus d'activité."
     :Math.abs(x-(v.travail+v.cap))<.01?"Tu as ajouté un revenu du capital : il vient de ce que l'on possède, pas du travail."
     :Math.abs(x-(v.travail+v.tra))<.01?"Tu as ajouté un revenu de transfert : il vient de la protection sociale, pas du travail.":null,
   ok:(M,v)=>{const a=M.lignes.filter(l=>l.cat==="act");return a.length>1?`${a.map(l=>fmtN(l.m)).join(" + ")} = ${fmt(v.travail)} viennent du travail.`:`${fmt(v.travail)} viennent du travail.`}},
 part:{type:"saisie",unite:"%",cellule:"barre",verbe:"Calculer",txt:()=>"la part des ressources qui vient du travail, en pourcentage arrondi à l'unité.",
   rep:(M,v)=>v.part,
   ind:[()=>"Part en % = la partie ÷ le total × 100.",(M,v)=>`Calcule ${fmtN(v.travail)} ÷ ${fmtN(v.tot)} × 100, puis arrondis à l'unité.`],
   piege:(x,M,v)=>x>100?"Une part ne peut pas dépasser 100 % : tu as divisé le total par la partie. C'est l'inverse."
     :Math.abs(x-v.travail/v.tot)<.01?"Tu as oublié de multiplier par 100."
     :M.lignes.filter(l=>l.cat==="act").some(l=>Math.abs(x-Math.round(l.m/v.tot*100))<.6)&&M.lignes.filter(l=>l.cat==="act").length>1?"Tu n'as pris qu'un seul revenu du travail. Prends les deux revenus d'activité.":null,
   ok:(M,v)=>`${fmtN(v.travail)} ÷ ${fmtN(v.tot)} × 100 = ${v.exact.toFixed(2).replace(".",",")}, arrondi à ${v.part} %.`,
   apres:()=>{montrerBarre()}},
 sens:{type:"choix",verbe:"Expliquer",txt:()=>"ce que ce pourcentage signifie pour le ménage.",
   ind:[(M,v)=>`${v.part} % des ressources viennent du travail. Est-ce presque tout, plus de la moitié, ou peu ?`,()=>"Regarde la barre de répartition sous le tableau."]}
};
const PARCOURS={complet:["victor","amanda","cat","total","travail","part","sens"],defi:["cat","total","travail","part","sens"]};
const SENS=[
  {k:"presque",t:"Le ménage dépend presque entièrement des revenus du travail."},
  {k:"majorite",t:"Le travail apporte la plus grande partie des ressources, mais d'autres revenus comptent aussi."},
  {k:"peu",t:"Le ménage vit surtout grâce à d'autres revenus que le travail."}
];
const bonSens=p=>p>=85?"presque":p>=50?"majorite":"peu";

/* ===== État ===== */
let mId="victor",M,v,seq,i,resolu,erreurs,indices,niv,rempli,cats,valCat;

function filtres(){
  const f=$("filtres");f.innerHTML="";
  ORDRE.forEach(id=>{
    const x=document.createElement("button");x.className="puce";x.setAttribute("aria-pressed",id===mId);
    const e=pref.etoiles[id];x.innerHTML=MENAGES[id].titre+(e?`<span class="et">${"★".repeat(e)}</span>`:"");
    x.onclick=()=>demarrer(id);f.appendChild(x);
  });
}
function demarrer(id){
  mId=id;M=MENAGES[id];v=calculer(M);seq=PARCOURS[M.parcours];i=0;erreurs=0;indices=0;
  rempli=new Set(M.lignes.filter(l=>!l.cache).map(l=>l.id));cats={};valCat=new Set();
  filtres();rendreDoc();etape();
}

/* ===== Documents ===== */
function rendreDoc(){
  const k=seq&&seq[i];
  const ici=c=>ETAPES[k]&&ETAPES[k].cellule===c?" ici":"";
  let h=`<div class="doc">
    <h2>DOC. 7 — Récapitulatif des ressources du ménage, mois de septembre</h2>
    <p class="compo">Ménage : ${M.compo}</p>
    <div class="tabWrap"><table>
      <thead><tr><th>Ressource</th><th class="n">Montant</th><th>Catégorie</th></tr></thead>
      <tbody>
      ${M.lignes.map(l=>`<tr><td>${l.lib}</td>
        <td class="n${ici("m-"+l.id)}" id="m-${l.id}">${rempli.has(l.id)?fmt(l.m):'<span class="trou">…</span>'}</td>
        <td class="${ici("c-all")}">${valCat.has(l.id)?`<span class="tag ${l.cat}">${CAT[l.cat].long}</span>`:'<span class="trou" style="text-align:left">…</span>'}</td></tr>`).join("")}
      <tr class="total"><td>TOTAL DES RESSOURCES DU MÉNAGE</td><td class="n${ici("tot")}" id="m-tot">${rempli.has("tot")?fmt(v.tot):'<span class="trou">…</span>'}</td><td></td></tr>
      </tbody></table></div>
    <p class="source">Ménage fictif. Données d'un mois, en euros.</p>
  </div>`;
  if(M.parcours==="complet")h+=`<div class="sources">
    <div class="srcDoc"><b class="t">Extrait du bulletin de paie de Victor</b>
      <div><span>Salaire brut</span><span>1 950,00 €</span></div>
      <div><span>Net à payer avant impôt</span><span>1 540,00 €</span></div>
      <div class="fort"><span>Net payé en euros</span><span>1 498,00 €</span></div></div>
    <div class="srcDoc"><b class="t">Relevé d'activité d'Amanda</b>
      <div><span>Chiffre d'affaires encaissé</span><span>1 640,00 €</span></div>
      <div><span>Total des sorties</span><span>570,00 €</span></div>
      <div class="fort"><span>Somme restant disponible</span><span>1 070,00 €</span></div></div>
  </div>`;
  h+=`<div class="repart${ici("barre")}" id="repart" ${rempli.has("barre")?"":"hidden"}></div>`;
  $("docZone").innerHTML=h;
  if(rempli.has("barre"))dessinerBarre(false);
}
function remplir(id){rempli.add(id);rendreDoc();const c=$("m-"+id);if(c)c.classList.add("rempli")}
function montrerBarre(){rempli.add("barre");rendreDoc();dessinerBarre(true)}
function dessinerBarre(anim){
  const p={act:v.travail/v.tot*100,cap:v.cap/v.tot*100,tra:v.tra/v.tot*100};
  const r=$("repart");r.hidden=false;
  r.innerHTML=`<b class="t">Répartition des ressources de ${M.nom}</b>
    <div class="barre" role="img" aria-label="Activité ${Math.round(p.act)} %, capital ${Math.round(p.cap)} %, transfert ${Math.round(p.tra)} %">
      ${["act","cap","tra"].map(k=>`<span class="${k}" style="width:${anim?0:p[k]}%" data-w="${p[k]}">${p[k]>=9?Math.round(p[k])+" %":""}</span>`).join("")}
    </div>
    <div class="legende">${["act","cap","tra"].map(k=>`<span><i style="background:var(--${k})"></i>${CAT[k].long} : ${fmt(v[k==="act"?"travail":k])} (${Math.round(p[k])} %)</span>`).join("")}</div>`;
  if(anim)requestAnimationFrame(()=>requestAnimationFrame(()=>r.querySelectorAll(".barre span").forEach(s=>s.style.width=s.dataset.w+"%")));
}

/* ===== Mission ===== */
function etape(){
  const k=seq[i],E=ETAPES[k];resolu=false;niv=0;
  rendreDoc();
  let zone="";
  if(E.type==="saisie")zone=`<div class="saisie"><input id="inp" inputmode="decimal" autocomplete="off" aria-label="Ta réponse en ${E.unite}"><span>${E.unite}</span><button class="valider" id="bVal">Valider</button></div>`;
  else if(E.type==="cat")zone=`<div class="cats">${M.lignes.map(l=>`<div class="catL" id="cl-${l.id}"><p>${l.lib} — ${fmt(l.m)}</p>
      <div class="seg" role="group" aria-label="Catégorie de ${l.lib}">${["act","cap","tra"].map(c=>`<button data-l="${l.id}" data-c="${c}" aria-pressed="false">${CAT[c].nom}</button>`).join("")}</div></div>`).join("")}</div>
      <button class="valider" id="bVal" disabled style="width:100%">Vérifier les catégories</button>`;
  else zone=`<div class="opts">${SENS.map(s=>`<button class="opt" data-k="${s.k}">☐ ${s.t}</button>`).join("")}</div>`;
  $("mission").innerHTML=`
    <div class="m-haut"><span class="m-num">Étape ${i+1} / ${seq.length}</span>
      <div class="pts" aria-hidden="true">${seq.map((_,j)=>`<i class="${j<i?"fait":j===i?"ici":""}"></i>`).join("")}</div></div>
    <p class="consigne"><b>${E.verbe}</b> ${E.txt(M)}</p>
    <div id="rep">${zone}</div>
    <div class="fb" id="fb" role="status" aria-live="polite"></div>
    <div class="outils">
      <button class="outil" id="bInd">💡 Indice</button>
      <button class="outil" id="bLire">🔊 Écouter</button>
      ${E.type==="saisie"?`<button class="outil" id="bCalc">🧮 Calculatrice</button>`:""}
    </div>
    <div class="calc" id="calc" hidden></div>`;
  $("bInd").onclick=indice;
  $("bLire").onclick=()=>lire(`${E.verbe} ${E.txt(M)}`);
  if(E.type==="saisie"){
    $("bCalc").onclick=()=>{const c=$("calc");c.hidden=!c.hidden};construireCalc();
    $("bVal").onclick=valider;$("inp").addEventListener("keydown",e=>{if(e.key==="Enter")valider()});
    if(!tactile)$("inp").focus({preventScroll:true});
  }
  if(E.type==="cat"){
    cats={};
    document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
      if(valCat.has(b.dataset.l))return;
      cats[b.dataset.l]=b.dataset.c;
      b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
      $("cl-"+b.dataset.l).classList.remove("ko");
      $("bVal").disabled=M.lignes.some(l=>!cats[l.id]);
    });
    $("bVal").onclick=verifierCats;
  }
  if(E.type==="choix")document.querySelectorAll(".opt").forEach(o=>o.onclick=()=>choisirSens(o));
}
function fb(cls,html){const f=$("fb");f.className="fb "+cls;f.innerHTML=html}

function valider(){
  if(resolu)return;
  const E=ETAPES[seq[i]],x=lireNombre($("inp").value);
  if(isNaN(x)){fb("neutre","Écris un nombre, par exemple 1 250 ou 45.");return}
  const bon=E.rep(M,v);
  if(Math.abs(x-bon)<.005){reussir(E.ok(M,v),E.apres);return}
  if(seq[i]==="part"&&Math.abs(x-v.exact)<1){fb("ind","<b>Presque !</b> Arrondis à l'unité : pas de chiffre après la virgule.");return}
  erreurs++;
  const p=E.piege&&E.piege(x,M,v);
  fb("ko",`<b>Pas encore.</b> ${p||"Vérifie ton calcul ou demande un indice."}`);
}
function verifierCats(){
  if(resolu)return;
  const fautes=[];
  M.lignes.forEach(l=>{
    if(valCat.has(l.id))return;
    if(cats[l.id]===l.cat){valCat.add(l.id);$("cl-"+l.id).className="catL ok";$("cl-"+l.id).querySelectorAll("button").forEach(b=>b.disabled=true)}
    else{fautes.push(l);$("cl-"+l.id).className="catL ko"}
  });
  rendreDoc();
  if(!fautes.length){reussir("Chaque ressource est dans la bonne catégorie : "+["act","cap","tra"].map(k=>M.lignes.filter(l=>l.cat===k).length+" "+CAT[k].nom.toLowerCase()).join(", ")+".");return}
  erreurs+=fautes.length;
  fb("ko",`<b>${fautes.length} catégorie${fautes.length>1?"s":""} à revoir</b> (en rouge). Pose-toi la question : d'où vient cet argent ?<ul>${fautes.map(l=>`<li>${l.lib} : ${CAT[cats[l.id]].long.toLowerCase()} ? Un ${CAT[cats[l.id]].long.toLowerCase()}, ${CAT[cats[l.id]].pk}. Est-ce le cas ici ?</li>`).join("")}</ul>`);
}
function choisirSens(o){
  if(resolu)return;
  const bon=bonSens(v.part);
  if(o.dataset.k===bon){
    o.textContent="☑"+o.textContent.slice(1);
    const dom=v.tra>=v.cap?"les revenus de transfert":"les revenus du capital",pd=Math.round((v.tra>=v.cap?v.tra:v.cap)/v.tot*100);
    reussir(bon==="presque"?`${v.part} % des ressources viennent du travail : si un revenu du travail s'arrête, le ménage perd presque tout.`
      :bon==="majorite"?`${v.part} % viennent du travail. Les autres ${100-v.part} % viennent surtout d'autres sources, ici ${dom}.`
      :`Seulement ${v.part} % viennent du travail. Le ménage vit surtout grâce à ${dom} (${pd} %).`);
    return;
  }
  erreurs++;
  fb("ko",`<b>Pas tout à fait.</b> Relis ton résultat : ${v.part} % des ressources viennent du travail. Regarde la barre de répartition.`);
}
function reussir(msg,apres){
  resolu=true;if(apres)apres();
  fb("ok",`<b>✓ Bravo !</b> ${msg}`);
  const der=i===seq.length-1;
  $("rep").querySelectorAll("input,.valider").forEach(x=>x.disabled=true);
  const b=document.createElement("button");b.className="continuer";b.id="bCont";b.textContent=der?"Voir mon résultat":"Étape suivante";
  b.style.marginTop=".7rem";$("rep").appendChild(b);
  b.onclick=()=>{arreterVoix();i++;der?fin():etape()};
  b.focus({preventScroll:true});
  const c=$("calc");if(c)c.hidden=true;
}
function indice(){
  if(resolu)return;
  const E=ETAPES[seq[i]];
  if(niv<E.ind.length){indices++;fb("ind",`<b>💡 Indice ${niv+1} :</b> ${E.ind[niv](M,v)}`);niv++}
  else fb("ind",`<b>💡</b> ${E.ind[E.ind.length-1](M,v)} Tu as vu tous les indices.`);
}
function fin(){
  const pts=erreurs+indices,et=pts<=1?3:pts<=4?2:1;
  pref.etoiles[mId]=Math.max(pref.etoiles[mId]||0,et);sauver();filtres();
  seq=null;rendreDoc();
  const suiv=ORDRE[ORDRE.indexOf(mId)+1];
  $("mission").innerHTML=`
    <p class="consigne" style="margin-bottom:0">Mission accomplie !</p>
    <div class="etoiles" aria-label="${et} étoile${et>1?"s":""} sur 3">${"★".repeat(et)}<span style="opacity:.25">${"★".repeat(3-et)}</span></div>
    <p style="margin:0;opacity:.85">${erreurs} erreur${erreurs>1?"s":""} · ${indices} indice${indices>1?"s":""} utilisé${indices>1?"s":""}</p>
    <table class="recap"><tbody>
      <tr><td>Total des ressources</td><td>${fmt(v.tot)}</td></tr>
      <tr><td>Revenus du travail</td><td>${fmt(v.travail)}</td></tr>
      <tr><td>Revenus du capital</td><td>${fmt(v.cap)}</td></tr>
      <tr><td>Revenus de transfert</td><td>${fmt(v.tra)}</td></tr>
      <tr><td>Part du travail</td><td>${v.part} %</td></tr>
    </tbody></table>
    <p style="margin:.2rem 0 0;font-size:.98rem;opacity:.9">À retenir : une part en % = la partie ÷ le total × 100.</p>
    <div class="fin-act">
      ${suiv?`<button class="continuer" id="bSuiv">${MENAGES[suiv].titre} →</button>`:""}
      <button class="sec" id="bRec">Recommencer ce ménage</button>
    </div>`;
  if(suiv)$("bSuiv").onclick=()=>{demarrer(suiv);scrollTo({top:0,behavior:"smooth"})};
  $("bRec").onclick=()=>demarrer(mId);
}

/* ===== Calculatrice ===== */
let expr="";
function construireCalc(){
  expr="";
  const T=["7","8","9","÷","4","5","6","×","1","2","3","−","0",",","=","+","C","⌫"];
  $("calc").innerHTML=`<div class="ecran" id="ecran" aria-live="polite">0</div><div class="touches">${T.map(t=>
    `<button data-t="${t}" class="${"÷×−+".includes(t)?"op":t==="="?"eg":""}${t==="C"||t==="⌫"?" large":""}" aria-label="${{"÷":"diviser","×":"multiplier","−":"moins","+":"plus","⌫":"effacer","C":"tout effacer"}[t]||t}">${t}</button>`).join("")}</div>
    <button class="outil" id="bCopie" style="margin-top:.5rem;width:100%">↳ Mettre le résultat dans ma réponse</button>`;
  $("calc").querySelectorAll("[data-t]").forEach(x=>x.onclick=()=>touche(x.dataset.t));
  $("bCopie").onclick=()=>{const inp=$("inp");if(inp&&expr){calculerExpr();inp.value=expr;inp.focus()}};
}
function touche(t){if(t==="C")expr="";else if(t==="⌫")expr=expr.slice(0,-1);else if(t==="=")calculerExpr();else expr+=t;$("ecran").textContent=expr||"0"}
function calculerExpr(){
  const e=expr.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/,/g,".");
  if(!/^[0-9.+\-*/]+$/.test(e))return;
  try{let r=Function(`"use strict";return (${e})`)();if(!isFinite(r)){expr="";$("ecran").textContent="Erreur";return}
    r=Math.round(r*10000)/10000;expr=String(r).replace(".",",")}catch(err){$("ecran").textContent="Erreur";expr="";return}
  $("ecran").textContent=expr;
}

/* ===== Voix ===== */
let voix=null;
function choisirVoix(){const l=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));voix=l.find(x=>/fr-FR/i.test(x.lang)&&/(google|natural|online|amélie|thomas|denise|henri)/i.test(x.name))||l.find(x=>/fr-FR/i.test(x.lang))||l[0]||null}
if("speechSynthesis" in window){choisirVoix();speechSynthesis.onvoiceschanged=choisirVoix}
function lire(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voix)u.voice=voix;u.rate=.95;speechSynthesis.speak(u)}
function arreterVoix(){if("speechSynthesis" in window)speechSynthesis.cancel()}

demarrer("victor");
</script>
