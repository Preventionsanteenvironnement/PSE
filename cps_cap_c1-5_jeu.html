<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPS C1.5 — Mes forces</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f4f7fc;color:#1e293b;line-height:1.6;padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.back{display:inline-block;color:#1d4ed8;text-decoration:none;font-weight:800;font-size:1rem;margin-bottom:10px}
.back:hover{text-decoration:underline}
.prog{position:sticky;top:0;z-index:5;background:#f4f7fc;padding:6px 0 10px}
.prog .label{font-size:.78rem;font-weight:800;color:#1e40af;margin-bottom:4px;text-align:center}
.prog .track{height:10px;background:#dbeafe;border-radius:20px;overflow:hidden}
.prog .track > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1d4ed8,#3b82f6);border-radius:20px;transition:width .4s ease}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 3px 14px rgba(0,0,0,.06);animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hero{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border-radius:20px;padding:26px 20px;text-align:center;margin-bottom:6px}
.hero .ic{font-size:3rem;display:block;margin-bottom:6px}
.hero h1{font-size:1.5rem;font-weight:900}
.hero p{opacity:.95;font-size:.96rem;margin-top:6px}
.txt{font-size:1.12rem;font-weight:600;line-height:1.5;margin:6px 0 12px}
.teach{background:#eff6ff;border-left:6px solid #1d4ed8;border-radius:0 12px 12px 0;padding:12px 14px;font-size:1.04rem;margin-bottom:12px}
.q{font-size:1.12rem;font-weight:800;color:#1e40af;margin:6px 0 12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:14px;border:2px solid #bfdbfe;background:#fff;cursor:pointer;font-family:inherit;font-size:1.05rem;font-weight:700;color:#1e293b;transition:.15s}
.opt:hover:not(:disabled){border-color:#1d4ed8;background:#eff6ff}
.opt:disabled{cursor:default}
.opt.ok{border-color:#22c55e;background:#dcfce7;color:#166534}
.opt.no{border-color:#fca5a5;background:#fee2e2;color:#991b1b}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0}
.chip{border:2px solid #bfdbfe;background:#fff;border-radius:30px;padding:10px 15px;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit;color:#1e293b;transition:.12s}
.chip:hover{border-color:#1d4ed8}
.chip.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.hint{font-size:.92rem;color:#64748b;font-weight:700;text-align:center;margin-top:4px}
.fb{margin-top:14px}
.msg{border-radius:14px;padding:13px 15px;font-weight:700;font-size:1rem;animation:fade .3s}
.msg.good{background:#dcfce7;border:2px solid #86efac;color:#166534}
.msg.bad{background:#fff7ed;border:2px solid #fed7aa;color:#9a3412}
.msg.win{background:#dbeafe;border:2px solid #93c5fd;color:#1e40af}
.btn{display:block;width:100%;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border:none;border-radius:14px;padding:15px;font-size:1.1rem;font-weight:800;cursor:pointer;font-family:inherit;margin-top:12px;text-align:center;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.btn:active{transform:translateY(1px)}
.btn.soft{background:#e0e7ff;color:#3730a3}
.say{float:right;background:#eff6ff;color:#1d4ed8;border:none;border-radius:10px;padding:6px 11px;font-size:.95rem;font-weight:800;cursor:pointer}
.recap{list-style:none;margin:10px 0 0}
.recap li{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 13px;margin-bottom:8px;font-size:.98rem}
.badge{text-align:center;font-size:1.1rem;font-weight:900;color:#1e40af;margin:10px 0}
@media(max-width:600px){.wrap{padding:10px}.card{padding:16px}.txt{font-size:1.05rem}.hero h1{font-size:1.3rem}}
.jimg{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:14px;margin:6px 0 10px;background:#fff}
.jimgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
<link rel="stylesheet" href="assets/acces.css?v=5">
<link rel="stylesheet" href="assets/cps_moi.css?v=20261107">
<script src="assets/acces.js?v=5" defer></script>
<!-- Mesure d'audience anonyme (GoatCounter) : chemin de page seul, sans paramètres -->
<script>window.goatcounter={path:function(){return location.pathname||"/"}};</script>
<script data-goatcounter="https://brahms.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Accueil</a>
  <div data-cps-moi="retour" data-code="C1.5" data-titre="Reconnaître mes forces" data-fam="Penser et agir"></div>
  <div class="prog"><div class="label" id="proglabel"></div><div class="track"><i id="progbar"></i></div></div>
  <div id="scene"></div>
  <div id="moi-park" hidden>
    <div id="moi-perso">
      <div data-cps-moi="sequence" data-code="C1.5" data-titre="Reconnaître mes forces" data-fam="Penser et agir"><script type="application/json">{"tag": "Et moi ?", "title": "Le portrait d’une réussite", "steps": [{"kind": "texte", "q": "Ma réussite, en une phrase :", "carnet": "Ma réussite", "aide": "Exemple : j’ai fait seul ma première démarche en ligne."}, {"kind": "texte", "q": "Ce que j’ai pensé à ce moment-là :", "carnet": "Ce que j’ai pensé", "aide": "Exemple : « Je ne pensais pas y arriver. »"}, {"kind": "emotion", "q": "Ce que j’ai ressenti :", "carnet": "Ce que j’ai ressenti"}, {"kind": "choix", "q": "Les qualités que j’ai utilisées :", "carnet": "Les qualités que j’ai utilisées", "multi": true, "autre": true, "opts": ["Persévérance", "Patience", "Habileté", "Sérieux", "Courage", "Créativité", "Entraide", "Organisation", "Calme"]}], "fin": "Cette réussite montre des forces réelles. Tu peux t’appuyer dessus."}</script></div>
    </div>
    <div id="moi-fin">
      <div data-cps-moi="defi" data-code="C1.5" data-titre="Reconnaître mes forces" data-fam="Penser et agir"><script type="application/json">{"q": "Choisis une seule chose à essayer cette semaine.", "opts": ["Le soir, noter une chose que j’ai bien faite", "Remplacer une phrase dure sur moi par une phrase juste", "Dire à un camarade une force que j’ai vue chez lui ou chez elle"]}</script></div>
      <div data-cps-moi="duo"><script type="application/json">{"duree": "10 minutes", "situation": "Chacun pense à une réussite, même petite : au lycée, en stage ou dans la vie de tous les jours.", "roleA": "Raconte ta réussite en une minute : ce que tu as fait, et comment.", "roleB": "Écoute sans couper. Puis relève 2 qualités, avec un exemple pris dans le récit.", "etapes": ["Le professeur chronomètre une minute.", "A raconte, B écoute.", "B dit : « J’ai vu… quand tu as… »", "On inverse les rôles."], "observe": ["A décrit ce qu’il ou elle a fait", "B nomme 2 qualités", "B donne un exemple pour chaque qualité"]}</script></div>
    </div>
  </div>
</div>
<script src="assets/cps_moi.js?v=20261107"></script>
<script>
(function(){
  var scene=document.getElementById('scene');
  var idx=0;
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function speak(t){ try{ if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,'')); u.lang='fr-FR'; u.rate=0.95; speechSynthesis.speak(u);}catch(e){} }
  function go(i){ idx=i; try{speechSynthesis.cancel();}catch(e){} render(); }
  function progress(){ document.getElementById('progbar').style.width=Math.round(idx/(STEPS.length-1)*100)+'%'; document.getElementById('proglabel').textContent='Étape '+(idx+1)+' / '+STEPS.length; }
  function continueBtn(label){ var b=document.createElement('button'); b.className='btn'; b.textContent=label||'Continuer →'; b.onclick=function(){ go(idx+1); }; return b; }

  var STEPS=[
    { type:'intro', text:"On voit souvent ce qu’on rate, rarement ce qu’on réussit. Pourtant, chacun a des <strong>forces</strong>. Tu vas apprendre à voir les tiennes et à te parler avec respect." },

    { type:'notion',
      teach:"Une <strong>force</strong>, ce n’est pas seulement avoir de bonnes notes. C’est une qualité ou une chose que tu fais bien : être patient, aider, être manuel…",
      q:"Une force, c’est…",
      options:[
        {l:"seulement avoir de bonnes notes",ok:false},
        {l:"une qualité ou une chose que je fais bien",ok:true},
        {l:"être meilleur que les autres",ok:false}
      ],
      wrong:"Pas tout à fait. Une force ne dépend ni des notes ni des autres. C’est une qualité à toi.",
      good:"Oui. C’est une qualité, ou une chose que tu fais bien, à ta manière." },

    { type:'cases',
      teach:"Chaque action montre une <strong>force</strong>. À toi de la repérer.",
      q:"Quelle force cette personne montre-t-elle ?",
      items:[
        { text:"Malik a raté deux fois la fin de son travail. Il a recommencé jusqu’au bout.",
          img:"assets/cps/scenes/scene-malik-joie-panier.jpg",
          alt:"Dans une salle de cours pratique, Malik montre l’objet qu’il vient de fabriquer. Mme Roche, à côté de lui, lève le pouce.",
          options:[
            {l:"La chance",good:false,fb:"Il a raté deux fois : ce n’est pas de la chance."},
            {l:"La vitesse",good:false,fb:"Il a mis du temps. Sa force, c’est d’avoir continué."},
            {l:"La persévérance",good:true,fb:"Oui : recommencer jusqu’au bout, c’est de la persévérance."}
          ] },
        { text:"Lina explique calmement l’exercice à un camarade qui n’a pas compris.",
          options:[
            {l:"La patience et l’entraide",good:true,fb:"Oui : elle prend le temps et elle aide."},
            {l:"La chance",good:false,fb:"Ce n’est pas de la chance : c’est une qualité qu’elle utilise."},
            {l:"Rien de spécial",good:false,fb:"Aider avec patience, c’est une vraie force."}
          ] },
        { text:"Malgré sa peur, Julie passe à l’oral jusqu’au bout.",
          options:[
            {l:"L’inconscience",good:false,fb:"Elle avait peur, justement : elle a été courageuse."},
            {l:"Le courage",good:true,fb:"Oui : avoir peur et le faire quand même, c’est du courage."},
            {l:"De la chance",good:false,fb:"Tenir jusqu’au bout malgré la peur, ce n’est pas un hasard."}
          ] },
        { text:"Noa range et nettoie l’appartement de la colocation sans qu’on le lui demande.",
          options:[
            {l:"L’ennui",good:false,fb:"Prendre soin du lieu, c’est être responsable."},
            {l:"La maladresse",good:false,fb:"Au contraire, il fait preuve de sérieux."},
            {l:"Le sens des responsabilités",good:true,fb:"Oui : il agit sans qu’on l’oblige."}
          ] }
      ] },

    { type:'cases',
      teach:"<strong>Accepter un compliment</strong>, c’est reconnaître sa force. Ce n’est pas se vanter.",
      q:"On te fait un compliment. Que réponds-tu ?",
      items:[
        { text:"« Ton travail est vraiment soigné ! »",
          options:[
            {l:"« Mais non, c’est nul. »",good:false,fb:"Tu te rabaisses : ton travail mérite d’être reconnu."},
            {l:"« Merci, ça me fait plaisir. »",good:true,fb:"Tu accueilles le compliment simplement."},
            {l:"« C’est juste de la chance. »",good:false,fb:"Ce n’est pas de la chance : c’est ton soin."}
          ] },
        { text:"« Tu as bien aidé ton camarade aujourd’hui. »",
          options:[
            {l:"« Bof, j’ai rien fait. »",good:false,fb:"Tu effaces ton geste : pourtant, tu as aidé."},
            {l:"« Évidemment, je suis le meilleur. »",good:false,fb:"Là, tu te vantes. Accepter, ce n’est pas en rajouter."},
            {l:"« Merci, ça m’a fait plaisir. »",good:true,fb:"Tu acceptes le compliment sans en faire trop."}
          ] }
      ] },

    { type:'pick',
      teach:"Voici des forces possibles. Lesquelles te ressemblent le plus ?",
      q:"Compose ton blason : choisis tes forces.",
      min:2, max:4,
      options:["Patient(e)","Courageux(se)","Drôle","À l’écoute","Manuel(le)","Organisé(e)","Généreux(se)","Persévérant(e)","Créatif(ve)","Calme","Fiable","Débrouillard(e)"],
      done:"Voilà <strong>ton blason</strong> : des forces sur lesquelles tu peux t’appuyer." },

    { type:'perso',
      text:"À toi. Fais le portrait d’une de tes réussites, même petite. Rien n’est noté." },

    { type:'bilan',
      recap:[
        "Une <strong>force</strong>, c’est une qualité ou une chose qu’on fait bien. Pas seulement les notes.",
        "J’<strong>accepte un compliment</strong> : « merci », sans me rabaisser ni me vanter.",
        "Je m’<strong>appuie sur mes forces</strong> pour avancer."
      ] }
  ];
  function park(){ var p=document.getElementById('moi-park'); ['moi-perso','moi-fin'].forEach(function(id){ var n=document.getElementById(id); if(p && n && n.parentNode!==p) p.appendChild(n); }); }
  function render(){
    park(); var s=STEPS[idx]; progress(); window.scrollTo({top:0,behavior:'smooth'});

    if(s.type==='intro'){
      scene.innerHTML='<div class="hero"><span class="ic"></span><h1>Mes forces</h1><p>Compétence C1.5</p></div><div class="card"><p class="txt">'+s.text+'</p></div>';
      var b=document.createElement('button'); b.className='btn'; b.textContent='Commencer'; b.onclick=function(){ go(idx+1); }; scene.querySelector('.card').appendChild(b); return;
    }

    if(s.type==='notion'){
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div class="opts"></div><div class="fb"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach+' '+s.q); };
      var opts=scene.querySelector('.opts'), fb=scene.querySelector('.fb'), done=false;
      shuffle(s.options).forEach(function(o){
        var b=document.createElement('button'); b.className='opt'; b.textContent=o.l;
        b.onclick=function(){
          if(done)return;
          if(o.ok){ done=true; opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); b.classList.add('ok'); fb.innerHTML='<div class="msg good">✓ '+s.good+'</div>'; fb.appendChild(continueBtn()); }
          else { b.classList.add('no'); b.disabled=true; fb.innerHTML='<div class="msg bad">'+s.wrong+' <strong>Réessaie.</strong></div>'; }
        };
        opts.appendChild(b);
      });
      return;
    }

    if(s.type==='cases'){
      var j=0;
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div id="cc"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach); };
      var area=scene.querySelector('#cc');
      function drawCase(){
        var it=s.items[j];
        area.innerHTML=(it.img?'<img class="jimg" src="'+it.img+'" alt="'+(it.alt||'')+'">':'')+'<p class="txt">'+it.text+'</p><div class="opts"></div><div class="fb"></div>';
        var opts=area.querySelector('.opts'), fb=area.querySelector('.fb'), done=false;
        shuffle(it.options).forEach(function(o){
          var b=document.createElement('button'); b.className='opt'; b.textContent=o.l;
          b.onclick=function(){
            if(done)return;
            if(o.good){ done=true; opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); b.classList.add('ok'); fb.innerHTML='<div class="msg good">✓ '+o.fb+'</div>'; var nb=document.createElement('button'); nb.className='btn'; nb.textContent=(j>=s.items.length-1)?'Continuer →':'Suivant →'; nb.onclick=function(){ if(j>=s.items.length-1){ go(idx+1);} else {j++; drawCase();} }; fb.appendChild(nb); }
            else { b.classList.add('no'); b.disabled=true; fb.innerHTML='<div class="msg bad">'+o.fb+' <strong>Réessaie.</strong></div>'; }
          };
          opts.appendChild(b);
        });
      }
      drawCase();
      return;
    }

    if(s.type==='pick'){
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div class="chips"></div><div class="hint"></div><div class="fb"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach+' '+s.q); };
      var chips=scene.querySelector('.chips'), hint=scene.querySelector('.hint'), fb=scene.querySelector('.fb'), sel=[];
      var cont=continueBtn('Valider mon blason →'); cont.disabled=true;
      function refresh(){ hint.textContent=sel.length+' choisie(s) — choisis-en '+s.min+' à '+s.max+'.'; cont.disabled=(sel.length<s.min||sel.length>s.max); }
      shuffle(s.options).forEach(function(o){
        var c=document.createElement('button'); c.className='chip'; c.textContent=o;
        c.onclick=function(){
          var i=sel.indexOf(o);
          if(i>=0){ sel.splice(i,1); c.classList.remove('on'); }
          else { if(sel.length>=s.max) return; sel.push(o); c.classList.add('on'); }
          refresh();
        };
        chips.appendChild(c);
      });
      cont.onclick=function(){ try{ if(window.CPSMoi) CPSMoi.carnet.noter({"code": "C1.5", "titre": "Reconnaître mes forces", "fam": "Penser et agir"}, "Mon blason des forces", sel.join(', ')); }catch(e){} go(idx+1); };
      fb.innerHTML='<div class="msg win">'+s.done+'</div>'; fb.appendChild(cont);
      refresh();
      return;
    }

    if(s.type==='perso'){
      scene.innerHTML='<div class="card"><p class="txt">'+s.text+'</p></div>';
      var pc=scene.querySelector('.card'), mp=document.getElementById('moi-perso'); if(mp) pc.appendChild(mp);
      pc.appendChild(continueBtn('Continuer →'));
      return;
    }

    if(s.type==='bilan'){
      var h='<div class="hero"><span class="ic"></span><h1>Bilan</h1><p>Tu sais voir tes forces.</p></div><div class="card"><p class="txt" style="font-size:1rem;font-weight:800;color:#1e40af">Ce que tu as appris :</p><ul class="recap">';
      s.recap.forEach(function(r){ h+='<li>'+r+'</li>'; });
      h+='</ul></div>';
      scene.innerHTML=h;
      var c=scene.querySelector('.card');
      var mf=document.getElementById('moi-fin'); if(mf) c.appendChild(mf);
      var rb=document.createElement('button'); rb.className='btn'; rb.textContent='Recommencer'; rb.onclick=function(){ go(0); }; c.appendChild(rb);
      var hb=document.createElement('a'); hb.className='btn soft'; hb.href='index.html'; hb.textContent='← Retour à l’accueil'; c.appendChild(hb);
      return;
    }
  }
  render();
})();
</script>
</body>
</html>
