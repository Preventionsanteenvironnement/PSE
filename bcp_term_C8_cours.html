<script>window.COURS = {"slug":"bcp_term_C8","classe":"Terminale Bac Pro","retour":"index.html#tle-c8","pied":"Module C8 — Terminale Bac Pro. Prévention, santé, environnement — M. MECHERI. Sources indiquées sous chaque document.","version":"4.0","entete":{"module_code":"C8","titre":"Déclaration et réparation des accidents du travail et des maladies professionnelles","niveau":"Terminale Bac Pro","annee":"2026-27","thematique":"Thématique C — L'individu et la prévention des risques professionnels","objectif_general":"Être capable d'identifier les démarches de déclaration et d'indemnisation."},"blocks":[{"id":"c8_s1_seance","type":"seance","data":{"numero":"1","titre":"La déclaration d'un accident du travail ou d'une maladie professionnelle","objectif":"Être capable d'identifier les étapes d'une procédure de déclaration.","competences":["C1","C2"]}},{"id":"c8_s1_situation","type":"situation","data":{"texte":"Inès, 23 ans, est préparatrice de commandes depuis quatre mois dans l'entrepôt de Distripièces. C'est son premier emploi.\n\nJeudi 12 mars, à 16 h 40, elle descend d'un marchepied roulant pour reposer un carton. Le frein de l'appareil ne bloque plus les roues : le marchepied glisse, Inès pose le pied de travers et se tord la cheville. Un collègue, Yanis, assiste à la scène.\n\nAux urgences, le médecin diagnostique une entorse. Il prescrit un arrêt de travail de 21 jours, deux radiographies de la cheville et dix séances de kinésithérapie. Le mois précédant son arrêt, Inès a perçu 1 850 € brut.\n\nInès n'a jamais eu d'accident au travail. Elle ne sait pas quelles démarches accomplir, elle craint de payer elle-même ses soins et de perdre une partie de son salaire.","source":""}},{"id":"c8_s1_analyse","type":"analyse","data":{"titre":"ANALYSER LA SITUATION"}},{"id":"c8_s1_q1","type":"question_chapeau","data":{"numero":"1","texte":"À partir de la situation d'Inès :"}},{"id":"c8_s1_q1_1","type":"sous_question","data":{"competence":"C1","numero":"1.1","texte":"**Compléter** le tableau d'analyse de la situation.","lignes":0,"style_lignes":"","support_type":"","indice":"","reponse_attendue":"Qui ? Inès, 23 ans, préparatrice de commandes chez Distripièces. — Quoi ? Le marchepied a glissé et Inès s'est tordu la cheville. — Où ? Dans l'entrepôt de Distripièces. — Quand ? Jeudi 12 mars à 16 h 40, pendant le temps de travail. — Comment ? Le frein du marchepied ne bloquait plus les roues. — Pourquoi ? Des soins à payer et une perte de salaire pendant 21 jours.","variantes":{"adapte":{"indice":"Ordre des réponses dans le texte : le lieu, le moment, la cause de l'accident, les conséquences pour Inès."},"essentiel":{"indice":"Cause de l'accident : le frein du marchepied. Conséquences : les soins à payer et le salaire perdu."}}},"el":{"standard":{"indice":"Réponses à chercher dans la situation d'Inès, dans l'ordre des paragraphes : la personne, le fait, le lieu, le moment, la cause, les conséquences.","explication":"Qui : Inès, 23 ans, préparatrice de commandes chez Distripièces. Quoi, où, quand : le marchepied glisse et Inès se tord la cheville, dans l'entrepôt, le jeudi 12 mars à 16 h 40, donc pendant le temps de travail. Comment et conséquences : le frein ne bloquait plus les roues ; Inès craint de payer ses soins et de perdre du salaire pendant ses 21 jours d'arrêt."},"adapte":{"indice":"Ordre des réponses dans le texte : le lieu, le moment, la cause de l'accident, les conséquences pour Inès.","explication":"Où et quand : dans l'entrepôt de Distripièces, le jeudi 12 mars à 16 h 40, donc pendant le temps de travail. Comment : le frein du marchepied ne bloquait plus les roues. Conséquences : des soins à payer et une perte de salaire pendant les 21 jours d'arrêt."},"essentiel":{"indice":"Cause : un défaut du matériel, décrit dans le deuxième paragraphe. Conséquences : les craintes d'Inès, dans le dernier paragraphe.","explication":"Comment : le frein du marchepied ne bloquait plus les roues, ce qui a fait glisser l'appareil. Conséquences : Inès craint de payer ses soins et de perdre une partie de son salaire pendant ses 21 jours d'arrêt."}}},{"id":"c8_s1_tab_analyse","type":"tableau","data":{"titre":"Analyse de la situation d'Inès","table_student_style":"lines","cells":[[{"type":"prof","content":"Question"},{"type":"prof","content":"Réponse"}],[{"type":"prof","content":"Qui ?"},{"type":"eleve","content":"","reponse":"Inès, 23 ans, préparatrice de commandes chez Distripièces."}],[{"type":"prof","content":"Quoi ? Que s'est-il passé ?"},{"type":"eleve","content":"","reponse":"Le marchepied a glissé et Inès s'est tordu la cheville."}],[{"type":"prof","content":"Où ?"},{"type":"eleve","content":"","reponse":"Dans l'entrepôt de Distripièces."}],[{"type":"prof","content":"Quand ?"},{"type":"eleve","content":"","reponse":"Jeudi 12 mars à 16 h 40, pendant le temps de travail."}],[{"type":"prof","content":"Comment ? Quel élément a favorisé l'accident ?"},{"type":"eleve","content":"","reponse":"Le frein du marchepied ne bloquait plus les roues."}],[{"type":"prof","content":"Pourquoi ? Quelles conséquences pour Inès ?"},{"type":"eleve","content":"","reponse":"Des soins à payer et une perte de salaire pendant 21 jours."}]],"variantes":{"adapte":{"cells":[[{"type":"prof","content":"Question"},{"type":"prof","content":"Réponse"}],[{"type":"prof","content":"Qui ?"},{"type":"prof","content":"Inès, 23 ans, préparatrice de commandes chez Distripièces."}],[{"type":"prof","content":"Quoi ? Que s'est-il passé ?"},{"type":"prof","content":"Le marchepied a glissé et Inès s'est tordu la cheville."}],[{"type":"prof","content":"Où ?"},{"type":"eleve","content":"","reponse":"Dans l'entrepôt de Distripièces."}],[{"type":"prof","content":"Quand ?"},{"type":"eleve","content":"","reponse":"Jeudi 12 mars à 16 h 40, pendant le temps de travail."}],[{"type":"prof","content":"Comment ? Quel élément a favorisé l'accident ?"},{"type":"eleve","content":"","reponse":"Le frein du marchepied ne bloquait plus les roues."}],[{"type":"prof","content":"Pourquoi ? Quelles conséquences pour Inès ?"},{"type":"eleve","content":"","reponse":"Des soins à payer et une perte de salaire pendant 21 jours."}]]},"essentiel":{"cells":[[{"type":"prof","content":"Question"},{"type":"prof","content":"Réponse"}],[{"type":"prof","content":"Qui ?"},{"type":"prof","content":"Inès, 23 ans, préparatrice de commandes chez Distripièces."}],[{"type":"prof","content":"Quoi ? Que s'est-il passé ?"},{"type":"prof","content":"Le marchepied a glissé et Inès s'est tordu la cheville."}],[{"type":"prof","content":"Où ?"},{"type":"prof","content":"Dans l'entrepôt de Distripièces."}],[{"type":"prof","content":"Quand ?"},{"type":"prof","content":"Jeudi 12 mars à 16 h 40, pendant le temps de travail."}],[{"type":"prof","content":"Comment ? Quel élément a favorisé l'accident ?"},{"type":"eleve","content":"","reponse":"Le frein du marchepied ne bloquait plus les roues."}],[{"type":"prof","content":"Pourquoi ? Quelles conséquences pour Inès ?"},{"type":"eleve","content":"","reponse":"Des soins à payer et une perte de salaire pendant 21 jours."}]]}}}},{"id":"c8_s1_q1_2","type":"sous_question","data":{"competence":"C2","numero":"1.2","texte":"**Formuler** le problème évoqué dans la situation.","lignes":2,"style_lignes":"tiret_guide","support_type":"","indice":"","reponse_attendue":"Inès doit faire reconnaître son accident et obtenir la prise en charge de ses soins.","variantes":{"adapte":{"texte":"**Formuler** le problème évoqué dans la situation, en cochant une seule proposition.\n☐ Inès doit apprendre à porter des charges lourdes dans l'entrepôt.\n☐ Inès doit faire reconnaître son accident et obtenir la prise en charge de ses soins.\n☐ Inès doit demander un changement de poste après son arrêt de travail.","lignes":0,"indice":"Une seule proposition évoque à la fois l'accident et les soins."},"essentiel":{"texte":"**Formuler** le problème évoqué dans la situation, en cochant une seule proposition.\n☐ Inès doit apprendre à porter des charges lourdes dans l'entrepôt.\n☐ Inès doit faire reconnaître son accident et obtenir la prise en charge de ses soins.\n☐ Inès doit demander un changement de poste après son arrêt de travail.","lignes":0,"indice":"Une seule proposition évoque à la fois l'accident et les soins."}}},"el":{"standard":{"indice":"Problème à formuler à partir des inquiétudes d'Inès, dans le dernier paragraphe de la situation.","explication":"Inès ne connaît pas les démarches à accomplir et craint de payer ses soins : le problème porte sur la reconnaissance de l'accident et sur la prise en charge des soins. Formulation possible : Inès doit faire reconnaître son accident et obtenir la prise en charge de ses soins."},"adapte":{"indice":"Une seule proposition évoque à la fois l'accident et les soins.","explication":"La deuxième proposition reprend les deux inquiétudes d'Inès : les démarches liées à son accident et le paiement de ses soins. Le port de charges lourdes et le changement de poste n'apparaissent pas dans la situation.","choix_corrects":[1]},"essentiel":{"indice":"Une seule proposition évoque à la fois l'accident et les soins.","explication":"La deuxième proposition reprend les deux inquiétudes d'Inès : les démarches liées à son accident et le paiement de ses soins. Le port de charges lourdes et le changement de poste n'apparaissent pas dans la situation.","choix_corrects":[1]}}},{"id":"c8_s1_doc1","type":"document","data":{"label":"DOC. 1","titre":"Accident du travail, accident de trajet, maladie professionnelle","corps":"**L'accident du travail.** Est considéré comme accident du travail l'accident survenu par le fait ou à l'occasion du travail, quelle qu'en soit la cause. Trois critères sont recherchés : un fait accidentel soudain, une lésion physique ou psychique, un lien avec le travail.\n\n**L'accident de trajet.** Il survient sur le parcours habituel entre la résidence et le lieu de travail, ou entre le lieu de travail et le lieu habituel des repas. Le trajet ne doit normalement pas être interrompu ou détourné pour un motif personnel étranger aux nécessités essentielles de la vie courante.\n\n**La maladie professionnelle.** Elle résulte de l'exposition, plus ou moins prolongée, à un risque dans le cadre du travail. Elle s'installe progressivement, sans fait accidentel.","source":"D'après l'Assurance Maladie et le code de la sécurité sociale."}},{"id":"c8_s1_q2","type":"question_chapeau","data":{"numero":"2","texte":"À partir du document 1 :"}},{"id":"c8_s1_q2_1","type":"sous_question","data":{"competence":"C1","numero":"2.1","texte":"**Identifier** les trois critères permettant de qualifier un accident du travail.","lignes":0,"style_lignes":"","support_type":"","indice":"","reponse_attendue":"Un fait accidentel soudain ; une lésion ; un lien avec le travail.","variantes":{"adapte":{"indice":"Emplacement : premier paragraphe, après les deux points."},"essentiel":{"texte":"**Identifier** les trois critères permettant de qualifier un accident du travail, en cochant trois propositions.\n☐ un fait accidentel soudain\n☐ une lésion\n☐ un lien avec le travail\n☐ une exposition prolongée à un risque\n☐ un trajet interrompu pour un motif personnel","indice":"Deux propositions concernent le trajet ou la maladie professionnelle."}}},"el":{"standard":{"indice":"Emplacement : paragraphe du DOC. 1 consacré à l'accident du travail, phrase qui annonce trois critères.","explication":"Le DOC. 1 annonce trois critères pour l'accident du travail : un fait accidentel soudain, une lésion physique ou psychique, un lien avec le travail. Ces trois critères sont recherchés pour qualifier l'accident."},"adapte":{"indice":"Emplacement : premier paragraphe, après les deux points.","explication":"Le DOC. 1 annonce trois critères pour l'accident du travail : un fait accidentel soudain, une lésion physique ou psychique, un lien avec le travail. Ces trois critères sont recherchés pour qualifier l'accident."},"essentiel":{"indice":"Deux propositions concernent le trajet ou la maladie professionnelle.","explication":"Le DOC. 1 cite trois critères : un fait accidentel soudain, une lésion, un lien avec le travail. L'exposition prolongée à un risque définit la maladie professionnelle, et le trajet interrompu concerne l'accident de trajet.","choix_corrects":[0,1,2]}}},{"id":"c8_s1_q2_2","type":"sous_question","data":{"competence":"C2","numero":"2.2","texte":"**Repérer** en cochant le type d'événement dont il s'agit pour chaque situation.","lignes":0,"style_lignes":"","support_type":"","indice":"","reponse_attendue":"Accident du travail ; accident de trajet ; maladie professionnelle.","variantes":{"essentiel":{"indice":"Affection de Marc : installation progressive, sans fait accidentel."}}},"el":{"standard":{"indice":"Critères de tri : le lieu où survient l'événement, puis la présence ou l'absence d'un fait accidentel soudain.","explication":"Inès se blesse dans l'entrepôt pendant son service : accident du travail. Sofia est renversée sur son trajet habituel entre domicile et atelier : accident de trajet. L'affection de Marc s'installe après douze ans d'exposition aux solvants, sans fait soudain : maladie professionnelle."},"adapte":{"indice":"Critères de tri : le parcours habituel entre domicile et travail, ou une installation progressive sans fait accidentel.","explication":"Sofia est renversée sur son trajet habituel entre domicile et atelier : accident de trajet. L'affection de Marc s'installe après douze ans d'exposition aux solvants, sans fait accidentel soudain : maladie professionnelle."},"essentiel":{"indice":"Affection de Marc : installation progressive, sans fait accidentel.","explication":"Marc est exposé aux solvants depuis douze ans et son affection s'installe progressivement, sans fait accidentel soudain : selon le DOC. 1, il s'agit d'une maladie professionnelle."}}},{"id":"c8_s1_tab_qualif","type":"tableau","data":{"titre":"De quel type d'événement s'agit-il ?","table_student_style":"boxes","cells":[[{"type":"prof","content":"Situation"}, ès se tord la cheville dans l'entrepôt pendant son service."},{"type":"prof","content":"✕"},{"type":"prof","content":""},{"type":"prof","content":""}],[{"type":"prof","content":"Sofia est renversée à vélo sur son trajet habituel entre son domicile et son atelier."},{"type":"prof","content":""},{"type":"prof","content":"✕"},{"type":"prof","content":""}],[{"type":"prof","content":"Marc, peintre depuis douze ans, présente une affection des mains attribuée aux solvants."},{"type":"eleve","content":"","reponse":""},{"type":"eleve","content":"","reponse":""},{"type":"eleve","content":"","reponse":"✕"}]]}}}},{"id":"c8_s1_doc2","type":"document_image","data":{"label":"DOC. 2","titre":"Les démarches après un accident du travail","source":"D'après l'Assurance Maladie.","img":"bcp_term_C8/images/schema_demarches_accident_travail.png","img_desc":"Schéma des démarches après un accident du travail. Le salarié informe son employeur dans les 24 heures ; l'employeur envoie la déclaration d'accident du travail à la caisse dans les 48 heures ; la caisse instruit le dossier et décide. Le médecin constate les lésions et établit le certificat médical initial, transmis à la caisse. L'employeur remet au salarié la feuille d'accident du travail, que celui-ci présente à chaque professionnel de santé : elle évite d'avancer les frais des soins liés à l'accident, dans la limite des tarifs de l'Assurance Maladie. En cas d'arrêt, l'employeur envoie une attestation de salaire à la caisse.","img_w":901,"img_h":471}},{"id":"c8_s1_q3","type":"question_chapeau","data":{"numero":"3","texte":"À partir du document 2 :"}},{"id":"c8_s1_q3_1","type":"sous_question","data":{"competence":"C1","numero":"3.1","texte":"**Relever** le nom du document qui évite à Inès d'avancer les frais de ses soins.","lignes":1,"style_lignes":"tiret_guide","support_type":"","indice":"","reponse_attendue":"La feuille d'accident du travail.","variantes":{"essentiel":{"texte":"**Relever** le nom du document qui évite à Inès d'avancer les frais de ses soins, en cochant une proposition.\n☐ le contrat de travail\n☐ la feuille d'accident du travail\n☐ l'attestation de salaire","lignes":0}}},"el":{"standard":{"indice":"Document remis par l'employeur au salarié et présenté aux professionnels de santé, dans le DOC. 2.","explication":"Le DOC. 2 indique que l'employeur remet au salarié la feuille d'accident du travail, présentée à chaque professionnel de santé. Elle évite d'avancer les frais des soins liés à l'accident, dans la limite des tarifs de l'Assurance Maladie."},"adapte":{"indice":"Document remis par l'employeur au salarié et présenté aux professionnels de santé, dans le DOC. 2.","explication":"Le DOC. 2 indique que l'employeur remet au salarié la feuille d'accident du travail, présentée à chaque professionnel de santé. Elle évite d'avancer les frais des soins liés à l'accident, dans la limite des tarifs de l'Assurance Maladie."},"essentiel":{"indice":"Document présenté par Inès à chaque professionnel de santé.","explication":"La feuille d'accident du travail évite d'avancer les frais des soins (DOC. 2). Le contrat de travail n'apparaît pas dans le schéma, et l'attestation de salaire est envoyée par l'employeur à la caisse en cas d'arrêt.","choix_corrects":[1]}}},{"id":"c8_s1_q3_2","type":"sous_question","data":{"competence":"C2","numero":"3.2","texte":"**Indiquer** en cochant si le délai de déclaration est respecté dans chaque situation.","lignes":0,"style_lignes":"","support_type":"","indice":"","reponse_attendue":"Délai respecté ; délai non respecté ; délai non respecté.","variantes":{"adapte":{"indice":"Délais du schéma : 24 heures pour le salarié, 48 heures pour l'employeur."},"essentiel":{"indice":"Délai du salarié : 24 heures."}}},"el":{"standard":{"indice":"Délais à relever dans le DOC. 2 : celui du salarié, puis celui de l'employeur.","explication":"Le salarié dispose de 24 heures pour informer son employeur : Inès, qui prévient le soir même, respecte ce délai ; le salarié qui attend une semaine ne le respecte pas. L'employeur dispose de 48 heures : un envoi cinq jours après l'accident dépasse ce délai."},"adapte":{"indice":"Délais du schéma : 24 heures pour le salarié, 48 heures pour l'employeur.","explication":"L'employeur dispose de 48 heures : cinq jours, soit 120 heures, dépassent ce délai. Le salarié dispose de 24 heures : une semaine d'attente dépasse aussi ce délai."},"essentiel":{"indice":"Délai du salarié : 24 heures.","explication":"Le salarié dispose de 24 heures pour informer son employeur (DOC. 2). Une semaine, soit 7 jours, dépasse largement 24 heures : le délai n'est pas respecté."}}},{"id":"c8_s1_tab_delais","type":"tableau","data":{"titre":"Les délais sont-ils respectés ?","table_student_style":"boxes","cells":[[{"type":"prof","content":"Situation"},{"type":"prof","content":"Délai respecté"},{"type":"prof","content":"Délai non respecté"}],[{"type":"prof","content":"Inès prévient son chef d'équipe le soir même de l'accident."},{"type":"eleve","content":"","reponse":"✕"},{"type":"eleve","content":"","reponse":""}],[{"type":"prof","content":"L'employeur envoie la déclaration d'accident du travail cinq jours après l'accident."},{"type":"eleve","content":"","reponse":""},{"type":"eleve","content":"","reponse":"✕"}],[{"type":"prof","content":"Un salarié attend une semaine avant de signaler sa chute à son employeur."},{"type":"eleve","content":"","reponse":""},{"type":"eleve","content":"","reponse":"✕"}]],"variantes":{"adapte":{"cells":[[{"type":"prof","content":"Situation"},{"type":"prof","content":"Délai respecté"},{"type":"prof","content":"Délai non respecté"}],[{"type":"prof","content":"Inès prévient son chef d'équipe le soir même de l'accident."},{"type":"prof","content":"✕"},{"type":"prof","content":""}],[{"type":"prof","content":"L'employeur envoie la déclaration d'accident du travail cinq jours après l'accident."},{"type":"eleve","content":"","reponse":""},{"type":"eleve","content":"","reponse":"✕"}],[{"type":"prof","content":"Un salarié attend une semaine avant de signaler sa chute à son employeur."},{"type":"eleve","content":"","reponse":""},{"type":"eleve","content":"","reponse":"✕"}]]},"essentiel":{"cells":[[{"type":"prof","content":"Situation"},{"type":"prof","content":"Délai respecté"},{"type":"prof","content":"Délai non respecté"}],[{"type":"prof","content":"Inès prévient son chef d'équipe le soir même de l'accident."},{"type":"prof","content":"✕"},{"type":"prof","content":""}],[{"type":"prof","content":"L'employeur envoie la déclaration d'accident du travail cinq jours après l'accident."},{"type":"prof","content":""},{"type":"prof","content":"✕"}],[{"type":"prof","content":"Un salarié attend une semaine avant de signaler sa chute à son employeur."},{"type":"eleve","content":"","reponse":""},{"type":"eleve","content":"","reponse":"✕"}]]}}}},{"id":"c8_s1_sep_mp","type":"separateur","data":{"style":"ligne","titre":"LA MALADIE PROFESSIONNELLE"}},{"id":"c8_s1_situ_karim","type":"texte_libre","data":{"texte":"**La situation de Karim.** Karim, magasinier chez Distripièces depuis onze ans, saisit, serre et soulève des cartons de façon répétée. Depuis plusieurs semaines, il ressent des fourmillements et des douleurs dans la main droite. Son médecin diagnostique un syndrome du canal carpien. Karim travaille encore dans l'entreprise."}},{"id":"c8_s1_doc3","type":"document_image","data":{"label":"DOC. 3","titre":"La reconnaissance d'une maladie professionnelle","source":"D'après Service-Public et l'Assurance Maladie.","img":"bcp_term_C8/images/schema_reconnaissance_maladie_professionnelle.png","img_desc":"Schéma de la reconnaissance d'une maladie professionnelle. Le salarié déclare : il envoie à sa caisse le formulaire de déclaration et le certificat médical initial, dans les 15 jours suivant le début de l'arrêt de travail. La caisse instruit le dossier et rend sa décision sous 120 jours francs. Trois conditions du tableau sont examinées : la maladie figure dans le tableau, les travaux figurent dans la liste limitative, le délai de prise en charge est respecté. Si oui, la maladie bénéficie d'une présomption d'origine professionnelle et le salarié n'a pas à prouver le lien avec son travail. Si non, le dossier est examiné par le comité régional de reconnaissance des maladies professionnelles, qui rend un avis motivé.","img_w":901,"img_h":471}},{"id":"c8_s1_doc4","type":"document","data":{"label":"DOC. 4","titre":"Tableau n° 57 du régime général — partie C : poignet, main et doigt (extrait)","corps":"Le **délai de prise en charge** est la durée maximale entre la fin de l'exposition au risque et la première constatation médicale de la maladie. La liste des travaux est **limitative** : les travaux effectués par le salarié doivent y figurer.","source":"D'après l'INRS, base de données des tableaux des maladies professionnelles."}},{"id":"c8_s1_tab57","type":"tableau","data":{"titre":"Extrait du tableau n° 57","cells":[[{"type":"prof","content":"Désignation de la maladie"},{"type":"prof","content":"Délai de prise en charge"},{"type":"prof","content":"Liste limitative des travaux susceptibles de provoquer ces maladies"}],[{"type":"prof","content":"Tendinite"},{"type":"prof","content":"7 jours"},{"type":"prof","content":"Travaux comportant de façon habituelle des mouvements répétés ou prolongés des tendons fléchisseurs ou extenseurs de la main et des doigts."}],[{"type":"prof","content":"Syndrome du canal carpien"},{"type":"prof","content":"30 jours"},{"type":"prof","content":"Travaux comportant de façon habituelle, soit des mouvements répétés ou prolongés d'extension du poignet ou de préhension de la main, soit un appui carpien, soit une pression prolongée ou répétée sur le talon de la main."}]]}},{"id":"c8_s1_q4","type":"question_chapeau","data":{"numero":"4","texte":"À partir de la situation de Karim, du document 3 et du document 4 :"}},{"id":"c8_s1_q4_1","type":"sous_question","data":{"competence":"C2","numero":"4.1","texte":"**Compléter** le tableau de comparaison entre la situation de Karim et les conditions du tableau n° 57.","lignes":0,"style_lignes":"","support_type":"","indice":"","reponse_attendue":"La maladie figure dans le tableau : le médecin diagnostique un syndrome du canal carpien ; condition respectée : oui. — Les travaux figurent dans la liste limitative : Karim saisit, serre et soulève des cartons de façon répétée ; condition respectée : oui. — Le délai de prise en charge est respecté : le délai est de 30 jours et Karim est encore exposé au risque ; condition respectée : oui.","variantes":{"adapte":{"indice":"Comparaison à faire : les gestes de Karim et la troisième colonne du tableau n° 57."},"essentiel":{"indice":"Conclusion à porter dans la dernière colonne : oui ou non."}}},"el":{"standard":{"indice":"Pour chaque condition : un élément de la situation de Karim, comparé à la ligne « Syndrome du canal carpien » du tableau n° 57.","explication":"La maladie de Karim, un syndrome du canal carpien, figure dans le tableau n° 57. Ses gestes répétés de préhension (saisir, serrer, soulever des cartons) correspondent à la liste limitative des travaux. Karim est encore exposé au risque : les 30 jours comptés depuis la fin de l'exposition ne sont pas dépassés, donc les trois conditions sont respectées."},"adapte":{"indice":"Comparaison à faire : les gestes de Karim et la troisième colonne du tableau n° 57.","explication":"La maladie de Karim, un syndrome du canal carpien, figure dans le tableau n° 57. Ses gestes répétés de préhension (saisir, serrer, soulever des cartons) correspondent à la liste limitative des travaux. Karim est encore exposé au risque : les 30 jours comptés depuis la fin de l'exposition ne sont pas dépassés, donc les trois conditions sont respectées."},"essentiel":{"indice":"Repère : chaque élément relevé est à comparer à la ligne « Syndrome du canal carpien » du tableau n° 57.","explication":"Le syndrome du canal carpien figure au tableau n° 57, les gestes répétés de Karim font partie de la auche.","explication":"Selon le DOC. 3, le salarié déclare lui-même sa maladie professionnelle : il envoie le formulaire de déclaration et le certificat médical initial à sa caisse dans les 15 jours suivant le début de l'arrêt de travail. Pour un accident du travail, la déclaration vient au contraire de l'employeur, dans les 48 heures."},"essentiel":{"indice":"Emplacement : premier encadré du schéma du DOC. 3.","explication":"Le DOC. 3 indique que le salarié déclare lui-même sa maladie, dans les 15 jours suivant le début de l'arrêt de travail. Les 48 heures concernent l'employeur pour un accident du travail, et les 120 jours la décision de la caisse.","choix_corrects":[1,4]}}},{"id":"c8_s1_notions","type":"notions","data":{"items":[{"notion":"Accident du travail","definition":"Accident survenu par le fait ou à l'occasion du travail et ayant provoqué une lésion."},{"notion":"Accident de trajet","definition":"Accident survenu sur le parcours habituel entre la résidence, le lieu de travail ou le lieu habituel des repas."},{"notion":"Maladie professionnelle","definition":"Maladie qui résulte de l'exposition à un risque dans le cadre du travail."},{"notion":"Déclaration d'accident du travail","definition":"Déclaration envoyée par l'employeur à la caisse d'assurance maladie dans les 48 heures."},{"notion":"Certificat médical initial","definition":"Document établi par le médecin, qui décrit les lésions ou la maladie constatées."},{"notion":"Feuille d'accident du travail","definition":"Document qui évite au salarié d'avancer les frais de soins, dans la limite des tarifs de l'Assurance Maladie."},{"notion":"Attestation de salaire","definition":"Document envoyé par l'employeur, qui sert au calcul des indemnités journalières."},{"notion":"Tableau de maladie professionnelle","definition":"Tableau réglementaire précisant la maladie, le délai de prise en charge et la liste limitative des travaux."},{"notion":"Délai de prise en charge","definition":"Durée maximale entre la fin de sque les trois conditions du tableau sont remplies, la maladie bénéficie de la présomption d'origine professionnelle : le salarié n'a pas à prouver le lien avec son travail (DOC. 3).","renvoi":"DOC. 3 — La reconnaissance d'une maladie professionnelle","renvoi_bloc":"c8_s1_doc3","accepte":[]},{"explication":"Selon le DOC. 2, l'employeur envoie la déclaration d'accident du travail à la caisse dans les 48 heures. Les 24 heures concernent le salarié, qui informe son employeur.","renvoi":"DOC. 2 — Les démarches après un accident du travail","renvoi_bloc":"c8_s1_doc2","accepte":[]},{"explication":"Pour une maladie professionnelle, c'est le salarié qui déclare, dans les 15 jours suivant le début de l'arrêt de travail (DOC. 3). Pour un accident du travail, c'est l'employeur.","renvoi":"DOC. 3 — La reconnaissance d'une maladie professionnelle","renvoi_bloc":"c8_s1_doc3","accepte":[]}],"essentiel":[{"explication":"Le DOC. 2 indique que le salarié informe son employeur de l'accident dans les 24 heures.","renvoi":"DOC. 2 — Les démarches après un accident du travail","renvoi_bloc":"c8_s1_doc2","accepte":[]},{"explication":"Selon le DOC. 2, l'employeur envoie la déclaration d'accident du travail à la caisse dans les 48 heures. Le salarié informe l'employeur et le médecin établit le certificat médical initial.","renvoi":"DOC. 2 — Les démarches après un accident du travail","renvoi_bloc":"c8_s1_doc2","accepte":[]},{"explication":"Lorsque les trois conditions du tableau sont remplies, la maladie bénéficie de la présomption d'origine professionnelle : le salarié n'a pas à prouver le lien avec son travail (DOC. 3).","renvoi":"DOC. 3 — La reconnaissance d'une maladie professionnelle","renvoi_bloc":"c8_s1_doc3","accepte":[]},{"explication":"Selon le DOC. 2, l'employeur envoie la déclaration d'accident du travail à la caisse dans les 48 heures. Les 24 heures concernent le salarié, qui informe son employeur.","renvoi":"DOC. 2 — Les démarches après un accident du travail","renvoi_bloc":"c8_s1_doc2","accepte":[]},{"explication":"Pour une maladie professionnelle, c'est le salarié qui déclare, dans les 15 jours suivant le début de l'arrêt de travail (DOC. 3). Pour un accident du travail, c'est l'employeur.","renvoi":"DOC. 3 — La reconnaissance d'une maladie professionnelle","renvoi_bloc":"c8_s1_doc3","accepte":[]}]}},{"id":"c8_saut1","type":"saut_page","data":{}},{"id":"c8_s2_seance","type":"seance","data":{"numero":"2","titre":"Responsabilités, réparation et prévention","objectif":"Être capable de repérer les modalités d'indemnisation.","competences":["C1","C2","C3","C4","C5"]}},{"id":"c8_s2_doc5","type":"document","data":{"label":"DOC. 5","titre":"Les prestations après un accident du travail ou une maladie professionnelle","corps":"**Les prestations en nature** correspondent à la prise en charge des soins liés à l'accident ou à la maladie : consultations, médicaments, examens, hospitalisation, rééducation. Ces soins sont pris en charge dans la limite des tarifs de l'Assurance Maladie.\n\n**Les prestations en espèces** compensent une perte de revenu.\nL'indemnité journalière est versée pendant l'arrêt de travail. Pour un salarié mensualisé, le salaire journalier de base s'obtient en divisant le salaire brut du mois précédent par 30,42. L'indemnité journalière est égale à 60 % de ce salaire journalier de base pendant les 28 premiers jours d'arrêt, puis à 80 % à partir du 29e jour.\nLorsque des séquelles subsistent après consolidation, un taux d'incapacité permanente est fixé : en dessous de 10 %, une indemnité en capital est versée ; à partir de 10 %, c'est une rente d'incapacité permanente.\nEn cas de décès lié à l'accident ou à la maladie, une rente est versée aux ayants droit.","source":"D'après l'Assurance Maladie."}},{"id":"c8_s2_q1","type":"question_chapeau","data":{"numero":"1","texte":"À partir de la situation d'Inès et du document 5 :"}},{"id":"c8_s2_q1_1","type":"sous_question","data":{"competence":"C2","numero":"1.1","texte":"**Identifier**, dans la situation d'Inès, deux prestations en nature.","lignes":0,"style_lignes":"","support_type":"","indice":"","reponse_attendue":"Les deux radiographies de la cheville ; les dix séances de kinésithérapie.","variantes":{"adapte":{"indice":"Paragraphe à explorer : celui qui commence par « Aux urgences »."},"essentiel":{"texte":"**Identifier** deux prestations en nature, en cochant deux propositions.\n☐ les deux radiographies de la cheville\n☐ les dix séances de kinésithérapie\n☐ le salaire brut de 1 850 €\n☐ l'indemnité journalière","indice":"Distinction utile : des soins, et non de l'argent versé."}}},"el":{"standard":{"indice":"Prestations en nature : des soins, et non des sommes d'argent (DOC. 5).","explication":"Le DOC. 5 définit les prestations en nature comme la prise en charge des soins : consultations, médicaments, examens, hospitalisation, rééducation. Les deux radiographies de la cheville sont des examens et les dix séances de kinésithérapie de la rééducation ; le salaire de 1 850 € n'est pas un soin."},"adapte":{"indice":"Paragraphe à explorer : celui qui commence par « Aux urgences ».","explication":"Le DOC. 5 définit les prestations en nature comme la prise en charge des soins : consultations, médicaments, examens, hospitalisation, rééducation. Les deux radiographies de la cheville sont des examens et les dix séances de kinésithérapie de la rééducation ; le salaire de 1 850 € n'est pas un soin."},"essentiel":{"indice":"Distinction utile : des soins, et non de l'argent versé.","explication":"Les radiographies (examens) et la kinésithérapie (rééducation) sont des soins : ce sont des prestations en nature. Le salaire et l'indemnité journalière sont des sommes d'argent ; l'indemnité journalière est une prestation en espèces.","choix_corrects":[0,1]}}},{"id":"c8_s2_q1_2","type":"sous_question","data":{"competence":"C2","numero":"1.2","texte":"**Calculer** le montant de l'indemnité journalière perçue par Inès, en euros.","lignes":0,"style_lignes":"","support_type":"calcul","indice":"Méthode : salaire brut du mois précédent divisé par 30,42, puis application du taux.","reponse_attendue":"60,82 × 60 ÷ 100 = 36,49 € par jour.","variantes":{"adapte":{"indice":"Étape 1 : 1 850 ÷ 30,42 = 60,82 €. Étape 2 : application du taux des 28 premiers jours."},"essentiel":{"texte":"**Calculer** le montant de l'indemnité journalière perçue par Inès, en euros.\n(Calcul à effectuer : 60,82 × 60 ÷ 100 = …………………………………………………… €.)","indice":"Taux applicable : 60 %. Salaire journalier de base : 60,82 €."}}},"el":{"standard":{"indice":"Méthode : salaire brut du mois précédent divisé par 30,42, puis application du taux.","explication":"Salaire journalier de base : 1 850 ÷ 30,42 = 60,82 €. L'arrêt d'Inès dure 21 jours, donc pas plus de 28 jours : le taux de 60 % s'applique. Indemnité journalière : 60,82 × 60 ÷ 100 = 36,49 € par jour."},"adapte":{"indice":"Étape 1 : 1 850 ÷ 30,42 = 60,82 €. Étape 2 : application du taux des 28 premiers jours.","explication":"Salaire journalier de base : 1 850 ÷ 30,42 = 60,82 €. L'arrêt d'Inès dure 21 jours, donc pas plus de 28 jours : le taux de 60 % s'applique. Indemnité journalière : 60,82 × 60 ÷ 100 = 36,49 € par jour."},"essentiel":{"indice":"Taux applicable : 60 %. Salaire journalier de base : 60,82 €.","explication":"L'arrêt de 21 jours ne dépasse pas 28 jours, donc le taux est de 60 %. Calcul : 60,82 × 60 = 3 649,2, puis 3 649,2 ÷ 100 = 36,492, soit 36,49 € par jour.","trous":["36,49|36.49|36,49 €|36,5|36.5"]}}},{"id":"c8_s2_q1_3","type":"sous_question","data":{"competence":"C3","numero":"1.3","texte":"**Indiquer** la prestation dont Inès pourrait bénéficier si son entorse laissait une séquelle permanente.","lignes":3,"style_lignes":"tiret_guide","support_type":"","indice":"Piste : le dernier cas prévu par le document, après la consolidation.","reponse_attendue":"Une indemnisation de l'incapacité permanente : un capital en dessous de 10 %, une rente à partir de 10 %.","variantes":{"adapte":{"texte":"**Indiquer** la prestation dont Inès pourrait bénéficier en cas de séquelle permanente, en complétant la phrase.\n(Une indemnisation de l'…………………………………………………… : un …………………………………………………… en dessous de 10 %, une …………………………………………………… à partir de 10 %.)","lignes":0},"essentiel":{"texte":"**Indiquer** la prestation dont Inès pourrait bénéficier en cas de séquelle permanente, en cochant une proposition.\n☐ une indemnité journalière plus élevée\n☐ une indemnisation de l'incapacité permanente\n☐ une rente versée aux ayants droit","lignes":0}}},"el":{"standard":{"indice":"Emplacement : paragraphe du DOC. 5 sur les séquelles qui subsistent après consolidation.","explication":"Selon le DOC. 5, des séquelles qui subsistent après consolidation donnent lieu à un taux d'incapacité permanente. En dessous de 10 %, une indemnité en capital est versée ; à partir de 10 %, c'est une rente d'incapacité permanente."},"adapte":{"indice":"Emplacement : paragraphe du DOC. 5 sur les séquelles qui subsistent après consolidation.","explication":"Selon le DOC. 5, des séquelles qui subsistent après consolidation donnent lieu à un taux d'incapacité permanente. En dessous de 10 %, une indemnité en capital est versée ; à partir de 10 %, c'est une rente d'incapacité permanente.","trous":["incapacité permanente|incapacite permanente","capital|indemnité en capital|indemnite en capital","rente|rente d'incapacité permanente|rente d'incapacite permanente"]},"essentiel":{"indice":"Distinction utile : une séquelle qui subsiste après consolidation, et non un arrêt de travail en cours ni un décès.","explication":"Une séquelle permanente ouvre droit à une indemnisation de l'incapacité permanente (DOC. 5). L'indemnité journalière est versée pendant l'arrêt de travail, et la rente aux ayants droit concerne le décès du salarié.","choix_corrects":[1]}}},{"id":"c8_s2_doc6","type":"document","data":{"label":"DOC. 6","titre":"Les obligations et les responsabilités de l'employeur","corps":"L'employeur doit prendre les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs. Pour agir sur un risque, il cherche d'abord à **supprimer le danger**, puis à réduire l'exposition des salariés. Les protections collectives, qui protègent tout le monde, passent avant les protections individuelles. Les mesures techniques, l'organisation du travail, l'information et la formation se combinent selon les situations.\n\n**La responsabilité civile** répare : elle oblige l'auteur d'un dommage à indemniser la victime.\n\n**La responsabilité pénale** sanctionne : elle punit une infraction prévue par la loi. L'article 223-1 du code pénal punit d'un an d'emprisonnement et de 15 000 € d'amende le fait d'exposer directement autrui à un risque immédiat de mort ou de blessures graves, lorsque cette exposition résulte de la violation manifestement délibérée d'une obligation particulière de sécurité imposée par la loi ou le règlement.\n\n**La faute inexcusable** peut être reconnue lorsque l'employeur avait ou aurait dû avoir conscience du danger auquel le salarié était exposé et qu'il n'a pas pris les mesures nécessaires pour l'en préserver. La victime bénéficie alors d'une indemnisation complémentaire. En cas de contentieux, la juridiction compétente est le pôle social du tribunal judiciaire.","source":"D'après le code du travail, le code pénal et le code de la sécurité sociale."}},{"id":"c8_s2_q2","type":"question_chapeau","data":{"numero":"2","texte":"À partir du document 6 :"}},{"id":"c8_s2_q2_1","type":"sous_question","data":{"competence":"C1","numero":"2.1","texte":"**Indiquer** ce que vise chacune des deux responsabilités de l'employeur.","lignes":0,"style_lignes":"","support_type":"","indice":"","reponse_attendue":"La responsabilité civile répare le dommage ; la responsabilité pénale sanctionne une infraction.","variantes":{"essentiel":{"texte":"**Indiquer** ce que vise chacune des deux responsabilités, en écrivant un seul mot par ligne.\n(Mots à utiliser : réparer — sanctionner.)"}}},"el":{"standard":{"indice":"Deux verbes du DOC. 6, placés juste après le nom de chaque responsabilité.","explication":"Le DOC. 6 indique que la responsabilité civile répare : elle oblige l'auteur d'un dommage à indemniser la victime. La responsabilité pénale sanctionne : elle punit une infraction prévue par la loi."},"adapte":{"indice":"Deux verbes du DOC. 6, placés juste après le nom de chaque responsabilité.","explication":"Le DOC. 6 indique que la responsabilité civile répare : elle oblige l'auteur d'un dommage à indemniser la victime. La responsabilité pénale sanctionne : elle punit une infraction prévue par la loi."},"essentiel":{"indice":"Emplacement : les paragraphes du DOC. 6 qui commencent par « La responsabilité civile » et « La responsabilité pénale ».","explication":"Responsabilité civile : réparer, car l'auteur d'un dommage indemnise la victime. Responsabilité pénale : sanctionner, car elle punit une infraction prévue par la loi (DOC. 6)."}}},{"id":"c8_s2_tab_resp","type":"tableau","data":{"titre":"Les deux responsabilités de l'employeur","table_student_style":"lines","cells":[[{"type":"prof","content":"Responsabilité"},{"type":"prof","content":"Ce qu'elle vise"}],[{"type":"prof","content":"La responsabilité civile"},{"type":"eleve","content":"","reponse":"Réparer le dommage subi par la victime."}],[{"type":"prof","content":"La responsabilité pénale"},{"type":"eleve","content":"","reponse":"Sanctionner une infraction prévue par la loi."}]],"variantes":{"essentiel":{"cells":[[{"type":"prof","content":"Responsabilité"},{"type":"prof","content":"Ce qu'elle vise"}],[{"type":"prof","content":"La responsabilité civile"},{"type":"eleve","content":"","reponse":"réparer"}],[{"type":"prof","content":"La responsabilité pénale"},{"type":"eleve","content":"","reponse":"sanctionner"}]]}}}},{"id":"c8_s2_q2_2","type":"sous_question","data":{"competence":"C3","numero":"2.2","texte":"**Expliquer** pourquoi un employeur peut être sanctionné même si aucun accident ne s'est produit.","lignes":3,"style_lignes":"tiret_guide","support_type":"","indice":"Point à trancher : l'article punit-il le dommage, ou l'exposition au risque ?","reponse_attendue":"L'article 223-1 punit le fait d'exposer un salarié à un risque immédiat : c'est le manquement à la sécurité qui est sanctionné.","variantes":{"adapte":{"texte":"**Expliquer** pourquoi un employeur peut être sanctionné même sans accident, en complétant la phrase.\n(L'article 223-1 punit le fait d'exposer un salarié à un …………………………………………………… immédiat : c'est le manquement à la …………………………………………………… qui est sanctionné.)","lignes":0},"essentiel":{"texte":"**Expliquer** pourquoi un employeur peut être sanctionné même sans accident, en complétant la phrase avec les mots proposés.\n(Mots à utiliser : risque — sécurité.)\n(L'article 223-1 punit le fait d'exposer un salarié à un …………………………………………………… immédiat : c'est le manquement à la …………………………………………………… qui est sanctionné.)","lignes":0}}},"el":{"standard":{"indice":"Point à trancher : l'article punit-il le dommage, ou l'exposition au risque ?","explication":"L'article 223-1 du code pénal punit le fait d'exposer autrui à un risque immédiat de mort ou de blessures graves. La sanction porte donc sur le manquement à une obligation de sécurité, même si aucun dommage ne s'est produit."},"adapte":{"indice":"Emplacement : l'article 223-1, dans le paragraphe du DOC. 6 sur la responsabilité pénale.","explication":"L'article 223-1 du code pénal punit le fait d'exposer autrui à un risque immédiat de mort ou de blessures graves. La sanction porte donc sur le manquement à une obligation de sécurité, même si aucun dommage ne s'est produit.","trous":["risque","sécurité|securite"]},"essentiel":{"indice":"Emplacement : l'article 223-1, dans le paragraphe du DOC. 6 sur la responsabilité pénale.","explication":"L'article 223-1 punit l'exposition d'un salarié à un risque immédiat, sans attendre un accident. C'est le manquement à la sécurité qui est sanctionné (DOC. 6).","trous":["risque","sécurité|securite"]}}},{"id":"c8_s2_doc7","type":"document","data":{"label":"DOC. 7","titre":"Deux pièces du dossier de Distripièces","corps":"**Extrait d'un compte rendu du comité social et économique, séance du 14 janvier.**\nUn représentant du personnel signale à l'employeur que le frein du marchepied roulant de la zone B ne bloque plus les roues. Il demande son remplacement.\n\n**Note du responsable de l'entrepôt, 10 mars.**\nLe marchepied de la zone B est resté en service sans avoir été réparé ni remplacé. Le risque de chute lié aux marchepieds ne figure pas au document unique d'évaluation des risques professionnels.","source":""}},{"id":"c8_s2_q3","type":"question_chapeau","data":{"numero":"3","texte":"À partir de la définition du document 6 et des pièces du document 7 :"}},{"id":"c8_s2_q3_1","type":"sous_question","data":{"competence":"C2","numero":"3.1","texte":"**Identifier** les deux faits du document 7 pouvant caractériser une faute inexcusable.","lignes":0,"style_lignes":"","support_type":"","indice":"Deux conditions dans le document 6 : la conscience du danger, puis les mesures nécessaires.","reponse_attendue":"« signale à l'employeur que le frein […] ne bloque plus les roues » ; « resté en service sans avoir été réparé ni remplacé ».","variantes":{"adapte":{"indice":"Emplacements : le compte rendu du 14 janvier, puis la note du 10 mars."},"essentiel":{"texte":"**Identifier** les deux faits pouvant caractériser une faute inexcusable, en cochant deux propositions.\n☐ Le défaut du frein a été signalé à l'employeur le 14 janvier.\n☐ Le marchepied est resté en service sans être réparé ni remplacé.\n☐ Inès n'avait que quatre mois d'ancienneté.\n☐ L'accident a eu lieu en fin de journée.","indice":"Tri utile : deux propositions portent sur le marchepied, deux sur Inès ou l'horaire."}}},"el":{"standard":{"indice":"Deux conditions dans le document 6 : la conscience du danger, puis les mesures nécessaires.","explication":"La faute inexcusable suppose deux éléments (DOC. 6) : la conscience du danger et l'absence des mesures nécessaires. Le signalement du frein défectueux au comité social et économique, le 14 janvier, montre que l'employeur connaissait le danger ; la note du 10 mars montre que le marchepied est resté en service sans réparation ni remplacement. La reconnaissance de la faute inexcusable relève ensuite du juge."},"adapte":{"indice":"Emplacements : le compte rendu du 14 janvier, puis la note du 10 mars.","explication":"La faute inexcusable suppose deux éléments (DOC. 6) : la conscience du danger et l'absence des mesures nécessaires. Le signalement du frein défectueux au comité social et économique, le 14 janvier, montre que l'employeur connaissait le danger ; la note du 10 mars montre que le marchepied est resté en service sans réparation ni remplacement. La reconnaissance de la faute inexcusable relève ensuite du juge."},"essentiel":{"indice":"Tri utile : deux propositions portent sur le marchepied, deux sur Inès ou l'horaire.","explication":"Le signalement du 14 janvier prouve que l'employeur avait conscience du danger, et le marchepied resté en service prouve l'absence de mesure : ce sont les deux conditions de la faute inexcusable (DOC. 6). L'ancienneté d'Inès et l'heure de l'accident n'ont pas de lien avec ces conditions.","choix_corrects":[0,1]}}},{"id":"c8_s2_sep_solutions","type":"separateur","data":{"style":"ligne","titre":"PROPOSER DES SOLUTIONS"}},{"id":"c8_s2_q4","type":"question_chapeau","data":{"numero":"4","texte":"À partir de la situation d'Inès et du document 6 :"}},{"id":"c8_s2_q4_1","type":"sous_question","data":{"competence":"C4","numero":"4.1","texte":"**Proposer** deux mesures de prévention : une agissant sur le matériel, une sur l'organisation du travail.","lignes":0,"style_lignes":"","support_type":"","indice":"Principes utiles : suppression du danger, puis réduction de l'exposition, dans le document 6.","reponse_attendue":"Matériel : remplacer le marchepied défectueux. Organisation : inscrire le risque au document unique.","variantes":{"adapte":{"texte":"**Proposer** deux mesures de prévention, une sur le matériel et une sur l'organisation, en choisissant dans la liste.\n(Liste : remplacer le marchepied défectueux — demander aux salariés de faire attention — inscrire le risque de chute au document unique — changer les horaires de l'entrepôt.)"},"essentiel":{"texte":"**Proposer** deux mesures de prévention, une sur le matériel et une sur l'organisation, en cochant deux propositions.\n☐ remplacer le marchepied défectueux\n☐ demander aux salariés de faire attention\n☐ inscrire le risque de chute au document unique\n☐ changer les horaires de l'entrepôt","lignes":0}}},"el":{"standard":{"indice":"Principes utiles : suppression du danger, puis réduction de l'exposition, dans le document 6.","explication":"Mesure sur le matériel : remplacer le marchepied défectueux, ce qui supprime le danger à l'origine de la chute d'Inès. Mesure sur l'organisation : inscrire le risque de chute au document unique, où il ne figurait pas (DOC. 7) ; un contrôle périodique du matériel, une procédure de signalement des défauts ou une formation à l'usage des marchepieds conviennent aussi. Demander aux salariés d'être vigilants ne supprime pas le danger."},"adapte":{"indice":"Tri de la liste : deux mesures laissent le frein défectueux en service sans rien changer à la gestion du risque.","explication":"Remplacer le marchepied défectueux agit sur le matériel et supprime le danger. Inscrire le risque de chute au document unique agit sur l'organisation, puisque ce risque n'y figurait pas (DOC. 7). Faire attention ou changer les horaires ne supprime pas le défaut du frein."},"essentiel":{"indice":"Repère : deux propositions laissent le frein défectueux en service sans rien changer à la gestion du risque.","explication":"Remplacer le marchepied défectueux agit sur le matériel ; inscrire le risque de chute au document unique agit sur l'organisation, car ce risque n'y figurait pas (DOC. 7). Faire attention ou changer les horaires laisse le frein défectueux en place.","choix_corrects":[0,2]}}},{"id":"c8_s2_tab_mesures","type":"tableau","data":{"titre":"Les deux mesures proposées","table_student_style":"lines","cells":[[{"type":"prof","content":"Catégorie"},{"type":"prof","content":"Mesure proposée"}],[{"type":"prof","content":"Mesure agissant sur le matériel"},{"type":"eleve","content":"","reponse":"Remplacer le marchepied défectueux."}],[{"type":"prof","content":"Mesure agissant sur l'organisation du travail"},{"type":"eleve","content":"","reponse":"Inscrire le risque de chute au document unique."}]]}},{"id":"c8_s2_q4_2","type":"sous_question","data":{"competence":"C5","numero":"4.2","texte":"**Justifier** la mesure à mettre en œuvre en priorité.","lignes":4,"style_lignes":"tiret_guide","support_type":"","indice":"Comparaison à faire : l'effet de chaque mesure sur le danger lui-même.","reponse_attendue":"Remplacer le marchepied est prioritaire, car cette mesure supprime le danger au lieu de compter sur la vigilance des salariés.","variantes":{"adapte":{"texte":"**Justifier** la mesure à mettre en œuvre en priorité, en complétant la phrase.\n(Mots à utiliser : danger — vigilance.)\n(La mesure à mettre en œuvre en priorité est ………………………………………………………………………………………………………… , car elle ………………………………………………………………………………………………………… .)","lignes":0},"essentiel":{"texte":"**Justifier** la mesure à mettre en œuvre en priorité, en cochant la mesure puis la raison.\nMesure prioritaire : ☐ remplacer le marchepied défectueux  ☐ demander aux salariés de faire attention\nRaison : ☐ elle supprime le danger  ☐ elle coûte moins cher  ☐ elle est plus rapide à décider","lignes":0,"indice":"Repère : une seule mesure agit sur le marchepied lui-même."}}},"el":{"standard":{"indice":"Comparaison à faire : l'effet de chaque mesure sur le danger lui-même.","explication":"Le DOC. 6 place en premier la suppression du danger. Remplacer le marchepied supprime le défaut du frein, alors qu'une consigne de vigilance laisse le danger en place : cette mesure est donc prioritaire."},"adapte":{"indice":"Principe du DOC. 6 : l'action à mener en premier face à un risque.","explication":"Le DOC. 6 place en premier la suppression du danger. Remplacer le marchepied supprime le défaut du frein, alors qu'une consigne de vigilance laisse le danger en place : cette mesure est donc prioritaire.","trous":["remplacer le marchepied défectueux|remplacer le marchepied defectueux|remplacer le marchepied|le remplacement du marchepied|le remplacement du marchepied défectueux","supprime le danger au lieu de compter sur la vigilance des salariés|supprime le danger au lieu de compter sur la vigilance des salaries|supprime le danger"]},"essentiel":{"indice":"Repère : une seule mesure agit sur le marchepied lui-même.","explication":"Remplacer le marchepied défectueux supprime le danger, première action recherchée selon le DOC. 6. Demander aux salariés de faire attention laisse le frein défectueux en service ; le coût et la rapidité ne sont pas des critères du document.","choix_corrects":[0,2]}}},{"id":"c8_s2_notions","type":"notions","data":{"items":[{"notion":"Prestation en nature","definition":"Prise en charge des soins liés à l'accident ou à la maladie professionnelle."},{"notion":"Prestation en espèces","definition":"Somme versée pour compenser une perte de revenu ou indemniser une incapacité."},{"notion":"Indemnité journalière","definition":"Somme versée pendant l'arrêt : 60 % du salaire journalier de base jusqu'au 28e jour, puis 80 %."},{"notion":"Salaire journalier de base","definition":"Pour un salarié mensualisé, salaire brut du mois précédent divisé par 30,42."},{"notion":"Incapacité permanente","definition":"Séquelles évaluées après consolidation : indemnité en capital en dessous de 10 %, rente à partir de 10 %."},{"notion":"Rente aux ayants droit","definition":"Rente versée aux proches lorsque l'accident ou la maladie a entraîné le décès du salarié."},{"notion":"Responsabilité civile","definition":"Responsabilité qui vise à réparer un dommage."},{"notion":"Responsabilité pénale","definition":"Responsabilité qui vise à sanctionner une infraction prévue par la loi."},{"notion":"Faute inexcusable","definition":"Faute reconnue lorsque l'employeur avait ou aurait dû avoir conscience du danger et n'a pas pris les mesures nécessaires."},{"notion":"Suppression du danger","definition":"Première action recherchée face à un risque, avant la réduction de l'exposition et les protections."},{"notion":"Document unique","definition":"Document dans lequel l'employeur consigne les résultats de l'évaluation des risques professionnels."}]}},{"id":"c8_s2_autoeval","type":"auto_eval","data":{"questions":[{"type":"vf","consigne":"Les séances de kinésithérapie liées à un accident du travail sont des prestations en espèces.","options":["Vrai","Faux"],"correct":"Faux"},{"type":"qcm","consigne":"Quel taux du salaire journalier de base s'applique pendant les 28 premiers jours d'arrêt ?","options":["40 %","60 %","80 %"],"correct":"60 %"},{"type":"qcm","consigne":"Quelle est la fonction de la responsabilité pénale ?","options":["Réparer un dommage","Sanctionner une infraction","Calculer une indemnité journalière"],"correct":"Sanctionner une infraction"},{"type":"redige","consigne":"Indiquer ce que vise la responsabilité civile.","correct":"Réparer"},{"type":"redige","consigne":"Indiquer ce qu'il faut chercher à faire en premier face à un danger.","correct":"Le supprimer"}],"remed_rouge":"Moins de 3 réponses justes sur 5 : reprendre le document 5, puis la première partie du document 6.","remed_orange":"3 à 4 réponses justes sur 5 : revoir la différence entre prestation en nature et prestation en espèces, puis les deux responsabilités.","remed_vert":"5 réponses justes sur 5 : les modalités de réparation sont acquises. Vérifier les mots du lexique.","variantes":{"adapte":{"questions":[{"type":"vf","consigne":"Les sé e trajet, maladie professionnelle","renvoi_bloc":"c8_s1_doc1"},{"type":"qcm_m","consigne":"Après l'accident d'Inès, quels documents parviennent à la caisse d'assurance maladie ?","options":["La déclaration d'accident du travail","La feuille d'accident du travail","Le certificat médical initial","L'attestation de salaire"],"correct":"La déclaration d'accident du travail | Le certificat médical initial | L'attestation de salaire","accepte":[],"explication":"Selon le DOC. 2, l'employeur envoie la déclaration et, en cas d'arrêt, l'attestation de salaire ; le médecin transmet le certificat médical initial. La feuille d'accident du travail est remise au salarié, qui la présente aux professionnels de santé.","notion":"Déclaration d'accident du travail","seance":"1","renvoi":"DOC. 2 — Les démarches après un accident du travail","renvoi_bloc":"c8_s1_doc2"},{"type":"vf","consigne":"Dans un tableau de maladie professionnelle, les travaux effectués par le salarié doivent figurer dans la liste limitative.","options":["Vrai","Faux"],"correct":"Vrai","accepte":[],"explication":"Le DOC. 4 précise que la liste des travaux est limitative : des travaux absents de la liste ne remplissent pas cette condition du tableau.","notion":"Tableau de maladie professionnelle","seance":"1","renvoi":"DOC. 4 — Tableau n° 57 du régime général — partie C : poignet, main et doigt (extrait)","renvoi_bloc":"c8_s1_doc4"},{"type":"qcm","consigne":"Pour le syndrome du canal carpien, le tableau n° 57 fixe un délai de prise en charge de 30 jours. Que représente ce délai ?","options":["Le délai dont dispose le salarié pour déclarer sa maladie","La durée maximale entre la fin de l'exposition au risque et la première constatation médicale","Le délai dont dispose la caisse pour rendre sa décision"],"correct":"La durée maximale entre la fin de l'exposition au risque et la première constatation médicale","accepte":[],"explication":"Le DOC. 4 définit le délai de prise en charge comme la durée maximale entre la fin de l'exposition et la première constatation médicale. La déclaration du salarié se fait dans les 15 jours et la décision de la caisse sous 120 jours francs (DOC. 3).","notion":"Délai de prise en charge","seance":"1","renvoi":"DOC. 4 — Tableau n° 57 du régime général — partie C : poignet, main et doigt (extrait)","renvoi_bloc":"c8_s1_doc4"},{"type":"qcm","consigne":"Un salarié atteint d'une tendinite réalise des travaux qui ne figurent pas dans la liste limitative du tableau n° 57. Que devient son dossier ?","options":["Il bénéficie de la présomption d'origine professionnelle.","Il est refusé sans examen.","Il est examiné par le comité régional de reconnaissance des maladies professionnelles."],"correct":"Il est examiné par le comité régional de reconnaissance des maladies professionnelles.","accepte":[],"explication":"Une condition du tableau n'est pas remplie : la présomption d'origine professionnelle ne s'applique pas, et le dossier est examiné par le CRRMP, qui rend un avis motivé (DOC. 3).","notion":"CRRMP","seance":"1","renvoi":"DOC. 3 — La reconnaissance d'une maladie professionnelle","renvoi_bloc":"c8_s1_doc3"},{"type":"qcm_m","consigne":"Quelles prestations sont des prestations en nature ?","options":["Une consultation médicale","L'indemnité journalière","Une hospitalisation","Une rente d'incapacité permanente"],"correct":"Une consultation médicale | Une hospitalisation","accepte":[],"explication":"Les prestations en nature prennent en charge les soins : consultations, examens, hospitalisation, rééducation. L'indemnité journalière et la rente sont des prestations en espèces, versées en argent (DOC. 5).","notion":"Prestation en nature","seance":"2","renvoi":"DOC. 5 — Les prestations après un accident du travail ou une maladie professionnelle","renvoi_bloc":"c8_s2_doc5"},{"type":"redige","consigne":"Un salarié mensualisé a perçu 2 433,60 € brut le mois précédant son arrêt de travail de 12 jours. Calculer son indemnité journalière, en euros.","options":[],"correct":"48 €","accepte":["48","48 €","48,00","48.00","48 euros"],"explication":"Salaire journalier de base : 2 433,60 ÷ 30,42 = 80 €. L'arrêt ne dépasse pas 28 jours, donc le taux est de 60 % : 80 × 60 ÷ 100 = 48 € par jour.","notion":"Indemnité journalière","seance":"2","renvoi":"DOC. 5 — Les prestations après un accident du travail ou une maladie professionnelle","renvoi_bloc":"c8_s2_doc5"},{"type":"qcm","consigne":"Après consolidation, un taux d'incapacité permanente de 6 % est fixé pour un salarié. Quelle prestation reçoit-il ?","options":["Une rente d'incapacité permanente","Une rente aux ayants droit","Une indemnité en capital"],"correct":"Une indemnité en capital","accepte":[],"explication":"Le taux de 6 % est inférieur au seuil de 10 % : une indemnité en capital est versée. La rente d'incapacité permanente commence à 10 %, et la rente aux ayants droit est versée aux proches en cas de décès (DOC. 5).","notion":"Incapacité permanente","seance":"2","renvoi":"DOC. 5 — Les prestations après un accident du travail ou une maladie professionnelle","renvoi_bloc":"c8_s2_doc5"},{"type":"qcm_m","consigne":"Quelles affirmations sur les responsabilités de l'employeur sont exactes ?","options":["La responsabilité civile oblige l'auteur d'un dommage à indemniser la victime.","La responsabilité pénale ne s'applique qu'après un accident.","La responsabilité pénale punit une infraction prévue par la loi."],"correct":"La responsabilité civile oblige l'auteur d'un dommage à indemniser la victime. | La responsabilité pénale punit une infraction prévue par la loi.","accepte":[],"explication":"La responsabilité civile répare et la responsabilité pénale sanctionne (DOC. 6). L'article 223-1 du code pénal punit l'exposition d'autrui à un risque immédiat, même sans accident.","notion":"Responsabilité pénale","seance":"2","renvoi":"DOC. 6 — Les obligations et les responsabilités de l'employeur","renvoi_bloc":"c8_s2_doc6"},{"type":"qcm","consigne":"Dans le dossier de Distripièces, quel fait montre que l'employeur avait conscience du danger ?","options":["Inès travaillait dans l'entrepôt depuis quatre mois.","Le défaut du frein a été signalé à l'employeur lors de la séance du comité social et économique du 14 janvier.","L'accident s'est produit à 16 h 40."],"correct":"Le défaut du frein a été signalé à l'employeur lors de la séance du comité social et économique du 14 janvier.","accepte":[],"explication":"La faute inexcusable suppose que l'employeur avait ou aurait dû avoir conscience du danger (DOC. 6). Le signalement du 14 janvier prouve qu'il connaissait le défaut du frein (DOC. 7).","notion":"Faute inexcusable","seance":"2","renvoi":"DOC. 7 — Deux pièces du dossier de Distripièces","renvoi_bloc":"c8_s2_doc7"},{"type":"vf","consigne":"Inscrire le risque de chute au document unique supprime le danger lié au marchepied défectueux.","options":["Vrai","Faux"],"correct":"Faux","accepte":[],"explication":"Le document unique consigne les résultats de l'évaluation des risques : il ne répare pas le frein. Seul le remplacement du marchepied supprime le danger, première action recherchée selon le DOC. 6.","notion":"Suppression du danger","seance":"2","renvoi":"DOC. 6 — Les obligations et les responsabilités de l'employeur","renvoi_bloc":"c8_s2_doc6"}],"adapte":[{"type":"qcm","consigne":"Un salarié tombe dans l'escalier du métro en allant directement de son domicile à son travail. De quel type d'événement s'agit-il ?","options":["Un accident de trajet","Un accident du travail","Une maladie professionnelle"],"correct":"Un accident de trajet","accepte":[],"explication":"La chute a lieu sur le parcours habituel entre le domicile et le lieu de travail : c'est un accident de trajet (DOC. 1).","notion":"Accident de trajet","seance":"1","renvoi":"DOC. 1 — Accident du travail, accident de trajet, maladie professionnelle","renvoi_bloc":"c8_s1_doc1"},{"type":"qcm_m","consigne":"Quels sont deux critères de l'accident du travail ?","options":["Un fait accidentel soudain","Une exposition prolongée à un risque","Un lien avec le travail"],"correct":"Un fait accidentel soudain | Un lien avec le travail","accepte":[],"explication":"Le DOC. 1 cite un fait accidentel soudain, une lésion et un lien avec le travail. L'exposition prolongée à un risque correspond à la maladie professionnelle.","notion":"Accident du travail","seance":"1","renvoi":"DOC. 1 — Accident du travail, accident de trajet, maladie professionnelle","renvoi_bloc":"c8_s1_doc1"},{"type":"qcm_m","consigne":"Après un accident du travail suivi d'un arrêt, quels documents l'employeur envoie-t-il à la caisse ?","options":["La déclaration d'accident du travail","Le certificat médical initial","L'attestation de salaire"],"correct":"La déclaration d'accident du travail | L'attestation de salaire","accepte":[],"explication":"Selon le DOC. 2, l'employeur envoie la déclaration d'accident du travail dans les 48 heures et, en cas d'arrêt, l'attestation de salaire. Le certificat médical initial est établi par le médecin.","notion":"Déclaration d'accident du travail","seance":"1","renvoi":"DOC. 2 — Les démarches après un accident du travail","renvoi_bloc":"c8_s1_doc2"},{"type":"redige","consigne":"Nommer le document que le salarié présente à chaque professionnel de santé pour ne pas avancer les frais de ses soins.","options":[],"correct":"La feuille d'accident du travail","accepte":["feuille d'accident du travail","feuille d accident du travail","feuille d'accident","feuille accident du travail","feuille d'at","feuille at"],"explication":"Le DOC. 2 indique que l'employeur remet au salarié la feuille d'accident du travail : elle évite d'avancer les frais des soins liés à l'accident, dans la limite des tarifs de l'Assurance Maladie.","notion":"Feuille d'accident du travail","seance":"1","renvoi":"DOC. 2 — Les démarches après un accident du travail","renvoi_bloc":"c8_s1_doc2"},{"type":"vf","consigne":"Le délai de prise en charge est la durée maximale entre la fin de l'exposition au risque et l  professionnelle","seance":"1","renvoi":"DOC. 1 — Accident du travail, accident de trajet, maladie professionnelle","renvoi_bloc":"c8_s1_doc1"},{"type":"vf","consigne":"Le médecin envoie la déclaration d'accident du travail à la caisse.","options":["Vrai","Faux"],"correct":"Faux","accepte":[],"explication":"C'est l'employeur qui envoie la déclaration d'accident du travail, dans les 48 heures. Le médecin, lui, établit le certificat médical initial (DOC. 2).","notion":"Déclaration d'accident du travail","seance":"1","renvoi":"DOC. 2 — Les démarches après un accident du travail","renvoi_bloc":"c8_s1_doc2"},{"type":"qcm","consigne":"Quel document le salarié présente-t-il aux professionnels de santé pour ne pas avancer les frais ?","options":["L'attestation de salaire","Le certificat médical initial","La feuille d'accident du travail"],"correct":"La feuille d'accident du travail","accepte":[],"explication":"La feuille d'accident du travail évite d'avancer les frais des soins liés à l'accident (DOC. 2). L'attestation de salaire est envoyée par l'employeur à la caisse.","notion":"Feuille d'accident du travail","seance":"1","renvoi":"DOC. 2 — Les démarches après un accident du travail","renvoi_bloc":"c8_s1_doc2"},{"type":"vf","consigne":"Dans un tableau de maladie professionnelle, tous les travaux sont acceptés, même s'ils ne figurent pas dans la liste.","options":["Vrai","Faux"],"correct":"Faux","accepte":[],"explication":"Le tableau précise la maladie, le délai de prise en charge et la liste des travaux. Cette liste est limitative : les travaux du salarié doivent y figurer (DOC. 4).","notion":"Tableau de maladie professionnelle","seance":"1","renvoi":"DOC. 4 — Tableau n° 57 du régime général — partie C : poignet, main et doigt (extrait)","renvoi_bloc":"c8_s1_doc4"},{"type":"qcm","consigne":"Une condition du tableau de maladie professionnelle n'est pas remplie. Qui examine le dossier ?","options":["L'employeur","Le comité régional de reconnaissance des maladies professionnelles","Le médecin du salarié"],"correct":"Le comité régional de reconnaissance des maladies professionnelles","accepte":[],"explication":"Quand les trois conditions sont remplies, la présomption d'origine professionnelle s'applique. Si une condition manque, le dossier est examiné par le comité régional de reconnaissance des maladies professionnelles (DOC. 3).","notion":"CRRMP","seance":"1","renvoi":"DOC. 3 — La reconnaissance d'une maladie professionnelle","renvoi_bloc":"c8_s1_doc3"},{"type":"qcm","consigne":"Quelle prestation est une prestation en nature ?","options":["L'indemnité journalière","Les séances de rééducation","La rente aux ayants droit"],"correct":"Les séances de rééducation","accepte":[],"explication":"La rééducation est un soin : c'est une prestation en nature. L'indemnité journalière et la rente sont des sommes d'argent, donc des prestations en espèces (DOC. 5).","notion":"Prestation en nature","seance":"2","renvoi":"DOC. 5 — Les prestations après un accident du travail ou une maladie professionnelle","renvoi_bloc":"c8_s2_doc5"},{"type":"qcm","consigne":"Salaire journalier de base : 80 €. Arrêt de travail de 12 jours, donc taux de 60 %. Quelle est l'indemnité journalière ?","options":["80 €","64 €","48 €"],"correct":"48 €","accepte":[],"explication":"Calcul : 80 × 60 ÷ 100 = 48 € par jour. Le résultat 64 € correspond au taux de 80 %, applicable seulement à partir du 29e jour (DOC. 5).","notion":"Indemnité journalière","seance":"2","renvoi":"DOC. 5 — Les prestations après un accident du travail ou une maladie professionnelle","renvoi_bloc":"c8_s2_doc5"},{"type":"vf","consigne":"Un taux d'incapacité permanente de 15 % donne droit à une rente.","options":["Vrai","Faux"],"correct":"Vrai","accepte":[],"explication":"À partir de 10 % d'incapacité permanente, une rente est versée ; en dessous, c'est une indemnité en capital (DOC. 5).","notion":"Incapacité permanente","seance":"2","renvoi":"DOC. 5 — Les prestations après un accident du travail ou une maladie professionnelle","renvoi_bloc":"c8_s2_doc5"},{"type":"qcm","consigne":"Un employeur expose ses salariés à un risque immédiat de blessures graves, sans qu'aucun accident se produise. Quelle responsabilité peut le sanctionner ?","options":["La responsabilité civile","Aucune responsabilité","La responsabilité pénale"],"correct":"La responsabilité pénale","accepte":[],"explication":"La responsabilité pénale sanctionne une infraction : l'article 223-1 punit l'exposition à un risque immédiat, même sans accident. La responsabilité civile, elle, répare un dommage (DOC. 6).","notion":"Responsabilité pénale","seance":"2","renvoi":"DOC. 6 — Les obligations et les responsabilités de l'employeur","renvoi_bloc":"c8_s2_doc6"},{"type":"vf","consigne":"Le défaut du frein signalé à l'employeur le 14 janvier montre qu'il avait conscience du danger.","options":["Vrai","Faux"],"correct":"Vrai","accepte":[],"explication":"La conscience du danger est une condition de la faute inexcusable (DOC. 6). Le compte rendu du 14 janvier prouve que l'employeur connaissait le défaut du frein (DOC. 7).","notion":"Faute inexcusable","seance":"2","renvoi":"DOC. 7 — Deux pièces du dossier de Distripièces","renvoi_bloc":"c8_s2_doc7"},{"type":"qcm","consigne":"Quelle mesure supprime le danger du marchepied ?","options":["Demander aux salariés de faire attention","Remplacer le marchepied défectueux","Inscrire le risque au document unique"],"correct":"Remplacer le marchepied défectueux","accepte":[],"explication":"Remplacer le marchepied supprime le défaut du frein, première action recherchée selon le DOC. 6. Le document unique consigne l'évaluation des risques mais ne répare pas le matériel.","notion":"Suppression du danger","seance":"2","renvoi":"DOC. 6 — Les obligations et les responsabilités de l'employeur","renvoi_bloc":"c8_s2_doc6"}]}};</script>
