<body>
<div id="pse-retour" style="background:#16385c;color:#fff;font-family:Arial,sans-serif;font-size:13px;padding:7px 14px;line-height:1.4"><a href="index.html" style="color:#ffd166;text-decoration:none;font-weight:700">Accueil PSE</a> <span style="opacity:.6">›</span> CPS CAP — Mes émotions</div>

<div id="cps-app"></div>
<script src="assets/cps_kit.js?v=20261106"></script>
<script>
var IMG = {
  declencheur:"assets/emotions/scenes/timeline-card-1-declencheur.jpg",
  inquiet:"assets/emotions/scenes/timeline-card-2-emotion.jpg",
  corps:"assets/emotions/scenes/timeline-card-3-corps.jpg",
  plan:"assets/emotions/scenes/timeline-card-4-strategie.jpg",
  calme:"assets/emotions/scenes/timeline-card-5-resultat.jpg",
  telephone:"assets/emotions/scenes/timeline-strategy-evitement-telephone.jpg",
  demande:"assets/emotions/scenes/timeline-strategy-demander-aide.jpg",
  oral:"assets/cps/scenes/scene-ines-peur-oral.jpg",
  colere:"assets/cps/scenes/scene-lina-colere-cuisine.jpg",
  panier:"assets/cps/scenes/scene-malik-joie-panier.jpg",
  exclusion:"assets/emotions/e1-jury/dossier-exclusion-groupe.jpg",
  consigne:"assets/emotions/e1-jury/dossier-consigne-securite.jpg",
  reussite:"assets/emotions/e1-jury/dossier-reussite-feedback.jpg"
};
/* Chaîne commune E1/E2 : déclencheur → ce que je ressens (corps et émotion) → besoin touché → ce que je fais. */
var PIECE = function(bonne){
  return [
    {"l":"Le déclencheur","ok":bonne==="declencheur"},
    {"l":"Mon corps et mon émotion","ok":bonne==="ressens"},
    {"l":"Le besoin touché","ok":bonne==="besoin"},
    {"l":"Ce que je fais","ok":bonne==="fais"}
  ];
};
var CHOIX_STRAT = function(bonne){
  return [
    {"l":"J'agis sur moi","ok":bonne==="moi"},
    {"l":"J'agis sur le problème","ok":bonne==="probleme"},
    {"l":"Je fais un message-je","ok":bonne==="message"},
    {"l":"Je fais durer le bon moment","ok":bonne==="positif"},
    {"l":"Piège qui aggrave","ok":bonne==="piege"}
  ];
};
var CARTES = function(bonne){
  return [
    {"img":IMG.declencheur,"alt":"Noa lit un message sur son téléphone, l'air soucieux","l":"","ok":bonne==="declencheur","ex":"Oui. Noa reçoit l'information. Tout commence là."},
    {"img":IMG.corps,"alt":"Noa, une main sur la poitrine, les yeux fermés","l":"","ok":bonne==="ressens","ex":"Oui. Noa sent son corps réagir."},
    {"img":IMG.plan,"alt":"Noa écrit sur une feuille, assis à sa table","l":"","ok":bonne==="plan","ex":"Oui. Noa écrit son plan : il agit."},
    {"img":IMG.demande,"alt":"Noa parle à une adulte en montrant une feuille","l":"","ok":bonne==="demande","ex":"Oui. Noa pose sa question à l'adulte."},
    {"img":IMG.telephone,"alt":"Noa, le soir dans son lit, regarde son téléphone","l":"","ok":bonne==="piege","ex":"Oui. Noa reste sur son téléphone tard. C'est un piège."}
  ];
};
CPS.init({
  "theme":"emo",
  "code":"E1 + E2",
  "ref":"Identifier, exprimer et réguler ses émotions et son stress",
  "icon":"",
  "title":"Atelier timeline émotionnelle",
  "subtitle":"Suivre une situation pas à pas, puis choisir quoi faire.",
  "parcours":[
    {
      "temps":"decouvre",
      "type":"lesson",
      "title":"Une émotion se comprend pas à pas",
      "audio":"Tu suis Noa, un élève inventé. Une situation se lit en quatre étapes. Le déclencheur : ce qui arrive. Ce que je ressens : mon corps et mon émotion. Le besoin touché : ce qui compte pour moi. Ce que je fais : j'agis, puis je regarde si ça m'aide.",
      "blocks":[
        {"ic":"","html":"Tu suis <strong>Noa</strong>, un élève inventé. Tu n'as pas à raconter ta vie."},
        {"img":IMG.declencheur,"alt":"Noa lit un message sur son téléphone, l'air soucieux","html":"<strong>1. Le déclencheur</strong> : ce qui arrive. Noa apprend qu'il passe à l'oral demain."},
        {"img":IMG.corps,"alt":"Noa, une main sur la poitrine, les yeux fermés","html":"<strong>2. Ce que je ressens</strong> : mon corps, puis le mot de l'émotion. Souffle court, poitrine serrée : Noa est inquiet."},
        {"ic":"","html":"<strong>3. Le besoin touché</strong> : ce qui compte pour moi. Noa a besoin de savoir ce qu'on attend de lui."},

        {"ic":"","html":"Ensuite, je regarde si ça m'aide. Si non, j'essaie autre chose ou je demande de l'aide."}
      ],
      "cta":"Je commence les missions"
    },
    {
      "temps":"entraine",
      "type":"imagepick",
      "tag":"Mission 1",
      "instr":"Lis la phrase. Choisis l'image de Noa qui correspond.",
      "items":[
        {"text":"Noa reçoit l'information qui le met sous pression.","options":CARTES("declencheur")},
        {"text":"Noa sent son souffle devenir court.","options":CARTES("ressens")},
        {"text":"Noa écrit trois idées pour son oral.","options":CARTES("plan")},
        {"text":"Noa demande à l'adulte ce qu'on attend de lui.","options":CARTES("demande")},
        {"text":"Noa reste tard sur son téléphone pour ne plus y penser.","options":CARTES("piege")}
      ]
    },
    {
      "temps":"entraine",
      "type":"cardpick",
      "variant":"quiz",
      "shuffleOptions":false,
      "tag":"Mission 2",
      "instr":"Lis la phrase. Choisis l'étape de la timeline.",
      "hint":"Ce qui arrive ? Ce que je sens ? Ce qui compte pour moi ? Ce que je fais ?",
      "demo":{
        "text":"Le professeur annonce à Noa qu'il parlera devant le groupe demain.",
        "opts":PIECE("declencheur"),
        "ex":"C'est le déclencheur. C'est ce qui arrive à Noa."
      },
      "items":[
        {
          "text":"Le souffle de Noa devient court. Ses épaules se tendent.",
          "opts":PIECE("ressens"),
          "ex":"C'est ce que Noa ressent dans son corps."
        },
        {
          "text":"Noa veut savoir exactement ce qu'on attend de lui.",
          "opts":PIECE("besoin"),
          "ex":"C'est le besoin touché : la clarté compte pour lui."
        },
        {
          "text":"Noa hésite entre peur et honte. Il choisit le mot « inquiétude ».",
          "opts":PIECE("ressens"),
          "ex":"C'est l'émotion. Noa trouve le mot juste pour ce qu'il ressent."
        },
        {
          "text":"Noa respire lentement, puis écrit trois idées pour son oral.",
          "opts":PIECE("fais"),
          "ex":"C'est ce que Noa fait. Il agit sur son corps, puis sur le problème."
        },
        {
          "text":"Pendant la pause, un camarade bouscule Noa et fait tomber ses feuilles.",
          "opts":PIECE("declencheur"),
          "ex":"C'est un nouveau déclencheur : un fait qui arrive à Noa."
        },
        {
          "text":"Noa a besoin d'être respecté par ses camarades.",
          "opts":PIECE("besoin"),
          "ex":"C'est le besoin touché : le respect."
        }
      ]
    },
    {
      "temps":"entraine",
      "type":"cardpick",
      "variant":"quiz",
      "tag":"Mission 3",
      "instr":"Lis la timeline. Choisis ce qu'il vaut mieux faire.",
      "items":[
        {
          "img":IMG.corps,
          "alt":"Noa, une main sur la poitrine, les yeux fermés",
          "text":"Noa est très tendu. Il n'arrive plus à écouter. Il risque de parler trop vite.",
          "opts":CHOIX_STRAT("moi"),
          "ex":"Quand le corps monte fort, on le calme d'abord : respirer, faire une pause."
        },
        {
          "img":IMG.consigne,
          "alt":"un élève lit une affiche de consigne en atelier",
          "text":"La consigne de sécurité n'est pas claire. Besoin touché : savoir quoi faire.",
          "opts":CHOIX_STRAT("probleme"),
          "ex":"On agit sur le problème : on pose une question avant de commencer."
        },
        {
          "img":IMG.exclusion,
          "alt":"un élève assis un peu à l'écart d'un groupe qui travaille",
          "text":"Personne ne donne de rôle à Noa. Il est triste. Besoin touché : participer.",
          "opts":CHOIX_STRAT("message"),
          "ex":"Un message-je aide : « Je suis triste quand… J'aimerais participer à… »"
        },
        {
          "img":IMG.reussite,
          "alt":"un adulte parle à un élève devant son travail terminé",
          "text":"Noa a réussi son travail. Il est fier. Son tuteur le félicite.",
          "opts":CHOIX_STRAT("positif"),
          "ex":"On fait durer le bon moment : en profiter, dire merci, le garder en mémoire."
        },
        {
          "img":IMG.telephone,
          "alt":"Noa, le soir dans son lit, regarde son téléphone",
          "text":"Noa reste sur son téléphone jusqu'à minuit pour oublier son oral.",
          "opts":CHOIX_STRAT("piege"),
          "ex":"C'est un piège. Ça soulage ce soir, mais demain il sera fatigué."
        }
      ]
    },
    {
      "temps":"situation",
      "type":"order",
      "title":"Mission 4 — Reconstruis la timeline de Noa",
      "instr":"Remets les cartes dans l'ordre.",
      "audio":"Remets les cartes dans l'ordre. Le déclencheur. Ce que Noa ressent. Le besoin touché. Ce qu'il fait. Ce qu'il vérifie.",
      "steps":[
        "Le déclencheur : Noa apprend qu'il passe à l'oral demain.",
        "Ce qu'il ressent : souffle court, poitrine serrée. Il est inquiet.",
        "Le besoin touché : savoir ce qu'on attend de lui.",
        "Ce qu'il fait : il respire, puis il écrit trois idées.",
        "Il vérifie : il se sent plus calme et plus prêt."
      ],
      "stepImages":[IMG.declencheur, IMG.corps, null, IMG.plan, IMG.calme],
      "stepAlts":[
        "Noa lit un message sur son téléphone",
        "Noa, une main sur la poitrine",
        "",
        "Noa écrit sur une feuille",
        "Noa, son sac sur l'épaule, l'air détendu"
      ]
    },
    {
      "temps":"situation",
      "type":"scenario",
      "tag":"Mission 5",
      "scenes":[
        {
          "img":IMG.oral,
          "alt":"Inès debout devant la classe",
          "text":"Oral dans dix minutes. Ton ventre est serré. Tu penses que tu vas rater.",
          "audio":"Oral dans dix minutes. Ton ventre est serré. Tu penses que tu vas rater.",
          "choices":[
            {"l":"Je calme d'abord mon corps, puis je relis trois idées.","good":true,"fb":"Oui. Le corps d'abord, le problème ensuite."},
            {"l":"Je regarde mon téléphone jusqu'au dernier moment pour oublier.","good":false,"fb":"Ça soulage quelques secondes. Mais tu n'es pas plus prêt."},
            {"l":"Je me dis que je suis nul et je ne fais rien.","good":false,"fb":"Cette pensée aggrave l'émotion. Cherche une petite action possible."}
          ]
        },
        {
          "img":IMG.colere,
          "alt":"Lina devant sa préparation renversée, Noa s'éloigne",
          "text":"Un camarade renverse ta préparation et s'en va. Tu sens la colère monter.",
          "audio":"Un camarade renverse ta préparation et s'en va. Tu sens la colère monter.",
          "choices":[
            {"l":"Je respire. Puis : « Je suis en colère, ma préparation est par terre. Aide-moi à nettoyer. »","good":true,"fb":"Oui. Tu te calmes, puis tu dis ton émotion, le fait et ta demande."},
            {"l":"Je l'accuse tout de suite devant tout le monde, en criant très fort.","good":false,"fb":"Ta colère se comprend. Mais crier aggrave la situation."},
            {"l":"Je ne dis rien. Je garde ma colère pour moi toute la journée.","good":false,"fb":"Le silence laisse le problème entier. Ton besoin n'est pas entendu."}
          ]
        },
        {
          "img":IMG.panier,
          "alt":"Malik montre un panier en osier terminé, Mme Roche lève le pouce",
          "text":"Tu finis un panier difficile. Ta formatrice le remarque. Tu es fier.",
          "audio":"Tu finis un panier difficile. Ta formatrice le remarque. Tu es fier.",
          "choices":[
            {"l":"J'en profite, je dis merci et je retiens ce qui m'a aidé.","good":true,"fb":"Oui. La timeline sert aussi pour les émotions agréables."},
            {"l":"Je dis que ce n'est rien et je passe vite à autre chose.","good":false,"fb":"Tu effaces ta fierté. Elle peut te donner confiance."},
            {"l":"Je compare tout de suite avec ceux qui ont moins bien réussi.","good":false,"fb":"Se comparer abîme le lien. On peut être fier sans écraser les autres."}
          ]
        }
      ]
    },
    {
      "temps":"point",
      "type":"wrap",
      "keep":[
        {"ic":"","html":"La timeline : <strong>déclencheur → ce que je ressens (corps et émotion) → besoin touché → ce que je fais</strong>."},
        {"ic":"","html":"Je ne choisis pas au hasard : la force de l'émotion et le besoin me guident."},
        {"ic":"","html":"Si mon corps monte fort, j'agis sur moi d'abord : pause, respiration, mouvement."},
        {"ic":"","html":"Si le problème est clair, j'agis dessus : poser une question, préparer, réparer."},
        {"ic":"","html":"Si une relation est touchée, le message-je aide à parler sans accuser."},
        {"ic":"","html":"Si l'émotion est agréable, je la fais durer : en profiter, partager, dire merci."}
      ],
      "self":[
        "Je sais reconstruire une timeline émotionnelle complète.",
        "Je sais repérer déclencheur, émotion, corps, besoin, stratégie et résultat.",
        "Je sais choisir une stratégie selon l'intensité et le besoin.",
        "Je sais éviter une réaction piège qui aggrave.",
        "Je sais utiliser la timeline avec une émotion agréable ou désagréable."
      ]
    }
  ]
});
</script>
