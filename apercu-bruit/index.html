<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Le bruit au quotidien</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#162921;font:600 1rem system-ui}main,header,footer{max-width:880px;margin:auto;padding:1rem}header,nav{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}h1,h2{margin:.25em 0 .65em}button{font:inherit;background:white;color:inherit;border:2px solid #537369;border-radius:14px;padding:.65rem .85rem;cursor:pointer;min-height:46px}button:focus-visible{outline:4px solid #994b08;outline-offset:2px}button:disabled{opacity:.55}#ecran{background:white;border-radius:24px;padding:clamp(12px,4vw,32px);min-height:340px}figure{margin:0 auto 1rem;text-align:center}figure img{display:block;max-width:100%;max-height:260px;object-fit:contain;margin:auto}.cartes,.cases{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}.carte{display:flex;flex-direction:column;align-items:center;width:min(160px,44%);border:2px solid #aec3ba;border-radius:16px;padding:.3rem}.carte button:first-child{width:100%;border:0}.carte img,.cases img{width:100%;height:clamp(60px,16vw,100px);object-fit:contain}.son{min-width:46px}.actif{background:#d1eee2}.primaire{background:#135a46;color:white}#retour{min-height:3rem;display:flex;gap:.6rem;align-items:center}progress{width:min(100%,250px)}.jauge{display:block;width:100%;font-size:2rem;letter-spacing:.1em;color:#135a46}.piece{width:100%;height:85px;background-size:300% 100%;background-repeat:no-repeat;display:block}.cases button{width:29%;min-height:66px}footer{font-size:.85rem;font-weight:400}

.plateau{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin:1rem auto;max-width:450px}
.plateau button{width:100%;padding:0;overflow:hidden;border-radius:6px}.plateau button:disabled{opacity:1}
.plateau .piece{height:auto;aspect-ratio:670 / 1650}.plateau .fantome{opacity:.27}
.indice{outline:4px dashed #995100;outline-offset:-3px}
figure:has(img[src$="atelier.jpg"]){position:relative;width:fit-content;max-width:100%}
.indice-ponceuse::after{content:'';position:absolute;left:34%;top:64%;width:30%;height:30%;border:5px solid #ffdf42;border-radius:12px;pointer-events:none}
.sequence{display:flex;align-items:center;justify-content:center;gap:.5rem}.sequence img{width:43%}
.guide-action{margin:.25rem 0 1rem;padding:.6rem .85rem;background:#e4f2eb;border-radius:12px;font-weight:750}
.consigne-visible{margin:.25rem 0 .7rem;font-size:1.15rem;font-weight:750}
</style></head><body>
<header><strong>Coup de pouce</strong><button id="ecouter">🔊 Écouter</button><button id="stop">■ Arrêter</button><button id="muet" aria-pressed="false">Audio : oui</button></header>
<main><h1>Le bruit</h1><p><progress id="progression" aria-label="Position"></progress> <span id="position"></span></p>
<section id="ecran" aria-labelledby="titre"></section>
<div id="retour" role="status"></div>
<nav><button id="avant">← Retour</button><button id="passer">Passer</button><button id="suivant" class="primaire">Suivant →</button></nav></main>
<footer>CAP PSE · B4 · Cours visuels de l’Atelier PSE. Pictogrammes ARASAAC, Sergio Palao, Gouvernement d’Aragon, CC BY-NC-SA.</footer>
<script src="parcours.js?v=suite7"></script></body></html>
