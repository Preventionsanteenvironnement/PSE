<style>
:root{
  --fond1:#0F3D36; --fond2:#1D5E50; --clair:#F4F8F5; --encre:#13302A; --doux:#5B7A71;
  --reponse:#FFD23F; --reponse-encre:#2A2200; --ligne:rgba(255,255,255,.22);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--clair);
  font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:1.1rem;line-height:1.5;
  background:
    radial-gradient(1200px 600px at 15% -10%,rgba(255,210,63,.13),transparent 60%),
    radial-gradient(900px 700px at 110% 110%,rgba(120,220,180,.14),transparent 60%),
    linear-gradient(160deg,var(--fond1),var(--fond2));
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--reponse);outline-offset:4px}

.page{max-width:820px;margin:0 auto;padding:1.4rem 1.1rem 2.5rem;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1.7rem,4.5vw,2.6rem);line-height:1.05;margin:0;letter-spacing:-.01em}
header p{margin:.35rem 0 0;opacity:.8}

.filtres{display:flex;gap:.5rem;overflow-x:auto;padding:1.1rem .1rem .4rem;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.puce{flex:none;border:2px solid var(--ligne);background:rgba(255,255,255,.06);border-radius:999px;padding:.4rem 1rem;font-weight:700;font-size:1rem;transition:background .2s,border-color .2s}
.puce:hover{border-color:rgba(255,255,255,.5)}
.puce[aria-pressed="true"]{background:var(--clair);color:var(--encre);border-color:var(--clair)}

.progression{display:flex;align-items:center;gap:.9rem;margin:.8rem 0 1.3rem}
.piste{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
.piste span{display:block;height:100%;width:0;background:var(--reponse);border-radius:9px;transition:width .35s ease}
.num{font-weight:700;font-variant-numeric:tabular-nums;min-width:4.5rem;text-align:right}

/* ===== Scène / tilt / flip ===== */
.scene{flex:1;display:flex;align-items:center;justify-content:center;perspective:1600px;padding:.5rem 0 1rem}
.pile{position:relative;width:min(100%,640px);aspect-ratio:3/2;min-height:300px}
.pile::before,.pile::after{content:"";position:absolute;inset:0;border-radius:26px;background:rgba(244,248,245,.16);transform:translateY(14px) scale(.95);z-index:0}
.pile::after{transform:translateY(26px) scale(.9);background:rgba(244,248,245,.08)}
.tilt{position:absolute;inset:0;z-index:1;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.2,1);will-change:transform}
.tilt.actif{transition:transform .08s linear}
.carte{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.35,.45,1);cursor:pointer;border-radius:26px;outline:none}
.carte.retournee{transform:rotateY(180deg)}
.carte:focus-visible .face{outline:4px solid var(--reponse);outline-offset:4px}
.face{
  position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  padding:clamp(1.2rem,4vw,2.4rem);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.55),0 10px 20px -10px rgba(0,0,0,.35);
}
.devant{background:linear-gradient(155deg,#FFFFFF,#EEF4F0);color:var(--encre)}
.dos{background:linear-gradient(155deg,#FFE27A,var(--reponse));color:var(--reponse-encre);transform:rotateY(180deg)}
.haut{display:flex;justify-content:space-between;align-items:center;gap:1rem;transform:translateZ(30px)}
.seance{font-weight:700;font-size:.9rem;padding:.25rem .7rem;border-radius:999px;background:rgba(19,48,42,.08)}
.dos .seance{background:rgba(42,34,0,.1)}
.voix{border:0;background:rgba(19,48,42,.08);width:44px;height:44px;border-radius:50%;font-size:1.25rem;display:grid;place-items:center;transition:transform .15s}
.dos .voix{background:rgba(42,34,0,.1)}
.voix:hover{transform:scale(1.08)}
.corps{flex:1;display:flex;align-items:center;transform:translateZ(50px)}
.texte{margin:0;font-weight:700;font-size:clamp(1.3rem,3.6vw,2rem);line-height:1.25}
.devant .texte{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.005em}
.dos .texte{font-weight:400}
.notion{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1rem,2.4vw,1.2rem);margin-bottom:.4rem;opacity:.75}
.bas{font-size:.95rem;color:var(--doux);transform:translateZ(20px)}
.dos .bas{color:rgba(42,34,0,.65)}
.reflet{position:absolute;inset:0;border-radius:26px;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.55),rgba(255,255,255,0) 55%);mix-blend-mode:soft-light}
.tilt.actif .reflet{opacity:1}

/* ===== Commandes ===== */
.commandes{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;margin-top:.6rem}
.rond{width:60px;height:60px;border-radius:50%;border:2px solid var(--ligne);background:rgba(255,255,255,.08);font-size:1.5rem;display:grid;place-items:center;transition:background .2s,transform .15s}
.rond:hover{background:rgba(255,255,255,.18)}
.rond:active{transform:scale(.94)}
.rond:disabled{opacity:.35;cursor:default}
.retourner{height:60px;border-radius:999px;border:0;background:var(--reponse);color:var(--reponse-encre);font-weight:700;font-size:1.15rem;box-shadow:0 10px 24px -10px rgba(255,210,63,.7);transition:transform .15s}
.retourner:active{transform:scale(.97)}
.outils{display:flex;justify-content:center;gap:.6rem;margin-top:1rem;flex-wrap:wrap}
.lien{border:0;background:none;color:var(--clair);opacity:.8;text-decoration:underline;text-underline-offset:4px;padding:.4rem .6rem;font-size:1rem}
.lien:hover{opacity:1}
.aide{text-align:center;font-size:.9rem;opacity:.65;margin-top:.8rem}
kbd{border:1px solid rgba(255,255,255,.4);border-radius:5px;padding:0 .35rem;font-family:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:560px){
  .pile{aspect-ratio:auto;height:min(62vh,440px)}
  .rond{width:54px;height:54px}.retourner{height:54px}
  .aide .clavier{display:none}
}
@media (prefers-reduced-motion:reduce){
  .carte,.tilt,.piste span{transition:none!important}
}

.fil{margin:0 0 .7rem}
.fil a{color:var(--clair);opacity:.85;text-decoration:underline;text-underline-offset:4px;font-size:1rem;padding:.35rem .1rem;display:inline-block}
.fil a:hover{opacity:1}
</style>

/* ===== CONTENU — remplacer ce tableau pour un autre chapitre =====

const TITRES={"1": "Séance 1 — La digestion des aliments", "2": "Séance 2 — Les pratiques alimentaires et leurs enjeux", "3": "Séance 3 — L'étiquette alimentaire", "4": "Séance 4 — Argumenter un choix alimentaire responsable"};
const CARTES=[{"s": 1, "n": "Appareil digestif", "q": "De quoi est formé l'appareil digestif ?", "r": "Du tube digestif et des glandes digestives."}, {"s": 1, "n": "Trajet des aliments", "q": "Nommer les six organes du tube digestif, dans l'ordre du trajet des aliments.", "r": "Bouche, œsophage, estomac, intestin grêle, gros intestin, anus."}, {"s": 1, "n": "Hors du trajet", "q": "Quels organes de l'appareil digestif sont situés hors du trajet des aliments ?", "r": "Les glandes salivaires, le foie et le pancréas."}, {"s": 1, "n": "Digestion", "q": "Qu'est-ce que la digestion ?", "r": "La transformation des aliments en nutriments."}, {"s": 1, "n": "Digestion mécanique", "q": "Où a lieu la digestion mécanique, et que fait-elle ?", "r": "Dans la bouche et l'estomac : les dents broient les aliments, le brassage et les contractions de l'estomac les réduisent en bouillie."}, {"s": 1, "n": "Digestion chimique", "q": "Grâce à quoi se déroule la digestion chimique ?", "r": "Grâce à des enzymes et à des sucs digestifs (salive, acide chlorhydrique de l'estomac, bile du foie), tout au long du tube digestif."}, {"s": 1, "n": "Enzymes", "q": "Quel est le rôle des enzymes dans la digestion ?", "r": "Fractionner les molécules complexes des aliments en éléments plus simples, absorbables par le tube digestif."}, {"s": 1, "n": "Bile", "q": "La bile est-elle une enzyme ?", "r": "Non : c'est un suc digestif sécrété par le foie."}, {"s": 1, "n": "Amidon", "q": "Quel nutriment la digestion de l'amidon donne-t-elle ?", "r": "Du glucose."}, {"s": 1, "n": "Protéines", "q": "Quels nutriments la digestion des protéines donne-t-elle ?", "r": "Des acides aminés."}, {"s": 1, "n": "Lipides", "q": "Quels nutriments la digestion des lipides donne-t-elle ?", "r": "Des acides gras et du glycérol."}, {"s": 1, "n": "La barre d'Agathe", "q": "Quels nutriments donnent l'amidon de la farine et les lipides du chocolat de la barre d'Agathe ?", "r": "Du glucose ; des acides gras et du glycérol."}, {"s": 1, "n": "Absorption intestinale", "q": "Qu'est-ce que l'absorption intestinale ?", "r": "Le passage des nutriments à travers la paroi de l'intestin grêle, vers le sang ou la lymphe."}, {"s": 1, "n": "Villosités", "q": "Pourquoi l'intestin grêle absorbe-t-il autant de nutriments ?", "r": "Ses villosités et ses microvillosités accroissent considérablement la surface d'absorption."}, {"s": 1, "n": "Devenir de l'amidon", "q": "Expliquer le devenir de l'amidon de la barre chocolatée, de la bouche jusqu'au sang.", "r": "Digestion mécanique et chimique : l'amidon devient du glucose, qui traverse la paroi de l'intestin grêle et passe dans le sang."}, {"s": 2, "n": "Pratique choisie", "q": "Qu'est-ce qu'une pratique alimentaire choisie ?", "r": "Une pratique adoptée volontairement : convictions, environnement, goût, santé."}, {"s": 2, "n": "Pratique subie", "q": "Qu'est-ce qu'une pratique alimentaire subie ?", "r": "Une pratique imposée : maladie, allergie, manque d'argent, contraintes du travail."}, {"s": 2, "n": "Le végétarisme d'Agathe", "q": "Pourquoi le végétarisme d'Agathe est-il une pratique choisie ?", "r": "Elle l'a adopté volontairement, pour le bien-être animal et pour la planète."}, {"s": 2, "n": "La barre d'Agathe", "q": "Pourquoi la barre chocolatée d'Agathe à la pause est-elle une pratique subie ?", "r": "Le distributeur ne propose que des produits sucrés ou salés et la salle de pause n'a pas de réfrigérateur pour conserver une collation."}, {"s": 2, "n": "Végétalisme", "q": "Que consomme une personne végétalienne ?", "r": "Aucun produit d'origine animale."}, {"s": 2, "n": "Sans gluten", "q": "Pourquoi un régime sans gluten imposé par une maladie cœliaque est-il une pratique subie ?", "r": "Il est imposé par la maladie, toute la vie."}, {"s": 2, "n": "Besoin nutritionnel moyen", "q": "Qu'est-ce que le besoin nutritionnel moyen (BNM) ?", "r": "La quantité moyenne d'un nutriment nécessaire aux personnes d'une population : un repère, et non le besoin d'une personne.", "dit": "Qu'est-ce que le besoin nutritionnel moyen (B N M) ?|La quantité moyenne d'un nutriment nécessaire aux personnes d'une population : un repère, et non le besoin d'une personne."}, {"s": 2, "n": "BNM en fer", "q": "Quel est le BNM en fer d'une femme de 18 ans et plus aux pertes menstruelles faibles à modérées ?", "r": "7 mg par jour.", "dit": "Quel est le B N M en fer d'une femme de 18 ans et plus aux pertes menstruelles faibles à modérées ?|7 milligrammes par jour."}, {"s": 2, "n": "RNP", "q": "Qu'est-ce que la référence nutritionnelle pour la population (RNP) ?", "r": "L'apport qui couvre en théorie le besoin de presque toute la population (97,5 % dans la plupart des cas).", "dit": "Qu'est-ce que la référence nutritionnelle pour la population (R N P) ?|L'apport qui couvre en théorie le besoin de presque toute la population (97,5 % dans la plupart des cas)."}, {"s": 2, "n": "Carence", "q": "Qu'est-ce qu'une carence ?", "r": "Le manque durable d'un nutriment."}, {"s": 2, "n": "Bénéfice", "q": "Quel bénéfice pour la santé le régime végétarien présente-t-il ?", "r": "Il est associé à un risque plus faible de diabète de type 2."}, {"s": 2, "n": "Fer héminique", "q": "Pourquoi une personne végétarienne a-t-elle un risque de carence en fer ?", "r": "Le fer héminique, mieux absorbé, n'existe que dans les aliments d'origine animale."}, {"s": 2, "n": "Carence en fer", "q": "Quels symptômes une carence en fer peut-elle provoquer ?", "r": "Fatigue, maux de tête, vertige, essoufflement : c'est l'anémie ferriprive."}, {"s": 2, "n": "Produits à limiter", "q": "Que recommande de limiter Santé publique France ?", "r": "Les boissons sucrées, les aliments gras, sucrés, salés et ultra-transformés."}, {"s": 2, "n": "Excès alimentaire", "q": "Qu'est-ce qu'un excès alimentaire ?", "r": "Un apport trop important d'énergie, de sucres, de graisses ou de sel."}, {"s": 2, "n": "Surface agricole", "q": "Comparer la surface agricole utilisée pour produire 100 g de protéines de bœuf et de légumineuses.", "r": "Bœuf : 164 m² ; légumineuses : 7,3 m² ; le bœuf utilise environ 22 fois plus de surface.", "dit": "Comparer la surface agricole utilisée pour produire 100 g de protéines de bœuf et de légumineuses.|Bœuf : 164 mètres carrés ; légumineuses : 7,3 mètres carrés ; le bœuf utilise environ 22 fois plus de surface."}, {"s": 3, "n": "Mentions obligatoires", "q": "Citer trois mentions obligatoires de l'étiquette d'une denrée alimentaire.", "r": "Trois parmi : dénomination, liste des ingrédients, allergènes, quantité nette, date (DDM ou DLC), déclaration nutritionnelle.", "dit": "Citer trois mentions obligatoires de l'étiquette d'une denrée alimentaire.|Trois parmi : dénomination, liste des ingrédients, allergènes, quantité nette, date (D D M ou D L C), déclaration nutritionnelle."}, {"s": 3, "n": "Règlement", "q": "Quel texte fixe les mentions obligatoires de l'étiquette ?", "r": "Le règlement (UE) n° 1169/2011.", "dit": "Quel texte fixe les mentions obligatoires de l'étiquette ?|Le règlement U E n° 1169/2011."}, {"s": 3, "n": "Origine", "q": "Quelle mention renseigne sur l'origine d'un produit ?", "r": "Le pays d'origine ou le lieu de provenance, lorsqu'il est prévu."}, {"s": 3, "n": "Allergène", "q": "Comment un allergène apparaît-il dans la liste des ingrédients ?", "r": "Il est mis en évidence, par exemple en gras."}, {"s": 3, "n": "Liste des ingrédients", "q": "Dans quel ordre les ingrédients sont-ils listés ?", "r": "Du plus important au moins important en poids."}, {"s": 3, "n": "Valeur énergétique", "q": "En quelles unités s'exprime la valeur énergétique ?", "r": "En kilojoules (kJ) et en kilocalories (kcal).", "dit": "En quelles unités s'exprime la valeur énergétique ?|En kilojoules (kilojoules) et en kilocalories (kilocalories)."}, {"s": 3, "n": "Calcul", "q": "Calculer la valeur énergétique d'une barre de 50 g à 480 kcal pour 100 g.", "r": "480 × 50 ÷ 100 = 240 kcal.", "dit": "Calculer la valeur énergétique d'une barre de 50 g à 480 kilocalories pour 100 g.|480  fois  50  divisé par  100 = 240 kilocalories."}, {"s": 3, "n": "Allergènes du produit A", "q": "Quels sont les allergènes de la barre chocolatée au caramel (produit A) ?", "r": "Le blé et le lait."}, {"s": 3, "n": "Comparer A et B", "q": "Comparer les sucres et les protéines des produits A et B, pour 100 g.", "r": "A : 48 g de sucres, 5 g de protéines. B : 4,5 g de sucres, 19 g de protéines."}, {"s": 3, "n": "Additif", "q": "Comment repérer un additif dans la liste des ingrédients ?", "r": "Il figure souvent avec la lettre E, par exemple E471.", "dit": "Comment repérer un additif dans la liste des ingrédients ?|Il figure souvent avec la lettre E, par exemple E 471."}, {"s": 3, "n": "Ultra-transformé", "q": "Relever deux indices qui montrent que le produit A est ultra-transformé.", "r": "Un émulsifiant (E471) et un colorant (E150d).", "dit": "Relever deux indices qui montrent que le produit A est ultra-transformé.|Un émulsifiant (E 471) et un colorant (E 150 d)."}, {"s": 3, "n": "Nutri-Score", "q": "Que prend en compte le Nutri-Score ?", "r": "Pour 100 g ou 100 mL : les nutriments et aliments à favoriser (fibres, protéines, fruits, légumes, légumes secs) et à limiter (énergie, acides gras saturés, sucres, sel)."}, {"s": 3, "n": "Limite du Nutri-Score", "q": "Que ne prend pas en compte le Nutri-Score ?", "r": "Le degré de transformation des aliments."}, {"s": 3, "n": "La collation d'Agathe", "q": "Quel produit choisir pour la collation d'Agathe, et pourquoi ?", "r": "Le produit B : moins de sucres (4,5 g contre 48 g), plus de protéines (19 g contre 5 g), aucun additif."}, {"s": 4, "n": "Local de restauration", "q": "Que prévoit l'article R. 4228-22 du Code du travail dans les établissements d'au moins 50 salariés ?", "r": "Un local de restauration doté d'un moyen de conservation ou de réfrigération des aliments et d'une installation pour réchauffer les plats.", "dit": "Que prévoit l'article R 4228 tiret 22 du Code du travail dans les établissements d'au moins 50 salariés ?|Un local de restauration doté d'un moyen de conservation ou de réfrigération des aliments et d'une installation pour réchauffer les plats."}, {"s": 4, "n": "La salle de pause", "q": "Comparer l'équipement de la salle de pause de l'entrepôt aux obligations de l'article R. 4228-22.", "r": "L'entrepôt compte 80 salariés (au moins 50) : un moyen de conservation ou de réfrigération est obligatoire, or la salle n'a pas de réfrigérateur.", "dit": "Comparer l'équipement de la salle de pause de l'entrepôt aux obligations de l'article R 4228 tiret 22.|L'entrepôt compte 80 salariés (au moins 50) : un moyen de conservation ou de réfrigération est obligatoire, or la salle n'a pas de réfrigérateur."}, {"s": 4, "n": "Horaires atypiques", "q": "Que recommande l'INRS pour les horaires atypiques ?", "r": "Repousser la prise de poste du matin après 6 h, insérer des pauses pour les repas, ne pas grignoter ni sauter de repas, une collation légère pour les postes du matin et de nuit.", "dit": "Que recommande l'I N R S pour les horaires atypiques ?|Repousser la prise de poste du matin après 6 heures, insérer des pauses pour les repas, ne pas grignoter ni sauter de repas, une collation légère pour les postes du matin et de nuit."}, {"s": 4, "n": "Prévention collective", "q": "Proposer une mesure de prévention collective pour les salariés de l'entrepôt.", "r": "Une parmi : équiper la salle de pause d'un réfrigérateur ; décaler la prise de poste après 6 h ; proposer au distributeur des produits peu sucrés.", "dit": "Proposer une mesure de prévention collective pour les salariés de l'entrepôt.|Une parmi : équiper la salle de pause d'un réfrigérateur ; décaler la prise de poste après 6 heures ; proposer au distributeur des produits peu sucrés."}, {"s": 4, "n": "Prévention individuelle", "q": "Proposer à Agathe deux mesures de prévention individuelle.", "r": "Deux parmi : préparer une collation peu sucrée ; boire de l'eau plutôt qu'une boisson sucrée ; consommer des légumes secs ; faire vérifier son taux de fer par un médecin."}, {"s": 4, "n": "Rester végétarienne", "q": "Donner deux arguments pour qu'Agathe reste végétarienne en surveillant ses apports en fer.", "r": "Santé : risque plus faible de diabète de type 2. Environnement : beaucoup moins de surface agricole que le bœuf."}, {"s": 4, "n": "Critères de choix", "q": "Quels critères croiser pour choisir un aliment ?", "r": "Santé et besoins, qualité nutritionnelle, transformation, impact environnemental, prix et temps."}, {"s": 4, "n": "Qualité alimentaire", "q": "Qu'est-ce que la qualité alimentaire ?", "r": "L'ensemble des qualités d'un produit ou d'un repas : qualité nutritionnelle, degré de transformation, impact environnemental."}, {"s": 4, "n": "Impact environnemental", "q": "Qu'est-ce que l'impact environnemental d'un aliment ?", "r": "L'ensemble de ses effets sur l'environnement : climat, eau, sols, biodiversité."}];

const $=id=>document.getElementById(id);
let seance=0,paquet=[],pos=0,retournee=false;
const reduit=matchMedia("(prefers-reduced-motion: reduce)").matches;
const pointeurFin=matchMedia("(hover:hover) and (pointer:fine)").matches;

/* ===== Paquet ===== */
function charger(melanger=false){
  paquet=CARTES.filter(c=>!seance||c.s===seance);
  if(melanger){paquet=paquet.slice();for(let i=paquet.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[paquet[i],paquet[j]]=[paquet[j],paquet[i]]}}
  pos=0;afficher();
}
function afficher(){
  const c=paquet[pos];
  poser(false);
  // on change le texte à mi-chemin si la carte était retournée
  $("q").textContent=c.q;$("r").textContent=c.r;$("n").textContent=c.n;
  $("sQ").textContent=$("sR").textContent=TITRES[c.s];
  $("num").textContent=`${pos+1} / ${paquet.length}`;
  $("barre").style.width=((pos+1)/paquet.length*100)+"%";
  $("prec").disabled=pos===0;$("suiv").disabled=pos===paquet.length-1;
  annoncer(`Carte ${pos+1} sur ${paquet.length}. ${c.q}`);
}
function poser(v){retournee=v;$("carte").classList.toggle("retournee",v);$("bRet").textContent=v?"Revoir la question":"Retourner la carte"}
function retourner(){poser(!retournee);if(retournee)annoncer("Réponse : "+paquet[pos].r)}
function aller(d){
  const n=pos+d;if(n<0||n>=paquet.length)return;
  arreterVoix();
  if(retournee){poser(false);setTimeout(()=>{pos=n;afficher()},reduit?0:260)}
  else{pos=n;afficher()}
}
function annoncer(t){$("annonce").textContent=t}

/* ===== Filtres ===== */
function filtres(){
  const f=$("filtres");f.innerHTML="";
  [[0,"Tout le module"],[1,"Séance 1"],[2,"Séance 2"],[3,"Séance 3"],[4,"Séance 4"]].forEach(([v,t])=>{
    const b=document.createElement("button");b.className="puce";b.textContent=t;b.setAttribute("aria-pressed",v===seance);
    b.onclick=()=>{seance=v;filtres();arreterVoix();charger()};f.appendChild(b);
  });
}

/* ===== Tilt 3D + reflet ===== */
const tilt=$("tilt"),pile=$("pile");
if(pointeurFin&&!reduit){
  pile.addEventListener("pointermove",e=>{
    const b=pile.getBoundingClientRect();
    const x=(e.clientX-b.left)/b.width, y=(e.clientY-b.top)/b.height;
    tilt.classList.add("actif");
    tilt.style.transform=`rotateX(${(0.5-y)*14}deg) rotateY(${(x-0.5)*16}deg) translateZ(10px)`;
    // reflet : on inverse x sur la face arrière (retournée)
    document.querySelectorAll(".reflet").forEach((r,i)=>{
      r.style.setProperty("--gx",((i===1?1-x:x)*100)+"%");r.style.setProperty("--gy",(y*100)+"%");
    });
  });
  pile.addEventListener("pointerleave",()=>{tilt.classList.remove("actif");tilt.style.transform=""});
}

/* ===== Balayage tactile ===== */
let x0=null,y0=null,glisse=false;
pile.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;glisse=false},{passive:true});
pile.addEventListener("touchmove",e=>{
  if(x0===null)return;const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;
  if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)){glisse=true;if(!reduit)tilt.style.transform=`translateX(${dx*.35}px) rotateY(${dx*.04}deg)`}
},{passive:true});
pile.addEventListener("touchend",e=>{
  if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;
  tilt.style.transform="";
  if(glisse&&Math.abs(dx)>60)aller(dx<0?1:-1);
  x0=null;
});

/* ===== Voix (optionnelle) ===== */
let voix=null;
function choisirVoix(){const v=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));voix=v.find(x=>/fr-FR/i.test(x.lang)&&/(google|natural|online|amélie|thomas|denise|henri)/i.test(x.name))||v.find(x=>/fr-FR/i.test(x.lang))||v[0]||null}
if("speechSynthesis" in window){choisirVoix();speechSynthesis.onvoiceschanged=choisirVoix}
else document.querySelectorAll(".voix").forEach(b=>b.hidden=true);
function lire(cote){
  if(!("speechSynthesis" in window))return;
  const c=paquet[pos],p=(c.dit||"").split("|");
  const t=cote==="q"?(p[0]||c.q):(p[1]||c.r);
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voix)u.voice=voix;u.rate=.95;speechSynthesis.speak(u);
}
function arreterVoix(){if("speechSynthesis" in window)speechSynthesis.cancel()}
document.querySelectorAll(".voix").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();lire(b.dataset.cote)}));

/* ===== Événements ===== */
$("carte").addEventListener("click",()=>{if(!glisse)retourner()});
$("carte").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();retourner()}});
$("bRet").onclick=retourner;
$("prec").onclick=()=>aller(-1);
$("suiv").onclick=()=>aller(1);
$("melange").onclick=()=>{arreterVoix();charger(true);annoncer("Cartes mélangées.")};
$("debut").onclick=()=>{arreterVoix();if(retournee)poser(false);pos=0;afficher()};
document.addEventListener("keydown",e=>{
  if(e.target.closest("button")&&(e.key===" "||e.key==="Enter"))return;
  if(e.key===" "){e.preventDefault();retourner()}
  else if(e.key==="ArrowRight")aller(1);
  else if(e.key==="ArrowLeft")aller(-1);
});
if(!pointeurFin)document.querySelector(".tactile").textContent="Glisse la carte vers la gauche ou la droite pour changer.";

filtres();charger();
</script>
</body>
</html>
