<script>
function shuf(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var P = "assets/cps/corps/";
/* Six images du corps : le texte alternatif décrit le geste, sans nommer l'émotion. */
var CORPS = {
  "joie":{"img":P+"corps-joie-poitrine.jpg","alt":"Noa, une main posée sur la poitrine, sourit"},
  "tristesse":{"img":P+"corps-tristesse-gorge.jpg","alt":"Lina, une main sur la gorge, yeux humides, regard vers le bas"},
  "colere":{"img":P+"corps-colere-poings.jpg","alt":"Malik, poings serrés, mâchoire crispée, épaules hautes"},
  "peur":{"img":P+"corps-peur-ventre.jpg","alt":"Inès, les deux mains sur le ventre, épaules remontées"},
  "surprise":{"img":P+"corps-surprise-sursaut.jpg","alt":"Noa en plein sursaut, corps figé, épaules relevées d’un coup"},
  "degout":{"img":P+"corps-degout-estomac.jpg","alt":"Lina, une main sur l’estomac, nez plissé, tête qui recule"}
};
var ZONES = ["ventre / estomac","poings / mâchoire","gorge","poitrine / cœur","tout le corps"];
function zoneOpts(bonne){
  var autres = shuf(ZONES.filter(function(z){ return z!==bonne; })).slice(0,3);
  return shuf([{l:bonne,ok:true}].concat(autres.map(function(z){ return {l:z,ok:false}; })));
}
function hypoOpts(bonne){
  return [
    {"l":"Joie","ok":bonne==="joie"},
    {"l":"Tristesse","ok":bonne==="tristesse"},
    {"l":"Colère","ok":bonne==="colere"},
    {"l":"Peur","ok":bonne==="peur"},
    {"l":"Surprise","ok":bonne==="surprise"},
    {"l":"Dégoût","ok":bonne==="degout"}
  ];
}
/* Quatre images à comparer : la première est la bonne */
function CHOIX(bonne, autres, ex){
  return [bonne].concat(autres).map(function(k, i){
    var c = CORPS[k];
    return i===0 ? {"img":c.img,"alt":c.alt,"ok":true,"ex":ex} : {"img":c.img,"alt":c.alt};
  });
}
CPS.init({
  "theme":"emo",
  "code":"E1.2",
  "ref":"Identifier ses émotions",
  "icon":"",
  "title":"Où je sens l’émotion dans mon corps",
  "subtitle":"Repère le signal du corps, puis vérifie avec la situation.",
  "parcours":[
    {
      "temps":"decouvre","type":"lesson","title":"Le corps parle, mais il faut vérifier",
      "audio":"Une émotion se voit sur le visage, mais elle se sent aussi dans le corps. La joie réchauffe la poitrine. La tristesse serre la gorge. La colère serre les poings et la mâchoire. La peur noue le ventre. La surprise fait sursauter. Le dégoût soulève l’estomac. Attention : un même signal peut avoir plusieurs sens. Le cœur peut battre vite avec la peur, la joie ou la surprise. On vérifie donc avec la situation.",
      "blocks":[
        {"img":CORPS.peur.img,"alt":CORPS.peur.alt,"html":"Le corps donne un <strong>signal</strong> : ici, le ventre se noue."},
        {"ic":"","html":"<strong>Joie</strong> : chaleur et légèreté dans la poitrine."},
        {"ic":"","html":"<strong>Tristesse</strong> : gorge serrée, yeux qui piquent, corps lourd."},
        {"ic":"","html":"<strong>Colère</strong> : poings et mâchoire serrés, chaleur qui monte."},
        {"ic":"","html":"<strong>Peur</strong> : ventre noué, cœur qui bat vite, épaules qui montent."},
        {"ic":"","html":"<strong>Surprise</strong> : sursaut, le corps se fige d’un coup."},
        {"ic":"","html":"<strong>Dégoût</strong> : estomac qui se soulève, nez plissé, recul."},
        {"ic":"","html":"Un même signal peut avoir <strong>plusieurs sens</strong> : le cœur bat vite avec la peur, la joie ou la surprise."},
        {"ic":"","html":"On ne conclut pas trop vite : on croise <strong>signal du corps + situation</strong>."}
      ],
      "cta":"Je m’entraîne"
    },
    {
      "temps":"entraine","type":"cardpick","variant":"quiz","tag":"Où est le signal ?",
      "instr":"Observe l’image et lis la phrase. Où le signal du corps est-il le plus visible ?",
      "demo":{"img":CORPS.peur.img,"alt":CORPS.peur.alt,"text":"Avant une évaluation, Inès pose les mains sur son ventre.","audio":"Avant une évaluation, Inès pose les mains sur son ventre. Où le signal du corps est-il le plus visible ?","opts":zoneOpts("ventre / estomac"),"ex":"Les mains sur le ventre montrent où le signal se sent : le ventre est noué."},
      "items":[
        {"img":CORPS.colere.img,"alt":CORPS.colere.alt,"text":"On a pris les outils de Malik sans demander. Ses mains se ferment.","audio":"On a pris les outils de Malik sans demander. Ses mains se ferment. Où le signal du corps est-il le plus visible ?","opts":zoneOpts("poings / mâchoire"),"ex":"Poings fermés et mâchoire crispée : le signal est dans les mains et la mâchoire.","hint":"Regarde ses mains."},
        {"img":CORPS.tristesse.img,"alt":CORPS.tristesse.alt,"text":"Lina apprend que sa meilleure amie part vivre loin. Elle a du mal à parler.","audio":"Lina apprend que sa meilleure amie part vivre loin. Elle a du mal à parler. Où le signal du corps est-il le plus visible ?","opts":zoneOpts("gorge"),"ex":"La gorge se serre : c’est pour cela qu’on a du mal à parler.","hint":"Où pose-t-elle sa main ?"},
        {"img":CORPS.joie.img,"alt":CORPS.joie.alt,"text":"Noa reçoit un retour très positif de son tuteur de stage.","audio":"Noa reçoit un retour très positif de son tuteur de stage. Où le signal du corps est-il le plus visible ?","opts":zoneOpts("poitrine / cœur"),"ex":"Une chaleur se diffuse dans la poitrine : le signal est au niveau du cœur.","hint":"Où pose-t-il sa main ?"},
        {"img":CORPS.surprise.img,"alt":CORPS.surprise.alt,"text":"Une porte claque d’un coup derrière Noa.","audio":"Une porte claque d’un coup derrière Noa. Où le signal du corps est-il le plus visible ?","opts":zoneOpts("tout le corps"),"ex":"Le sursaut touche tout le corps : il se fige d’un coup.","hint":"Une seule partie bouge, ou tout le corps ?"},
        {"img":CORPS.degout.img,"alt":CORPS.degout.alt,"text":"Lina sent l’odeur d’un poisson abîmé. Elle a un haut-le-cœur.","audio":"Lina sent l’odeur d’un poisson abîmé. Elle a un haut-le-cœur. Où le signal du corps est-il le plus visible ?","opts":zoneOpts("ventre / estomac"),"ex":"Le haut-le-cœur vient de l’estomac qui se soulève.","hint":"Où pose-t-elle sa main ?"}
      ]
    },
    {
      "temps":"entraine","type":"match","title":"Image du corps → ce que je sens",
      "instr":"Touche une image à gauche, puis ce que la personne sent dans son corps.",
      "audio":"Relie chaque image à ce que la personne sent dans son corps.",
      "pairs":[
        {"img":CORPS.joie.img,"alt":CORPS.joie.alt,"r":"Chaleur dans la poitrine","ex":"La joie peut réchauffer la poitrine."},
        {"img":CORPS.tristesse.img,"alt":CORPS.tristesse.alt,"r":"Gorge serrée","ex":"La tristesse peut serrer la gorge."},
        {"img":CORPS.colere.img,"alt":CORPS.colere.alt,"r":"Poings et mâchoire serrés","ex":"La colère tend les mains et la mâchoire."},
        {"img":CORPS.peur.img,"alt":CORPS.peur.alt,"r":"Ventre noué","ex":"La peur peut nouer le ventre."},
        {"img":CORPS.surprise.img,"alt":CORPS.surprise.alt,"r":"Sursaut, corps figé","ex":"La surprise fait sursauter tout le corps."},
        {"img":CORPS.degout.img,"alt":CORPS.degout.alt,"r":"Estomac qui se soulève","ex":"Le dégoût soulève l’estomac."}
      ]
    },
    {
      "temps":"entraine","type":"cardpick","variant":"quiz","tag":"Même signal, plusieurs sens",
      "instr":"Lis le signal et la situation. Choisis l’émotion la plus probable.",
      "items":[
        {"text":"Ton cœur bat vite. Tu apprends que tu as obtenu ton CAP.","audio":"Ton cœur bat vite. Tu apprends que tu as obtenu ton CAP. Quelle émotion est la plus probable ?","opts":hypoOpts("joie"),"ex":"Le cœur bat vite, mais la nouvelle est bonne : c’est la joie.","hint":"La nouvelle est-elle bonne ou mauvaise ?"},
        {"text":"Ton cœur bat vite. Dans une minute, tu passes à l’oral devant le jury.","audio":"Ton cœur bat vite. Dans une minute, tu passes à l’oral devant le jury. Quelle émotion est la plus probable ?","opts":hypoOpts("peur"),"ex":"Le même cœur rapide, mais un moment important arrive : c’est la peur.","hint":"Un moment important arrive."},
        {"text":"Tu sursautes. Un collègue fait tomber un plateau juste derrière toi. Personne n’est blessé.","audio":"Tu sursautes. Un collègue fait tomber un plateau juste derrière toi. Personne n’est blessé. Quelle émotion est la plus probable ?","opts":hypoOpts("surprise"),"ex":"Rien de dangereux, seulement de l’inattendu : c’est surtout la surprise.","hint":"Y a-t-il un vrai danger ?"},
        {"text":"Ta mâchoire se serre. Quelqu’un a encore pris tes outils sans demander.","audio":"Ta mâchoire se serre. Quelqu’un a encore pris tes outils sans demander. Quelle émotion est la plus probable ?","opts":hypoOpts("colere"),"ex":"Une limite est franchie, encore une fois : c’est la colère.","hint":"Quelqu’un a-t-il respecté tes affaires ?"},
        {"text":"Ta gorge se serre. Ton meilleur ami part vivre dans une autre ville.","audio":"Ta gorge se serre. Ton meilleur ami part vivre dans une autre ville. Quelle émotion est la plus probable ?","opts":hypoOpts("tristesse"),"ex":"Tu vas perdre un lien qui compte : c’est la tristesse.","hint":"Tu gagnes ou tu perds quelque chose ?"},
        {"text":"Ton estomac se soulève. Tu ouvres une poubelle restée au soleil.","audio":"Ton estomac se soulève. Tu ouvres une poubelle restée au soleil. Quelle émotion est la plus probable ?","opts":hypoOpts("degout"),"ex":"L’odeur repousse ton corps pour te protéger : c’est le dégoût.","hint":"Ton corps veut s’approcher ou s’éloigner ?"}
      ]
    },
    {
      "temps":"situation","type":"imagepick","tag":"Comparer les signaux",
      "instr":"Lis la phrase. Touche l’image où le corps montre ce signal.",
      "items":[
        {"text":"Mes mains se serrent : quelque chose me paraît injuste.","audio":"Mes mains se serrent : quelque chose me paraît injuste.",
         "options":CHOIX("colere",["joie","surprise","tristesse"],"Oui : poings serrés et injustice, c’est la colère.")},
        {"text":"Je ne suis pas sûre de réussir et mon ventre se noue.","audio":"Je ne suis pas sûre de réussir et mon ventre se noue.",
         "options":CHOIX("peur",["degout","colere","joie"],"Oui : ventre noué et épaules remontées, c’est la peur.")},
        {"text":"Une bonne nouvelle arrive : je sens une chaleur dans la poitrine.","audio":"Une bonne nouvelle arrive : je sens une chaleur dans la poitrine.",
         "options":CHOIX("joie",["peur","tristesse","degout"],"Oui : main sur la poitrine et sourire, c’est la joie.")},
        {"text":"Une odeur horrible : mon estomac se soulève et je recule.","audio":"Une odeur horrible : mon estomac se soulève et je recule.",
         "options":CHOIX("degout",["peur","surprise","tristesse"],"Oui : main sur l’estomac, nez plissé, tête qui recule, c’est le dégoût.")}
      ]
    },
    {
      "temps":"situation","type":"lesson","title":"Et toi ?",
      "audio":"Pense à une émotion forte que tu as ressentie cette semaine. Où l’as-tu sentie dans ton corps ? Que se passait-il à ce moment-là ? Réponds dans ta tête ou à voix basse.",
      "blocks":[
        {"ic":"","html":"Pense à une <strong>émotion forte</strong> que tu as ressentie cette semaine."},
        {"ic":"","html":"<strong>Où</strong> l’as-tu sentie dans ton corps ? Ventre, gorge, poings, poitrine, tout le corps ?"},
        {"ic":"","html":"<strong>Que se passait-il</strong> à ce moment-là ?"},
        {"ic":"","html":"Réponds dans ta tête ou à voix basse. Il n’y a pas de mauvaise réponse."}
      ],
      "cta":"Je fais le point"
    },
    {
      "temps":"point","type":"wrap",
      "keep":[
        {"ic":"","html":"Une émotion donne des <strong>signaux corporels</strong> : ventre, gorge, cœur, mains, visage, posture."},
        {"ic":"","html":"Un signal ne suffit pas toujours : on vérifie avec le <strong>contexte</strong>."},
        {"ic":"","html":"Le même signal peut avoir plusieurs sens : le cœur rapide peut être <strong>peur</strong>, <strong>joie</strong> ou <strong>surprise</strong>."},
        {"ic":"","html":"Phrase utile : <strong>je sens...</strong> dans mon corps, donc je me demande si je ressens..."}
      ],
      "self":["Je sais repérer un signal dans mon corps","Je comprends qu’un même signal peut avoir plusieurs sens","Je peux relier corps + contexte pour nommer une émotion"]
    }
  ]
});
</script>
