<body>
<div id="pse-retour" style="background:#16385c;color:#fff;font-family:Arial,sans-serif;font-size:13px;padding:7px 14px;line-height:1.4"><a href="index.html" style="color:#ffd166;text-decoration:none;font-weight:700">Accueil PSE</a> <span style="opacity:.6">›</span> CPS CAP — Mes émotions</div>

<div id="cps-app"></div>
<script src="assets/cps_kit.js?v=20261106"></script>
<script>
var IMG = "assets/emotions/e1-2/";
var I = function(name){ return IMG + name; };
var SC = "assets/cps/scenes/";
/* Les 6 scènes : le texte alternatif décrit la scène, sans nommer l'émotion. */
var SCENES = {
  "joie":{"img":SC+"scene-malik-joie-panier.jpg","alt":"À l’atelier, Malik montre le panier en osier qu’il vient de finir. Derrière lui, Mme Roche lève le pouce.","text":"Malik vient de finir son premier panier en osier. Mme Roche lève le pouce."},
  "colere":{"img":SC+"scene-lina-colere-cuisine.jpg","alt":"En cuisine, Lina est penchée sur le plan de travail, devant son assiette renversée. Noa s’éloigne de dos.","text":"La préparation de Lina est renversée. Noa, qui l’a fait tomber, s’éloigne sans rien dire."},
  "peur":{"img":SC+"scene-ines-peur-oral.jpg","alt":"Inès est debout devant la classe, une feuille serrée dans les mains. Les camarades la regardent.","text":"Inès doit présenter son travail devant toute la classe. C’est son tour."},
  "tristesse":{"img":SC+"scene-noa-tristesse-pause.jpg","alt":"Dans la cour, Noa est assis seul sur un banc, tête basse. Au fond, un groupe discute ensemble.","text":"À la pause, Noa est seul sur un banc. Les autres rient ensemble, sans lui."},
  "surprise":{"img":SC+"scene-malik-surprise-fete.jpg","alt":"Malik ouvre la porte de l’atelier. Lina, Inès et Noa l’attendent avec un gâteau et des ballons.","text":"Malik ouvre la porte de l’atelier. Ses amis l’attendent avec un gâteau. Il ne savait rien."},
  "degout":{"img":SC+"scene-lina-degout-frigo.jpg","alt":"En chambre froide, Lina tient à bout de bras une boîte d’aliment couverte de moisissure.","text":"En chambre froide, Lina ouvre une boîte oubliée. L’aliment est couvert de moisissure."}
};
var OPTS = function(bonne){
  return [
    {"l":"Joie","ok":bonne==="joie"},
    {"l":"Tristesse","ok":bonne==="tristesse"},
    {"l":"Colère","ok":bonne==="colere"},
    {"l":"Peur","ok":bonne==="peur"},
    {"l":"Surprise","ok":bonne==="surprise"},
    {"l":"Dégoût","ok":bonne==="degout"}
  ];
};
var VALENCE = function(bonne){
  return [
    {"l":"Plutôt agréable","ok":bonne==="agreable"},
    {"l":"Plutôt désagréable","ok":bonne==="desagreable"},
    {"l":"À vérifier","ok":bonne==="verifier"}
  ];
};
/* Une scène pour le quiz : le contexte est écrit ET lu */
var QUIZ = function(k, ex, hint){
  var c = SCENES[k];
  return {"img":c.img,"alt":c.alt,"text":c.text,"audio":c.text+" Quelle émotion est la plus probable ?","opts":OPTS(k),"ex":ex,"hint":hint};
};
/* Quatre scènes à comparer : la première est la bonne */
var CHOIX = function(bonne, autres, ex){
  return [bonne].concat(autres).map(function(k, i){
    var c = SCENES[k];
    return i===0 ? {"img":c.img,"alt":c.alt,"ok":true,"ex":ex} : {"img":c.img,"alt":c.alt};
  });
};
CPS.init({
  "theme":"emo",
  "code":"E1.2",
  "ref":"Identifier ses émotions",
  "icon":"",
  "title":"Quelle émotion dans la situation ?",
  "subtitle":"Observe la scène, puis formule une hypothèse.",
  "parcours":[
    {
      "temps":"decouvre","type":"lesson","title":"Une situation, des indices",
      "audio":"Une situation arrive : c’est le déclencheur. Elle peut réveiller une émotion. Pour la trouver, on regarde ce qui vient de se passer, puis le visage et le corps. On se demande aussi ce qui compte pour la personne.",
      "blocks":[
        {"img":SCENES.colere.img,"alt":SCENES.colere.alt,"html":"Pour comprendre une scène : <strong>ce qui s’est passé + visage + corps</strong>."},
        {"ic":"","html":"<strong>Situation</strong> : que vient-il de se passer ? C’est le déclencheur."},
        {"ic":"","html":"<strong>Indices</strong> : visage, mains, épaules, posture, distance avec les autres."},
        {"ic":"","html":"<strong>Ce qui compte</strong> pour la personne : respect, sécurité, réussite, lien avec les autres."},
        {"ic":"","html":"Une image ne donne pas toute l’histoire. On choisit l’émotion <strong>la plus probable</strong> et on explique avec des indices."}
      ],
      "cta":"Je m’entraîne"
    },
    {
      "temps":"entraine","type":"cardpick","variant":"quiz","tag":"Quelle émotion ?",
      "instr":"Lis la situation et regarde la scène. Choisis l’émotion la plus probable.",
      "demo":QUIZ("joie","Son travail est réussi et reconnu. Grand sourire, panier montré fièrement : c’est la joie.",""),
      "items":[
        QUIZ("colere","Son travail est gâché par un autre. Sourcils froncés, poings sur la table : c’est la colère.","Regarde les mains de Lina."),
        QUIZ("peur","Un moment important arrive devant tout le groupe. Visage crispé, feuille serrée : c’est la peur.","Regarde comment Inès tient sa feuille."),
        QUIZ("tristesse","Noa est mis à l’écart. Tête basse, épaules tombantes : c’est la tristesse.","Regarde la distance entre Noa et le groupe."),
        QUIZ("surprise","Quelque chose d’inattendu arrive. Yeux ronds, bouche ouverte : au premier instant, c’est la surprise.","Malik savait-il qu’il y aurait une fête ?"),
        QUIZ("degout","L’aliment est abîmé. Nez plissé, bras tendu pour éloigner la boîte : c’est le dégoût.","Regarde le bras qui éloigne la boîte."),
        {"text":"En stage, le chef annonce à Inès qu’elle servira seule en salle ce midi. C’est la première fois. Ses mains deviennent moites.","audio":"En stage, le chef annonce à Inès qu’elle servira seule en salle ce midi. C’est la première fois. Ses mains deviennent moites. Quelle émotion est la plus probable ?","opts":OPTS("peur"),"ex":"Un moment nouveau et important arrive. Les mains moites signalent la peur.","hint":"Relis ce qui arrive à ses mains."}
      ]
    },
    {
      "temps":"entraine","type":"imagepick","tag":"Trouver la scène",
      "instr":"Lis la consigne. Touche la scène qui correspond.",
      "items":[
        {"text":"Trouve la scène où la personne a surtout peur.","audio":"Trouve la scène où la personne a surtout peur.",
         "options":CHOIX("peur",["surprise","colere","tristesse"],"Oui : Inès va parler devant tout le groupe. Son visage est crispé."),
         "bad":"Pas celle-ci. Cherche un moment important qui arrive et un visage crispé."},
        {"text":"Trouve la scène où quelque chose repousse la personne.","audio":"Trouve la scène où quelque chose repousse la personne.",
         "options":CHOIX("degout",["peur","joie","colere"],"Oui : Lina éloigne la boîte moisie. Le dégoût protège le corps."),
         "bad":"Pas celle-ci. Cherche une personne qui éloigne quelque chose de sale."},
        {"text":"Trouve la scène où la personne est surtout triste.","audio":"Trouve la scène où la personne est surtout triste.",
         "options":CHOIX("tristesse",["colere","surprise","degout"],"Oui : Noa est seul, tête basse, loin du groupe."),
         "bad":"Pas celle-ci. Cherche une personne seule, tête basse, à l’écart."},
        {"text":"Trouve la scène où quelque chose d’inattendu arrive.","audio":"Trouve la scène où quelque chose d’inattendu arrive.",
         "options":CHOIX("surprise",["joie","peur","tristesse"],"Oui : Malik découvre une fête qu’il n’attendait pas. Yeux ronds, bouche ouverte."),
         "bad":"Pas celle-ci. Cherche une personne qui découvre quelque chose sans s’y attendre."}
      ]
    },
    {
      "temps":"situation","type":"cardpick","variant":"quiz","tag":"Agréable ou désagréable ?",
      "instr":"Lis la situation. Choisis : plutôt agréable, plutôt désagréable, ou à vérifier.",
      "items":[
        {"img":SCENES.joie.img,"alt":SCENES.joie.alt,"text":SCENES.joie.text,"audio":SCENES.joie.text+" Pour Malik, est-ce plutôt agréable, plutôt désagréable, ou à vérifier ?","opts":VALENCE("agreable"),"ex":"Son travail est réussi et reconnu : c’est plutôt agréable."},
        {"img":SCENES.colere.img,"alt":SCENES.colere.alt,"text":SCENES.colere.text,"audio":SCENES.colere.text+" Pour Lina, est-ce plutôt agréable, plutôt désagréable, ou à vérifier ?","opts":VALENCE("desagreable"),"ex":"Son travail est gâché et personne ne s’excuse : c’est plutôt désagréable."},
        {"img":I("nuance-surprise-pas-peur.jpg"),"alt":"En classe, un élève assis lève les yeux vers une feuille tendue par la formatrice","text":"La formatrice annonce : « Demain, l’emploi du temps change. » Elle n’a pas encore dit comment.","audio":"La formatrice annonce : demain, l’emploi du temps change. Elle n’a pas encore dit comment. Est-ce plutôt agréable, plutôt désagréable, ou à vérifier ?","opts":VALENCE("verifier"),"ex":"On ne sait pas encore ce qui change. La surprise peut devenir agréable ou désagréable : il faut vérifier."},
        {"img":SCENES.degout.img,"alt":SCENES.degout.alt,"text":SCENES.degout.text,"audio":SCENES.degout.text+" Pour Lina, est-ce plutôt agréable, plutôt désagréable, ou à vérifier ?","opts":VALENCE("desagreable"),"ex":"Un aliment abîmé repousse le corps : c’est plutôt désagréable."},
        {"img":"assets/cps/emotions/carte-ines-joie.jpg","alt":"Inès, grand sourire, les deux mains ouvertes vers le haut","text":"Inès apprend qu’elle a obtenu son stage dans le restaurant qu’elle voulait.","audio":"Inès apprend qu’elle a obtenu son stage dans le restaurant qu’elle voulait. Est-ce plutôt agréable, plutôt désagréable, ou à vérifier ?","opts":VALENCE("agreable"),"ex":"Ce qu’elle espérait arrive : c’est plutôt agréable."},
        {"img":SCENES.tristesse.img,"alt":SCENES.tristesse.alt,"text":SCENES.tristesse.text,"audio":SCENES.tristesse.text+" Pour Noa, est-ce plutôt agréable, plutôt désagréable, ou à vérifier ?","opts":VALENCE("desagreable"),"ex":"Noa est mis à l’écart : c’est plutôt désagréable."}
      ]
    },
    {
      "temps":"situation","type":"match","title":"Relie la scène à l’indice principal",
      "instr":"Touche une scène à gauche, puis l’indice qui aide le plus à comprendre.",
      "audio":"Relie chaque scène à l’indice principal qui aide à comprendre l’émotion.",
      "pairs":[
        {"img":SCENES.peur.img,"alt":SCENES.peur.alt,"r":"Un moment important + visage crispé","ex":"Passer devant le groupe peut déclencher la peur."},
        {"img":SCENES.tristesse.img,"alt":SCENES.tristesse.alt,"r":"Seul, à l’écart du groupe","ex":"Être mis à l’écart aide à comprendre la tristesse."},
        {"img":SCENES.degout.img,"alt":SCENES.degout.alt,"r":"Aliment abîmé qu’on éloigne","ex":"Le dégoût protège de ce qui est sale ou abîmé."},
        {"img":SCENES.surprise.img,"alt":SCENES.surprise.alt,"r":"Événement inattendu","ex":"La surprise commence par quelque chose d’imprévu."},
        {"img":SCENES.colere.img,"alt":SCENES.colere.alt,"r":"Travail gâché par un autre","ex":"Une limite franchie peut déclencher la colère."},
        {"img":SCENES.joie.img,"alt":SCENES.joie.alt,"r":"Travail réussi et reconnu","ex":"Une réussite reconnue déclenche la joie."}
      ]
    },
    {
      "temps":"situation","type":"order","title":"Mission enquête : Lina en cuisine",
      "instr":"La préparation de Lina est renversée. Remets les étapes dans l’ordre pour comprendre son émotion.",
      "audio":"La préparation de Lina est renversée. Remets les étapes dans l’ordre pour comprendre son émotion, sans conclure trop vite.",
      "steps":[
        "Le déclencheur : sa préparation est renversée",
        "Ce qu'elle ressent : poings serrés, colère",
        "Le besoin touché : être respectée",
        "Ce qu'elle fait : en parler calmement à Mme Roche"
      ],
      "stepImages":[
        SCENES.colere.img,
        "assets/cps/emotions/carte-lina-colere.jpg",
        "",
        "assets/cps/regulation/regul-parler-confiance.jpg"
      ],
      "stepAlts":[
        "En cuisine, Lina devant son assiette renversée, Noa s’éloigne",
        "Lina, sourcils froncés, poings serrés le long du corps",
        "",
        "Lina parle à Mme Roche, assises face à face, Mme Roche écoute"
      ]
    },
    {
      "temps":"point","type":"wrap",
      "keep":[
        {"ic":"","html":"Une <strong>situation</strong> peut déclencher une émotion."},
        {"ic":"","html":"Pour identifier l’émotion, on observe <strong>visage, corps, gestes et contexte</strong>."},
        {"ic":"","html":"La question du <strong>besoin</strong> aide : respect, sécurité, lien, réussite, hygiène, calme."},
        {"ic":"","html":"On explique avec des indices : <strong>je pense que...</strong> parce que..."}
      ],
      "self":["Je trouve l’émotion probable dans une situation","Je repère le déclencheur ou le besoin en jeu","Je sais dire quand il faut vérifier avant de conclure"]
    }
  ]
});
</script>
