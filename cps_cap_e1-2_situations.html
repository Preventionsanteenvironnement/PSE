    {"l":"Tristesse","ok":bonne==="tristesse"},

    {"l":"Peur","ok":bonne==="peur"},
    {"l":"Surprise","ok":bonne==="surprise"},
    {"l":"Dégoût","ok":bonne==="degout"}
  ];
};
var VALENCE = function(bonne){
  return [
    {"l":"Plutôt agréable","ok":bonne==="agreable"},
    {"l":"Plutôt désagréable","ok":bonne==="desagreable"},
    {"l":"À vérifier","ok":bonne==="verifier"}
  ];
};
/* Une scène pour le quiz : le contexte est écrit ET lu */
var QUIZ = function(k, ex, hint){
  var c = SCENES[k];
  return {"img":c.img,"alt":c.alt,"text":c.text,"audio":c.text+" Quelle émotion est la plus probable ?","opts":OPTS(k),"ex":ex,"hint":hint};
};
/* Quatre scènes à comparer : la première est la bonne */
var CHOIX = function(bonne, autres, ex){
  return [bonne].concat(autres).map(function(k, i){
    var c = SCENES[k];
    return i===0 ? {"img":c.img,"alt":c.alt,"ok":true,"ex":ex} : {"img":c.img,"alt":c.alt};
  });
};
