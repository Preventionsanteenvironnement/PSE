<script>window.COURS = {"slug":"risques_cpp_12","classe":"CAP et Bac Pro","retour":"../chute-plain-pied.html","retourLibelle":"Retour à l'espace Chutes de plain-pied","validation":"chute-plain-pied/12","pied":"Risques professionnels — chutes de plain-pied. M. MECHERI. Contenu reformulé d'après l'INRS (ED 840, 2023 ; ED 6433, 2021). Images réalisées pour le cours.","version":"1","sansNiveaux":true,"entete":{"module_code":"Chutes de plain-pied","titre":"12. La bonne mesure","niveau":"CAP · Bac Pro","annee":"2026-27","thematique":"Risques professionnels — activité 12 sur 15","objectif_general":"Choisir la mesure de prévention la plus efficace."},"blocks":[{"id":"s1","type":"seance","data":{"numero":"1","titre":"Prévenir","objectif":"Choisir la mesure de prévention prioritaire."}},{"id":"pv1","type":"qcm","el":{"standard":{"indice":"Mesure prioritaire : celle qui supprime le danger ou le traite à la source.","explication":"La fixation ou le remplacement fait disparaître le pli qui fait trébucher. L'affiche et le rappel laissent le coin relevé en place. Sans câble dans le passage, plus rien pour accrocher le pied. Le panneau et la consigne comptent seulement sur l'attention des salariés. Le sol sec ne fait plus glisser : le danger disparaît. Les chaussures limitent la glissade mais l'eau reste au sol ; la consigne porte seulement sur le comportement."}},"data":{"numero":"1","consigne":"**Choisir** la mesure de prévention prioritaire.","items":[{"question":"Tapis d'entrée avec un coin relevé devant une porte : mesure à mettre en place en priorité ?","options":["Affiche « Attention au tapis » près de la porte","Fixation du tapis au sol, ou remplacement du tapis","Rappel aux visiteurs : regard sur le sol pendant la marche"],"reponse":1},{"question":"Câble électrique au sol en travers d'un passage de bureau : mesure à mettre en place en priorité ?","options":["Suppression du câble dans le passage : appareil sur batterie ou prise plus proche du poste","Panneau d'avertissement posé près du câble","Consigne : enjambement prudent du câble"],"reponse":0},{"question":"Flaque d'eau laissée au sol après le nettoyage d'un local : mesure à mettre en place en priorité ?","options":["Port de chaussures antidérapantes","Consigne : entrée lente dans le local","Raclage et séchage du sol juste après le nettoyage"],"reponse":2}]}},{"id":"pv2","type":"qcm","el":{"standard":{"indice":"Mesure prioritaire : celle qui supprime le danger ou le traite à la source.","explication":"La réparation arrête l'huile à sa source et le nettoyage retire la flaque. Les chaussures et la consigne laissent l'huile au sol. Un sol réparé ne peut plus faire tomber. Le balisage sert seulement en attendant la réparation ; la consigne porte seulement sur le comportement. L'allée dégagée ne présente plus d'obstacle. L'information et la consigne laissent le carton dans le passage."}},"data":{"numero":"2","consigne":"**Choisir** la mesure de prévention prioritaire.","items":[{"question":"Flaque d'huile au pied d'une machine : mesure à mettre en place en priorité ?","options":["Consigne : contournement de la flaque","Port de chaussures résistantes aux produits gras","Réparation de la fuite et nettoyage immédiat de l'huile"],"reponse":2},{"question":"Trou dans le sol en béton d'une zone d'expédition : mesure à mettre en place en priorité ?","options":["Balisage de la zone autour du trou","Rebouchage du trou et réfection du revêtement du sol","Consigne : regard sur le sol pendant la conduite du transpalette"],"reponse":1},{"question":"Carton posé au sol dans une allée de circulation d'entrepôt : mesure à mettre en place en priorité ?","options":["Information du stagiaire sur la présence du carton","Consigne : enjambement des objets posés au sol","Rangement du carton dans une zone de stockage, hors de l'allée"],"reponse":2}]}},{"id":"pv3","type":"qcm","el":{"standard":{"indice":"Mesure prioritaire : celle qui supprime le danger ou le traite à la source.","explication":"Sans carton au sol, plus d'obstacle à heurter. La marche lente et les chaussures laissent le carton dans l'allée. Des passages séparés évitent que les deux salariés se croisent. L'affiche porte seulement sur l'attention ; les chaussures n'empêchent pas le choc. Sans barre au sol, plus d'obstacle contre lequel buter. Les lampes torches et la consigne laissent la barre en place ; un bon éclairage de l'allée vient en complément."}},"data":{"numero":"3","consigne":"**Choisir** la mesure de prévention prioritaire.","items":[{"question":"Carton au sol dans une allée, salarié chargé de cartons qui cachent sa vue : mesure à mettre en place en priorité ?","options":["Retrait du carton de l'allée et rangement en zone de stockage","Consigne : marche lente avec une charge","Port de chaussures de sécurité"],"reponse":0},{"question":"Salarié qui regarde un écran et collègue chargé d'un carton dans la même allée : mesure à mettre en place en priorité ?","options":["Affiche de rappel sur la vigilance dans l'allée","Organisation de la circulation : plan de circulation et passages bien séparés","Port de chaussures de sécurité"],"reponse":1},{"question":"Barre métallique posée au sol dans une allée d'entrepôt sombre : mesure à mettre en place en priorité ?","options":["Retrait de la barre de l'allée et rangement à sa place","Distribution de lampes torches aux salariés","Consigne : marche lente dans l'allée"],"reponse":0}]}}],"bilan":{}};</script>
