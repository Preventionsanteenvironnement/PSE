"**Choisir** la mesure de prévention la plus adaptée parmi les propositions.","items":[{"question":"Trou dans le sol en béton d'une zone d'expédition : mesure à mettre en place en priorité ?","options":["Balisage de la zone autour du trou","Rebouchage du trou et réfection du revêtement du sol","Consigne : regard sur le sol pendant la conduite du transpalette"],"reponse":1}]},"el":{"standard":{"indice":"Appuie-toi sur les éléments explicitement décrits ou visibles.","explication":"Réparer le revêtement traite le trou. Isoler ou baliser la zone en attendant selon les consignes ; un sol réparé ne signifie pas que tous les risques du poste ont disparu. Distinguer la mise en sécurité immédiate, la solution durable et la vérification de son efficacité."}}},{"id":"mesure6","type":"qcm","data":{"numero":"6","consigne":"**Choisir** la mesure de prévention la plus adaptée parmi les propositions.","items":[{"question":"Carton posé au sol dans une allée de circulation d'entrepôt : mesure à mettre en place en priorité ?","options":["Information du nouveau salarié sur la présence du carton","Consigne : enjambement des objets posés au sol","Rangement du carton dans une zone de stockage, hors de l'allée"],"reponse":2}]},"el":{"standard":{"indice":"Appuie-toi sur les éléments explicitement décrits ou visibles.","explication":"Ranger le carton hors du passage retire l’obstacle. Prévoir un stockage adapté et vérifier que l’allée reste libre. Distinguer la mise en sécurité immédiate, la solution durable et la vérification de son efficacité."}}},{"id":"mesure7","type":"qcm","data":{"numero":"7","consigne":"**Choisir** la mesure de prévention la plus adaptée parmi les propositions.","items":[{"question":"Carton au sol dans une allée, salarié chargé de cartons qui cachent sa vue : mesure à mettre en place en priorité ?","options":["Retrait du carton de l'allée et rangement en zone de stockage","Consigne : marche lente avec une charge","Port de chaussures de sécurité"],"reponse":0}]},"el":{"standard":{"indice":"Appuie-toi sur les éléments explicitement décrits ou visibles.","explication":"Retirer le carton de l’allée traite cet obstacle ; revoir aussi le transport des charges qui cachent la vue. Distinguer la mise en sécurité immédiate, la solution durable et la vérification de son efficacité."}}},{"id":"mesure8","type":"qcm","data":{"numero":"8","consigne":"**Choisir** la mesure de prévention la plus adaptée parmi les propositions.","items":[{"question":"Salarié qui regarde un écran et collègue chargé d'un carton dans la même allée : mesure à mettre en place en priorité ?","options":["Affiche de rappel sur la vigilance dans l'allée","Organisation de la circulation : plan de circulation et passages bien séparés","Port de chaussures de sécurité"],"reponse":1}]},"el":{"standard":{"indice":"Appuie-toi sur les éléments explicitement décrits ou visibles.","explication":"Organiser les circulations et les conditions de transport réduit les situations de rencontre dangereuses. Le plan doit être adapté au travail réel, pas seulement affiché. Distinguer la mise en sécurité immédiate, la solution durable et la vérification de son efficacité."}}},{"id":"mesure9","type":"qcm","data":{"numero":"9","consigne":"**Choisir** la mesure de prévention la plus adaptée parmi les propositions.","items":[{"question":"Barre métallique posée au sol dans une allée d'entrepôt sombre : mesure à mettre en place en priorité ?","options":["Retrait de la barre de l'allée et rangement à sa place","Distribution de lampes torches aux salariés","Consigne : marche lente dans l'allée"],"reponse":0}]},"el":{"standard":{"indice":"Appuie-toi sur les éléments explicitement décrits ou visibles.","explication":"Retirer la barre traite l’obstacle ; améliorer l’éclairage et son entretien complète la prévention. Les lampes torches individuelles ne remplacent pas à elles seules un éclairage adapté. Distinguer la mise en sécurité immédiate, la solution durable et la vérification de son efficacité."}}
