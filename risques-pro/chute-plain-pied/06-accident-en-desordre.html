euse. Le pied qui accroche le câble provoque la chute : événement déclencheur. La fracture du poignet, souvent due au réflexe de mettre la main en avant, est le dommage."}},"data":{"numero":"2","consigne":"**Remettre** dans l'ordre les phrases de l'accident : le câble électrique.","cartes":[{"texte":"Câble électrique au sol dans le passage."},{"texte":"La personne se dirige vers le câble en regardant un document."},{"texte":"Son pied accroche le câble : elle trébuche."},{"texte":"Fracture du poignet."}]}},{"id":"o3","type":"ordre","el":{"standard":{"indice":"Première phrase : le danger seul, sans personne. Deuxième : la personne qui s'approche. Troisième : la perte d'équilibre. Dernière : la blessure.","explication":"L'eau au sol rend le sol glissant : danger. La personne qui entre dans le local et marche vers l'eau est exposée : situation dangereuse. Le pied qui glisse fait perdre l'équilibre : événement déclencheur. Le lumbago, atteinte du bas du dos après la chute, est le dommage."}},"data":{"numero":"3","consigne":"**Remettre** dans l'ordre les phrases de l'accident : la flaque d'eau.","cartes":[{"texte":"Flaque d'eau au sol dans un local d'entretien."},{"texte":"La personne entre dans le local et se dirige vers la flaque d'eau."},{"texte":"Son pied glisse sur l'eau : elle perd l'équilibre."},{"texte":"Lumbago : douleur du bas du dos."}]}},{"id":"o4","type":"ordre","el":{"standard":{"indice":"Première phrase : le danger seul, sans personne. Deuxième : la personne qui s'approche. Troisième : la perte d'équilibre. Dernière : la blessure.","explication":"La flaque d'huile rend le sol glissant : danger. Le salarié qui se dirige vers la machine en marchant vite est exposé : situation dangereuse. Le pied qui glisse sur l'huile fait perdre l'équilibre : événement déclencheur. La contusion de la hanche, choc du corps sur le sol, est le dommage."}},"data":{"numero":"4","consigne":"**Remettre** dans l'ordre les phrases de l'accident : la fuite d'huile.","cartes":[{"texte":"Flaque d'huile au sol près d'une machine."},{"texte":"Le salarié se déplace rapidement vers la machine en regardant sa montre."},{"texte":"Son pied glisse sur l'huile : il perd l'équilibre."},{"texte":"Contusion de la hanche."}]}},{"id":"o5","type":"ordre","el":{"standard":{"indice":"Première phrase : le danger seul, sans personne. Deuxième : la personne qui s'approche. Troisième : la perte d'équilibre. Dernière : la blessure.","explication":"Le trou dans le béton peut faire tomber : danger. Le salarié qui manœuvre sa charge juste à côté est exposé : situation dangereuse. Le pied qui s'enfonce dans le trou provoque la perte d'équilibre : événement déclencheur. L'entorse de la cheville, articulation tordue, est le dommage."}},"data":{"numero":"5","consigne":"**Remettre** dans l'ordre les phrases de l'accident : le trou dans le sol.","cartes":[{"texte":"Trou dans le sol en béton abîmé."},{"texte":"Le salarié manœuvre un transpalette chargé à côté du trou."},{"texte":"Son pied s'enfonce dans le trou : il perd l'équilibre."},{"texte":"Entorse de la cheville."}]}},{"id":"o6","type":"ordre","el":{"standard":{"indice":"Première phrase : le danger seul, sans personne. Deuxième : la personne qui s'approche. Troisième : la perte d'équilibre. Dernière : la blessure.","explication":"Le carton dans l'allée peut faire trébucher : danger. Le stagiaire qui se dirige vers lui est exposé : situation dangereuse. Le pied qui heurte le carton provoque la chute : événement déclencheur. La contusion du genou, choc sur le sol, est le dommage."}},"data":{"numero":"6","consigne":"**Remettre** dans l'ordre les phrases de l'accident : le carton dans l'allée.","cartes":[{"texte":"Carton posé dans une allée de circulation."},{"texte":"Le stagiaire se dirige vers le carton."},{"texte":"Son pied heurte le carton : il trébuche."},{"texte":"Contusion du genou."}]}},{"id":"o7","type":"ordre","el":{"standard":{"indice":"Première phrase : le danger seul, sans personne. Deuxième : la personne qui s'approche. Troisième : la perte d'équilibre. Dernière : la blessure.","explication":"Le carton au milieu de l'allée peut faire trébucher : danger. Le salarié qui avance vers lui avec une charge devant les yeux est exposé : situation dangereuse. Le pied qui heurte le carton fait perdre l'équilibre : événement déclencheur. La contusion du genou est le dommage."}},"data":{"numero":"7","consigne":"**Remettre** dans l'ordre les phrases de l'accident : les cartons qui cachent la vue.","cartes":[{"texte":"Carton posé au sol au milieu d'une allée de stockage."},{"texte":"Le salarié porte deux cartons qui cachent sa vue et avance vers le carton au sol."},{"texte":"Son pied heurte le carton au sol : il trébuche."},{"texte":"Contusion du genou."}]}},{"id":"o8","type":"ordre","el":{"standard":{"indice":"Première phrase : le danger seul, sans personne. Deuxième : la personne qui s'approche. Troisième : la perte d'équilibre. Dernière : la blessure.","explication":"Le collègue qui arrive avec un carton est un obstacle mobile : danger. Le salarié qui marche vers lui sans regarder devant lui est exposé : situation dangereuse. Le choc entre les deux fait perdre l'équilibre : événement déclencheur. La contusion de l'épaule est le dommage."}},"data":{"numero":"8","consigne":"**Remettre** dans l'ordre les phrases de l'accident : l'écran en marchant.","cartes":[{"texte":"Collègue chargé d'un carton dans la même allée."},{"texte":"Le salarié avance en regardant un écran ; un collègue arrive avec un carton."},{"texte":"Il heurte le collègue qui porte le carton : il perd l'équilibre."},{"texte":"Contusion de l'épaule."}]}},{"id":"o9","type":"ordre","el":{"standard":{"indice":"Première phrase : le danger seul, sans personne. Deuxième : la personne qui s'approche. Troisième : la perte d'équilibre. Dernière : la blessure.","explication":"La barre posée au sol, cachée par l'obscurité, peut faire trébucher : danger. Le salarié qui marche dans l'allée sombre est exposé : situation dangereuse. Le pied qui bute contre la barre provoque la chute : événement déclencheur. L'entorse de la cheville est le dommage."}},"data":{"numero":"9","consigne":"**Remettre** dans l'ordre les phrases de l'accident : l'allée mal éclairée.","cartes":[{"texte":"Barre métallique posée au sol dans une allée peu éclairée."},{"texte":"Le salarié avance dans une allée peu éclairée."},{"texte":"Son pied bute contre la barre : il trébuche."},{"texte":"Entorse de la cheville."}]}}],"bilan":{}};</script>
