re la plus efficace : celle qui supprime le danger à sa source.","explication":"Chaussures antidérapantes : faux, elles limitent la glissade mais l'eau reste au sol. Stockage provisoire : faux, aucun stockage, même provisoire, dans les allées de circulation. Consigne de prudence : faux, elle compte seulement sur l'attention des salariés ; la suppression du danger agit sur la cause."}},"data":{"numero":"2","consigne":"**Indiquer** si chaque affirmation est vraie ou fausse.","items":[{"texte":"Des chaussures antidérapantes suppriment le danger d'un sol mouillé.","answer":"faux"},{"texte":"Le rebouchage d'un trou dans le sol supprime le danger.","answer":"vrai"},{"texte":"Un stockage provisoire dans une allée de circulation reste sans risque.","answer":"faux"},{"texte":"Les chutes de plain-pied sont la deuxième cause d'accident du travail.","answer":"vrai"},{"texte":"Un câble qui traverse un passage peut être protégé dans une goulotte fixée et signalée.","answer":"vrai"},{"texte":"Une consigne de prudence est plus efficace que la suppression du danger.","answer":"faux"}]}}],"bilan":{}};</script>
