r."},{"recto":"Une barre métallique est posée en travers d'une allée d'entrepôt.","verso":"Danger : la barre peut faire trébucher ; personne n'est encore exposé."},{"recto":"Un salarié qui regarde son téléphone heurte un collègue chargé d'un carton.","verso":"Événement déclencheur : le choc entre les deux salariés provoque la perte d'équilibre."},{"recto":"Contusion du genou après un choc contre un carton.","verso":"Dommage : la contusion est une atteinte à la santé."}]}},{"id":"s3","type":"seance","data":{"numero":"3","titre":"Prévenir les chutes","objectif":""}},{"id":"fc3","type":"flashcards","data":{"titre":"Prévenir les chutes","cartes":[{"recto":"Tapis mal fixé avec un coin relevé","verso":"Fixation du tapis au sol, ou remplacement s'il reste bombé ou recourbé."},{"recto":"Câble électrique en travers d'un passage","verso":"Suppression du câble dans le passage : appareil sur batterie ou prise plus proche du poste. À défaut : câble dans une goulotte fixée et signalée."},{"recto":"Sol mouillé après le nettoyage","verso":"Raclage et séchage du sol juste après le nettoyage ; panneau posé tant que le sol reste humide."},{"recto":"Flaque d'huile près d'une machine","verso":"Réparation de la fuite et nettoyage immédiat de l'huile ; produit absorbant disponible près de la machine."},{"recto":"Trou dans le sol en béton","verso":"Rebouchage du trou et réfection du revêtement ; balisage de la zone en attendant la réparation."},{"recto":"Carton posé dans une allée de circulation","verso":"Rangement du carton en zone de stockage : aucun stockage, même provisoire, dans les allées."},{"recto":"Charge portée à la main qui cache la vue","verso":"Transport des colis avec un chariot plutôt qu'à la main."},{"recto":"Salariés chargés qui se croisent dans une allée","verso":"Plan de circulation et allées assez larges : au moins 1,5 m pour une circulation piétonne dans les deux sens."},{"recto":"Barre métallique au sol dans une allée sombre","verso":"Retrait de la barre et rangement
