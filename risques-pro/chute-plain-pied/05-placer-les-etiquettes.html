euse"},{"id":"ph2","img":"../images/chute-plain-pied/evenement-declencheur-evenement_declencheur_tapis_releve_pied_accroche_tapis.jpg","description":"Photo dans le hall, devant la porte vitrée. L'homme en costume a la pointe du pied prise sous le bord relevé du tapis. Il bascule en avant, une jambe tendue derrière lui, les bras écartés pour se rattraper, le regard tourné vers le sol.","label":"Événement déclencheur"},{"id":"ph3","img":"../images/chute-plain-pied/dommage-dommage_tapis_releve_entorse_cheville.jpg","description":"Photo dans le hall. L'homme en costume est assis sur le carrelage, près du tapis et de la porte vitrée. Il grimace de douleur et tient sa cheville à deux mains. À droite, un cercle montre un schéma des os du pied et de la jambe : la cheville est colorée en rouge.","label":"Dommage"}],"pieces":[{"id":"x0","texte":"Tapis mal fixé avec un coin relevé.","cible":"ph0"},{"id":"x1","texte":"La personne se dirige vers le tapis relevé en regardant son téléphone.","cible":"ph1"},{"id":"x2","texte":"Son pied accroche le tapis : elle trébuche.","cible":"ph2"},{"id":"x3","texte":"Entorse de la cheville.","cible":"ph3"}]}},{"id":"t2","type":"glisser","el":{"standard":{"indice":"Photo 1 : le danger seul. Photo 2 : la personne arrive. Photo 3 : la chute. Photo 4 : la blessure.","explication":"Phrases de l'accident dans l'ordre : Câble électrique au sol dans le passage. → La personne se dirige vers le câble en regardant un document. → Son pied accroche le câble : elle trébuche. → Fracture du poignet."}},"data":{"numero":"2","consigne":"**Placer** chaque étiquette sous sa photo : le câble électrique.","cibles":[{"id":"ph0","img":null,"description":"Câble électrique au sol dans le passage.","label":"Danger"},{"id":"ph1","img":"../images/chute-plain-pied/situation-dangereuse-situation_dangereuse_cable_electrique.jpg","description":"Photo dans un bureau. Une femme en veste bleue et pantalon bleu marine marche en regardant le téléphone qu'elle tient à deux mains. Un câble électrique noir part d'une prise murale, à droite, et traverse tout le sol du passage, juste devant elle. À l'arrière-plan, un homme travaille assis devant deux écrans d'ordinateur. À gauche, une étagère de classeurs bleus et des plantes vertes.","label":"Situation dangereuse"},{"id":"ph2","img":"../images/chute-plain-pied/evenement-declencheur-evenement_declencheur_cable_electrique_pied_accroche_cable.jpg","description":"Photo dans le bureau. La femme en veste bleue serre une tablette ou un dossier contre elle. Son pied est pris dans le câble noir posé au sol. Elle bascule en avant, le bras tendu pour se rattraper, le visage surpris. Au fond, un collègue continue de travailler à son bureau.","label":"Événement déclencheur"},{"id":"ph3","img":"../images/chute-plain-pied/dommage-dommage_cable_electrique_fracture_poignet.jpg","description":"Photo dans le bureau. La femme est assise au sol, jambes pliées, à côté du câble noir. Elle grimace de douleur et tient un poignet avec l'autre main. À droite, un cercle montre un schéma des os de la main : le poignet est coloré en rouge.","label":"Dommage"}],"pieces":[{"id":"x0","texte":"Câble électrique au sol dans le passage.","cible":"ph0"},{"id":"x1","texte":"La personne se dirige vers le câble en regardant un document.","cible":"ph1"},{"id":"x2","texte":"Son pied accroche le câble : elle trébuche.","cible":"ph2"},{"id":"x3","texte":"Fracture du poignet.","cible":"ph3"}]}},{"id":"t3","type":"glisser","el":{"standard":{"indice":"Photo 1 : le danger seul. Photo 2 : la personne arrive. Photo 3 : la chute. Photo 4 : la blessure.","explication":"Phrases de l'accident dans l'ordre : Flaque d'eau au sol dans un local d'entretien. → La personne entre dans le local et se dirige vers la flaque d'eau. → Son pied glisse sur l'eau : elle perd l'équilibre. → Lumbago : douleur du bas du dos."}},"data":{"numero":"3","consigne":"**Placer** chaque étiquette sous sa photo : la flaque d'eau.","cibles":[{"id":"ph0","img":"../images/chute-plain-pied/cartes_danger-flaque_eau.jpg","description":"Flaque d'eau au sol dans un local d'entretien.","label":"Danger"},{"id":"ph1","img":"../images/chute-plain-pied/situation-dangereuse-situation_dangereuse_flaque_eau.jpg","description":"Photo à l'entrée d'un local de produits d'entretien. Un homme en tenue de travail bleue franchit la porte, de dos. Au sol, une flaque d'eau bleutée s'étale devant des étagères remplies de bidons de produits. Un balai à franges est posé dans la flaque et un seau jaune à roulettes est placé juste à côté, dans le passage. Aucun panneau n'est posé au sol pour signaler l'eau.","label":"Situation dangereuse"},{"id":"ph2","img":"../images/chute-plain-pied/evenement-declencheur-evenement_declencheur_flaque_eau_pied_glisse_eau.jpg","description":"Photo dans un local de nettoyage au sol mouillé et brillant. Une femme en polo bleu et salopette bleu marine glisse : une jambe part en avant, le corps penche en arrière, les bras sont écartés. Derrière elle, un chariot de ménage avec des seaux bleus et jaunes et deux balais. Tout à gauche, le bord d'un panneau jaune posé au sol.","label":"Événement déclencheur"},{"id":"ph3","img":"../images/chute-plain-pied/dommage-dommage_flaque_eau_atteinte_lombaire_lumbago.jpg","description":"Photo dans le même local. La femme est assise sur le sol mouillé, à côté de l'eau. Elle grimace de douleur et pose une main dans le bas de son dos. Derrière elle, le chariot de ménage. À droite, un cercle montre un schéma de la colonne vertébrale : le bas du dos est coloré en rouge.","label":"Dommage"}],"pieces":[{"id":"x0","texte":"Flaque d'eau au sol dans un local d'entretien.","cible":"ph0"},{"id":"x1","texte":"La personne entre dans le local et se dirige vers la flaque d'eau.","cible":"ph1"},{"id":"x2","texte":"Son pied glisse sur l'eau : elle perd l'équilibre.","cible":"ph2"},{"id":"x3","texte":"Lumbago : douleur du bas du dos.","cible":"ph3"}]}},{"id":"t4","type":"glisser","el":{"standard":{"indice":"Photo 1 : le danger seul. Photo 2 : la personne arrive. Photo 3 : la chute. Photo 4 : la blessure.","explication":"Phrases de l'accident dans l'ordre : Flaque d'huile au sol près d'une machine. → Le salarié se déplace rapidement vers la machine en regardant sa montre. → Son pied glisse sur l'huile : il perd l'équilibre. → Contusion de la hanche."}},"data":{"numero":"4","consigne":"**Placer** chaque étiquette sous sa photo : la fuite d'huile.","cibles":[{"id":"ph0","img":null,"description":"Flaque d'huile au sol près d'une machine.","label":"Danger"},{"id":"ph1","img":"../images/chute-plain-pied/situation-dangereuse-situation_dangereuse_fuite_huile.jpg","description":"Photo dans un atelier. Un homme en combinaison de travail bleue marche d'un bon pas vers une grande machine-outil grise et noire, équipée d'un écran de commande. Au sol, devant la machine, s'étale une large flaque d'huile brune. L'homme regarde la machine et avance vers la flaque. Au premier plan, en bas à droite, des pièces métalliques posées sur une table bleue.","label":"Situation dangereuse"},{"id":"ph2","img":"../images/chute-plain-pied/evenement-declencheur-evenement_declencheur_fuite_huile_pied_glisse_huile.jpg","description":"Photo dans l'atelier, devant des machines. L'homme en combinaison bleue a le pied posé dans une flaque d'huile brillante. Son pied part en avant, son corps bascule, ses bras sont écartés pour tenter de se rattraper.","label":"Événement déclencheur"},{"id":"ph3","img":"../images/chute-plain-pied/dommage-dommage_fuite_huile_contusion_hanche.jpg","description":"Photo dans l'atelier. Un homme en tenue de travail grise est assis au sol, à côté de la flaque d'huile. Il grimace de douleur, une main posée sur la hanche, l'autre main au sol. À droite, un cercle montre un schéma du bassin et du haut de la cuisse : la hanche est colorée en rouge.","label":"Dommage"}],"pieces":[{"id":"x0","texte":"Flaque d'huile au sol près d'une machine.","cible":"ph0"},{"id":"x1","texte":"Le salarié se déplace rapidement vers la machine en regardant sa montre.","cible":"ph1"},{"id":"x2","texte":"Son pied glisse sur l'huile : il perd l'équilibre.","cible":"ph2"},{"id":"x3","texte":"Contusion de la hanche.","cible":"ph3"}]}},{"id":"t5","type":"glisser","el":{"standard":{"indice":"Photo 1 : le danger seul. Photo 2 : la personne arrive. Photo 3 : la chute. Photo 4 : la blessure.","explication":"Phrases de l'accident dans l'ordre : Trou dans le sol en béton abîmé. → Le salarié manœuvre un transpalette chargé à côté du trou. → Son pied s'enfonce dans le trou : il perd l'équilibre. → Entorse de la cheville."}},"data":{"numero":"5","consigne":"**Placer** chaque étiquette sous sa photo : le trou dans le sol.","cibles":[{"id":"ph0","img":null,"description":"Trou dans le sol en béton abîmé.","label":"Danger"},{"id":"ph1","img":"../images/chute-plain-pied/situation-dangereuse-situation_dangereuse_trou_sol.jpg","description":"Photo dans une zone de chargement, devant une grande porte de quai fermée. Un homme en tenue de travail bleue tient la poignée d'un transpalette jaune chargé d'une palette de cartons. Il regarde sa charge et tourne le dos à la zone abîmée. Au premier plan, le sol en béton est fissuré et creusé d'un trou rempli de terre et de débris. À gauche, un poteau jaune de protection.","label":"Situation dangereuse"},{"id":"ph2","img":"../images/chute-plain-pied/evenement-declencheur-evenement_declencheur_trou_sol_pied_sengage_trou.jpg","description":"Photo dans la même zone, devant la porte de quai. Un homme en tenue de travail bleu marine a un pied enfoncé dans le trou du sol fissuré. Il bascule, les bras écartés pour garder l'équilibre, le visage crispé. Derrière lui, des poteaux jaunes et un transpalette.","label":"Événement déclencheur"},{"id":"ph3","img":"../images/chute-plain-pied/dommage-dommage_trou_sol_entorse_cheville.jpg","description":"Photo près du trou. L'homme est assis au sol, à côté du trou entouré de fissures. Il grimace de douleur et tient sa cheville à deux mains. Derrière, la porte de quai et un transpalette chargé de cartons. À droite, un cercle montre un schéma des os du pied : la cheville est colorée en rouge.","label":"Dommage"}],"pieces":[{"id":"x0","texte":"Trou dans le sol en béton abîmé.","cible":"ph0"},{"id":"x1","texte":"Le salarié manœuvre un transpalette chargé à côté du trou.","cible":"ph1"},{"id":"x2","texte":"Son pied s'enfonce dans le trou : il perd l'équilibre.","cible":"ph2"},{"id":"x3","texte":"Entorse de la cheville.","cible":"ph3"}]}},{"id":"t6","type":"glisser","el":{"standard":{"indice":"Photo 1 : le danger seul. Photo 2 : la personne arrive. Photo 3 : la chute. Photo 4 : la blessure.","explication":"Phrases de l'accident dans l'ordre : Carton posé dans une allée de circulation. → Le stagiaire se dirige vers le carton. → Son pied heurte le carton : il trébuche. → Contusion du genou."}},"data":{"numero":"6","consigne":"**Placer** chaque étiquette sous sa photo : le carton dans l'allée.","cibles":[{"id":"ph0","img":null,"description":"Carton posé dans une allée de circulation.","label":"Danger"},{"id":"ph1","img":"../images/chute-plain-pied/situation-dangereuse-situation_dangereuse_carton_dans_allee.jpg","description":"Photo dans une allée d'entrepôt, entre deux hauts rayonnages bleu et orange chargés de cartons. Un homme en tenue de travail bleue marche de dos, au milieu de l'allée. Un carton fermé est posé au sol, sur le côté droit de l'allée, juste devant lui. Des lignes jaunes marquent les bords de l'allée.","label":"Situation dangereuse"},{"id":"ph2","img":"../images/chute-plain-pied/evenement-declencheur-evenement_declencheur_carton_allee_pied_heurte_carton.jpg","description":"Photo dans l'allée d'entrepôt. L'homme en tenue bleue a le pied qui cogne un carton posé au sol. Le carton se soulève et l'homme bascule en avant, les bras écartés.","label":"Événement déclencheur"},{"id":"ph3","img":"../images/chute-plain-pied/dommage-dommage_carton_dans_allee_contusion_genou.jpg","description":"Photo dans l'entrepôt. Un homme en polo foncé et pantalon gris est à genoux au sol, à côté d'un carton. Il grimace de douleur et tient son genou à deux mains. À droite, un cercle montre un schéma du genou : l'articulation est colorée en rouge.","label":"Dommage"}],"pieces":[{"id":"x0","texte":"Carton posé dans une allée de circulation.","cible":"ph0"},{"id":"x1","texte":"Le stagiaire se dirige vers le carton.","cible":"ph1"},{"id":"x2","texte":"Son pied heurte le carton : il trébuche.","cible":"ph2"},{"id":"x3","texte":"Contusion du genou.","cible":"ph3"}]}},{"id":"t7","type":"glisser","el":{"standard":{"indice":"Photo 1 : le danger seul. Photo 2 : la personne arrive. Photo 3 : la chute. Photo 4 : la blessure.","explication":"Phrases de l'accident dans l'ordre : Carton posé au sol au milieu d'une allée de stockage. → Le salarié porte deux cartons qui cachent sa vue et avance vers le carton au sol. → Son pied heurte le carton au sol : il trébuche. → Contusion du genou."}},"data":{"numero":"7","consigne":"**Placer** chaque étiquette sous sa photo : les cartons qui cachent la vue.","cibles":[{"id":"ph0","img":null,"description":"Carton posé au sol au milieu d'une allée de stockage.","label":"Danger"},{"id":"ph1","img":"../images/chute-plain-pied/situation-dangereuse-situation_dangereuse_colis_visibilite_masquee.jpg","description":"Photo dans une allée d'entrepôt bordée de rayonnages. Un homme en tenue de travail bleue porte devant lui deux gros cartons empilés. Les cartons cachent son visage et toute sa vue vers l'avant. Juste devant ses pieds, un autre carton est posé au milieu de l'allée. Des lignes jaunes au sol et des poteaux jaunes bordent l'allée.","label":"Situation dangereuse"},{"id":"ph2","img":"../images/chute-plain-pied/evenement-declencheur-evenement_declencheur_visibilite_masquee_pied_heurte_carton.jpg","description":"Photo dans l'allée d'entrepôt. L'homme en tenue bleue tient encore les cartons empilés dans ses bras. Son pied cogne le carton posé au sol, qui bascule. Il perd l'équilibre et penche en avant, les cartons du haut commencent à tomber.","label":"Événement déclencheur"},{"id":"ph3","img":"../images/chute-plain-pied/dommage-dommage_visibilite_masquee_cartons_contusion_genou.jpg","description":"Photo dans l'allée. L'homme en tenue bleue est assis au sol, entouré de cartons tombés et renversés. Il grimace de douleur et tient son genou à deux mains. À droite, un cercle montre un schéma du genou : l'articulation est colorée en rouge.","label":"Dommage"}],"pieces":[{"id":"x0","texte":"Carton posé au sol au milieu d'une allée de stockage.","cible":"ph0"},{"id":"x1","texte":"Le salarié porte deux cartons qui cachent sa vue et avance vers le carton au sol.","cible":"ph1"},{"id":"x2","texte":"Son pied heurte le carton au sol : il trébuche.","cible":"ph2"},{"id":"x3","texte":"Contusion du genou.","cible":"ph3"}]}}],"bilan":{}};</script>
