<script>window.COURS = {"slug":"risques_cpp_04","classe":"CAP et Bac Pro","retour":"../chute-plain-pied.html","retourLibelle":"Retour à l'espace Chutes de plain-pied","validation":"chute-plain-pied/04","pied":"Risques professionnels — chutes de plain-pied. M. MECHERI. Contenu reformulé d'après l'INRS (ED 840, 2023 ; ED 6433, 2021). Images réalisées pour le cours.","version":"1","sansNiveaux":true,"entete":{"module_code":"Chutes de plain-pied","titre":"4. Glisser les photos","niveau":"CAP · Bac Pro","annee":"2026-27","thematique":"Risques professionnels — activité 4 sur 15","objectif_general":"Associer chaque photo à l'étape de l'accident : danger, situation dangereuse, événement déclencheur, dommage."},"blocks":[{"id":"s1","type":"seance","data":{"numero":"1","titre":"Chaque photo sur son étape","objectif":"Déplacer les photos sur les étiquettes, dans l'ordre de l'accident."}},{"id":"g1","type":"glisser","el":{"standard":{"indice":"Danger : ce qui peut blesser, sans personne exposée. Situation dangereuse : une personne près du danger. Événement déclencheur : le moment de la glissade ou du trébuchement. Dommage : la blessure.","explication":"La flaque d'huile rend le sol glissant : danger. Le salarié qui se dirige vers la machine en marchant vite est exposé : situation dangereuse. Le pied qui glisse sur l'huile fait perdre l'équilibre : événement déclencheur. La contusion de la hanche, choc du corps sur le sol, est le dommage."}},"data":{"numero":"1","consigne":"**Glisser** chaque photo sur son étape : la fuite d'huile.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":"../images/chute-plain-pied/planches-fuite_huile_danger.jpg","texte":null,"description":"Dans un atelier, une large flaque d'huile noire et brillante s'étale sur le sol en béton, au pied d'une machine grise portant un panneau jaune d'avertissement. Une flèche rouge désigne la flaque.","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/planches-fuite_huile_situation.jpg","texte":null,"description":"Un homme en combinaison de travail grise marche à grands pas dans l'atelier, les yeux fixés sur sa montre. Devant lui, sur le sol, se trouve la flaque d'huile.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/planches-fuite_huile_evenement.jpg","texte":null,"description":"Le pied de l'homme dérape dans la flaque d'huile. Le corps part en arrière, les bras levés, la bouche ouverte de surprise ; des traits rouges marquent la glissade.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/planches-fuite_huile_dommage.jpg","texte":null,"description":"L'homme est assis au sol de l'atelier, une main appuyée sur la hanche, le visage crispé par la douleur.","cible":"e3"}]}},{"id":"g2","type":"glisser","el":{"standard":{"indice":"Danger : ce qui peut blesser, sans personne exposée. Situation dangereuse : une personne près du danger. Événement déclencheur : le moment de la glissade ou du trébuchement. Dommage : la blessure.","explication":"Le câble dans le passage peut blesser : danger. La personne qui avance vers lui sans regarder le sol est exposée : situation dangereuse. Le pied qui accroche le câble provoque la chute : événement déclencheur. La fracture du poignet, souvent due au réflexe de mettre la main en avant, est le dommage."}},"data":{"numero":"2","consigne":"**Glisser** chaque photo sur son étape : le câble électrique.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":"../images/chute-plain-pied/planches-cable_electrique_danger.jpg","texte":null,"description":"Dans un couloir de bureaux au carrelage clair, un câble électrique noir traverse le sol du passage, près d'un bureau en bois. Une flèche rouge désigne le câble.","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/planches-cable_electrique_situation.jpg","texte":null,"description":"Une femme en tailleur bleu marine, un sac à l'épaule, avance dans le couloir en lisant un document sur un porte-bloc. Le câble noir est au sol juste devant ses pieds.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/planches-cable_electrique_evenement.jpg","texte":null,"description":"La chaussure de la femme se prend dans le câble. Elle bascule vers l'avant, les bras écartés, le porte-bloc lui échappant ; des traits rouges marquent le choc.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/planches-cable_electrique_dommage.jpg","texte":null,"description":"La femme est assise au sol, le visage grimaçant, et tient son poignet douloureux. Son sac et le porte-bloc gisent à côté d'elle, près du câble.","cible":"e3"}]}},{"id":"g3","type":"glisser","el":{"standard":{"indice":"Danger : ce qui peut blesser, sans personne exposée. Situation dangereuse : une personne près du danger. Événement déclencheur : le moment de la glissade ou du trébuchement. Dommage : la blessure.","explication":"Le tapis relevé existe avant toute personne : c'est le danger. La personne qui marche vers le pli est exposée : situation dangereuse. Le pied qui se prend sous le bord déclenche la chute : événement déclencheur. L'entorse de la cheville est la conséquence finale : dommage."}},"data":{"numero":"3","consigne":"**Glisser** chaque photo sur son étape : le tapis relevé.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":"../images/chute-plain-pied/planches-tapis_releve_danger.jpg","texte":null,"description":"Dans un hall d'accueil aux portes vitrées, un tapis gris posé sur le carrelage forme un pli relevé en bosse. Une flèche rouge désigne ce coin relevé ; un panneau indique « Accueil Bureaux ».","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/planches-tapis_releve_situation.jpg","texte":null,"description":"Une femme en tailleur bleu marine, un sac à l'épaule, marche dans le hall les yeux baissés sur son téléphone. Le pli du tapis se trouve juste devant elle.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/planches-tapis_releve_evenement.jpg","texte":null,"description":"Le pied de la femme bute contre le bord relevé du tapis. Elle part vers l'avant, un bras tendu, la bouche ouverte de surprise ; des traits rouges marquent le choc.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/planches-tapis_releve_dommage.jpg","texte":null,"description":"La femme est assise au sol du hall, le visage crispé, les deux mains serrées sur sa cheville. Son sac et son téléphone sont tombés à côté d'elle ; des traits rouges signalent la douleur.","cible":"e3"}]}},{"id":"g4","type":"glisser","el":{"standard":{"indice":"Danger : ce qui peut blesser, sans personne exposée. Situation dangereuse : une personne près du danger. Événement déclencheur : le moment de la glissade ou du trébuchement. Dommage : la blessure.","explication":"Le tapis relevé existe avant toute personne : c'est le danger. La personne qui marche vers le pli est exposée : situation dangereuse. Le pied qui se prend sous le bord déclenche la chute : événement déclencheur. L'entorse de la cheville est la conséquence finale : dommage."}},"data":{"numero":"4","consigne":"**Glisser** chaque photo sur son étape : le tapis relevé (variante B).","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":"../images/chute-plain-pied/planches-tapis_releve_b_danger.jpg","texte":null,"description":"Dans un hall d'accueil aux portes vitrées, un tapis gris foncé posé sur le carrelage forme un pli relevé. Une flèche rouge désigne ce pli ; un panneau indique « Accueil Bureaux ».","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/planches-tapis_releve_b_situation.jpg","texte":null,"description":"Une femme en tailleur bleu marine, un sac à l'épaule, avance dans le hall en regardant son téléphone. Le pli du tapis se trouve devant ses pieds.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/planches-tapis_releve_b_evenement.jpg","texte":null,"description":"La chaussure de la femme heurte le bord relevé du tapis. Elle bascule vers l'avant, un bras tendu, l'air surpris ; des traits rouges marquent le choc.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/planches-tapis_releve_b_dommage.jpg","texte":null,"description":"La femme est assise au sol, le visage grimaçant, les mains sur sa cheville. Son sac et son téléphone sont tombés près d'elle ; des traits rouges signalent la douleur.","cible":"e3"}]}},{"id":"g5","type":"glisser","el":{"standard":{"indice":"Danger : ce qui peut blesser, sans personne exposée. Situation dangereuse : une personne près du danger. Événement déclencheur : le moment de la glissade ou du trébuchement. Dommage : la blessure.","explication":"Le carton dans l'allée peut faire trébucher : danger. Le stagiaire qui se dirige vers lui est exposé : situation dangereuse. Le pied qui heurte le carton provoque la chute : événement déclencheur. La contusion du genou, choc sur le sol, est le dommage."}},"data":{"numero":"5","consigne":"**Glisser** chaque photo sur son étape : le carton dans l'allée.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":"../images/chute-plain-pied/planches-carton_dans_allee_danger.jpg","texte":null,"description":"Dans un entrepôt bordé de hauts rayonnages chargés de cartons, un carton fermé est posé au milieu de l'allée de circulation, sur le sol en béton.","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/planches-carton_dans_allee_situation.jpg","texte":null,"description":"Un jeune homme en tenue de travail grise, badge « Stagiaire » sur la poitrine et porte-bloc sous le bras, marche dans l'allée vers le carton posé au sol.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/planches-carton_dans_allee_evenement.jpg","texte":null,"description":"Le pied du stagiaire percute le carton, qui bascule. L'homme part vers l'avant, les bras écartés, l'air surpris ; des traits rouges marquent le choc.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/planches-carton_dans_allee_dommage.jpg","texte":null,"description":"Le stagiaire est assis au sol de l'allée, le visage crispé, les deux mains sur le genou. Son porte-bloc est tombé à côté de lui, et le carton est resté plus loin.","cible":"e3"}]}},{"id":"g6","type":"glisser","el":{"standard":{"indice":"Danger : ce qui peut blesser, sans personne exposée. Situation dangereuse : une personne près du danger. Événement déclencheur : le moment de la glissade ou du trébuchement. Dommage : la blessure.","explication":"Ordre de l'accident : Nez de marche abîmé et qui se décolle. → Le salarié descend l'escalier en regardant le carton. → Son pied accroche le nez de marche : il trébuche. → Entorse de la cheville."}},"data":{"numero":"6","consigne":"**Glisser** chaque photo sur son étape : le nez de marche abîmé.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":"../images/chute-plain-pied/planches-nez_de_marche_danger.jpg","texte":null,"description":"Dans une cage d'escalier avec une rampe métallique et un panneau « Étage 1 », la bande de protection au bord d'une marche est décollée et relevée. Une flèche rouge désigne ce nez de marche abîmé.","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/planches-nez_de_marche_situation.jpg","texte":null,"description":"Un homme en tenue de travail grise descend l'escalier en portant un carton à deux mains, les yeux posés sur le carton et non sur les marches.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/planches-nez_de_marche_evenement.jpg","texte":null,"description":"Le pied de l'homme se prend dans le nez de marche décollé. Il bascule vers l'avant avec son carton, une main tendue vers la rampe ; des traits rouges marquent le choc.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/planches-nez_de_marche_dommage.jpg","texte":null,"description":"L'homme est assis sur les marches, le visage grimaçant, les mains serrées sur sa cheville. Le carton est posé plus haut dans l'escalier.","cible":"e3"}]}},{"id":"g7","type":"glisser","el":{"standard":{"indice":"Danger : ce qui peut blesser, sans personne exposée. Situation dangereuse : une personne près du danger. Événement déclencheur : le moment de la glissade ou du trébuchement. Dommage : la blessure.","explication":"L'eau au sol rend le sol glissant : danger. La personne qui entre dans le local et marche vers l'eau est exposée : situation dangereuse. Le pied qui glisse fait perdre l'équilibre : événement déclencheur. Le lumbago, atteinte du bas du dos après la chute, est le dommage."}},"data":{"numero":"7","consigne":"**Glisser** chaque photo sur son étape : la flaque d'eau.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":"../images/chute-plain-pied/cartes_danger-flaque_eau.jpg","texte":null,"description":"Flaque d'eau au sol dans un local d'entretien.","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/situation-dangereuse-situation_dangereuse_flaque_eau.jpg","texte":null,"description":"Photo à l'entrée d'un local de produits d'entretien. Un homme en tenue de travail bleue franchit la porte, de dos. Au sol, une flaque d'eau bleutée s'étale devant des étagères remplies de bidons de produits. Un balai à franges est posé dans la flaque et un seau jaune à roulettes est placé juste à côté, dans le passage. Aucun panneau n'est posé au sol pour signaler l'eau.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/evenement-declencheur-evenement_declencheur_flaque_eau_pied_glisse_eau.jpg","texte":null,"description":"Photo dans un local de nettoyage au sol mouillé et brillant. Une femme en polo bleu et salopette bleu marine glisse : une jambe part en avant, le corps penche en arrière, les bras sont écartés. Derrière elle, un chariot de ménage avec des seaux bleus et jaunes et deux balais. Tout à gauche, le bord d'un panneau jaune posé au sol.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/dommage-dommage_flaque_eau_atteinte_lombaire_lumbago.jpg","texte":null,"description":"Photo dans le même local. La femme est assise sur le sol mouillé, à côté de l'eau. Elle grimace de douleur et pose une main dans le bas de son dos. Derrière elle, le chariot de ménage. À droite, un cercle montre un schéma de la colonne vertébrale : le bas du dos est coloré en rouge.","cible":"e3"}]}},{"id":"g8","type":"glisser","el":{"standard":{"indice":"Danger : ce qui peut blesser, sans personne exposée. Situation dangereuse : une personne près du danger. Événement déclencheur : le moment de la glissade ou du trébuchement. Dommage : la blessure.","explication":"Le trou dans le béton peut faire tomber : danger. Le salarié qui manœuvre sa charge juste à côté est exposé : situation dangereuse. Le pied qui s'enfonce dans le trou provoque la perte d'équilibre : événement déclencheur. L'entorse de la cheville, articulation tordue, est le dommage."}},"data":{"numero":"8","consigne":"**Glisser** chaque photo sur son étape : le trou dans le sol.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":null,"texte":"Trou dans le sol en béton abîmé.","description":"Trou dans le sol en béton abîmé.","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/situation-dangereuse-situation_dangereuse_trou_sol.jpg","texte":null,"description":"Photo dans une zone de chargement, devant une grande porte de quai fermée. Un homme en tenue de travail bleue tient la poignée d'un transpalette jaune chargé d'une palette de cartons. Il regarde sa charge et tourne le dos à la zone abîmée. Au premier plan, le sol en béton est fissuré et creusé d'un trou rempli de terre et de débris. À gauche, un poteau jaune de protection.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/evenement-declencheur-evenement_declencheur_trou_sol_pied_sengage_trou.jpg","texte":null,"description":"Photo dans la même zone, devant la porte de quai. Un homme en tenue de travail bleu marine a un pied enfoncé dans le trou du sol fissuré. Il bascule, les bras écartés pour garder l'équilibre, le visage crispé. Derrière lui, des poteaux jaunes et un transpalette.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/dommage-dommage_trou_sol_entorse_cheville.jpg","texte":null,"description":"Photo près du trou. L'homme est assis au sol, à côté du trou entouré de fissures. Il grimace de douleur et tient sa cheville à deux mains. Derrière, la porte de quai et un transpalette chargé de cartons. À droite, un cercle montre un schéma des os du pied : la cheville est colorée en rouge.","cible":"e3"}]}},{"id":"g9","type":"glisser","el":{"standard":{"indice":"Danger : ce qui peut blesser, sans personne exposée. Situation dangereuse : une personne près du danger. Événement déclencheur : le moment de la glissade ou du trébuchement. Dommage : la blessure.","explication":"Le carton au milieu de l'allée peut faire trébucher : danger. Le salarié qui avance vers lui avec une charge devant les yeux est exposé : situation dangereuse. Le pied qui heurte le carton fait perdre l'équilibre : événement déclencheur. La contusion du genou est le dommage."}},"data":{"numero":"9","consigne":"**Glisser** chaque photo sur son étape : les cartons qui cachent la vue.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":null,"texte":"Carton posé au sol au milieu d'une allée de stockage.","description":"Carton posé au sol au milieu d'une allée de stockage.","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/situation-dangereuse-situation_dangereuse_colis_visibilite_masquee.jpg","texte":null,"description":"Photo dans une allée d'entrepôt bordée de rayonnages. Un homme en tenue de travail bleue porte devant lui deux gros cartons empilés. Les cartons cachent son visage et toute sa vue vers l'avant. Juste devant ses pieds, un autre carton est posé au milieu de l'allée. Des lignes jaunes au sol et des poteaux jaunes bordent l'allée.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/evenement-declencheur-evenement_declencheur_visibilite_masquee_pied_heurte_carton.jpg","texte":null,"description":"Photo dans l'allée d'entrepôt. L'homme en tenue bleue tient encore les cartons empilés dans ses bras. Son pied cogne le carton posé au sol, qui bascule. Il perd l'équilibre et penche en avant, les cartons du haut commencent à tomber.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/dommage-dommage_visibilite_masquee_cartons_contusion_genou.jpg","texte":null,"description":"Photo dans l'allée. L'homme en tenue bleue est assis au sol, entouré de cartons tombés et renversés. Il grimace de douleur et tient son genou à deux mains. À droite, un cercle montre un schéma du genou : l'articulation est colorée en rouge.","cible":"e3"}]}},{"id":"g10","type":"glisser","el":{"standard":{"indice":"Danger : ce qui peut blesser, sans personne exposée. Situation dangereuse : une personne près du danger. Événement déclencheur : le moment de la glissade ou du trébuchement. Dommage : la blessure.","explication":"Le collègue qui arrive avec un carton est un obstacle mobile : danger. Le salarié qui marche vers lui sans regarder devant lui est exposé : situation dangereuse. Le choc entre les deux fait perdre l'équilibre : événement déclencheur. La contusion de l'épaule est le dommage."}},"data":{"numero":"10","consigne":"**Glisser** chaque photo sur son étape : l'écran en marchant.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":null,"texte":"Collègue chargé d'un carton dans la même allée.","description":"Collègue chargé d'un carton dans la même allée.","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/situation-dangereuse-situation_dangereuse_telephone_en_marchant.jpg","texte":null,"description":"Photo dans un atelier avec des rayonnages et des poteaux jaunes. Au premier plan, un homme en tenue bleue marche de dos en regardant une tablette tenue dans sa main. En face, un collègue en tenue bleue avance vers lui en portant un carton à deux mains. À droite, des pièces métalliques posées sur un établi bleu.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/evenement-declencheur-evenement_declencheur_telephone_collision_personne.jpg","texte":null,"description":"Photo dans une allée de stockage. Un homme en veste noire regarde son téléphone en marchant. Il heurte de l'épaule un collègue en tenue bleue qui porte un carton. Le collègue tourne la tête vers lui, surpris.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/dommage-dommage_telephone_en_marchant_contusion_epaule.jpg","texte":null,"description":"Photo entre des rayonnages. L'homme en veste noire est tombé et se retrouve assis au sol. Il crie de douleur, garde un carton contre lui et se retient d'une main à un montant de rayonnage. Son téléphone est par terre, à côté de lui. À droite, un cercle montre un schéma de l'épaule : l'articulation est colorée en rouge.","cible":"e3"}]}},{"id":"g11","type":"glisser","el":{"standard":{"indice":"Danger : ce qui peut blesser, sans personne exposée. Situation dangereuse : une personne près du danger. Événement déclencheur : le moment de la glissade ou du trébuchement. Dommage : la blessure.","explication":"La barre posée au sol, cachée par l'obscurité, peut faire trébucher : danger. Le salarié qui marche dans l'allée sombre est exposé : situation dangereuse. Le pied qui bute contre la barre provoque la chute : événement déclencheur. L'entorse de la cheville est le dommage."}},"data":{"numero":"11","consigne":"**Glisser** chaque photo sur son étape : l'allée mal éclairée.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":null,"texte":"Barre métallique posée au sol dans une allée peu éclairée.","description":"Barre métallique posée au sol dans une allée peu éclairée.","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/situation-dangereuse-situation_dangereuse_mauvais_eclairage.jpg","texte":null,"description":"Photo dans une allée d'entrepôt très sombre, entre des rayonnages chargés de cartons. Un homme en tenue de travail bleue marche de dos. Seules deux lampes, au plafond et loin devant, donnent une faible lumière. Le sol devant lui est à peine visible et le fond de l'allée reste dans l'ombre.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/evenement-declencheur-evenement_declencheur_mauvais_eclairage_trebuchement.jpg","texte":null,"description":"Photo dans une allée d'entrepôt sombre. Un homme en veste foncée tient une lampe torche allumée dans chaque main. Son pied bute contre une barre métallique posée en travers du sol. Il trébuche et penche en avant, les bras écartés.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/dommage-dommage_mauvais_eclairage_entorse_cheville.jpg","texte":null,"description":"Photo dans l'allée sombre de l'entrepôt. Un homme en tenue bleue est assis au sol. Il grimace de douleur et tient sa cheville à deux mains. À droite, un cercle montre un schéma des os du pied : la cheville est colorée en rouge.","cible":"e3"}]}}],"bilan":{}};</script>
