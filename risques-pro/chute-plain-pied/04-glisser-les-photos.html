<script>window.COURS = {"slug":"risques_cpp_04","classe":"CAP et Bac Pro","retour":"../chute-plain-pied.html","retourLibelle":"Retour à l'espace Chutes de plain-pied","validation":"chute-plain-pied/v2/04","pied":"Risques professionnels — chutes de plain-pied. M. MECHERI. Contenu reformulé d'après l'INRS (ED 840, 2023 ; ED 6433, 2021). Images réalisées pour le cours.","version":"2","sansNiveaux":true,"entete":{"module_code":"Chutes de plain-pied","titre":"4. Glisser les photos","niveau":"CAP · Bac Pro","annee":"2026-27","thematique":"Risques professionnels — chutes de plain-pied","objectif_general":"Associer chaque photo à l'étape de l'accident : danger, situation dangereuse, événement déclencheur, dommage."},"blocks":[{"id":"s1","type":"seance","data":{"numero":"1","titre":"Chaque photo sur son étape","objectif":"Déplacer les photos sur les étiquettes, dans l'ordre de l'accident."}},{"id":"g1","type":"glisser","el":{"standard":{"indice":"Appuie-toi sur les éléments explicitement décrits ou visibles.","explication":"La flaque d'huile rend le sol glissant : danger. Le salarié qui se dirige vers la machine en marchant vite est exposé : situation dangereuse. Le pied qui glisse sur l'huile fait perdre l'équilibre : événement déclencheur. La contusion de la hanche, choc du corps sur le sol, est le dommage. Les quatre cartes décrivent ici un scénario donné ; la blessure montrée n’est pas la seule conséquence possible de ce danger."}},"data":{"numero":"1","consigne":"**Glisser** chaque photo sur son étape : la fuite d'huile. La personne exposée est l’opérateur ; elle doit rester la même dans toute l’histoire.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":"../images/chute-plain-pied/planches-fuite_huile_danger.jpg","texte":null,"description":"Dans un atelier, une large flaque d'huile noire et brillante s'étale sur le sol en béton, au pied d'une machine grise portant un panneau jaune d'avertissement. Une flèche rouge désigne la flaque.","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/planches-fuite_huile_situation.jpg","texte":null,"description":"Un homme en combinaison de travail grise marche à grands pas dans l'atelier, regardant devant lui. Devant lui, sur le sol, se trouve la flaque d'huile.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/planches-fuite_huile_evenement.jpg","texte":null,"description":"Le pied de l'homme dérape dans la flaque d'huile. Le corps part en arrière, les bras levés, la bouche ouverte de surprise ; des traits rouges marquent la glissade.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/planches-fuite_huile_dommage.jpg","texte":null,"description":"L'homme est assis au sol de l'atelier, une main appuyée sur la hanche, le visage crispé par la douleur.","cible":"e3"}]}},{"id":"g2","type":"glisser","el":{"standard":{"indice":"Appuie-toi sur les éléments explicitement décrits ou visibles.","explication":"Le câble dans le passage peut blesser : danger. La personne qui avance vers lui pendant son déplacement est exposée : situation dangereuse. Le pied qui accroche le câble provoque la chute : événement déclencheur. La fracture du poignet, souvent due au réflexe de mettre la main en avant, est le dommage. Les quatre cartes décrivent ici un scénario donné ; la blessure montrée n’est pas la seule conséquence possible de ce danger."}},"data":{"numero":"2","consigne":"**Glisser** chaque photo sur son étape : le câble électrique. La personne exposée est l’opérateur ; elle doit rester la même dans toute l’histoire.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":"../images/chute-plain-pied/planches-cable_electrique_danger.jpg","texte":null,"description":"Dans un couloir de bureaux au carrelage clair, un câble électrique noir traverse le sol du passage, près d'un bureau en bois. Une flèche rouge désigne le câble.","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/planches-cable_electrique_situation.jpg","texte":null,"description":"Une femme en tailleur bleu marine, un sac à l'épaule, avance dans le couloir en lisant un document sur un porte-bloc. Le câble noir est au sol juste devant ses pieds.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/planches-cable_electrique_evenement.jpg","texte":null,"description":"La chaussure de la femme se prend dans le câble. Elle bascule vers l'avant, les bras écartés, le porte-bloc lui échappant ; des traits rouges marquent le choc.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/planches-cable_electrique_dommage.jpg","texte":null,"description":"La femme est assise au sol, le visage grimaçant, et tient son poignet douloureux. Son sac et le porte-bloc gisent à côté d'elle, près du câble.","cible":"e3"}]}},{"id":"g3","type":"glisser","el":{"standard":{"indice":"Appuie-toi sur les éléments explicitement décrits ou visibles.","explication":"Le tapis relevé est la source susceptible de faire trébucher : c'est le danger. La personne qui marche vers le pli est exposée : situation dangereuse. Le pied qui se prend sous le bord déclenche la chute : événement déclencheur. L'entorse de la cheville est la conséquence finale : dommage. Les quatre cartes décrivent ici un scénario donné ; la blessure montrée n’est pas la seule conséquence possible de ce danger."}},"data":{"numero":"3","consigne":"**Glisser** chaque photo sur son étape : le tapis relevé. La personne exposée est l’opérateur ; elle doit rester la même dans toute l’histoire.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":"../images/chute-plain-pied/planches-tapis_releve_danger.jpg","texte":null,"description":"Dans un hall d'accueil aux portes vitrées, un tapis gris posé sur le carrelage forme un pli relevé en bosse. Une flèche rouge désigne ce coin relevé ; un panneau indique « Accueil Bureaux ».","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/planches-tapis_releve_situation.jpg","texte":null,"description":"Une femme en tailleur bleu marine, un sac à l'épaule, marche dans le hall les yeux baissés sur son téléphone. Le pli du tapis se trouve juste devant elle.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/planches-tapis_releve_evenement.jpg","texte":null,"description":"Le pied de la femme bute contre le bord relevé du tapis. Elle part vers l'avant, un bras tendu, la bouche ouverte de surprise ; des traits rouges marquent le choc.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/planches-tapis_releve_dommage.jpg","texte":null,"description":"La femme est assise au sol du hall, le visage crispé, les deux mains serrées sur sa cheville. Son sac et son téléphone sont tombés à côté d'elle ; des traits rouges signalent la douleur.","cible":"e3"}]}},{"id":"g5","type":"glisser","el":{"standard":{"indice":"Appuie-toi sur les éléments explicitement décrits ou visibles.","explication":"Le carton dans l'allée peut faire trébucher : danger. Le nouveau salarié qui se dirige vers lui est exposé : situation dangereuse. Le pied qui heurte le carton provoque la chute : événement déclencheur. La contusion du genou, choc sur le sol, est le dommage. Les quatre cartes décrivent ici un scénario donné ; la blessure montrée n’est pas la seule conséquence possible de ce danger."}},"data":{"numero":"4","consigne":"**Glisser** chaque photo sur son étape : le carton dans l'allée. La personne exposée est l’opérateur ; elle doit rester la même dans toute l’histoire.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":"../images/chute-plain-pied/planches-carton_dans_allee_danger.jpg","texte":null,"description":"Dans un entrepôt bordé de hauts rayonnages chargés de cartons, un carton fermé est posé au milieu de l'allée de circulation, sur le sol en béton.","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/planches-carton_dans_allee_situation.jpg","texte":null,"description":"Un homme en tenue de travail grise, porte-bloc sous le bras, marche dans l'allée vers le carton posé au sol.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/planches-carton_dans_allee_evenement.jpg","texte":null,"description":"Le pied du salarié percute le carton, qui bascule. L'homme part vers l'avant, les bras écartés, l'air surpris ; des traits rouges marquent le choc.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/planches-carton_dans_allee_dommage.jpg","texte":null,"description":"Le salarié est assis au sol de l'allée, le visage crispé, les deux mains sur le genou. Son porte-bloc est tombé à côté de lui, et le carton est resté plus loin.","cible":"e3"}]}},{"id":"g8","type":"glisser","el":{"standard":{"indice":"Appuie-toi sur les éléments explicitement décrits ou visibles.","explication":"Le trou dans le béton peut faire tomber : danger. Le salarié qui manœuvre sa charge juste à côté est exposé : situation dangereuse. Le pied qui s'enfonce dans le trou provoque la perte d'équilibre : événement déclencheur. L'entorse de la cheville, articulation tordue, est le dommage. Les quatre cartes décrivent ici un scénario donné ; la blessure montrée n’est pas la seule conséquence possible de ce danger."}},"data":{"numero":"5","consigne":"**Glisser** chaque photo sur son étape : le trou dans le sol. La personne exposée est l’opérateur ; elle doit rester la même dans toute l’histoire.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":null,"texte":"Trou dans le sol en béton abîmé.","description":"Trou dans le sol en béton abîmé.","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/situation-dangereuse-situation_dangereuse_trou_sol.jpg","texte":null,"description":"Photo dans une zone de chargement, devant une grande porte de quai fermée. Un homme en tenue de travail bleue tient la poignée d'un transpalette jaune chargé d'une palette de cartons. Il regarde sa charge et tourne le dos à la zone abîmée. Au premier plan, le sol en béton est fissuré et creusé d'un trou rempli de terre et de débris. À gauche, un poteau jaune de protection.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/evenement-declencheur-evenement_declencheur_trou_sol_pied_sengage_trou.jpg","texte":null,"description":"Photo dans la même zone, devant la porte de quai. Un homme en tenue de travail bleu marine a un pied enfoncé dans le trou du sol fissuré. Il bascule, les bras écartés pour garder l'équilibre, le visage crispé. Derrière lui, des poteaux jaunes et un transpalette.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/dommage-dommage_trou_sol_entorse_cheville.jpg","texte":null,"description":"Photo près du trou. L'homme est assis au sol, à côté du trou entouré de fissures. Il grimace de douleur et tient sa cheville à deux mains. Derrière, la porte de quai et un transpalette chargé de cartons. À droite, un cercle montre un schéma des os du pied : la cheville est colorée en rouge.","cible":"e3"}]}},{"id":"g9","type":"glisser","el":{"standard":{"indice":"Appuie-toi sur les éléments explicitement décrits ou visibles.","explication":"Le carton au milieu de l'allée peut faire trébucher : danger. Le salarié qui avance vers lui avec une charge devant les yeux est exposé : situation dangereuse. Le pied qui heurte le carton fait perdre l'équilibre : événement déclencheur. La contusion du genou est le dommage. Les quatre cartes décrivent ici un scénario donné ; la blessure montrée n’est pas la seule conséquence possible de ce danger."}},"data":{"numero":"6","consigne":"**Glisser** chaque photo sur son étape : les cartons qui cachent la vue. La personne exposée est l’opérateur ; elle doit rester la même dans toute l’histoire.","cibles":[{"id":"e0","label":"1. Danger"},{"id":"e1","label":"2. Situation dangereuse"},{"id":"e2","label":"3. Événement déclencheur"},{"id":"e3","label":"4. Dommage"}],"pieces":[{"id":"p0","img":null,"texte":"Carton posé au sol au milieu d'une allée de stockage.","description":"Carton posé au sol au milieu d'une allée de stockage.","cible":"e0"},{"id":"p1","img":"../images/chute-plain-pied/situation-dangereuse-situation_dangereuse_colis_visibilite_masquee.jpg","texte":null,"description":"Photo dans une allée d'entrepôt bordée de rayonnages. Un homme en tenue de travail bleue porte devant lui deux gros cartons empilés. Les cartons cachent son visage et toute sa vue vers l'avant. Juste devant ses pieds, un autre carton est posé au milieu de l'allée. Des lignes jaunes au sol et des poteaux jaunes bordent l'allée.","cible":"e1"},{"id":"p2","img":"../images/chute-plain-pied/evenement-declencheur-evenement_declencheur_visibilite_masquee_pied_heurte_carton.jpg","texte":null,"description":"Photo dans l'allée d'entrepôt. L'homme en tenue bleue tient encore les cartons empilés dans ses bras. Son pied cogne le carton posé au sol, qui bascule. Il perd l'équilibre et penche en avant, les cartons du haut commencent à tomber.","cible":"e2"},{"id":"p3","img":"../images/chute-plain-pied/dommage-dommage_visibilite_masquee_cartons_contusion_genou.jpg","texte":null,"description":"Photo dans l'allée. L'homme en tenue bleue est assis au sol, entouré de cartons tombés et renversés. Il grimace de douleur et tient son genou à deux mains. À droite, un cercle montre un schéma du genou : l'articulation est colorée en rouge.","cible":"e3"}]}}],"bilan":{},"cpp_clair":true};</script>
