window.COURS = {"slug":"bcp_1ere_C3","classe":"Première Bac Pro","retour":"index.html#1re-c3","pied":"Module C3 — Première Bac Pro. Prévention, santé, environnement — M. MECHERI. Situation construite pour le cours ; sources indiquées sous chaque document.","version":"2.0","entete":{"module_code":"C3","titre":"Les acteurs de prévention","niveau":"Première Bac Pro","annee":"2026-2027","thematique":"Thématique C — L'individu et la prévention des risques professionnels","objectif_general":"Être capable d'identifier les acteurs de prévention et leurs missions."},"blocks":[{"id":"c3_seance1","type":"seance","data":{"numero":"1","titre":"Les acteurs internes de prévention","objectif":"Être capable d'identifier les acteurs internes de prévention.","competences":["C1","C2","C3"]}},{"id":"c3_situation1","type":"situation","data":{"texte":"Maël, 20 ans, est agent de conditionnement depuis trois mois chez Novalim, une entreprise de conditionnement de plats préparés qui emploie 62 salariés.\n\nLe jour de son arrivée, Karine l'a reçu. Elle est salariée de l'entreprise et la direction l'a désignée pour s'occuper de la prévention des risques. Elle lui a présenté les consignes de sécurité, les protections à porter et la liste des sauveteurs secouristes du travail affichée à l'entrée de l'atelier.\n\nDepuis trois semaines, Maël travaille au poste d'étiquetage. Les cartons sont posés au sol : il se baisse pour les prendre et les relève à hauteur de table pendant toute la journée. Le soir, il a mal au bas du dos. Deux salariés du même poste ressentent les mêmes douleurs depuis plusieurs mois. Ils en ont parlé aux représentants du personnel à la dernière réunion.\n\nMaël voudrait que son poste soit amélioré. Plusieurs personnes s'occupent de la santé et de la sécurité, dans l'entreprise et à l'extérieur, et il ne sait pas laquelle peut agir.","source":""}},{"id":"c3_s1_analyse","type":"analyse","data":{"titre":"ANALYSER LA SITUATION"}},{"id":"c3_s1_ch1","type":"question_chapeau","data": ail (SST) — repère les situations dangereuses et porte les premiers secours. Colonne de droite, « Autres acteurs et organismes de prévention — Ils conseillent, contrôlent et accompagnent » : Le service de prévention et de santé au travail (SPST) — assure le suivi de la santé des salariés et conseille l'employeur ; peut être propre à l'entreprise ou commun à plusieurs entreprises. L'inspection du travail — contrôle le respect de la réglementation du travail. La Caisse d'assurance retraite et de la santé au travail (Carsat) — conseille et accompagne les entreprises pour prévenir les risques professionnels. En bas, sur toute la largeur : « L'ensemble de ces acteurs agissent tous ensemble pour la santé et la sécurité au travail. »","img_w":1536,"img_h":1024,"image_pos":"haut"}},{"id":"c3_s1_ch2","type":"question_chapeau","data":{"numero":"2","texte":"À partir du document 1 :","reponse_attendue":"","explication":""}},{"id":"c3_s1_q2_1","type":"sous_question","data":{"competence":"C1","numero":"2.1","texte":"**Indiquer** en cochant si chaque acteur agit dans l'entreprise ou s'il conseille, contrôle et accompagne l'entreprise.","lignes":0,"style_lignes":"","support_type":"","indice":"","reponse_attendue":"L'employeur : Dans l'entreprise • Le salarié : Dans l'entreprise • Le salarié compétent (PPRP) : Dans l'entreprise • Le comité social et économique (CSE) : Dans l'entreprise • Le sauveteur secouriste du travail (SST) : Dans l'entreprise • Le service de prévention et de santé au travail (SPST) : Autres acteurs et organismes de prévention • L'inspection du travail : Autres acteurs et organismes de prévention • La Carsat : Autres acteurs et organismes de prévention","explication":"","variantes":{"adapte":{"indice":"La colonne de gauche du document réunit les acteurs qui agissent au quotidien dans l'entreprise.","reponse_attendue":"Le salarié : Dans l'entreprise • Le salarié compétent (PPRP) : Dans l'entreprise • Le comité social et économique (CSE) : Dans l'entreprise • Le s "analyse","data":{"titre":"LES ACTEURS DANS L'ENTREPRISE"}},{"id":"c3_s1_doc2","type":"document","data":{"label":"DOC. 2","titre":"L'employeur et le salarié face aux risques","cadre":true,"corps":"**L'employeur.** « L'employeur prend les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs » (article L. 4121-1 du code du travail). Il évalue les risques et inscrit le résultat de cette évaluation dans le document unique d'évaluation des risques professionnels (DUERP).\n\n**Le salarié.** « Il incombe à chaque travailleur de prendre soin, en fonction de sa formation et selon ses possibilités, de sa santé et de sa sécurité ainsi que de celles des autres personnes concernées par ses actes ou ses omissions au travail » (article L. 4122-1). Il alerte immédiatement l'employeur de toute situation de travail dont il a un motif raisonnable de penser qu'elle présente un danger grave et imminent (article L. 4131-1).\n\n**Une responsabilité qui reste à l'employeur.** Les obligations du salarié « sont sans incidence sur le principe de la responsabilité de l'employeur » (article L. 4122-1).","source":"Source : code du travail, articles L. 4121-1, L. 4122-1 et L. 4131-1 (Légifrance).","variantes":{"essentiel":{"corps":"**L'employeur.** Il prend les mesures nécessaires pour assurer la sécurité et protéger la santé des travailleurs (article L. 4121-1 du code du travail). Il évalue les risques et inscrit le résultat dans le DUERP.\n\n**Le salarié.** Il prend soin de sa santé et de sa sécurité et de celles des autres personnes concernées (article L. 4122-1). Il alerte l'employeur devant un danger grave et imminent.\n\n**La responsabilité reste à l'employeur.** Les obligations du salarié ne changent rien à la responsabilité de l'employeur."}}}},{"id":"c3_s1_ch3","type":"question_chapeau","data":{"numero":"3","texte":"À partir du document 2 :","reponse_attendue":"","explication":""}},{"id":"c3_s1_q3_1","type":"sous_question","data":{"competence":"C1","numero":"3.1","texte":"**Compléter** le tableau des obligations.","lignes":0,"style_lignes":"","support_type":"","indice":"","reponse_attendue":"L'employeur : Prendre les mesures nécessaires pour assurer la sécurité et protéger la santé des travailleurs. • Le salarié : Prendre soin de sa santé et de sa sécurité et de celles des autres personnes concernées.","explication":"","variantes":{"adapte":{"indice":"L'obligation du salarié est donnée dans le deuxième paragraphe.","reponse_attendue":"Le salarié : Prendre soin de sa santé et de sa sécurité et de celles des autres personnes concernées."},"essentiel":{"indice":"L'obligation du salarié est donnée dans le deuxième paragraphe.","reponse_attendue":"Le salarié : Prendre soin de sa santé et de sa sécurité et de celles des autres personnes concernées."}}},"el":{"standard":{"indice":"DOC. 2 : la phrase entre guillemets du premier paragraphe, puis celle du deuxième.","explication":"L'employeur prend les mesures nécessaires pour assurer la sécurité et protéger la santé des travailleurs. Le salarié prend soin de sa santé et de sa sécurité et de celles des autres personnes concernées.","cherche":[{"bloc":"c3_s1_doc2","texte":"prend les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs"},{"bloc":"c3_s1_doc2","texte":"prendre soin, en fonction de sa formation et selon ses possibilités, de sa santé et de sa sécurité"}]},"adapte":{"indice":"DOC. 2 : l'obligation du salarié est donnée dans le deuxième paragraphe.","explication":"Le salarié prend soin de sa santé et de sa sécurité et de celles des autres personnes concernées par son travail.","cherche":[{"bloc":"c3_s1_doc2","texte":"prendre soin, en fonction de sa formation et selon ses possibilités, de sa santé et de sa sécurité"}]},"essentiel":{"indice":"DOC. 2 : l'obligation du salarié est donnée dans le deuxième paragraphe.","explication":"Le salarié prend soin de sa santé et de sa sécurité et de celles des autre 1_q3_2","type":"sous_question","data":{"competence":"C3","numero":"3.2","texte":"**Expliquer** pourquoi un salarié doit alerter son employeur devant une situation dangereuse.","lignes":2,"style_lignes":"tiret_guide","support_type":"","indice":"","reponse_attendue":"L'alerte permet à l'employeur de supprimer le danger avant qu'un accident se produise.","explication":"","variantes":{"adapte":{"texte":"**Compléter** la phrase avec deux mots pris dans la liste : accident – danger – salaire.\nL'alerte permet à l'employeur de supprimer le ………………… avant qu'un ………………… se produise.","lignes":0,"reponse_attendue":"Premier blanc : danger.\nSecond blanc : accident.","indice":"Le danger est présent avant l'accident : penser à ce que l'employeur peut faire dès qu'il est prévenu."},"essentiel":{"texte":"**Identifier** en cochant ce que permet l'alerte d'un salarié.\n☐ Supprimer le danger avant qu'un accident se produise.\n☐ Augmenter le salaire du salarié qui alerte.\n☐ Remplacer le salarié à son poste de travail.","lignes":0,"reponse_attendue":"Supprimer le danger avant qu'un accident se produise.","indice":"Une seule proposition parle à la fois du danger et de l'accident."}}},"el":{"standard":{"indice":"DOC. 2 : le salarié alerte immédiatement l'employeur. Se demander ce que l'employeur peut faire ensuite.","explication":"En alertant, le salarié permet à l'employeur de supprimer le danger avant qu'un accident se produise.","cherche":[{"bloc":"c3_s1_doc2","texte":"Il alerte immédiatement l'employeur de toute situation de travail"}]},"adapte":{"indice":"DOC. 2 : le danger est là avant l'accident. Penser à ce que l'employeur peut faire dès qu'il est prévenu.","explication":"L'alerte permet à l'employeur de supprimer le danger avant qu'un accident se produise.","trous":["danger","accident"],"cherche":[{"bloc":"c3_s1_doc2","texte":"Il alerte immédiatement l'employeur de toute situation de travail"}]},"essentiel":{"indice":"DOC. 2 : une seule proposition parle à la fois du danger et de l'accident.","explication":"L'alerte permet à l'employeur de supprimer le danger avant qu'un accident se produise.","cherche":[{"bloc":"c3_s1_doc2","texte":"Il alerte l'employeur devant un danger grave et imminent."}]}}},{"id":"c3_s1_doc3","type":"document_texte_image","data":{"label":"DOC. 3","titre":"Deux salariés désignés : le salarié compétent (PPRP) et le sauveteur secouriste du travail (SST)","cadre":true,"corps":"**Le salarié compétent.** Toutes les entreprises sont concernées (article L. 4644-1 du code du travail). Le salarié désigné reçoit une formation en santé au travail, et sa désignation ne retire pas à l'employeur sa responsabilité. Lorsque les compétences de l'entreprise ne suffisent pas, l'employeur peut faire appel, après avis du CSE, à des intervenants extérieurs.\n\n**Le sauveteur secouriste du travail.** La formation initiale dure quatorze heures ; le maintien et l'actualisation des compétences (MAC) durent sept heures et sont suivis tous les deux ans pour conserver la validité du certificat. Un membre du personnel doit être formé aux premiers secours dans chaque atelier où sont accomplis des travaux dangereux (article R. 4224-15).","source":"Source : code du travail, articles L. 4644-1 et R. 4224-15 (Légifrance) ; INRS.","variantes":{"essentiel":{"corps":"**Le salarié compétent.** Toutes les entreprises sont concernées (article L. 4644-1 du code du travail). Il reçoit une formation en santé au travail. Sa désignation ne retire pas à l'employeur sa responsabilité.\n\n**Le sauveteur secouriste du travail.** Formation initiale : quatorze heures. Maintien et actualisation des compétences (MAC) : sept heures tous les deux ans."}},"img":"bcp_1ere_C3/images/C3_salarie_competent_PPRP_et_SST.jpg","img_desc":"Tableau illustré des deux salariés désignés, en deux colonnes. Colonne de gauche, « Le salarié compétent (PPRP) », avec le dessin d'une salariée tenant une tablette : « Un salarié désigné par l'employeur pour s'occuper de la prévention des risques professionnels. » Puis trois lignes : participe à l'évaluation des risques ; aide à la mise en place d'actions de prévention ; suit la mise en œuvre des actions. Colonne de droite, « Le sauveteur secouriste du travail (SST) », avec le dessin d'un salarié portant une chasuble à croix blanche : « Un salarié formé pour intervenir en cas d'accident ou de malaise sur le lieu de travail. » Puis trois lignes : porte les premiers secours à une victime ; repère les situations dangereuses ; participe à la prévention dans l'entreprise. En bas, sur toute la largeur : « Ces deux salariés agissent avec l'employeur pour prévenir les risques professionnels. »","img_w":1536,"img_h":1024,"image_pos":"bas"}},{"id":"c3_s1_ch4","type":"question_chapeau","data":{"numero":"4","texte":"À partir du document 3 :","reponse_attendue":"","explication":""}},{"id":"c3_s1_q4_1","type":"sous_question","data":{"competence":"C1","numero":"4.1","texte":"**Compléter** le tableau de comparaison des deux salariés désignés.","lignes":0,"style_lignes":"","support_type":"","indice":"","reponse_attendue":"Comment est-il désigné ou formé ? (Le salarié compétent (PPRP)) : L'employeur le désigne et il reçoit une formation en santé au travail. • Comment est-il désigné ou formé ? (Le sauveteur secouriste du travail (SST)) : Il suit une formation initiale de quatorze heures, puis un MAC de sept heures tous les deux ans. • Que fait-il ? (Le salarié compétent (PPRP)) : Il aide l'employeur pour la protection et la prévention des risques professionnels. • Que fait-il ? (Le sauveteur secouriste du travail (SST)) : Il contribue à la prévention des risques et intervient face à un accident du travail ou un malaise. • Un exemple d'action (Le salarié compétent (PPRP)) : Participer à l'évaluation des risques. • Un exemple d'action (Le sauveteur secouriste du travail (SST)) : Repérer les situations dangereuses.","explication":"","variantes":{"adapte":{"indice":"Chaque colonne du document concerne un seul des deux salariés désignés.","reponse_attendue":"Comment est-il désigné ou formé ? (Le sauveteur secouriste du travail (SST)) : Il suit une formation initiale de quatorze heures, puis un MAC de sept heures tous les deux ans. • Que fait-il ? (Le salarié compétent (PPRP)) : Il aide l'employeur pour la protection et la prévention des risques professionnels. • Que fait-il ? (Le sauveteur secouriste du travail (SST)) : Il contribue à la prévention des risques et intervient face à un accident du travail ou un malaise. • Un exemple d'action (Le salarié compétent (PPRP)) : Participer à l'évaluation des risques. • Un exemple d'action (Le sauveteur secouriste du travail (SST)) : Repérer les situations dangereuses."},"essentiel":{"indice":"Les exemples d'action sont donnés sous la définition de chaque salarié.","reponse_attendue":"Un exemple d'action (Le salarié compétent (PPRP)) : Participer à l'évaluation des risques. • Un exemple d'action (Le sauveteur secouriste du travail (SST)) : Repérer les situations dangereuses."}}},"el":{"standard":{"indice":"DOC. 3 : le premier paragraphe concerne le salarié compétent, le second le sauveteur secouriste du travail.","explication":"Le salarié compétent est désigné par l'employeur et reçoit une formation en santé au travail ; il aide l'employeur pour la protection et la prévention des risques professionnels et participe à l'évaluation des risques. Le sauveteur secouriste du travail suit quatorze heures de formation initiale, puis un MAC de sept heures tous les deux ans ; il contribue à la prévention, intervient face à un accident du travail ou un malaise et repère les situations dangereuses.","cherche":[{"bloc":"c3_s1_doc3","texte":"Le salarié désigné reçoit une formation en santé au travail"},{"bloc":"c3_s1_doc3","texte":"La formation initiale dure quatorze heures"}]},"adapte":{"indice":"DOC. 3 : chaque paragraphe ne concerne qu'un seul des deux salariés désignés.","explication":"Le salarié compétent est désigné par l'employeur et reçoit une formation en vail ou un malaise."}],[{"type":"prof","content":"Un exemple d'action"},{"type":"eleve","content":"","reponse":"Participer à l'évaluation des risques.","options":["Participer à l'évaluation des risques.","Fixer les salaires de l'atelier.","Contrôler l'entreprise depuis l'extérieur."]},{"type":"eleve","content":"","reponse":"Repérer les situations dangereuses.","options":["Repérer les situations dangereuses.","Rédiger le contrat de travail des salariés.","Décider des horaires de l'atelier."]}]]}}}},{"id":"c3_s1_doc4","type":"document","data":{"label":"DOC. 4","titre":"Le comité social et économique (CSE)","cadre":true,"corps":"Le comité social et économique (CSE) est l'**instance représentative du personnel** dans l'entreprise. Il est obligatoire dès que l'entreprise atteint onze salariés pendant douze mois consécutifs. Il réunit l'employeur et une délégation du personnel élue, en principe pour un mandat de quatre ans.\n\n**Ses missions dans toutes les entreprises d'au moins onze salariés** (article L. 2312-5 du code du travail) :\n• présenter à l'employeur les réclamations individuelles et collectives ;\n• contribuer à promouvoir la santé, la sécurité et l'amélioration des conditions de travail ;\n• réaliser des enquêtes en matière d'accidents du travail et de maladies professionnelles ;\n• saisir l'inspection du travail des plaintes et observations relatives à l'application du droit du travail.\n\n**Ses missions supplémentaires à partir de cinquante salariés** (article L. 2312-9) : analyser les risques professionnels auxquels les travailleurs peuvent être exposés et prendre toute initiative utile, notamment proposer des actions de prévention. Le CSE est consulté sur le DUERP.","source":"Source : code du travail, articles L. 2312-5 et L. 2312-9 (Légifrance) ; service-public.gouv.fr ; INRS.","variantes":{"essentiel":{"corps":"Le comité social et économique (CSE) est l'**instance représentative du personnel** dans l'entreprise. Il est obligatoire dès que l'entreprise atteint onze salariés. Il réunit l'employeur et une délégation du personnel élue.\n\n**Ses missions** (article L. 2312-5 du code du travail) :\n• présenter à l'employeur les réclamations individuelles et collectives ;\n• contribuer à promouvoir la santé, la sécurité et l'amélioration des conditions de travail ;\n• réaliser des enquêtes après un accident du travail ou une maladie professionnelle ;\n• saisir l'inspection du travail.\n\nÀ partir de cinquante salariés, le CSE analyse aussi les risques professionnels et propose des actions de prévention."}}}},{"id":"c3_s1_ch5","type":"question_chapeau","data":{"numero":"5","texte":"À partir de la situation de Maël et du document 4 :","reponse_attendue":"","explication":""}},{"id":"c3_s1_q5_1","type":"sous_question","data":{"competence":"C1","numero":"5.1","texte":"**Relever** l'effectif à partir duquel le CSE est obligatoire et la durée du mandat.","lignes":2,"style_lignes":"tirets_comptage","support_type":"","indice":"","reponse_attendue":"Effectif : onze salariés pendant douze mois consécutifs.\nMandat : quatre ans.","explication":"","lignes_par_reponse":1,"variantes":{"adapte":{"indice":"Les deux réponses se trouvent dans le premier paragraphe du document."},"essentiel":{"texte":"**Identifier** en cochant l'effectif à partir duquel le CSE est obligatoire.\n☐ Onze salariés.\n☐ Cinquante salariés.\n☐ Trois cents salariés.","lignes":0,"style_lignes":"","reponse_attendue":"Onze salariés.","indice":"L'effectif est écrit dans le premier paragraphe du document."}}},"el":{"standard":{"indice":"DOC. 4 : le premier paragraphe donne l'effectif, puis la durée du mandat.","explication":"Le CSE est obligatoire dès que l'entreprise atteint onze salariés pendant douze mois consécutifs. Le mandat dure en principe quatre ans.","cherche":[{"bloc":"c3_s1_doc4","texte":"onze salariés pendant douze mois consécutifs"},{"bloc":"c3_s1_doc4","texte":"un mandat de quatre ans"}]},"adapte":{"indice":"DOC. 4 : les deux réponses se trouvent dans le :["C1","C3","C4","C5"]}},{"id":"c3_s2_analyse1","type":"analyse","data":{"titre":"LE SERVICE DE PRÉVENTION ET DE SANTÉ AU TRAVAIL"}},{"id":"c3_s2_doc5","type":"document","data":{"label":"DOC. 5","titre":"Le service de prévention et de santé au travail (SPST)","cadre":true,"corps":"« Les services de prévention et de santé au travail ont pour mission principale d'éviter toute altération de la santé des travailleurs du fait de leur travail » (article L. 4622-2 du code du travail). Pour cela, ils conseillent les employeurs, les travailleurs et leurs représentants sur les mesures nécessaires pour éviter ou diminuer les risques professionnels ; ils assurent la surveillance de l'état de santé des travailleurs en fonction des risques ; ils contribuent au maintien dans l'emploi.\n\nSelon l'importance des entreprises, le service est propre à une seule entreprise ou commun à plusieurs ; on parle alors de service interentreprises (article L. 4622-5).\n\n**Une équipe pluridisciplinaire.** Elle est animée et coordonnée par le **médecin du travail**. Elle comprend aussi des **infirmiers en santé au travail**, qui assurent le suivi de l'état de santé des travailleurs sous l'autorité du médecin du travail (article L. 4624-1), et des **intervenants en prévention des risques professionnels (IPRP)**, qui disposent de compétences dans le domaine de la prévention des risques professionnels et de l'amélioration des conditions de travail.\n\nLe médecin du travail peut proposer par écrit, après échange avec le salarié et l'employeur, des mesures individuelles d'aménagement, d'adaptation ou de transformation du poste de travail (article L. 4624-3).","source":"Source : code du travail, articles L. 4622-2, L. 4622-5, L. 4624-1 et L. 4624-3 (Légifrance) ; INRS.","variantes":{"essentiel":{"corps":"« Les services de prévention et de santé au travail ont pour mission principale d'éviter toute altération de la santé des travailleurs du fait de leur travail » (article L. 4622-2 du code du travail).\n\nLe service surveille l'état de santé des travailleurs et contribue au maintien dans l'emploi. Il est propre à une seule entreprise ou commun à plusieurs (article L. 4622-5).\n\n**Une équipe pluridisciplinaire.** Elle réunit le **médecin du travail**, qui l'anime, des **infirmiers en santé au travail**, qui suivent l'état de santé des travailleurs, et des **intervenants en prévention des risques professionnels (IPRP)**, qui apportent des compétences en prévention des risques professionnels.\n\nLe médecin du travail peut proposer des mesures d'aménagement, d'adaptation ou de transformation du poste de travail (article L. 4624-3)."}}}},{"id":"c3_s2_ch1","type":"question_chapeau","data":{"numero":"1","texte":"À partir du document 5 :","reponse_attendue":"","explication":""}},{"id":"c3_s2_q1_1","type":"sous_question","data":{"competence":"C1","numero":"1.1","texte":"**Relever** la mission principale du service de prévention et de santé au travail.","lignes":2,"style_lignes":"tiret_guide","support_type":"","indice":"","reponse_attendue":"Éviter toute altération de la santé des travailleurs du fait de leur travail.","explication":"","variantes":{"adapte":{"indice":"La mission principale est écrite entre guillemets au premier paragraphe."},"essentiel":{"texte":"**Identifier** en cochant la mission principale du service de prévention et de santé au travail.\n☐ Éviter toute altération de la santé des travailleurs du fait de leur travail.\n☐ Rembourser les frais médicaux des salariés.\n☐ Fixer les horaires de travail dans l'entreprise.","lignes":0,"style_lignes":"","reponse_attendue":"Éviter toute altération de la santé des travailleurs du fait de leur travail.","indice":"Une seule proposition est écrite entre guillemets dans le document."}}},"el":{"standard":{"indice":"DOC. 5 : la phrase entre guillemets, au tout début du document.","explication":"La mission principale du service de prévention et de santé au travail est d'éviter toute altération de la santé des travailleur }],[{"type":"prof","content":"Le médecin du travail"},{"type":"prof","content":"Il anime l'équipe et peut proposer un aménagement du poste de travail."}],[{"type":"prof","content":"L'infirmier en santé au travail"},{"type":"prof","content":"Il assure le suivi de l'état de santé des travailleurs sous l'autorité du médecin du travail."}],[{"type":"prof","content":"L'intervenant en prévention des risques professionnels (IPRP)"},{"type":"eleve","content":"","reponse":"Il apporte des compétences en prévention des risques professionnels.","options":["Il apporte des compétences en prévention des risques professionnels.","Il soigne les salariés malades à l'hôpital.","Il contrôle l'application du droit du travail."]}]]}}}},{"id":"c3_s2_q1_3","type":"sous_question","data":{"competence":"C3","numero":"1.3","texte":"**Expliquer** ce que le médecin du travail peut proposer à un salarié qui a des douleurs liées à son poste.","lignes":2,"style_lignes":"tiret_guide","support_type":"","indice":"","reponse_attendue":"Il peut proposer des mesures d'aménagement, d'adaptation ou de transformation du poste de travail.","explication":"","variantes":{"adapte":{"texte":"**Compléter** la phrase avec deux mots pris dans la liste : adaptation – aménagement – augmentation.\nLe médecin du travail peut proposer un …………………, une ………………… ou une transformation du poste de travail.","lignes":0,"reponse_attendue":"Premier blanc : aménagement.\nSecond blanc : adaptation.","indice":"Les trois mesures possibles sont écrites dans la dernière phrase du document."},"essentiel":{"texte":"**Identifier** en cochant ce que le médecin du travail peut proposer à un salarié qui a mal au dos.\n☐ Un aménagement, une adaptation ou une transformation de son poste de travail.\n☐ Une augmentation de son salaire.\n☐ Un changement de son contrat de travail.","lignes":0,"reponse_attendue":"Un aménagement, une adaptation ou une transformation de son poste de travail.","indice":"Une seule proposition figure dans la dernière phrase du document."}}},"el":{"standard":{"indice":"DOC. 5 : la dernière phrase du document.","explication":"Le médecin du travail peut proposer par écrit des mesures d'aménagement, d'adaptation ou de transformation du poste de travail.","cherche":[{"bloc":"c3_s2_doc5","texte":"d'aménagement, d'adaptation ou de transformation du poste de travail"}]},"adapte":{"indice":"DOC. 5 : les trois mesures possibles sont écrites dans la dernière phrase.","explication":"Le médecin du travail peut proposer un aménagement, une adaptation ou une transformation du poste de travail.","trous":["aménagement","adaptation"],"cherche":[{"bloc":"c3_s2_doc5","texte":"d'aménagement, d'adaptation ou de transformation du poste de travail"}]},"essentiel":{"indice":"DOC. 5 : une seule proposition figure dans la dernière phrase du document.","explication":"Le médecin du travail peut proposer un aménagement, une adaptation ou une transformation du poste de travail.","cherche":[{"bloc":"c3_s2_doc5","texte":"d'aménagement, d'adaptation ou de transformation du poste de travail"}]}}},{"id":"c3_s2_analyse1b","type":"analyse","data":{"titre":"LES ORGANISMES EXTÉRIEURS"}},{"id":"c3_s2_doc6","type":"document","data":{"label":"DOC. 6","titre":"L'inspection du travail","cadre":true,"corps":"Les agents de contrôle de l'inspection du travail veillent à l'application du code du travail et des conventions et accords collectifs. Ils informent et conseillent les employeurs, les salariés et leurs représentants sur le droit du travail. Ils interviennent aussi comme conciliateurs lors des conflits collectifs.\n\n**Des pouvoirs prévus par la loi.** Les agents de contrôle « ont un droit d'entrée dans tout établissement » où s'appliquent les règles qu'ils contrôlent, « afin d'y assurer la surveillance et les enquêtes dont ils sont chargés » (article L. 8113-1 du code du travail). Ils constatent les infractions, adressent des observations rappelant la règle ou une mise en demeure, et peuvent dresser un procès-verbal. Dans certaines situations prévues par le code du travail où un travailleur est exposé à un danger grave et imminent, l'agent de contrôle peut décider l'arrêt temporaire des travaux ou de l'activité en cause (article L. 4731-1).\n\n**Qui peut la saisir ?** Un salarié, un membre de la délégation du personnel du CSE ou un employeur peuvent s'adresser à l'inspection du travail. Les litiges individuels entre un salarié et son employeur relèvent, eux, du conseil de prud'hommes.","source":"Source : code du travail, articles L. 8112-1, L. 8113-1 et L. 4731-1 (Légifrance) ; service-public.gouv.fr.","variantes":{"essentiel":{"corps":"Les agents de contrôle de l'inspection du travail veillent à l'application du code du travail. Ils informent et conseillent les employeurs, les salariés et leurs représentants.\n\n**Leurs pouvoirs.** Ils ont un droit d'entrée dans tout établissement où s'appliquent les règles qu'ils contrôlent, afin d'y assurer la surveillance et les enquêtes dont ils sont chargés. Ils constatent les infractions et adressent des observations ou une mise en demeure. Dans certaines situations prévues par le code du travail, ils peuvent décider l'arrêt temporaire des travaux ou d'une activité dangereuse.\n\n**Qui peut la saisir ?** Un salarié, un membre du CSE ou un employeur. Les litiges individuels entre un salarié et son employeur relèvent du conseil de prud'hommes."}}}},{"id":"c3_s2_ch2","type":"question_chapeau","data":{"numero":"2","texte":"À partir du document 6 :","reponse_attendue":"","explication":""}},{"id":"c3_s2_q2_1","type":"vrai_faux","data":{"numero":"2.1","competence":"C1","label1":"Vrai","label2":"Faux","consigne":"**Indiquer** en cochant si chaque affirmation est vraie ou fausse.","items":[{"texte":"L'inspection du travail veille à l'application du code du travail.","answer":"vrai"},{"texte":"Un agent de contrôle doit obtenir l'autorisation de l'employeur pour entrer dans l'établissement.","answer":"faux"},{"texte":"Un salarié peut s'adresser à l'inspection du travail.","answer":"vrai"},{"texte":"Dans les situations prévues par le code du travail, l'agent de contrôle peut décider l'arrêt temporaire d'une activité dangereuse.","answer":"vrai"},{"texte":"L'inspection du travail tranche les litiges individuels entre un salarié et son employeur.","answer":"faux"}]},"el":{"standard":{"indice":"DOC. 6 : le premier paragraphe, puis « Des pouvoirs prévus par la loi » et « Qui peut la saisir ? ».","explication":"L'inspection du travail veille à l'application du code du travail. Ses agents ont un droit d'entrée dans tout établissement : ils n'ont pas besoin de l'autorisation de l'employeur. Un salarié peut s'adresser à eux et, dans les situations prévues par le code du travail, l'agent peut décider l'arrêt temporaire d'une activité dangereuse. En revanche, les litiges individuels entre un salarié et son employeur relèvent du conseil de prud'hommes.","cherche":[{"bloc":"c3_s2_doc6","texte":"veillent à l'application du code du travail"},{"bloc":"c3_s2_doc6","texte":"droit d'entrée dans tout établissement"},{"bloc":"c3_s2_doc6","texte":"du conseil de prud'hommes"}]},"adapte":{"indice":"DOC. 6 : le premier paragraphe, puis « Des pouvoirs prévus par la loi » et « Qui peut la saisir ? ».","explication":"L'inspection du travail veille à l'application du code du travail. Ses agents ont un droit d'entrée dans tout établissement : ils n'ont pas besoin de l'autorisation de l'employeur. Un salarié peut s'adresser à eux et, dans les situations prévues par le code du travail, l'agent peut décider l'arrêt temporaire d'une activité dangereuse. En revanche, les litiges individuels entre un salarié et son employeur relèvent du conseil de prud'hommes.","cherche":[{"bloc":"c3_s2_doc6","texte":"veillent à l'application du code du travail"},{"bloc":"c3_s2_doc6","texte":"droit d'entrée dans tout établissement"},{"bloc":"c3_s2_doc6","texte":"du conseil de prud'hommes"}]},"essentiel":{"indice":"DOC. 6 : le premier paragraphe, puis « Des pouvoirs prévus par la loi » et « Qui peut la saisir ? ».","explication":"L'inspection du travail veille à l'application du code du travail. Ses agents ont un droit d'entrée dans tout établissement : ils n'ont pas besoin de l'autorisation de l'employeur. Un salarié peut s'adresser à eux et, dans les situations prévues par le code du travail, l'agent peut décider l'arrêt temporaire d'une activité dangereuse. En revanche, les litiges individuels entre un salarié et son employeur relèvent du conseil de prud'hommes.","cherche":[{"bloc":"c3_s2_doc6","texte":"veillent à l'application du code du travail"},{"bloc":"c3_s2_doc6","texte":"droit d'entrée dans tout établissement"},{"bloc":"c3_s2_doc6","texte":"du conseil de prud'hommes"}]}}},{"id":"c3_s2_q2_2","type":"sous_question","data":{"competence":"C3","numero":"2.2","texte":"**Expliquer** en quoi le droit d'entrée aide l'agent de contrôle à exercer sa mission.","lignes":2,"style_lignes":"tiret_guide","support_type":"","indice":"","reponse_attendue":"Il lui permet d'accéder aux lieux de travail pour contrôler l'application des règles relevant de sa compétence.","explication":"","variantes":{"adapte":{"texte":"**Compléter** la phrase avec deux mots pris dans la liste : contrôler – lieux – payer.\nLe droit d'entrée permet à l'agent d'accéder aux ………………… de travail pour ………………… l'application des règles.","lignes":0,"reponse_attendue":"Premier blanc : lieux.\nSecond blanc : contrôler.","indice":"Relire la première phrase du paragraphe « Des pouvoirs prévus par la loi »."},"essentiel":{"texte":"**Identifier** en cochant ce que permet le droit d'entrée de l'agent de contrôle.\n☐ Accéder aux lieux de travail pour contrôler l'application des règles.\n☐ Choisir les salariés qui travaillent dans l'atelier.\n☐ Fixer le montant des cotisations de l'entreprise.","lignes":0,"reponse_attendue":"Accéder aux lieux de travail pour contrôler l'application des règles.","indice":"Une seule proposition concerne le contrôle des règles."}}},"el":{"standard":{"indice":"DOC. 6, « Des pouvoirs prévus par la loi » : la première phrase dit pourquoi les agents entrent dans l'établissement.","explication":"Le droit d'entrée permet à l'agent d'accéder aux lieux de travail pour y contrôler l'application des règles dont il a la charge.","cherche":[{"bloc":"c3_s2_doc6","texte":"afin d'y assurer la surveillance et les enquêtes dont ils sont chargés"}]},"adapte":{"indice":"DOC. 6 : relire la première phrase du paragraphe « Des pouvoirs prévus par la loi ».","explication":"Le droit d'entrée permet à l'agent d'accéder aux lieux de travail pour contrôler l'application des règles.","trous":["lieux","contrôler"],"cherche":[{"bloc":"c3_s2_doc6","texte":"afin d'y assurer la surveillance et les enquêtes dont ils sont chargés"}]},"essentiel":{"indice":"DOC. 6 : une seule proposition concerne le contrôle des règles.","explication":"Le droit d'entrée permet à l'agent d'accéder aux lieux de travail pour contrôler l'application des règles.","cherche":[{"bloc":"c3_s2_doc6","texte":"afin d'y assurer la surveillance et les enquêtes dont ils sont chargés"}]}}},{"id":"c3_s2_doc7","type":"document","data":{"label":"DOC. 7","titre":"La Carsat","cadre":true,"corps":"La caisse d'assurance retraite et de la santé au travail (Carsat) est l'organisme régional de l'Assurance Maladie – Risques professionnels.\n\n**Contrôler.** Des ingénieurs-conseils et des contrôleurs de sécurité se rendent dans les entreprises. Ils peuvent demander toute mesure de prévention justifiée et la prescrire par injonction ; le taux de cotisation de l'entreprise peut alors être majoré.\n\n**Former et aider.** La Carsat diffuse de la documentation et des bonnes pratiques, propose des formations à la prévention des risques professionnels et accorde des aides financières : subventions prévention pour les petites entreprises, contrats de prévention.\n\n**Tarifer.** L'Assurance Maladie – Risques professionnels fixe le taux de cotisation accidents du travail et maladies professionnelles (AT/MP) de chaque établissement. En dessous de 20 salariés, le taux est collectif : il dépend du nombre de sinistres survenus dans le secteur d'activité, et non des accidents de l'entreprise elle-même. De 20 à 149 salariés, le taux est mixte : il réunit une part collective et une part calculée sur les sinistres de l'établissement. À partir de 150 salariés, le taux est individuel : il prend en compte la sinistralité de l'établissement sur les trois années précédentes.","source":"Source : Assurance Maladie – Risques professionnels (ameli.fr).","variantes":{"essentiel":{"corps":"La caisse d'assurance retraite et de la santé au travail (Carsat) est l'organisme régional de l'Assurance Maladie – Risques professionnels.\n\n**Contrôler.** Des ingénieurs-conseils et des contrôleurs de sécurité se rendent dans les entreprises et peuvent prescrire une mesure de prévention.\n\n**Former et aider.** La Carsat diffuse de la documentation, propose des formations à la prévention des risques professionnels et accorde des aides financières.\n\n**Tarifer.** L'Assurance Maladie – Risques professionnels fixe le taux de cotisation accidents du travail et maladies professionnelles (AT/MP) de chaque établissement. En dessous de 20 salariés, le taux est collectif : il dépend du nombre de sinistres du secteur d'activité, et non des accidents de l'entreprise elle-même. À partir de 20 salariés, le taux comporte une part individuelle : il prend en compte la sinistralité de l'établissement."}}}},{"id":"c3_s2_ch3","type":"question_chapeau","data":{"numero":"3","texte":"À partir du document 7 :","reponse_attendue":"","explication":""}},{"id":"c3_s2_q3_1","type":"sous_question","data":{"competence":"C1","numero":"3.1","texte":"**Relever** deux moyens dont dispose la Carsat pour aider les entreprises.","lignes":2,"style_lignes":"tirets_comptage","support_type":"","indice":"","reponse_attendue":"– Des formations à la prévention des risques professionnels.\n– Des aides financières.","explication"  AT/MP peut encourager certaines entreprises à prévenir les risques.","lignes":2,"style_lignes":"tiret_guide","support_type":"","indice":"","reponse_attendue":"Lorsque le taux comporte une part individuelle, une diminution de la sinistralité de l'établissement peut diminuer son taux de cotisation.","explication":"","variantes":{"adapte":{"texte":"**Compléter** la phrase avec deux mots pris dans la liste : accidents – collectif – individuelle.\nQuand le taux comporte une part …………………, moins l'établissement a d'…………………, plus son taux baisse.","lignes":0,"reponse_attendue":"Premier blanc : individuelle.\nSecond blanc : accidents.","indice":"Regarder le paragraphe « Tarifer » : à partir de quel effectif le taux dépend-il de l'établissement lui-même ?"},"essentiel":{"texte":"**Identifier** en cochant la phrase exacte sur le taux de cotisation AT/MP.\n☐ Quand le taux comporte une part individuelle, moins l'établissement a d'accidents, plus son taux baisse.\n☐ En dessous de 20 salariés, le taux dépend des accidents de l'entreprise elle-même.\n☐ Le taux de cotisation est le même pour toutes les entreprises.","lignes":0,"reponse_attendue":"Quand le taux comporte une part individuelle, moins l'établissement a d'accidents, plus son taux baisse.","indice":"Une seule proposition tient compte de l'effectif de l'établissement."}}},"el":{"standard":{"indice":"DOC. 7, « Tarifer » : regarder à partir de quel effectif le taux dépend de l'établissement lui-même.","explication":"En dessous de 20 salariés, le taux est collectif : il dépend du secteur d'activité. De 20 à 149 salariés, il est mixte, et à partir de 150 salariés, il est individuel : une diminution de la sinistralité de l'établissement peut alors diminuer son taux de cotisation.","cherche":[{"bloc":"c3_s2_doc7","texte":"De 20 à 149 salariés, le taux est mixte"},{"bloc":"c3_s2_doc7","texte":"À partir de 150 salariés, le taux est individuel"}]},"adapte":{"indice":"DOC. 7, « Tarifer » : à partir de quel effectif le taux dépend-i
