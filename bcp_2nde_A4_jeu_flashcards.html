<style>
:root{
  --fond1:#0F3D36; --fond2:#1D5E50; --clair:#F4F8F5; --encre:#13302A; --doux:#5B7A71;
  --reponse:#FFD23F; --reponse-encre:#2A2200; --ligne:rgba(255,255,255,.22);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--clair);
  font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:1.1rem;line-height:1.5;

    radial-gradient(1200px 600px at 15% -10%,rgba(255,210,63,.13),transparent 60%),

    linear-gradient(160deg,var(--fond1),var(--fond2));
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--reponse);outline-offset:4px}

.page{max-width:820px;margin:0 auto;padding:1.4rem 1.1rem 2.5rem;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1.7rem,4.5vw,2.6rem);line-height:1.05;margin:0;letter-spacing:-.01em}
header p{margin:.35rem 0 0;opacity:.8}

.filtres{display:flex;gap:.5rem;overflow-x:auto;padding:1.1rem .1rem .4rem;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.puce{flex:none;border:2px solid var(--ligne);background:rgba(255,255,255,.06);border-radius:999px;padding:.4rem 1rem;font-weight:700;font-size:1rem;transition:background .2s,border-color .2s}
.puce:hover{border-color:rgba(255,255,255,.5)}
.puce[aria-pressed="true"]{background:var(--clair);color:var(--encre);border-color:var(--clair)}

.progression{display:flex;align-items:center;gap:.9rem;margin:.8rem 0 1.3rem}
.piste{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
.piste span{display:block;height:100%;width:0;background:var(--reponse);border-radius:9px;transition:width .35s ease}
.num{font-weight:700;font-variant-numeric:tabular-nums;min-width:4.5rem;text-align:right}

/* ===== Scène / tilt / flip ===== */
.scene{flex:1;display:flex;align-items:center;justify-content:center;perspective:1600px;padding:.5rem 0 1rem}
.pile{position:relative;width:min(100%,640px);aspect-ratio:3/2;min-height:300px}
.pile::before,.pile::after{content:"";position:absolute;inset:0;border-radius:26px;background:rgba(244,248,245,.16);transform:translateY(14px) scale(.95);z-index:0}
.pile::after{transform:translateY(26px) scale(.9);background:rgba(244,248,245,.08)}
.tilt{position:absolute;inset:0;z-index:1;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.2,1);will-change:transform}
.tilt.actif{transition:transform .08s linear}
.carte{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.35,.45,1);cursor:pointer;border-radius:26px;outline:none}
.carte.retournee{transform:rotateY(180deg)}
.carte:focus-visible .face{outline:4px solid var(--reponse);outline-offset:4px}
.face{
  position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  padding:clamp(1.2rem,4vw,2.4rem);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.55),0 10px 20px -10px rgba(0,0,0,.35);
}
.devant{background:linear-gradient(155deg,#FFFFFF,#EEF4F0);color:var(--encre)}
.dos{background:linear-gradient(155deg,#FFE27A,var(--reponse));color:var(--reponse-encre);transform:rotateY(180deg)}
.haut{display:flex;justify-content:space-between;align-items:center;gap:1rem;transform:translateZ(30px)}
.seance{font-weight:700;font-size:.9rem;padding:.25rem .7rem;border-radius:999px;background:rgba(19,48,42,.08)}
.dos .seance{background:rgba(42,34,0,.1)}
.voix{border:0;background:rgba(19,48,42,.08);width:44px;height:44px;border-radius:50%;font-size:1.25rem;display:grid;place-items:center;transition:transform .15s}
.dos .voix{background:rgba(42,34,0,.1)}
.voix:hover{transform:scale(1.08)}
.corps{flex:1;display:flex;align-items:center;transform:translateZ(50px)}
.texte{margin:0;font-weight:700;font-size:clamp(1.3rem,3.6vw,2rem);line-height:1.25}
.devant .texte{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.005em}
.dos .texte{font-weight:400}
.notion{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1rem,2.4vw,1.2rem);margin-bottom:.4rem;opacity:.75}
.bas{font-size:.95rem;color:var(--doux);transform:translateZ(20px)}
.dos .bas{color:rgba(42,34,0,.65)}
.reflet{position:absolute;inset:0;border-radius:26px;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.55),rgba(255,255,255,0) 55%);mix-blend-mode:soft-light}
.tilt.actif .reflet{opacity:1}

/* ===== Commandes ===== */
.commandes{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;margin-top:.6rem}
.rond{width:60px;height:60px;border-radius:50%;border:2px solid var(--ligne);background:rgba(255,255,255,.08);font-size:1.5rem;display:grid;place-items:center;transition:background .2s,transform .15s}
.rond:hover{background:rgba(255,255,255,.18)}
.rond:active{transform:scale(.94)}
.rond:disabled{opacity:.35;cursor:default}
.retourner{height:60px;border-radius:999px;border:0;background:var(--reponse);color:var(--reponse-encre);font-weight:700;font-size:1.15rem;box-shadow:0 10px 24px -10px rgba(255,210,63,.7);transition:transform .15s}
.retourner:active{transform:scale(.97)}
.outils{display:flex;justify-content:center;gap:.6rem;margin-top:1rem;flex-wrap:wrap}
.lien{border:0;background:none;color:var(--clair);opacity:.8;text-decoration:underline;text-underline-offset:4px;padding:.4rem .6rem;font-size:1rem}
.lien:hover{opacity:1}
.aide{text-align:center;font-size:.9rem;opacity:.65;margin-top:.8rem}
kbd{border:1px solid rgba(255,255,255,.4);border-radius:5px;padding:0 .35rem;font-family:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:560px){
  .pile{aspect-ratio:auto;height:min(62vh,440px)}
  .rond{width:54px;height:54px}.retourner{height:54px}
  .aide .clavier{display:none}
}
@media (prefers-reduced-motion:reduce){
  .carte,.tilt,.piste span{transition:none!important}
}

.fil{margin:0 0 .7rem}
.fil a{color:var(--clair);opacity:.85;text-decoration:underline;text-underline-offset:4px;font-size:1rem;padding:.35rem .1rem;display:inline-block}
.fil a:hover{opacity:1}

const TITRES={"1": "Séance 1 — Les conduites addictives et les facteurs de risque", "2": "Séance 2 — Le mécanisme de l'addiction dans le cerveau", "3": "Séance 3 — Les effets et les conséquences des addictions", "4": "Séance 4 — Prévention, réglementation et structures d'aide"};
const CARTES=[{"s": 1, "n": "Le problème posé", "q": "Quel problème l'article sur les dépistages au travail pose-t-il ?", "r": "Comment prévenir la consommation d'alcool et de drogues des salariés ?"}, {"s": 1, "n": "Évolution des tests positifs", "q": "Comment la part de tests positifs a-t-elle évolué entre 2017 et 2025 ?", "r": "Elle a plus que doublé : de 2,6 % à 5,3 %."}, {"s": 1, "n": "Produit le plus retrouvé", "q": "Quel produit est le plus souvent retrouvé dans les tests de l'article ?", "r": "Le cannabis : 1,8 % des tests."}, {"s": 1, "n": "Moments à risque", "q": "Quand les tests positifs à l'alcool sont-ils les plus fréquents ?", "r": "Le soir après 17 h et le vendredi : jusqu'à deux fois plus que la moyenne.", "dit": "Quand les tests positifs à l'alcool sont-ils les plus fréquents ?|Le soir après 17 heures et le vendredi : jusqu'à deux fois plus que la moyenne."}, {"s": 1, "n": "Les intérimaires", "q": "Citer deux conditions de travail des intérimaires relevées dans l'article.", "r": "Deux parmi : horaires décalés, logements temporaires, isolement, manque d'information."}, {"s": 1, "n": "Addiction", "q": "Qu'est-ce qu'une addiction ?", "r": "Une perte progressive de contrôle face à une substance ou un comportement : la personne ne parvient plus à réduire ou à arrêter."}, {"s": 1, "n": "Avec ou sans produit", "q": "Distinguer addiction avec produit et addiction sans produit.", "r": "Avec produit : une substance (tabac, alcool, cannabis). Sans produit : une activité (jeux d'argent, jeux vidéo)."}, {"s": 1, "n": "Facteurs de risque", "q": "Nommer les trois composantes sur lesquelles repose une addiction.", "r": "L'individu, le produit et l'environnement."}, {"s": 1, "n": "L'individu", "q": "Citer deux facteurs de risque liés à l'individu.", "r": "Deux parmi : l'âge, le sexe, la maturité cérébrale, la personnalité, l'humeur, l'initiation précoce."}, {"s": 1, "n": "L'environnement", "q": "Citer deux facteurs de risque liés à l'environnement.", "r": "Deux parmi : le stress, le contexte social et amical, la disponibilité des produits, le prix, le marketing."}, {"s": 1, "n": "Le produit", "q": "Pourquoi le produit est-il un facteur de risque ?", "r": "L'addiction s'installe plus ou moins vite : après quelques prises pour la cocaïne, très lentement pour l'alcool."}, {"s": 1, "n": "Le travail", "q": "Citer deux conditions de travail qui peuvent déclencher ou aggraver des conduites addictives.", "r": "Deux parmi : le stress, la surcharge de travail, les horaires décalés, des conditions physiques difficiles."}, {"s": 1, "n": "Habitudes collectives", "q": "Relever deux habitudes collectives au travail qui incitent à boire.", "r": "Les pots internes et les apéros entre collègues."}, {"s": 1, "n": "Intérimaires positifs", "q": "Expliquer pourquoi les intérimaires sont plus souvent positifs aux dépistages.", "r": "Horaires décalés, isolement, logements temporaires : ces facteurs liés à l'environnement favorisent les consommations."}, {"s": 2, "n": "Synapse", "q": "Qu'est-ce qu'une synapse ?", "r": "La zone de communication entre deux neurones."}, {"s": 2, "n": "Neurotransmetteur", "q": "Quel est le rôle du neurotransmetteur ?", "r": "Libéré par le premier neurone, il traverse la synapse et se fixe sur les récepteurs du deuxième."}, {"s": 2, "n": "Message nerveux", "q": "Décrire le passage du message nerveux d'un neurone à l'autre.", "r": "Le neurone émetteur libère la dopamine dans la synapse ; elle se fixe sur les récepteurs du neurone récepteur ; le message repart."}, {"s": 2, "n": "Dopamine", "q": "Que procure la libération de dopamine ?", "r": "Un afflux de plaisir."}, {"s": 2, "n": "Circuit de la récompense", "q": "Qu'est-ce que le circuit de la récompense ?", "r": "Un ensemble de neurones impliqué dans le plaisir, la motivation et le renforcement des comportements."}, {"s": 2, "n": "Substances psychoactives", "q": "Comment les substances psychoactives agissent-elles sur le cerveau ?", "r": "Elles libèrent la dopamine, qui active le circuit de la récompense."}, {"s": 2, "n": "Continuer de consommer", "q": "Que demande la substance au cerveau, en contrepartie du plaisir ?", "r": "De continuer de consommer."}, {"s": 2, "n": "Manque", "q": "Qu'est-ce qui crée un manque chez la personne dépendante ?", "r": "L'absence de substance ou de stimulation."}, {"s": 2, "n": "Cannabis chaque soir", "q": "Expliquer pourquoi une personne qui fume du cannabis chaque soir a de plus en plus de mal à s'arrêter.", "r": "Le cannabis libère la dopamine : le plaisir pousse à recommencer ; chez la personne dépendante, l'absence de produit crée un manque."}, {"s": 2, "n": "Sans produit", "q": "Relever un comportement sans produit qui agit sur le circuit de la récompense.", "r": "Les jeux de hasard et d'argent."}, {"s": 2, "n": "Dépendance", "q": "La dépendance est-elle automatique ?", "r": "Non : c'est une perte de contrôle de l'usage, poursuivi malgré ses conséquences négatives."}, {"s": 3, "n": "Alcool et cerveau", "q": "Relever la phrase qui montre que l'alcool agit sur le cerveau.", "r": "« L'alcool est un produit psychoactif, c'est-à-dire qui a un effet direct sur le cerveau. »"}, {"s": 3, "n": "Effets immédiats de l'alcool", "q": "Que l'alcool affecte-t-il rapidement, même à petite dose ?", "r": "Les réflexes, la vigilance et la capacité de jugement."}, {"s": 3, "n": "Effets d'une prise de cannabis", "q": "Citer deux effets d'une prise de cannabis.", "r": "Deux parmi : euphorie modérée, somnolence, mémoire à court terme affaiblie, troubles de l'attention."}, {"s": 3, "n": "Long terme : alcool", "q": "Citer deux maladies que l'alcool peut provoquer à long terme.", "r": "Deux parmi : maladies digestives, neurologiques ou cardiovasculaires, cancers, troubles cognitifs."}, {"s": 3, "n": "Long terme : cannabis", "q": "Citer deux effets d'une consommation régulière de cannabis.", "r": "Deux parmi : fatigue physique et intellectuelle, difficultés de concentration et de mémorisation, humeur dépressive."}, {"s": 3, "n": "Immédiat ou long terme", "q": "Distinguer effets immédiats et effets à long terme.", "r": "Immédiats : juste après la consommation. À long terme : après des consommations répétées ou prolongées."}, {"s": 3, "n": "Accident mortel", "q": "Comparer le risque d'être responsable d'un accident mortel avec l'alcool et avec l'alcool associé au cannabis.", "r": "Alcool : × 17,8 ; alcool et cannabis : × 29. Le risque est beaucoup plus élevé avec les deux produits.", "dit": "Comparer le risque d'être responsable d'un accident mortel avec l'alcool et avec l'alcool associé au cannabis.|Alcool : fois 17,8 ; alcool et cannabis : fois 29. Le risque est beaucoup plus élevé avec les deux produits."}, {"s": 3, "n": "Cannabis au volant", "q": "Par combien le cannabis seul multiplie-t-il le risque d'être responsable d'un accident mortel ?", "r": "Par 1,65."}, {"s": 3, "n": "Polyconsommation", "q": "Qu'est-ce que la polyconsommation ?", "r": "La consommation de plusieurs produits ; les risques augmentent."}, {"s": 3, "n": "Danger au volant", "q": "Expliquer le danger de la polyconsommation pour un salarié qui conduit.", "r": "L'alcool baisse les réflexes, le cannabis trouble l'attention : associés, ils multiplient le risque par 29."}, {"s": 3, "n": "Conséquences", "q": "Citer une conséquence personnelle, une sociale et une professionnelle d'une addiction.", "r": "Personnelle : humeur dépressive. Sociale : disputes avec l'entourage. Professionnelle : perte d'emploi."}, {"s": 3, "n": "Arrêts de travail", "q": "Comment une consommation régulière de cannabis agit-elle sur les arrêts de travail ?", "r": "Le risque d'un arrêt de courte durée dans les 12 mois augmente d'environ 60 %."}, {"s": 3, "n": "Accidents du travail", "q": "Quand le risque d'accidents du travail graves est-il multiplié par 2 ?", "r": "En cas de consommation d'alcool hebdomadaire excessive."}, {"s": 4, "n": "Licite ou illicite", "q": "Classer l'alcool, le cannabis, la nicotine et la cocaïne.", "r": "Licites : l'alcool, la nicotine. Illicites : le cannabis, la cocaïne."}, {"s": 4, "n": "Vente aux mineurs", "q": "Que dit l'article L. 3342-1 du Code de la santé publique ?", "r": "La vente des boissons alcooliques à des mineurs est interdite.", "dit": "Que dit l'article L 3342 tiret 1 du Code de la santé publique ?|La vente des boissons alcooliques à des mineurs est interdite."}, {"s": 4, "n": "Permis probatoire", "q": "À partir de quel taux d'alcool un conducteur en permis probatoire est-il en infraction ?", "r": "0,20 gramme par litre de sang ; 0,50 g/L pour les autres conducteurs.", "dit": "À partir de quel taux d'alcool un conducteur en permis probatoire est-il en infraction ?|0,20 gramme par litre de sang ; 0,50 gramme par litre pour les autres conducteurs."}, {"s": 4, "n": "0,80 g/L", "q": "Quelle peine encourt un conducteur à 0,80 g/L d'alcool ou plus ?", "r": "Trois ans d'emprisonnement et 9 000 € d'amende.", "dit": "Quelle peine encourt un conducteur à 0,80 gramme par litre d'alcool ou plus ?|Trois ans d'emprisonnement et 9 000 € d'amende."}, {"s": 4, "n": "Conduite et stupéfiants", "q": "Quelle peine encourt une personne qui conduit après usage de stupéfiants ?", "r": "Trois ans d'emprisonnement et 9 000 € d'amende."}, {"s": 4, "n": "L'intérimaire contrôlé", "q": "Indiquer les peines encourues par l'intérimaire positif au cannabis, avec 0,60 g/L d'alcool.", "r": "Cinq ans d'emprisonnement et 15 000 € d'amende.", "dit": "Indiquer les peines encourues par l'intérimaire positif au cannabis, avec 0,60 gramme par litre d'alcool.|Cinq ans d'emprisonnement et 15 000 € d'amende."}, {"s": 4, "n": "Usage de stupéfiants", "q": "Quelle peine prévoit l'article L. 3421-1 pour l'usage illicite de stupéfiants ?", "r": "Un an d'emprisonnement et 3 750 € d'amende ; l'action publique peut être éteinte par une amende forfaitaire de 500 €.", "dit": "Quelle peine prévoit l'article L 3421 tiret 1 pour l'usage illicite de stupéfiants ?|Un an d'emprisonnement et 3 750 € d'amende ; l'action publique peut être éteinte par une amende forfaitaire de 500 €."}, {"s": 4, "n": "L'alcool au travail", "q": "Quelles boissons alcoolisées l'article R. 4228-20 autorise-t-il sur le lieu de travail ?", "r": "Seulement le vin, la bière, le cidre et le poiré.", "dit": "Quelles boissons alcoolisées l'article R 4228 tiret 20 autorise-t-il sur le lieu de travail ?|Seulement le vin, la bière, le cidre et le poiré."}, {"s": 4, "n": "Règlement intérieur", "q": "Que peut prévoir le règlement intérieur ?", "r": "Une limitation voire une interdiction de l'alcool, l'encadrement des pots, la liste des postes soumis au dépistage."}, {"s": 4, "n": "Document unique", "q": "Où l'employeur doit-il inscrire le risque lié aux pratiques addictives ?", "r": "Dans le document unique, avec une démarche de prévention collective associée à la prise en charge des cas individuels."}, {"s": 4, "n": "Prévention ou répression", "q": "Distinguer prévention et répression.", "r": "Prévention : éviter l'addiction ou ses dommages. Répression : sanctionner."}, {"s": 4, "n": "Prévention collective", "q": "Proposer une mesure de prévention collective pour tous les salariés.", "r": "Une parmi : fournir des boissons sans alcool lors des pots ; inscrire le risque au document unique ; informer tous les salariés, intérimaires compris."}, {"s": 4, "n": "Prévention individuelle", "q": "Proposer une mesure de prévention individuelle à un intérimaire en horaires décalés.", "r": "Une parmi : ne jamais conduire après avoir bu ou consommé du cannabis ; appeler Drogues Info Service ; consulter un CSAPA."}, {"s": 4, "n": "Les aides", "q": "Citer deux services d'aide avec leur numéro.", "r": "Deux parmi : Drogues Info Service, 0 800 23 13 13 ; Alcool Info Service, 0 980 980 930 ; Tabac Info Service, 39 89."}, {"s": 4, "n": "CSAPA", "q": "Que propose un CSAPA ?", "r": "Une aide médicale, psychologique et sociale, par une équipe de différents professionnels."}, {"s": 4, "n": "Justifier", "q": "Justifier une mesure collective à partir des conditions de travail de l'article.", "r": "Horaires décalés, pots et isolement favorisent les consommations : l'employeur inscrit ce risque au document unique et organise une prévention collective."}];

const $=id=>document.getElementById(id);
let seance=0,paquet=[],pos=0,retournee=false;
const reduit=matchMedia("(prefers-reduced-motion: reduce)").matches;
const pointeurFin=matchMedia("(hover:hover) and (pointer:fine)").matches;

/* ===== Paquet ===== */
function charger(melanger=false){
  paquet=CARTES.filter(c=>!seance||c.s===seance);
  if(melanger){paquet=paquet.slice();for(let i=paquet.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[paquet[i],paquet[j]]=[paquet[j],paquet[i]]}}
  pos=0;afficher();
}
function afficher(){
  const c=paquet[pos];
  poser(false);
  // on change le texte à mi-chemin si la carte était retournée
  $("q").textContent=c.q;$("r").textContent=c.r;$("n").textContent=c.n;
  $("sQ").textContent=$("sR").textContent=TITRES[c.s];
  $("num").textContent=`${pos+1} / ${paquet.length}`;
  $("barre").style.width=((pos+1)/paquet.length*100)+"%";
  $("prec").disabled=pos===0;$("suiv").disabled=pos===paquet.length-1;
  annoncer(`Carte ${pos+1} sur ${paquet.length}. ${c.q}`);
}
function poser(v){retournee=v;$("carte").classList.toggle("retournee",v);$("bRet").textContent=v?"Revoir la question":"Retourner la carte"}
function retourner(){poser(!retournee);if(retournee)annoncer("Réponse : "+paquet[pos].r)}
function aller(d){
  const n=pos+d;if(n<0||n>=paquet.length)return;
  arreterVoix();
  if(retournee){poser(false);setTimeout(()=>{pos=n;afficher()},reduit?0:260)}
  else{pos=n;afficher()}
}
function annoncer(t){$("annonce").textContent=t}

/* ===== Filtres ===== */
function filtres(){
  const f=$("filtres");f.innerHTML="";
  [[0,"Tout le module"],[1,"Séance 1"],[2,"Séance 2"],[3,"Séance 3"],[4,"Séance 4"]].forEach(([v,t])=>{
    const b=document.createElement("button");b.className="puce";b.textContent=t;b.setAttribute("aria-pressed",v===seance);
    b.onclick=()=>{seance=v;filtres();arreterVoix();charger()};f.appendChild(b);
  });
}

/* ===== Tilt 3D + reflet ===== */
const tilt=$("tilt"),pile=$("pile");
if(pointeurFin&&!reduit){
  pile.addEventListener("pointermove",e=>{
    const b=pile.getBoundingClientRect();
    const x=(e.clientX-b.left)/b.width, y=(e.clientY-b.top)/b.height;
    tilt.classList.add("actif");
    tilt.style.transform=`rotateX(${(0.5-y)*14}deg) rotateY(${(x-0.5)*16}deg) translateZ(10px)`;
    // reflet : on inverse x sur la face arrière (retournée)
    document.querySelectorAll(".reflet").forEach((r,i)=>{
      r.style.setProperty("--gx",((i===1?1-x:x)*100)+"%");r.style.setProperty("--gy",(y*100)+"%");
    });
  });
  pile.addEventListener("pointerleave",()=>{tilt.classList.remove("actif");tilt.style.transform=""});
}

/* ===== Balayage tactile ===== */
let x0=null,y0=null,glisse=false;
pile.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;glisse=false},{passive:true});
pile.addEventListener("touchmove",e=>{
  if(x0===null)return;const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;
  if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)){glisse=true;if(!reduit)tilt.style.transform=`translateX(${dx*.35}px) rotateY(${dx*.04}deg)`}
},{passive:true});
pile.addEventListener("touchend",e=>{
  if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;
  tilt.style.transform="";
  if(glisse&&Math.abs(dx)>60)aller(dx<0?1:-1);
  x0=null;
});

/* ===== Voix (optionnelle) ===== */
let voix=null;
function choisirVoix(){const v=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));voix=v.find(x=>/fr-FR/i.test(x.lang)&&/(google|natural|online|amélie|thomas|denise|henri)/i.test(x.name))||v.find(x=>/fr-FR/i.test(x.lang))||v[0]||null}
if("speechSynthesis" in window){choisirVoix();speechSynthesis.onvoiceschanged=choisirVoix}
else document.querySelectorAll(".voix").forEach(b=>b.hidden=true);
function lire(cote){
  if(!("speechSynthesis" in window))return;
  const c=paquet[pos],p=(c.dit||"").split("|");
  const t=cote==="q"?(p[0]||c.q):(p[1]||c.r);
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voix)u.voice=voix;u.rate=.95;speechSynthesis.speak(u);
}
function arreterVoix(){if("speechSynthesis" in window)speechSynthesis.cancel()}
document.querySelectorAll(".voix").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();lire(b.dataset.cote)}));

/* ===== Événements ===== */
$("carte").addEventListener("click",()=>{if(!glisse)retourner()});
$("carte").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();retourner()}});
$("bRet").onclick=retourner;
$("prec").onclick=()=>aller(-1);
$("suiv").onclick=()=>aller(1);
$("melange").onclick=()=>{arreterVoix();charger(true);annoncer("Cartes mélangées.")};
$("debut").onclick=()=>{arreterVoix();if(retournee)poser(false);pos=0;afficher()};
document.addEventListener("keydown",e=>{
  if(e.target.closest("button")&&(e.key===" "||e.key==="Enter"))return;
  if(e.key===" "){e.preventDefault();retourner()}
  else if(e.key==="ArrowRight")aller(1);
  else if(e.key==="ArrowLeft")aller(-1);
});
if(!pointeurFin)document.querySelector(".tactile").textContent="Glisse la carte vers la gauche ou la droite pour changer.";

filtres();charger();
</script>
</body>
</html>
