  <div id="exo"></div>
  <footer>Entraînement CAPa — SESG · CG1.2 · CCF2 · <b>mapse.fr</b></footer>
</div>

<script>
window.CALC = {
  titre: "Calcule ton budget — comme au CCF2",
  kicker: "Exercice · CAP agricole — SESG",
  chips: ["CG1.2", "CCF2", "Calcul guidé"],
  cle: "sesg_calculs",
  consigne: "Pose le calcul, écris ta réponse (chiffres seulement, la virgule est acceptée), puis <b>Vérifier</b>. Que ta réponse soit juste ou fausse, la <b>méthode complète</b> s'affiche : c'est elle qu'il faut savoir refaire au CCF2.",
  sigles: [
    { sigle:"SMIC", sens:"salaire minimum interprofessionnel de croissance : le salaire horaire minimum fixé par l'État." },
    { sigle:"TVA",  sens:"taxe sur la valeur ajoutée : l'impôt déjà compris dans le prix des achats." },
    { sigle:"RSA",  sens:"revenu de solidarité active : un revenu minimum pour les personnes aux ressources très faibles." },
    { sigle:"CAF",  sens:"caisse d'allocations familiales : elle verse les aides (allocations, RSA, aide au logement)." },
    { sigle:"MSA",  sens:"mutualité sociale agricole : la protection sociale du régime agricole (équivalent CAF + Assurance Maladie)." }
  ],
  questions: [
    {
      enonce: "Un ménage a 1 575 € de ressources et 1 463 € de dépenses ce mois-ci. Calcule son solde.",
      reponse: 112, unite: "€", tolerance: 0,
      aide: "Solde = ce qui rentre − ce qui sort.",
      methode: ["Solde = ressources − dépenses", "1 575 − 1 463", "= 112 €"],
      pourquoi: "Le solde dit s'il <b>reste</b> de l'argent (positif) ou s'il en <b>manque</b> (déficit). Ici +112 € : le budget est équilibré."
    },
    {
      enonce: "Le loyer est de 620 €, pour un revenu de 1 575 €. Calcule le taux d'effort (la part du revenu que prend le logement), en %.",
      reponse: 39.4, unite: "%", tolerance: 1,
      aide: "Taux d'effort = loyer ÷ revenu × 100.",
      methode: ["Taux d'effort = loyer ÷ revenu × 100", "620 ÷ 1 575 × 100", "= 39,4 %"],
      pourquoi: "Au-delà d'environ <b>33 à 35 %</b>, le logement pèse trop lourd. Ici 39 %, c'est déjà élevé : il reste peu pour le reste."
    },
    {
      enonce: "Un pot de sauce de 250 g coûte 2,60 €. Calcule son prix au kilo (en €/kg).",
      reponse: 10.40, unite: "€/kg", tolerance: 0.05,
      aide: "Prix au kilo = prix ÷ masse en kilos. 250 g = 0,250 kg.",
      methode: ["Prix au kilo = prix ÷ masse (en kg)", "250 g = 0,250 kg", "2,60 ÷ 0,250", "= 10,40 €/kg"],
      pourquoi: "Ramener au kilo permet de comparer deux produits <b>quelle que soit la taille du paquet</b> : c'est ça, la vraie bonne affaire."
    },
    {
      enonce: "Un salarié gagne 2 100 € brut. Les cotisations salariales retirent 21 %. Calcule son salaire net avant impôt.",
      reponse: 1659, unite: "€", tolerance: 1,
      aide: "Calcule d'abord les cotisations (2 100 × 21 %), puis retire-les du brut.",
      methode: ["Cotisations = 2 100 × 21 % = 441 €", "Net = brut − cotisations", "2 100 − 441", "= 1 659 €"],
      pourquoi: "Tout salaire, même au <b>SMIC</b>, subit ces cotisations : le <b>net</b> (versé) est toujours inférieur au <b>brut</b> (écrit dans le contrat)."
    },
    {
      enonce: "Un contrat est de 24 h par semaine. Calcule le nombre d'heures payées par mois (formule : heures × 52 ÷ 12).",
      reponse: 104, unite: "h", tolerance: 0,
      aide: "On multiplie par 52 semaines, puis on divise par 12 mois.",
      methode: ["Heures/mois = heures par semaine × 52 ÷ 12", "24 × 52 ÷ 12", "= 104 h"],
      pourquoi: "On fait <b>× 52 ÷ 12</b>, jamais « × 4 » : un mois compte un peu plus de 4 semaines, donc « × 4 » sous-estime les heures et le salaire."
    }
  ]
};
</script>
