<script>
window.EXO = {
  titre: "QCM — Insertion dans l'entreprise (MP1)",
  kicker: "Exercice · CAP agricole — MP1",
  chips: ["CG3.2", "CCF6", "10 questions"],
  cle: "mp1_qcm",
  questions: [
    {
      q: "Une entreprise individuelle repose sur…",
      options: [
        "une personne morale",
        "une personne physique",
        "au moins deux associés",
        "une société commerciale"
      ],
      correct: 1,
      explication: "L'entreprise individuelle repose sur une personne physique : un être humain qui exerce en son propre nom. La SARL, l'EARL ou le GAEC sont, elles, des personnes morales."
    },
    {
      q: "Pour un salarié paysagiste, quel organisme assure la protection sociale (santé, retraite, accidents du travail) ?",
      options: [
        "France Travail",
        "la chambre d'agriculture",
        "la MSA",
        "l'APECITA"
      ],
      correct: 2,
      explication: "La MSA (Mutualité sociale agricole) est le régime de sécurité sociale du monde agricole : elle couvre le salarié pour la santé, la retraite, la famille et les accidents du travail."
    },
    {
      q: "À partir de combien de salariés le règlement intérieur devient-il obligatoire dans une entreprise ?",
      options: [
        "11 salariés",
        "50 salariés",
        "6 salariés",
        "100 salariés"
      ],
      correct: 1,
      explication: "Le règlement intérieur est obligatoire à partir de 50 salariés. À 11 salariés, c'est le CSE (comité social et économique) qui devient obligatoire."
    },
    {
      q: "Le lien de subordination donne à l'employeur trois pouvoirs. Lesquels ?",
      options: [
        "fixer le SMIC, embaucher, licencier",
        "donner des ordres, contrôler, sanctionner",
        "produire, vendre, acheter",
        "recruter, former, rémunérer"
      ],
      correct: 1,
      explication: "L'employeur peut donner des ordres, contrôler le travail et sanctionner un manquement. Ces trois pouvoirs réunis distinguent un salarié d'un travailleur indépendant."
    },
    {
      q: "Parmi les contrats de travail, lequel est considéré comme la « forme normale » ?",
      options: [
        "le CDD",
        "le contrat d'intérim",
        "le CDI",
        "le contrat d'apprentissage"
      ],
      correct: 2,
      explication: "Le CDI (contrat à durée indéterminée) est la forme normale du contrat de travail : toute autre forme — CDD, alternance, intérim — doit être justifiée."
    },
    {
      q: "Quel est le SMIC brut de l'heure au 1ᵉʳ juin 2026 ?",
      options: [
        "11,88 €",
        "12,31 €",
        "10,25 €",
        "13,00 €"
      ],
      correct: 1,
      explication: "Le SMIC brut est de 12,31 € de l'heure, soit environ 1 867,02 € brut par mois pour 35 h par semaine (151,67 h)."
    },
    {
      q: "Sur un bulletin de paie, comment passe-t-on du salaire brut au salaire net ?",
      options: [
        "en ajoutant les cotisations patronales",
        "en retirant les cotisations salariales",
        "en retirant la TVA",
        "en ajoutant les primes"
      ],
      correct: 1,
      explication: "Le salaire net s'obtient en retirant du brut les cotisations salariales. Les cotisations patronales, elles, sont payées en plus par l'employeur et n'apparaissent pas en déduction du net."
    },
    {
      q: "Dans la prévention des risques, dans quel ordre applique-t-on les protections ?",
      options: [
        "d'abord l'EPI, puis la protection collective",
        "supprimer le risque, protection collective, puis EPI",
        "EPI, suppression du risque, protection collective",
        "protection collective, EPI, puis suppression du risque"
      ],
      correct: 1,
      explication: "On cherche d'abord à supprimer le risque, puis à installer une protection collective ; l'EPI (protection individuelle) n'intervient qu'en dernier, jamais en premier."
    },
    {
      q: "En cas d'accident, quel numéro d'urgence permet d'alerter par SMS une personne sourde ou malentendante ?",
      options: [
        "le 15",
        "le 18",
        "le 112",
        "le 114"
      ],
      correct: 3,
      explication: "Le 114 s'utilise par SMS pour les personnes sourdes ou malentendantes. Le 15 est le SAMU, le 18 les pompiers et le 112 le numéro européen, qui passe même sans réseau de son opérateur."
    },
    {
      q: "Sur combien de points est noté le dossier du CCF6, et combien de temps dure l'oral ?",
      options: [
        "sur 10 points, oral de 20 minutes",
        "sur 20 points, oral de 15 minutes",
        "sur 100 points, oral de 30 minutes",
        "sur 20 points, oral de 45 minutes"
      ],
      correct: 1,
      explication: "Le CCF6 est noté sur 20 points selon six critères. L'oral dure 15 minutes : 5 minutes de présentation puis 10 minutes de questions du jury."
    }
  ]
};
</script>
