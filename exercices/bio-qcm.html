      options: ["203 batt/min", "220 batt/min", "173 batt/min", "185 batt/min"],
      correct: 0,
      explication: "La FMT se calcule avec 220 − âge : 220 − 17 = 203 battements par minute. Elle diminue d'environ un battement par année."
    },
    {
      q: "En pourcentage de la FMT, à quelle zone d'effort correspond une intensité de 60 à 75 % ?",
      options: ["L'endurance", "La résistance", "Le repos", "La zone haute"],
      correct: 0,
      explication: "La fiche situe l'endurance entre 60 et 75 % de la FMT (« on tient longtemps ») ; la résistance vient ensuite, de 75 à 85 %."
    },
    {
      q: "Quel est le pourcentage de dioxygène (O₂) dans l'air expiré ?",
      options: ["≈ 21 %", "≈ 16 %", "≈ 4 %", "≈ 0,04 %"],
      correct: 1,
      explication: "L'air inspiré contient ≈ 21 % de dioxygène et l'air expiré ≈ 16 % : il en reste beaucoup, ce qui rend le bouche-à-bouche efficace."
    },
    {
      q: "Au repos, le cœur bat 70 fois par minute en éjectant 70 mL de sang à chaque battement. Quel est son débit cardiaque ?",
      options: ["4,9 L/min", "16 L/min", "1,4 L/min", "49 L/min"],
      correct: 0,
      explication: "Débit cardiaque = fréquence × volume éjecté = 70 × 70 = 4 900 mL, soit 4,9 L/min. À l'effort, il peut tripler."
    },
    {
      q: "À quoi sert un tendon ?",
      options: [
        "à relier un muscle à un os",
        "à relier deux os entre eux",
        "à lubrifier l'articulation",
        "à amortir les chocs"
      ],
      correct: 0,
      explication: "Le tendon relie un muscle à un os et transmet la traction : le muscle se contracte, le tendon tire, l'os bouge. C'est le ligament qui relie deux os entre eux."
    },
    {
      q: "Quelle lésion correspond à un ligament étiré ou déchiré par une articulation forcée ?",
      options: ["L'entorse", "La tendinite", "L'élongation", "La crampe"],
      correct: 0,
      explication: "L'entorse touche le ligament, étiré ou déchiré quand l'articulation est forcée, et l'articulation gonfle. La tendinite touche le tendon ; l'élongation et la crampe touchent le muscle."
    },
    {
      q: "D'après la fiche, à quoi sert avant tout l'échauffement ?",
      options: [
        "à éviter la blessure",
        "à gagner en performance",

        "à remplacer l'hydratation"
      ],
      correct: 0,
      explication: "La fiche est explicite : « l'échauffement ne fait pas gagner en performance : il fait éviter la blessure » (crampe, élongation, déchirure, entorse)."

      options: ["9 kcal", "4 kcal", "0 kcal", "15 kcal"],
      correct: 0,
      explication: "1 g de lipides = 9 kcal, contre 4 kcal pour 1 g de glucides ou de protéines. C'est le repère « 4 · 4 · 9 »."
