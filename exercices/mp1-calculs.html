<script>
window.CALC = {
  titre: "Calcule ton salaire et tes droits",
  kicker: "Exercice · CAP agricole — MP1",
  chips: ["CG3.2", "CCF6", "Calcul guidé"],
  cle: "mp1_calculs",
  consigne: "Pose le calcul, écris ta réponse (la virgule est acceptée), puis <b>Vérifier</b>. Juste ou faux, la <b>méthode</b> s'affiche : c'est elle qu'il faut savoir refaire.",
  sigles: [
    { sigle:"SMIC", sens:"salaire minimum interprofessionnel de croissance : le salaire horaire minimum fixé par l'État." },
    { sigle:"CDI",  sens:"contrat à durée indéterminée : la forme normale du contrat, sans date de fin." },
    { sigle:"CDD",  sens:"contrat à durée déterminée : contrat écrit, avec un motif et une date de fin." },
    { sigle:"CSE",  sens:"comité social et économique : les représentants du personnel, obligatoires dès 11 salariés." },
    { sigle:"EPI",  sens:"équipement de protection individuelle : casque, gants, chaussures… fournis par l'employeur." }
  ],
  questions: [
    {
      enonce: "Le SMIC est de 12,31 € brut de l'heure. Un temps plein, c'est 151,67 h par mois. Calcule le salaire brut mensuel.",
      reponse: 1867, unite: "€", tolerance: 1,
      aide: "Brut = taux horaire × heures du mois.",
      methode: ["Brut = 12,31 × 151,67", "≈ 1 867 €"],
      pourquoi: "Le <b>SMIC</b> horaire fixé par l'État donne, pour 35 h par semaine (151,67 h/mois), le SMIC mensuel <b>brut</b>."
    },
    {
      enonce: "Un salarié gagne 1 867 € brut. Les cotisations salariales retirent 21 %. Calcule son salaire net (approché).",
      reponse: 1475, unite: "€", tolerance: 10,
      aide: "Calcule d'abord les cotisations (1 867 × 21 %), puis retire-les du brut.",
      methode: ["Cotisations = 1 867 × 21 % ≈ 392 €", "Net = brut − cotisations", "1 867 − 392", "≈ 1 475 €"],
      pourquoi: "Le <b>net</b> (versé sur le compte) vaut environ <b>79 %</b> du <b>brut</b> : environ 21 % partent en cotisations (santé, retraite, chômage…)."
    },
    {
      enonce: "Un contrat est de 30 h par semaine. Calcule le nombre d'heures payées par mois (formule : heures × 52 ÷ 12).",
      reponse: 130, unite: "h", tolerance: 0,
      aide: "× 52 semaines, ÷ 12 mois.",
      methode: ["Heures/mois = 30 × 52 ÷ 12", "1 560 ÷ 12", "= 130 h"],
      pourquoi: "On fait <b>× 52 ÷ 12</b>, jamais « × 4 » : un mois compte un peu plus de 4 semaines."
    },
    {
      enonce: "On acquiert 2,5 jours de congés payés par mois travaillé. Calcule le nombre de jours pour une année complète (12 mois).",
      reponse: 30, unite: "jours", tolerance: 0,
      aide: "2,5 par mois, sur 12 mois.",
      methode: ["Jours = 2,5 × 12", "= 30 jours ouvrables", "(soit 5 semaines)"],
      pourquoi: "<b>2,5 j × 12 = 30 jours ouvrables = 5 semaines</b> de congés payés par an, un droit garanti par la loi."
    },
    {
      enonce: "Un salarié au SMIC (1 867 € brut) reçoit une prime de 5 %. Calcule le montant de la prime.",
      reponse: 93.35, unite: "€", tolerance: 1,
      aide: "5 %, c'est × 0,05.",
      methode: ["Prime = 1 867 × 5 %", "1 867 × 0,05", "= 93,35 €"],
      pourquoi: "Savoir calculer un <b>pourcentage d'un salaire</b> est essentiel pour vérifier sa paie (prime, cotisations, augmentation)."
    }
  ]
};
</script>
