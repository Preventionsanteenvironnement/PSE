<script>
window.CALC = {
  titre: "Calcule le corps à l'effort",
  kicker: "Exercice · CAP agricole — Biologie",
  chips: ["CG2.2", "CCF4", "Calcul guidé"],
  cle: "bio_calculs",
  consigne: "Pose le calcul, écris ta réponse (la virgule est acceptée), puis <b>Vérifier</b>. Juste ou faux, la <b>méthode</b> s'affiche : c'est elle qu'il faut savoir refaire.",
  sigles: [
    { sigle:"FMT", sens:"fréquence maximale théorique : le nombre maximal de battements du cœur par minute (à ne pas dépasser durablement)." },
    { sigle:"FC",  sens:"fréquence cardiaque : le nombre de battements du cœur par minute." },
    { sigle:"kcal",sens:"kilocalorie : l'unité qui mesure l'énergie apportée par un aliment." }
  ],
  questions: [
    {
      enonce: "Un élève a 17 ans. Calcule sa fréquence maximale théorique (FMT), en battements par minute. Formule : FMT = 220 − âge.",
      reponse: 203, unite: "batt/min", tolerance: 0,
      aide: "Il suffit d'une soustraction.",
      methode: ["FMT = 220 − âge", "220 − 17", "= 203 batt/min"],
      pourquoi: "La <b>FMT</b> sert à calculer ses zones d'effort. On ne s'entraîne jamais longtemps à 100 % de la FMT : c'est le maximum, pas un objectif."
    },
    {
      enonce: "Sa FMT est de 203 batt/min. Calcule la borne basse de la zone d'endurance, à 60 % de la FMT.",
      reponse: 121.8, unite: "batt/min", tolerance: 2,
      aide: "60 %, c'est × 0,60.",
      methode: ["60 % de 203 = 203 × 0,60", "= 121,8", "≈ 122 batt/min"],
      pourquoi: "La <b>zone d'endurance</b> (60 à 75 % de la FMT) est celle où l'on progresse sans s'épuiser : c'est là qu'il faut travailler la plupart du temps."
    },
    {
      enonce: "Au repos, le cœur bat 70 fois par minute et éjecte 70 mL de sang à chaque battement. Calcule le débit cardiaque, en litres par minute.",
      reponse: 4.9, unite: "L/min", tolerance: 0.1,
      aide: "Débit = fréquence × volume par battement. Pense à convertir les mL en L.",
      methode: ["Débit = FC × volume par battement", "70 × 70 = 4 900 mL", "4 900 mL = 4,9 L", "= 4,9 L/min"],
      pourquoi: "À l'effort, ce débit peut <b>tripler</b> (jusqu'à ~16 L/min) pour apporter plus de dioxygène aux muscles."
    },
    {
      enonce: "Tu comptes 33 battements en 15 secondes. Calcule ta fréquence cardiaque sur une minute.",
      reponse: 132, unite: "batt/min", tolerance: 0,
      aide: "Une minute = 4 fois 15 secondes.",
      methode: ["FC/min = battements sur 15 s × 4", "33 × 4", "= 132 batt/min"],
      pourquoi: "On compte sur <b>15 s puis × 4</b> : c'est plus rapide et plus fiable que de compter une minute entière."
    },
    {
      enonce: "Une portion apporte 30 g de glucides. Sachant qu'1 g de glucides apporte 4 kcal, calcule l'énergie apportée.",
      reponse: 120, unite: "kcal", tolerance: 0,
      aide: "Énergie = quantité × apport par gramme.",
      methode: ["Énergie = 30 × 4", "= 120 kcal"],
      pourquoi: "Repère à connaître : <b>glucides et protéines = 4 kcal/g</b>, <b>lipides = 9 kcal/g</b>. Les lipides sont les plus énergétiques."
    }
  ]
};
</script>
<script src="calcul.js"></script>
