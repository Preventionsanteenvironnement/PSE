<script>
window.EXO = {
  titre: "QCM — Budget, revenus, consommation",
  kicker: "Exercice · CAP agricole — SESG",
  chips: ["CG1.2", "CCF2", "10 questions"],
  cle: "sesg_budget_qcm",
  questions: [
    {
      q: "Au sens de l'INSEE, un « ménage », c'est…",
      options: [
        "une famille avec un lien de parenté",
        "l'ensemble des personnes vivant dans un même logement",
        "un couple marié uniquement",
        "les personnes qui partagent un compte bancaire"
      ],
      correct: 1,
      explication: "C'est l'ensemble des occupants d'un même logement, avec ou sans lien de parenté : une colocation ou une personne seule sont des ménages."
    },
    {
      q: "Quel est le SMIC brut de l'heure depuis le 1ᵉʳ juin 2026 ?",
      options: ["11,88 €", "12,31 €", "13,50 €", "10,25 €"],
      correct: 1,
      explication: "12,31 € brut/heure, soit environ 1 867,02 € brut par mois pour 35 h (151,67 h)."
    },
    {
      q: "Sur un bulletin de paie, quelle ligne recopie-t-on pour déclarer ses ressources à la CAF ou à la MSA ?",
      options: ["Le total brut", "Le net à payer", "Le montant net social", "Le net imposable"],
      correct: 2,
      explication: "C'est le montant net social, une ligne obligatoire depuis 2023, spécialement prévue pour les déclarations d'aides."
    },
    {
      q: "Un loyer perçu pour un logement que l'on possède est un revenu…",
      options: ["du travail", "du capital", "de transfert", "en nature"],
      correct: 1,
      explication: "Un loyer vient d'un bien que l'on possède : c'est un revenu du capital (foncier). Le RSA serait un revenu de transfert, une voiture de fonction un revenu en nature."
    },
    {
      q: "Au-delà de quel taux d'effort / d'endettement dit-on qu'un budget devient à risque ?",
      options: ["10 %", "20 %", "35 %", "60 %"],
      correct: 2,
      explication: "Au-delà d'environ 35 % de ses revenus consacrés aux crédits et charges fixes, le budget est fragilisé."
    },
    {
      q: "Depuis 2025, un logement classé G au DPE…",
      options: [
        "ne peut plus être mis en location",
        "coûte moins cher à chauffer",
        "est le plus économe",
        "doit obligatoirement être vendu"
      ],
      correct: 0,
      explication: "G est une passoire thermique : sa location est interdite depuis le 1ᵉʳ janvier 2025. F suivra en 2028, E en 2034."
    },
    {
      q: "Après un achat sur internet, de combien de jours dispose-t-on pour se rétracter, sans se justifier ?",
      options: ["48 heures", "7 jours", "14 jours", "30 jours"],
      correct: 2,
      explication: "14 jours à distance (internet, téléphone), à compter de la réception. En magasin, ce droit n'existe pas."
    },
    {
      q: "Quel est le taux normal de la TVA en France ?",
      options: ["5,5 %", "10 %", "20 %", "33 %"],
      correct: 2,
      explication: "20 % est le taux normal. Il existe aussi 10 %, 5,5 % (produits de première nécessité) et 2,1 %."
    },
    {
      q: "Un pot de 250 g coûte 2,60 €. Quel est son prix au kilo ?",
      options: ["6,50 €/kg", "10,40 €/kg", "2,60 €/kg", "26 €/kg"],
      correct: 1,
      explication: "2,60 ÷ 0,250 = 10,40 €/kg. Comparer au kilo permet de repérer la vraie bonne affaire."
    },
    {
      q: "Un appareil neuf tombe en panne. Pendant combien de temps la garantie légale de conformité protège-t-elle l'acheteur ?",
      options: ["6 mois", "1 an", "2 ans", "5 ans"],
      correct: 2,
      explication: "La garantie légale de conformité couvre 2 ans à partir de la livraison, sans frais pour l'acheteur."
    }
  ]
};
</script>
