<script>
window.EXO = {
  titre: "QCM — Éducation socioculturelle (ESC)",
  kicker: "Exercice · CAP agricole — ESC",
  chips: ["CG1.1", "CCF1", "10 questions"],
  cle: "esc_qcm",
  questions: [
    {
      q: "Une information qui circule sans auteur identifiable, sans date et sans source vérifiable, c'est…",
      options: [
        "un fait",
        "une opinion",
        "une rumeur",
        "une source"
      ],
      correct: 2,
      explication: "C'est la définition de la rumeur : elle circule de personne à personne, sans auteur, sans date et sans source vérifiable. Un fait, lui, se retrouve dans une source."
    },
    {
      q: "À propos du même chantier, un journal titre « 70 % des arbres conservés » et un réseau social « 30 % des arbres abattus » (240 arbres au total, 168 conservés). Que faut-il en penser ?",
      options: [
        "Les deux titres sont exacts : chacun choisit un angle et ne dit pas tout",
        "L'un des deux titres ment forcément",
        "Seul le titre le plus partagé est vrai",
        "Aucun des deux n'est vérifiable"
      ],
      correct: 0,
      explication: "Les deux titres sont exacts : sur 240 arbres, 168 conservés font bien 70 % et 72 abattus 30 %. Chacun choisit un angle ; pour comprendre, on remonte aux chiffres complets de la source."
    },
    {
      q: "D'après la fiche, ce qu'une publicité vend le plus souvent, c'est…",
      options: [
        "les qualités techniques précises du produit",
        "toujours le prix et la composition",
        "une image, un rêve, plus qu'une information",
        "une garantie de qualité et d'origine"
      ],
      correct: 2,
      explication: "Une publicité ne décrit presque jamais le produit : elle vend ce que tu auras l'air d'être en le portant — un rêve (réussite, beauté, liberté, appartenance), pas une information."
    },
    {
      q: "Depuis 2023, sur les réseaux sociaux, une publication rémunérée…",
      options: [
        "peut rester discrète tant qu'elle est sincère",
        "doit porter une mention claire et visible pendant toute sa durée (Publicité, Partenariat…)",
        "est réservée aux marques françaises",
        "est totalement interdite"
      ],
      correct: 1,
      explication: "C'est la loi depuis 2023 : une recommandation rémunérée doit être signalée (Publicité, Collaboration commerciale, Sponsorisé, Partenariat). L'absence de mention est punie jusqu'à deux ans de prison et 300 000 € d'amende."
    },
    {
      q: "Dire « le métier de jardinier paysagiste, c'est juste de la tonte », c'est énoncer…",
      options: [
        "une représentation, démentie par les compétences réelles du métier",
        "un fait vérifié dans une source officielle",
        "une règle de sécurité obligatoire",
        "une opinion qui rapporte des points à l'examen"
      ],
      correct: 0,
      explication: "C'est une représentation, une idée toute faite démentie par les compétences réelles : lire un plan, reconnaître les végétaux, chiffrer un devis et dialoguer avec le client."
    },
    {
      q: "D'après la fiche, ce qui distingue surtout un village d'une ville, ce n'est pas leur « qualité » mais…",
      options: [
        "le nombre d'habitants avant tout",
        "la beauté des paysages",
        "la distance aux ressources et le temps pour les atteindre",
        "le prix des logements uniquement"
      ],
      correct: 2,
      explication: "On mesure un territoire en temps d'accès aux ressources : le village n'a pas « moins de qualité », il a une dépendance à la voiture, et sans permis la plupart des ressources deviennent inaccessibles."
    },
    {
      q: "L'extension des villes et des bourgs vers leur périphérie, le long des axes routiers, qui consomme des terres agricoles, s'appelle…",
      options: [
        "la renaturation",
        "la concertation",
        "la délibération",
        "l'étalement urbain"
      ],
      correct: 3,
      explication: "C'est l'étalement urbain, rendu possible par la généralisation de la voiture ; la renaturation est l'opération inverse, et la délibération est une décision votée par le conseil municipal."
    },
    {
      q: "Selon la fiche « Mes pratiques, mes choix », la part de choix personnel dans une pratique se situe…",
      options: [
        "au moment du déclencheur, ce qui fait commencer",
        "dans la décision de continuer, d'approfondir ou d'arrêter",
        "dans le prix payé pour l'activité",
        "dans le fait de la pratiquer en groupe"
      ],
      correct: 1,
      explication: "Le choix ne se situe pas au déclenchement — qu'on n'a pas choisi — mais dans la suite : continuer, approfondir ou arrêter. Croire que l'origine sociale décide de tout serait du déterminisme."
    },
    {
      q: "La méthode d'argumentation attendue à l'oral s'organise dans l'ordre…",
      options: [
        "exemple → idée → argument",
        "argument → exemple → idée",
        "idée → argument → exemple (« je pense que… parce que… par exemple… »)",
        "une opinion seule, sans justification"
      ],
      correct: 2,
      explication: "On annonce son idée, on donne un argument (« parce que »), puis on l'appuie par un exemple : c'est ce qui distingue un avis argumenté d'une simple impression."
    },
    {
      q: "D'après la Charte de la laïcité, la liberté d'expression des élèves…",
      options: [
        "autorise à attaquer les personnes",
        "s'exerce dans le respect des autres et de leurs convictions",
        "est interdite pendant les cours",
        "oblige chacun à afficher ses convictions"
      ],
      correct: 1,
      explication: "La liberté d'expression permet de dire ce que l'on pense, mais dans un cadre : le respect des autres et de leurs convictions. Elle protège l'expression des idées, pas l'attaque des personnes."
    }
  ]
};
</script>
