<!DOCTYPE html>
<html lang="fr">

<style>
:root{--fond1:#0F3D36;--fond2:#1D5E50;--clair:#F4F8F5;--encre:#13302A;--doux:#5B7A71;--jaune:#FFD23F;--vrai:#2FBF71;--vrai-f:#16733F;--faux:#FF6B57;--faux-f:#B3261E;--ligne:rgba(255,255,255,.22);
  --a:#FFD23F;--f:#7CC4F0;--e:#9BE0B8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--clair);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:1.07rem;line-height:1.5;
  background:radial-gradient(1200px 600px at 15% -10%,rgba(255,210,63,.13),transparent 60%),radial-gradient(900px 700px at 110% 110%,rgba(120,220,180,.14),transparent 60%),linear-gradient(160deg,var(--fond1),var(--fond2));background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--jaune);outline-offset:3px}
.page{max-width:900px;margin:0 auto;padding:1.4rem 1.1rem 3rem}
header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1.9rem,5.5vw,2.8rem);line-height:1.02;margin:0}
header p{margin:.45rem 0 0;opacity:.85;max-width:62ch}
.recette{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:1rem 0;font-weight:700}
.recette span{border-radius:999px;padding:.25rem .8rem;color:#10231C}
.recette .a{background:var(--a)}.recette .f{background:var(--f)}.recette .e{background:var(--e)}
.onglets{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem .1rem .8rem;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.puce{flex:none;border:2px solid var(--ligne);background:rgba(255,255,255,.06);border-radius:999px;padding:.4rem 1rem;font-weight:700}
.puce[aria-pressed="true"]{background:var(--clair);color:var(--encre);border-color:var(--clair)}
.puce .et{color:var(--jaune);margin-left:.3rem}
.puce[aria-pressed="true"] .et{color:#B8860B}
.carte{background:var(--clair);color:var(--encre);border-radius:24px;padding:clamp(1.1rem,3.5vw,1.8rem);box-shadow:0 30px 60px -25px rgba(0,0,0,.6)}
.situation{background:#fff;border:2px solid #C5CEC9;border-radius:14px;padding:.8rem 1rem;margin-bottom:1rem}
.situation b{display:block;margin-bottom:.2rem}
.situation .doc{margin-top:.6rem;padding-top:.6rem;border-top:1px dashed #C5CEC9;font-size:.97rem;color:#39443F}
.num{font-weight:700;color:var(--doux);font-size:.95rem}
.q{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(1.2rem,3.1vw,1.45rem);line-height:1.25;margin:.2rem 0 .8rem}
.q b{font-weight:800;color:#8A6A00}
.q small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-size:.92rem;color:var(--doux);font-weight:700}
.opts{display:grid;gap:.45rem}
.opt{text-align:left;border:2px solid #B9C5BE;background:#fff;border-radius:14px;padding:.7rem .9rem;font-weight:700}
.opt:hover{border-color:var(--encre)}
.opt[aria-pressed="true"]{background:#FFF4C2;border-color:var(--encre)}
.opt:disabled{cursor:default}
.opt.bon{background:#DDF4E7;border-color:var(--vrai-f)}
.opt.mauvais{background:#FFE3DE;border-color:var(--faux-f)}
.phrase{background:#fff;border:3px solid var(--encre);border-radius:16px;padding:1rem;font-family:Fraunces,Georgia,serif;font-size:clamp(1.1rem,3vw,1.3rem);line-height:2}
.slot{display:inline;border-radius:8px;padding:.1rem .45rem;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:700;font-size:1rem;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.slot.vide{background:#E7EEEA;color:#8A958F;border-bottom:3px dashed #8A958F}
.slot.a{background:var(--a)}.slot.f{background:var(--f)}.slot.e{background:var(--e)}
.slot.ici{box-shadow:0 0 0 3px #E0A800}
.blocs{margin-top:1rem}
.blocs h3{margin:0 0 .5rem;font-size:1rem}
.bloc{text-align:left;border:2px solid #B9C5BE;background:#fff;border-radius:14px;padding:.65rem .9rem;font-weight:700;width:100%;margin-bottom:.45rem}
.bloc:hover{border-color:var(--encre)}
.bloc:disabled{cursor:default}
.bloc.mauvais{background:#FFE3DE;border-color:var(--faux-f)}
.fb{margin-top:.7rem;border-radius:14px}
.fb:not(:empty){padding:.7rem .9rem}
.fb.ok{background:#DDF4E7;border-left:6px solid var(--vrai-f)}
.fb.ko{background:#FFE3DE;border-left:6px solid var(--faux-f)}
.valider,.continuer{width:100%;height:56px;border-radius:999px;border:0;background:var(--encre);color:var(--clair);font-weight:700;font-size:1.08rem;margin-top:.9rem}
.valider:disabled{opacity:.4;cursor:default}
.outil{border:2px solid #B9C5BE;background:transparent;border-radius:999px;padding:.3rem .8rem;font-size:.95rem;font-weight:700;margin-top:.8rem}
.etoiles{font-size:2.2rem;color:#E0A800;letter-spacing:.15rem}
.retenir{border:3px solid var(--encre);border-radius:16px;padding:.8rem 1rem;margin-top:.8rem}
.retenir b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.1rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.fil{margin:0 0 .7rem}
.fil a{color:var(--clair);opacity:.85;text-decoration:underline;text-underline-offset:4px;font-size:1rem;padding:.35rem .1rem;display:inline-block}
.fil a:hover{opacity:1}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Justifier comme à l’épreuve</h1>
    <p>Propose, puis construis une justification solide — C6 Bac Pro 1re · C4 Proposer · C5 Justifier</p>
  </header>
  <nav class="fil" aria-label="Fil d'Ariane"><a href="bcp_1ere_C6_jeux.html">← Toutes les révisions C6</a></nav>
  <div class="recette" aria-label="Une bonne justification">Une bonne justification = <span class="a">l'action</span> + <span class="f">un fait de la situation</span> + <span class="e">un effet tiré du document</span></div>
  <nav class="onglets" id="onglets" aria-label="Choisir un cas"></nav>
  <main class="carte" id="carte"></main>
  <div class="sr" aria-live="polite" id="annonce"></div>
</div>
<script>
(function(){const S=window.SpeechSynthesisUtterance;if(!S)return;
 const sig=t=>String(t).replace(/\bOMS\b/g,"O M S").replace(/\bDMP\b/g,"D M P").replace(/\bCAP\b/g,"cap").replace(/(\d+),(\d+) €/g,"$1 euros $2").replace(/(\d+) €/g,"$1 euros");
 window.SpeechSynthesisUtterance=function(t){return new S(sig(t))};})();


/* ===== CAS — actions [texte, 1 si utile, message] · blocs a/f/e : [texte, 1 si juste, message] ===== */
const CAS=[{"id": "rangement", "titre": "Les couteaux en vrac", "situation": "Théo, 22 ans, employé de boucherie, range ses couteaux en vrac dans un bac. Le fusil d'affilage est au bout de la salle : il affile rarement ses lames.", "doc": "Doc. 4 : équipements et organisation : des couteaux adaptés à la tâche et affilés, un moyen d'affilage à chaque poste, un rangement rigoureux dans des coutelières.", "qp": "deux actions utiles au poste de Théo, en cochant deux propositions.", "actions": [["Ranger les couteaux dans une coutelière.", 1], ["Placer un moyen d'affilage au poste de Théo.", 1], ["Laisser les couteaux en vrac dans le bac, mais regarder avant de les prendre.", 0, "En vrac, les lames restent cachées : on se coupe en y plongeant la main."], ["Porter un gant en mailles à la scie à os.", 0, "Le gant en mailles est interdit à la scie à os."]], "a": [["de ranger les couteaux dans une coutelière", 1], ["de garder le bac en le remplissant moins", 0, "Les lames resteraient en vrac et cachées."], ["de supprimer le fusil d'affilage", 0, "Il faut au contraire un moyen d'affilage à chaque poste."]], "f": [["ses couteaux sont rangés en vrac dans un bac", 1], ["Théo travaille dans un supermarché", 0, "Ce fait n'explique pas le choix du rangement."], ["les couteaux coûtent cher", 0, "Ce n'est pas un fait de la situation."]], "e": [["chaque lame y est protégée et visible : on ne se coupe plus en cherchant un couteau", 1], ["la coutelière rend les lames plus tranchantes", 0, "Ce n'est pas son rôle."], ["la coutelière remplace le gant en mailles", 0, "Elle complète la protection individuelle, elle ne la remplace pas."]]}, {"id": "tablier", "titre": "Le tablier de protection", "situation": "Théo porte un gant en mailles métalliques sur la main qui tient la viande, mais pas de tablier de protection. Mardi, la lame a glissé sur un os et lui a entaillé la cuisse.", "doc": "Doc. 4 et 5 : en boucherie, protection individuelle : des gants en mailles métalliques, de la bonne taille, et des tabliers de protection. Les équipements de protection individuelle sont fournis gratuitement par l'employeur, qui assure leur bon fonctionnement et leur entretien.", "qp": "deux actions utiles à Théo pour se protéger, en cochant deux propositions.", "actions": [["Porter un tablier de protection.", 1], ["Porter un gant en mailles à sa taille.", 1], ["Retirer le gant en mailles pour désosser plus vite.", 0, "Le gant protège la main qui tient la viande."], ["Désosser plus vite pour réduire le temps d'exposition.", 0, "Le rythme soutenu n'est pas une protection ; la protection individuelle prévue en boucherie comprend le tablier."]], "a": [["de porter un tablier de protection en plus du gant en mailles", 1], ["de porter deux gants en mailles", 0, "Le gant ne protège que la main, pas la cuisse."], ["de désosser plus lentement sans autre protection", 0, "La protection individuelle prévue en boucherie comprend le tablier."]], "f": [["la lame a glissé sur un os et lui a entaillé la cuisse", 1], ["Théo travaille le matin", 0, "Ce fait n'explique pas le choix du tablier."], ["le tablier évite de salir la tenue", 0, "Ce n'est pas l'argument de prévention attendu."]], "e": [["le gant ne protège que la main, alors que le tablier protège aussi le tronc et les cuisses", 1], ["le tablier est interdit au désossage", 0, "C'est faux : il fait partie de la protection individuelle en boucherie."], ["le gant en mailles est interdit au désossage", 0, "Il est interdit à la scie à os, pas au désossage."]]}, {"id": "hierarchie", "titre": "Choisir d'abord", "situation": "Chaque matin, pendant trois heures, Théo désosse et découpe des pièces de viande au couteau, à un rythme soutenu, avec des lames rarement affilées.", "doc": "Doc. 4 : hiérarchie des mesures : supprimer ou réduire le risque, puis protection collective, puis protection individuelle ; l'information et la formation accompagnent toutes ces mesures. Le Code du travail demande de combattre les risques à la source.", "qp": "les deux mesures du premier niveau de la hiérarchie pour le poste de Théo, en cochant deux propositions.", "qv": "Identifier", "actions": [["Recevoir, quand c'est possible, des pièces de viande déjà prédécoupées.", 1], ["Utiliser des couteaux adaptés et affilés.", 1], ["Porter un tablier de protection.", 0, "C'est une protection individuelle : elle vient après."], ["Suivre une formation à l'affûtage-affilage.", 0, "La formation accompagne toutes les mesures, elle n'est pas le premier niveau."]], "debut": "Selon la hiérarchie des mesures, la priorité est", "a": [["de supprimer ou de réduire le risque", 1], ["de porter des équipements de protection individuelle", 0, "Ils viennent après la protection collective."], ["d'attendre un nouvel accident pour agir", 0, "La prévention agit avant le dommage."]], "f": [["Théo désosse chaque jour au couteau, avec des lames rarement affilées", 1], ["Théo a eu cinq jours d'arrêt", 0, "Ce fait décrit le dommage, il ne désigne pas la mesure à choisir."], ["les couteaux sont neufs", 0, "Ce n'est pas écrit."]], "e": [["le Code du travail demande de combattre les risques à la source", 1], ["la protection individuelle passe avant toute autre mesure", 0, "C'est l'inverse : la protection collective a la priorité."], ["la formation suffit à supprimer le risque", 0, "Elle accompagne les mesures, elle ne supprime pas le danger."]]}, {"id": "plaie", "titre": "La plaie de Théo", "situation": "Mardi, la lame de Théo a glissé sur un os et lui a entaillé la cuisse. La plaie saignait beaucoup : il a eu des points de suture et cinq jours d'arrêt de travail.", "doc": "Doc. 3 : une plaie du derme provoque un saignement (vaisseaux coupés) et une douleur (nerfs touchés). Toute plaie ouvre une porte d'entrée aux microbes : risque d'infection. Le dommage immédiat, après un fait soudain, est un accident du travail.", "qp": "les deux effets de la plaie de Théo sur l'organisme, en cochant deux propositions.", "qv": "Identifier", "actions": [["Un saignement, car des vaisseaux du derme sont coupés.", 1], ["Un risque d'infection, car la plaie ouvre une porte d'entrée aux microbes.", 1], ["Aucun saignement, car l'épiderme a des vaisseaux.", 0, "L'épiderme est sans vaisseaux ; la plaie de Théo a beaucoup saigné."], ["Une maladie professionnelle, apparue lentement.", 0, "C'est un dommage immédiat, après un fait soudain."]], "debut": "La coupure de Théo est", "a": [["un accident du travail", 1], ["une maladie professionnelle", 0, "Elle n'est pas liée à une exposition habituelle, répétée ou prolongée."], ["un accident de trajet", 0, "Elle est survenue au poste de travail."]], "f": [["la lame a glissé sur un os pendant le désossage", 1], ["Théo est employé depuis quatre mois", 0, "Ce fait ne qualifie pas le dommage."], ["Théo porte un gant en mailles", 0, "Ce fait ne qualifie pas le dommage."]], "e": [["c'est un dommage immédiat, provoqué par un fait soudain pendant le travail", 1], ["c'est un dommage différé, lié à une exposition prolongée", 0, "Cela correspond à une maladie professionnelle."], ["toute plaie est une maladie professionnelle", 0, "C'est faux."]]}];
const $=id=>document.getElementById(id);
function annoncer(t){$("annonce").textContent=t}
const CLE="justifier-BCPC6";let pref={etoiles:{}};
try{pref=Object.assign(pref,JSON.parse(localStorage.getItem(CLE)||"{}"))}catch(e){}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(pref))}catch(e){}}
function melanger(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let C,err,phrase,etapeBloc,sel;

function onglets(){
  $("onglets").innerHTML=CAS.map(c=>`<button class="puce" data-id="${c.id}" aria-pressed="${C===c}">${c.titre}${pref.etoiles[c.id]?`<span class="et">${"★".repeat(pref.etoiles[c.id])}</span>`:""}</button>`).join("");
  $("onglets").querySelectorAll(".puce").forEach(b=>b.onclick=()=>demarrer(CAS.find(c=>c.id===b.dataset.id)));
}
function entete(){return `<div class="situation"><b>Situation</b>${C.situation}<div class="doc">${C.doc}</div></div>`}
function demarrer(c){C=c;err=0;phrase={};sel=new Set();onglets();proposer()}

/* Étape 1 : proposer deux actions */
function proposer(){
  const opts=melanger(C.actions.map((a,i)=>[a,i]));
  $("carte").innerHTML=`${entete()}<div class="num">Étape 1 / 2 · C4</div>
    <p class="q"><b>${C.qv||"Proposer"}</b> ${C.qp||"deux actions utiles, en cochant deux propositions."}<small>Deux réponses attendues.</small></p>
    <div class="opts">${opts.map(([a,i])=>`<button class="opt" data-i="${i}" aria-pressed="false">☐ ${a[0]}</button>`).join("")}</div>
    <button class="valider" id="bVal" disabled>Valider mes deux actions</button>
    <div class="fb" id="fb" role="status" aria-live="polite"></div><div id="suite"></div>
    <button class="outil" id="bLire">🔊 Écouter</button>`;
  $("bLire").onclick=()=>lire(`${C.situation} Choisir ${C.qp||"deux actions utiles."} ${C.actions.map(a=>a[0]).join(" ")}`);
  $("carte").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;if(b.disabled)return;
    if(sel.has(i))sel.delete(i);else if(sel.size<2)sel.add(i);
    $("carte").querySelectorAll(".opt").forEach(x=>{const on=sel.has(+x.dataset.i);x.setAttribute("aria-pressed",on);x.textContent=(on?"☑ ":"☐ ")+C.actions[+x.dataset.i][0]});
    $("bVal").disabled=sel.size!==2;
  });
  $("bVal").onclick=()=>{
    const faux=[...sel].filter(i=>!C.actions[i][1]);
    if(!faux.length){
      $("carte").querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(sel.has(+x.dataset.i))x.classList.add("bon")});$("bVal").remove();
      fb("ok","<b>✓ Bien proposé.</b> Ces deux propositions sont les bonnes.");
      const b=document.createElement("button");b.className="continuer";b.textContent="Étape 2 : justifier";b.onclick=justifier;$("suite").appendChild(b);b.focus({preventScroll:true});
    }else{
      err+=faux.length;
      faux.forEach(i=>{const x=$("carte").querySelector(`.opt[data-i="${i}"]`);x.classList.add("mauvais");x.disabled=true;x.setAttribute("aria-pressed","false");sel.delete(i)});
      $("bVal").disabled=true;
      fb("ko",`<b>Pas tout à fait.</b> ${faux.map(i=>C.actions[i][2]).join(" ")} Choisis une autre action.`);
    }
  };
}

/* Étape 2 : construire la justification */
const ORDRE=["a","f","e"];
const NOMS={a:"l'action",f:"le fait de la situation",e:"l'effet tiré du document"};
function justifier(){etapeBloc=0;phrase={};rendrePhrase()}
function conj(){return phrase.e&&/^[aeiouyéèêh]/i.test(phrase.e)?"qu'":"que "}
function slot(x){return phrase[x]?`<span class="slot ${x}">${phrase[x]}</span>`:`<span class="slot vide${ORDRE[etapeBloc]===x?" ici":""}">${NOMS[x]}</span>`}
function rendrePhrase(){
  const x=ORDRE[etapeBloc];
  $("carte").innerHTML=`${entete()}<div class="num">Étape 2 / 2 · C5</div>
    <p class="q"><b>Justifier</b> en construisant la phrase.</p>
    <div class="phrase" aria-live="polite">${C.debut||"L'action la plus utile est"} ${slot("a")}, parce que ${slot("f")}, et ${conj()}${slot("e")}.</div>
    <div id="zoneB"></div><div class="fb" id="fb" role="status" aria-live="polite"></div><div id="suite"></div>`;
  if(!x){finJustif();return}
  const blocs=melanger(C[x].map((b,i)=>[b,i]));
  $("zoneB").innerHTML=`<div class="blocs"><h3>Choisis ${NOMS[x]} :</h3>${blocs.map(([b,i])=>`<button class="bloc" data-i="${i}">${b[0]}</button>`).join("")}</div>`;
  $("zoneB").querySelectorAll(".bloc").forEach(b=>b.onclick=()=>{
    const bl=C[x][+b.dataset.i];
    if(bl[1]){phrase[x]=bl[0];etapeBloc++;rendrePhrase();
      const msg={a:"C'est bien l'action la plus utile.",f:"C'est un fait précis, écrit dans la situation.",e:"C'est un effet tiré du document."}[x];
      if($("fb"))fb("ok",`<b>✓</b> ${msg}`)}
    else{err++;b.classList.add("mauvais");b.disabled=true;fb("ko",`<b>Pas tout à fait.</b> ${bl[2]}`)}
  });
}
function finJustif(){
  const et=err===0?3:err<=2?2:1;pref.etoiles[C.id]=Math.max(pref.etoiles[C.id]||0,et);sauver();onglets();
  const texte=`${C.debut||"L'action la plus utile est"} ${phrase.a}, parce que ${phrase.f}, et ${conj()}${phrase.e}.`;
  const i=CAS.indexOf(C),s=CAS[i+1];
  $("suite").innerHTML=`<div class="fb ok" style="padding:.7rem .9rem;margin-top:.8rem"><b>✓ Justification complète !</b> Recopie-la sur ta feuille : c'est ce qu'on attend à l’épreuve.</div>
    <div class="etoiles" aria-label="${et} étoiles sur 3">${"★".repeat(et)}<span style="opacity:.25">${"★".repeat(3-et)}</span></div>
    <button class="outil" id="bLireP">🔊 Écouter ma justification</button>
    <div class="retenir"><b>À retenir</b>À l’épreuve, « Justifier », ce n'est pas donner son avis : on relie l'action à un fait précis de la situation et à un effet donné par le document.</div>
    ${s?`<button class="continuer" id="bSuiv">Cas suivant : ${s.titre} →</button>`:""}`;
  $("bLireP").onclick=()=>lire(texte.replace(/€/g,"euros"));
  if(s){$("bSuiv").onclick=()=>{demarrer(s);scrollTo({top:0,behavior:"smooth"})};$("bSuiv").focus({preventScroll:true})}
  annoncer(texte);
}
function fb(c,h){const f=$("fb");f.className="fb "+c;f.innerHTML=h}
let voix=null;
function choisirVoix(){const l=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));voix=l.find(x=>/fr-FR/i.test(x.lang)&&/(google|natural|online|amélie|thomas|denise|henri)/i.test(x.name))||l.find(x=>/fr-FR/i.test(x.lang))||l[0]||null}
if("speechSynthesis" in window){choisirVoix();speechSynthesis.onvoiceschanged=choisirVoix}
function lire(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voix)u.voice=voix;u.rate=.95;speechSynthesis.speak(u)}
demarrer(CAS[0]);
</script>
</body>
</html>
