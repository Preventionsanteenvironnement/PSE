<script>
(function(){const S=window.SpeechSynthesisUtterance;if(!S)return;
 const sig=t=>String(t).replace(/\bOMS\b/g,"O M S").replace(/\bDMP\b/g,"D M P").replace(/\bCAP\b/g,"cap").replace(/(\d+),(\d+) €/g,"$1 euros $2").replace(/(\d+) €/g,"$1 euros").replace(/ ?m³/g," mètres cubes").replace(/ ?mg\/L/g," milligrammes par litre").replace(/ ?µg\/L/g," microgrammes par litre").replace(/ ?°f\b/g," degrés français").replace(/(\d) L\b/g,"$1 litres").replace(/\bONU\b/g,"O N U").replace(/\bOFB\b/g,"O F B").replace(/\bARS\b/g,"A R S").replace(/\bWC\b/g,"W C");
 window.SpeechSynthesisUtterance=function(t){return new S(sig(t))};})();


/* ===== CAS — actions [texte, 1 si utile, message] · blocs a/f/e : [texte, 1 si juste, message] ===== */
const CAS=[{"id": "douches", "titre": "L'eau de la maison", "situation": "Aurélie et Guillaume vivent dans une maison de la Drôme alimentée par une nappe souterraine. Après un été très sec, la commune est en alerte renforcée. Leur facture annuelle indique 96 m³ consommés.", "doc": "Doc. 9 : « Aujourd'hui, chaque habitant utilise en moyenne 143 litres d'eau par jour. » Répartition à la maison : bains, douches 39 % ; sanitaires (WC) 20 % ; linge 12 % ; vaisselle 10 % ; voiture, jardin 6 % ; cuisine 6 % ; divers 6 % ; boisson 1 %.", "qv": "Choisir", "qp": "deux mesures individuelles qui économisent l'eau, en cochant deux propositions.", "actions": [["Prendre des douches courtes plutôt que des bains.", 1], ["Faire tourner le lave-linge seulement quand il est plein.", 1], ["Faire tourner le lave-vaisselle à moitié vide.", 0, "Un appareil à moitié vide utilise de l'eau pour peu de vaisselle."], ["Boire moins d'eau.", 0, "La boisson ne représente que 1 % de l'eau utilisée à la maison."]], "debut": "Pour économiser l'eau, la mesure la plus utile pour le couple est", "a": [["de prendre des douches courtes plutôt que des bains", 1], ["de boire moins d'eau", 0, "La boisson ne représente que 1 % de l'eau de la maison."], ["de laver la voiture plus souvent", 0, "Cela augmenterait la consommation d'eau."]], "f": [["la nappe qui alimente leur maison baisse et la commune est en alerte renforcée", 1], ["la facture comporte trois rubriques", 0, "Ce fait n'explique pas le choix."], ["Aurélie a 34 ans", 0, "Ce fait n'explique pas le choix."]], "e": [["les bains et douches sont le premier poste d'eau à la maison, avec 39 %", 1], ["la boisson est le premier poste d'eau à la maison", 0, "Elle ne représente que 1 %."], ["les sanitaires représentent 39 % de l'eau utilisée", 0, "Ils en représentent 20 %."]]}, {"id": "fuites", "titre": "La nappe qui baisse", "situation": "La commune d'Aurélie, dans la Drôme, est alimentée par une nappe souterraine. En août, après un été très sec, le niveau de la nappe baisse et un arrêté du préfet place la commune en « alerte renforcée ».", "doc": "Doc. 12 : « le rendement moyen du réseau de distribution d'eau potable est de 79 % en 2024 » ; « un litre d'eau sur 5 est donc perdu par fuites ». En cas de sécheresse, les mesures sont graduées en quatre niveaux : vigilance, alerte, alerte renforcée et crise ; elles peuvent aller jusqu'à l'arrêt total des prélèvements.", "qv": "Choisir", "qp": "deux mesures collectives qui préservent la quantité d'eau de la nappe, en cochant deux propositions.", "actions": [["La commune ou le syndicat des eaux répare les fuites du réseau.", 1], ["Le préfet limite les prélèvements par arrêté de restriction.", 1], ["La commune ajoute du chlore dans le château d'eau.", 0, "Le chlore garantit la qualité de l'eau, pas sa quantité."], ["Aurélie prend des douches plus courtes.", 0, "C'est une mesure individuelle."]], "debut": "Pour préserver la quantité d'eau de la nappe, la mesure collective la plus utile est", "a": [["de réparer les fuites du réseau d'eau potable", 1], ["d'ajouter du chlore en fin de traitement", 0, "Le chlore agit sur la qualité, pas sur la quantité."], ["de construire une station d'épuration", 0, "Elle dépollue les eaux usées ; elle ne réduit pas les pertes."]], "f": [["le niveau de la nappe baisse après un été très sec", 1], ["la dureté de l'eau est de 28 °f", 0, "Ce fait n'explique pas le choix."], ["la facture d'eau arrive en septembre", 0, "Ce fait n'explique pas le choix."]], "e": [["un litre d'eau potable sur 5 est perdu par fuites", 1], ["le rendement du réseau est de 100 %", 0, "Il est de 79 % en 2024."], ["les fuites ne font perdre qu'un litre sur 100", 0, "Un litre sur 5 est perdu."]]}, {"id": "nitrates", "titre": "Les nitrates de l'eau du robinet", "situation": "La fiche de l'Agence régionale de santé jointe à la facture d'Aurélie indique une teneur moyenne en nitrates de 44 mg/L, proche du maximum réglementaire. Aurélie s'inquiète pour l'eau du robinet.", "doc": "Doc. 5, 6 et 11 : maximum réglementaire des nitrates : 50 mg/L ; ils proviennent des pratiques agricoles et des rejets domestiques et industriels. « Si la concentration en nitrates de l'eau brute est supérieure aux normes de qualité, une filtration complémentaire est mise en oeuvre afin de les éliminer. » Les redevances versées à l'agence de l'eau financent des actions de réduction de la pollution.", "qv": "Choisir", "qp": "deux mesures collectives qui réduisent les nitrates dans l'eau d'Aurélie, en cochant deux propositions.", "actions": [["L'agence de l'eau finance, grâce aux redevances, la réduction des rejets de nitrates autour du captage.", 1], ["L'usine de traitement met en œuvre une filtration complémentaire des nitrates.", 1], ["Le préfet interdit le remplissage des piscines.", 0, "Cette mesure préserve la quantité d'eau, pas sa qualité."], ["Aurélie prend des douches plus courtes.", 0, "C'est une mesure individuelle sur la quantité d'eau, pas sur les nitrates."]], "debut": "Pour réduire les nitrates de l'eau d'Aurélie, une mesure collective utile est", "a": [["de financer, grâce aux redevances, la réduction des rejets de nitrates autour du captage", 1], ["d'ajouter du chlore en fin de traitement", 0, "Le chlore élimine les germes, pas les nitrates."], ["d'interdire l'arrosage des pelouses", 0, "Cette mesure préserve la quantité d'eau."]], "f": [["la teneur moyenne en nitrates de son eau est de 44 mg/L, proche du maximum réglementaire", 1], ["aucune bactérie n'a été détectée dans son eau", 0, "Ce fait concerne la qualité bactériologique, pas les nitrates."], ["la dureté de l'eau est de 28 °f", 0, "La dureté n'a pas de seuil réglementaire."]], "e": [["les nitrates proviennent des pratiques agricoles et des rejets, et les redevances financent la réduction de la pollution", 1], ["le maximum réglementaire des nitrates est de 100 mg/L", 0, "Il est de 50 mg/L."], ["les nitrates sont éliminés par le chlore", 0, "Une filtration complémentaire les élimine."]]}, {"id": "linge", "titre": "Le linge et les toilettes", "situation": "Aurélie et Guillaume font souvent tourner leur lave-linge à moitié vide, et leur chasse d'eau est ancienne. Ils veulent réduire l'eau qu'ils utilisent à la maison.", "doc": "Doc. 9 : « Aujourd'hui, chaque habitant utilise en moyenne 143 litres d'eau par jour. » Répartition de l'eau utilisée à la maison : bains, douches 39 % ; sanitaires (WC) 20 % ; linge 12 % ; vaisselle 10 % ; voiture, jardin 6 % ; cuisine 6 % ; divers 6 % ; boisson 1 %.", "qv": "Choisir", "qp": "deux mesures individuelles qui réduisent l'eau utilisée par le couple, en cochant deux propositions.", "actions": [["Faire tourner le lave-linge seulement quand il est plein.", 1], ["Installer une chasse d'eau économe.", 1], ["Faire tourner le lave-vaisselle à moitié vide.", 0, "Un appareil à moitié vide utilise autant d'eau pour moins de vaisselle."], ["La commune répare les fuites du réseau.", 0, "C'est une mesure collective."]], "debut": "Pour réduire l'eau utilisée pour le linge, une mesure utile est", "a": [["de faire tourner le lave-linge seulement quand il est plein", 1], ["de laver le linge plus souvent, en petites quantités", 0, "Cela augmente le nombre de lavages."], ["d'acheter de l'eau en bouteille", 0, "Cela ne change pas l'eau utilisée pour le linge."]], "f": [["le couple fait souvent tourner son lave-linge à moitié vide", 1], ["la commune est dans la Drôme", 0, "Ce fait n'explique pas le choix."], ["la dureté de l'eau est de 28 °f", 0, "Ce fait n'explique pas le choix."]], "e": [["le linge représente 12 % et les WC 20 % de l'eau utilisée à la maison", 1], ["le linge représente 39 % de l'eau utilisée à la maison", 0, "39 % : ce sont les bains et douches."], ["les WC représentent 1 % de l'eau utilisée à la maison", 0, "1 % : c'est la boisson ; les WC représentent 20 %."]]}];
const $=id=>document.getElementById(id);
function annoncer(t){$("annonce").textContent=t}
const CLE="justifier-BCPB4";let pref={etoiles:{}};
try{pref=Object.assign(pref,JSON.parse(localStorage.getItem(CLE)||"{}"))}catch(e){}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(pref))}catch(e){}}
function melanger(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let C,err,phrase,etapeBloc,sel;

function onglets(){
  $("onglets").innerHTML=CAS.map(c=>`<button class="puce" data-id="${c.id}" aria-pressed="${C===c}">${c.titre}${pref.etoiles[c.id]?`<span class="et">${"★".repeat(pref.etoiles[c.id])}</span>`:""}</button>`).join("");
  $("onglets").querySelectorAll(".puce").forEach(b=>b.onclick=()=>demarrer(CAS.find(c=>c.id===b.dataset.id)));
}
function entete(){return `<div class="situation"><b>Situation</b>${C.situation}<div class="doc">${C.doc}</div></div>`}
function demarrer(c){C=c;err=0;phrase={};sel=new Set();onglets();proposer()}

/* Étape 1 : proposer deux actions */
function proposer(){
  const opts=melanger(C.actions.map((a,i)=>[a,i]));
  $("carte").innerHTML=`${entete()}<div class="num">Étape 1 / 2 · C4</div>
    <p class="q"><b>${C.qv||"Proposer"}</b> ${C.qp||"deux actions utiles, en cochant deux propositions."}<small>Deux réponses attendues.</small></p>
    <div class="opts">${opts.map(([a,i])=>`<button class="opt" data-i="${i}" aria-pressed="false">☐ ${a[0]}</button>`).join("")}</div>
    <button class="valider" id="bVal" disabled>Valider mes deux actions</button>
    <div class="fb" id="fb" role="status" aria-live="polite"></div><div id="suite"></div>
    <button class="outil" id="bLire">🔊 Écouter</button>`;
  $("bLire").onclick=()=>lire(`${C.situation} Choisir ${C.qp||"deux actions utiles."} ${C.actions.map(a=>a[0]).join(" ")}`);
  $("carte").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;if(b.disabled)return;
    if(sel.has(i))sel.delete(i);else if(sel.size<2)sel.add(i);
    $("carte").querySelectorAll(".opt").forEach(x=>{const on=sel.has(+x.dataset.i);x.setAttribute("aria-pressed",on);x.textContent=(on?"☑ ":"☐ ")+C.actions[+x.dataset.i][0]});
    $("bVal").disabled=sel.size!==2;
  });
  $("bVal").onclick=()=>{
    const faux=[...sel].filter(i=>!C.actions[i][1]);
    if(!faux.length){
      $("carte").querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(sel.has(+x.dataset.i))x.classList.add("bon")});$("bVal").remove();
      fb("ok","<b>✓ Bien proposé.</b> Ces deux propositions sont les bonnes.");
      const b=document.createElement("button");b.className="continuer";b.textContent="Étape 2 : justifier";b.onclick=justifier;$("suite").appendChild(b);b.focus({preventScroll:true});
    }else{
      err+=faux.length;
      faux.forEach(i=>{const x=$("carte").querySelector(`.opt[data-i="${i}"]`);x.classList.add("mauvais");x.disabled=true;x.setAttribute("aria-pressed","false");sel.delete(i)});
      $("bVal").disabled=true;
      fb("ko",`<b>Pas tout à fait.</b> ${faux.map(i=>C.actions[i][2]).join(" ")} Choisis une autre action.`);
    }
  };
}

/* Étape 2 : construire la justification */
const ORDRE=["a","f","e"];
const NOMS={a:"l'action",f:"le fait de la situation",e:"l'effet tiré du document"};
function justifier(){etapeBloc=0;phrase={};rendrePhrase()}
function conj(){return phrase.e&&/^[aeiouyéèêh]/i.test(phrase.e)?"qu'":"que "}
function slot(x){return phrase[x]?`<span class="slot ${x}">${phrase[x]}</span>`:`<span class="slot vide${ORDRE[etapeBloc]===x?" ici":""}">${NOMS[x]}</span>`}
function rendrePhrase(){
  const x=ORDRE[etapeBloc];
  $("carte").innerHTML=`${entete()}<div class="num">Étape 2 / 2 · C5</div>
    <p class="q"><b>Justifier</b> en construisant la phrase.</p>
    <div class="phrase" aria-live="polite">${C.debut||"L'action la plus utile est"} ${slot("a")}, parce que ${slot("f")}, et ${conj()}${slot("e")}.</div>
    <div id="zoneB"></div><div class="fb" id="fb" role="status" aria-live="polite"></div><div id="suite"></div>`;
  if(!x){finJustif();return}
  const blocs=melanger(C[x].map((b,i)=>[b,i]));
  $("zoneB").innerHTML=`<div class="blocs"><h3>Choisis ${NOMS[x]} :</h3>${blocs.map(([b,i])=>`<button class="bloc" data-i="${i}">${b[0]}</button>`).join("")}</div>`;
  $("zoneB").querySelectorAll(".bloc").forEach(b=>b.onclick=()=>{
    const bl=C[x][+b.dataset.i];
    if(bl[1]){phrase[x]=bl[0];etapeBloc++;rendrePhrase();
      const msg={a:"C'est bien l'action la plus utile.",f:"C'est un fait précis, écrit dans la situation.",e:"C'est un effet tiré du document."}[x];
      if($("fb"))fb("ok",`<b>✓</b> ${msg}`)}
    else{err++;b.classList.add("mauvais");b.disabled=true;fb("ko",`<b>Pas tout à fait.</b> ${bl[2]}`)}
  });
}
function finJustif(){
  const et=err===0?3:err<=2?2:1;pref.etoiles[C.id]=Math.max(pref.etoiles[C.id]||0,et);sauver();onglets();
  const texte=`${C.debut||"L'action la plus utile est"} ${phrase.a}, parce que ${phrase.f}, et ${conj()}${phrase.e}.`;
  const i=CAS.indexOf(C),s=CAS[i+1];
  $("suite").innerHTML=`<div class="fb ok" style="padding:.7rem .9rem;margin-top:.8rem"><b>✓ Justification complète !</b> Recopie-la sur ta feuille : c'est ce qu'on attend à l’épreuve.</div>
    <div class="etoiles" aria-label="${et} étoiles sur 3">${"★".repeat(et)}<span style="opacity:.25">${"★".repeat(3-et)}</span></div>
    <button class="outil" id="bLireP">🔊 Écouter ma justification</button>
    <div class="retenir"><b>À retenir</b>À l’épreuve, « Justifier », ce n'est pas donner son avis : on relie l'action à un fait précis de la situation et à un effet donné par le document.</div>
    ${s?`<button class="continuer" id="bSuiv">Cas suivant : ${s.titre} →</button>`:""}`;
  $("bLireP").onclick=()=>lire(texte.replace(/€/g,"euros"));
  if(s){$("bSuiv").onclick=()=>{demarrer(s);scrollTo({top:0,behavior:"smooth"})};$("bSuiv").focus({preventScroll:true})}
  annoncer(texte);
}
function fb(c,h){const f=$("fb");f.className="fb "+c;f.innerHTML=h}
let voix=null;
function choisirVoix(){const l=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));voix=l.find(x=>/fr-FR/i.test(x.lang)&&/(google|natural|online|amélie|thomas|denise|henri)/i.test(x.name))||l.find(x=>/fr-FR/i.test(x.lang))||l[0]||null}
if("speechSynthesis" in window){choisirVoix();speechSynthesis.onvoiceschanged=choisirVoix}
function lire(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voix)u.voice=voix;u.rate=.95;speechSynthesis.speak(u)}
demarrer(CAS[0]);
</script>
