 carbone est réduit."}, "adapte": {"indice": "DOC. 2 : comparer la barre « végétarien » avec les barres des repas avec viande.", "explication": "Un repas sans viande a un impact carbone plus faible ; remplacer la viande par des légumes secs réduit les émissions.", "trous": ["faible|petit|bas", "réduit|reduit|diminue|baisse"]}, "essentiel": {"indice": "DOC. 2 : la barre « végétarien » est courte.", "explication": "Un repas végétarien a un impact carbone plus faible : il réduit les émissions de gaz à effet de serre.", "trous": ["faible|petit|bas", "réduit|reduit|diminue|baisse"]}}}, {"type": "document_texte_image", "id": "bb1_doc3", "data": {"label": "DOC. 3", "titre": "Circuits courts et circuit long", "cadre": true, "corps": "« Les circuits courts se caractérisent par la limitation du nombre d’intermédiaires dans la vente, sans nécessairement impliquer une proximité physique, et sont définis comme une vente présentant un intermédiaire au plus. »", "source": "DGCCRF, « Produits alimentaires commercialisés en circuits courts », 16/06/2025 ; illustration réalisée pour le cours.", "date_consultation": "2026-10-26", "image_w": 1536, "image_h": 1024, "image_pos": "centre", "image_align": "centre", "image_largeur": 90, "image_taille": "pleine", "image_nom": "Planche en trois bandes. Bande 1, « Vente directe » : une productrice vend ses légumes à un consommateur, une seule flèche. Bande 2, « Un intermédiaire » : productrice, commerçant, consommatrice, deux flèches. Ces deux bandes sont réunies par une accolade « Circuits courts ». Bande 3, « Plusieurs intermédiaires » : productrice, grossiste, usine, supermarché, consommateur, quatre flèches : « Circuit long ».", "img": "bcp_2nde_B1/images/bcp_2nde_B1_bb1_doc3.jpg", "img_desc": "Planche en trois bandes. Bande 1, « Vente directe » : une productrice vend ses légumes à un consommateur, une seule flèche. Bande 2, « Un intermédiaire » : productrice, commerçant, consommatrice, deux flèches. Ces deux bandes sont réunies par une accolade « Circuits courts ». Bande 3, « Plusieurs intermédiaires » : productrice, grossiste, usine, supermarché, consommateur, quatre flèches : « Circuit long ».", "img_w": 1400, "img_h": 933}}, {"type": "question_chapeau", "id": "bb1_ch3", "data": {"numero": "3", "texte": "À partir du document 3 :", "reponse_attendue": ""}}, {"id": "bb1_q31", "type": "classer", "data": {"competence": "C2", "numero": "3.1", "titre": "", "consigne": "**Classer** chaque vente.", "categories": ["Circuit court", "Circuit long"], "items": ["Des œufs vendus en ligne par l’éleveur", "Des légumes vendus par un épicier, livré par le maraîcher", "Des pâtes fabriquées en usine avec le blé d’un grossiste, vendues en supermarché", "Des fromages vendus par l’éleveur sur un marché"], "classement": [0, 0, 1, 0], "indice": "", "variantes": {}}, "el": {"standard": {"indice": "DOC. 3 : la définition de la DGCCRF (un intermédiaire au plus) ; compter les intermédiaires entre le producteur et l’acheteur.", "explication": "Circuit court : les œufs vendus en ligne par l’éleveur (vente directe), les fromages vendus par l’éleveur sur un marché (vente directe), les légumes de l’épicier livré par le maraîcher (un intermédiaire). Circuit long : les pâtes, avec grossiste, usine et supermarché (plusieurs intermédiaires)."}}}, {"type": "sous_question", "id": "bb1_q32", "data": {"competence": "C2", "numero": "3.2", "texte": "**Indiquer** si un circuit court impose une courte distance entre le producteur et le consommateur.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Non : un circuit court limite le nombre d’intermédiaires (un au plus), sans imposer de proximité.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase.\nUn circuit court compte au plus ……………………… intermédiaire ; il n’impose pas forcément la ……………………… .", "lignes": 0, "reponse_allegee": "au plus {{un}} intermédiaire ; pas forcément la {{proximité}}", "repo ment durable et alimentation", "renvoi_bloc": "bb1_doc1"}]}}, {"id": "bb1_seance2", "type": "seance", "data": {"numero": "2", "titre": "Le gaspillage alimentaire", "objectif": "Être capable d’expliquer les causes du gaspillage alimentaire.", "competences": ["C2", "C3"]}}, {"type": "analyse", "id": "bb1_analyse3", "data": {"titre": "LES CAUSES DU GASPILLAGE"}}, {"type": "document", "id": "bb1_doc5", "data": {"label": "DOC. 5", "titre": "Le gaspillage alimentaire", "cadre": true, "corps": "**SDES** — « En France, le gaspillage alimentaire est défini dans le Code de l’environnement (article L541-15-4) comme « toute nourriture destinée à la consommation humaine qui, à une étape de la chaîne alimentaire est perdue, jetée ou dégradée ». »\n**SDES** — « Sur les 145 kg par habitant de déchets alimentaires, 89 kg sont des déchets non comestibles (os attachés à la viande, peaux de certains fruits et légumes, coquilles d’œufs...) et 56 kg sont des déchets comestibles (restes de repas, fruits et légumes dégradés, date limite de consommation dépassée...) considérés comme du gaspillage alimentaire. »\n**Ministère de l’Agriculture** — « Il arrive que les quantités cuisinées soient parfois trop copieuses. Pour éviter d’accumuler les restes et de les gaspiller, pensez à cuisiner les bonnes quantités […]. »", "source": "SDES, « Déchets et gaspillage alimentaires en France en 2024 », 29/09/2026 ; agriculture.gouv.fr, « Acheter et cuisiner la juste quantité », 06/10/2025.", "date_consultation": "2026-10-26"}}, {"type": "question_chapeau", "id": "bb1_ch5", "data": {"numero": "1", "texte": "À partir de l’article de la séance 1 et du document 5 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "bb1_q51", "data": {"competence": "C2", "numero": "1.1", "texte": "**Donner** un exemple de déchet alimentaire comestible et un exemple de déchet non comestible.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Comestible : un reste de repas (ou un fruit dégradé).\n– Non comestible : une coquille d’œuf (ou un os).", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** les phrases.\nUn reste de repas est un déchet ……………………… ; une coquille d’œuf est un déchet ……………………… .", "lignes": 0, "reponse_allegee": "reste de repas : {{comestible}} ; coquille d’œuf : {{non comestible}}", "reponse_attendue": "comestible · non comestible"}, "essentiel": {"texte": "**Compléter** les phrases.\nMots proposés : comestible – non comestible – recyclable.\nUn reste de repas est un déchet ……………………… ; une coquille d’œuf est un déchet ……………………… .", "lignes": 0, "reponse_attendue": "comestible · non comestible"}}, "lignes_par_reponse": 1}, "el": {"standard": {"indice": "DOC. 5 : la deuxième citation du SDES, les exemples entre parenthèses.", "explication": "Déchet comestible : un reste de repas (ou un fruit dégradé). Déchet non comestible : une coquille d’œuf (ou un os)."}, "adapte": {"indice": "DOC. 5 : les exemples entre parenthèses des deux sortes de déchets.", "explication": "Un reste de repas est un déchet comestible ; une coquille d’œuf est un déchet non comestible.", "trous": ["comestible|comestibles", "non comestible|non-comestible|non comestibles"]}, "essentiel": {"indice": "DOC. 5 : les exemples entre parenthèses. Un mot proposé ne sert pas.", "explication": "Un reste de repas est comestible ; une coquille d’œuf est non comestible.", "trous": ["comestible|comestibles", "non comestible|non-comestible|non comestibles"]}}}, {"type": "sous_question", "id": "bb1_q52", "data": {"competence": "C2", "numero": "1.2", "texte": "**Relever** trois déchets comestibles considérés comme du gaspillage alimentaire.", "points": "", "lignes": 3, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Restes de repas.\n– Fruits et légumes dégradés.\n– Aliments dont la date limite de consommation est dépassée.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {" nt et finissent ……………………… .", "lignes": 0, "reponse_allegee": "des {{restes}} ; finissent {{jetés}}", "reponse_attendue": "restes · jetés"}, "essentiel": {"texte": "**Compléter** l’explication.\nMots proposés : restes – jetés – vendus.\nDes quantités trop copieuses laissent des ……………………… qui finissent ……………………… .", "lignes": 0, "reponse_attendue": "restes · jetés"}}}, "el": {"standard": {"indice": "DOC. 5 : la citation du ministère de l’Agriculture sur les quantités cuisinées.", "explication": "Cuisiner ou acheter plus que nécessaire laisse des restes qui s’accumulent et finissent jetés : c’est du gaspillage."}, "adapte": {"indice": "DOC. 5 : « Pour éviter d’accumuler les… ».", "explication": "Des quantités trop copieuses laissent des restes qui s’accumulent et finissent jetés.", "trous": ["restes|reste", "jetés|jetes|jetées|jetees|jeté|jete"]}, "essentiel": {"indice": "DOC. 5 : la citation du ministère de l’Agriculture. Un mot proposé ne sert pas.", "explication": "Des quantités trop copieuses laissent des restes qui finissent jetés.", "trous": ["restes|reste", "jetés|jetes|jetées|jetees|jeté|jete"]}}}, {"type": "document_texte_image", "id": "bb1_doc6", "data": {"label": "DOC. 6", "titre": "DLC et DDM", "cadre": true, "corps": "« Pour les denrées périssables, on parle de date limite de consommation (DLC). Cette limite est impérative. […] Les produits comme les yaourts, la viande fraîche, le poisson, les plats cuisinés non stérilisés... présentent généralement une DLC. »\n« [Pour la date de durabilité minimale (DDM),] une fois la date passée, la denrée ne présente pas de danger mais peut en revanche avoir perdu tout ou partie de ses qualités : goût, texture... »\n« Afin de lutter contre le gaspillage alimentaire, le décret n° 2022-1440 du 17 novembre 2022 permet aux opérateurs de compléter la mention « à consommer de préférence avant le » […]. Objectif : mieux informer le consommateur que le produit reste consommable sans risque pour la santé au-delà de cette date. DLC}} ; après la {{DDM}}", "reponse_attendue": "DLC · DDM"}, "essentiel": {"texte": "**Compléter** les phrases.\nMots proposés : DLC – DDM – AOP.\nAprès la ……………………… , l’aliment ne se consomme plus ; après la ……………………… , il reste consommable.", "lignes": 0, "reponse_attendue": "DLC · DDM"}}}, "el": {"standard": {"indice": "DOC. 6 : la phrase « Cette limite est impérative » et la phrase sur la DDM « une fois la date passée… ».", "explication": "Après la DLC, la limite est impérative : l’aliment ne se consomme plus. Après la DDM, il reste consommable sans danger mais peut perdre goût ou texture."}, "adapte": {"indice": "DOC. 6 : la date « impérative » et la date après laquelle la denrée « ne présente pas de danger ».", "explication": "Après la DLC, l’aliment ne se consomme plus ; après la DDM, il reste consommable mais peut perdre son goût.", "trous": ["dlc|DLC|date limite de consommation", "ddm|DDM|date de durabilité minimale|date de durabilite minimale"]}, "essentiel": {"indice": "DOC. 6 : les deux cadres de l’illustration. Un mot proposé ne sert pas.", "explication": "Après la DLC, l’aliment ne se consomme plus ; après la DDM, il reste consommable. L’AOP n’est pas une date.", "trous": ["dlc|DLC|date limite de consommation", "ddm|DDM|date de durabilité minimale|date de durabilite minimale"]}}}, {"type": "sous_question", "id": "bb1_q62", "data": {"competence": "C3", "numero": "2.2", "texte": "**Expliquer** en quoi confondre la DLC et la DDM peut provoquer du gaspillage.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Une personne qui jette un produit dont la DDM est passée, en la prenant pour une DLC, jette un aliment encore consommable sans danger.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** l’explication.\nJeter un produit dont la ……………………… est passée, c’est jeter un aliment encore ……………………… .", "lignes": 0, "reponse_allegee": "dont la {{DDM}} est passée ; encore {{consommable}}", "reponse_attendue": "DDM · consommable"}, "essentiel": {"texte": "**Compléter** l’explication.\nMots proposés : DDM – consommable – AOP.\nJeter un produit dont la ……………………… est passée, c’est jeter un aliment encore ……………………… .", "lignes": 0, "reponse_attendue": "DDM · consommable"}}}, "el": {"standard": {"indice": "DOC. 6 : la phrase sur la DDM et l’objectif du décret de 2022.", "explication": "Une personne qui jette un produit dont la DDM est passée, en la prenant pour une DLC, jette un aliment encore consommable sans danger : c’est du gaspillage."}, "adapte": {"indice": "DOC. 6 : la date après laquelle le produit « reste consommable sans risque ».", "explication": "Jeter un produit dont la DDM est passée, c’est jeter un aliment encore consommable.", "trous": ["ddm|DDM", "consommable|consommables|comestible"]}, "essentiel": {"indice": "DOC. 6 : la phrase sur la DDM. Un mot proposé ne sert pas.", "explication": "Jeter un produit dont la DDM est passée, c’est jeter un aliment encore consommable.", "trous": ["ddm|DDM", "consommable|consommables|comestible"]}}}, {"type": "analyse", "id": "bb1_analyse4", "data": {"titre": "LES CONSÉQUENCES SUR L’ENVIRONNEMENT"}}, {"type": "document", "id": "bb1_doc7", "data": {"label": "DOC. 7", "titre": "Gaspillage, emballages et pollution", "cadre": true, "corps": "**ADEME** — « [Le gaspillage alimentaire] entraîne la consommation inutile de ressources en énergie et en eau. Des émissions de gaz à effet de serre pourraient être évitées. Toutes les étapes de la chaîne alimentaire sont concernées. »\n**Ministère de la Transition écologique** — « Abandonnés dans la nature, les emballages plastiques polluent directement les sols et les milieux aquatiques et ont un impact sur l’ensemble des écosystèmes et la santé humaine. Lorsqu’ils sont jetés dans la poubelle d’ordures ménagères (poubelle grise ou du tout-venant), ils sont incinérés ou mis en décharge, ce qui libère et disperse des polluants et des substances nocives dans l’air et le sol […]. »", "source": "ADEME, « Études pour la lutte contre le gaspillage alimentaire », 2024 ; ecologie.gouv.fr, « 6 idées reçues sur le tri et le recyclage des emballages en plastique », 02/03/2026.", "date_consultation": "2026-10-26"}}, {"type": "question_chapeau", "id": "bb1_ch7", "data": {"numero": "3", "texte": "À partir de l’article de la séance 1 et du document 7 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "bb1_q71", "data": {"competence": "C2", "numero": "3.1", "texte": "**Relever** deux conséquences du gaspillage alimentaire sur l’environnement.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Consommation inutile d’énergie et d’eau.\n– Émissions de gaz à effet de serre qui auraient pu être évitées.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** les conséquences.\nLe gaspillage consomme inutilement de l’……………………… et de l’……………………… ; il entraîne des émissions de ……………………… à effet de serre.", "lignes": 0, "reponse_allegee": "de l’{{énergie}} et de l’{{eau}} ; émissions de {{gaz}}", "reponse_attendue": "énergie · eau · gaz"}, "essentiel": {"texte": "**Compléter** les conséquences.\nMots proposés : énergie – eau – gaz – sable.\nLe gaspillage consomme inutilement de l’……………………… et de l’……………………… ; il émet des ……………………… à effet de serre.", "lignes": 0, "reponse_attendue": "énergie · eau · gaz"}}, "lignes_par_reponse": 1}, "el": {"standard": {"indice": "DOC. 7 : la citation de l’ADEME, ses deux premières phrases.", "explication": "Le gaspillage alimentaire entraîne la consommation inutile d’énergie et d’eau, et des émissions de gaz à effet de serre qui auraient pu être évitées."}, "adapte": {"indice": "DOC. 7 : la citation de l’ADEME.", "explication": "Le gaspillage consomme inutilement de l’énergie et de l’eau ; il entraîne des émissions de gaz à effet de serre.", "trous": ["énergie|energie", "eau", "gaz"]}, "essentiel": {"indice": "DOC. mation, de la production, de la transformation et de la restauration commerciale ;\n– interdiction des pratiques de destruction d’aliments encore consommables pour certains acteurs de la chaîne alimentaire ;\n– obligation de proposer une convention de don aux associations d’aide alimentaire pour certains acteurs de la chaîne alimentaire […] ;\n– […] ;\n– obligation de mise à disposition des clients de contenants réutilisables ou recyclables permettant d’emporter les aliments ou boissons non consommés sur place ;\n– mise en place d’un label national anti-gaspillage alimentaire pour certains acteurs. »", "source": "SDES, « Déchets et gaspillage alimentaires en France en 2024 », 29/09/2026.", "date_consultation": "2026-10-26"}}, {"type": "question_chapeau", "id": "bb1_ch8", "data": {"numero": "1", "texte": "À partir du document 8 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "bb1_q81", "data": {"competence": "C2", "numero": "1.1", "texte": "**Relever** la première action de la hiérarchie établie par la loi Garot.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Favoriser la prévention du gaspillage.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase.\nLa première action est de favoriser la ……………………… du gaspillage.", "lignes": 0, "reponse_allegee": "la {{prévention}}", "reponse_attendue": "prévention"}, "essentiel": {"texte": "**Compléter** la phrase.\nMots proposés : prévention – méthanisation.\nLa première action est de favoriser la ……………………… du gaspillage.", "lignes": 0, "reponse_attendue": "prévention"}}}, "el": {"standard": {"indice": "DOC. 8 : le premier tiret de la hiérarchie de la loi Garot.", "explication": "La première action de la hiérarchie est de favoriser la prévention du gaspillage."}, "adapte": {"indice": "DOC. 8 : le premier tiret de la liste.", "explication": "La première action est de favoriser la prévention du gaspillage.", "trous": ["prévention|prevention"]}, "essentiel": {"indice": "DOC. 8 : le premier tiret. Un mot proposé ne sert pas.", "explication": "La première action est la prévention du gaspillage. La méthanisation vient en dernier.", "trous": ["prévention|prevention"]}}}, {"type": "sous_question", "id": "bb1_q82", "data": {"competence": "C2", "numero": "1.2", "texte": "**Relever** deux obligations prévues par la loi contre le gaspillage.", "points": "", "lignes": 2, "style_lignes": "tirets_comptage", "support_type": "", "reponse_attendue": "– Proposer une convention de don aux associations d’aide alimentaire.\n– Mettre à disposition des clients des contenants pour emporter les aliments non consommés.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** les obligations.\n– Proposer une convention de ……………………… aux associations d’aide alimentaire.\n– Mettre à disposition des clients des contenants pour ……………………… les aliments non consommés.", "lignes": 0, "reponse_allegee": "convention de {{don}} ; pour {{emporter}}", "reponse_attendue": "don · emporter"}, "essentiel": {"texte": "**Compléter** les obligations.\nMots proposés : don – emporter – vente.\n– Proposer une convention de ……………………… aux associations.\n– Mettre à disposition des contenants pour ……………………… les aliments non consommés.", "lignes": 0, "reponse_attendue": "don · emporter"}}, "lignes_par_reponse": 1}, "el": {"standard": {"indice": "DOC. 8 : les tirets qui commencent par « obligation ».", "explication": "Deux obligations : proposer une convention de don aux associations d’aide alimentaire ; mettre à disposition des clients des contenants pour emporter les aliments non consommés."}, "adapte": {"indice": "DOC. 8 : les deux tirets « obligation de… ».", "explication": "Proposer une convention de don aux associations ; mettre à disposition des contenants pour emporter les aliments non consommés.", "trous": ["don|dons", "emporter"]}, "essentiel": {"indice": "DOC. 8 : les tirets « obligation ». Un mot proposé ne sert pas.", "explication": "Une convention de don aux associations ; des contenants pour emporter les aliments non consommés.", "trous": ["don|dons", "emporter"]}}}, {"type": "sous_question", "id": "bb1_q83", "data": {"competence": "C3", "numero": "1.3", "texte": "**Expliquer** pourquoi ces lois sont des mesures collectives.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Elles s’imposent à tous les acteurs concernés (magasins, restaurants, industries, cantines) : elles ne dépendent pas du geste d’une seule personne.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** l’explication.\nUne loi s’impose à ……………………… les acteurs concernés : elle ne dépend pas du geste d’une seule ……………………… .", "lignes": 0, "reponse_allegee": "à {{tous}} les acteurs ; d’une seule {{personne}}", "reponse_attendue": "tous · personne"}, "essentiel": {"texte": "**Compléter** l’explication.\nMots proposés : tous – personne – produit.\nUne loi s’impose à ……………………… les acteurs concernés, pas à une seule ……………………… .", "lignes": 0, "reponse_attendue": "tous · personne"}}}, "el": {"standard": {"indice": "DOC. 8 : à qui s’adressent les obligations (distribution, restauration, acteurs de la chaîne alimentaire).", "explication": "Ces lois s’imposent à tous les acteurs concernés (magasins, restaurants, industries, cantines) : elles ne dépendent pas du geste d’une seule personne."}, "adapte": {"indice": "DOC. 8 : les acteurs de la chaîne alimentaire visés par la loi.", "explication": "Une loi s’impose à tous les acteurs concernés : elle ne dépend pas du geste d’une seule personne.", "trous": ["tous", "personne"]}, "essentiel": {"indice": "DOC. 8 : les acteurs visés par la loi. Un mot proposé ne sert pas.", "explication": "Une loi s’impose à tous les acteurs concernés, pas à une seule personne.", "trous": ["tous", "personne"]}}}, {"type": "analyse", "id": "bb1_analyse6", "data": {"titre": "TRIER ET LIMITER LES EMBALLAGES"}}, {"type": "document", "id": "bb1_doc9", "data": {"label": "DOC. 9", "titre": "Idées reçues sur le tri des emballages", "cadre": true, "corps": "« “Tous les emballages ne se trient pas.”\nFaux. Aujourd’hui, tous les emballages, y compris en plastique, se jettent dans le bac de tri - la poubelle jaune - partout en France. […]\n“Il est inutile de trier les emballages en plastique car ils ne sont pas recyclés.”\nFaux. […] A noter : la législation prévoit que tous les emballages soient recyclables d’ici 2030. […]\nTrier et recycler ses emballages en plastique oui, mais le mieux reste de limiter sa consommation de plastique lorsque c’est possible. En effet, moins de déchets = moins de pollution. […]\nPour rappel, tous les gobelets à usage unique contenant plus de 8% de plastique ont été progressivement interdits depuis 2020. »", "source": "Ministère de la Transition écologique, « 6 idées reçues sur le tri et le recyclage des emballages en plastique », 02/03/2026.", "date_consultation": "2026-10-26"}}, {"type": "question_chapeau", "id": "bb1_ch9", "data": {"numero": "2", "texte": "À partir du document 9 :", "reponse_attendue": ""}}, {"type": "sous_question", "id": "bb1_q91", "data": {"competence": "C2", "numero": "2.1", "texte": "**Indiquer** où jeter un pot de yaourt vide en plastique.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Dans le bac de tri, la poubelle jaune.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase.\nTous les emballages, y compris en plastique, se jettent dans le bac de tri : la poubelle ……………………… .", "lignes": 0, "reponse_allegee": "la poubelle {{jaune}}", "reponse_attendue": "jaune"}, "essentiel": {"texte": "**Compléter** la phrase.\nMots proposés : jaune – grise.\nUn pot de yaourt vide se jette dans la poubelle ……………………… .", "lignes": 0, "reponse_attendue": "jaune"}}}, "el": {"standard": {"indice": "DOC. 9 : la réponse à la première idée reçue, « Tous les emballages ne se trient pas ».", "explication": "Un pot de yaourt vide en plastique se jette dans le bac de tri, la poubelle jaune."}, "adapte": {"indice": "DOC. 9 : la réponse à la première idée reçue.", "explication": "Tous les emballages, y compris en plastique, se jettent dans la poubelle jaune.", "trous": ["jaune"]}, "essentiel": {"indice": "DOC. 9 : la couleur du bac de tri.", "explication": "Un pot de yaourt vide se jette dans la poubelle jaune. La poubelle grise reçoit les ordures ménagères.", "trous": ["jaune"]}}}, {"type": "sous_question", "id": "bb1_q92", "data": {"competence": "C2", "numero": "2.2", "texte": "**Relever** le geste qui réduit le mieux la pollution due aux emballages.", "points": "", "lignes": 1, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Limiter sa consommation de plastique lorsque c’est possible.", "indice": "", "reponse_allegee": "", "variantes": {"adapte": {"texte": "**Compléter** la phrase.\nLe mieux reste de ……………………… sa consommation de plastique.", "lignes": 0, "reponse_allegee": "{{limiter}} sa consommation", "reponse_attendue": "limiter"}, "essentiel": {"texte": "**Compléter** la phrase.\nMots proposés : limiter – augmenter.\nLe mieux reste de ……………………… sa consommation de plastique.", "lignes": 0, "reponse_attendue": "limiter"}}}, "el": {"standard": {"indice": "DOC. 9 : la phrase « Trier et recycler ses emballages en plastique oui, mais le mieux reste… ».", "explication": "Le geste le plus efficace : limiter sa consommation de plastique lorsque c’est possible. Moins de déchets, moins de pollution."}, "adapte": {"indice": "DOC. 9 : la phrase « … mais le mieux reste… ».", "explication": "Le mieux reste de limiter sa consommation de plastique.", "trous": ["limiter|réduire|reduire"]}, "essentiel": {"indice": "DOC. 9 : « moins de déchets = moins de pollution ».", "explication": "Le mieux reste de limiter sa consommation de plastique.", "trous": ["limiter|réduire|reduire"]}}}, {"t
