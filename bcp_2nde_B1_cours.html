rte distance.", "source": "D’après l’ADEME et la DGCCRF (16/06/2025).", "date_consultation": "2026-10-10", "image_w": 1500, "image_h": 1000, "image_pos": "centre", "image_align": "centre", "image_largeur": 80, "image_taille": "pleine", "image_nom": "Planche en trois bandes. Bande 1, « Vente directe » : une productrice vend ses légumes à un consommateur, une seule flèche. Bande 2, « Un intermédiaire » : productrice, commerçant, consommatrice, deux flèches. Ces deux bandes sont réunies par une accolade « Circuits courts ». Bande 3, « Plusieurs intermédiaires » : productrice, grossiste, usine, supermarché, consommateur, quatre flèches : « Circuit long ».", "img": "bcp_2nde_B1/images/bcp_2nde_B1_bb1_doc1.jpg", "img_desc": "Planche en trois bandes. Bande 1, « Vente directe » : une productrice vend ses légumes à un consommateur, une seule flèche. Bande 2, « Un intermédiaire » : productrice, commerçant, consommatrice, deux flèches. Ces deux bandes sont réunies par une accolade « Circuits courts ». Bande 3, « Plusieurs intermédiaires » : productrice, grossiste, usine, supermarché, consommateur, quatre flèches : « Circuit long ».", "img_w": 1400, "img_h": 933}}, {"id": "bb1_ch2", "type": "question_chapeau", "data": {"numero": "2", "texte": "À partir du document 1 :", "reponse_attendue": ""}}, {"id": "bb1_q21", "type": "classer", "data": {"competence": "C1", "numero": "2.1", "titre": "", "consigne": "**Classer** chaque vente.", "categories": ["Circuit court", "Circuit long"], "items": ["Des pommes vendues à la ferme", "Des légumes vendus par un épicier, livré par le maraîcher", "Des tomates passées par un grossiste, une usine et un supermarché", "Un panier vendu par la productrice sur le marché"], "classement": [0, 0, 1, 0], "indice": "", "variantes": {}}, "el": {"standard": {"indice": "DOC. 1 : le point 4 et la planche. Compter les intermédiaires entre le producteur et le consommateur.", "explication": "Circuit court : vente directe ou un seul intermédiaire. Les pommes vendues à la ferme et le panier vendu sur le marché sont des ventes directes ; l’épicier est un seul intermédiaire. Le grossiste, l’usine et le supermarché font plusieurs intermédiaires : circuit long."}, "essentiel": {"indice": "DOC. 1 : la planche. Compter les flèches entre le producteur et le consommateur.", "explication": "Aucun intermédiaire ou un seul : circuit court. C’est le cas de la ferme, du marché et de l’épicier. Grossiste, usine et supermarché : circuit long."}}}, {"id": "bb1_q22", "type": "sous_question", "data": {"competence": "C3", "numero": "2.2", "texte": "**Expliquer** l’intérêt des légumes de saison pour le climat.", "points": "", "lignes": 2, "style_lignes": "tiret_guide", "support_type": "", "reponse_attendue": "Ils poussent sans serre chauffée : leur impact sur le climat est plus faible.", "indice": "", "reponse_allegee": "", "niveaux": ["standard", "adapte"], "variantes": {"adapte": {"texte": "**Expliquer** l’intérêt des légumes de saison pour le climat.\nIls poussent sans serre …………… : leur impact sur le …………… est plus faible.", "reponse_attendue": "chauffée ; climat", "lignes": 0}}}, "el": {"standard": {"indice": "DOC. 1 : le point 3, sur la saisonnalité.", "explication": "Un légume de saison pousse sans serre chauffée : son impact sur le climat est plus faible. Hors saison, une tomate a un impact environ sept fois plus élevé."}, "adapte": {"indice": "DOC. 1 : le point 3, la phrase « un légume de saison pousse… ».", "explication": "Les légumes de saison poussent sans serre chauffée : leur impact sur le climat est plus faible.", "trous": ["chauffée|chauffee|chauffées|chauffees", "climat"]}}}, {"id": "bb1_q22_ess", "type": "sous_question", "data": {"competence": "C3", "numero": "2.2", "texte": "**Expliquer** l’intérêt des légumes de saison pour le climat.\nMots proposés : chauffée – climat – prix.\nIls poussent sans serre …………… : leur impact sur le …………… est plus faible.", "points": "", "lignes": 0, "style_lignes": "tiret_guide", "support_type":
