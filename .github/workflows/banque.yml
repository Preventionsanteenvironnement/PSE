name: Banque d'exercices
on:
  pull_request:
    paths: ['banque/**', 'outils/banque_construire.py']
  push:
    branches: [main]
    paths: ['banque/**', 'outils/banque_construire.py']
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les fichiers et la liste des exercices
        run: python3 outils/banque_construire.py --verifier
