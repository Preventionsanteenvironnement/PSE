<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f4f7fc;color:#1e293b;line-height:1.6;padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.back{display:inline-block;color:#1d4ed8;text-decoration:none;font-weight:800;font-size:1rem;margin-bottom:10px}
.back:hover{text-decoration:underline}
.prog{position:sticky;top:0;z-index:5;background:#f4f7fc;padding:6px 0 10px}
.prog .label{font-size:.78rem;font-weight:800;color:#1e40af;margin-bottom:4px;text-align:center}
.prog .track{height:10px;background:#dbeafe;border-radius:20px;overflow:hidden}
.prog .track > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1d4ed8,#3b82f6);border-radius:20px;transition:width .4s ease}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 3px 14px rgba(0,0,0,.06);animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hero{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border-radius:20px;padding:26px 20px;text-align:center;margin-bottom:6px}
.hero .ic{font-size:3rem;display:block;margin-bottom:6px}
.hero h1{font-size:1.5rem;font-weight:900}
.hero p{opacity:.95;font-size:.96rem;margin-top:6px}
.txt{font-size:1.12rem;font-weight:600;line-height:1.5;margin:6px 0 12px}
.teach{background:#eff6ff;border-left:6px solid #1d4ed8;border-radius:0 12px 12px 0;padding:12px 14px;font-size:1.04rem;margin-bottom:12px}
.q{font-size:1.12rem;font-weight:800;color:#1e40af;margin:6px 0 12px}
.opts{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:14px;border:2px solid #bfdbfe;background:#fff;cursor:pointer;font-family:inherit;font-size:1.05rem;font-weight:700;color:#1e293b;transition:.15s}
.opt.center{text-align:center}
.opt:hover:not(:disabled){border-color:#1d4ed8;background:#eff6ff}
.opt:disabled{cursor:default}
.opt.ok{border-color:#22c55e;background:#dcfce7;color:#166534}
.opt.no{border-color:#fca5a5;background:#fee2e2;color:#991b1b}
.reveal{border:2px solid #bfdbfe;border-radius:14px;padding:14px;margin-bottom:10px;background:#fff}
.reveal .name{font-weight:900;color:#1e40af;margin-bottom:4px}
.reveal .out{font-size:1rem}
.reveal .in{margin-top:10px;background:#eff6ff;border-radius:10px;padding:10px 12px;font-size:1rem;display:none}
.reveal .in.show{display:block;animation:fade .3s}
.reveal .rev{margin-top:10px;background:#1d4ed8;color:#fff;border:none;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;font-family:inherit}
.fb{margin-top:14px}
.msg{border-radius:14px;padding:13px 15px;font-weight:700;font-size:1rem;animation:fade .3s}
.msg.good{background:#dcfce7;border:2px solid #86efac;color:#166534}
.msg.bad{background:#fff7ed;border:2px solid #fed7aa;color:#9a3412}
.msg.win{background:#dbeafe;border:2px solid #93c5fd;color:#1e40af;font-size:1.05rem}
.btn{display:block;width:100%;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border:none;border-radius:14px;padding:15px;font-size:1.1rem;font-weight:800;cursor:pointer;font-family:inherit;margin-top:12px;text-align:center;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.soft{background:#e0e7ff;color:#3730a3}
.say{float:right;background:#eff6ff;color:#1d4ed8;border:none;border-radius:10px;padding:6px 11px;font-size:.95rem;font-weight:800;cursor:pointer}
.recap{list-style:none;margin:10px 0 0}
.recap li{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 13px;margin-bottom:8px;font-size:.98rem}
.badge{text-align:center;font-size:1.1rem;font-weight:900;color:#1e40af;margin:10px 0}
@media(max-width:600px){.wrap{padding:10px}.card{padding:16px}.txt{font-size:1.05rem}.hero h1{font-size:1.3rem}}
.jimg{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:14px;margin:6px 0 10px;background:#fff}
.jimgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>

    <div id="moi-perso">
      <div data-cps-moi="sequence" data-code="C1.1" data-titre="Mes différentes facettes" data-fam="Penser et agir"><script type="application/json">{"tag": "Et moi ?", "title": "Ce qu’on ne voit pas de moi", "steps": [{"kind": "texte", "q": "Une qualité que les autres ne voient pas toujours chez moi :", "carnet": "Ce qu’on ne voit pas toujours chez moi", "aide": "Exemple : je suis patient quand j’apprends quelque chose de nouveau.", "etiquettes": ["je suis patient", "je suis curieux", "j’ai des idées", "je fais attention aux autres", "je persévère"]}, {"kind": "choix", "q": "Un avis dur que je me dis parfois :", "carnet": "Un avis dur sur moi", "autre": true, "opts": ["Je suis nul", "Je suis trop lent", "Je rate tout", "Personne ne m’écoute"]}, {"kind": "phrase", "q": "Je le dis plus justement :", "carnet": "Je le dis plus justement", "parts": [{"t": "Je n’ai pas réussi"}, {"label": "Quoi", "opts": ["cet exercice", "ce travail", "cette démarche"]}, {"t": "."}, {"label": "Ma suite", "opts": ["Je recommence", "Je demande de l’aide", "Je regarde mon erreur"]}, {"t": "."}], "criteres": ["Ma phrase décrit un fait", "Elle ne contient pas d’insulte envers moi"]}], "fin": "Un avis dur peut se dire autrement : un fait, puis une suite possible."}</script></div>
    </div>

      <div data-cps-moi="defi" data-code="C1.1" data-titre="Mes différentes facettes" data-fam="Penser et agir"><script type="application/json">{"q": "Choisis une seule chose à essayer cette semaine.", "opts": ["Le soir, noter une chose que j’ai bien faite", "Remplacer un avis dur sur moi par un fait", "Dire à quelqu’un une chose que j’aime faire"]}</script></div>
      <div data-cps-moi="duo"><script type="application/json">{"duree": "10 minutes", "situation": "Après un travail de groupe en classe. Chacun a observé l’autre pendant le travail.", "roleA": "Dis une qualité que tu as vue chez B. Donne un exemple précis : « Quand tu…, j’ai vu que… ».", "roleB": "Écoute jusqu’au bout. Puis dis si tu reconnais cette qualité chez toi.", "observe": ["A nomme une qualité précise", "A donne un exemple vu pendant le travail", "B écoute sans couper ni refuser le compliment"]}</script></div>
    </div>
  </div>
</div>

<script>
(function(){
  var scene=document.getElementById('scene');
  var idx=0;
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function speak(t){ try{ if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,'')); u.lang='fr-FR'; u.rate=0.95; speechSynthesis.speak(u);}catch(e){} }
  function go(i){ idx=i; try{speechSynthesis.cancel();}catch(e){} render(); }
  function progress(){
    document.getElementById('progbar').style.width=Math.round(idx/(STEPS.length-1)*100)+'%';
    document.getElementById('proglabel').textContent='Étape '+(idx+1)+' / '+STEPS.length;
  }
  function continueBtn(label){ var b=document.createElement('button'); b.className='btn'; b.textContent=label||'Continuer →'; b.onclick=function(){ go(idx+1); }; return b; }

  var STEPS=[
    { type:'intro',
      text:"On croit souvent connaître quelqu’un rien qu’en le regardant. Pourtant, chacun a des côtés qu’on ne voit pas. Et toi, sais-tu vraiment qui tu es ?" },

    { type:'reveal', title:"Vu de dehors, vécu de dedans",
      intro:"Voici trois élèves. Tu vois d’abord ce que les autres remarquent. Clique pour découvrir ce qu’ils vivent <strong>en dedans</strong>.",
      cards:[
        {name:"Noa", out:"En classe, Noa fait le clown et rit très fort.", in:"En dedans, il a peur de son oral de demain."},
        {name:"Julie", out:"Julie reste silencieuse, elle ne dit presque rien.", in:"En dedans, elle a plein d’idées, mais elle n’ose pas les dire."},
        {name:"Malik", out:"Malik répond sèchement, il a l’air en colère.", in:"En dedans, il est triste : son chien est malade."}
      ] },

    { type:'notion',
      teach:"Tu l’as vu : ce qu’une personne <strong>montre</strong> n’est pas toujours ce qu’elle <strong>ressent</strong>.",
      q:"Ce qu’on voit d’une personne, c’est…",
      options:[
        {l:"tout ce qu’elle est",ok:false},
        {l:"une partie de ce qu’elle vit",ok:true},
        {l:"forcément la vérité",ok:false}
      ],
      wrong:"Pas tout à fait. On ne voit que l’extérieur. Ce qu’une personne ressent reste caché.",
      good:"Oui. On ne voit qu’une partie : le reste se passe à l’intérieur." },

    { type:'cases',
      teach:"Tu as quatre facettes : <strong>ce qu’on voit de moi</strong>, <strong>l’image que j’ai de moi</strong>, <strong>ce que je vis en dedans</strong>, <strong>moi qui observe et décide</strong>.",
      q:"Quelle facette ?",
      items:[
        { text:"Lina met une chemise propre pour son entretien d’embauche.",
          options:[
            {l:"Ce qu’on voit de moi",good:true,fb:"Oui : sa tenue se voit de l’extérieur."},
            {l:"Ce que je vis en dedans",good:false,fb:"Non : une tenue, tout le monde la voit."},
            {l:"L’image que j’ai de moi",good:false,fb:"Non : ce n’est pas une idée sur elle, c’est visible."}
          ] },
        { text:"Malik se dit : « Je suis lent, moi. »",
          options:[
            {l:"Moi qui observe et décide",good:false,fb:"Non : il ne choisit rien ici, il se juge."},
            {l:"L’image que j’ai de moi",good:true,fb:"Oui : c’est une idée qu’il a sur lui."},
            {l:"Ce qu’on voit de moi",good:false,fb:"Non : personne n’entend cette phrase dans sa tête."}
          ] },
        { text:"Julie sent son cœur battre fort avant l’oral.",
          options:[
            {l:"Ce que je vis en dedans",good:true,fb:"Oui : une sensation intérieure que les autres ne voient pas."},
            {l:"Ce qu’on voit de moi",good:false,fb:"Non : son cœur qui bat, personne ne le voit."},
            {l:"L’image que j’ai de moi",good:false,fb:"Non : ce n’est pas une idée sur elle, c’est une sensation."}
          ] },
        { text:"Noa remarque qu’il s’énerve dans la file d’attente. Il pose son téléphone et souffle.",
          options:[
            {l:"Ce que je vis en dedans",good:false,fb:"Pas seulement : il remarque, puis il choisit d’agir."},
            {l:"Ce qu’on voit de moi",good:false,fb:"Le geste se voit, mais c’est lui qui l’a choisi."},
            {l:"Moi qui observe et décide",good:true,fb:"Oui : il observe ce qu’il ressent, puis il décide."}
          ] }
      ] },

    { type:'faitavis',
      teach:"Sur toi, il y a des <strong>faits</strong> et des <strong>avis</strong>. Un <strong>fait</strong> se vérifie : « j’ai 17 ans ». Un <strong>avis</strong> est un jugement : « je suis nul ». Un avis peut changer.",
      q:"Pour chaque phrase : un fait, ou un avis ?",
      items:[
        {l:"« J’ai les cheveux bruns. »",fait:true,ex:"On peut le voir : c’est un fait."},
        {l:"« Je suis nul en tout. »",fait:false,ex:"C’est un jugement très dur sur toi : un avis, pas un fait."},
        {l:"« J’ai raté mon contrôle de maths. »",fait:true,ex:"C’est un événement précis et vérifiable : un fait."},
        {l:"« Personne ne m’aime. »",fait:false,ex:"C’est une idée, pas une vérité. Et elle est souvent fausse."}
      ] },

    { type:'transform',
      teach:"Quand tu te dis un avis dur, tu peux le dire <strong>plus justement</strong> : décris la situation, sans t’insulter.",
      items:[
        { bad:"« Je suis nul pour les démarches. »",
          options:[
            {l:"« Je n’ai pas réussi à remplir ce dossier. Je recommence. »",good:true,fb:"Juste : tu décris la situation et tu ouvres une suite."},
            {l:"« Je suis vraiment trop bête. »",good:false,fb:"C’est encore une insulte envers toi."},
            {l:"« De toute façon, les autres sont meilleurs. »",good:false,fb:"Se comparer n’aide pas. Parle plutôt de toi."}
          ] },
        { bad:"« Tout le monde me déteste. »",
          options:[
            {l:"« Je finirai toujours seul. »",good:false,fb:"C’est un avis très dur sur l’avenir, pas un fait."},
            {l:"« Je me suis disputé avec Noa. Je peux lui reparler. »",good:true,fb:"Juste : un fait précis, et une action possible."},
            {l:"« Les gens sont tous méchants. »",good:false,fb:"C’est une généralisation, pas un fait."}
          ] }
      ] },

    { type:'choice',
      text:"Tu rates un exercice devant la classe. Une petite voix te dit « je suis nul ». Que te dis-tu ?",
      options:[
        {l:"« Bon, je me suis trompé. Je recommence. »",good:true,fb:"Tu décris ce qui s’est passé, sans t’insulter. Tu peux réessayer."},
        {l:"« Je suis vraiment nul, j’arrête. »",good:false,fb:"Cette idée te décourage. Et ce n’est qu’un avis."},
        {l:"« C’est la faute du professeur. »",good:false,fb:"Accuser quelqu’un ne t’aide pas à réussir l’exercice."}
      ] },

    { type:'perso',
      text:"À toi. Réponds pour toi, pas pour un personnage. Rien n’est noté." },

    { type:'bilan',
      recap:[
        "J’ai quatre facettes : ce qu’on voit de moi, mon image de moi, ce que je vis en dedans, moi qui décide.",
        "Ce qu’on voit d’une personne n’est qu’une <strong>partie</strong> d’elle.",
        "Ce que je pense de moi est un <strong>avis</strong>, pas un fait. Un avis peut <strong>changer</strong>."
      ] }
  ];
  function park(){ var p=document.getElementById('moi-park'); ['moi-perso','moi-fin'].forEach(function(id){ var n=document.getElementById(id); if(p && n && n.parentNode!==p) p.appendChild(n); }); }
  function render(){
    park(); var s=STEPS[idx]; progress();
    window.scrollTo({top:0,behavior:'smooth'});

    if(s.type==='intro'){
      scene.innerHTML='<div class="hero"><span class="ic"></span><h1>Vu de dehors, vécu de dedans</h1><p>Compétence C1.1</p></div><div class="card"><p class="txt">'+s.text+'</p></div>';
      var b=document.createElement('button'); b.className='btn'; b.textContent='Commencer'; b.onclick=function(){ go(idx+1); };
      scene.querySelector('.card').appendChild(b); return;
    }

    if(s.type==='reveal'){
      var h='<div class="card"><button class="say">Écouter</button><div class="q">'+s.title+'</div><p class="txt" style="font-weight:600;font-size:1rem">'+s.intro+'</p><div id="cards"></div></div>';
      scene.innerHTML=h;
      scene.querySelector('.say').onclick=function(){ speak(s.intro); };
      var cwrap=scene.querySelector('#cards');
      s.cards.forEach(function(c){
        var d=document.createElement('div'); d.className='reveal';
        d.innerHTML='<div class="name">'+c.name+'</div><div class="out">'+c.out+'</div><button class="rev">Regarder en dedans</button><div class="in">'+c.in+'</div>';
        d.querySelector('.rev').onclick=function(){ d.querySelector('.in').classList.add('show'); this.style.display='none'; };
        cwrap.appendChild(d);
      });
      scene.querySelector('.card').appendChild(continueBtn());
      return;
    }

    if(s.type==='notion'){
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div class="opts"></div><div class="fb"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach+' '+s.q); };
      var opts=scene.querySelector('.opts'), fb=scene.querySelector('.fb'), done=false;
      shuffle(s.options).forEach(function(o){
        var b=document.createElement('button'); b.className='opt'; b.textContent=o.l;
        b.onclick=function(){
          if(done)return;
          if(o.ok){ done=true; opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); b.classList.add('ok'); fb.innerHTML='<div class="msg good">✓ '+s.good+'</div>'; fb.appendChild(continueBtn()); }
          else { b.classList.add('no'); b.disabled=true; fb.innerHTML='<div class="msg bad">'+s.wrong+' <strong>Réessaie.</strong></div>'; }
        };
        opts.appendChild(b);
      });
      return;
    }

    if(s.type==='cases'){
      var j=0;
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div id="cc"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach); };
      var area=scene.querySelector('#cc');
      function drawCase(){
        var it=s.items[j];
        area.innerHTML=(it.img?'<img class="jimg" src="'+it.img+'" alt="'+(it.alt||'')+'">':'')+'<p class="txt">'+it.text+'</p><div class="opts"></div><div class="fb"></div>';
        var opts=area.querySelector('.opts'), fb=area.querySelector('.fb'), done=false;
        shuffle(it.options).forEach(function(o){
          var b=document.createElement('button'); b.className='opt'; b.textContent=o.l;
          b.onclick=function(){
            if(done)return;
            if(o.good){ done=true; opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); b.classList.add('ok'); fb.innerHTML='<div class="msg good">✓ '+o.fb+'</div>'; var nb=document.createElement('button'); nb.className='btn'; nb.textContent=(j>=s.items.length-1)?'Continuer →':'Suivant →'; nb.onclick=function(){ if(j>=s.items.length-1){ go(idx+1);} else {j++; drawCase();} }; fb.appendChild(nb); }
            else { b.classList.add('no'); b.disabled=true; fb.innerHTML='<div class="msg bad">'+o.fb+' <strong>Réessaie.</strong></div>'; }
          };
          opts.appendChild(b);
        });
      }
      drawCase();
      return;
    }

    if(s.type==='faitavis'){
      var i2=0;
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div class="q">'+s.q+'</div><div id="fa"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach); };
      var area=scene.querySelector('#fa');
      function drawItem(){
        var it=s.items[i2];
        area.innerHTML='<p class="txt" style="text-align:center">'+it.l+'</p><div class="two"><button class="opt center" data-v="1">Un fait</button><button class="opt center" data-v="0">Un avis</button></div><div class="fb"></div>';
        var fb=area.querySelector('.fb'), answered=false;
        area.querySelectorAll('.opt').forEach(function(b){
          b.onclick=function(){
            if(answered)return; answered=true;
            var said=b.getAttribute('data-v')==='1';
            var ok=(said===it.fait);
            area.querySelectorAll('.opt').forEach(function(x){x.disabled=true;});
            b.classList.add(ok?'ok':'no');
            fb.innerHTML='<div class="msg '+(ok?'good':'bad')+'">'+(ok?'✓ ':'')+it.ex+'</div>';
            var nb=document.createElement('button'); nb.className='btn'; nb.textContent=(i2>=s.items.length-1)?'Continuer →':'Phrase suivante →';
            nb.onclick=function(){ if(i2>=s.items.length-1){ go(idx+1); } else { i2++; drawItem(); } };
            fb.appendChild(nb);
          };
        });
      }
      drawItem();
      return;
    }

    if(s.type==='transform'){
      var j=0;
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><div class="teach">'+s.teach+'</div><div id="tr"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.teach); };
      var area=scene.querySelector('#tr');
      function drawT(){
        var it=s.items[j];
        var h='<div class="q">Dis-le plus justement :</div><p class="txt" style="text-align:center;color:#991b1b">'+it.bad+'</p><div class="opts"></div><div class="fb"></div>';
        area.innerHTML=h;
        var opts=area.querySelector('.opts'), fb=area.querySelector('.fb'), done=false;
        shuffle(it.options).forEach(function(o){
          var b=document.createElement('button'); b.className='opt'; b.textContent=o.l;
          b.onclick=function(){
            if(done)return;
            if(o.good){ done=true; opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); b.classList.add('ok'); fb.innerHTML='<div class="msg good">✓ '+o.fb+'</div>'; var nb=document.createElement('button'); nb.className='btn'; nb.textContent=(j>=s.items.length-1)?'Continuer →':'Phrase suivante →'; nb.onclick=function(){ if(j>=s.items.length-1){ go(idx+1);} else {j++; drawT();} }; fb.appendChild(nb); }
            else { b.classList.add('no'); b.disabled=true; fb.innerHTML='<div class="msg bad">'+o.fb+' <strong>Réessaie.</strong></div>'; }
          };
          opts.appendChild(b);
        });
      }
      drawT();
      return;
    }

    if(s.type==='choice'){
      scene.innerHTML='<div class="card"><button class="say">Écouter</button><p class="txt">'+s.text+'</p><div class="opts"></div><div class="fb"></div></div>';
      scene.querySelector('.say').onclick=function(){ speak(s.text); };
      var opts=scene.querySelector('.opts'), fb=scene.querySelector('.fb'), picked=false;
      shuffle(s.options).forEach(function(o){
        var b=document.createElement('button'); b.className='opt'; b.textContent=o.l;
        b.onclick=function(){
          if(picked)return; picked=true;
          opts.querySelectorAll('.opt').forEach(function(x){x.disabled=true;});
          b.classList.add(o.good?'ok':'no');
          fb.innerHTML='<div class="msg '+(o.good?'good':'bad')+'">'+(o.good?'✓ ':'')+o.fb+'</div>';
          fb.appendChild(continueBtn());
        };
        opts.appendChild(b);
      });
      return;
    }

    if(s.type==='perso'){
      scene.innerHTML='<div class="card"><p class="txt">'+s.text+'</p></div>';
      var pc=scene.querySelector('.card'), mp=document.getElementById('moi-perso'); if(mp) pc.appendChild(mp);
      pc.appendChild(continueBtn('Continuer →'));
      return;
    }

    if(s.type==='bilan'){
      var h='<div class="hero"><span class="ic"></span><h1>Bilan</h1><p>Tu as exploré qui tu es vraiment.</p></div><div class="card"><p class="txt" style="font-size:1rem;font-weight:800;color:#1e40af">Ce que tu as appris :</p><ul class="recap">';
      s.recap.forEach(function(r){ h+='<li>'+r+'</li>'; });
      h+='</ul></div>';
      scene.innerHTML=h;
      var c=scene.querySelector('.card');
      var mf=document.getElementById('moi-fin'); if(mf) c.appendChild(mf);
      var rb=document.createElement('button'); rb.className='btn'; rb.textContent='Recommencer'; rb.onclick=function(){ go(0); }; c.appendChild(rb);
      var hb=document.createElement('a'); hb.className='btn soft'; hb.href='index.html'; hb.textContent='← Retour à l’accueil'; c.appendChild(hb);
      return;
    }
  }
  render();
})();
</script>
</body>
</html>
